name: CARR pinned public model metadata
on:
  push:
    branches: [work/local-llm-public-metadata-a49c]
permissions:
  contents: read
jobs:
  public-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Read bounded publisher pointer and license bytes without model download
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import urllib.request
          revision = 'bc640142c66e1fdd12af0bd68f40445458f3869b'
          base = 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/raw/' + revision + '/'
          target = Path('public-llm-candidate-metadata')
          target.mkdir(exist_ok=False)
          records = {}
          for name in ('Qwen3-4B-Q4_K_M.gguf', 'LICENSE', 'README.md'):
              url = base + name
              request = urllib.request.Request(url, headers={'User-Agent': 'carr-public-metadata-review/1'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(32769)
              assert 0 < len(raw) <= 32768, 'Metadata exceeds its bounded allowance.'
              decoded = raw.decode('utf-8')
              if name.endswith('.gguf'):
                  lines = decoded.splitlines()
                  assert len(lines) == 3 and lines[:2] == [
                      'version https://git-lfs.github.com/spec/v1',
                      'oid sha256:7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5',
                  ], 'The immutable publisher pointer differs from independently reviewed identity.'
                  assert lines[2].startswith('size ') and lines[2][5:].isdigit()
                  model_size = int(lines[2][5:])
                  assert 0 < model_size <= 2600000000, 'Candidate exceeds the selected metadata admission bound.'
              elif name == 'LICENSE':
                  assert 'Apache License' in decoded and 'Version 2.0, January 2004' in decoded
                  assert 'Copyright 2025 Alibaba Cloud' in decoded
              destination = name + '.pointer.txt' if name.endswith('.gguf') else name
              (target / destination).write_bytes(raw)
              records[name] = {'url': url, 'size_bytes': len(raw), 'sha256': sha256(raw).hexdigest()}
          result = {'status': 'PASS', 'scope': 'public metadata bytes only',
              'model_bytes_downloaded': False, 'repository': 'Qwen/Qwen3-4B-GGUF',
              'revision': revision, 'model_size_bytes': model_size,
              'model_sha256': '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5',
              'records': records}
          (target / 'metadata-identities.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-llm-candidate-metadata-${{ github.sha }}
          path: public-llm-candidate-metadata/
          if-no-files-found: warn
          retention-days: 7
