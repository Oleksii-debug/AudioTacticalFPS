name: CARR canonical convergence review

on:
  push:
    branches: [carr/canonical-convergence-76e-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-convergence-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-convergence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  export-boundaries:
    name: Export and native corrections / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install this exact application and declared test dependencies
        run: python -m pip install '.[test]'
      - name: Install the actual native desktop on Windows
        if: runner.os == 'Windows'
        run: python -m pip install '.[desktop]'
      - name: Verify actual export publication and native correction regressions
        run: >-
          python -B -m pytest -q -ra
          tests/reader/test_export_no_clobber.py
          tests/reader/test_export_publication_boundary.py
          tests/reader/test_export_change_time.py
          tests/ui/test_export_destination.py
          tests/ui/test_export_confirmation.py
          tests/packaging/test_ci_check.py
          tests/e2e/test_import_batches.py
          tests/ui/test_reader_dialog_lifetime.py
          --junitxml=ci-convergence/export-tests.xml
      - name: Require nonempty passing evidence with no skipped cases
        run: >-
          python -c "import json,subprocess,xml.etree.ElementTree as E; cases=list(E.parse('ci-convergence/export-tests.xml').iter('testcase')); failed=sum(any(c.find(t) is not None for t in ('failure','error')) for c in cases); skipped=sum(c.find('skipped') is not None for c in cases); assert cases and failed==skipped==0; print(json.dumps(dict(status='PASS',commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),passed=len(cases),failed=failed,skipped=skipped,nvda='NOT_RUN')))"
      - name: Exercise the installed full-source reader and bookmarks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -I -B -X utf8 tests/ui/native_reading_desk_smoke.py 2>&1 | Tee-Object 'ci-convergence/native-reading-desk.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact commit and dependency identity
        if: always()
        run: |
          python -c "from pathlib import Path; Path('ci-convergence').mkdir(exist_ok=True)"
          git rev-parse HEAD > ci-convergence/tested-commit.txt
          python -m pip freeze > ci-convergence/installed-dependencies.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: export-convergence-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-convergence/
          retention-days: 7
          if-no-files-found: error
