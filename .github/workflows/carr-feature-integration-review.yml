name: Canonical feature integration review

on:
  push:
    branches: [carr/canonical-feature-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-feature-integration-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-review-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    name: Canonical feature integration / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: source-runtime
        run: python -m pip install ".[test,sync]"
      - name: Install actual Windows desktop
        id: desktop-runtime
        if: runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Prepare actual Linux test audio runtime
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-feature-review
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version > ci-feature-review/ffmpeg-version.txt
          ffprobe -version > ci-feature-review/ffprobe-version.txt
      - name: Prepare pinned Windows test audio runtime
        id: audio-runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'ci-feature-review' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-feature-review-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-feature-review/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_FEATURE_REVIEW_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require the exact integrated source and current producer regressions
        run: |
          mkdir -p ci-feature-review
          python scripts/ci_check.py --diagnostics --jobs 3 \
            tests/assistant/test_workflow_templates.py \
            tests/assistant/test_workflow_templates_cli.py \
            tests/ui/test_workflow_templates.py \
            tests/storage/test_workflow_templates_backup.py \
            tests/ui/test_native_menu_contract.py \
            tests/assistant/test_local_assistant.py \
            tests/assistant/test_planning_handlers.py \
            tests/conversion/test_document_batches.py \
            tests/ui/test_document_batch_handlers.py \
            tests/storage/test_v3_state_backup.py \
            tests/ui/test_desktop_handlers.py \
            tests/assistant/test_translation_batch.py \
            tests/assistant/test_translation_batch_sources.py \
            tests/assistant/test_translation_batch_ui.py \
            tests/assistant/test_translation_batch_cli.py \
            tests/storage/test_translation_batches_backup.py \
            tests/assistant/test_translation.py \
            tests/assistant/test_translation_v3.py \
            tests/storage/test_backup_translation.py \
            tests/transcription/test_runtime_admission.py \
            tests/transcription/test_convergence.py \
            tests/audio/test_supplied_transcription.py \
            tests/audio/test_supplied_runtime_manifest.py \
            tests/operations/test_facade.py \
            tests/transcription/test_service.py \
            tests/transcription/test_restore.py \
            tests/storage/test_transcription_backup_convergence.py \
            tests/ui/test_translation_lifetime.py \
            tests/storage/test_current_producer_backup.py \
            tests/audio/test_metadata_stream_hash.py \
            tests/audio/test_metadata.py \
            tests/audio/test_metadata_publication.py \
            tests/ui/test_audio_metadata_dialog.py \
            tests/ui/test_audio_metadata_lifetime.py \
            tests/audio/test_recording.py \
            tests/audio/test_recording_controls.py \
            tests/audio/test_recording_monitor.py \
            tests/ui/test_recording_dialog.py \
            tests/conversion/test_conversion.py \
            tests/conversion/test_conversion_publication.py \
            tests/conversion/test_office_selection.py \
            tests/conversion/test_archive_reading.py \
            tests/ui/test_audio_conversion_controls.py \
            tests/packaging/test_portable_entry.py \
            tests/security/test_portable_handoff.py \
            tests/security/test_https_updates.py \
            tests/security/test_https_source_policy.py \
            tests/security/test_standard_update_handoff.py \
            tests/security/test_update_maintenance.py \
            tests/security/test_installation.py \
            tests/security/test_updates.py 2>&1 | tee ci-feature-review/boundaries.txt
      - name: Require Windows acquisition and actual native lookup
        if: "!cancelled() && runner.os == 'Windows' && steps.source-runtime.outcome == 'success' && steps.desktop-runtime.outcome == 'success'"
        run: python scripts/ci_check.py --jobs 3 tests/ui/test_native_acquisition.py tests/transcription/test_protocol_fixture_windows.py tests/e2e/test_export_destination.py tests/audio/test_recording_process_windows.py 2>&1 | tee ci-feature-review/native-acquisition-boundaries.txt
      - name: Require real POSIX snapshot race refusal
        if: "!cancelled() && runner.os == 'Linux' && steps.source-runtime.outcome == 'success'"
        run: python scripts/ci_check.py --jobs 3 tests/storage/test_json_snapshot_posix.py tests/operations/test_resources_posix.py tests/conversion/test_document_batches_posix.py tests/transcription/test_runtime_inventory_posix.py 2>&1 | tee ci-feature-review/posix-snapshots.txt
      - name: Require installed native feature workflows with egress blocked
        if: "!cancelled() && runner.os == 'Windows' && steps.source-runtime.outcome == 'success' && steps.desktop-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success'"
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_FEATURE_REVIEW_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_FEATURE_REVIEW_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_FEATURE_REVIEW_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-feature-review/external-test-audio-binding.json'
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_FEATURE_REVIEW_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_FEATURE_REVIEW_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-feature-review-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-feature-review/runtime-firewall.json'
            $probes = @(
              @{ name='native-trust-status'; script='tests/ui/native_trust_status_smoke.py'; arguments=@('--native') },
              @{ name='native-workflow-templates'; script='scripts/windows_workflow_templates_smoke.py'; arguments=@() },
              @{ name='native-translation-batch'; script='scripts/windows_translation_batch_smoke.py'; arguments=@() },
              @{ name='native-recording'; script='scripts/windows_recording_smoke.py'; arguments=@('--audio-evidence', 'ci-feature-review/external-test-audio-binding.json') }
            )
            $failures = @()
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 $scriptPath @probeArgs 2>&1 | Tee-Object ('ci-feature-review/' + $probe.name + '.txt')
              if ($LASTEXITCODE -ne 0) { $failures += $probe.name }
            }
            if ($failures.Count -ne 0) { throw ('Required native workflows failed: ' + ($failures -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve source and dependency identity
        if: always()
        run: |
          mkdir -p ci-feature-review
          git rev-parse HEAD > ci-feature-review/commit.txt
          python -m pip freeze > ci-feature-review/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: feature-review-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-feature-review
          if-no-files-found: error
