          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.sources()
          for name in ('INSTALLED_CHILD', 'ORIGIN_CHILD'):
              compile(getattr(module, name), '<voice-management-'+name+'>', 'exec')
          assert len(module.SUITES) == 21 and sum(module.SUITES.values()) == 495
          assert len(module.PINS) == 67 and module.OWNER_CONTRACT['required_check_count'] == 25
          assert len(module.OWNER_CONTRACT['origin_modules']) == 18
          assert set(module.OWNER_CONTRACT['origin_modules']) <= set(module.MODULES)
          assert len(module.MODULES) == len(set(module.MODULES)) == (38 if os.name == 'nt' else 35)
          print('Exact voice management source and embedded Python compile checks passed.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'voice management source/policy preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-voice-acceptance' -ErrorAction Stop | Out-Null
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned voice management dependencies failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'voice management dependency closure is inconsistent.' }
          $audio = Join-Path $env:RUNNER_TEMP ('carr-voice-audio-' + [guid]::NewGuid().ToString('N'))
          $audioCache = Join-Path $env:RUNNER_TEMP ('carr-voice-audio-cache-' + [guid]::NewGuid().ToString('N'))
          & python -I -B packaging/prepare_windows_audio.py --cache $audioCache --output $audio --download 2>&1 | Tee-Object 'ci-voice-acceptance/audio-preparation.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Exact locked audio acquisition failed.' }
          Copy-Item -LiteralPath (Join-Path $audio 'runtime-manifest.json') -Destination 'ci-voice-acceptance/audio-manifest.json' -ErrorAction Stop
          "CARR_VOICE_AUDIO_DIR=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $ownerApi = Join-Path $env:RUNNER_TEMP ('carr-voice-owner-api-' + [guid]::NewGuid().ToString('N'))
          $acquireOwner = @'
          import importlib.util,json,pathlib,sys
          source=pathlib.Path('scripts/ci_owner_voice_api_smoke.py').resolve(strict=True)
          spec=importlib.util.spec_from_file_location('exact_owner_api_acquisition',source)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          _,receipts=module.acquire(pathlib.Path(sys.argv[1]))
          proof={'schema':'carr-owner-api-acquisition/1','owner_revision':module.REVISION,
                 'files':receipts,'payload_retained_publicly':False}
          pathlib.Path('ci-voice-acceptance/owner-api-acquisition.json').write_text(
              json.dumps(proof,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          '@
          $acquireOwner | & python -I -B -X utf8 - $ownerApi
          if ($LASTEXITCODE -ne 0) { throw 'Exact owner metadata closure acquisition failed.' }
          "CARR_VOICE_OWNER_API_DIR=$ownerApi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require495 source,495 isolated installed, real owner facade and native83 controls
        # Reserve 35 minutes for acquisition, setup and retained cleanup evidence.
        # Individual whole-suite and owner-operation deadlines remain unchanged.
        timeout-minutes: 325
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = (Get-Command python -ErrorAction Stop).Source
          $pythonPrograms = @(& $python -I -B -c "import pathlib,sys; p=pathlib.Path(sys.executable).resolve(); b=pathlib.Path(getattr(sys,'_base_executable',sys.executable)).resolve(); print(p); print(b); print(p.with_name('pythonw.exe')); print(b.with_name('pythonw.exe'))")
          if ($LASTEXITCODE -ne 0) { throw 'Exact interpreter inventory failed.' }
          $programs = @(@($pythonPrograms) + @((Join-Path $env:CARR_VOICE_AUDIO_DIR 'bin/ffmpeg.exe'), (Join-Path $env:CARR_VOICE_AUDIO_DIR 'bin/ffprobe.exe')) | ForEach-Object { [IO.Path]::GetFullPath($_) } | Sort-Object -Unique)
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw ('Required offline executable is missing: ' + $program) }
            if (((Get-Item -LiteralPath $program -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw ('Offline executable is a reparse point: ' + $program) }
          }
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          if ($profilesBefore.Count -ne 3) { throw 'All three firewall profile states must be captured.' }
          $rules = [System.Collections.Generic.List[string]]::new()
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            $active = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
            if ($active.Count -ne 3 -or @($active | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Every firewall profile must be active before actual voice management work.' }
            foreach ($program in $programs) {
              $name = 'CARR-Reading-acceptance-' + [guid]::NewGuid().ToString('N')
              $rules.Add($name)
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
              $rule = Get-NetFirewallRule -Name $name -ErrorAction Stop
              $filter = @($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop)
              if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or $filter.Count -ne 1 -or [IO.Path]::GetFullPath($filter[0].Program) -ne [IO.Path]::GetFullPath($program)) { throw 'Exact-program outbound rule was not admitted.' }
            }
            @{ status='ACTIVE'; programs=$programs; rules=$rules.ToArray(); profiles=$active; direction='Outbound'; action='Block'; qualification='All acquisition finished before these rules' } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-voice-acceptance/firewall.json'
            & $python -I -B scripts/ci_voice_management_contracts.py --evidence ci-voice-acceptance/contracts --expected-head $env:EXPECTED_SOURCE_SHA --audio-directory $env:CARR_VOICE_AUDIO_DIR --owner-api-directory $env:CARR_VOICE_OWNER_API_DIR
            if ($LASTEXITCODE -ne 0) { throw 'Required voice management source, installed or native acceptance failed.' }
          } finally {
            $cleanupFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $rules) {
              try { Remove-NetFirewallRule -Name $name -ErrorAction Stop } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            foreach ($profile in $profilesBefore) {
              try {
                Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop
                $restored = Get-NetFirewallProfile -Name $profile.Name -ErrorAction Stop
                if ($restored.Enabled -ne $profile.Enabled) { throw ('Profile state was not restored: ' + $profile.Name) }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            @{ status=$(if ($cleanupFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); original_profiles=$profilesBefore; removed_rules=$rules.ToArray(); errors=$cleanupFailures.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-voice-acceptance/firewall-cleanup.json'
            if ($cleanupFailures.Count -ne 0) { throw ('Owned voice management firewall cleanup failed: ' + ($cleanupFailures -join '; ')) }
          }
      - name: Admit only bounded diagnostic text and JSON evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat, xml.etree.ElementTree as ET
          root = pathlib.Path('ci-voice-acceptance')
          assert root.is_dir() and not root.is_symlink(), 'No actual voice management evidence exists.'
          allowed = {'audio-preparation.txt','audio-manifest.json','owner-api-acquisition.json','firewall.json','firewall-cleanup.json'}
          contract = set(["identity-before.json","source-contracts.txt","source-summary.json","wheel-build.txt","source-wheel-proof.json","wheel-install.txt","installed-pip-check.txt","native-origins-before.json","native-origins-before.txt","native-origins-after.json","native-origins-after.txt","native-voice-management.json","native-voice-management.txt","owner-source.json","owner-source.txt","owner-installed.json","owner-installed.txt","owner-summary.json","owner-origins-before.json","owner-origins-before.txt","owner-origins-after.json","owner-origins-after.txt","native-summary.json","contracts-summary.json"])
          contract.update(f'installed-{number}{suffix}' for number in range(1,22)
                          for suffix in ('.xml','-origins.json','.txt'))
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 64*1024*1024, 'Evidence exceeds the finite total bound.'
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
              elif path.suffix == '.xml':
                  ET.fromstring(raw)
          print('Closed, bounded text/JSON/XML voice management evidence only; binaries, corpora and runtimes excluded.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'voice management evidence inventory is invalid.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: voice-management-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-voice-acceptance/
          if-no-files-found: error
