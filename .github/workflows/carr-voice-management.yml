name: Current voice package and reference management contracts

on:
  push:
    branches: ['carr/ci-voice-management-*']
    paths: ['carr-library/**', '.github/workflows/carr-voice-management.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-management-linux:
    name: Voice495 source,495 installed and actual owner facade on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: carr-voice-management-linux-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        timeout-minutes: 5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify source and acquire the existing hashed tests and exact owner API
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact voice management source head differs.' }
          $verify = @'
          from hashlib import sha1
          import importlib.util, pathlib, sys, os
          pins = {"scripts/ci_voice_management_contracts.py":"5145b240d4f54977f969569116e2a6703371b715","packaging/prepare_windows_audio.py":"65b172ac432f28e865200aed2f8e610dda1ac7cf","packaging/windows-audio.lock.json":"2bc706ffc6208f5596a10abee61d3da33f20e6c6","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-sync-cp311.lock":"cd9c18a24d7a7ac203d81cf6a8d82d8bcb8f8ab3","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","scripts/ci_owner_voice_api_smoke.py":"e22c226ef24cf48957d04c32f25cb472e48c764e","scripts/ci_voice_management_owner_smoke.py":"14bc8f48cd5c5fc4ffeca5a37a973c7860f7efef","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959"}
          for name, expected in pins.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, name
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          path = pathlib.Path('scripts/ci_voice_management_contracts.py').resolve()
          spec = importlib.util.spec_from_file_location('voice_management_ci_preflight', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.sources()
          for name in ('INSTALLED_CHILD', 'ORIGIN_CHILD'):
              compile(getattr(module, name), '<voice-management-'+name+'>', 'exec')
          assert len(module.SUITES) == 21 and sum(module.SUITES.values()) == 495
          assert len(module.PINS) == 67 and module.OWNER_CONTRACT['required_check_count'] == 25
          assert len(module.OWNER_CONTRACT['origin_modules']) == 18
          assert set(module.OWNER_CONTRACT['origin_modules']) <= set(module.MODULES)
          assert len(module.MODULES) == len(set(module.MODULES)) == (38 if os.name == 'nt' else 35)
          print('Exact voice management source and embedded Python compile checks passed.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'voice management source/policy preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-voice-acceptance' -ErrorAction Stop | Out-Null
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/linux-sync-core-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned voice management dependencies failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'voice management dependency closure is inconsistent.' }
          & sudo apt-get update
          if ($LASTEXITCODE -ne 0) { throw 'System test-codec package index is unavailable.' }
          & sudo apt-get install --yes --no-install-recommends ffmpeg
          if ($LASTEXITCODE -ne 0) { throw 'Required actual FFmpeg test codec could not be installed.' }
          $audio = (& python -I -B -c "import pathlib,shutil; a=pathlib.Path(shutil.which('ffmpeg')).resolve(strict=True); b=pathlib.Path(shutil.which('ffprobe')).resolve(strict=True); assert a.parent==b.parent and a.parent.name=='bin'; print(a.parent.parent)").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Actual system codec selection is invalid.' }
          "CARR_VOICE_AUDIO_DIR=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ownerApi = Join-Path $env:RUNNER_TEMP ('carr-voice-owner-api-' + [guid]::NewGuid().ToString('N'))
          $acquireOwner = @'
          import importlib.util,json,pathlib,sys
          source=pathlib.Path('scripts/ci_owner_voice_api_smoke.py').resolve(strict=True)
          spec=importlib.util.spec_from_file_location('exact_owner_api_acquisition',source)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          _,receipts=module.acquire(pathlib.Path(sys.argv[1]))
          proof={'schema':'carr-owner-api-acquisition/1','owner_revision':module.REVISION,
                 'files':receipts,'payload_retained_publicly':False}
          pathlib.Path('ci-voice-acceptance/owner-api-acquisition.json').write_text(
              json.dumps(proof,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          '@
          $acquireOwner | & python -I -B -X utf8 - $ownerApi
          if ($LASTEXITCODE -ne 0) { throw 'Exact owner metadata closure acquisition failed.' }
          "CARR_VOICE_OWNER_API_DIR=$ownerApi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require495 source,495 isolated installed and both actual owner facade phases
        # Reserve 35 minutes for acquisition, setup and retained cleanup evidence.
        # Individual whole-suite and owner-operation deadlines remain unchanged.
        timeout-minutes: 325
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python -I -B -X utf8 scripts/ci_voice_management_contracts.py --evidence ci-voice-acceptance/contracts --expected-head $env:EXPECTED_SOURCE_SHA --audio-directory $env:CARR_VOICE_AUDIO_DIR --owner-api-directory $env:CARR_VOICE_OWNER_API_DIR
          if ($LASTEXITCODE -ne 0) { throw 'All source, isolated installed and actual owner facade obligations are required.' }
      - name: Admit only bounded diagnostic text and JSON evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat, xml.etree.ElementTree as ET
          root = pathlib.Path('ci-voice-acceptance')
          assert root.is_dir() and not root.is_symlink(), 'No actual voice management evidence exists.'
          allowed = {'audio-preparation.txt','audio-manifest.json','owner-api-acquisition.json','firewall.json','firewall-cleanup.json'}
          contract = set(["identity-before.json","source-contracts.txt","source-summary.json","wheel-build.txt","source-wheel-proof.json","wheel-install.txt","installed-pip-check.txt","native-origins-before.json","native-origins-before.txt","native-origins-after.json","native-origins-after.txt","native-voice-management.json","native-voice-management.txt","owner-source.json","owner-source.txt","owner-installed.json","owner-installed.txt","owner-summary.json","owner-origins-before.json","owner-origins-before.txt","owner-origins-after.json","owner-origins-after.txt","native-summary.json","contracts-summary.json"])
          contract.update(f'installed-{number}{suffix}' for number in range(1,22)
                          for suffix in ('.xml','-origins.json','.txt'))
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 64*1024*1024, 'Evidence exceeds the finite total bound.'
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
              elif path.suffix == '.xml':
                  ET.fromstring(raw)
          print('Closed, bounded text/JSON/XML voice management evidence only; binaries, corpora and runtimes excluded.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'voice management evidence inventory is invalid.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: voice-management-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-voice-acceptance/
          if-no-files-found: error

