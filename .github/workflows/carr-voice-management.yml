    name: Voice495 source,495 installed, actual owner facade and native83 controls
    runs-on: windows-2022
    timeout-minutes: 360
    concurrency:
      group: carr-voice-management-contracts-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
