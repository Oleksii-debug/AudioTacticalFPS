name: CARR native local audio

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-audio.yml
  push:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-audio.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-audio-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-audio:
    name: Windows x64 / installed SAPI5 / actual FFmpeg
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Prepare installed application and pinned test-only audio engine
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-audio-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_AUDIO_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-audio-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-audio-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --no-deps --require-hashes -r packaging/windows-audio-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpeg = (& $python -I -c "import hashlib,pathlib,imageio_ffmpeg; p=pathlib.Path(imageio_ffmpeg.__file__).parent/'binaries/ffmpeg-win-x86_64-v9.0.2.exe'; assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='3256173f3f8bffd7df12227c68adf68025edb1832273a9530688a7bb1ed8edec'; print(p)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ffmpeg -version | Set-Content 'ci-audio-results/ffmpeg-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -L | Set-Content 'ci-audio-results/ffmpeg-license.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify actual speech and scene rendering with runtime egress blocked
        run: |
          $python = $env:CARR_AUDIO_PYTHON
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $speechHost = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $programs = @($python, $basePython, $speechHost, $env:CARR_FFMPEG) | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-audio-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline audio checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline audio rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline audio rules do not cover the intended processes.' }
            @{ status='PASS'; blocked_programs=$filters; profiles=@($profiles.Name); scope='these runtime executables only, not a whole-machine network proof' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-audio-results/firewall.json'
            & $python scripts/ci_check.py tests/audio/test_voices.py tests/audio/test_studio.py 2>&1 | Tee-Object 'ci-audio-results/audio-tests.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Strict audio regression tests failed.' }
            & $python -I -B scripts/windows_voice_smoke.py 2>&1 | Tee-Object 'ci-audio-results/actual-sapi5.json'
            if ($LASTEXITCODE -ne 0) { throw 'Actual installed SAPI5 generation failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Preserve exact-commit evidence without generated recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-audio-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: carr-library/ci-audio-results/**
          if-no-files-found: error
          retention-days: 14
