name: CARR local audio studio

on:
  pull_request:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9]
    paths:
      - carr-library/**
      - .github/workflows/carr-audio.yml
  push:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths:
      - carr-library/**
      - .github/workflows/carr-audio.yml
  workflow_dispatch:

permissions:
  contents: read

# Keep distinct source acceptance runs alive while development continues.
# Duplicate push/PR runs of the same source still coalesce.
concurrency:
  group: carr-audio-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  windows-audio:
    name: Windows / actual SAPI / FFmpeg / native Studio
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      CARR_LONG_AUDIO_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned desktop and separately verified test audio runtime
        id: runtime
        run: |
          New-Item -ItemType Directory -Force audio-ci-results | Out-Null
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest==9.0.2 --only-binary=:all:
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioRoot = Join-Path $env:RUNNER_TEMP 'carr-pinned-audio'
          New-Item -ItemType Directory -Force $audioRoot | Out-Null
          $pin = python -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $audioRoot 'ffmpeg-pinned.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned FFmpeg archive mismatch.' }
          $audioBin = Join-Path $audioRoot 'audio-runtime'
          python packaging/prepare_ffmpeg_runtime.py --archive $archive --destination $audioBin --verify-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $audioBin 'ffmpeg.exe'
          "CARR_FFMPEG=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git rev-parse HEAD
          & $binary -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real offline SAPI output, native controls and OS credential vault
        run: |
          python -I scripts/windows_audio_smoke.py 2>&1 | Tee-Object audio-ci-results/native-audio.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native player controls or record the unavailable audio device
        run: |
          python -I tests/audio/native_playback_probe.py 2>&1 | Tee-Object audio-ci-results/native-playback.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the installed native effect parameter dialogs
        timeout-minutes: 3
        run: |
          python -I -B scripts/windows_audio_effects_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-effect-controls.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native capture, clip and audiobook controls
        timeout-minutes: 5
        run: |
          python -I -B scripts/windows_recording_smoke.py --ffmpeg $env:CARR_FFMPEG 2>&1 | Tee-Object audio-ci-results/native-recording.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_clip_editor_smoke.py 2>&1 | Tee-Object audio-ci-results/native-clip-editor.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_live_reading_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-live-reading.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_media_overlay_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-recorded-reading.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_playback_controls_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-playback-controls.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_media_conversion_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-media-conversion.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_reader_appearance_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-reader-appearance.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_speech_preparation_smoke.py --native --output audio-ci-results/native-speech-preparation.json 2>&1 | Tee-Object audio-ci-results/native-speech-preparation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_publication_smoke.py 2>&1 | Tee-Object audio-ci-results/native-audiobook-metadata.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require recording state and native-control contracts without skips
        timeout-minutes: 10
        run: |
          python scripts/ci_check.py --jobs 3 tests/audio/test_capture_ownership.py tests/audio/test_owned_audio_processes.py tests/audio/test_recording.py tests/storage/test_recording_backup.py tests/ui/test_recording_dialog.py tests/ui/test_operation_progress.py tests/ui/test_audio_clips.py tests/ui/test_audio_publication.py tests/ui/test_audio_native_probe_policy.py tests/audio/test_publication_fsync.py tests/audio/test_clips.py tests/audio/test_effect_editing.py tests/ui/test_audio_effect_editing.py tests/audio/test_master_effects.py tests/reader/test_live_speech.py tests/ui/test_live_reading.py tests/storage/test_live_reading_backup.py tests/storage/test_optional_backup_roots.py tests/reader/test_media_overlay.py tests/reader/test_publication_state.py tests/ui/test_media_overlay.py tests/reader/test_appearance.py tests/ui/test_reader_appearance.py tests/reader/test_pacing.py tests/ui/test_paced_reading.py tests/ui/test_paced_reader_hooks.py tests/audio/test_media_conversion.py tests/storage/test_media_conversion_backup.py tests/ui/test_media_conversion.py tests/audio/test_clip_input_ownership.py tests/audio/test_clip_consolidation.py tests/audio/test_playback_processing.py tests/audio/test_playback_configuration.py tests/ui/test_playback_controls.py tests/reader/test_live_playback_controls.py tests/reader/test_recorded_playback_controls.py tests/ui/test_reader_playback_controls.py tests/reader/test_speech_normalization.py tests/ui/test_speech_preparation.py tests/ui/test_speech_preparation_hooks.py tests/audio/test_recording_controls.py tests/audio/test_recording_monitor.py tests/audio/test_playback_devices.py tests/audio/test_book_plans.py tests/storage/test_book_audio_backup.py tests/ui/test_book_batch_dialog.py tests/conversion/test_calibre_selection.py tests/conversion/test_calibre_process_ownership.py tests/assistant/test_typed_local_tools.py tests/assistant/test_scheduling.py tests/assistant/test_scheduling_cli.py tests/assistant/test_scheduling_handlers.py tests/storage/test_scoped_locator_capacity.py tests/packaging/test_library_corpus_benchmark.py tests/audio/test_book_batch.py tests/assistant/test_translation_structure.py tests/ui/test_translation_structure.py tests/test_translation_cli.py tests/storage/test_translation_structure_backup.py tests/test_open_existing_library.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_template_handlers.py tests/assistant/test_transcription_tool.py tests/audio/test_book_cli.py tests/audio/test_managed_playback_queue.py tests/ui/test_managed_playback_queue.py tests/storage/test_legacy_playlist_backup.py tests/audio/test_legacy_playlist.py tests/ui/test_legacy_playlist_controls.py tests/storage/test_legacy_playlist_acceptance.py tests/ui/test_measured_book_dialog.py tests/ingest/test_large_source_profiles.py tests/storage/test_large_source_backup.py tests/e2e/test_large_import_cli.py tests/e2e/test_large_source_fixture.py tests/ui/test_large_source_import.py tests/ui/test_backup_capacity.py tests/audio/test_measured_book_audio.py tests/audio/test_publication_cleanup.py tests/audio/test_book_duration_cli.py 2>&1 | Tee-Object audio-ci-results/strict-recording-controls.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed book, structured translation and schedule windows
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $probeFailures = 0
          python -I -B scripts/windows_book_batch_smoke.py --native 2>&1 | Tee-Object audio-ci-results/native-book-batch.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_assistant_schedule_smoke.py --output audio-ci-results/native-schedule.json 2>&1 | Tee-Object audio-ci-results/native-schedule.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_managed_queue_smoke.py --native --output audio-ci-results/native-managed-queue.json 2>&1 | Tee-Object audio-ci-results/native-managed-queue.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_legacy_playlist_smoke.py --native --output audio-ci-results/native-legacy-queue.json 2>&1 | Tee-Object audio-ci-results/native-legacy-queue.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_assistant_templates_smoke.py --output audio-ci-results/native-templates.json 2>&1 | Tee-Object audio-ci-results/native-templates.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B tests/ui/probe_large_source_import_native.py --native 2>&1 | Tee-Object audio-ci-results/native-large-source.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_translation_smoke.py --output audio-ci-results/native-translation.json 2>&1 | Tee-Object audio-ci-results/native-translation.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          python -I -B scripts/windows_translation_smoke.py --local --output audio-ci-results/native-local-translation.json 2>&1 | Tee-Object audio-ci-results/native-local-translation.txt
          if ($LASTEXITCODE -ne 0) { $probeFailures += 1 }
          if ($probeFailures -ne 0) { throw "$probeFailures required installed native probes failed." }

      - name: Require actual numeric-loopback translation transport
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          python -I -B scripts/ci_check.py --installed --allow-loopback tests/loopback/test_translation_local_adapter.py 2>&1 | Tee-Object audio-ci-results/local-translation-http.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run provider safety, source integrity and audio recovery regressions
        run: |
          python scripts/ci_audio_check.py -vv -rs --durations=20 --tb=short -o faulthandler_timeout=90 --junitxml=audio-ci-results/audio-source.xml tests/assistant tests/audio tests/reader/test_narration_text.py tests/ui/test_audio_studio.py tests/ui/test_audio_playback_controls.py tests/ui/test_api_connections.py tests/e2e/test_provider_gateway.py tests/e2e/test_provider_transport_boundaries.py tests/e2e/test_provider_transport_contract.py tests/e2e/test_provider_ledger_lifetime.py tests/e2e/test_audio_cli.py --import-mode=importlib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the installed library still works
        run: |
          python -I -m carr_library --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve audio evidence without recordings or runtime payloads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-audio-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/audio-ci-results/
          if-no-files-found: warn
          retention-days: 7
