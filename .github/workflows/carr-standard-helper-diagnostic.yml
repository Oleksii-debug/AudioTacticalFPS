name: CARR standard helper bounded diagnosis
on:
  push:
    branches: ['carr/standard-helper-*']
    paths: ['carr-library/**', '.github/workflows/carr-standard-helper-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-standard-helper-${{ github.sha }}
  cancel-in-progress: false
jobs:
  observed-helper:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the existing native Python profile
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the existing pinned package and record identity
        timeout-minutes: 12
        run: |
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'carr-standard-helper-python'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          "CARR_HELPER_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: setuptools==84.2.1 wheel==0.48.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne '${{ github.sha }}') { throw 'Diagnostic source mismatch.' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_DIAGNOSTIC_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_DIAGNOSTIC_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python -m py_compile scripts/windows_standard_helper_diagnostic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe exact owned helper phases without changing installation state
        timeout-minutes: 5
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'carr-standard-helper-observed'
          & $env:CARR_HELPER_PYTHON -I -B -X utf8 scripts/windows_standard_helper_diagnostic.py --work $work --report ci-results/standard-helper-diagnostic.json | Tee-Object ci-results/standard-helper-diagnostic.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain diagnostic evidence on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-standard-helper-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-results/standard-helper-diagnostic.json
            carr-library/ci-results/standard-helper-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
