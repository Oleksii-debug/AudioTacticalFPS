name: Installed component notices and native About integration
on:
  push:
    branches: [carr/about-components-review-20261128]
    paths: ['carr-library/**', '.github/workflows/carr-about-components-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: about-components-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Actual component notice and async UI contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      CARR_ABOUT_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        run: python -m pip install ".[test,sync]"
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-about-components
          cat > ci-about-components/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import subprocess
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-about-components"
          suites = ["tests/packaging/test_component_notices.py","tests/ui/test_about_dialog.py"]

          names = ["carr_library.component_notices","carr_library.ui.about_dialog","carr_library.ui.desktop_app","carr_library.ui.command_registry","carr_library.ui.keyboard_settings","carr_library.native_checks","carr_library.native_runtime","carr_library.progress"]
          
          def checkout_head():
              value = subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=10).stdout.strip()
              assert value == os.environ["CARR_ABOUT_HEAD"], (value, os.environ["CARR_ABOUT_HEAD"])
              return value

          commit_before = checkout_head()
          helper_before = sha256(Path(__file__).read_bytes()).hexdigest()
          tests_before = {suite: sha256((root / suite).read_bytes()).hexdigest() for suite in suites}

          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (mode + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      print("CARR_ABOUT_COLLECTION_FAILURE " + str(report.longrepr)[:12000], flush=True)

              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "-s", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (mode + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-about-components-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              assert checkout_head() == commit_before, "The checked-out commit changed."
              assert sha256(Path(__file__).read_bytes()).hexdigest() == helper_before, "The executed proof helper changed."
              assert {suite: sha256((root / suite).read_bytes()).hexdigest() for suite in suites} == tests_before, "Executed test bytes changed."
              result = {"status": "PASS", "mode": mode, "cases": len(cases),
                        "qualification": "ACTUAL_COMPONENT_NOTICE_CONTRACTS_ONLY",
                        "large_corpus_acceptance": "NOT_RUN",
                        "commit": commit_before, "proof_helper_sha256": helper_before,
                        "test_files": tests_before,
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "physical_microphone": "NOT_RUN", "physical_output": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (mode + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require source notice and asynchronous UI cases
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-about-components/check.py source 2>&1 | tee ci-about-components/source.txt
      - name: Require isolated installed origins and the same notice cases
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-about-components/check.py installed 2>&1 | tee ci-about-components/installed.txt
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-about-components
          git rev-parse HEAD > ci-about-components/commit.txt
          git rev-parse HEAD^{tree} > ci-about-components/tree.txt
          python -m pip freeze > ci-about-components/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: about-components-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-about-components
          if-no-files-found: error

  native:
    name: Native About / installed ${{ matrix.profile }} / windows-2022
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [core, semantic]
    defaults:
      run:
        working-directory: carr-library
        shell: pwsh
    env:
      CARR_ABOUT_HEAD: ${{ github.sha }}
      CARR_ABOUT_PROFILE: ${{ matrix.profile }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the actual pinned profile and composed package
        run: |
          New-Item -ItemType Directory -Force ci-about-native | Out-Null
          $lock = if ($env:CARR_ABOUT_PROFILE -eq 'semantic') { 'packaging/windows-semantic-cp311.lock' } else { 'packaging/windows-cp311.lock' }
          python -m pip install --only-binary=:all: --require-hashes -r $lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind complete installed source, native probe, oracle and selected lock
        run: |
          @'
          from collections import Counter
          from hashlib import sha256
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig

          assert sys.flags.isolated and not os.environ.get("PYTHONPATH")
          ROOT = Path.cwd().resolve()
          OUT = ROOT / "ci-about-native"
          SOURCE = ROOT / "src" / "carr_library"
          INSTALLED = Path(sysconfig.get_path("purelib")).resolve() / "carr_library"
          assert SOURCE.resolve() != INSTALLED.resolve()
          assert os.environ["CARR_ABOUT_PROFILE"] in ("core", "semantic")
          LOCK = "packaging/windows-" + ("semantic-" if os.environ["CARR_ABOUT_PROFILE"] == "semantic" else "") + "cp311.lock"
          FILES = ("tests/ui/probe_about_native.py", "scripts/about_native_oracle.json", LOCK)
          NAMES = ("carr_library.component_notices", "carr_library.ui.about_dialog", "carr_library.ui.desktop_app")

          def inventory(root):
              assert root.is_dir() and not root.is_symlink()
              value = {}
              for path in sorted(root.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  value[path.relative_to(root).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert value and "__init__.py" in value
              return value

          def identity():
              head = subprocess.run(["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True, timeout=10).stdout.strip()
              assert head == os.environ["CARR_ABOUT_HEAD"]
              expected = inventory(SOURCE)
              assert inventory(INSTALLED) == expected
              origins = {}
              for name in NAMES:
                  spec = importlib.util.find_spec(name)
                  assert spec and spec.origin
                  path = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert path == (INSTALLED / relative).resolve()
                  digest = sha256(path.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()]
                  origins[name] = {"path": str(path), "sha256": digest}
              return {"head": head, "package": expected, "origins": origins,
                      "files": {path: sha256((ROOT / path).read_bytes()).hexdigest() for path in FILES},
                      "helper": sha256(Path(__file__).read_bytes()).hexdigest()}

          current = identity()
          if sys.argv[1] == "before":
              (OUT / "identity-before.json").write_text(json.dumps(current, sort_keys=True) + "\n", encoding="utf-8")
          elif sys.argv[1] == "after":
              before = json.loads((OUT / "identity-before.json").read_text(encoding="utf-8"))
              assert current == before, "Complete implementation/probe/oracle/lock identity changed."
              raw = (OUT / "native.txt").read_text(encoding="utf-8-sig")
              reports = [json.loads(line) for line in raw.splitlines() if line.lstrip().startswith("{")]
              assert reports, "No actual native report."
              report = reports[-1]
              oracle = json.loads((ROOT / "scripts/about_native_oracle.json").read_text(encoding="utf-8"))
              assert report["status"] == "PASS" and report["check_count"] == oracle["expected_check_count"] == 19
              assert Counter(report["checks"]) == Counter(oracle["checks"])
              assert all(report[name] is True for name in oracle["required_true"])
              assert all(report[name] == value for name, value in oracle["statuses"].items())
              assert report["module_origins"] == current["origins"]
              report.update(source_commit=current["head"], profile=os.environ["CARR_ABOUT_PROFILE"],
                            package_python_files=len(current["package"]),
                            package_inventory_sha256=sha256(json.dumps(current["package"], sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
                            proof_helper_sha256=current["helper"], selected_file_sha256=current["files"],
                            qualification="ACTUAL_NATIVE_ABOUT_COMPONENT_ONLY",
                            offline_firewall="NOT_ASSERTED_BY_THIS_COMPONENT; final full bundle gate remains required")
              (OUT / "identity-after.json").write_text(json.dumps(current, sort_keys=True) + "\n", encoding="utf-8")
              (OUT / "native-proof.json").write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
              print("CARR_ABOUT_NATIVE_PROOF " + json.dumps(report, sort_keys=True), flush=True)
          else:
              raise AssertionError("Unknown proof mode")
          '@ | Set-Content -Encoding utf8 ci-about-native/native_binding.py
          python -I -B -X utf8 ci-about-native/native_binding.py before
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the unchanged nineteen actual native keyboard checks
        timeout-minutes: 4
        run: |
          python -I -B -X utf8 tests/ui/probe_about_native.py --native 2>&1 | Tee-Object ci-about-native/native.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact native oracle and unchanged full source
        if: always()
        run: |
          python -I -B -X utf8 ci-about-native/native_binding.py after
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual dependency and commit identity
        if: always()
        run: |
          New-Item -ItemType Directory -Force ci-about-native | Out-Null
          git rev-parse HEAD | Set-Content ci-about-native/commit.txt
          git rev-parse 'HEAD^{tree}' | Set-Content ci-about-native/tree.txt
          python -m pip freeze | Set-Content ci-about-native/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: about-native-${{ matrix.profile }}-${{ github.sha }}
          path: carr-library/ci-about-native
          if-no-files-found: error
