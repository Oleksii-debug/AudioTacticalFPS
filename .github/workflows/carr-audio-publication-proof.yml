name: CARR current Studio publication reuse proof
on:
  push:
    branches: [work/audio-publication-reuse-882-a49c]
    paths:
      - carr-library/**
      - .github/workflows/carr-audio-publication-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-audio-publication-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install current source and synthetic-test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          python -m pip install '.[test]'
          python -m pip check
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg openjdk-17-jre-headless
          python -m pip install --only-binary=:all: 'lxml==6.1.3'
          python -m pip check
          ffmpeg -version
          ffprobe -version
      - name: Compile and exercise actual current producer and publication boundaries
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m compileall -q src/carr_library/audio src/carr_library/ui/audio_publication.py tests/audio/test_publication.py tests/ui/test_audio_publication.py
          python -m py_compile scripts/publication_acceptance_support.py scripts/prepare_publication_tools.py scripts/epubcheck_acceptance.py scripts/daisy_schema_acceptance.py scripts/windows_publication_smoke.py
          python scripts/ci_check.py --jobs 2 \
            tests/audio/test_publication.py \
            tests/ui/test_audio_publication.py \
            tests/packaging/test_prepare_publication_tools.py \
            tests/audio/test_production.py \
            tests/audio/test_project_backup.py \
            tests/ui/test_audio_studio.py
      - name: Acquire exact reviewed external validators
        run: |
          set -euo pipefail
          python -I -B scripts/prepare_publication_tools.py --output "$RUNNER_TEMP/carr-publication-tools" --download
          java -version
      - name: Validate actual installed EPUB publications and negative control
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -I -B scripts/epubcheck_acceptance.py \
            --archive "$RUNNER_TEMP/carr-publication-tools/epubcheck-5.3.0.zip" \
            --java "$(command -v java)" \
            --report "$RUNNER_TEMP/current-studio-epubcheck.json" --require-installed
      - name: Validate actual installed DAISY documents against pinned offline DTDs
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -I -B scripts/daisy_schema_acceptance.py \
            --schemas "$RUNNER_TEMP/carr-publication-tools/daisy-schemas" \
            --report "$RUNNER_TEMP/current-studio-daisy.json" --require-installed
