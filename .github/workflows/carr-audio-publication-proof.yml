name: CARR current Studio publication reuse proof
on:
  push:
    branches: [work/audio-publication-reuse-882-a49c]
    paths:
      - carr-library/**
      - .github/workflows/carr-audio-publication-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-audio-publication-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install current source and synthetic-test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          python -m pip install '.[test]'
          python -m pip check
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Compile and exercise actual current producer and publication boundaries
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m compileall -q src/carr_library/audio src/carr_library/ui/audio_publication.py tests/audio/test_publication.py tests/ui/test_audio_publication.py
          python scripts/ci_check.py --jobs 2 \
            tests/audio/test_publication.py \
            tests/ui/test_audio_publication.py \
            tests/audio/test_production.py \
            tests/audio/test_project_backup.py \
            tests/ui/test_audio_studio.py
