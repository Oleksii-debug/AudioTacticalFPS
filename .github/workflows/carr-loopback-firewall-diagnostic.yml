name: CARR Windows unchanged-firewall loopback diagnostic

on:
  push:
    branches: [carr/bc067-firewall-diagnostic-20261127]
    paths: [.github/workflows/carr-loopback-firewall-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unchanged-firewall-loopback:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Exercise owned Win32 loopback with all outbound block rules unchanged
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('carr-loopback-' + [guid]::NewGuid().ToString('N'))
          $environment = Join-Path $root '.venv'
          python -m venv --without-pip $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          $basePython = (& $python -I -B -c 'import sys; print(sys._base_executable)').Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython) | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          New-Item -ItemType Directory -Force 'ci-loopback-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-loopback-results/tested-commit.txt'
          git rev-parse 'HEAD^{tree}' | Set-Content 'ci-loopback-results/tested-tree.txt'
          $probe = @'
          import json, secrets, socket, subprocess, sys, time
          assert sys.platform == 'win32'
          nonce = secrets.token_hex(16).encode('ascii')
          server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          server.bind(('127.0.0.1', 0))
          server.listen(1)
          server.settimeout(8)
          port = server.getsockname()[1]
          child_code = "import socket,sys; s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(8); s.connect(('127.0.0.1',int(sys.argv[1]))); s.sendall(sys.argv[2].encode('ascii')); data=s.recv(64); assert data==sys.argv[2].encode('ascii'); s.close(); print('PASS: owned numeric loopback child')"
          child = subprocess.Popen([sys.executable, '-I', '-B', '-c', child_code, str(port), nonce.decode('ascii')], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          started = time.monotonic()
          try:
              stream, peer = server.accept()
              with stream:
                  stream.settimeout(8)
                  assert peer[0] == '127.0.0.1'
                  received = stream.recv(64)
                  assert received == nonce
                  stream.sendall(received)
              stdout, stderr = child.communicate(timeout=10)
              assert child.returncode == 0, (child.returncode, stderr.decode('utf-8', 'replace'))
              print(json.dumps(dict(status='PASS', python=sys.executable, base_python=sys._base_executable, owned_parent_and_child=True, numeric_loopback='127.0.0.1', actual_exchange=True, elapsed_seconds=time.monotonic()-started, child_reaped=True, external_network='NOT_ATTEMPTED', application_acceptance='NOT_CLAIMED')))
          finally:
              server.close()
              if child.poll() is None:
                  child.kill()
              child.communicate(timeout=10)
          '@
          $prefix = 'CARR-loopback-diagnostic-' + [guid]::NewGuid().ToString('N')
          $names = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          function Confirm-ExactBlocks {
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'A firewall profile is disabled.' }
            $rules = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $names -ErrorAction Stop)
            if ($rules.Count -ne $programs.Count) { throw 'Missing runtime firewall rule.' }
            $actualPrograms = @()
            foreach ($rule in $rules) {
              if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block') { throw 'Runtime block rule changed.' }
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              if ($addresses.Count -ne 1 -or $addresses[0] -ne 'Any') { throw 'Runtime address filter was narrowed.' }
              $actualPrograms += [System.IO.Path]::GetFullPath(($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop).Program)
            }
            if (@(Compare-Object ($programs | Sort-Object) ($actualPrograms | Sort-Object)).Count -ne 0) { throw 'Selected runtime program coverage changed.' }
          }
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $name = $prefix + '-' + $names.Count
              $names += $name
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -RemoteAddress Any -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            Confirm-ExactBlocks
            $probe | & $python -I -B - 2>&1 | Tee-Object 'ci-loopback-results/actual-loopback.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Owned loopback failed with the unchanged outbound block rules.' }
            Confirm-ExactBlocks
            @{ status='PASS'; programs=$programs; remote_addresses=@('Any'); unchanged_before_and_after=$true; rule_narrowing=$false; external_connection_attempts=0; scope='actual Win32 loopback and firewall readback only; not application acceptance' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-loopback-results/firewall-readback.json'
          } finally {
            foreach ($name in $names) { Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Retain bounded diagnostic text evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-loopback-firewall-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-loopback-results/
          retention-days: 7
