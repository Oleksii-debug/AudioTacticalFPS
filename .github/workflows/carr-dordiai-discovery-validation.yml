name: Dordiai discovery cancellation source proof

on:
  push:
    branches: [carr/dordiai-discovery-recovery-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dordiai-discovery-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  real-child-cancellation:
    name: Exact provider cancellation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Preserve exact committed source bytes on both operating systems
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared test dependencies for the exact public composition
        working-directory: carr-library
        run: python -B -m pip install ".[test]" pytest==9.0.2
      - name: Require the original negative and all four unchanged fixed suites
        run: python -B recovery/validate_dordiai_discovery.py
      - name: Preserve source identity, failures and actual child results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dordiai-discovery-${{ matrix.os }}-${{ github.sha }}
          path: ci-dordiai-results/
          if-no-files-found: error
          retention-days: 7
