name: Resonance remaining native diagnostics 2429

on:
  push:
    branches: ['carr/native-tail-411a-2429-20261127']
    paths: ['.github/workflows/carr-native-tail-411a.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-native-tail-411a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remaining-native:
    name: Frozen 2429 Windows native probes
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the frozen application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2429ba2a5918b3a32efb0688f9265233fd2de1bc
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: install
        timeout-minutes: 10
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '2429ba2a5918b3a32efb0688f9265233fd2de1bc') { throw 'The diagnostic checkout is not the frozen application commit.' }
          $actual | Set-Content 'ci-results/tested-commit.txt'
          $actualTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($actualTree -ne '79e59f21b57e7284d0093cc4b5e588655551dde5') { throw 'The diagnostic source tree changed.' }
          $actualTree | Set-Content 'ci-results/tested-tree.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match the original post-source production dependencies
        id: production_dependencies
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==51 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native Import Center and durable batch workflow
        id: probe_01
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_import_center_smoke.py 2>&1 | Tee-Object 'ci-results/native-import-center.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed document formats and native accessible reading
        id: probe_02
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_document_formats_smoke.py 2>&1 | Tee-Object 'ci-results/native-document-formats.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native wx startup and source-opening events
        id: probe_03
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/native-desktop.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native saved-evidence page selection and note recovery
        id: probe_04
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_evidence_pages_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reference metadata review and historical outline export
        id: probe_05
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-workflows.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic comparison, bibliography and catalog review
        id: probe_06
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_academic_comparison_smoke.py --require-windows 2>&1 | Tee-Object 'ci-results/native-academic.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reviewed library workflows and checkpoint recovery
        id: probe_07
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B -X utf8 tests/ui/native_library_workflow_smoke.py 2>&1 | Tee-Object 'ci-results/native-library-workflow.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-notebook search and keyboard actions
        id: probe_08
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_notebook_search_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-notebook-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB section navigation and image descriptions
        id: probe_09
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_ebook_reader_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-ebook-reader.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native library reports and academic exports
        id: probe_10
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_catalog_tools_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-catalog-tools.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB contents and exact chapter search
        id: probe_11
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_ebook_native.py 2>&1 | Tee-Object 'ci-results/native-ebook-contents.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native full-source reader and page bookmarks
        id: probe_12
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_reading_desk_smoke.py 2>&1 | Tee-Object 'ci-results/native-reading-desk.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native catalog reports and source comparison export
        id: probe_13
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_catalog_insights_native.py 2>&1 | Tee-Object 'ci-results/native-catalog-insights.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require every original remaining native probe
        if: ${{ always() && !cancelled() }}
        env:
          PROBE_STEPS: ${{ toJSON(steps) }}
        run: |
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $steps = $env:PROBE_STEPS | ConvertFrom-Json
          $required = @('probe_01', 'probe_02', 'probe_03', 'probe_04', 'probe_05', 'probe_06', 'probe_07', 'probe_08', 'probe_09', 'probe_10', 'probe_11', 'probe_12', 'probe_13')
          $rows = @($required | ForEach-Object {
            $entry = $steps.PSObject.Properties[$_].Value
            [ordered]@{ id=$_; outcome=$entry.outcome; conclusion=$entry.conclusion }
          })
          $failed = @($rows | Where-Object { $_.outcome -ne 'success' })
          $status = if ($failed.Count -eq 0 -and $rows.Count -eq 13) { 'PASS' } else { 'FAIL' }
          [ordered]@{ status=$status; source_commit='2429ba2a5918b3a32efb0688f9265233fd2de1bc'; source_tree='79e59f21b57e7284d0093cc4b5e588655551dde5';
            diagnostic_only=$true; final_main_acceptance_still_required=$true; probes=$rows
          } | ConvertTo-Json -Depth 6 | Tee-Object 'ci-results/native-tail-summary.json'
          if ($status -ne 'PASS') { throw 'At least one required native diagnostic probe failed or did not run.' }

      - name: Preserve all source-bound diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-native-tail-2429-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7
