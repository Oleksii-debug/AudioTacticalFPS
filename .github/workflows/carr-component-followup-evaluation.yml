            'tests/e2e/test_import_batch_cli.py',
            'tests/e2e/test_streamed_import_cli.py',
            'tests/e2e/test_streaming_import_pages.py',
            'tests/ingest/test_import_budget.py',
            'tests/ingest/test_import_budget_worker.py',
            'tests/ingest/test_import_scan_pages.py',
            'tests/ingest/test_import_session.py',
            'tests/storage/test_import_capacity_backup.py',
            'tests/ui/test_import_center.py',
            'tests/ui/test_import_resources.py',
            'tests/e2e/test_backup_resource_cli.py',
            'tests/storage/test_backup_budget.py',
            'tests/storage/test_backup_capacity.py',
            'tests/storage/test_backup_resource_roundtrip.py',
            'tests/storage/test_studio_clip_inputs_backup.py',
            'tests/ui/test_backup_resource_actions.py',
            'tests/ingest/test_batch_scan.py',
            'tests/ingest/test_streamed_text.py',
            'tests/ingest/test_streamed_ingest.py',
            'tests/ingest/test_streamed_admission.py',
            'tests/e2e/test_streamed_source_import.py',
            'tests/e2e/test_import_batches.py',
            'tests/storage/test_library_backup.py',
            'tests/storage/test_backup_incremental.py',
            'tests/storage/test_backup_boundary.py',
            'tests/storage/test_backup_schema_identity.py',
            'tests/storage/test_pending_backup.py',
            'tests/storage/test_complete_pending_backup.py',
            'tests/storage/test_direct_import_pending_backup.py',
            'tests/storage/test_streamed_source_backup.py',
            'tests/storage/test_composite_backup.py',
            'tests/ui/test_backup_incremental_dialog.py',
            'tests/ui/test_streamed_import.py',
            'tests/speech/test_reading_focus.py',
            'tests/speech/test_reading_pauses.py',
            'tests/speech/test_session.py',
            'tests/ui/test_reader_tabs.py'
          )
          if (-not $IsWindows) { $suites += 'tests/storage_posix/test_state_backup_names.py' }
          if ($IsWindows) { $suites += 'tests/audio_windows/test_membership_fence.py' }
          python -I -B -m pytest -q -o addopts= -o pythonpath= -o xfail_strict=true --import-mode=importlib --junitxml=ci-component-results/installed.xml @suites 2>&1 | Tee-Object ci-component-results/installed.txt
          $testExit = $LASTEXITCODE
          python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-component-results/installed.xml').getroot().iter('testcase')); assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases); print('INSTALLED_CASES_PASS',len(cases))"
          if ($testExit -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
          $capacityCoverage = @'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = list(ET.parse('ci-component-results/installed.xml').iter('testcase'))
          suites = ["tests/e2e/test_import_batch_cli.py","tests/e2e/test_streamed_import_cli.py","tests/e2e/test_streaming_import_pages.py","tests/ingest/test_import_budget.py","tests/ingest/test_import_budget_worker.py","tests/ingest/test_import_scan_pages.py","tests/ingest/test_import_session.py","tests/storage/test_import_capacity_backup.py","tests/ui/test_import_center.py","tests/ui/test_import_resources.py","tests/e2e/test_backup_resource_cli.py","tests/storage/test_backup_budget.py","tests/storage/test_backup_capacity.py","tests/storage/test_backup_resource_roundtrip.py","tests/storage/test_backup_sidecars.py","tests/storage/test_studio_clip_inputs_backup.py","tests/ui/test_backup_resource_actions.py","tests/ingest/test_batch_scan.py","tests/ingest/test_streamed_text.py","tests/ingest/test_streamed_ingest.py","tests/ingest/test_streamed_admission.py","tests/e2e/test_streamed_source_import.py","tests/e2e/test_import_batches.py","tests/e2e/test_import_worker_publication.py","tests/storage/test_library_backup.py","tests/storage/test_backup_incremental.py","tests/storage/test_backup_boundary.py","tests/storage/test_backup_schema_identity.py","tests/storage/test_backup_scan_bounds.py","tests/storage/test_pending_backup.py","tests/storage/test_complete_pending_backup.py","tests/storage/test_direct_import_pending_backup.py","tests/storage/test_streamed_source_backup.py","tests/storage/test_composite_backup.py","tests/storage/test_canonical_backup_compat.py","tests/ui/test_backup_incremental_dialog.py","tests/ui/test_streamed_import.py","tests/audio/test_cleanup_contexts.py","tests/packaging/test_managed_launch_boundary.py","tests/speech/test_reading_focus.py","tests/speech/test_reading_pauses.py","tests/speech/test_registered_studio_voices.py","tests/speech/test_session.py","tests/storage/test_reader_synthesis_backup.py","tests/ui/test_reader_synthesis.py","tests/ui/test_reader_tabs.py"]
          counts = {}
          for suite in suites:
              module = suite[len('tests/'):-3].replace('/', '.')
              selected = [case for case in cases
                          if ('.' + module + '.') in ('.' + case.get('classname', '') + '.')]
              assert selected and all(not any(case.find(tag) is not None
                  for tag in ('failure', 'error', 'skipped')) for case in selected), suite
              counts[suite] = len(selected)
          result = {'status': 'PASS', 'selected_suites': counts,
                    'passed': sum(counts.values()), 'failed': 0, 'skipped': 0}
          Path('ci-component-results/installed-capacity-coverage.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          '@
          python -I -B -X utf8 -c $capacityCoverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            python -I -B -c "import json,xml.etree.ElementTree as E; cases=[c for c in E.parse('ci-component-results/installed.xml').iter('testcase') if c.get('classname','').rsplit('.',1)[-1]=='test_membership_fence']; required={'test_real_late_job_objects_require_retained_native_handles_and_exit[normal-return]','test_real_late_job_objects_require_retained_native_handles_and_exit[original-source-error]'}; assert len(cases)==2 and {c.get('name') for c in cases}==required; assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases); print(json.dumps(dict(status='PASS',native_job_membership_cases=2,case_names=sorted(required),native_signal_and_close='PASS',nvda='NOT_RUN')))" | Tee-Object 'ci-component-results/native-job-membership.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Require real Windows virtual-environment EOF and cleanup contracts
        if: ${{ !cancelled() && matrix.mode == 'installed' && runner.os == 'Windows' && steps.inventory.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $fixtureEnvironment = Join-Path $env:RUNNER_TEMP 'carr-deadline-fixture-python'
          python -I -B -m venv --without-pip --system-site-packages $fixtureEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixturePython = Join-Path $fixtureEnvironment 'Scripts/python.exe'
          $identity = @'
          import json, sys
          from pathlib import Path
          import carr_library
          assert sys.prefix != sys.base_prefix, 'The regression must run through an actual venv.'
          assert Path(sys.executable).resolve(strict=True) == Path(sys.argv[1]).resolve(strict=True)
          prior = json.loads(Path('ci-component-results/application-source.json').read_text(encoding='utf-8-sig'))
          installed = Path(carr_library.__file__).resolve(strict=True).parent
          assert installed == Path(prior['module_origin']).resolve(strict=True)
          assert not installed.is_relative_to(Path('src').resolve())
          print(json.dumps(dict(status='PASS', executable=sys.executable,
              base_executable=sys._base_executable, python=sys.version,
              installed_package=str(installed), source_inventory_sha256=prior['source_inventory_sha256'])))
          '@
          $identity | & $fixturePython -I -B -X utf8 - $fixturePython | Tee-Object ci-component-results/venv-deadline-identity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fixturePython -I -B -X utf8 -m pytest -q -o addopts= -o pythonpath= -o xfail_strict=true --import-mode=importlib --junitxml=ci-component-results/venv-deadline.xml tests/audio/test_process_deadline.py 2>&1 | Tee-Object ci-component-results/venv-deadline.txt
          $testExit = $LASTEXITCODE
          & $fixturePython -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-component-results/venv-deadline.xml').getroot().iter('testcase')); assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases); print('VENV_DEADLINE_CASES_PASS',len(cases))"
          if ($testExit -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Require installed native clip editing and explicit loop controls
        if: ${{ !cancelled() && matrix.mode == 'installed' && runner.os == 'Windows' && steps.inventory.outcome == 'success' && steps.audio.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -I -B -X utf8 scripts/windows_clip_editor_smoke.py 2>&1 | Tee-Object ci-component-results/installed-native-clip-editor.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require installed native completed-audio silence inspection
        if: ${{ !cancelled() && matrix.mode == 'installed' && runner.os == 'Windows' && steps.inventory.outcome == 'success' && steps.audio.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python -I -B -X utf8 scripts/windows_v3_smoke.py 2>&1 | Tee-Object ci-component-results/installed-native-studio-inspection.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain public synthetic source and installed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-component-followup-${{ matrix.os }}-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-component-results/
          if-no-files-found: error
          retention-days: 7
