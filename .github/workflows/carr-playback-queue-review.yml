name: Retained playback queue review
on:
  push:
    branches: [carr/playback-queue-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-playback-queue-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playback-queue-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Retained queue, same player and explicit recovery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: queue_install
        run: |
          python -m pip install ".[test]"
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
      - name: Install actual Windows desktop
        id: queue_desktop
        if: runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Prepare actual Linux audio tools
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-playback-queue
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version > ci-playback-queue/ffmpeg-version.txt
          ffprobe -version > ci-playback-queue/ffprobe-version.txt
      - name: Prepare pinned Windows audio tools
        id: queue_audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'ci-playback-queue' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-playback-queue-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-playback-queue/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_PLAYBACK_QUEUE_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-playback-queue
          cat > ci-playback-queue/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-playback-queue"
          suites = ["tests/speech/test_playlist.py","tests/speech/test_playlist_recovery.py","tests/ui/test_playback_queue.py","tests/ui/test_playback_navigation.py","tests/ui/test_studio_playback_actions.py","tests/ui/test_playback_settings.py","tests/speech/test_listening.py","tests/speech/test_wave_output.py","tests/speech/test_output_device_playback.py","tests/studio/test_clip_editing.py","tests/studio/test_clip_timeline.py","tests/studio/test_clip_dialog.py","tests/studio/test_clip_timeline_dialog.py","tests/ui/test_studio_progress_isolation.py","tests/ui/test_studio_progress_results.py","tests/storage/test_playback_queue_backup.py","tests/storage/test_studio_input_backup.py","tests/storage/test_backup_studio_media.py","tests/audio/test_cleanup_ownership.py","tests/audio/test_output_devices.py","tests/audio/test_dsp.py","tests/reader/test_live_listening.py"]
          if os.name == "posix":
              suites.extend(["tests/speech/test_playlist_boundary_posix.py", "tests/speech/test_listening_posix.py"])

          names = ["carr_library.speech.playlist","carr_library.speech.player","carr_library.speech.listening","carr_library.speech._wave_output","carr_library.ui.playback_queue","carr_library.ui.playback_navigation","carr_library.ui.playback_settings","carr_library.ui.studio_dialog","carr_library.studio.clips","carr_library.studio.backup_inputs","carr_library.studio.render","carr_library.studio.project","carr_library.audio.output_devices","carr_library.audio.cleanup","carr_library.audio.process","carr_library.audio.windows_job","carr_library.durable_state","carr_library.application","carr_library.backup_current","carr_library.library_backup"]
          # Compile selected real source and test bytes without importing UI/native code.
          for name in names:
              path = source.joinpath(*name.split(".")[1:]).with_suffix(".py")
              compile(path.read_bytes(), str(path), "exec")
          for suite in suites:
              path = root / suite
              compile(path.read_bytes(), str(path), "exec")
          
          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (mode + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      # Preserve the original collection failure before the
                      # required nonempty-suite assertion can terminate pytest.
                      print("FAILED COLLECTION: " + report.nodeid, flush=True)
                      print(str(report.longrepr)[:16384], flush=True)
          
              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (mode + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-playback-queue-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              result = {"status": "PASS", "mode": mode, "cases": len(cases),
                        "qualification": "RETAINED_QUEUE_AND_EXISTING_PLAYBACK_OWNER_CONTRACTS",
                        "native_queue_keyboard": "NOT_RUN",
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "physical_microphone": "NOT_RUN", "physical_output": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (mode + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require actual source queue, retained media and lifetime contracts
        if: "!cancelled()"
        timeout-minutes: 20
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-playback-queue/check.py source 2>&1 | tee ci-playback-queue/source.txt
      - name: Require isolated installed origins and the same queue contracts
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-playback-queue/check.py installed 2>&1 | tee ci-playback-queue/installed.txt
      - name: Require actual native queue controls with runtime egress blocked
        if: "!cancelled() && runner.os == 'Windows' && steps.queue_install.outcome == 'success' && steps.queue_desktop.outcome == 'success' && steps.queue_audio.outcome == 'success'"
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -I -B -c "from pathlib import Path; p=Path('scripts/windows_playback_queue_smoke.py'); compile(p.read_bytes(), str(p), 'exec')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_PLAYBACK_QUEUE_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_PLAYBACK_QUEUE_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_PLAYBACK_QUEUE_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-playback-queue/external-test-audio-binding.json'
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Get-Process -Id $PID).Path,
            (Join-Path $env:CARR_PLAYBACK_QUEUE_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_PLAYBACK_QUEUE_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-playback-queue-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-playback-queue/runtime-firewall.json'
            $probes = @(
              @{ name='native-playback-queue'; script='scripts/windows_playback_queue_smoke.py'; arguments=@('--audio-evidence', 'ci-playback-queue/external-test-audio-binding.json') }
            )
            $failures = @()
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 -X faulthandler $scriptPath @probeArgs 2>&1 | Tee-Object ('ci-playback-queue/' + $probe.name + '.txt')
              if ($LASTEXITCODE -ne 0) { $failures += $probe.name }
            }
            if ($failures.Count -ne 0) { throw ('Required native workflows failed: ' + ($failures -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-playback-queue
          git rev-parse HEAD > ci-playback-queue/commit.txt
          git rev-parse HEAD^{tree} > ci-playback-queue/tree.txt
          python -m pip freeze > ci-playback-queue/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: playback-queue-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-playback-queue
          if-no-files-found: error
