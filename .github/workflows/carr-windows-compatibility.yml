name: CARR native Windows compatibility

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows-compatibility.yml
  push:
    branches: [carr-library, carr/complete-v3-foundation-20261126-3954]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-compatibility-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-compatibility:
    name: Windows x64 / CPython 3.11 / Unicode OCR and strict imports
    runs-on: windows-2022
    timeout-minutes: 18
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Preserve committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the pinned core and the actual application
        timeout-minutes: 5
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-compatibility-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-compatibility-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-compatibility-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,struct,sys; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform())))" | Tee-Object 'ci-compatibility-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the exact native OCR engine and model bytes
        timeout-minutes: 6
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'carr-compatibility-ocr'
          New-Item -ItemType Directory -Force $root | Out-Null
          $ocr = Join-Path $root 'engine'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $root 'cache') --output $ocr --source-archive (Join-Path $root 'ocr-corresponding-source.tar') --download | Tee-Object 'ci-compatibility-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise the real Unicode OCR and version-sensitive source paths
        timeout-minutes: 6
        run: |
          $env:PATH = "$env:CARR_CI_OCR_DIR;$env:PATH"
          $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
          $suites = @(
            'tests/extract/test_document_formats_text.py',
            'tests/storage/test_keyboard_preferences.py',
            'tests/extract/test_managed_ocr.py',
            'tests/extract/test_ocr_runtime.py',
            'tests/extract/test_runtime_identity.py',
            'tests/e2e/test_managed_ocr_import.py'
          )
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 1 @suites 2>&1 | Tee-Object 'ci-compatibility-results/strict-native-compatibility.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-compatibility-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-compatibility-results/
          if-no-files-found: warn
          retention-days: 7
