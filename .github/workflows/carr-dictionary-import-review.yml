name: Dictionary import author-observed review

on:
  push:
    branches: [carr/dictionary-import-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-dictionary-import-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-import-review-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install this exact candidate and declared test dependencies
        run: python -m pip install ".[test]"
      - name: Compile the exact new source and native probe without executing it
        run: |
          python -I -B -X utf8 - <<'PY'
          from pathlib import Path
          for name in (
              'src/carr_library/speech/pronunciation_formats.py',
              'src/carr_library/ui/pronunciation_dialog.py',
              'tests/speech/test_pronunciation_formats.py',
              'tests/speech/test_pronunciation_formats_handlers.py',
              'scripts/windows_pronunciation_smoke.py'):
              path = Path(name)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('Exact source syntax compiled; Windows native execution is NOT_RUN.')
          PY
      - name: Require current and observed source behavior plus actual POSIX races
        run: |
          mkdir -p ci-dictionary-review
          python -B scripts/ci_check.py --diagnostics --jobs 2 \
            tests/speech/test_pronunciation_formats.py \
            tests/speech/test_pronunciation_formats_handlers.py \
            tests/speech/test_pronunciation_review.py \
            tests/speech/test_pronunciation_handlers.py \
            tests/speech/test_dictionary_import_boundary.py \
            tests/speech/test_dictionary_import_boundary_posix.py \
            | tee ci-dictionary-review/source.log
      - name: Require exact installed modules and zero-skip regression execution
        run: |
          python -I -B -X utf8 - <<'PY'
          from hashlib import sha256
          import importlib
          import json
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          root = Path.cwd().resolve()
          selected = (Path(sysconfig.get_path('purelib')) / 'carr_library').resolve()
          inventory = {}
          for name in ('speech.pronunciation_formats', 'ui.pronunciation_dialog', 'speech.reading'):
              module = importlib.import_module('carr_library.' + name)
              actual = Path(module.__file__).resolve()
              expected = root / 'src' / 'carr_library' / Path(*name.split('.')).with_suffix('.py')
              assert actual.is_relative_to(selected) and not actual.is_relative_to(root / 'src')
              assert sha256(actual.read_bytes()).digest() == sha256(expected.read_bytes()).digest(), name
              inventory[name] = {'path': str(actual), 'sha256': sha256(actual.read_bytes()).hexdigest()}
          output = root / 'ci-dictionary-review'
          output.mkdir(exist_ok=True)
          (output / 'installed-source.json').write_text(json.dumps(inventory, indent=2), encoding='utf-8')
          report = output / 'installed.xml'
          with tempfile.TemporaryDirectory(prefix='carr-dictionary-installed-') as temporary:
              status = pytest.main(['-vv', '-o', 'pythonpath=', '-o', 'addopts=',
                  '-o', 'xfail_strict=true', '-o', 'faulthandler_timeout=60',
                  '--import-mode=importlib', '-p', 'no:cacheprovider',
                  '--basetemp', str(Path(temporary) / 'pytest'), '--junitxml', str(report),
                  'tests/speech/test_pronunciation_formats.py',
                  'tests/speech/test_pronunciation_formats_handlers.py',
                  'tests/speech/test_pronunciation_review.py',
                  'tests/speech/test_pronunciation_handlers.py',
                  'tests/speech/test_dictionary_import_boundary.py',
                  'tests/speech/test_dictionary_import_boundary_posix.py'])
          cases = list(ET.parse(report).iter('testcase'))
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          print(json.dumps({'cases': len(cases), 'failed': failed, 'skipped': skipped, 'pytest_exit': int(status),
              'author_observations': 49, 'unsupported_cases': 'EXPLICIT_REFUSAL', 'windows_native': 'NOT_RUN'}))
          assert status == 0 and cases and failed == skipped == 0
          PY
      - name: Upload only text qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dictionary-import-review-${{ github.run_id }}
          path: carr-library/ci-dictionary-review/
          if-no-files-found: ignore
          retention-days: 7
