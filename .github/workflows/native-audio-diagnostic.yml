name: CARR isolated native recording and Book diagnostics

on:
  push:
    branches: [carr/native-audio-diagnostic-20261127]

permissions:
  contents: read

jobs:
  focused-windows-diagnostics:
    name: Windows diagnostic / ${{ matrix.scope }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [native-controls, book-source]
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the exact desktop package in a fresh environment
        id: install-runtime
        timeout-minutes: 5
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-native-audio-diagnostic-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-native-audio-diagnostic' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-native-audio-diagnostic/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-native-audio-diagnostic/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-native-audio-diagnostic/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact installed Python source and checkout identity
        id: installed-origin
        timeout-minutes: 2
        run: |
          $proof = @'
          import hashlib, json, os, pathlib, subprocess, sys
          import carr_library
          checkout = pathlib.Path.cwd().parent.resolve()
          source = (checkout / 'carr-library/src/carr_library').resolve()
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert not installed.is_relative_to(checkout)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          paths = sorted(source.rglob('*.py'))
          assert 0 < len(paths) <= 1024
          hashes = {}
          for selected in paths:
              relative = selected.relative_to(source)
              expected = selected.read_bytes()
              assert (installed / relative).read_bytes() == expected, str(relative)
              hashes[relative.as_posix()] = hashlib.sha256(expected).hexdigest()
          report = dict(status='PASS', source_commit=commit, installed_root=str(installed),
                        installed_python_files=len(hashes), source_hashes=hashes,
                        scope='installed Python source equality; no model or sealed-bundle qualification')
          pathlib.Path('ci-native-audio-diagnostic/installed-source.json').write_text(
              json.dumps(report, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps(dict(status='PASS', source_commit=commit,
                                installed_python_files=len(hashes), installed_root=str(installed))))
          '@
          $proof | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/installed-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the canonical pinned local audio runtime
        id: audio-runtime
        timeout-minutes: 6
        run: |
          $audioWork = Join-Path $env:RUNNER_TEMP 'carr-native-audio-diagnostic-runtime'
          New-Item -ItemType Directory -Force $audioWork | Out-Null
          $audioInputs = Join-Path $audioWork 'inputs'
          $audioRuntime = Join-Path $audioWork 'runtime'
          & $env:CARR_PYTHON -I -B packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-native-audio-diagnostic/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON -I -B packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audioRuntime | Tee-Object 'ci-native-audio-diagnostic/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audioRuntime 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require recording and Book native-driver source controls
        if: ${{ !cancelled() && matrix.scope == 'native-controls' && steps.install-runtime.outcome == 'success' && steps.installed-origin.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 2 tests/ui/test_recording_dialog.py tests/ui/test_book_batch_dialog.py tests/operations/test_production_admission.py 2>&1 | Tee-Object 'ci-native-audio-diagnostic/native-driver-source-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual installed recording and native owner closure
        if: ${{ !cancelled() && matrix.scope == 'native-controls' && steps.install-runtime.outcome == 'success' && steps.installed-origin.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_recording_smoke.py 2>&1 | Tee-Object 'ci-native-audio-diagnostic/native-recording.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual installed SAPI and Book controls with runtime egress blocked
        if: ${{ !cancelled() && matrix.scope == 'native-controls' && steps.install-runtime.outcome == 'success' && steps.installed-origin.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        timeout-minutes: 9
        run: |
          $python = $env:CARR_PYTHON
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-native-audio-diagnostic/runtime-firewall.json'
            & $python -I -B scripts/windows_v3_smoke.py 2>&1 | Tee-Object 'ci-native-audio-diagnostic/native-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native speech and production acceptance failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Require the two focused Book source suites to finish
        if: ${{ !cancelled() && matrix.scope == 'book-source' && steps.install-runtime.outcome == 'success' && steps.installed-origin.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $diagnose = @'
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path('scripts/ci_check.py').resolve()
          spec = importlib.util.spec_from_file_location('carr_book_diagnostic_ci_check', path)
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          assert runner.SUITE_TIMEOUT_SECONDS == 600
          original = runner.PYTEST_CHILD
          anchor = (
              'class RejectExpectedFailures:\n'
              '    seen = False\n'
              '\n'
              '    def pytest_runtest_logreport(self, report):\n'
              "        if hasattr(report, 'wasxfail'):\n"
              '            self.seen = True\n'
          )
          assert original.count(anchor) == 1, 'The reviewed strict pytest policy anchor changed.'
          instrumented = r'''
          import faulthandler as diagnostic_faulthandler
          import hashlib as diagnostic_hashlib
          import json as diagnostic_json
          import threading as diagnostic_threading
          diagnostic_faulthandler.enable(all_threads=True)
          # Use owned Python frame references for periodic observations. The
          # asynchronous C watchdog can itself race with frame destruction.
          import atexit as diagnostic_atexit
          diagnostic_stop = diagnostic_threading.Event()
          diagnostic_stream = os.fdopen(os.dup(sys.stdout.fileno()), 'w', encoding='utf-8', buffering=1)

          def diagnostic_sample_stacks():
              for sample in range(1, 7):
                  if diagnostic_stop.wait(90):
                      return
                  frames = {}
                  current = None
                  try:
                      frames = sys._current_frames()
                      identities = [identity for identity in sorted(frames)
                                    if identity != diagnostic_threading.get_ident()]
                      observations = []
                      for identity in identities[:8]:
                          current = frames[identity]
                          stack = []
                          for _ in range(32):
                              if current is None:
                                  break
                              stack.append(dict(filename=current.f_code.co_filename[:768],
                                                function=current.f_code.co_name[:256],
                                                line=current.f_lineno))
                              current = current.f_back
                          observations.append(dict(thread=hex(identity), frames=stack,
                                                   frames_truncated=current is not None))
                      print('CARR_BOOK_STACK ' + diagnostic_json.dumps(dict(
                          pid=os.getpid(), sample=sample, threads=observations,
                          threads_truncated=len(identities) > 8,
                          sampler='owned Python frame references'), ensure_ascii=True,
                          allow_nan=False), file=diagnostic_stream, flush=True)
                  except Exception as error:
                      print('CARR_BOOK_STACK ' + diagnostic_json.dumps(dict(
                          pid=os.getpid(), sample=sample, observation_error=type(error).__name__ + ': ' + str(error)[:256]),
                          ensure_ascii=True, allow_nan=False), file=diagnostic_stream, flush=True)
                  finally:
                      current = None
                      frames.clear()

          diagnostic_worker = diagnostic_threading.Thread(
              target=diagnostic_sample_stacks, name='book-source-observer', daemon=True)

          def diagnostic_stop_sampling():
              diagnostic_stop.set()
              diagnostic_worker.join(timeout=2)
              if not diagnostic_worker.is_alive() and not diagnostic_stream.closed:
                  diagnostic_stream.close()

          diagnostic_worker.start()
          diagnostic_atexit.register(diagnostic_stop_sampling)
          print('CARR_BOOK_CHILD ' + diagnostic_json.dumps({
              'pid': os.getpid(), 'main_thread': hex(diagnostic_threading.get_ident()),
              'suite': str(sys.argv[-1])[:768], 'stack_interval_seconds': 90,
              'scope': 'diagnostic-only observation; strict runner and suite deadline unchanged'
          }, ensure_ascii=True, allow_nan=False), flush=True)

          class RejectExpectedFailures:
              seen = False
              _diagnostic_rows = 0

              def _diagnostic_emit(self, event, nodeid, **fields):
                  if self._diagnostic_rows >= 512:
                      return
                  self._diagnostic_rows += 1
                  identity = str(nodeid)
                  row = dict(event=event, pid=os.getpid(), nodeid=identity[:768],
                             nodeid_sha256=diagnostic_hashlib.sha256(identity.encode('utf-8')).hexdigest())
                  row.update(fields)
                  print('CARR_BOOK_CASE ' + diagnostic_json.dumps(
                      row, sort_keys=True, ensure_ascii=True, allow_nan=False), flush=True)

              def pytest_sessionfinish(self, session, exitstatus):
                  diagnostic_stop_sampling()

              def pytest_runtest_logstart(self, nodeid, location):
                  self._diagnostic_emit('start', nodeid)

              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
                  self._diagnostic_emit(
                      'report', report.nodeid, phase=str(report.when)[:16],
                      outcome=str(report.outcome)[:16], duration_seconds=round(float(report.duration), 6))
          '''
          runner.PYTEST_CHILD = original.replace(anchor, instrumented, 1)
          assert runner.PYTEST_CHILD.replace(instrumented, anchor, 1) == original
          sys.argv = [str(path), '--jobs', '2',
                      'tests/studio/test_book_batch.py', 'tests/studio/test_book_cli.py']
          print('Diagnostic-only child case/stack observation; actual ci_check main follows.', flush=True)
          raise SystemExit(runner.main())
          '@
          $diagnose | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/book-source-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve only diagnostic source and native text evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-native-audio-diagnostic-${{ matrix.scope }}-${{ github.sha }}
          path: |
            carr-library/ci-native-audio-diagnostic/*.txt
            carr-library/ci-native-audio-diagnostic/*.json
            carr-library/ci-native-audio-diagnostic/*.xml
          if-no-files-found: error
          retention-days: 3
