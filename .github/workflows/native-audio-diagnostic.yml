name: CARR isolated Windows source failure cohort

on:
  push:
    branches: [carr/native-audio-diagnostic-20261127]

permissions:
  contents: read

jobs:
  focused-windows-diagnostics:
    name: Windows diagnostic / ${{ matrix.scope }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [regressions, unfinished]
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the exact desktop package in a fresh environment
        id: install-runtime
        timeout-minutes: 5
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-native-audio-diagnostic-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-native-audio-diagnostic' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-native-audio-diagnostic/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-native-audio-diagnostic/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-native-audio-diagnostic/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact installed Python source and checkout identity
        id: installed-origin
        timeout-minutes: 2
        run: |
          $proof = @'
          import hashlib, json, os, pathlib, subprocess, sys
          import carr_library
          checkout = pathlib.Path.cwd().parent.resolve()
          source = (checkout / 'carr-library/src/carr_library').resolve()
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert not installed.is_relative_to(checkout)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          paths = sorted(source.rglob('*.py'))
          assert 0 < len(paths) <= 1024
          hashes = {}
          for selected in paths:
              relative = selected.relative_to(source)
              expected = selected.read_bytes()
              assert (installed / relative).read_bytes() == expected, str(relative)
              hashes[relative.as_posix()] = hashlib.sha256(expected).hexdigest()
          report = dict(status='PASS', source_commit=commit, installed_root=str(installed),
                        installed_python_files=len(hashes), source_hashes=hashes,
                        scope='installed Python source equality; no model or sealed-bundle qualification')
          pathlib.Path('ci-native-audio-diagnostic/installed-source.json').write_text(
              json.dumps(report, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps(dict(status='PASS', source_commit=commit,
                                installed_python_files=len(hashes), installed_root=str(installed))))
          '@
          $proof | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/installed-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the canonical pinned local audio runtime
        id: audio-runtime
        timeout-minutes: 6
        run: |
          $audioWork = Join-Path $env:RUNNER_TEMP 'carr-native-audio-diagnostic-runtime'
          New-Item -ItemType Directory -Force $audioWork | Out-Null
          $audioInputs = Join-Path $audioWork 'inputs'
          $audioRuntime = Join-Path $audioWork 'runtime'
          & $env:CARR_PYTHON -I -B packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-native-audio-diagnostic/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON -I -B packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audioRuntime | Tee-Object 'ci-native-audio-diagnostic/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audioRuntime 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the canonical pinned OCR runtime for source coverage
        id: ocr_runtime
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-source-cohort-ocr'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-native-audio-diagnostic/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require observed failures negative controls and unfinished source coverage
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.installed-origin.outcome == 'success' && steps.audio-runtime.outcome == 'success' && steps.ocr_runtime.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $allSuites = @(
            'tests/e2e/test_epub_library.py',
            'tests/reader/test_reading_desk.py',
            'tests/ui/test_notebook_search_actions.py',
            'tests/ui/test_desktop_result_modes.py',
            'tests/ui/probe_catalog_insights_actions.py',
            'tests/ingest/test_import_metadata_shape.py',
            'tests/ingest/test_txt_replay_registration.py',
            'tests/ingest/test_terminal_replay_registration.py',
            'tests/ingest/test_import_publication_point.py',
            'tests/ingest/test_import_replay_identity.py',
            'tests/storage/test_engine_settings_dordiai_backup.py',
            'tests/storage/test_studio_input_backup.py',
            'tests/storage/test_composed_recovery.py',
            'tests/storage/test_engine_settings_backup.py',
            'tests/storage/test_backup_v4_sidecars.py',
            'tests/storage/test_backup_generated_audio.py',
            'tests/storage/test_studio_input_authority.py',
            'tests/search/test_federated_advanced.py',
            'tests/security/test_portable_handoff.py'
          )
          if ($allSuites.Count -ne 19 -or @($allSuites | Sort-Object -Unique).Count -ne 19) { throw 'The focused source cohort must contain exactly 19 unique suites.' }
          switch ('${{ matrix.scope }}') {
            'regressions' { $suites = @($allSuites[0..16]); $expected = 17 }
            'unfinished' { $suites = @($allSuites[17..18]); $expected = 2 }
            default { throw 'Unknown required source cohort.' }
          }
          if ($suites.Count -ne $expected) { throw 'The selected source cohort is incomplete.' }
          foreach ($suite in $suites) {
            if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) { throw "Required suite is missing: $suite" }
          }
          @{ scope = '${{ matrix.scope }}'; all_suites = $allSuites; selected_suites = $suites } | ConvertTo-Json -Depth 4 | Set-Content 'ci-native-audio-diagnostic/selected-suites-${{ matrix.scope }}.json'
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          $previousTessdata = $env:TESSDATA_PREFIX
          try {
            if (-not $env:CARR_CI_AUDIO_DIR -or -not $env:CARR_CI_OCR_DIR) { throw 'Verified audio and OCR prerequisites are required for source acceptance.' }
            $audioBin = Join-Path $env:CARR_CI_AUDIO_DIR 'bin'
            foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $audioBin $tool) -PathType Leaf)) { throw "Verified audio executable is missing: $tool" }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $env:CARR_CI_OCR_DIR 'tesseract.exe') -PathType Leaf)) { throw 'Verified OCR executable is missing.' }
            $env:PATH = "$audioBin;$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
            & $env:CARR_PYTHON scripts/ci_check.py --jobs 2 @suites 2>&1 | Tee-Object 'ci-native-audio-diagnostic/focused-source-tests-${{ matrix.scope }}.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
            $env:TESSDATA_PREFIX = $previousTessdata
          }

      - name: Preserve focused source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-source-cohort-diagnostic-${{ github.sha }}-${{ matrix.scope }}
          path: |
            carr-library/ci-native-audio-diagnostic/*.txt
            carr-library/ci-native-audio-diagnostic/*.json
            carr-library/ci-native-audio-diagnostic/*.xml
          if-no-files-found: error
          retention-days: 3
