name: CARR pending import backup compatibility

on:
  pull_request:
    paths:
      - carr-library/**
      - .github/workflows/carr-backup-pending-compat.yml
  push:
    branches: [carr/backup-pending-compat-wip-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-backup-pending-compat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-backup-pending-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-contracts:
    name: Backup contracts / ${{ matrix.os }} / CPython 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the declared application and test dependencies
        run: python -m pip install ".[test]"
      - name: Verify installed studio project backup compatibility
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          report = Path("ci-results/studio-installed.json").resolve()
          report.parent.mkdir(exist_ok=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          probe = r"""
          from dataclasses import replace
          from hashlib import sha1
          import importlib
          import json
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          
          roots = tuple(Path(sysconfig.get_path(key)).resolve() for key in ("purelib", "platlib"))
          expected = {
              "carr_library.studio": "7e38d3875a79e43e24321e4a14f613a0bb7b5064",
              "carr_library.studio.project": "1acf68727fdaadd14055d357e28f2eb140ab2a52",
              "carr_library.backup_sidecars": "9f55cb0f18c3f1fe100902cfbe935be3a742946d",
          }
          origins = {}
          for name, expected_blob in expected.items():
              module = importlib.import_module(name)
              origin = Path(module.__file__).resolve()
              assert any(origin.is_relative_to(root) for root in roots), (name, str(origin))
              raw = origin.read_bytes()
              blob = sha1(("blob " + str(len(raw)) + "\0").encode() + raw).hexdigest()
              assert blob == expected_blob, (name, blob)
              origins[name] = {"path": str(origin), "git_blob": blob}
          
          from carr_library.application import LibraryApp
          from carr_library.library_backup import create_backup, verify_backup, restore_backup
          from carr_library.studio import ProjectStore, parse_script
          
          with tempfile.TemporaryDirectory(prefix="carr-installed-studio-") as temporary:
              root = Path(temporary)
              app = LibraryApp(root / "source")
              app.create_workspace("Installed studio schema")
              first = parse_script("Narrator: Preserved Unicode text e\u0301.",
                                   project_id="installed-project", title="Original project")
              store = ProjectStore(app.root / "state" / "studio" / "projects")
              store.save(first)
              current = replace(first, title="Second revision", revision=2)
              store.save(current, expected_revision=1)
              original_files = {path.relative_to(store.root): path.read_bytes()
                                for path in store.root.rglob("*.json")}
              assert len(original_files) == 2
              checksum = create_backup(app, root / "backup")
              manifest = verify_backup(root / "backup", checksum)
              restored = restore_backup(root / "backup", root / "restored", checksum)
              restored_store = ProjectStore(restored / "state" / "studio" / "projects")
              assert restored_store.load(current.id) == current
              restored_files = {path.relative_to(restored_store.root): path.read_bytes()
                                for path in restored_store.root.rglob("*.json")}
              assert restored_files == original_files
              report = {"status": "passed", "commit": sys.argv[2], "python": sys.version,
                        "isolated": bool(sys.flags.isolated), "modules": origins,
                        "manifest_sha256": checksum, "backup_version": manifest["version"],
                        "project_revisions_preserved": len(restored_files)}
              assert report["isolated"]
              Path(sys.argv[1]).write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps(report, indent=2), flush=True)
          """
          subprocess.run([sys.executable, "-I", "-c", probe, str(report), commit],
                         cwd=os.environ["RUNNER_TEMP"], check=True)
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare the actual Linux OCR and audio engines
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd ffmpeg
      - name: Prepare the verified Windows OCR engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'carr-backup-ocr'
          New-Item -ItemType Directory -Force $work | Out-Null
          $ocr = Join-Path $work 'ocr'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $work 'cache') --output $ocr --source-archive (Join-Path $work 'corresponding-source.tar') --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TESSDATA_PREFIX=$(Join-Path $ocr 'tessdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare the verified Windows audio tools
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'carr-backup-audio'
          New-Item -ItemType Directory -Force $work | Out-Null
          $audioCache = Join-Path $work 'cache'
          $audioRuntime = Join-Path $work 'runtime'
          python packaging/acquire_audio_runtime.py --output $audioCache --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          python packaging/prepare_audio_runtime.py --archive (Join-Path $audioCache $audioLock.archive.name) --sources-dir $audioCache --output $audioRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioBin = Join-Path $audioRuntime 'bin'
          "CARR_FFMPEG=$(Join-Path $audioBin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Record the actual runtime
        shell: python
        run: |
          import importlib.metadata as metadata
          import json, pathlib, platform, shutil, subprocess, sys
          destination = pathlib.Path("ci-results")
          destination.mkdir(exist_ok=True)
          tesseract = shutil.which("tesseract")
          assert tesseract, "The real OCR regression must run, not skip"
          ffmpeg = shutil.which("ffmpeg")
          assert ffmpeg, "The real generated-audio regression must run, not skip"
          subprocess.run([tesseract, "--version"], check=True)
          subprocess.run([ffmpeg, "-version"], check=True)
          value = dict(python=sys.version, platform=platform.platform(),
                       commit=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                       packages={name: metadata.version(name) for name in
                                 ("universal-research-library", "pytest", "pypdf", "pypdfium2",
                                  "Pillow", "reportlab")}, tesseract=tesseract, ffmpeg=ffmpeg)
          (destination / "runtime.json").write_text(json.dumps(value, indent=2), encoding="utf-8")
          print(json.dumps(value, indent=2), flush=True)
      - name: Run every selected backup regression with no skips or expected failures
        shell: python
        run: |
          import pathlib, subprocess, sys
          suites = sorted(path.as_posix() for path in pathlib.Path("tests/storage").glob("test_*backup*.py"))
          suites += ["tests/assistant/test_backup_receipt.py",
                     "tests/catalog/test_metadata_backup_roundtrip.py",
                     "tests/ui/test_desktop_handlers.py",
                     "tests/e2e/test_offline_startup.py"]
          assert "tests/storage/test_backup_pending_compatibility.py" in suites
          assert "tests/storage/test_pending_backup.py" in suites
          import runpy
          child = runpy.run_path("scripts/ci_check.py")["PYTEST_CHILD"]
          # Reproduce the original combined run and retain its full JUnit record.
          # Then require the existing per-suite gate too, including zero skips.
          commands = [
              [sys.executable, "-c", child, "-o", "addopts=", "-o", "xfail_strict=true",
               "--tb=short", "--junitxml=ci-results/backup-aggregate.xml", *suites],
              [sys.executable, "scripts/ci_check.py", *suites],
          ]
          results = []
          with pathlib.Path("ci-results/backup-tests.log").open("w", encoding="utf-8") as log:
              for command in commands:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                             text=True, encoding="utf-8", errors="replace", bufsize=1)
                  for line in process.stdout:
                      print(line, end="", flush=True)
                      log.write(line)
                      log.flush()
                  results.append(process.wait())
          raise SystemExit(0 if results == [0, 0] else 1)
      - name: Preserve runtime and complete test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-pending-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-results/
          if-no-files-found: error
