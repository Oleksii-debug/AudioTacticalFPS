name: CARR installed native library workflow diagnostic

on:
  push:
    branches: ['carr/ci-native-library-workflow-*']
    paths: ['carr-library/**', '.github/workflows/carr-native-library-workflow.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-library-workflow:
    name: Same installed native library workflow and checkpoint probe
    runs-on: windows-2022
    timeout-minutes: 40
    concurrency:
      group: carr-native-library-workflow-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Bind the original probe and prepare the same installed desktop dependencies
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact diagnostic event head differs.' }
          $verify = @'
          from hashlib import sha1
          import importlib.util, pathlib, sys
          pins = {"scripts/ci_native_library_workflow.py":"3e46d06b8063a8c3c4322773fb97d57bbaf37eb7","tests/ui/native_library_workflow_smoke.py":"9ff46b7bc708fb9e50501bd457deedb11d16c4c0","src/carr_library/library_assistant.py":"f96aa939066c16105c3398e507f43ef1e438d571","src/carr_library/ui/library_assistant.py":"c8e9e0ca148d929ead1b44f7cef17efbb76f6568","src/carr_library/ui/desktop_app.py":"85c0991f744bd521ca247a0e15da93aa585ea30d","src/carr_library/application.py":"82af31743ca5cc6557477f6492c08b912751f4a4","scripts/ci_check.py":"6ad3055cfcd7c6a1b1af8544ae462c5d51adb473","packaging/source_wheel.py":"478de248451d59a44b35784eb808fb2974f0af67","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-semantic-cp311.lock":"70dbd10a1dd6282027820f82207ccc617cc9a740","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","pyproject.toml":"0e691bab81b90bf9b1543b454014c47b987f11ce"}
          for name, expected in pins.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, name
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          path = pathlib.Path('scripts/ci_native_library_workflow.py').resolve()
          spec = importlib.util.spec_from_file_location('library_ci_preflight', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.sources()
          compile(module.ORIGIN_CHILD, '<library-origin-child>', 'exec')
          assert len(module.MODULES) == len(set(module.MODULES)) == 9
          assert len(module.REQUIRED) == len(set(module.REQUIRED)) == 6
          print('Exact original native probe and source-wheel diagnostic are bound.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Library workflow diagnostic preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-native-library' -ErrorAction Stop | Out-Null
          $environment = Join-Path $env:RUNNER_TEMP ('carr-library-native-python-' + [guid]::NewGuid().ToString('N'))
          & python -B -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Fresh native diagnostic environment creation failed.' }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_LIBRARY_DIAG_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Preserve the main desktop's ordered native/trusted then semantic closure.
          & $python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/trusted-client.lock
          if ($LASTEXITCODE -ne 0) { throw 'Original locked desktop/trusted dependencies failed.' }
          & $python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing locked pytest and wheel-build dependencies failed.' }
          & $python -B -m pip install --only-binary=:all: reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Original explicitly versioned desktop fixture dependencies failed.' }
          & $python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Original locked semantic dependency closure failed.' }
          & $python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic desktop dependency closure is inconsistent.' }
          & $python -I -B -m pip list --format=json | Set-Content -Encoding utf8 'ci-native-library/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed dependency inventory failed.' }
          & $python -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==51 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-native-library/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { throw 'Exact51 locked production dependencies differ.' }
          & $python -I -B -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-native-library/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { throw 'Original Windows CPython/wx profile is unavailable.' }
      - name: Run the original installed native probe with unchanged assertions and deadline
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = $env:CARR_LIBRARY_DIAG_PYTHON
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Prepared isolated Python is missing.' }
          $pythonPrograms = @(& $python -I -B -c "import pathlib,sys; p=pathlib.Path(sys.executable).resolve(); b=pathlib.Path(getattr(sys,'_base_executable',sys.executable)).resolve(); print(p); print(b); print(p.with_name('pythonw.exe')); print(b.with_name('pythonw.exe'))")
          if ($LASTEXITCODE -ne 0) { throw 'Exact interpreter inventory failed.' }
          $programs = @($pythonPrograms | ForEach-Object { [IO.Path]::GetFullPath($_) } | Sort-Object -Unique)
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw ('Required offline executable is missing: ' + $program) }
            if (((Get-Item -LiteralPath $program -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw ('Offline executable is a reparse point: ' + $program) }
          }
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          if ($profilesBefore.Count -ne 3) { throw 'All three firewall profile states must be captured.' }
          $rules = [System.Collections.Generic.List[string]]::new()
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            $active = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
            if ($active.Count -ne 3 -or @($active | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Every firewall profile must be active before actual library workflow work.' }
            foreach ($program in $programs) {
              $name = 'CARR-library workflow-acceptance-' + [guid]::NewGuid().ToString('N')
              $rules.Add($name)
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
              $rule = Get-NetFirewallRule -Name $name -ErrorAction Stop
              $filter = @($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop)
              if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or $filter.Count -ne 1 -or [IO.Path]::GetFullPath($filter[0].Program) -ne [IO.Path]::GetFullPath($program)) { throw 'Exact-program outbound rule was not admitted.' }
            }
            @{ status='ACTIVE'; programs=$programs; rules=$rules.ToArray(); profiles=$active; direction='Outbound'; action='Block'; qualification='All acquisition finished before these rules' } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-native-library/firewall.json'
            & $python -I -B -X utf8 scripts/ci_native_library_workflow.py --evidence ci-native-library/contracts --expected-head $env:EXPECTED_SOURCE_SHA 2>&1 | Tee-Object 'ci-native-library/diagnostic.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Original installed native library workflow diagnostic failed.' }
          } finally {
            $cleanupFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $rules) {
              try { Remove-NetFirewallRule -Name $name -ErrorAction Stop } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            foreach ($profile in $profilesBefore) {
              try {
                Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop
                $restored = Get-NetFirewallProfile -Name $profile.Name -ErrorAction Stop
                if ($restored.Enabled -ne $profile.Enabled) { throw ('Profile state was not restored: ' + $profile.Name) }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            @{ status=$(if ($cleanupFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); original_profiles=$profilesBefore; removed_rules=$rules.ToArray(); errors=$cleanupFailures.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-native-library/firewall-cleanup.json'
            if ($cleanupFailures.Count -ne 0) { throw ('Owned library workflow firewall cleanup failed: ' + ($cleanupFailures -join '; ')) }
          }
      - name: Admit only bounded public diagnostic evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat
          root = pathlib.Path('ci-native-library')
          assert root.is_dir() and not root.is_symlink(), 'No actual diagnostic evidence exists.'
          allowed = {'installed-packages.json','full-lock-source-inventory.json',
                     'native-runtime.json','firewall.json','firewall-cleanup.json','diagnostic.txt'}
          contract = {'identity-before.json','identity-after.json',
              'wheel-build.txt','source-wheel-proof.json','wheel-install.txt','installed-pip-check.txt',
              'native-origins-before.json','native-origins-before.txt',
              'native-origins-after.json','native-origins-after.txt',
              'native-library-workflow.txt','native-library-workflow.json','diagnostic-summary.json'}
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 16*1024*1024
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
          print('Only the closed public text/JSON diagnostic inventory is retained.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Library workflow diagnostic evidence boundary failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: native-library-workflow-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-native-library/
          if-no-files-found: error
