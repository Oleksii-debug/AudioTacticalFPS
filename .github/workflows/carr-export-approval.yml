name: CARR actual desktop export approval

on:
  push:
    branches: [carr/export-approval-closure-411a-20261127]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-export-approval:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned dependencies and exact selected application
        run: |
          New-Item -ItemType Directory -Force 'ci-export-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-export-results/tested-commit.txt'
          git rev-parse 'HEAD^{tree}' | Set-Content 'ci-export-results/tested-tree.txt'
          python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce real predecessor competing-file loss before correction
        run: |
          $env:PYTHONPATH = (Resolve-Path 'src').Path
          python -B -c "import subprocess,pathlib; p=pathlib.Path('src/carr_library/research/export_file.py'); p.write_bytes(subprocess.check_output(['git','show','1b37379748e19b2914d424bb65e3b9a94e29368b:carr-library/src/carr_library/research/export_file.py']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            python -B -m pytest -q tests/reader/test_export_no_clobber.py -k default_new_destination --junitxml=ci-export-results/baseline.xml 2>&1 | Tee-Object 'ci-export-results/baseline.txt'
            $baselineExit = $LASTEXITCODE
            if ($baselineExit -ne 1) { throw 'The predecessor did not reproduce the expected competing-file failure.' }
            python -B -c "import xml.etree.ElementTree as E; r=E.parse('ci-export-results/baseline.xml'); c=list(r.iter('testcase')); assert len(c)==2 and all(t.find('failure') is not None and t.find('error') is None and t.find('skipped') is None and 'DID NOT RAISE' in t.find('failure').text for t in c); print('Both actual predecessor no-clobber failures reproduced.')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            git checkout -- src/carr_library/research/export_file.py
          }
      - name: Require real destination approval, publication and preserved selected workflows
        run: |
          python -B scripts/ci_check.py --jobs 3 tests/reader/test_export_no_clobber.py tests/reader/test_export_publication_boundary.py tests/reader/test_file_export.py tests/reader/test_binary_file_export.py tests/ui/test_export_destination.py tests/ui/test_profile_project_exports.py tests/ui/test_academic_actions.py tests/ui/test_academic_library_dialog.py tests/ui/test_catalog_tools_dialog.py tests/ui/test_import_center.py tests/ui/test_reading_desk_actions.py tests/ui/test_academic_export_handler.py tests/e2e/test_export_destination.py tests/ui/test_academic_tools.py tests/ui/test_keyboard_manager.py tests/ui/test_citation_styles_jobs.py tests/reader/test_finish_export_formats.py tests/ui/test_studio_progress_results.py tests/ui/probe_catalog_insights_actions.py 2>&1 | Tee-Object 'ci-export-results/required-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native catalogue controls and bound overwrite decisions
        run: |
          python -B tests/ui/native_catalog_tools_smoke.py --native --source . --timeout 60 2>&1 | Tee-Object 'ci-export-results/native-catalogue.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: carr-actual-desktop-export-approval
          path: carr-library/ci-export-results/
          retention-days: 7
