name: CARR native effect choice regression

on:
  push:
    branches: [work/native-effects-dialog-fix-bbd7-a49c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-effect-choice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-effect-choices:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the pinned native desktop and exact product source
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest==9.0.2 --only-binary=:all:
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'ci-effects-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-effects-results/tested-commit.txt'
      - name: Retain typed effect controls and all cancellation outcomes
        run: |
          python scripts/ci_check.py tests/ui/test_audio_effects.py 2>&1 | Tee-Object 'ci-effects-results/typed-controls.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real installed native Unicode choices and committed values
        timeout-minutes: 3
        run: |
          python -I -B scripts/windows_audio_effects_smoke.py --native 2>&1 | Tee-Object 'ci-effects-results/native-effects.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only synthetic source-bound acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-effect-choice-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-effects-results/
          if-no-files-found: warn
          retention-days: 7
