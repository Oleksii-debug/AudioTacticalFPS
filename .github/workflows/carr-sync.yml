name: CARR portable encrypted snapshots

on:
  pull_request:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9]
    paths: [carr-library/**, .github/workflows/carr-sync.yml]
  push:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths: [carr-library/**, .github/workflows/carr-sync.yml]
  workflow_dispatch:

permissions:
  contents: read

# Keep distinct source acceptance runs alive while development continues.
# Duplicate push/PR runs of the same source still coalesce.
concurrency:
  group: carr-sync-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  windows-sync:
    name: Windows / encrypted snapshot and native transfer
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned desktop, encryption and test dependencies
        run: |
          New-Item -ItemType Directory -Force sync-ci-results | Out-Null
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source crypto, history and native-controller boundaries
        run: |
          python -m pytest -q -rs --junitxml=sync-ci-results/source.xml tests/sync tests/ui/test_portable_sync.py tests/ui/test_desktop_handlers.py --import-mode=importlib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed snapshot transfer
        run: |
          python -I scripts/installed_sync_probe.py 2>&1 | Tee-Object sync-ci-results/installed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native encrypted publication and restoration
        run: |
          python -I tests/ui/probe_portable_sync_native.py --native --encrypted 2>&1 | Tee-Object sync-ci-results/native.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain synthetic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-sync-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/sync-ci-results/
          if-no-files-found: warn
          retention-days: 7
