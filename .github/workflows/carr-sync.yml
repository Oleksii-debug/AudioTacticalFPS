name: CARR portable encrypted snapshots

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Called by the integrated desktop workflow so both platform jobs are mandatory.
# No owner archive, document, password, token or production signing key is used.
jobs:
  portable-sync:
    name: ${{ matrix.name }} / strict encrypted transfer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows CPython 3.11
            core_lock: packaging/windows-cp311.lock
            native: true
          - os: ubuntu-24.04
            name: Ubuntu CPython 3.11
            core_lock: packaging/linux-sync-core-cp311.lock
            native: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Resolve the exact pinned platform wheels once
        run: |
          New-Item -ItemType Directory -Force 'sync-ci-results' | Out-Null
          $environment = Join-Path $env:RUNNER_TEMP 'carr-sync-python'
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'carr-sync-dependency-wheels'
          New-Item -ItemType Directory -Force $wheelhouse | Out-Null
          python -I -B -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = if ($IsWindows) { Join-Path $environment 'Scripts/python.exe' } else { Join-Path $environment 'bin/python' }
          $locks = @('${{ matrix.core_lock }}', 'packaging/trusted-client.lock', 'packaging/windows-sync-test-cp311.lock')
          if ($IsWindows) { $locks += 'packaging/windows-sync-cp311.lock' }
          $lockArguments = @()
          foreach ($lock in $locks) { $lockArguments += @('-r', $lock) }
          & $python -I -B -m pip download --only-binary=:all: --require-hashes --dest $wheelhouse @lockArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip install --no-index --find-links $wheelhouse --only-binary=:all: --require-hashes @lockArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_SYNC_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_SYNC_WHEELS=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $inventory = @'
          from hashlib import sha256
          import importlib.metadata as metadata
          import json, pathlib, platform, re, subprocess, sys
          wheelhouse = pathlib.Path(sys.argv[1])
          locks = [pathlib.Path(path) for path in sys.argv[2:]]
          pins = {}
          for lock in locks:
              for name, version in re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', lock.read_text(encoding='utf-8'), re.M):
                  key = name.lower().replace('_', '-')
                  assert key not in pins or pins[key] == version
                  pins[key] = version
          assert {name: metadata.version(name) for name in pins} == pins
          files = sorted(wheelhouse.glob('*.whl'))
          assert files and all(path.is_file() for path in files)
          report = dict(status='PASS', source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              python=sys.version, platform=platform.platform(), installed_pins=pins,
              locks={path.as_posix(): sha256(path.read_bytes()).hexdigest() for path in locks},
              wheels=[dict(name=path.name, bytes=path.stat().st_size, sha256=sha256(path.read_bytes()).hexdigest()) for path in files])
          pathlib.Path('sync-ci-results/pinned-dependency-wheels.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, sort_keys=True), flush=True)
          '@
          $inventory | & $python -I -B - $wheelhouse @locks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and attest the exact application wheel
        run: |
          $applicationWheels = Join-Path $env:RUNNER_TEMP 'carr-sync-application-wheel'
          New-Item -ItemType Directory -Force $applicationWheels | Out-Null
          & $env:CARR_SYNC_PYTHON -I -B -m pip wheel --no-deps --no-build-isolation --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one source-bound application wheel.' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_SYNC_PYTHON -I -B -c "import sys,json,pathlib; sys.path.insert(0,str(pathlib.Path('packaging').resolve())); from source_wheel import verify_application_wheel; proof=verify_application_wheel(pathlib.Path(sys.argv[1]),pathlib.Path.cwd().parent,sys.argv[2]); print(json.dumps(dict(proof,status='PASS'),sort_keys=True))" $wheels[0].FullName $sourceCommit | Tee-Object 'sync-ci-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_SYNC_PYTHON -I -B -m pip install --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_SYNC_PYTHON -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require each source transfer and controller suite without skips
        run: |
          & $env:CARR_SYNC_PYTHON -B scripts/ci_check.py --jobs 1 tests/sync/test_archive.py tests/sync/test_crypto.py tests/sync/test_service.py tests/sync/test_complete_state.py tests/sync/test_cli.py tests/sync/test_vault.py tests/sync/test_service_commit_boundaries.py tests/ui/test_portable_sync.py 2>&1 | Tee-Object 'sync-ci-results/source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @('tests/sync/test_archive.py', 'tests/sync/test_crypto.py', 'tests/sync/test_service.py', 'tests/sync/test_complete_state.py', 'tests/sync/test_cli.py', 'tests/sync/test_vault.py', 'tests/sync/test_service_commit_boundaries.py', 'tests/ui/test_portable_sync.py')
          foreach ($suite in $required) {
            $pattern = '^PASS: ' + [regex]::Escape($suite) + ': junit_passed=[1-9][0-9]*, failed=0, skipped=0, pytest_exit=0$'
            if (@(Select-String -LiteralPath 'sync-ci-results/source.txt' -Pattern $pattern).Count -ne 1) { throw ("Missing strict source result: " + $suite) }
          }
      - name: Require the same source-bound installed transfer and controller suites
        run: |
          & $env:CARR_SYNC_PYTHON -I -B scripts/installed_sync_probe.py --report 'sync-ci-results/installed.xml' 2>&1 | Tee-Object 'sync-ci-results/installed.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual encrypted native publication and restore without egress
        if: ${{ matrix.native }}
        timeout-minutes: 3
        run: |
          $python = $env:CARR_SYNC_PYTHON
          $basePython = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $rulePrefix = 'CARR-sync-native-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Encrypted native acceptance requires active firewall profiles.' }
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Encrypted native outbound rules are incomplete.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Encrypted native rules do not cover every selected runtime.' }
            @{ status='PASS'; blocked_programs=$filters; scope='selected Python and native confirmation helpers; no whole-machine claim' } | ConvertTo-Json -Depth 4 | Set-Content 'sync-ci-results/native-firewall.json'
            & $python -I -B tests/ui/probe_portable_sync_native.py --native --encrypted 2>&1 | Tee-Object 'sync-ci-results/native.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual encrypted native transfer acceptance failed.' }
            $validate = @'
          import json, pathlib
          reports = []
          for line in pathlib.Path('sync-ci-results/native.txt').read_text(encoding='utf-8-sig').splitlines():
              try:
                  value = json.loads(line)
              except ValueError:
                  continue
              if isinstance(value, dict) and 'encrypted' in value and 'modules' in value:
                  reports.append(value)
          assert len(reports) == 1, 'Native encrypted transfer evidence is missing or ambiguous.'
          report = reports[0]
          required = set(["password entry uses named native masked controls","real desktop Library menu opens the snapshot window","snapshot window is modeless and parent-owned","real service publishes a transfer receipt","publication and listing never autofill the trust code","restore becomes available only after verification","real verified library exists at the new destination","restored library retains archived scope","current library and notebook never switch","cancelled work never accepts a verification preview","window closes after safe worker completion","parent drops the closed modeless window"])
          assert report['status'] == 'PASS' and report['encrypted'] is True and report['nvda'] == 'NOT_RUN'
          assert required <= set(report['checks']), report['checks']
          assert set(report['modules']) == {'carr_library.ui.portable_sync', 'carr_library.sync.service'}
          assert all(not pathlib.Path(path).resolve().is_relative_to(pathlib.Path.cwd().resolve()) for path in report['modules'].values())
          pathlib.Path('sync-ci-results/native.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report), flush=True)
          '@
            $validate | & $python -I -B -
            if ($LASTEXITCODE -ne 0) { throw 'Encrypted native evidence is incomplete.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Retain the exact optional Windows wheels only after actual acceptance
        if: ${{ success() && matrix.native }}
        run: |
          $retain = @'
          from hashlib import sha256
          import json, pathlib, shutil, sys
          source = pathlib.Path(sys.argv[1])
          expected = {'cryptography', 'cffi', 'pycparser', 'securesystemslib', 'tuf', 'urllib3'}
          retained = pathlib.Path('sync-ci-results/tested-optional-wheels')
          retained.mkdir()
          rows = []
          for wheel in sorted(source.glob('*.whl')):
              name = wheel.name.split('-', 1)[0].lower().replace('_', '-')
              if name in expected:
                  target = retained / wheel.name
                  shutil.copyfile(wheel, target)
                  digest = sha256(wheel.read_bytes()).hexdigest()
                  assert sha256(target.read_bytes()).hexdigest() == digest
                  rows.append(dict(distribution=name, name=wheel.name, sha256=digest, bytes=wheel.stat().st_size))
          assert {row['distribution'] for row in rows} == expected and len(rows) == len(expected)
          proof = json.loads(pathlib.Path('sync-ci-results/source-wheel-proof.json').read_text(encoding='utf-8-sig'))
          dependencies = json.loads(pathlib.Path('sync-ci-results/pinned-dependency-wheels.json').read_text(encoding='utf-8'))
          known = {row['name']: row['sha256'] for row in dependencies['wheels']}
          assert all(known[row['name']] == row['sha256'] for row in rows)
          result = dict(status='PASS', source_commit=proof['source_commit'], source_tree=proof['source_tree'], wheels=rows, locks=dependencies['locks'],
              source_tests='PASS', installed_tests='PASS', native_encrypted_transfer='PASS',
              production_entitlement='UNCONFIGURED', manual_nvda='NOT_RUN')
          pathlib.Path('sync-ci-results/tested-optional-wheels.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          '@
          $retain | & $env:CARR_SYNC_PYTHON -I -B - $env:CARR_SYNC_WHEELS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact-commit synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-sync-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/sync-ci-results/
          if-no-files-found: error
          retention-days: 7
