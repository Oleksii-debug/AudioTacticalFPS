name: CARR local and existing translation qualification
on:
  push:
    branches: ['carr/v3-acceptance-*', 'carr/local-translation-*']
    paths: ['carr-library/**', '.github/workflows/carr-local-translation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-local-translation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  translation:
    name: Windows / Basic native plus eight translation flows / source and installed
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact candidate before qualification
        run: |
          New-Item -ItemType Directory local-translation-results -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Candidate differs from event.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve candidate tree.' }
          @{
            schema = 1; status = 'NOT_RUN'; source_commit = $head; source_tree = $tree
            workflow_sha = $env:GITHUB_WORKFLOW_SHA; workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content -Encoding utf8 local-translation-results/source-provenance.json
          @{schema = 1; status = 'NOT_RUN'; actual_google_api = 'NOT_RUN'} |
            ConvertTo-Json | Set-Content -Encoding utf8 local-translation-results/local-translation-gate.json
          "CARR_TRANSLATION_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_TRANSLATION_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked candidate is dirty.' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Compile all current product and qualification sources
        run: |
          python -m compileall -q src scripts tests/loopback/test_translation_local_adapter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and install an exact source-bound wheel
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-local-translation-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $work) { throw 'Qualification environment must be fresh.' }
          $wheels = Join-Path $work 'wheels'
          New-Item -ItemType Directory $wheels -ErrorAction Stop | Out-Null
          python -m pip install --only-binary=:all: setuptools==84.2.1 wheel==0.48.0 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = @(Get-ChildItem -LiteralPath $wheels -Filter '*.whl')
          if ($built.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $venv = Join-Path $work 'installed'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -I -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --no-deps --no-index --no-compile $built[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --only-binary=:all: pytest==9.0.2 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = @'
          import importlib.metadata as metadata, json, pathlib, re, struct, sys
          pins = dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', pathlib.Path('packaging/windows-cp311.lock').read_text(), re.M))
          # Keep the historical runtime-17 receipt name; the restored lock has 18 pins.
          assert len(pins) == 18 and {name: metadata.version(name) for name in pins} == pins
          assert sys.platform == 'win32' and sys.flags.isolated and struct.calcsize('P') == 8
          print(json.dumps(pins, sort_keys=True))
          '@
          & $python -I -B -c $inventory | Tee-Object local-translation-results/runtime-17-pins.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_TRANSLATION_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_TRANSLATION_WHEEL=$($built[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Block external egress during finite local and synthetic translation qualification
        run: |
          New-NetFirewallRule -Name ("CARR-translation-scopes-" + $env:GITHUB_RUN_ID) -DisplayName 'CARR synthetic translation qualification' -Direction Outbound -Program $env:CARR_TRANSLATION_PYTHON -Action Block -Profile Any -ErrorAction Stop | Out-Null
      - name: Require installed Basic translation before the complete translation population
        timeout-minutes: 4
        run: |
          & $env:CARR_TRANSLATION_PYTHON -I -B -X utf8 scripts/windows_translation_smoke.py --output local-translation-results/translation-basic-native.json 2>&1 |
              Tee-Object local-translation-results/translation-basic-native.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verify = @'
          import hashlib, json, pathlib, re, sys
          from carr_library import providers
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate Basic native receipt key.')
                  result[key] = value
              return result
          def invalid_constant(value):
              raise ValueError('Nonfinite Basic native receipt value.')
          with pathlib.Path('local-translation-results/translation-basic-native.json').open('rb') as stream:
              raw = stream.read(65537)
          if len(raw) > 65536:
              raise ValueError('Basic native receipt exceeds its fixed bound.')
          report = json.loads(raw.decode('utf-8'), object_pairs_hook=unique,
                              parse_constant=invalid_constant)
          expected = {
              'schema': 'carr-native-translation-smoke/1', 'status': 'PASS',
              'native_controls': True, 'synthetic_provider_requests': 2,
              'exact_reviewed_pair': 'en->uk', 'source_immutable': True,
              'quotation_authority': False,
              'approval_and_folder_picker': 'injected explicit synthetic decisions',
              'actual_google_api': 'NOT_RUN', 'actual_credential_vault': 'NOT_RUN',
              'nvda': 'NOT_RUN',
          }
          if type(report) is not dict or set(report) != set(expected) | {'installed_module', 'derivative_hashes'}:
              raise ValueError('Basic native receipt fields differ.')
          for key, value in expected.items():
              if type(report[key]) is not type(value) or report[key] != value:
                  raise ValueError('Basic native receipt contract differs: ' + key)
          installed = pathlib.Path(providers.__file__).resolve(strict=True)
          site = (pathlib.Path(sys.prefix) / 'Lib' / 'site-packages').resolve(strict=True)
          if (sys.platform != 'win32' or not sys.flags.isolated
                  or type(report['installed_module']) is not str
                  or pathlib.Path(report['installed_module']).resolve(strict=True) != installed
                  or not installed.is_relative_to(site)
                  or hashlib.sha256(installed.read_bytes()).digest()
                     != hashlib.sha256(pathlib.Path('src/carr_library/providers.py').read_bytes()).digest()):
              raise ValueError('Basic native receipt does not bind the current installed provider.')
          hashes = report['derivative_hashes']
          if (type(hashes) is not dict
                  or set(hashes) != {'original.txt', 'translated.txt', 'bilingual.txt', 'translation.narration.json'}
                  or any(type(value) is not str or re.fullmatch('[0-9a-f]{64}', value) is None
                         for value in hashes.values())):
              raise ValueError('Basic native derivative digest inventory differs.')
          print('PASS: strict installed Basic translation native receipt')
          '@
          & $env:CARR_TRANSLATION_PYTHON -I -B -X utf8 -c $verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact source and installed cases plus eight actual native flows
        timeout-minutes: 40
        run: |
          $arguments = @('--checkout', (Get-Location).Path, '--wheel', $env:CARR_TRANSLATION_WHEEL,
                         '--output', (Join-Path (Get-Location) 'local-translation-results'),
                         '--source-commit', $env:CARR_TRANSLATION_COMMIT, '--source-tree', $env:CARR_TRANSLATION_TREE)
          & $env:CARR_TRANSLATION_PYTHON -I -B -X utf8 scripts/local_translation_acceptance.py @arguments 2>&1 |
              Tee-Object local-translation-results/acceptance.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content local-translation-results/local-translation-gate.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.source_cases -ne 324 -or $report.installed_cases -ne 324 -or
              $report.native_flows -ne 8 -or -not $report.installed_identity.isolated -or
              $report.source_commit -ne $env:CARR_TRANSLATION_COMMIT -or
              $report.source_tree -ne $env:CARR_TRANSLATION_TREE -or $report.actual_google_api -ne 'NOT_RUN') {
            throw 'Required exact candidate translation qualification is incomplete.'
          }
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during qualification.' }
      - name: Remove only the owned qualification firewall rule
        if: always()
        run: |
          Get-NetFirewallRule -Name ("CARR-translation-scopes-" + $env:GITHUB_RUN_ID) -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction Stop
      - name: Upload all raw scoped and selected translation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-local-translation-${{ github.sha }}
          path: carr-library/local-translation-results
          if-no-files-found: error
          retention-days: 14
