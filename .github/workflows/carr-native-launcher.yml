name: CARR native Windows launch entry

on:
  push:
    branches: [carr/v3-native-launcher-af5-20261126, carr/unified-publication-24-20261127]
  pull_request:
    branches: [carr-library]
    paths:
      # Every delivery candidate needs native launch evidence for its exact source.
      - carr-library/**
      - .github/workflows/carr-native-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-native-launcher-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python for stdlib-only probes
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Locate installed Microsoft x64 development tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Installed x64 MSVC toolchain not found.' }
          "CARR_VSDEVCMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile private native launcher and test child with MSVC
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "carr-library\packaging\native-launcher\build_msvc.ps1" -OutputDirectory "%RUNNER_TEMP%\carr-native-launcher-private"
          if errorlevel 1 exit /b %errorlevel%
      - name: Execute exact launcher on native Windows with synthetic child
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'carr-native-launcher-private'
          python carr-library/packaging/native-launcher/probe_windows.py --launcher "$private/ResearchLibrary.exe" --child "$private/windows_child_probe.exe" --report "$private/windows-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact source commit and private executable hashes
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD
          $private = Join-Path $env:RUNNER_TEMP 'carr-native-launcher-private'
          foreach ($name in @('build-evidence.json', 'windows-probe.json')) {
            $file = Join-Path $private $name
            if (Test-Path $file) { Get-Content $file }
          }
      # Deliberately no artifact-upload step: executables stay on the ephemeral runner.

  pinned-zig-native-launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python for the shared stdlib build and probe
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify the pinned official Zig distribution before extraction
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip' -OutFile $archive
          if ((Get-Item $archive).Length -ne 82229343) { throw 'Unexpected compiler archive length.' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c') { throw 'Compiler archive digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
      - name: Build private PE with the exact shared cross-build command
        shell: pwsh
        run: |
          $zig = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.14.1/zig.exe'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.14.1.zip'
          $private = Join-Path $env:RUNNER_TEMP 'carr-native-launcher-zig-private'
          python carr-library/packaging/native-launcher/build_launcher.py --zig $zig --toolchain-archive $archive --output-dir $private --build-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the Zig PE on actual Windows
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'carr-native-launcher-zig-private'
          python carr-library/packaging/native-launcher/probe_windows.py --launcher "$private/ResearchLibrary.exe" --child "$private/windows_child_probe.exe" --report "$private/windows-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record source and native-tested private executable identity
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD
          $private = Join-Path $env:RUNNER_TEMP 'carr-native-launcher-zig-private'
          foreach ($name in @('build-evidence.json', 'windows-probe.json')) {
            $file = Join-Path $private $name
            if (Test-Path $file) { Get-Content $file }
          }
      # No binary is uploaded. Compare this native-tested hash to a private cross build.
