name: Primary native assistant preflight

on:
  push:
    branches: [carr/assistant-native-411a-45917377964]
    paths: ['.github/workflows/carr-primary-native-assistant-411a.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-native-411a-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-native-assistant:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      ORT_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact primary application source under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fb06fa9f891a0301dd4b824b79774268f9e78561
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the existing pinned desktop dependencies and actual application
        run: |
          New-Item -ItemType Directory -Force 'ci-assistant-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-assistant-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real native assistant controls and reopened durable jobs offline
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path (Split-Path $python) 'pythonw.exe'),
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-assistant-411a-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Required firewall profiles are not enabled.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Required runtime egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Firewall coverage differs from the tested programs.' }
            @{ status='PASS'; blocked_programs=$filters; profiles_enabled=@($profiles.Name); scope='selected runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-assistant-results/runtime-firewall.json'
            $probe = @'
          import hashlib, importlib.util, json, os, pathlib, subprocess, sys, tempfile
          if sys.platform != 'win32':
              raise RuntimeError('This preflight requires actual Windows.')
          import wx
          import carr_library
          source = pathlib.Path.cwd() / 'src' / 'carr_library'
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert not installed.is_relative_to(source.resolve())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert commit == 'fb06fa9f891a0301dd4b824b79774268f9e78561'
          assert tree == '43803e249736510966bbcf2756225f57ccc219b8'
          spec = importlib.util.spec_from_file_location('native_assistant_acceptance', pathlib.Path('scripts/windows_assistant_smoke.py'))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          hashes = {}
          for name in module.SOURCE_FILES:
              raw = (source / name).read_bytes()
              assert (installed / name).read_bytes() == raw, name
              hashes[name] = hashlib.sha256(raw).hexdigest()
          app = wx.App(False)
          with tempfile.TemporaryDirectory(prefix='carr-native-assistant-Архів-') as temporary:
              result = module.exercise_controls(pathlib.Path(temporary), wx)
          assert tuple(result['checks']) == module.EXPECTED_CHECKS
          for name, expected in hashes.items():
              assert hashlib.sha256((source / name).read_bytes()).hexdigest() == expected
          result.update(status='PASS', windows_execution='PASS', installed_modules='PASS',
                        source_commit=commit, source_tree=tree, source_hashes=hashes,
                        workflow_head_sha=os.environ['GITHUB_SHA'],
                        execution_context='isolated-installed-application',
                        final_bundle_acceptance='NOT_RUN', manual_nvda='NOT_RUN', paid_api='NOT_RUN')
          pathlib.Path('ci-assistant-results/native-assistant.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, allow_nan=False))
          '@
            $probe | & $python -I -B - 2>&1 | Tee-Object 'ci-assistant-results/native-assistant.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native assistant acceptance failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve synthetic text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-primary-native-assistant-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-assistant-results/*.json
            carr-library/ci-assistant-results/*.txt
          retention-days: 7
