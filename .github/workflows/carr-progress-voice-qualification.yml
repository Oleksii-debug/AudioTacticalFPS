name: CARR explicit local progress voice qualification

on:
  push:
    branches: [work/local-progress-voice-bbd7-a49c]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-progress-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-real-windows-speech:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned native desktop and exact product source
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest==9.0.2 --only-binary=:all:
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'ci-progress-voice' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-progress-voice/tested-commit.txt'
      - name: Required non-skipping source contracts and actual backup producer
        run: |
          $suites = @(
            'tests/test_progress.py',
            'tests/ui/test_progress_view.py',
            'tests/ui/test_audio_playback_controls.py',
            'tests/audio/test_progress_speech.py',
            'tests/ui/test_progress_voice.py'
          )
          foreach ($suite in $suites) {
            $name = $suite.Replace('/', '_')
            python scripts/ci_check.py $suite 2>&1 | Tee-Object "ci-progress-voice/$name.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain installed native progress and preference behavior
        timeout-minutes: 3
        run: |
          python -I -B scripts/windows_progress_smoke.py 2>&1 | Tee-Object 'ci-progress-voice/native-controls.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual SAPI PCM and native notification/content ownership
        timeout-minutes: 3
        run: |
          python -I -B scripts/windows_progress_voice_smoke.py --native --output 'ci-progress-voice/native-voice-result.json' 2>&1 | Tee-Object 'ci-progress-voice/native-voice.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthetic source-bound evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-progress-voice-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-progress-voice/
          if-no-files-found: warn
          retention-days: 7
