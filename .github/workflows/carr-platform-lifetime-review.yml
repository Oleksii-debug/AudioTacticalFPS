name: Native platform and EPUB correction review
on:
  push:
    branches: [carr/platform-lifetime-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-platform-lifetime-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-lifetime-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carr-library
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact native desktop
        run: python -m pip install ".[test,desktop]"
      - name: Prepare pinned Windows test audio runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-native-correction-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_NATIVE_CORRECTION_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require actual EPUB transport regression suite
        run: |
          New-Item -ItemType Directory -Force 'ci-platform-lifetime' | Out-Null
          python scripts/ci_check.py --diagnostics --jobs 1 tests/reader/test_ebook_audio.py 2>&1 | Tee-Object 'ci-platform-lifetime/epub-regressions.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require real Windows lifecycle and EPUB playback with egress blocked
        if: "!cancelled()"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'ci-platform-lifetime' | Out-Null
          $python = (Get-Command python.exe).Source
          $base = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpeg = Join-Path $env:CARR_NATIVE_CORRECTION_AUDIO 'bin/ffmpeg.exe'
          $ffprobe = Join-Path $env:CARR_NATIVE_CORRECTION_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_NATIVE_CORRECTION_AUDIO;
             ffmpeg=@{ path=$ffmpeg; sha256=(Get-FileHash -LiteralPath $ffmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$ffprobe; sha256=(Get-FileHash -LiteralPath $ffprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-platform-lifetime/external-test-audio-binding.json'
          $programs = @($python, $base, (Get-Process -Id $PID).Path,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_NATIVE_CORRECTION_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_NATIVE_CORRECTION_AUDIO 'bin/ffprobe.exe')) |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $prefix = 'CARR-platform-lifetime-' + [guid]::NewGuid().ToString('N')
          $rules = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $name = $prefix + '-' + $rules.Count
              $rules += $name
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $rules -ErrorAction Stop)
            if (@(Get-NetFirewallProfile | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0 -or $active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Runtime denial is not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Runtime denial does not cover the selected processes.' }
            @{ status='PASS'; blocked_programs=$filters; scope='selected runtime executables' } | ConvertTo-Json -Depth 3 | Set-Content 'ci-platform-lifetime/firewall.json'
            $failed = @()
            $probes = @(
              @{ name='platform'; script='scripts/windows_platform_tools_smoke.py'; arguments=@() },
              @{ name='epub'; script='scripts/windows_epub_reading_smoke.py'; arguments=@('--audio-evidence', 'ci-platform-lifetime/external-test-audio-binding.json') }
            )
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 -X faulthandler $scriptPath @probeArgs 2>&1 | Tee-Object (Join-Path 'ci-platform-lifetime' ($probe.name + '.txt'))
              $observedExit = $LASTEXITCODE
              Write-Output ($probe.name + ' native exit: ' + $observedExit)
              if ($observedExit -ne 0) { $failed += ($probe.name + ': ' + $observedExit) }
            }
            if ($failed.Count -ne 0) { throw ('Native correction probes failed: ' + ($failed -join '; ')) }
          } finally {
            foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
            if (@(Get-NetFirewallRule -Name ($prefix + '*') -ErrorAction SilentlyContinue).Count -ne 0) { throw 'Owned runtime firewall cleanup remained pending.' }
          }
      - name: Preserve exact identity
        if: always()
        run: |
          New-Item -ItemType Directory -Force 'ci-platform-lifetime' | Out-Null
          git rev-parse HEAD | Out-File 'ci-platform-lifetime/commit.txt'
          python -m pip freeze | Out-File 'ci-platform-lifetime/packages.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: platform-lifetime-${{ github.sha }}
          path: carr-library/ci-platform-lifetime
          if-no-files-found: error
