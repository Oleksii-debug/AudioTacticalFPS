name: CARR incremental complete backup snapshots

on:
  push:
    branches: ['carr/snapshots-r8-*', 'carr/v3-acceptance-*']
    paths:
      - carr-library/**
      - .github/workflows/carr-incremental-backups.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-incremental-backups-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  incremental-snapshots:
    name: Windows / exact source installed and native complete snapshots
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact pinned profile and candidate package
        run: |
          New-Item -ItemType Directory -Force incremental-results | Out-Null
          python -m compileall -q src tests scripts packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-integrated-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Candidate source differs from its event.' }
          $head | Set-Content incremental-results/tested-commit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse 'HEAD^{tree}' | Set-Content incremental-results/tested-tree.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import importlib.metadata as m,json,pathlib,re
          pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-integrated-cp311.lock').read_text(),re.M))
          assert len(pins)==56 and {name:m.version(name) for name in pins}==pins
          print(json.dumps(dict(status='PASS',integrated_runtime_pins=pins),sort_keys=True))
          '@ | python -I -B - 2>&1 | Tee-Object incremental-results/runtime-56-pins.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact source cases without skips
        timeout-minutes: 15
        run: |
          $oracle = Get-Content -LiteralPath scripts/incremental_acceptance_oracle.json -Raw | ConvertFrom-Json
          [string[]]$suites = @($oracle.suites)
          python scripts/ci_check.py --jobs 2 @suites 2>&1 | Tee-Object incremental-results/source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json,pathlib,re
          oracle=json.loads(pathlib.Path('scripts/incremental_acceptance_oracle.json').read_text(encoding='utf-8'))
          raw=pathlib.Path('incremental-results/source.txt').read_text(encoding='utf-8-sig')
          expected={name.replace('.','/')+'.py':sum(functions.values()) for name,functions in oracle['functions'].items()}
          observed={}
          for verdict,path,count,failed,skipped,code in re.findall(r'(PASS|FAIL): (\S+): junit_passed=(\d+), failed=(\d+), skipped=(\d+), pytest_exit=(\d+)',raw):
              assert path not in observed, path
              assert verdict=='PASS' and failed==skipped==code=='0',(path,verdict,failed,skipped,code)
              observed[path]=int(count)
          assert observed==expected,(observed,expected)
          report=dict(status='PASS',cases=observed,passed=sum(observed.values()),failed=0,skipped=0)
          pathlib.Path('incremental-results/source-proof.json').write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact isolated installed source and every regression case
        timeout-minutes: 15
        run: |
          @'
          from collections import Counter
          from hashlib import sha256
          import importlib,json,pathlib,sys,xml.etree.ElementTree as E
          import pytest
          assert sys.platform=='win32' and sys.flags.isolated
          root=pathlib.Path.cwd().resolve()
          oracle=json.loads((root/'scripts/incremental_acceptance_oracle.json').read_text(encoding='utf-8'))
          origins={}
          for name in oracle['origins']:
              path=pathlib.Path(importlib.import_module(name).__file__).resolve()
              expected=root/'src'/pathlib.Path(*name.split('.')).with_suffix('.py')
              assert path.is_relative_to(pathlib.Path(sys.prefix).resolve()),name
              digest=sha256(path.read_bytes()).hexdigest()
              assert digest==sha256(expected.read_bytes()).hexdigest(),name
              origins[name]=dict(path=str(path),sha256=digest)
          code=pytest.main(['-q','-o','addopts=','-o','pythonpath=','-o','xfail_strict=true','--import-mode=importlib','--junitxml=incremental-results/installed.xml',*oracle['suites']])
          if code: raise SystemExit(code)
          cases=list(E.parse('incremental-results/installed.xml').iter('testcase'))
          observed={}
          for name,functions in oracle['functions'].items():
              selected=[c for c in cases if c.get('classname')==name]
              assert all(not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in selected),name
              counts=Counter(c.get('name','').split('[',1)[0] for c in selected)
              assert counts==Counter(functions),(name,counts,functions)
              observed[name]=len(selected)
          assert len(cases)==sum(observed.values()),'unaccounted cases'
          for record in origins.values():
              assert sha256(pathlib.Path(record['path']).read_bytes()).hexdigest()==record['sha256']
          report=dict(status='PASS',source_commit=(root/'incremental-results/tested-commit.txt').read_text(encoding='utf-8-sig').strip(),source_tree=(root/'incremental-results/tested-tree.txt').read_text(encoding='utf-8-sig').strip(),actual_windows=True,installed_package=True,isolated=True,module_origins=origins,cases=observed,passed=len(cases),failed=0,skipped=0,nvda='NOT_RUN',sealed_installer='NOT_RUN',full_platform='NOT_CLAIMED')
          (root/'incremental-results/installed-proof.json').write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          '@ | python -I -B - 2>&1 | Tee-Object incremental-results/installed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual native snapshot controls and full backup round trip
        timeout-minutes: 5
        run: |
          python -I -B scripts/incremental_native_gate.py 2>&1 | Tee-Object incremental-results/native.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked candidate source changed during acceptance.' }
      - name: Retain exact source logs and installed receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-incremental-backups-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/incremental-results/
          if-no-files-found: warn
          retention-days: 7
