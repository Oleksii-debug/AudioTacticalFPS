name: CARR sealed Windows bundle qualification

# Installer/runtime qualification is separate from the required full source gate.
on:
  push:
    branches: [carr/sealed-bundle-validation-20261127]
    paths:
      - .github/workflows/carr-sealed-bundle-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-sealed-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Sealed Windows x64 / CPython 3.11 / b1756d3
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_COMMIT: 'b1756d30655a387a487a95086f4fd79a37c88a63'
    steps:
      - name: Preserve exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the immutable qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'b1756d30655a387a487a95086f4fd79a37c88a63'
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Record the independent installer qualification scope
        run: |
          $scope = @'
          import json, pathlib, subprocess
          expected = 'b1756d30655a387a487a95086f4fd79a37c88a63'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected
          evidence = {
              'schema_version': 1,
              'qualification_scope': 'sealed Windows installer and installed runtime',
              'source_commit': actual,
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'full_source_suites': 'NOT_RUN_IN_THIS_WORKFLOW',
              'full_source_gate': 'SEPARATE_AND_REQUIRED',
              'full_source_workflow': '.github/workflows/carr-windows.yml',
              'release_qualification': 'NOT_CLAIMED',
              'nvda': 'NOT_RUN',
          }
          destination = pathlib.Path('ci-results')
          destination.mkdir(exist_ok=True)
          (destination / 'qualification-scope.json').write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, sort_keys=True), flush=True)
          '@
          $scope | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate embedded Python and explicit acceptance paths
        timeout-minutes: 2
        run: |
          $syntax = @'
          import ast, json, pathlib, re, textwrap
          project = pathlib.Path.cwd()
          source = (project.parent / '.github/workflows/carr-windows.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"^          \$\w+ = @'\n(.*?)^          '@$", source, re.M | re.S)
          assert blocks
          for number, block in enumerate(blocks, 1):
              ast.parse(textwrap.dedent(block), filename=f'workflow-python-{number}')
          inline = re.findall(r'^          &[^\r\n]*? -c "([^"\r\n]+)"', source, re.M)
          for number, expression in enumerate(inline, 1):
              ast.parse(expression, filename=f'workflow-inline-{number}')
          matches = re.findall(r'\$suites = @\(\n(.*?)\n          \)', source, re.S)
          assert len(matches) == 1
          suites = re.findall(r"'([^']+)'", matches[0])
          assert suites and len(suites) == len(set(suites))
          assert 'tests/audio/test_engines.py' not in suites
          assert all('probe_backup_v4_producer_models.py' not in name for name in suites)
          assert all((project / name).is_file() for name in suites)
          native_scripts = re.findall(r"^            @\{ Script='([^']+)'", source, re.M)
          assert native_scripts and len(native_scripts) == len(set(native_scripts))
          assert all((project / name).is_file() for name in native_scripts)
          print(json.dumps({'status': 'PASS', 'python_blocks': len(blocks), 'python_inline': len(inline),
                            'required_source_suites': len(suites), 'installed_native_gates': len(native_scripts)}))
          '@
          $syntax | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the actual desktop package in a fresh environment
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checkout does not match the exact event head.' }
          $sourceCommit | Set-Content 'ci-results/tested-commit.txt'
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,runpy; read_lock=runpy.run_path('packaging/build_windows_bundle.py')['read_lock']; locked=read_lock(pathlib.Path('packaging/windows-semantic-cp311.lock')); pins={name:value[0] for name,value in locked.items()}; actual={name:m.version(name) for name in pins}; assert pins and actual==pins; print(json.dumps(dict(status='PASS',count=len(pins),versions=actual),sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESSDATA_PREFIX=$(Join-Path $ocr 'tessdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the pinned audio tools before required audio regressions
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $audioCache = Join-Path $bundleWork 'audio-cache'
          $audioRuntime = Join-Path $bundleWork 'audio-runtime'
          & $env:CARR_PYTHON packaging/acquire_audio_runtime.py --output $audioCache --download | Tee-Object 'ci-results/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON packaging/prepare_audio_runtime.py --archive (Join-Path $audioCache $audioLock.archive.name) --sources-dir $audioCache --output $audioRuntime | Tee-Object 'ci-results/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioBin = Join-Path $audioRuntime 'bin'
          "CARR_CI_AUDIO_RUNTIME=$audioRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_FFMPEG=$(Join-Path $audioBin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the exact test font for real OCR fixtures
        timeout-minutes: 2
        run: |
          # A test fixture only. It is outside src and never joins the product wheel.
          $font = @'
          import hashlib, json, pathlib, urllib.request
          target = pathlib.Path('DejaVuSans.ttf')
          url = 'https://raw.githubusercontent.com/matplotlib/matplotlib/4aeb773422464799998d900198b35cb80e94b3e1/lib/matplotlib/mpl-data/fonts/ttf/DejaVuSans.ttf'
          with urllib.request.urlopen(url, timeout=45) as response:
              raw = response.read(756073)
          assert len(raw) == 756072
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()
          assert blob == '5267218852f631928716a8005d7bf4b492aaf83d'
          with target.open('xb') as stream:
              stream.write(raw)
          from PIL import ImageFont
          ImageFont.truetype(str(target), 72)
          print(json.dumps({'status': 'PASS', 'git_blob': blob, 'sha256': hashlib.sha256(raw).hexdigest(), 'test_fixture_only': True}))
          '@
          $font | & $env:CARR_PYTHON -I -B - | Tee-Object 'ci-results/ocr-test-font.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR model manager before long suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/installed-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check observed Windows format and OCR regressions before long suites
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_document_formats_text.py tests/extract/test_ocr_languages.py tests/extract/test_managed_ocr.py tests/e2e/test_managed_ocr_import.py tests/ui/test_ocr_selection.py 2>&1 | Tee-Object 'ci-results/platform-regressions.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the pinned local model through the existing upstream verifier
        timeout-minutes: 10
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'carr-model-ci/minilm'
          $modelManifest = Join-Path $env:RUNNER_TEMP 'carr-model-ci/model-manifest.json'
          $acquire = @'
          import importlib.util, json, pathlib, shutil, sys
          from huggingface_hub import hf_hub_download
          spec = importlib.util.spec_from_file_location('model_build', pathlib.Path('packaging/model_bundle.py').resolve())
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          target, manifest = map(pathlib.Path, sys.argv[1:])
          target.mkdir(parents=True, exist_ok=False)
          for name in sorted(helper.FILES):
              source = hf_hub_download(helper.REPO, name, revision=helper.REVISION, cache_dir=target.parent / 'cache', token=False)
              shutil.copyfile(source, target / name)
          proof = helper.seal(target)
          with manifest.open('x', encoding='utf-8') as stream:
              json.dump(proof, stream, sort_keys=True)
          print(json.dumps({'status': 'PASS', 'revision': helper.REVISION, 'files': len(proof['hashes'])}))
          '@
          # Only this explicit build-time child may fetch the pinned public model.
          # Importing the application before acquisition would enforce offline mode.
          $env:HF_HUB_OFFLINE = '0'
          try {
            $acquire | & $env:CARR_PYTHON -I -B - $model $modelManifest | Tee-Object 'ci-results/model-acquisition.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:HF_HUB_OFFLINE = '1'
          }
          & $env:CARR_PYTHON -I -B -c "import sys; from carr_library.semantic import verify_model_bundle; verify_model_bundle(sys.argv[1], sys.argv[2]); print('PASS: exact approved local model')" $model $modelManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_MODEL_DIR=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_MODEL_MANIFEST=$modelManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install and exercise the complete bundle with runtime egress blocked
        timeout-minutes: 35
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $baseBundle = Join-Path $bundleWork 'base bundle'
          $nativeBundle = Join-Path $bundleWork 'native bundle'
          $bundle = Join-Path $bundleWork 'complete bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes -r packaging/windows-semantic-cp311.lock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $applicationWheel = $wheels[0].FullName
          $runtime = Get-Content packaging/windows-python.json -Raw | ConvertFrom-Json
          $pythonArchive = Join-Path $bundleWork 'windows-python.tar.gz'
          Invoke-WebRequest -Uri $runtime.download.url -OutFile $pythonArchive
          $archiveHash = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.download.sha256) { throw 'Pinned Python archive checksum mismatch.' }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          if (!(Test-Path -LiteralPath $ocrSource -PathType Leaf) -or $ocr -ne $env:CARR_CI_OCR_DIR) { throw 'Verified source-test OCR runtime is missing.' }
          $nativeLock = Get-Content packaging/native-runtime/source-lock.json -Raw | ConvertFrom-Json
          $nativePackage = Join-Path $bundleWork 'native-runtime.conda'
          Invoke-WebRequest -Uri $nativeLock.package.url -OutFile $nativePackage
          if ((Get-Item -LiteralPath $nativePackage).Length -ne $nativeLock.package.size) { throw 'Pinned native package size mismatch.' }
          if ((Get-FileHash -LiteralPath $nativePackage -Algorithm SHA256).Hash.ToLowerInvariant() -ne $nativeLock.package.sha256) { throw 'Pinned native package checksum mismatch.' }
          $nativeRuntime = Join-Path $bundleWork 'native-runtime'
          & $env:CARR_PYTHON packaging/prepare_native_runtime.py --package $nativePackage --output $nativeRuntime | Tee-Object 'ci-results/native-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyWheel = @'
          import importlib.util, json, pathlib, sys
          project = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('source_wheel', project / 'packaging/source_wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          proof = module.verify_application_wheel(sys.argv[1], project.parent, sys.argv[2])
          print(json.dumps(dict(status='PASS', **proof)))
          '@
          $verifyWheel | & $env:CARR_PYTHON -I -B - $applicationWheel $sourceCommit | Tee-Object 'ci-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testedWheels = New-Item -ItemType Directory -Force 'ci-results/tested-application-wheel'
          Copy-Item -LiteralPath $applicationWheel -Destination $testedWheels.FullName
          & $env:CARR_PYTHON packaging/build_windows_bundle.py --wheel $applicationWheel --wheelhouse $wheelhouse --lock packaging/windows-semantic-cp311.lock --sbom packaging/windows-semantic-sbom.cdx.json --python-archive $pythonArchive --model-dir $env:CARR_CI_MODEL_DIR --model-manifest $env:CARR_CI_MODEL_MANIFEST --ocr-dir $ocr --ocr-source-archive $ocrSource --source-commit $sourceCommit --output $baseBundle | Tee-Object 'ci-results/full-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_native_runtime.py --bundle $baseBundle --native-runtime $nativeRuntime --output $nativeBundle | Tee-Object 'ci-results/full-bundle-native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_audio_runtime.py --bundle $nativeBundle --audio-runtime $env:CARR_CI_AUDIO_RUNTIME --output $bundle | Tee-Object 'ci-results/full-bundle-audio-supplement.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifySbom = @'
          import hashlib, json, pathlib, subprocess, sys
          root, commit = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = subprocess.run(['git', 'show', commit + ':carr-library/packaging/windows-semantic-sbom.cdx.json'], check=True, capture_output=True).stdout
          actual = (root / 'runtime-sbom.cdx.json').read_bytes()
          manifest = json.loads((root / 'bundle-manifest.json').read_text(encoding='utf-8'))
          tree = subprocess.run(['git', 'rev-parse', commit + '^{tree}'], check=True, capture_output=True, text=True).stdout.strip()
          if actual != expected or manifest['source_commit'] != commit or manifest['source_tree'] != tree:
              raise ValueError('The completed bundle does not contain the exact committed runtime SBOM/source identity.')
          digest = hashlib.sha256(actual).hexdigest()
          if manifest['files'].get('runtime-sbom.cdx.json') != digest:
              raise ValueError('The completed bundle does not seal the verified runtime SBOM bytes.')
          print(json.dumps(dict(status='PASS', source_commit=commit, source_tree=tree, sbom_sha256=digest, after_native_supplement=True, after_audio_supplement=True)))
          '@
          $verifySbom | & $env:CARR_PYTHON -I -B - $bundle $sourceCommit | Tee-Object 'ci-results/full-bundle-sbom-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Join-Path $bundle 'bundle-manifest.json'
          $manifestBefore = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $installedPython = Join-Path $bundle '.venv/Scripts/python.exe'
          # Finish test-only acquisition before the offline execution boundary.
          $testWheels = Join-Path $env:RUNNER_TEMP 'carr-test-wheels'
          New-Item -ItemType Directory -Force $testWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --dest $testWheels pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @(
            $bundledPython,
            (Join-Path $bundle 'runtime/pythonw.exe'),
            $installedPython,
            (Join-Path $bundle '.venv/Scripts/pythonw.exe'),
            (Join-Path $bundle 'ocr/tesseract.exe'),
            (Join-Path $bundle 'audio-runtime/bin/ffmpeg.exe'),
            (Join-Path $bundle 'audio-runtime/bin/ffprobe.exe'),
            (Join-Path $bundle 'audio-runtime/bin/ffplay.exe'),
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')
          ) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          if (@($programs | Sort-Object -Unique).Count -ne 10) { throw 'Every intended runtime/helper must have one distinct outbound block.' }
          $rulePrefix = 'CARR-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
          # Temporary rules on this disposable CI VM. Fail before execution if
          # Windows Firewall cannot enforce every runtime program's outbound block.
          Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
          foreach ($program in $programs) {
            $ruleName = $rulePrefix + '-' + $ruleNames.Count
            $ruleNames += $ruleName
            New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
          }
          $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
          if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline checks require enabled Windows Firewall profiles.' }
          $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
          if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline execution rules are not active.' }
