name: Supplied transcription bridge acceptance
on:
  pull_request:
    branches: [carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-transcription-bridge.yml']
  push:
    branches: [carr-library, carr/v3-integrated-final-dbbb-20261126, carr/ci-endpoint-evaluation-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-transcription-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transcription-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the actual source package and test dependencies
        shell: pwsh
        run: |
          git rev-parse HEAD
          python -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src scripts/windows_transcription_smoke.py tests/transcription
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained inputs, actual child protocol, recovery and CLI
        shell: pwsh
        run: |
          python scripts/ci_check.py tests/assistant/test_transcription_workflow.py tests/transcription/test_supplied_worker_bridge.py tests/storage/test_transcription_recovery.py tests/storage/test_import_publication_backup.py tests/ui/test_progress_job_review.py tests/transcription/test_protocol_routing.py tests/transcription/test_owned_admission.py tests/transcription/test_protocol_fixture.py tests/transcription/test_runtime_admission.py tests/transcription/test_service.py tests/transcription/test_admission_boundaries.py tests/transcription/test_restore.py tests/e2e/test_transcription_cli.py tests/storage/test_transcription_backup.py tests/storage/test_transcription_composite_backup.py tests/operations/test_resources.py tests/operations/test_facade.py tests/operations/test_transcription_views.py tests/e2e/test_operations_cli.py tests/storage/test_atomic_state_publication.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require native POSIX inherited-reservation ownership
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          python scripts/ci_check.py tests/operations_posix/test_fork_ownership.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual Windows reader-handle publication
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci_check.py tests/transcription_windows/test_protocol_fixture_handles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install actual native desktop controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native controls and shared background operation
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -I -B -X utf8 scripts/windows_transcription_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

