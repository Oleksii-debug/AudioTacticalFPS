name: Supplied transcription bridge acceptance
on:
  pull_request:
    branches: [carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-transcription-bridge.yml']
  push:
    branches: [feature/supplied-transcription-20261127-137c, carr-library, carr/canonical-completion-2aa-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-transcription-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transcription-bridge-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: carr-library
    env:
      CARR_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the actual source package and test dependencies
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:CARR_TEST_COMMIT) { throw 'Unexpected source commit.' }
          git rev-parse HEAD
          python -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src scripts/windows_transcription_smoke.py tests/transcription
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained inputs, actual child protocol, recovery and CLI
        shell: pwsh
        run: |
          python scripts/ci_check.py --jobs 2 tests/transcription/test_supplied_worker_bridge.py tests/transcription/test_v5_worker_profile.py tests/storage/test_backup_transcription.py tests/ui/test_progress_job_review.py tests/storage/test_durable_state_read.py tests/storage/test_state_replacement.py tests/storage/test_durable_state_publication.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual Windows JSON sharing and native handle ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -I -B -m pytest -q -o pythonpath= --import-mode=importlib tests/storage/test_durable_state_windows_read.py --junitxml=windows-json-sharing.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('windows-json-sharing.xml').iter('testcase')); required={'test_windows_unshared_reader_reproduces_atomic_child_replace_denial','test_windows_json_reader_allows_atomic_child_replace_and_keeps_old_snapshot','test_windows_real_handle_is_closed_if_descriptor_transfer_fails','test_windows_real_descriptor_is_closed_if_stream_construction_fails','test_windows_json_handle_is_not_inheritable','test_windows_legacy_replace_still_refuses_a_delete_shared_target'}; assert required=={c.get('name') for c in cases} and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')); print('PASS: six actual Windows publication and native handle barriers')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install actual native desktop controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native controls and shared background operation
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -I -B -X utf8 scripts/windows_transcription_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
