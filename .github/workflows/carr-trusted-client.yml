name: CARR signed client and maintenance boundaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Both matrix jobs are required by the integrated desktop workflow.
# Synthetic keys/local transports only; no production issuer, activation or NVDA claim.
jobs:
  signed-client:
    name: ${{ matrix.name }} / strict signed client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows CPython 3.11
            core_lock: packaging/windows-cp311.lock
            native: true
          - os: ubuntu-24.04
            name: Ubuntu CPython 3.11
            core_lock: packaging/linux-sync-core-cp311.lock
            native: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Resolve the exact pinned platform wheels once
        run: |
          New-Item -ItemType Directory -Force 'trusted-results' | Out-Null
          $environment = Join-Path $env:RUNNER_TEMP 'carr-trust-python'
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'carr-trust-dependency-wheels'
          New-Item -ItemType Directory -Force $wheelhouse | Out-Null
          python -I -B -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = if ($IsWindows) { Join-Path $environment 'Scripts/python.exe' } else { Join-Path $environment 'bin/python' }
          $locks = @('${{ matrix.core_lock }}', 'packaging/trusted-client.lock', 'packaging/windows-sync-test-cp311.lock')
          $lockArguments = @()
          foreach ($lock in $locks) { $lockArguments += @('-r', $lock) }
          & $python -I -B -m pip download --only-binary=:all: --require-hashes --dest $wheelhouse @lockArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip install --no-index --find-links $wheelhouse --only-binary=:all: --require-hashes @lockArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_TRUST_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_TRUST_WHEELS=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $inventory = @'
          from hashlib import sha256
          import importlib.metadata as metadata
          import json, pathlib, platform, re, subprocess, sys
          wheelhouse = pathlib.Path(sys.argv[1])
          locks = [pathlib.Path(path) for path in sys.argv[2:]]
          pins = {}
          for lock in locks:
              for name, version in re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', lock.read_text(encoding='utf-8'), re.M):
                  key = name.lower().replace('_', '-')
                  assert key not in pins or pins[key] == version
                  pins[key] = version
          assert {name: metadata.version(name) for name in pins} == pins
          files = sorted(wheelhouse.glob('*.whl'))
          assert files and all(path.is_file() for path in files)
          report = dict(status='PASS', source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              python=sys.version, platform=platform.platform(), installed_pins=pins,
              locks={path.as_posix(): sha256(path.read_bytes()).hexdigest() for path in locks},
              wheels=[dict(name=path.name, bytes=path.stat().st_size, sha256=sha256(path.read_bytes()).hexdigest()) for path in files])
          pathlib.Path('trusted-results/pinned-dependency-wheels.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, sort_keys=True), flush=True)
          '@
          $inventory | & $python -I -B - $wheelhouse @locks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and attest the exact application wheel
        run: |
          $applicationWheels = Join-Path $env:RUNNER_TEMP 'carr-trust-application-wheel'
          New-Item -ItemType Directory -Force $applicationWheels | Out-Null
          & $env:CARR_TRUST_PYTHON -I -B -m pip wheel --no-deps --no-build-isolation --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one source-bound application wheel.' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_TRUST_PYTHON -I -B -c "import sys,json,pathlib; sys.path.insert(0,str(pathlib.Path('packaging').resolve())); from source_wheel import verify_application_wheel; proof=verify_application_wheel(pathlib.Path(sys.argv[1]),pathlib.Path.cwd().parent,sys.argv[2]); print(json.dumps(dict(proof,status='PASS'),sort_keys=True))" $wheels[0].FullName $sourceCommit | Tee-Object 'trusted-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_TRUST_PYTHON -I -B -m pip install --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_TRUST_PYTHON -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require every source authority and maintenance suite without skips
        run: |
          $suites = @('tests/packaging/test_managed_launch_boundary.py', 'tests/packaging/test_managed_update_native_policy.py', 'tests/packaging/test_native_launcher_bundle.py', 'tests/packaging/test_standard_installer.py', 'tests/security/test_anchor_locking.py', 'tests/security/test_canonical_boundary.py', 'tests/security/test_controller.py', 'tests/security/test_entitlements.py', 'tests/security/test_idle_renewal.py', 'tests/security/test_independent_review_boundaries.py', 'tests/security/test_installation.py', 'tests/security/test_managed_installation.py', 'tests/security/test_managed_registration.py', 'tests/security/test_publication_integrity.py', 'tests/security/test_refresh.py', 'tests/security/test_updates.py', 'tests/ui/test_trust_status_handlers.py')
          $suites += 'tests/packaging/test_installed_trusted_client_probe.py'
          if ($IsWindows) { $suites += 'tests/security/test_windows_vault.py' }
          & $env:CARR_TRUST_PYTHON -B scripts/ci_check.py --jobs 3 @suites 2>&1 | Tee-Object 'trusted-results/source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in $suites) {
            $pattern = '^PASS: ' + [regex]::Escape($suite) + ': junit_passed=[1-9][0-9]*, failed=0, skipped=0, pytest_exit=0$'
            if (@(Select-String -LiteralPath 'trusted-results/source.txt' -Pattern $pattern).Count -ne 1) { throw ("Missing strict source result: " + $suite) }
          }
          if (@(Select-String -LiteralPath 'trusted-results/source.txt' -Pattern '^PASS: tests/ui/test_trust_status_handlers\.py: junit_passed=11, failed=0, skipped=0, pytest_exit=0$').Count -ne 1) { throw 'All11 current trust UI guards are required.' }
          if (@(Select-String -LiteralPath 'trusted-results/source.txt' -Pattern '^PASS: tests/packaging/test_installed_trusted_client_probe\.py: junit_passed=34, failed=0, skipped=0, pytest_exit=0$').Count -ne 1) { throw 'The actual collector/report protocol regression inventory is required.' }
      - name: Require exact installed authority and maintenance contracts
        run: |
          & $env:CARR_TRUST_PYTHON -I -B scripts/installed_trusted_client_probe.py --report 'trusted-results/installed.xml' 2>&1 | Tee-Object 'trusted-results/installed.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native signed-status and explicit consent without egress
        if: ${{ matrix.native }}
        timeout-minutes: 3
        run: |
          $python = $env:CARR_TRUST_PYTHON
          $basePython = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $rulePrefix = 'CARR-trust-native-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Signed-status native acceptance requires active firewall profiles.' }
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Signed-status native outbound rules are incomplete.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Signed-status native rules do not cover every selected runtime.' }
            @{ status='PASS'; blocked_programs=$filters; scope='selected Python and native confirmation helpers; no whole-machine claim' } | ConvertTo-Json -Depth 4 | Set-Content 'trusted-results/native-firewall.json'
            & $python -I -B tests/ui/native_trust_status_smoke.py --native 2>&1 | Tee-Object 'trusted-results/native.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual signed-status native acceptance failed.' }
            $validate = @'
          import json, pathlib
          reports = []
          for line in pathlib.Path('trusted-results/native.txt').read_text(encoding='utf-8-sig').splitlines():
              try:
                  value = json.loads(line)
              except ValueError:
                  continue
              if isinstance(value, dict) and 'production_authority' in value:
                  reports.append(value)
          assert len(reports) == 1, 'Native signed-status evidence is missing or ambiguous.'
          report = reports[0]
          required = set(["Actual desktop Help exposes the signed client status","Signed status uses the existing configurable keyboard registry","Repeated module installation does not duplicate the Help command","Native Help event reaches the status action","Default status is a named native read-only multiline control","Private default shows perpetual operation and no fake authority actions","Terms and profile are readable before accepting","Import requires explicit native checkbox acceptance","Native acceptance event enables import","Reviewed signed grant is durably verified"])
          assert report['status'] == 'PASS' and required <= set(report['checks'])
          assert report['nvda'] == 'NOT_RUN' and report['production_authority'] == 'NOT_CONFIGURED'
          assert report['production_installer_upgrade'] == 'NOT_RUN'
          origin = pathlib.Path(report['ui_module']).resolve(strict=True)
          assert origin.is_relative_to(pathlib.Path(__import__('sys').prefix).resolve())
          assert not origin.is_relative_to(pathlib.Path.cwd().resolve())
          pathlib.Path('trusted-results/native.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report), flush=True)
          '@
            $validate | & $python -I -B -
            if ($LASTEXITCODE -ne 0) { throw 'Signed-status native evidence is incomplete.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Retain exact-commit synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-client-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/trusted-results/
          if-no-files-found: error
          retention-days: 7
