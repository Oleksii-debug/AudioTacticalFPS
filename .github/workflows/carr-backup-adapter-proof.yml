name: Typed backup adapter source proof

on:
  push:
    branches: [carr/backup-adapter-recovery-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-adapter-proof-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-backup-producers:
    name: Exact typed backup producers on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Preserve exact committed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install actual FFmpeg and ffprobe for producer roundtrips
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install declared test dependencies for the exact public composition
        working-directory: carr-library
        run: python -B -m pip install ".[test]" pytest==9.0.2
      - name: Require original producer omissions and seven unchanged corrected suites
        run: python -B recovery/validate_backup_adapters.py
      - name: Preserve source identity, actual tool versions and producer results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backup-adapters-ubuntu-${{ github.sha }}
          path: ci-backup-results/
          if-no-files-found: error
          retention-days: 7
