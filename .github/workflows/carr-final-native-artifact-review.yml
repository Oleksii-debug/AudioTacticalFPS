name: Read fixed composed native failure artifact
on:
  push:
    branches: [carr/final-native-artifact-review-20261128]
permissions:
  contents: read
  actions: read
concurrency:
  group: carr-final-native-artifact-20261128
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CARR_HARVEST_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Read only the exact digest-bound failed native artifact
        timeout-minutes: 8
        shell: bash
        env:
          CARR_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 .github/diagnostics/harvest_native_failure_artifact.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: composed-native-failure-artifact-evidence
          path: native-artifact-evidence/
          if-no-files-found: error
          retention-days: 14
