          $wheelKey = 'wheelhouse/' + $wheels[0].Name
          $sealedWheel = Join-Path $bundle $wheelKey
          $verifyWheel | & $env:CARR_PYTHON -I -B - $sealedWheel $sourceCommit | Tee-Object 'profile-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelProof = Get-Content -LiteralPath 'profile-results/source-wheel-proof.json' -Raw | ConvertFrom-Json
          $sealedWheelHash = $completedManifest.files.PSObject.Properties[$wheelKey].Value
          if (!$sealedWheelHash -or $wheelProof.wheel_sha256 -ne $sealedWheelHash) { throw 'Verified source wheel differs from the installed bundle seal.' }
          $testedWheelDirectory = Join-Path 'profile-results' 'tested-application-wheel'
          New-Item -ItemType Directory -Force $testedWheelDirectory | Out-Null
          $testedWheel = Join-Path $testedWheelDirectory $wheels[0].Name
          Copy-Item -LiteralPath $sealedWheel -Destination $testedWheel
          if ((Get-FileHash -LiteralPath $testedWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $wheelProof.wheel_sha256) {
            Remove-Item -LiteralPath $testedWheel -Force
            throw 'Tested application wheel copy differs.'
          }
          @{ status='PASS'; source_commit=$sourceCommit; source_tree=$wheelProof.source_tree; wheel=$wheels[0].Name; sha256=$wheelProof.wheel_sha256; installed_bundle='PASS' } | ConvertTo-Json | Set-Content 'profile-results/tested-application-wheel.json'
          $finalProfile = @'
          import hashlib, json, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          out = pathlib.Path('profile-results')
          identity = json.loads((out / 'original-main-artifact.json').read_text(encoding='utf-8'))
          original = json.loads((out / 'original-main-proof/tested-application-wheel.json').read_text(encoding='utf-8-sig'))
          current = json.loads((out / 'tested-application-wheel.json').read_text(encoding='utf-8-sig'))
          installed = json.loads((out / 'library-profile-installed.json').read_text(encoding='utf-8'))
          assert current['status'] == current['installed_bundle'] == 'PASS'
          assert current['sha256'] == original['sha256'] == identity['wheel_sha256'] == installed['wheel_sha256']
          assert current['source_commit'] == original['source_commit'] == identity['source_commit']
          assert current['source_tree'] == original['source_tree'] == identity['source_tree']
          raw = (root / 'bundle-manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == installed['manifest_sha256']
          (out / 'library-profile-manifest.json').write_bytes(raw)
          launcher = root / 'ResearchLibrary.exe'
          with launcher.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == '5ba9218a329f8d002539bd57f73d91170125f5ec91c78d49ff85ca6c74443cec'
          assert launcher.stat().st_size == 13824
          scope = {'profile': 'library-semantic-ocr-no-bundled-audio',
              'included': ['library import/search/exact evidence', 'semantic retrieval', 'portable OCR',
                  'academic bibliography and exports', 'native keyboard/UI and typed assistant',
                  'verified backup/restore and request-bound recovery', 'local installed SAPI and progress',
                  'synthetic ASR protocol/host/export checks; no acoustic model qualification'],
              'omitted_installed_suites': {
                  'tests/assistant/test_audio_bridge.py': 'Real FFmpeg-backed assistant audio rendering.',
                  'tests/audio/test_music.py': 'Real FFmpeg composition/rendering.',
                  'tests/audio/test_production.py': 'Real FFmpeg/DSP project rendering.'},
              'omitted_native_probes': {
                  'scripts/windows_audio_runtime_smoke.py': 'Bundled FFmpeg tools are not included.',
                  'scripts/windows_audio_smoke.py': 'FFmpeg-backed audio rendering is outside this profile.'},
              'flite': 'NOT_RUN: no bundled FFmpeg/Flite runtime',
              'whisper_acoustic_inference': 'NOT_RUN', 'manual_NVDA': 'NOT_RUN',
              'delivery': 'Development-preview qualification; no application ZIP or runtime transfer is produced.'}
          (out / 'library-profile-scope.json').write_text(json.dumps(scope, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          files = {}
          for path in sorted(out.rglob('*')):
              info = path.lstat()
              assert not stat.S_ISLNK(info.st_mode) and not getattr(info, 'st_file_attributes', 0) & stat.FILE_ATTRIBUTE_REPARSE_POINT
              if stat.S_ISDIR(info.st_mode):
                  continue
              assert stat.S_ISREG(info.st_mode)
              if path.name not in ('library-profile-proof.json', 'library-profile-final.txt'):
                  with path.open('rb') as stream:
                      files[path.relative_to(out).as_posix()] = hashlib.file_digest(stream, 'sha256').hexdigest()
          report = {'status': 'PASS', 'profile': scope['profile'],
              'source_commit': identity['source_commit'], 'source_tree': identity['source_tree'],
              'profile_workflow_commit': identity['profile_workflow_commit'],
              'profile_workflow_tree': identity['profile_workflow_tree'],
              'profile_workflow_blob': identity['profile_workflow_blob'],
              'original_main_run': identity['original_run'], 'original_main_job': identity['original_job'],
              'original_artifact_id': identity['artifact_id'], 'original_artifact_sha256': identity['artifact_sha256'],
              'wheel_sha256': identity['wheel_sha256'], 'application_wheel_rebuilt': False,
              'profile_run': int(os.environ['GITHUB_RUN_ID']), 'profile_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'manifest_sha256': installed['manifest_sha256'], 'required_installed_suites': 89,
              'required_native_probes': 24, 'separate_SAPI_engine_gate': 'PASS',
              'native_EXE_and_CMD_launchers': 'PASS', 'after_installed_final_seal': True,
              'native_launcher_sha256': '5ba9218a329f8d002539bd57f73d91170125f5ec91c78d49ff85ca6c74443cec',
              'native_launcher_bytes': 13824, 'native_launcher_uploaded': False,
              'bundled_audio_runtime': False, 'whisper_acoustic_inference': 'NOT_RUN', 'manual_NVDA': 'NOT_RUN',
              'application_archive_created': False, 'evidence_files': files}
          (out / 'library-profile-proof.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({key: value for key, value in report.items() if key != 'evidence_files'}, sort_keys=True))
          '@
          $finalProfile | & $installedPython -I -B - $bundle | Tee-Object 'profile-results/library-profile-final.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Curate only synthetic evidence and the exact tested application wheel
        if: always()
        timeout-minutes: 3
        run: |
          $curateProfile = @'
          import hashlib, json, os, pathlib, re, stat
          source = pathlib.Path('profile-results')
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'carr-library-profile-public'
          public.mkdir(exist_ok=False)
          # Only named synthetic evidence and the exact post-seal application wheel may leave this job.
          allowed = set(["assistant-profile-harness.json","build-environment.json","core-bundle-install.txt","core-bundle-native.txt","core-bundle-self-test.json","full-bundle-academic-native.txt","full-bundle-assistant.json","full-bundle-audio-engines.json","full-bundle-audio-engines.txt","full-bundle-audio-engines.xml","full-bundle-build.json","full-bundle-firewall.json","full-bundle-native-runtime.json","full-bundle-ocr-models.txt","full-bundle-sbom-proof.json","full-bundle-verified.json","full-bundle-workflows.json","full-bundle-workflows.txt","full-bundle-workflows.xml","import-ownership-installed.json","installed-launchers.json","installed-native-launcher.json","installed-native-launcher.txt","library-profile-built.json","library-profile-final.txt","library-profile-installed.json","library-profile-manifest.json","library-profile-proof.json","library-profile-scope.json","model-acquisition.json","native-academic-comparison.txt","native-academic-workflows.txt","native-advanced-search.txt","native-catalog-insights.txt","native-catalog-tools.txt","native-citation-styles.txt","native-desktop.txt","native-document-formats.txt","native-ebook-contents.txt","native-ebook-reader.txt","native-evidence-drafts.txt","native-evidence-pages.txt","native-import-center.txt","native-keyboard-settings.txt","native-launcher-build.json","native-notebook-search.txt","native-ocr-languages.txt","native-progress.txt","native-reader-keymap.txt","native-reading-desk.txt","native-runtime-preparation.json","native-transcription-proof.json","native-transcription.txt","native-v3-reading.txt","ocr-preparation.json","ocr-test-font.json","offline-bundle-ocr-catalogue.json","original-main-artifact.json","original-main-download.txt","preinstall-source-wheel.json","source-wheel-proof.json","tested-application-wheel.json","tested-commit.txt","workflow-powershell-preflight.json","workflow-source-preflight.json"])
          originals = {'tested-application-wheel.json', 'source-wheel-proof.json',
              'import-ownership-installed.json', 'native-transcription-proof.json',
              'full-bundle-workflows.json', 'full-bundle-workflows.xml', 'full-bundle-verified.json', 'tested-commit.txt'}
          def regular(path):
              value = path.lstat()
              assert stat.S_ISREG(value.st_mode) and not stat.S_ISLNK(value.st_mode)
              assert not getattr(value, 'st_file_attributes', 0) & stat.FILE_ATTRIBUTE_REPARSE_POINT
              assert 0 <= value.st_size <= 128 * 1024 * 1024
              return value
          def read_json(path):
              regular(path)
              assert path.stat().st_size <= 16 * 1024 * 1024
              return json.loads(path.read_text(encoding='utf-8-sig'))
          final = source / 'library-profile-proof.json'
          qualified = final.is_file() and read_json(final).get('status') == 'PASS'
          identity = read_json(source / 'original-main-artifact.json') if (source / 'original-main-artifact.json').is_file() else None
          receipt = read_json(source / 'tested-application-wheel.json') if qualified else None
          if qualified:
              proof = read_json(final)
              assert identity and receipt and proof['after_installed_final_seal'] is True
              assert proof['source_commit'] == identity['source_commit'] == os.environ['EXPECTED_SOURCE_COMMIT']
              assert proof['source_tree'] == identity['source_tree'] == os.environ['EXPECTED_SOURCE_TREE']
              assert proof['profile_workflow_commit'] == os.environ['GITHUB_SHA']
              assert proof['bundled_audio_runtime'] is False and proof['application_archive_created'] is False
              assert proof['wheel_sha256'] == receipt['sha256'] == identity['wheel_sha256']
              assert re.fullmatch(r'[A-Za-z0-9_.+-]+\.whl', receipt['wheel'])
              assert proof['required_installed_suites'] == 89 and proof['required_native_probes'] == 24
          records, total = {}, 0
          for path in sorted(source.rglob('*')) if source.exists() else []:
              info = path.lstat()
              assert not stat.S_ISLNK(info.st_mode) and not getattr(info, 'st_file_attributes', 0) & stat.FILE_ATTRIBUTE_REPARSE_POINT
              relative = path.relative_to(source).as_posix()
              if stat.S_ISDIR(info.st_mode):
                  assert relative in ('original-main-proof', 'tested-application-wheel')
                  continue
              regular(path)
              assert path.suffix.casefold() != '.exe', 'Executable binaries must remain private.'
              is_wheel = relative.startswith('tested-application-wheel/')
              if is_wheel:
                  if not qualified:
                      continue
                  assert relative == 'tested-application-wheel/' + receipt['wheel']
              else:
                  assert relative in allowed or relative.startswith('original-main-proof/') and relative.split('/', 1)[1] in originals
                  assert path.suffix in ('.json', '.txt', '.xml', '.log')
              total += info.st_size
              assert total <= 256 * 1024 * 1024
              target = public / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              digest, count = hashlib.sha256(), 0
              with path.open('rb') as incoming, target.open('xb') as outgoing:
                  opened = os.fstat(incoming.fileno())
                  assert (opened.st_dev, opened.st_ino, opened.st_size) == (info.st_dev, info.st_ino, info.st_size)
                  while chunk := incoming.read(1024 * 1024):
                      count += len(chunk)
                      assert count <= info.st_size
                      digest.update(chunk)
                      outgoing.write(chunk)
                  closed = os.fstat(incoming.fileno())
                  assert (closed.st_size, closed.st_mtime_ns) == (info.st_size, info.st_mtime_ns)
              assert count == info.st_size
              if is_wheel:
                  assert digest.hexdigest() == receipt['sha256']
              records[relative] = {'sha256': digest.hexdigest(), 'bytes': count}
          if qualified:
              assert 'tested-application-wheel/' + receipt['wheel'] in records
              for name, digest in proof['evidence_files'].items():
                  assert name in records and records[name]['sha256'] == digest
          report = {'status': 'PASS', 'purpose': 'public artifact boundary only',
              'profile_qualification': 'PASS' if qualified else 'NOT_COMPLETED',
              'source_commit': os.environ['EXPECTED_SOURCE_COMMIT'], 'source_tree': os.environ['EXPECTED_SOURCE_TREE'],
              'profile_workflow_commit': os.environ['GITHUB_SHA'], 'run': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'files': records,
              'application_wheel_rebuilt': False, 'application_archive_created': False,
              'runtime_model_ocr_source_archives_uploaded': False, 'private_worker_uploaded': False,
              'native_launcher_uploaded': False}
          (public / 'public-artifact-manifest.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('CARR_PROFILE_PUBLIC=' + str(public) + '\n')
          print(json.dumps({'status': 'PASS', 'profile_qualification': report['profile_qualification'],
              'evidence_and_code_files': len(records), 'bytes': total, 'runtime_payloads_uploaded': False}, sort_keys=True))
          '@
          $curateProfile | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve distinct profile evidence and the tested application wheel
        if: ${{ always() && env.CARR_PROFILE_PUBLIC != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-library-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.CARR_PROFILE_PUBLIC }}/
          if-no-files-found: error
          retention-days: 7
