      - name: Validate the exact profile syntax and complete retained gate selection
        timeout-minutes: 3
        run: |
          $profileSyntax = @'
          import ast, json, os, pathlib, re, textwrap
          import yaml
          project = pathlib.Path.cwd()
          profile = pathlib.Path(os.environ['CARR_PROFILE_DEFINITION']).read_text(encoding='utf-8')
          original = (project.parent / '.github/workflows/carr-windows.yml').read_text(encoding='utf-8')
          document = yaml.safe_load(profile)
          assert document['permissions'] == {'contents': 'read', 'actions': 'read'}
          assert set(document['jobs']) == {'source-acceptance', 'library-profile'}
          wait = document['jobs']['source-acceptance']
          assert wait['runs-on'] == 'ubuntu-24.04' and wait['timeout-minutes'] == 75
          assert wait['env']['EXPECTED_SOURCE_COMMIT'] == os.environ['EXPECTED_SOURCE_COMMIT']
          assert all(wait['env'][name] == os.environ[name] for name in ('ORIGINAL_MAIN_RUN', 'ORIGINAL_MAIN_JOB', 'ORIGINAL_MAIN_ATTEMPT'))
          wait_steps = [step for step in wait['steps'] if 'run' in step]
          assert len(wait_steps) == 1 and wait_steps[0]['shell'] == 'python -I -B {0}'
          ast.parse(wait_steps[0]['run'], filename='profile-source-acceptance-wait')
          job = document['jobs']['library-profile']
          assert job['needs'] == 'source-acceptance'
          assert job['runs-on'] == 'windows-2022' and job['timeout-minutes'] == 60
          assert job['env']['EXPECTED_SOURCE_COMMIT'] == os.environ['EXPECTED_SOURCE_COMMIT']
          assert job['env']['EXPECTED_SOURCE_TREE'] == os.environ['EXPECTED_SOURCE_TREE']
          checkouts = [step for step in job['steps'] if step.get('uses', '').startswith('actions/checkout@')]
          assert len(checkouts) == 1 and checkouts[0]['with']['ref'] == os.environ['EXPECTED_SOURCE_COMMIT']
          assert checkouts[0]['with']['path'] == 'source' and checkouts[0]['with']['persist-credentials'] is False
          assert document['concurrency']['cancel-in-progress'] is False
          blocks = re.findall(r"^          \$\w+ = @'\n(.*?)^          '@$", profile, re.M | re.S)
          assert blocks
          for number, block in enumerate(blocks, 1):
              ast.parse(textwrap.dedent(block), filename=f'profile-python-{number}')
          inline = re.findall(r'^          &[^\r\n]*? -c "([^"\r\n]+)"', profile, re.M)
          for number, expression in enumerate(inline, 1):
              ast.parse(expression, filename=f'profile-inline-{number}')
          def selection(text):
              matches = re.findall(r'installed_suites = \[\n(.*?)\n          \]', text, re.S)
              assert len(matches) == 1
              return re.findall(r"'([^']+)'", matches[0])
          omitted = {'tests/assistant/test_audio_bridge.py', 'tests/audio/test_music.py', 'tests/audio/test_production.py'}
          original_suites, suites = selection(original), selection(profile)
          assert len(original_suites) == 92 and len(suites) == 89 and len(set(suites)) == 89
          assert suites == [name for name in original_suites if name not in omitted]
          original_native = re.findall(r"^            @\{ Script='([^']+)'", original, re.M)
          native = re.findall(r"^            @\{ Script='([^']+)'", profile, re.M)
          omitted_native = {'scripts/windows_audio_runtime_smoke.py', 'scripts/windows_audio_smoke.py'}
          assert len(original_native) == 26 and len(native) == 24 and len(set(native)) == 24
          assert native == [name for name in original_native if name not in omitted_native]
          baseline = [
              'tests/e2e/test_semantic_runtime.py', 'tests/e2e/test_import_worker.py',
              'tests/e2e/test_import_batches_ocr.py', 'tests/e2e/test_notebook_research_workflow.py',
              'tests/e2e/test_epub_import.py', 'tests/reader/test_ebook_reader.py',
              'tests/e2e/test_catalog_insights_workflow.py', 'tests/e2e/test_academic_workflows.py',
              'tests/e2e/test_academic_workflow.py', 'tests/e2e/test_academic_document_export.py',
              'tests/e2e/test_result_presentation.py']
          assert set(baseline) <= set(suites)
          assert all((project / name).is_file() for name in suites + native + ['tests/audio/test_engines.py'])
          assert 'tests/audio/test_engines.py' not in suites
          commands = '\n'.join(re.findall(r'^          &[^{\r\n]+$', profile, re.M))
          assert 'packaging/add_audio_runtime.py' not in commands and ' -m pip wheel ' not in commands
          assert 'packaging/build_windows_bundle.py --wheel $applicationWheel ' in commands
          engine_blocks = [block for block in blocks if "report = pathlib.Path('profile-results/full-bundle-audio-engines.xml')" in block]
          assert len(engine_blocks) == 1
          assert 'test_actual_installed_windows_sapi_voice' in engine_blocks[0]
          assert 'assert status == 0 and not policy.expected_failure' in engine_blocks[0]
          print(json.dumps({'status': 'PASS', 'python_blocks': len(blocks), 'python_inline': len(inline),
              'source_proof': 'original successful complete main run', 'installed_suites': len(suites),
              'native_probes': len(native), 'old_no_audio_baseline_retained': len(baseline),
              'separate_SAPI_engine_gate': 'REQUIRED', 'wheel_rebuild_allowed': False}, sort_keys=True))
          '@
          $profileSyntax | & $env:CARR_PYTHON -I -B - | Tee-Object 'profile-results/workflow-source-preflight.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $definition = Get-Content -LiteralPath $env:CARR_PROFILE_DEFINITION -Raw
          $profileBody = [regex]::Match($definition, '(?ms)^  library-profile:\r?\n(.*)\z')
          if (!$profileBody.Success) { throw 'The Windows profile job is missing.' }
          $blocks = [regex]::Matches($profileBody.Value, '(?ms)^        run: \|\r?\n(.*?)(?=^      - |\z)')
          if ($blocks.Count -lt 1) { throw 'No profile PowerShell blocks found.' }
          foreach ($block in $blocks) {
            $script = $block.Groups[1].Value -replace '(?m)^ {10}', ''
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw ('Invalid profile PowerShell syntax: ' + ($errors.Message -join '; ')) }
          }
          @{ status='PASS'; blocks=$blocks.Count } | ConvertTo-Json | Set-Content 'profile-results/workflow-powershell-preflight.json'

