name: CARR library profile / exact accepted wheel

on:
  push:
    branches: [carr/v3-library-profile-af5-20261127]
    paths: [.github/workflows/carr-library-profile-af5.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: carr-library-profile-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  source-acceptance:
    name: Await the exact original source acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE_COMMIT: '33007dc83fa1ede699ee9a6ef8df494dace401b9'
      ORIGINAL_MAIN_RUN: '45946353309'
      ORIGINAL_MAIN_JOB: '140331831055'
      ORIGINAL_MAIN_ATTEMPT: '1'
    steps:
      - name: Set up the read-only acceptance reader
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Require terminal success of the exact source run before using Windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python -I -B {0}
        run: |
          import json, os, time, urllib.request
          REPO = 'Oleksii-debug/AudioTacticalFPS'
          SOURCE = os.environ['EXPECTED_SOURCE_COMMIT']
          RUN, JOB, ATTEMPT = (int(os.environ[name]) for name in ('ORIGINAL_MAIN_RUN', 'ORIGINAL_MAIN_JOB', 'ORIGINAL_MAIN_ATTEMPT'))
          token = os.environ.pop('GH_TOKEN')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'carr-library-profile-source-gate'})
              with opener.open(request, timeout=15) as response:
                  raw = response.read(4 * 1024 * 1024 + 1)
              require(len(raw) <= 4 * 1024 * 1024, 'Oversized source acceptance metadata.')
              return json.loads(raw.decode('utf-8'))
          def main():
              require(os.environ['GITHUB_REPOSITORY'] == REPO and
                      os.environ['GITHUB_REF'] == 'refs/heads/carr/v3-library-profile-af5-20261127',
                      'The source acceptance gate requires its dedicated profile branch.')
              deadline, previous = time.monotonic() + 74 * 60, None
              active = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
              while True:
                  require(time.monotonic() < deadline, 'The bounded source acceptance wait expired.')
                  run, job = api('/actions/runs/' + str(RUN)), api('/actions/jobs/' + str(JOB))
                  require(run['id'] == RUN and run['head_sha'] == SOURCE and run['run_attempt'] == ATTEMPT
                          and run['repository']['full_name'] == REPO and run['head_repository']['full_name'] == REPO
                          and run['path'] == '.github/workflows/carr-windows.yml',
                          'The pinned original source run identity differs.')
                  require(job['id'] == JOB and job['run_id'] == RUN and job['head_sha'] == SOURCE
                          and job['run_attempt'] == ATTEMPT, 'The pinned original source job identity differs.')
                  state = (run['status'], run.get('conclusion'), job['status'], job.get('conclusion'))
                  if state != previous:
                      print(json.dumps({'source_commit': SOURCE, 'original_run': RUN, 'original_job': JOB,
                          'attempt': ATTEMPT, 'run_status': state[0], 'run_conclusion': state[1],
                          'job_status': state[2], 'job_conclusion': state[3],
                          'library_profile_runtime_acceptance': 'NOT_RUN'}, sort_keys=True), flush=True)
                      previous = state
                  for record, label in ((run, 'source run'), (job, 'source job')):
                      if record['status'] == 'completed':
                          require(record.get('conclusion') == 'success', 'The original ' + label + ' did not succeed.')
                      else:
                          require(record['status'] in active and record.get('conclusion') is None,
                                  'Unexpected original ' + label + ' state.')
                  if run['status'] == job['status'] == 'completed':
                      for name in ('Run required integrated source workflows',
                                   'Build, install and exercise the complete bundle with runtime egress blocked',
                                   'Preserve exact-commit runtime and test evidence'):
                          matches = [step for step in job['steps'] if step['name'] == name]
                          require(len(matches) == 1 and matches[0]['conclusion'] == 'success',
                                  'A required original source gate did not succeed.')
                      print(json.dumps({'status': 'PASS', 'source_acceptance': 'original main terminal SUCCESS',
                          'source_commit': SOURCE, 'original_run': RUN, 'original_job': JOB, 'attempt': ATTEMPT,
                          'library_profile_runtime_acceptance': 'NOT_RUN'}, sort_keys=True), flush=True)
                      return
                  require(time.monotonic() + 20 < deadline, 'The bounded source acceptance wait expired.')
                  time.sleep(20)
          try:
              main()
          except Exception as error:
              # No response body, signed URL, token or Authorization header is logged.
              detail = str(error) if type(error) is ValueError else type(error).__name__
              print('FAIL: original source acceptance: ' + detail, flush=True)
              raise SystemExit(1)

  library-profile:
    needs: source-acceptance
    name: Windows x64 / exact wheel / library without bundled audio
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source/carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_COMMIT: '33007dc83fa1ede699ee9a6ef8df494dace401b9'
      EXPECTED_SOURCE_TREE: 'c8bf0cc8e7ddd928b479282fd629f6e6d267174b'
      ORIGINAL_MAIN_RUN: '45946353309'
      ORIGINAL_MAIN_JOB: '140331831055'
      ORIGINAL_MAIN_ATTEMPT: '1'
    steps:
      - name: Preserve exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the frozen product source independently of this profile workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '33007dc83fa1ede699ee9a6ef8df494dace401b9'
          path: source
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Require and download the original successful post-seal wheel artifact
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force 'profile-results' | Out-Null
          $originalArtifact = @'
          import base64, datetime, hashlib, importlib.util, json, os, pathlib, re, stat, sys, urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree as ET, zipfile
          REPO = 'Oleksii-debug/AudioTacticalFPS'
          SOURCE = os.environ['EXPECTED_SOURCE_COMMIT']
          TREE = os.environ['EXPECTED_SOURCE_TREE']
          RUN, JOB, ATTEMPT = (int(os.environ[name]) for name in ('ORIGINAL_MAIN_RUN', 'ORIGINAL_MAIN_JOB', 'ORIGINAL_MAIN_ATTEMPT'))
          PROFILE_PATH = '.github/workflows/carr-library-profile-af5.yml'
          PROFILE_REF = 'refs/heads/carr/v3-library-profile-af5-20261127'
          CHUNK, MAX_ZIP, MAX_TOTAL = 1024 * 1024, 256 * 1024 * 1024, 512 * 1024 * 1024
          API = 'https://api.github.com/repos/' + REPO
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def unique(pairs):
              out = {}
              for key, value in pairs:
                  require(key not in out, 'Duplicate JSON key.')
                  out[key] = value
              return out
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          token = os.environ.pop('GH_TOKEN')
          def api(path):
              require(path.startswith('/') and not path.startswith('//'), 'Invalid API path.')
              request = urllib.request.Request(API + path, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'carr-library-profile-proof'})
              with opener.open(request, timeout=45) as response:
                  raw = response.read(4 * CHUNK + 1)
              require(len(raw) <= 4 * CHUNK, 'Oversized API metadata.')
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique)
          def terminal_identity():
              run = api('/actions/runs/' + str(RUN))
              job = api('/actions/jobs/' + str(JOB))
              require(run['id'] == RUN and run['head_sha'] == SOURCE and run['run_attempt'] == ATTEMPT
                      and run['repository']['full_name'] == REPO and run['head_repository']['full_name'] == REPO
                      and run['path'] == '.github/workflows/carr-windows.yml'
                      and run['status'] == 'completed' and run['conclusion'] == 'success',
                      'The exact original main run has not qualified successfully.')
              require(job['id'] == JOB and job['run_id'] == RUN and job['head_sha'] == SOURCE
                      and job['run_attempt'] == ATTEMPT and job['status'] == 'completed'
                      and job['conclusion'] == 'success', 'The exact original main job has not qualified successfully.')
              for name in ('Run required integrated source workflows',
                           'Build, install and exercise the complete bundle with runtime egress blocked',
                           'Preserve exact-commit runtime and test evidence'):
                  matches = [step for step in job['steps'] if step['name'] == name]
                  require(len(matches) == 1 and matches[0]['conclusion'] == 'success',
                          'A required original main gate did not succeed.')
              return run, job
          def main():
              require(os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['GITHUB_REF'] == PROFILE_REF,
                      'This profile must use its dedicated repository branch.')
              head = os.environ['GITHUB_SHA']
              require(re.fullmatch('[0-9a-f]{40}', head) and head != SOURCE, 'Invalid profile workflow identity.')
              profile = api('/commits/' + head)
              require([parent['sha'] for parent in profile['parents']] == [SOURCE],
                      'The profile workflow must be a direct source-only child of the frozen product.')
              changes = profile.get('files', [])
              require(len(changes) == 1 and changes[0]['filename'] == PROFILE_PATH
                      and changes[0]['status'] == 'added', 'The profile commit changes product source or other files.')
              workflow_blob = api('/git/blobs/' + changes[0]['sha'])
              require(workflow_blob['encoding'] == 'base64', 'Unsupported workflow blob encoding.')
              workflow = base64.b64decode(''.join(workflow_blob['content'].splitlines()), validate=True)
              require(hashlib.sha1(b'blob ' + str(len(workflow)).encode('ascii') + b'\0' + workflow).hexdigest()
                      == changes[0]['sha'], 'Profile workflow bytes do not match their Git identity.')
              work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'carr-original-main-artifact'
              work.mkdir(exist_ok=False)
              definition = work / 'profile-definition.yml'
              definition.write_bytes(workflow)
              run, job = terminal_identity()
              listing = api('/actions/runs/' + str(RUN) + '/artifacts?per_page=100')
              require(listing['total_count'] <= 100, 'Unexpected artifact inventory size.')
              expected_name = 'carr-windows-' + SOURCE + '-' + str(ATTEMPT)
              matches = [item for item in listing['artifacts'] if item['name'] == expected_name]
              require(len(matches) == 1, 'The exact original acceptance artifact is missing or ambiguous.')
              artifact = api('/actions/artifacts/' + str(matches[0]['id']))
              require(artifact['id'] == matches[0]['id'] and artifact['name'] == expected_name
                      and artifact['expired'] is False and artifact['workflow_run']['id'] == RUN
                      and artifact['workflow_run']['head_sha'] == SOURCE
                      and artifact['workflow_run']['repository_id'] == run['repository']['id']
                      and artifact['workflow_run']['head_repository_id'] == run['repository']['id'],
                      'Artifact identity does not match the original successful run.')
              require(isinstance(artifact.get('digest'), str)
                      and re.fullmatch('sha256:[0-9a-f]{64}', artifact['digest']),
                      'Original complete-artifact SHA256 is absent.')
              require(type(artifact['size_in_bytes']) is int and 0 < artifact['size_in_bytes'] <= MAX_ZIP,
                      'Original artifact exceeds the bounded download size.')
              stamp = lambda value: datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              require(stamp(job['started_at']) <= stamp(artifact['created_at']) <= stamp(artifact['updated_at']) <= stamp(job['completed_at']),
                      'Artifact timestamps do not belong to the original completed job.')
              request = urllib.request.Request(API + '/actions/artifacts/' + str(artifact['id']) + '/zip',
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'carr-library-profile-proof'})
              try:
                  with opener.open(request, timeout=45):
                      pass
              except urllib.error.HTTPError as response:
                  require(response.code == 302, 'Artifact endpoint did not return its expected redirect.')
                  location = response.headers.get('Location', '')
                  response.close()
              else:
                  raise ValueError('Artifact endpoint did not return its expected redirect.')
              target = urllib.parse.urlsplit(location)
              require(target.scheme == 'https' and target.hostname and target.username is None
                      and target.password is None and target.port in (None, 443) and not target.fragment,
                      'Artifact download location is not HTTPS.')
              # The signed storage URL is never printed; a NEW request sends no GitHub token.
              archive_path = work / 'original-artifact.zip'
              digest, received = hashlib.sha256(), 0
              with opener.open(urllib.request.Request(location, headers={'Accept': 'application/zip'}), timeout=45) as response:
                  with archive_path.open('xb') as output:
                      while block := response.read(CHUNK):
                          received += len(block)
                          require(received <= artifact['size_in_bytes'] and received <= MAX_ZIP,
                                  'Original artifact exceeded its exact declared length.')
                          digest.update(block)
                          output.write(block)
              require(received == artifact['size_in_bytes'] and 'sha256:' + digest.hexdigest() == artifact['digest'],
                      'Original complete-artifact length or SHA256 differs.')
              guard_spec = importlib.util.spec_from_file_location('profile_transfer_guard',
                  pathlib.Path('packaging/create_delivery.py').resolve())
              guard = importlib.util.module_from_spec(guard_spec)
              guard_spec.loader.exec_module(guard)
              proof_names = {'tested-application-wheel.json', 'source-wheel-proof.json',
                             'import-ownership-installed.json', 'native-transcription-proof.json',
                             'full-bundle-workflows.json', 'full-bundle-workflows.xml', 'full-bundle-verified.json', 'tested-commit.txt'}
              extracted, inventory = {}, {}
              with archive_path.open('rb') as stream:
                  end = zipfile._EndRecData(stream)
                  require(end is not None and not end[zipfile._ECD_DISK_NUMBER] and not end[zipfile._ECD_DISK_START]
                          and end[zipfile._ECD_ENTRIES_TOTAL] <= 2048 and end[zipfile._ECD_SIZE] <= 4 * CHUNK
                          and end[zipfile._ECD_ENTRIES_THIS_DISK] == end[zipfile._ECD_ENTRIES_TOTAL]
                          and end[zipfile._ECD_LOCATION] - end[zipfile._ECD_OFFSET] - end[zipfile._ECD_SIZE] in (0, 76)
                          and end[zipfile._ECD_LOCATION] + zipfile.sizeEndCentDir + end[zipfile._ECD_COMMENT_SIZE] == received
                          and end[zipfile._ECD_COMMENT_SIZE] == 0,
                          'Invalid or oversized original artifact ZIP directory.')
                  if end[zipfile._ECD_LOCATION] - end[zipfile._ECD_OFFSET] - end[zipfile._ECD_SIZE] == 76:
                      # Accept the standard bounded ZIP64 end record/locator, never arbitrary trailing data.
                      stream.seek(end[zipfile._ECD_OFFSET] + end[zipfile._ECD_SIZE])
                      require(stream.read(4) == b'PK\x06\x06' and int.from_bytes(stream.read(8), 'little') == 44,
                              'Invalid ZIP64 end record.')
                      stream.seek(end[zipfile._ECD_LOCATION] - 20)
                      require(stream.read(4) == b'PK\x06\x07', 'Invalid ZIP64 locator.')
                  stream.seek(0)
                  with zipfile.ZipFile(stream) as archive:
                      infos = archive.infolist()
                      require(0 < len(infos) <= 2048 and len(infos) == end[zipfile._ECD_ENTRIES_TOTAL]
                              and min(info.header_offset for info in infos) == 0,
                              'Invalid artifact ZIP entry count or prefixed data.')
                      files = [info for info in infos if not info.is_dir()]
                      prefixes = [info.filename[:-len('tested-application-wheel.json')] for info in files
                                  if info.filename.endswith('tested-application-wheel.json')]
                      require(len(prefixes) == 1 and prefixes[0] in ('', 'ci-results/', 'carr-library/ci-results/'),
                              'Artifact evidence root is missing or ambiguous.')
                      prefix, seen, total = prefixes[0], set(), 0
                      for info in infos:
                          name = info.filename.rstrip('/') if info.is_dir() else info.filename
                          folded = guard._name(name)
                          kind = stat.S_IFMT(info.external_attr >> 16)
                          require(info.orig_filename == info.filename and folded not in seen
                                  and kind in (0, stat.S_IFREG, stat.S_IFDIR)
                                  and not info.external_attr & stat.FILE_ATTRIBUTE_REPARSE_POINT
                                  and not info.flag_bits & (1 | 0x40 | 0x2000)
                                  and info.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)
                                  and 0 <= info.file_size <= 128 * CHUNK,
                                  'Unsafe, duplicate, linked, encrypted or oversized artifact ZIP entry.')
                          require((info.is_dir() and kind != stat.S_IFREG) or
                                  (not info.is_dir() and kind != stat.S_IFDIR), 'ZIP file kind differs from its path.')
                          seen.add(folded)
                          total += info.file_size
                          require(total <= MAX_TOTAL, 'Expanded artifact exceeds its bound.')
                          if info.is_dir():
                              require(info.file_size == 0 and ((name + '/').startswith(prefix) or
                                      prefix.startswith(name + '/')),
                                      'Unexpected artifact directory.')
                              continue
                          require(info.filename.startswith(prefix), 'Artifact entry is outside its evidence root.')
                          relative = info.filename[len(prefix):]
                          wheel_entry = bool(re.fullmatch(r'tested-application-wheel/[A-Za-z0-9_.+-]+\.whl', relative))
                          require(wheel_entry or re.fullmatch(r'[A-Za-z0-9_.-]+\.(json|txt|xml|log)', relative),
                                  'Original artifact contains an undeclared payload type.')
                          if relative in proof_names:
                              require(info.file_size <= 16 * CHUNK, 'Oversized original proof file.')
                          keep = relative in proof_names or wheel_entry
                          destination = work / relative if keep else None
                          if destination is not None:
                              destination.parent.mkdir(parents=True, exist_ok=True)
                          output = destination.open('xb') if destination is not None else None
                          value, size = hashlib.sha256(), 0
                          try:
                              with archive.open(info) as member:
                                  while block := member.read(CHUNK):
                                      size += len(block)
                                      require(size <= info.file_size, 'ZIP member exceeded its declared size.')
                                      value.update(block)
                                      if output is not None:
                                          output.write(block)
                          finally:
                              if output is not None:
                                  output.close()
                          require(size == info.file_size, 'ZIP member length differs.')
                          inventory[relative] = {'sha256': value.hexdigest(), 'bytes': size}
                          if destination is not None:
                              extracted[relative] = destination
              require(proof_names <= extracted.keys(), 'An original required post-seal proof is missing.')
              def proof(name):
                  return json.loads(extracted[name].read_text(encoding='utf-8-sig'), object_pairs_hook=unique)
              receipt, source = proof('tested-application-wheel.json'), proof('source-wheel-proof.json')
              for value in (receipt, source):
                  require(value.get('status') == 'PASS' and value.get('source_commit') == SOURCE
                          and value.get('source_tree') == TREE, 'Original wheel proof source/tree identity differs.')
              require(receipt.get('installed_bundle') == 'PASS'
                      and re.fullmatch('[A-Za-z0-9_.+-]+\\.whl', receipt.get('wheel', ''))
                      and receipt.get('sha256') == source.get('wheel_sha256'),
                      'Original tested wheel is not bound to its post-seal receipt.')
              wheel_name = 'tested-application-wheel/' + receipt['wheel']
              require([name for name in extracted if name.endswith('.whl')] == [wheel_name]
                      and inventory[wheel_name]['sha256'] == receipt['sha256'],
                      'The extracted original wheel differs from the tested bytes.')
              require(extracted['tested-commit.txt'].read_text(encoding='utf-8-sig').strip() == SOURCE,
                      'Original tested-commit evidence differs.')
              ownership = proof('import-ownership-installed.json')
              require(all(ownership.get(key) == 'PASS' for key in ('status', 'transactional_import_ownership',
                      'old_schema_migration', 'pending_receipt_backup')) and ownership.get('required_cases'),
                      'Original import ownership/migration/backup proof is incomplete.')
              transcription = proof('native-transcription-proof.json')
              checks = ['actual named wx controls', 'shared background operation', 'actual isolated child protocol',
                        'six verified formats', 'separate edit revision', 'original unchanged',
                        'actual export dispatch preserves verified bytes']
              require(transcription.get('status') == 'PASS' and transcription.get('checks') == checks
                      and transcription.get('source_commit') == SOURCE and transcription.get('source_tree') == TREE
                      and transcription.get('installed_package') is True
                      and transcription.get('whisper_acoustic_inference') == 'NOT_RUN'
                      and transcription.get('manual_NVDA') == 'NOT_RUN', 'Original native transcription proof differs.')
              workflows, verified = proof('full-bundle-workflows.json'), proof('full-bundle-verified.json')
              require(workflows.get('status') == 'PASS' and workflows.get('failed') == workflows.get('skipped') == 0
                      and workflows.get('passed', 0) > 0, 'Original installed workflows did not qualify.')
              require(verified.get('status') == 'PASS' and verified.get('source_commit') == SOURCE
                      and verified.get('source_tree') == TREE and verified.get('manifest_unchanged') is True
                      and verified.get('sealed_files_verified') is True, 'Original installed seal proof differs.')
              xml = extracted['full-bundle-workflows.xml'].read_bytes()
              require(b'<!DOCTYPE' not in xml and b'<!ENTITY' not in xml, 'DTD declarations are not permitted in original JUnit proof.')
              cases = list(ET.fromstring(xml).iter('testcase'))
              require(cases and all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))
                                   for case in cases), 'Original installed JUnit proof contains failures or omissions.')
              expected_asr = {'tests.transcription.test_supplied_worker_bridge': 38,
                              'tests.transcription.test_pr99_host': 18}
              observed_asr = {module: sum(case.get('classname') == module for case in cases)
                              for module in expected_asr}
              require(observed_asr == expected_asr, 'Original installed ASR collection differs.')
              archive_cases = {'test_final_callback_archive_blocks_transcription_publication[edit]',
                               'test_final_callback_archive_blocks_transcription_publication[export]'}
              require(archive_cases <= {case.get('name') for case in cases
                      if case.get('classname') == 'tests.transcription.test_supplied_worker_bridge'},
                      'Original main proof lacks the final-callback archive publication cases.')
              again = api('/actions/artifacts/' + str(artifact['id']))
              require(all(again.get(key) == artifact.get(key) for key in
                          ('id', 'name', 'digest', 'size_in_bytes', 'created_at', 'updated_at'))
                      and again['expired'] is False, 'Original artifact metadata changed during download.')
              terminal_identity()
              evidence = pathlib.Path('profile-results')
              originals = evidence / 'original-main-proof'
              originals.mkdir(parents=True, exist_ok=False)
              for name in sorted(proof_names):
                  (originals / name).write_bytes(extracted[name].read_bytes())
              identity = {'status': 'PASS', 'source_commit': SOURCE, 'source_tree': TREE,
                  'profile_workflow_commit': head, 'profile_workflow_tree': profile['commit']['tree']['sha'],
                  'profile_workflow_blob': changes[0]['sha'], 'original_run': RUN, 'original_job': JOB,
                  'original_attempt': ATTEMPT, 'artifact_id': artifact['id'], 'artifact_name': expected_name,
                  'artifact_sha256': digest.hexdigest(), 'artifact_bytes': received,
                  'wheel': receipt['wheel'], 'wheel_sha256': receipt['sha256'],
                  'artifact_entries': inventory, 'qualification': 'original complete-bundle proof only'}
              (evidence / 'original-main-artifact.json').write_text(
                  json.dumps(identity, sort_keys=True, indent=2) + '\n', encoding='utf-8')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
                  environment.write('CARR_APPLICATION_WHEEL=' + str(extracted[wheel_name]) + '\n')
                  environment.write('CARR_PROFILE_DEFINITION=' + str(definition) + '\n')
              print(json.dumps({key: value for key, value in identity.items() if key != 'artifact_entries'}, sort_keys=True))
          try:
              main()
          except Exception as error:
              # Never print Authorization, response headers or the signed download URL.
              detail = str(error) if type(error) is ValueError else type(error).__name__
              print('FAIL: original acceptance artifact qualification: ' + detail, file=sys.stderr)
              raise SystemExit(1)
          '@
          $originalArtifact | python -I -B - 2>&1 | Tee-Object 'profile-results/original-main-download.txt'
