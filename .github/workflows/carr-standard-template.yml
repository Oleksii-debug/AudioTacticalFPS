name: CARR actual standard template compiler and predicates
on:
  push:
    branches: ['carr/standard-template-*', 'carr/v3-acceptance-*']
    paths: ['carr-library/packaging/standard_windows.iss.in', 'carr-library/packaging/build_standard_installer.py', 'carr-library/scripts/verify_standard_template_windows.py', '.github/workflows/carr-standard-template.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-standard-template-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-template:
    name: Windows / complete A and B templates / actual Pascal predicates
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact current candidate B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out reviewed A with only the predicate correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91332206578b4d8dc779fec08c8d51a67962b0ff
          path: carr-standard-template-source-a
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Record exact sources before native qualification
        run: |
          New-Item -ItemType Directory standard-template-results -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Candidate checkout differs.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Candidate tree is unavailable.' }
          @{
            schema = 1; status = 'NOT_RUN'; current_source = $head; current_tree = $tree
            previous_source = '91332206578b4d8dc779fec08c8d51a67962b0ff'
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_sha = $env:GITHUB_WORKFLOW_SHA; workflow_ref = $env:GITHUB_WORKFLOW_REF
            native_installation = 'NOT_RUN'; standard_update_AB15 = 'NOT_RUN'; standard_installation50 = 'NOT_RUN'
          } | ConvertTo-Json | Set-Content -Encoding utf8 standard-template-results/source-provenance.json
      - name: Compile both entire actual templates and execute the copied predicates
        timeout-minutes: 8
        run: |
          $arguments = @('--current', (Get-Location).Path,
                         '--previous', (Join-Path $env:GITHUB_WORKSPACE 'carr-standard-template-source-a/carr-library'),
                         '--current-source', $env:GITHUB_SHA,
                         '--previous-source', '91332206578b4d8dc779fec08c8d51a67962b0ff',
                         '--work', (Join-Path $env:RUNNER_TEMP ("carr-standard-template-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)),
                         '--output', (Join-Path (Get-Location) 'standard-template-results'))
          python -I -B -X utf8 scripts/verify_standard_template_windows.py @arguments 2>&1 |
            Tee-Object standard-template-results/acceptance.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content standard-template-results/template-gate.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.full_templates -ne 2 -or $report.native_predicates -ne 'PASS' -or
              $report.predicate_cases -ne 281 -or $report.A.source_commit -ne '91332206578b4d8dc779fec08c8d51a67962b0ff' -or
              $report.B.source_commit -ne $env:GITHUB_SHA -or $report.A.template_sha256 -ne $report.B.template_sha256 -or
              -not $report.source_templates_unchanged -or $report.native_installation -ne 'NOT_RUN' -or
              $report.standard_update_AB15 -ne 'NOT_RUN' -or $report.standard_installation50 -ne 'NOT_RUN') {
            throw 'The exact full-template/native-predicate gate did not complete.'
          }
      - name: Upload compiler transcripts and native predicate evidence on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-standard-template-${{ github.sha }}
          path: carr-library/standard-template-results
          if-no-files-found: error
          retention-days: 14
