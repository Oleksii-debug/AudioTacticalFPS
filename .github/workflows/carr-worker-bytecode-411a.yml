name: CARR bounded worker bytecode seal diagnostic

on:
  push:
    branches: [carr/bytecode-seal-411a-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-bytecode-411a-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  worker-bytecode:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Set up native CPython 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install package requirements and exact test runner
        run: |
          python -m pip install . pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require two real regressions before and two strict passes after
        run: |
          python -B scripts/ci_probe_worker_bytecode.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain source-only before and after evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-worker-bytecode-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-bytecode-results/
          if-no-files-found: error
          retention-days: 7
