name: CARR V3 completion contracts

on:
  push:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths: [carr-library/**, .github/workflows/carr-v3-contracts.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-contracts-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  source-and-installed:
    name: ${{ matrix.os }} exact source and installed completion contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Build and install this exact source in the current interpreter
        id: runtime
        run: |
          set -euo pipefail
          mkdir -p v3-contract-results
          git rev-parse HEAD > v3-contract-results/tested-commit.txt
          python -m compileall -q src tests scripts
          python -m pip install '.[test,sync]'
          python -m pip check
          python -m pip list --format=json > v3-contract-results/installed-packages.json
      - name: Require source contracts with all network access denied
        run: |
          set -euo pipefail
          python scripts/ci_check.py --jobs 3 tests/assistant/test_backup_receipt.py tests/packaging/test_offline_runtime_policy.py tests/e2e/test_source_file.py tests/reader/test_reading_desk.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_template_handlers.py tests/assistant/test_transcription_tool.py tests/audio/test_book_cli.py tests/audio/test_managed_playback_queue.py tests/ui/test_managed_playback_queue.py tests/storage/test_legacy_playlist_backup.py tests/audio/test_legacy_playlist.py tests/ui/test_legacy_playlist_controls.py tests/storage/test_legacy_playlist_acceptance.py tests/ui/test_measured_book_dialog.py tests/ingest/test_large_source_profiles.py tests/storage/test_large_source_backup.py tests/e2e/test_large_import_cli.py tests/e2e/test_large_source_fixture.py tests/ui/test_large_source_import.py tests/ui/test_backup_capacity.py tests/packaging/test_ci_check.py 2>&1 | tee v3-contract-results/source.txt
      - name: Require isolated installed contracts with exact Python byte identity
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -I -B scripts/ci_check.py --installed --jobs 3 tests/assistant/test_backup_receipt.py tests/packaging/test_offline_runtime_policy.py tests/e2e/test_source_file.py tests/reader/test_reading_desk.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_template_handlers.py tests/assistant/test_transcription_tool.py tests/audio/test_book_cli.py tests/audio/test_managed_playback_queue.py tests/ui/test_managed_playback_queue.py tests/storage/test_legacy_playlist_backup.py tests/audio/test_legacy_playlist.py tests/ui/test_legacy_playlist_controls.py tests/storage/test_legacy_playlist_acceptance.py tests/ui/test_measured_book_dialog.py tests/ingest/test_large_source_profiles.py tests/storage/test_large_source_backup.py tests/e2e/test_large_import_cli.py tests/e2e/test_large_source_fixture.py tests/ui/test_large_source_import.py tests/ui/test_backup_capacity.py 2>&1 | tee v3-contract-results/installed.txt
      - name: Require explicit real numeric-loopback planning and translation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -I -B scripts/ci_check.py --installed --allow-loopback tests/loopback/test_local_planning.py tests/loopback/test_translation_local_adapter.py 2>&1 | tee v3-contract-results/loopback.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-contracts-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/v3-contract-results/
          if-no-files-found: error
          retention-days: 7
