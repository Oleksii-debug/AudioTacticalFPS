name: CARR V3 local studio and assistant

on:
  pull_request:
    branches: [carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  push:
    branches: [carr/ci-endpoint-evaluation-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  native-studio:
    runs-on: windows-2022
    # The predecessor reached 97% of the final expanded source selection before
    # the 75-minute job cutoff. Keep every product/native deadline unchanged.
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          python packaging/prepare_windows_audio.py --output $audio --download | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare pinned OCR for required recognition and backup acceptance
        id: ocr-runtime
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'runtime'
          python -B packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'cache') --output $ocr --source-archive (Join-Path $ocrWork 'corresponding-source.tar') --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARR_OCR_DIR = $ocr
          $env:PATH = "$ocr;$env:PATH"
          python -I -B -c "import json; from carr_library.extract.ocr_runtime import check_runtime; result=check_runtime(); assert result['synthetic_recognition']=='RESEARCH'; print(json.dumps(result))" | Tee-Object 'ci-v3-results/ocr-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the pinned public font required by unchanged OCR fixtures
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python -I -B ../.github/scripts/carr_prepare_test_font.py --report ci-v3-results/test-font.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed reader, translation, voice and delivery services
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python -I -B -X utf8 -m pytest -q -o addopts= -o pythonpath= -o xfail_strict=true --import-mode=importlib tests/packaging/test_standard_installer.py tests/packaging/test_managed_launch_boundary.py tests/test_delivery_contract.py tests/test_delivery_service.py tests/test_delivery_cli.py tests/speech/test_player_controls.py tests/audio/test_voice_packages.py tests/ui/test_reference_voice_controls.py tests/assistant/test_library_translation.py tests/ui/test_translation_selection.py tests/ui/test_library_translation_dialog.py tests/storage/test_state_json_reader.py tests/transcription/test_control_reads.py tests/assistant/test_state_io.py tests/ui/test_save_actions.py tests/storage/test_evidence_drafts.py tests/ui/test_save_all.py tests/ui/test_assistant_voice_preview.py tests/audio_acceptance/test_primary_publication_budget.py tests/assistant/test_transcription_workflow.py tests/speech/test_runtime_settings_restore.py tests/conversion/test_conversion.py tests/conversion/test_conversion_ownership.py tests/ui/test_document_conversion_admission.py tests/speech/test_voice_preferences.py tests/ui/test_voice_preferences_dialog.py tests/ui/test_reader_synthesis.py tests/ui/test_reader_playback.py tests/speech/test_synthesis_admission.py tests/speech/test_progress_speech.py tests/storage/test_reader_synthesis_backup.py tests/storage/test_voice_preferences_backup.py tests/catalog/test_archive_portability.py tests/catalog/test_intake_portability.py tests/storage/test_production_operation_backup.py tests/ui/test_studio_output_settings.py tests/storage/test_studio_draft_backup.py tests/storage/test_backup_scan_bounds.py tests/transcription/test_runtime_inventory.py tests/storage/test_asr_additional_profile.py tests/speech/test_python_helper.py tests/storage/test_python_helper_backup.py tests/ui/test_export_confirmation.py tests/reader/test_export_approval_budget.py tests/ui/test_save_all_access.py tests/ui/test_reader_keymap_context.py tests/ui/test_scope_labels.py tests/language_qualification/test_inventory_cleanup.py tests/ui/test_evidence_draft_recovery.py tests/storage/test_translation_runtime_recovery.py tests/audio/test_local_runtime_cli.py tests/audio/test_local_runtime_setup.py tests/ui/test_audio_runtime_setup.py tests/audio/test_audio_process.py tests/audio/test_silence_inspection.py tests/studio/test_silence_inspection.py tests/ui/test_studio_silence_inspection.py tests/studio/test_book_silence.py tests/studio/test_director_silence.py tests/ui/test_book_audio_dialog.py tests/studio/test_publishing_handlers.py tests/audio/test_process_deadline.py tests/audio/test_capture_access_diagnostic.py tests/audio/test_publication_fsync.py tests/audio/test_recording_probe.py tests/audio/test_recording.py tests/audio/test_recording_process.py tests/audio/test_recording_windows_process.py tests/audio/test_recording_monitor.py tests/audio/test_recording_monitor_capture.py tests/ui/test_recording_dialog.py tests/audio/test_playback.py tests/audio_windows/test_membership_fence.py --junitxml=ci-v3-results/installed-shared-services.xml 2>&1 | Tee-Object 'ci-v3-results/installed-shared-services.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -X utf8 -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/installed-shared-services.xml').iter('testcase')); required=['test_recording_probe','test_recording','test_recording_process','test_recording_windows_process','test_recording_dialog','test_playback','test_audio_process','test_membership_fence','test_process_deadline','test_capture_access_diagnostic','test_publication_fsync','test_local_runtime_cli','test_local_runtime_setup','test_audio_runtime_setup','test_translation_runtime_recovery','test_standard_installer','test_managed_launch_boundary','test_delivery_contract','test_delivery_service','test_delivery_cli','test_player_controls','test_voice_packages','test_reference_voice_controls','test_library_translation','test_translation_selection','test_library_translation_dialog','test_state_json_reader','test_save_actions','test_evidence_drafts','test_save_all','test_assistant_voice_preview','test_primary_publication_budget','test_transcription_workflow','test_runtime_settings_restore','test_conversion','test_conversion_ownership','test_document_conversion_admission','test_voice_preferences','test_voice_preferences_dialog','test_reader_synthesis','test_reader_playback','test_synthesis_admission','test_progress_speech','test_reader_synthesis_backup','test_control_reads','test_voice_preferences_backup','test_export_confirmation','test_export_approval_budget','test_save_all_access','test_reader_keymap_context','test_scope_labels','test_inventory_cleanup','test_evidence_draft_recovery']; assert cases and all(any(name in c.get('classname','').split('.') for c in cases) for name in required); inspection_required=('audio.test_silence_inspection','studio.test_silence_inspection','ui.test_studio_silence_inspection','studio.test_book_silence','studio.test_director_silence','ui.test_book_audio_dialog','studio.test_publishing_handlers'); assert all(any(c.get('classname','').endswith(name) for c in cases) for name in inspection_required); assert not any(c.find(t) is not None for c in cases for t in ('error','failure','skipped')); print(json.dumps(dict(status='PASS',passed=len(cases),failed=0,skipped=0,nvda='NOT_RUN')))" | Tee-Object 'ci-v3-results/installed-shared-services.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated installed effect, interchange and translation feature contracts
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          Remove-Item Env:PYTHONPATH,Env:PYTEST_PLUGINS -ErrorAction SilentlyContinue
          $featureSuites = @(
            'tests/audio/test_director_effects.py',
            'tests/storage/test_director_effects_backup.py',
            'tests/studio/test_interchange.py',
            'tests/storage/test_cue_interchange_backup.py',
            'tests/assistant/test_translation_partition.py',
            'tests/assistant/test_translation_layout.py',
            'tests/assistant/test_translation_epub_layout.py',
            'tests/ui/test_translation_layout.py',
            'tests/storage/test_translation_layout_backup.py',
            'tests/audio/test_effects.py',
            'tests/audio/test_dsp.py',
            'tests/audio/test_effect_presets.py',
            'tests/audio/test_render.py',
            'tests/ui/test_audio_effects.py',
            'tests/ui/test_audio_studio.py',
            'tests/audio/test_cleanup_contexts.py',
            'tests/packaging/test_managed_launch_boundary.py'
          )
          $featureContracts = @'
          import hashlib, importlib, importlib.metadata, importlib.util, json, pathlib, runpy, sys, xml.etree.ElementTree as ET
          checkout = pathlib.Path.cwd().resolve()
          source = checkout / 'src' / 'carr_library'
          import carr_library
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert sys.flags.isolated and installed != source and not installed.is_relative_to(checkout)
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          suites = sys.argv[1:]
          assert len(suites) == 17 and len(set(suites)) == 17
          test_bytes = {name: hashlib.sha256((checkout / name).read_bytes()).hexdigest() for name in suites}
          def inventory(directory):
              assert directory.is_dir() and not directory.is_symlink()
              files = {}
              for path in sorted(directory.rglob('*.py')):
                  assert path.is_file() and not path.is_symlink()
                  files[path.relative_to(directory).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              assert files and '__init__.py' in files
              return files
          expected = inventory(source)
          assert inventory(installed) == expected
          owners = [dist for dist in importlib.metadata.distributions()
                    if (dist.metadata.get('Name') or '').lower().replace('_', '-') == 'universal-research-library']
          assert len(owners) == 1
          owner = owners[0]
          records = [row for row in owner.files or ()
                     if row.parts and row.parts[0] == 'carr_library' and row.suffix == '.py']
          record_names = [pathlib.Path(*row.parts[1:]).as_posix() for row in records]
          assert len(record_names) == len(set(record_names)) and set(record_names) == set(expected)
          assert all(pathlib.Path(owner.locate_file(row)).resolve() == installed / name
                     for row, name in zip(records, record_names))
          names = ('carr_library.audio.director', 'carr_library.audio.projects', 'carr_library.audio.dsp',
                   'carr_library.audio.effects', 'carr_library.audio.effect_presets',
                   'carr_library.studio.interchange', 'carr_library.studio.render',
                   'carr_library.assistant.translation_partition', 'carr_library.assistant.translation_layout',
                   'carr_library.assistant.translation_layout_worker', 'carr_library.assistant.translation_epub_layout_worker',
                   'carr_library.ui.audio_studio', 'carr_library.ui.audio_effects', 'carr_library.ui.effects_dialog',
                   'carr_library.ui.translation_dialog', 'carr_library.backup_producers', 'carr_library.state_recovery',
                   'carr_library.audio.cleanup', 'carr_library.translation_cli', 'carr_library.installation_lease')
          def origins():
              values = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin
                  relative = pathlib.Path(*name.split('.')[1:]).with_suffix('.py')
                  path = pathlib.Path(spec.origin).resolve()
                  assert path == installed / relative
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[relative.as_posix()]
                  if name in sys.modules:
                      assert pathlib.Path(sys.modules[name].__file__).resolve() == path
                  values[name] = {'path': str(path), 'sha256': expected[relative.as_posix()]}
              return values
          before = origins()
          harness = checkout / 'scripts' / 'ci_check.py'
          harness_hash = hashlib.sha256(harness.read_bytes()).hexdigest()
          policy = runpy.run_path(str(harness))['PYTEST_CHILD']
          report = checkout / 'ci-v3-results' / 'installed-feature-contracts.xml'
          sys.argv = ['-c', '-q', '-o', 'addopts=', '-o', 'pythonpath=', '-o', 'xfail_strict=true',
                      '--import-mode=importlib', '--junitxml', str(report), *suites]
          namespace = {'__name__': '__main__'}
          try:
              exec(compile(policy, '<existing-offline-pytest-policy>', 'exec'), namespace)
          except SystemExit as exc:
              status = exc.code
          else:
              raise AssertionError('The existing strict child policy did not return its verdict.')
          cases = list(ET.parse(report).iter('testcase'))
          assert status == 0 and cases and not namespace['policy'].seen
          assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for case in cases)
          counts = {}
          for suite in suites:
              module = suite[len('tests/'):-3].replace('/', '.')
              counts[suite] = sum(('.' + module + '.') in ('.' + case.get('classname', '') + '.') for case in cases)
          assert all(counts.values()) and sum(counts.values()) == len(cases), counts
          assert origins() == before and inventory(source) == inventory(installed) == expected
          assert hashlib.sha256(harness.read_bytes()).hexdigest() == harness_hash
          assert {name: hashlib.sha256((checkout / name).read_bytes()).hexdigest() for name in suites} == test_bytes
          result = {'status': 'PASS', 'passed': len(cases), 'failed': 0, 'skipped': 0,
                    'selected_suites': counts, 'test_files': test_bytes, 'installed_origins': before,
                    'python_files': len(expected),
                    'package_inventory_sha256': hashlib.sha256(json.dumps(expected, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                    'policy_source_sha256': harness_hash, 'nvda': 'NOT_RUN', 'acoustic_quality': 'NOT_RUN'}
          (checkout / 'ci-v3-results' / 'installed-feature-contracts.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          '@
          python -I -B -X utf8 -c $featureContracts @featureSuites 2>&1 | Tee-Object 'ci-v3-results/installed-feature-contracts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed backup and import publication integrity
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.ocr-runtime.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $installedRecovery = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          import carr_library, carr_library.state_backup, carr_library.state_recovery, carr_library.ingest.worker
          import carr_library.application, carr_library.pending_backup, carr_library.library_backup
          import carr_library.recording_backup
          import carr_library.speech.reading, carr_library.speech.source, carr_library.ui.speech_dialog
          import carr_library.speech.runtime, carr_library.academic_integration.doi
          import carr_library.speech.session
          import carr_library.extract.ocr_runtime
          import carr_library.storage.revisions, carr_library.storage.schema_identity
          import pytest
          checkout = pathlib.Path.cwd().resolve()
          names = ('carr_library', 'carr_library.state_backup', 'carr_library.state_recovery', 'carr_library.ingest.worker',
                   'carr_library.application', 'carr_library.pending_backup', 'carr_library.library_backup', 'carr_library.recording_backup',
                   'carr_library.speech.reading', 'carr_library.speech.source', 'carr_library.ui.speech_dialog',
                   'carr_library.speech.runtime', 'carr_library.academic_integration.doi',
                   'carr_library.speech.session',
                   'carr_library.extract.ocr_runtime',
                   'carr_library.storage.revisions', 'carr_library.storage.schema_identity')
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout) for path in origins.values()), origins
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-recovery.xml')
          suites = ['tests/storage/test_recording_backup.py', 'tests/storage/test_v3_state_backup.py',
                    'tests/storage/test_canonical_backup_compat.py',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_collisions',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_allows_distinct_siblings',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_non_windows_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_keeps_ordinary_unicode_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_snapshot_roundtrip_unicode',
                    'tests/storage/test_state_backup_portability.py::test_state_inventory_rejects_unreadable_subtree',
                    'tests/storage/test_state_backup_portability.py::test_state_restore_rejects_unlisted_file_before_scanning_later_subtree',
                    'tests/storage/test_state_backup_portability.py::test_state_root_lookup_error_is_not_absence',
                    'tests/storage/test_state_backup_portability.py::test_state_root_missing_is_optional_only_when_requested',
                    'tests/extract/test_ocr_runtime.py::test_unreadable_directory_rejects_entire_inventory',
                    'tests/extract/test_ocr_runtime.py::test_empty_directory_inventory_has_a_bound',
                    'tests/extract/test_ocr_runtime.py::test_directory_inventory_checks_budget_between_entries',
                    'tests/storage/test_pending_backup.py',
                    'tests/storage/test_direct_import_pending_backup.py',
                    'tests/storage/test_state_recovery_case_aliases.py',
                    'tests/storage/test_import_registration_migration.py',
                    'tests/e2e/test_import_publication_boundary.py',
                    'tests/storage/test_complete_pending_backup.py',
                    'tests/storage/test_academic_migration.py',
                    'tests/storage/test_backup_schema_identity.py',
                    'tests/e2e/test_import_worker_publication.py',
                    'tests/ingest/test_worker_interpreter_ownership.py',
                    'tests/ingest/test_import_replay_identity.py',
                    'tests/speech/test_reading.py',
                    'tests/speech/test_source.py',
                    'tests/speech/test_session.py',
                    'tests/packaging/test_worker_bytecode.py']
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=',
                               '-o', 'xfail_strict=true', '--import-mode=importlib',
                               '--junitxml=' + str(report), *suites], plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          passed = len(cases) - failed - skipped
          required_ocr = {'test_empty_directory_inventory_has_a_bound', 'test_directory_inventory_checks_budget_between_entries', 'test_unreadable_directory_rejects_entire_inventory'}
          ocr_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_ocr_runtime']
          ocr_exact = len(ocr_cases) == len(required_ocr) and set(ocr_cases) == required_ocr
          required_state_inventory = {'test_state_inventory_rejects_unreadable_subtree[snapshot]', 'test_state_inventory_rejects_unreadable_subtree[restore]', 'test_state_restore_rejects_unlisted_file_before_scanning_later_subtree', 'test_state_root_lookup_error_is_not_absence[PermissionError]', 'test_state_root_lookup_error_is_not_absence[NotADirectoryError]', 'test_state_root_missing_is_optional_only_when_requested'}
          state_inventory_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_state_backup_portability' and c.get('name', '').split('[', 1)[0] in {name.split('[', 1)[0] for name in required_state_inventory}]
          state_inventory_exact = len(state_inventory_cases) == len(required_state_inventory) and set(state_inventory_cases) == required_state_inventory
          ok = status == 0 and passed > 0 and failed == skipped == 0 and not policy.seen and ocr_exact and state_inventory_exact
          result = dict(status='PASS' if ok else 'FAIL', passed=passed, failed=failed,
                        skipped=skipped, pytest_exit=int(status), expected_failures=policy.seen,
                        origins=installed_origins(), ocr_inventory_cases=sorted(ocr_cases),
                        ocr_inventory_exact=ocr_exact, state_inventory_exact=state_inventory_exact,
                        state_inventory_cases=sorted(state_inventory_cases), manual_nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-recovery.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_OCR_DIR
            $installedRecovery | python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-recovery.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }
      - name: Require actual Windows recording process ownership
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python -I -B tests/audio/native_recording_process_probe.py --report 'ci-v3-results/native-recording-process.json' 2>&1 | Tee-Object 'ci-v3-results/native-recording-process.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require native voice preferences and fresh inventory review
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $failures = @()
          python -I -B -X utf8 scripts/windows_voice_preferences_smoke.py --source . --report ci-v3-results/source-voice-preferences.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-voice-preferences' }
          python -I -B -X utf8 scripts/windows_voice_preferences_smoke.py --expect-installed --report ci-v3-results/installed-voice-preferences.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-voice-preferences' }
          if ($failures.Count) { throw ('Required native voice preference failures: ' + ($failures -join ', ')) }

      - name: Require source and installed native reading tabs and focus
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          $failures = @()
          python -I -B -X utf8 scripts/windows_reading_tabs_smoke.py --source . --output ci-v3-results/source-reading-tabs.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-reading-tabs' }
          python -I -B -X utf8 scripts/windows_reading_tabs_smoke.py --expect-installed --output ci-v3-results/installed-reading-tabs.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-reading-tabs' }
          python -I -B -X utf8 scripts/windows_clipboard_reader_smoke.py --source . --report ci-v3-results/source-clipboard-reader.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-clipboard-reader' }
          python -I -B -X utf8 scripts/windows_clipboard_reader_smoke.py --expect-installed --report ci-v3-results/installed-clipboard-reader.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-clipboard-reader' }
          if ($failures.Count) { throw ('Native reading tabs failed: ' + ($failures -join ', ')) }
      - name: Real native SAPI, scene production, keyboard controls and restart
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython, (Get-Command node.exe).Source,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/runtime-firewall.json'
            & $python -I -B scripts/windows_v3_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native speech and production acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_clip_editor_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-scene-clip-editor.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native scene clip controls or measured PCM effects failed.' }
            & $python -I -B -X utf8 scripts/windows_platform_tools_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-platform-tools.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native transcription and resource controls failed.' }
            & $python -I -B -X utf8 scripts/windows_translation_v3_smoke.py --expect-installed --output ci-v3-results/native-translation-v3.json
            if ($LASTEXITCODE -ne 0) { throw 'Native Advanced translation controls, vault and derivative workflow failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Require progress isolation and actual selected-voice rendering regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/speech/test_progress_speech.py tests/studio/test_production_cancellation_outcomes.py tests/ui/test_operation_progress.py tests/ui/test_progress_numeric_limits.py tests/ui/test_progress_job_review.py tests/ui/test_studio_progress_isolation.py tests/ui/test_progress_media_quiet.py tests/ui/test_progress_voice_actions.py tests/e2e/test_import_progress.py tests/storage/test_progress_preferences_backup.py 2>&1 | Tee-Object 'ci-v3-results/strict-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require Advanced translation permission and checkpoint regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/assistant/test_translation_v3.py 2>&1 | Tee-Object 'ci-v3-results/strict-translation-v3.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require local proposal scope and review regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py 2>&1 | Tee-Object 'ci-v3-results/strict-local-planning.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native local proposal and actual loopback HTTP with external egress blocked
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          $python = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $basePython = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $remoteRanges = @('0.0.0.1-126.255.255.255', '128.0.0.0-255.255.255.255',
            '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          function Normalize-RemoteRanges($Ranges) {
            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address filter representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $rulePrefix = 'CARR-local-planning-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Local planning checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Local planning egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Local planning rules do not cover the intended runtime programs.' }
            foreach ($rule in $active) {
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              $actualRanges = @(Normalize-RemoteRanges $addresses)
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'Local planning rule has unexpected remote-address coverage.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected executables with external egress blocked; loopback synthetic peer allowed' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/local-planning-firewall.json'
            & $python -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-local-planning.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native local proposal review and execution acceptance failed.' }
            & $python -I -B -m pytest -q -o addopts= -o pythonpath= --import-mode=importlib tests/assistant/test_local_planning_loopback.py --junitxml=ci-v3-results/local-planning-loopback.xml 2>&1 | Tee-Object 'ci-v3-results/local-planning-loopback.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual local planning HTTP/CLI regressions failed.' }
            & $python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/local-planning-loopback.xml').iter('testcase')); assert cases and all(not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases); print('PASS: actual loopback HTTP tests; no skipped or failed cases')"
            if ($LASTEXITCODE -ne 0) { throw 'Loopback test evidence is incomplete.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7

  source-contracts:
    runs-on: windows-2022
    # Run the complete source phase independently of the installed/native phase.
    # Preserve the same runtime preparation, source checks and job allowance.
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          python packaging/prepare_windows_audio.py --output $audio --download | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare pinned OCR for required recognition and backup acceptance
        id: ocr-runtime
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'runtime'
          python -B packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'cache') --output $ocr --source-archive (Join-Path $ocrWork 'corresponding-source.tar') --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARR_OCR_DIR = $ocr
          $env:PATH = "$ocr;$env:PATH"
          python -I -B -c "import json; from carr_library.extract.ocr_runtime import check_runtime; result=check_runtime(); assert result['synthetic_recognition']=='RESEARCH'; print(json.dumps(result))" | Tee-Object 'ci-v3-results/ocr-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the pinned public font required by unchanged OCR fixtures
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python -I -B ../.github/scripts/carr_prepare_test_font.py --report ci-v3-results/test-font.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate local services, DSP, integrity and provider permission boundaries
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' && steps.ocr-runtime.outcome == 'success' }}
        run: |
          $strictTests = @'
          import sys
          import pytest
          class ImmediateFailures:
              def pytest_runtest_logreport(self, report):
                  if report.failed:
                      print("\nREQUIRED_CASE_FAILURE " + report.nodeid + " [" + report.when + "]", flush=True)
                      print(str(report.longrepr), flush=True)
              def pytest_collectreport(self, report):
                  if report.failed:
                      print("\nREQUIRED_COLLECTION_FAILURE " + report.nodeid, flush=True)
                      print(str(report.longrepr), flush=True)
          raise SystemExit(pytest.main(sys.argv[1:], plugins=[ImmediateFailures()]))
          '@
          python -c $strictTests -q -o xfail_strict=true --import-mode=importlib tests/audio tests/speech tests/assistant tests/studio tests/audio_acceptance/test_primary_publication_budget.py tests/academic_integration tests/conversion tests/ui/test_document_conversion_admission.py tests/ui/test_voice_preferences_dialog.py tests/ui/test_reader_synthesis.py tests/ui/test_reader_playback.py tests/storage/test_reader_synthesis_backup.py tests/storage/test_voice_preferences_backup.py tests/catalog/test_archive_portability.py tests/catalog/test_intake_portability.py tests/storage/test_production_operation_backup.py tests/ui/test_studio_output_settings.py tests/ui/test_studio_silence_inspection.py tests/ui/test_book_audio_dialog.py tests/storage/test_studio_draft_backup.py tests/storage/test_backup_scan_bounds.py tests/transcription/test_runtime_inventory.py tests/storage/test_asr_additional_profile.py tests/speech/test_python_helper.py tests/storage/test_python_helper_backup.py tests/language_qualification tests/ui/test_ebook_audio_initialization.py tests/ui/test_ebook_dialog.py tests/reader/test_ebook_audio.py tests/reader/test_ebook_audio_lifecycle.py tests/ui/test_engine_settings_review.py tests/ui/test_operation_progress.py tests/ui/test_progress_job_review.py tests/ui/test_keyboard_settings.py tests/test_delivery_contract.py tests/storage/test_state_json_reader.py tests/storage/test_v3_state_backup.py tests/storage/test_pending_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_backup_v4_review.py tests/storage/test_composite_backup.py tests/storage/test_canonical_backup_compat.py tests/extract/test_language_manager.py tests/packaging/test_standard_installer.py tests/packaging/test_managed_launch_boundary.py tests/packaging/test_prepare_windows_audio.py tests/packaging/test_compact_audio_runtime.py tests/packaging/test_refresh_private_bundle_review.py tests/e2e/test_import_worker_publication.py tests/ingest/test_worker_interpreter_ownership.py tests/ingest/test_import_replay_identity.py tests/packaging/test_worker_bytecode.py tests/storage/test_direct_import_pending_backup.py tests/storage/test_state_recovery_case_aliases.py tests/storage/test_import_registration_migration.py tests/ui/test_recording_dialog.py tests/storage/test_recording_backup.py tests/operations tests/transcription tests/transcription_windows tests/operations_windows tests/ui/test_operations_policy.py tests/ui/test_platform_modal_lifecycle.py tests/ui/test_transcription_dialog.py tests/e2e/test_operations_cli.py tests/e2e/test_transcription_cli.py tests/storage/test_transcription_backup.py tests/storage/test_atomic_state_publication.py tests/storage/test_reader_presentation_backup.py tests/storage/test_reading_tabs_backup.py tests/storage/test_studio_timeline_backup.py tests/storage/test_studio_clip_inputs_backup.py tests/ui/test_worker_lifetime.py tests/ui/test_reader_tabs.py tests/ui/test_reading_focus.py tests/ui/test_reading_tools.py tests/ui/test_reader_output.py tests/ui/test_reader_spelling.py tests/ui/test_reader_presentation.py tests/reader/test_export_reconciliation.py tests/storage/test_import_publication_backup.py tests/storage/test_transcription_composite_backup.py tests/reader/test_export_change_time.py tests/ui/test_voice_reference.py tests/ui/test_word_citations.py tests/ui/test_assistant_domain_routes.py tests/sync tests/ui/test_portable_sync.py tests/citations/test_streamed_text_attestation.py tests/e2e/test_source_file.py tests/e2e/test_streamed_import_cli.py tests/e2e/test_streamed_source_import.py tests/ingest/test_streamed_admission.py tests/ingest/test_streamed_ingest.py tests/ingest/test_streamed_text.py tests/reader/test_streamed_source_view.py tests/storage/test_streamed_source_backup.py tests/ui/test_source_launch.py tests/ui/test_source_open_handler.py tests/ui/test_streamed_import.py tests/ui/test_protected_voice_packages.py tests/search/test_source_pagination.py tests/search/test_source_page_benchmark.py tests/search/test_federated_pagination.py tests/e2e/test_search_pagination.py tests/ui/test_search_pagination.py tests/ui/test_federated_search.py tests/audio_windows/test_membership_fence.py tests/storage/test_director_effects_backup.py tests/storage/test_cue_interchange_backup.py tests/ui/test_translation_layout.py tests/storage/test_translation_layout_backup.py tests/ui/test_audio_effects.py tests/ui/test_audio_studio.py tests/e2e/test_import_batch_cli.py tests/e2e/test_streaming_import_pages.py tests/ingest/test_import_budget.py tests/ingest/test_import_budget_worker.py tests/ingest/test_import_scan_pages.py tests/ingest/test_import_session.py tests/storage/test_import_capacity_backup.py tests/ui/test_import_center.py tests/ui/test_import_resources.py tests/e2e/test_backup_resource_cli.py tests/storage/test_backup_budget.py tests/storage/test_backup_capacity.py tests/storage/test_backup_resource_roundtrip.py tests/storage/test_backup_sidecars.py tests/ui/test_backup_resource_actions.py tests/ingest/test_batch_scan.py tests/e2e/test_import_batches.py tests/storage/test_library_backup.py tests/storage/test_backup_incremental.py tests/storage/test_backup_boundary.py tests/storage/test_backup_schema_identity.py tests/ui/test_backup_incremental_dialog.py --junitxml=ci-v3-results/v3-tests.xml 2>&1 | Tee-Object 'ci-v3-results/v3-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/v3-tests.xml').iter('testcase')); failed=sum(any(c.find(t) is not None for t in ('failure','error')) for c in cases); skipped=sum(c.find('skipped') is not None for c in cases); assert cases and failed==skipped==0; print(json.dumps(dict(status='PASS',passed=len(cases),failed=failed,skipped=skipped)))" | Tee-Object 'ci-v3-results/v3-strict-summary.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7

  installed-capacity:
    name: Installed capacity contracts / Windows
    runs-on: windows-2022
    # Keep the existing native and source job budgets independent of this new gate.
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      CARR_CAPACITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and capacity test dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-capacity-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -cne $env:CARR_CAPACITY_HEAD) { throw 'Checkout differs from the exact event head.' }
          $sourceCommit | Set-Content 'ci-v3-capacity-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0 'beautifulsoup4>=4.12,<5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require all installed import and backup capacity contracts
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          Remove-Item Env:PYTHONPATH,Env:PYTEST_PLUGINS -ErrorAction SilentlyContinue
          $capacitySuites = @(
            'tests/e2e/test_import_batch_cli.py',
            'tests/e2e/test_streamed_import_cli.py',
            'tests/e2e/test_streaming_import_pages.py',
            'tests/ingest/test_import_budget.py',
            'tests/ingest/test_import_budget_worker.py',
            'tests/ingest/test_import_scan_pages.py',
            'tests/ingest/test_import_session.py',
            'tests/storage/test_import_capacity_backup.py',
            'tests/ui/test_import_center.py',
            'tests/ui/test_import_resources.py',
            'tests/e2e/test_backup_resource_cli.py',
            'tests/storage/test_backup_budget.py',
            'tests/storage/test_backup_capacity.py',
            'tests/storage/test_backup_resource_roundtrip.py',
            'tests/storage/test_backup_sidecars.py',
            'tests/storage/test_studio_clip_inputs_backup.py',
            'tests/ui/test_backup_resource_actions.py',
            'tests/speech/test_reading_pauses.py',
            'tests/speech/test_reading_focus.py',
            'tests/speech/test_session.py',
            'tests/ui/test_reader_tabs.py'
          )
          $capacityContracts = @'
          import hashlib, importlib, importlib.metadata, importlib.util, json, os, pathlib, runpy, subprocess, sys, xml.etree.ElementTree as ET
          checkout = pathlib.Path.cwd().resolve()
          source = checkout / 'src' / 'carr_library'
          def checkout_head():
              value = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=10).stdout.strip()
              assert value == os.environ['CARR_CAPACITY_HEAD']
              return value
          tested_commit = checkout_head()
          import carr_library
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert sys.flags.isolated and installed != source and not installed.is_relative_to(checkout)
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          suites = sys.argv[1:]
          assert len(suites) == 21 and len(set(suites)) == 21
          test_bytes = {name: hashlib.sha256((checkout / name).read_bytes()).hexdigest() for name in suites}
          def inventory(directory):
              assert directory.is_dir() and not directory.is_symlink()
              files = {}
              for path in sorted(directory.rglob('*.py')):
                  assert path.is_file() and not path.is_symlink()
                  files[path.relative_to(directory).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              assert files and '__init__.py' in files
              return files
          expected = inventory(source)
          assert inventory(installed) == expected
          owners = [dist for dist in importlib.metadata.distributions()
                    if (dist.metadata.get('Name') or '').lower().replace('_', '-') == 'universal-research-library']
          assert len(owners) == 1
          owner = owners[0]
          records = [row for row in owner.files or ()
                     if row.parts and row.parts[0] == 'carr_library' and row.suffix == '.py']
          record_names = [pathlib.Path(*row.parts[1:]).as_posix() for row in records]
          assert len(record_names) == len(set(record_names)) and set(record_names) == set(expected)
          assert all(pathlib.Path(owner.locate_file(row)).resolve() == installed / name
                     for row, name in zip(records, record_names))
          names = ["carr_library.__main__","carr_library.application","carr_library.backup_budget","carr_library.backup_compat","carr_library.backup_incremental","carr_library.backup_incremental_cli","carr_library.backup_options","carr_library.backup_report","carr_library.backup_sidecars","carr_library.ingest.batch_cli","carr_library.ingest.batch_pages","carr_library.ingest.batch_scan","carr_library.ingest.batches","carr_library.ingest.catalog_asset_copy","carr_library.ingest.resource_budget","carr_library.ingest.session","carr_library.ingest.streamed_ingest","carr_library.ingest.streamed_text","carr_library.ingest.worker","carr_library.library_backup","carr_library.pending_backup","carr_library.storage.revisions","carr_library.streamed_import_cli","carr_library.studio.backup_inputs","carr_library.ui.backup_actions","carr_library.ui.backup_incremental_dialog","carr_library.ui.backup_resources","carr_library.ui.desktop_app","carr_library.ui.import_center","carr_library.ui.import_resources","carr_library.speech.focus","carr_library.speech.navigation","carr_library.speech.runtime","carr_library.speech.session","carr_library.ui.reader_synthesis","carr_library.ui.reader_tabs","carr_library.ui.speech_dialog"]
          def origins():
              values = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin
                  relative = pathlib.Path(*name.split('.')[1:]).with_suffix('.py')
                  path = pathlib.Path(spec.origin).resolve()
                  assert path == installed / relative
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[relative.as_posix()]
                  if name in sys.modules:
                      assert pathlib.Path(sys.modules[name].__file__).resolve() == path
                  values[name] = {'path': str(path), 'sha256': expected[relative.as_posix()]}
              return values
          before = origins()
          harness = checkout / 'scripts' / 'ci_check.py'
          harness_hash = hashlib.sha256(harness.read_bytes()).hexdigest()
          policy = runpy.run_path(str(harness))['PYTEST_CHILD']
          report = checkout / 'ci-v3-capacity-results' / 'installed-capacity-contracts.xml'
          sys.argv = ['-c', '-q', '-o', 'addopts=', '-o', 'pythonpath=', '-o', 'xfail_strict=true',
                      '--import-mode=importlib', '--junitxml', str(report), *suites]
          namespace = {'__name__': '__main__'}
          try:
              exec(compile(policy, '<existing-offline-pytest-policy>', 'exec'), namespace)
          except SystemExit as exc:
              status = exc.code
          else:
              raise AssertionError('The existing strict child policy did not return its verdict.')
          cases = list(ET.parse(report).iter('testcase'))
          assert status == 0 and cases and not namespace['policy'].seen
          assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for case in cases)
          counts = {}
          for suite in suites:
              module = suite[len('tests/'):-3].replace('/', '.')
              counts[suite] = sum(('.' + module + '.') in ('.' + case.get('classname', '') + '.') for case in cases)
          assert all(counts.values()) and sum(counts.values()) == len(cases), counts
          assert checkout_head() == tested_commit
          assert origins() == before and inventory(source) == inventory(installed) == expected
          assert hashlib.sha256(harness.read_bytes()).hexdigest() == harness_hash
          assert {name: hashlib.sha256((checkout / name).read_bytes()).hexdigest() for name in suites} == test_bytes
          result = {'status': 'PASS', 'tested_commit': tested_commit,
                    'passed': len(cases), 'failed': 0, 'skipped': 0,
                    'selected_suites': counts, 'test_files': test_bytes, 'installed_origins': before,
                    'python_files': len(expected),
                    'package_inventory_sha256': hashlib.sha256(json.dumps(expected, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                    'policy_source_sha256': harness_hash, 'nvda': 'NOT_RUN', 'acoustic_quality': 'NOT_RUN'}
          (checkout / 'ci-v3-capacity-results' / 'installed-capacity-contracts.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          '@
          python -I -B -X utf8 -c $capacityContracts @capacitySuites 2>&1 | Tee-Object 'ci-v3-capacity-results/installed-capacity-contracts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep capacity contract evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-capacity-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-capacity-results/
          retention-days: 7
