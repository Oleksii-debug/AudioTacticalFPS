name: CARR V3 local studio and assistant

on:
  pull_request:
    branches: [carr-library, carr/v3-integrated-studio-20261126]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml', '.github/workflows/carr-flite.yml']
  push:
    branches: [carr/v3-primary103-recovered-composition-20261126, carr/unified-publication-24-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml', '.github/workflows/carr-flite.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # This required job preserves all six real Flite cases outside the Windows build.
  flite-runtime:
    name: Required Linux Flite speech
    uses: ./.github/workflows/carr-flite.yml

  native-studio:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/trusted-client.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify canonical citation and DOCX regeneration boundaries
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        # Seven sequential suites include real CSL engines and DOCX round trips.
        # Keep each render and suite deadline; budget the complete Windows batch.
        timeout-minutes: 15
        run: |
          python scripts/ci_check.py tests/academic_integration/test_formatting.py tests/academic_integration/test_documents.py tests/academic_integration/test_regeneration.py tests/academic_integration/test_end_to_end.py tests/academic_integration/test_citation_ui.py tests/storage/test_durable_state_publication.py tests/ui/test_profile_project_exports.py 2>&1 | Tee-Object 'ci-v3-results/citation-regeneration.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified OCR engine before installed recovery acceptance
        id: ocr-runtime
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'ocr'
          $ocrSource = Join-Path $ocrWork 'ocr-corresponding-source.tar'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed source translation, backup and import publication integrity
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.ocr-runtime.outcome == 'success' }}
        # Exact 324b087d reached 86% at 10 minutes while still advancing.
        # Per-operation deadlines and strict failure/skip/receipt checks stay unchanged.
        timeout-minutes: 20
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $installedRecovery = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          import carr_library, carr_library.state_backup, carr_library.ingest.worker
          import carr_library.backup_transcription, carr_library.backup_sidecars, carr_library.backup_producers, carr_library.durable_state
          import carr_library.application, carr_library.pending_backup, carr_library.library_backup
          import carr_library.speech.reading, carr_library.speech.source, carr_library.ui.speech_dialog
          import carr_library.speech.runtime, carr_library.acquisition.providers, carr_library.academic_integration.doi
          import carr_library.speech.session
          import carr_library.speech.navigation, carr_library.ui.pronunciation_dialog, carr_library.ui.reading_shortcuts
          import carr_library.speech.player, carr_library.ui.reader_playback
          import carr_library.ui.find_replace_dialog
          import carr_library.audio_runtime, carr_library.research.export_file
          import carr_library.incremental_backup, carr_library.incremental_backup_cli, carr_library.sync.vault, carr_library.file_publication, carr_library.ui.incremental_backup_dialog
          import carr_library.extract.ocr_runtime
          import carr_library.storage.revisions, carr_library.storage.schema_identity
          import carr_library.assistant.translation, carr_library.assistant.providers
          import carr_library.ui.translation_dialog
          import carr_library.assistant.profiles, carr_library.assistant.state
          import carr_library.assistant.translation_cli, carr_library.assistant.llm, carr_library.assistant.service
          import carr_library.studio.cli, carr_library.ui.assistant_dialog
          import carr_library.studio.project, carr_library.studio.managed_inputs
          import pytest
          checkout = pathlib.Path.cwd().resolve()
          names = ('carr_library', 'carr_library.state_backup', 'carr_library.ingest.worker',
                   'carr_library.backup_transcription', 'carr_library.backup_sidecars', 'carr_library.backup_producers', 'carr_library.durable_state',
                   'carr_library.application', 'carr_library.pending_backup', 'carr_library.library_backup',
                   'carr_library.speech.reading', 'carr_library.speech.source', 'carr_library.ui.speech_dialog',
                   'carr_library.speech.player', 'carr_library.ui.reader_playback',
                   'carr_library.speech.runtime', 'carr_library.acquisition.providers', 'carr_library.academic_integration.doi',
                   'carr_library.speech.session',
                   'carr_library.speech.navigation', 'carr_library.ui.pronunciation_dialog', 'carr_library.ui.reading_shortcuts', 'carr_library.ui.find_replace_dialog',
                   'carr_library.audio_runtime', 'carr_library.research.export_file',
                   'carr_library.incremental_backup', 'carr_library.incremental_backup_cli', 'carr_library.sync.vault', 'carr_library.file_publication', 'carr_library.ui.incremental_backup_dialog',
                   'carr_library.extract.ocr_runtime',
                   'carr_library.storage.revisions', 'carr_library.storage.schema_identity',
                   'carr_library.assistant.translation', 'carr_library.assistant.providers',
                   'carr_library.ui.translation_dialog',
                   'carr_library.assistant.profiles', 'carr_library.assistant.state',
                   'carr_library.assistant.translation_cli', 'carr_library.assistant.llm', 'carr_library.assistant.service',
                   'carr_library.studio.cli', 'carr_library.ui.assistant_dialog',
                   'carr_library.studio.project', 'carr_library.studio.managed_inputs')
          import importlib
          completion_names = ["carr_library.assistant.templates","carr_library.ui.assistant_templates","carr_library.backup_book_audio","carr_library.backup_effect_presets","carr_library.backup_producers","carr_library.backup_sidecars","carr_library.state_backup","carr_library.audio.effect_presets","carr_library.assistant.profiles","carr_library.assistant.providers","carr_library.assistant.translation","carr_library.assistant.translation_local","carr_library.assistant.translation_documents","carr_library.ui.translation_dialog","carr_library.ui.translation_documents","carr_library.assistant.translation_cli","carr_library.ui.assistant_dialog","carr_library.speech._wave_output","carr_library.speech.player","carr_library.speech.playlist","carr_library.speech.playback_devices","carr_library.ui.audio_playback","carr_library.ui.reader_playback","carr_library.ui.desktop_app","carr_library.studio.clips","carr_library.ui.save_all","carr_library.operations.broker","carr_library.backup_playback_queue","carr_library.audio.conversion_batch","carr_library.audio.conversion_batch_cli","carr_library.audio.conversion","carr_library.ui.audio_conversion_batch","carr_library.ui.audio_conversion"]
          for name in completion_names:
              importlib.import_module(name)
          names += tuple(completion_names)
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout) for path in origins.values()), origins
              from hashlib import sha256
              for name in completion_names:
                  source = checkout / 'src' / pathlib.Path(*name.split('.')).with_suffix('.py')
                  assert sha256(pathlib.Path(origins[name]).read_bytes()).digest() == sha256(source.read_bytes()).digest(), name
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
                  if report.failed:
                      print('\nIMMEDIATE_FAILURE ' + report.nodeid + ' [' + report.when + ']', flush=True)
                      print(report.longreprtext, flush=True)
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-recovery.xml')
          suites = ['tests/storage/test_state_clip_inputs.py',
                    'tests/storage/test_backup_retained_audio.py',
                    'tests/storage/test_state_json_reader.py',
                    'tests/storage/test_durable_state_publication.py',
                    'tests/storage/test_v3_state_backup.py',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_collisions',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_allows_distinct_siblings',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_non_windows_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_keeps_ordinary_unicode_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_snapshot_roundtrip_unicode',
                    'tests/storage/test_state_backup_portability.py::test_state_inventory_rejects_unreadable_subtree',
                    'tests/storage/test_state_backup_portability.py::test_state_restore_rejects_unlisted_file_before_scanning_later_subtree',
                    'tests/extract/test_ocr_runtime.py::test_unreadable_directory_rejects_entire_inventory',
                    'tests/extract/test_ocr_runtime.py::test_empty_directory_inventory_has_a_bound',
                    'tests/extract/test_ocr_runtime.py::test_directory_inventory_checks_budget_between_entries',
                    'tests/speech/test_python_helper.py',
                    'tests/storage/test_pending_backup.py',
                    'tests/storage/test_complete_pending_backup.py',
                    'tests/storage/test_academic_migration.py',
                    'tests/storage/test_backup_schema_identity.py',
                    'tests/e2e/test_import_worker_publication.py',
                    'tests/ingest/test_import_replay_identity.py',
                    'tests/speech/test_reading.py',
                    'tests/speech/test_source.py',
                    'tests/speech/test_session.py',
                    'tests/packaging/test_worker_bytecode.py',
                    'tests/assistant/test_translation.py',
                    'tests/assistant/test_translation_local.py',
                    'tests/assistant/test_translation_documents.py',
                    'tests/ui/test_translation_documents.py',
                    'tests/assistant/test_providers.py',
                    'tests/assistant/test_translation_v3.py',
                    'tests/assistant/test_translation_advanced_source.py',
                    'tests/assistant/test_translation_advanced_union.py',
                    'tests/assistant/test_local_planning.py',
                    'tests/assistant/test_planning_handlers.py',
                    'tests/assistant/test_workflow_templates.py',
                    'tests/assistant/test_workflow_template_handlers.py',
                    'tests/storage/test_backup_studio_draft.py',
                    'tests/speech/test_reader_usability.py',
                    'tests/speech/test_navigation.py',
                    'tests/speech/test_player_controls.py',
                    'tests/speech/test_player_transport.py',
                    'tests/ui/test_reader_playback.py',
                    'tests/ui/test_reader_playback_actions.py',
                    'tests/packaging/test_audio_runtime.py',
                    'tests/packaging/test_audio_bundle.py',
                    'tests/reader/test_export_reconciliation.py',
                    'tests/ui/test_keyboard_manager.py',
                    'tests/ui/test_progress_voice_actions.py',
                    'tests/storage/test_incremental_backup.py',
                    'tests/storage/test_incremental_backup_cli.py',
                    'tests/sync/test_vault.py',
                    'tests/ui/test_incremental_backup_dialog.py',
                    'tests/ui/test_find_replace_hooks.py',
                    'tests/ui/test_reader_navigation_ui.py',
                    'tests/ui/test_find_replace_ui.py',
                    'tests/ui/test_find_replace.py']
          status = pytest.main(['-vv', '--tb=short', '-o', 'faulthandler_timeout=120',
                               '-o', 'addopts=', '-o', 'pythonpath=',
                               '-o', 'xfail_strict=true', '--import-mode=importlib',
                               '--junitxml=' + str(report), *suites], plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          passed = len(cases) - failed - skipped
          portable = [case for case in cases if 'test_state_backup_portability' in case.get('classname', '').split('.')]
          portable_complete = len(portable) == 24 and len({case.get('name') for case in portable}) == 24
          required_ocr = {'test_unreadable_directory_rejects_entire_inventory', 'test_empty_directory_inventory_has_a_bound', 'test_directory_inventory_checks_budget_between_entries'}
          ocr_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_ocr_runtime']
          ocr_exact = len(ocr_cases) == len(required_ocr) and set(ocr_cases) == required_ocr
          required_state = {'test_state_inventory_rejects_unreadable_subtree[snapshot]', 'test_state_inventory_rejects_unreadable_subtree[restore]', 'test_state_restore_rejects_unlisted_file_before_scanning_later_subtree'}
          state_inventory_exact = required_state <= {c.get('name') for c in cases}
          clip_backup_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_state_clip_inputs']
          clip_backup_exact = len(clip_backup_cases) == len(set(clip_backup_cases)) == 17
          recovery_expected = {'test_backup_retained_audio': 22, 'test_state_json_reader': 11, 'test_durable_state_publication': 27}
          recovery_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in recovery_expected}
          reader_expected = {'test_reader_usability': 33, 'test_navigation': 27, 'test_progress_voice_actions': 22, 'test_player_controls': 37, 'test_player_transport': 11, 'test_reader_playback': 52, 'test_reader_playback_actions': 24}
          reader_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in reader_expected}
          reader_required = {"test_one_thousand_matching_pronunciation_rules_commit_one_undo_step", "test_literal_expansion_is_admitted_before_large_allocation_and_is_atomic", "test_regex_backreference_expansion_is_bounded_inside_the_real_child", "test_cancellation_during_many_literal_matches_leaves_the_copy_unchanged", "test_recovered_caret_roundtrips_native_crlf_and_surrogate_offsets", "test_completed_synthesis_rechecks_current_source_before_late_playback", "test_dictionary_requires_explicit_save_of_a_changed_rule_form_before_apply"}
          reader_seen = {case.get('name', '').split('[', 1)[0] for case in cases}
          find_expected_modules = ["test_find_replace_hooks","test_reader_navigation_ui","test_find_replace_ui","test_find_replace"]
          find_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in find_expected_modules}
          reader_complete = reader_counts == reader_expected and reader_required <= reader_seen and all(find_counts.values())
          integrity_modules = ('test_audio_runtime', 'test_audio_bundle', 'test_export_reconciliation')
          integrity_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in integrity_modules}
          incremental_expected = ('test_incremental_backup', 'test_incremental_backup_cli', 'test_vault', 'test_incremental_backup_dialog')
          incremental_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in incremental_expected}
          completion_suites = ["tests/assistant/test_workflow_templates.py","tests/assistant/test_workflow_template_handlers.py","tests/storage/test_backup_studio_draft.py","tests/assistant/test_translation_local.py","tests/assistant/test_translation_documents.py","tests/ui/test_translation_documents.py"]
          completion_counts = {}
          for suite in completion_suites:
              module = suite[:-3].replace('/', '.')
              selected = [case for case in cases if case.get('classname', '') == module or case.get('classname', '').startswith(module + '.')]
              assert selected and all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for case in selected), suite
              completion_counts[suite] = len(selected)
          ok = all(incremental_counts.values()) and status == 0 and passed > 0 and failed == skipped == 0 and not policy.seen and portable_complete and ocr_exact and state_inventory_exact and clip_backup_exact and recovery_counts == recovery_expected and reader_complete and all(integrity_counts.values())
          result = dict(status='PASS' if ok else 'FAIL', passed=passed, failed=failed,
                        skipped=skipped, pytest_exit=int(status), expected_failures=policy.seen,
                        origins=installed_origins(), portable_complete=portable_complete, portable_cases=len(portable),
                        recovery_counts=recovery_counts, completion_counts=completion_counts, reader_complete=reader_complete,
                        reader_counts=reader_counts, reader_required=sorted(reader_required), find_counts=find_counts,
                        audio_export_integrity_counts=integrity_counts, incremental_counts=incremental_counts,
                        ocr_inventory_cases=sorted(ocr_cases),
                        ocr_inventory_exact=ocr_exact, state_inventory_exact=state_inventory_exact,
                        clip_backup_exact=clip_backup_exact, clip_backup_cases=clip_backup_cases,
                        manual_nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-recovery.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          $previousTessdata = $env:TESSDATA_PREFIX
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
            $installedRecovery | python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-recovery.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
            $env:TESSDATA_PREFIX = $previousTessdata
          }
      - name: Require reviewed local voice bridge and saved configuration checks
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/integrations/test_dordiai_voices.py tests/integrations/test_dordiai_speech.py tests/integrations/test_dordiai_settings.py tests/integrations/test_dordiai_convergence.py tests/integrations/test_dordiai_probe_cancellation.py tests/ui/test_studio_progress_results.py tests/ui/test_worker_cleanup.py 2>&1 | Tee-Object 'ci-v3-results/dordiai-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare explicitly pinned private test audio runtime
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          $audioInputs = Join-Path $env:RUNNER_TEMP 'carr-audio-inputs'
          python packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-v3-results/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          python packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audio | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare explicit publication and recording test tools
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        id: publication-audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-publication-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-v3-results/publication-audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_V3_PUBLICATION_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Acquire the verified optional Liblouis archive for native BRF qualification
        id: braille-runtime
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # This explicit CI input is outside every application and transfer bundle.
          $pin = Get-Content packaging/windows-braille-runtime.lock.json -Raw | ConvertFrom-Json
          if ($pin.upstream.runtime_asset.url -cne 'https://github.com/liblouis/liblouis/releases/download/v3.39.0/liblouis-3.39.0-win64.zip' -or $pin.upstream.runtime_asset.bytes -ne 5762099 -or $pin.upstream.runtime_asset.sha256 -cne '64d669ac30f1411e0023b1cecc81c7a7b5374678ee41302c95ac8c7c8fbc6591') { throw 'Unexpected official Liblouis qualification pin.' }
          $brailleInput = Join-Path $env:RUNNER_TEMP ('carr-braille-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $brailleInput -ErrorAction Stop | Out-Null
          $brailleArchive = Join-Path $brailleInput $pin.upstream.runtime_asset.name
          Invoke-WebRequest -Uri $pin.upstream.runtime_asset.url -OutFile $brailleArchive -ErrorAction Stop
          if ((Get-Item -LiteralPath $brailleArchive).Length -ne $pin.upstream.runtime_asset.bytes) { throw 'Wrong optional Liblouis archive size' }
          if ((Get-FileHash -LiteralPath $brailleArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.upstream.runtime_asset.sha256) { throw 'Wrong optional Liblouis archive SHA256' }
          'CARR_CI_BRAILLE_ARCHIVE=' + $brailleArchive | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the pinned EPUB3.3 conformance checker
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        id: epubcheck-runtime
        timeout-minutes: 10
        run: |
          $epubcheckWork = Join-Path $env:RUNNER_TEMP 'carr-epubcheck'
          New-Item -ItemType Directory -Force $epubcheckWork | Out-Null
          $pin = Get-Content -LiteralPath 'packaging/epubcheck.json' -Raw | ConvertFrom-Json
          if ($pin.version -ne '5.3.0' -or $pin.size -ne 33071108 -or $pin.sha256 -ne '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5' -or $pin.url -ne 'https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip') { throw 'Unexpected EPUBCheck3.3 acceptance pin.' }
          $epubcheckArchive = Join-Path $epubcheckWork 'epubcheck-5.3.0.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $epubcheckArchive
          if ((Get-Item -LiteralPath $epubcheckArchive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $epubcheckArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned EPUBCheck archive size/checksum mismatch.' }
