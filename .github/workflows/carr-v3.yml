      - name: Restore this run's runtime egress test policy after every bundle outcome
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $statePath = 'ci-v3-results/native-firewall-recovery.json'
          $statusPath = 'ci-v3-results/native-firewall-restored.json'
          if (!(Test-Path -LiteralPath $statePath)) {
            @{ status = 'NOT_STARTED'; reason = 'No runtime egress policy was changed by this native step.' } | ConvertTo-Json | Set-Content -LiteralPath $statusPath -Encoding utf8
            exit 0
          }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ($state.schema -ne 'carr-ci-firewall-recovery/1' -or [string]$state.run_id -ne [string]$env:GITHUB_RUN_ID -or $state.prefix -notmatch '^CARR-v3-offline-[0-9a-f]{32}$') { throw 'Runtime firewall recovery identity changed.' }
