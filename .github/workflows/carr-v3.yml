            tests/studio/test_production_cancellation_outcomes.py \
            tests/packaging/test_refresh_private_bundle_review.py \
            tests/ui/test_keyboard_settings.py \
            tests/speech/test_pronunciation_review.py \
            tests/speech/test_pronunciation_reader_hook.py \
            tests/speech/test_pronunciation_handlers.py \
            tests/speech/test_reader_native_lifetime.py \
            tests/ui/test_command_palette.py \
            tests/reader/test_ebook_audio.py \
            tests/ui/test_reader_dialog_lifetime.py \
            tests/language_qualification/test_ui.py \
            tests/audio/test_audio_process.py \
            tests/studio/test_project_v1_compatibility.py \
            tests/ui/test_studio_progress_isolation.py \
            tests/assistant/test_local_planning_loopback.py \
            tests/studio/test_daisy_publishing.py \
            tests/extract/test_ocr_runtime.py::test_unreadable_directory_rejects_entire_inventory \
            tests/extract/test_ocr_runtime.py::test_empty_directory_inventory_has_a_bound \
            tests/extract/test_ocr_runtime.py::test_directory_inventory_checks_budget_between_entries \
            tests/audio/test_audiobook.py \
            tests/studio/test_audiobook_publication.py \
            tests/audio/test_publication_fsync.py \
            tests/packaging/test_prepare_windows_audio.py \
            tests/speech/test_python_helper.py \
            --junitxml=ci-source-results/source-tests.xml
          python -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-source-results/source-tests.xml').iter('testcase')); failed=sum(any(c.find(t) is not None for t in ('failure','error')) for c in cases); skipped=sum(c.find('skipped') is not None for c in cases); assert cases and failed==skipped==0; print(json.dumps(dict(status='PASS',passed=len(cases),failed=failed,skipped=skipped,native_windows='NOT_RUN',real_asr='NOT_RUN',nvda='NOT_RUN')))"
      - name: Preserve source evidence and dependency identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-source-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-source-results/
          if-no-files-found: warn
          retention-days: 7

  native-studio:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify canonical citation and DOCX regeneration boundaries
        timeout-minutes: 5
        run: |
          node --version | Tee-Object 'ci-v3-results/citation-node-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_check.py --jobs 3 tests/academic_integration/test_formatting.py tests/academic_integration/test_documents.py tests/academic_integration/test_regeneration.py tests/academic_integration/test_end_to_end.py tests/academic_integration/test_citation_ui.py tests/storage/test_durable_state_publication.py tests/ui/test_profile_project_exports.py 2>&1 | Tee-Object 'ci-v3-results/citation-regeneration.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified OCR engine before installed recovery acceptance
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'ocr'
          $ocrSource = Join-Path $ocrWork 'ocr-corresponding-source.tar'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed backup and import publication integrity
        timeout-minutes: 25
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $installedRecovery = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          import carr_library, carr_library.state_backup, carr_library.ingest.worker
          import carr_library.application, carr_library.pending_backup, carr_library.library_backup
          import carr_library.speech.reading, carr_library.speech.source, carr_library.ui.speech_dialog
          import carr_library.speech.runtime, carr_library.academic_integration.doi
          import carr_library.speech.session
          import carr_library.durable_state, carr_library.ui.save_actions
          import carr_library.assistant.providers, carr_library.assistant.translation
          import carr_library.assistant.llm, carr_library.assistant.service
          import carr_library.storage.revisions, carr_library.storage.schema_identity
          import pytest
          checkout = pathlib.Path.cwd().resolve()
          names = ('carr_library', 'carr_library.state_backup', 'carr_library.ingest.worker',
                   'carr_library.application', 'carr_library.pending_backup', 'carr_library.library_backup',
                   'carr_library.speech.reading', 'carr_library.speech.source', 'carr_library.ui.speech_dialog',
                   'carr_library.speech.runtime', 'carr_library.academic_integration.doi',
                   'carr_library.speech.session',
                   'carr_library.durable_state', 'carr_library.ui.save_actions',
                   'carr_library.assistant.providers', 'carr_library.assistant.translation',
                   'carr_library.assistant.llm', 'carr_library.assistant.service',
                   'carr_library.storage.revisions', 'carr_library.storage.schema_identity')
          import importlib
          names = tuple(dict.fromkeys((*names, 'carr_library.backup_extensions', 'carr_library.studio.backup_inputs', 'carr_library.studio.clips', 'carr_library.audio.recording', 'carr_library.audio.audiobook', 'carr_library.reader.live_reading', 'carr_library.speech.dordiai', 'carr_library.integrations.dordiai_voices', 'carr_library.search.advanced', 'carr_library.semantic_cache', 'carr_library.extract.document_formats', 'carr_library.acquisition.service', 'carr_library.assistant.llm', 'carr_library.extract.ocr_runtime')))
          for name in names:
              importlib.import_module(name)
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout) for path in origins.values()), origins
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-recovery.xml')
          suites = [
              'tests/storage/test_v3_state_backup.py',
              'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_collisions',
              'tests/storage/test_state_backup_portability.py::test_portable_manifest_allows_distinct_siblings',
              'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_non_windows_names',
              'tests/storage/test_state_backup_portability.py::test_portable_manifest_keeps_ordinary_unicode_names',
              'tests/storage/test_state_backup_portability.py::test_portable_snapshot_roundtrip_unicode',
              'tests/storage/test_pending_backup.py',
              'tests/storage/test_complete_pending_backup.py',
              'tests/storage/test_academic_migration.py',
              'tests/storage/test_backup_schema_identity.py',
              'tests/storage/test_canonical_v5_compatibility.py',
              'tests/storage/test_publication_migration.py',
              'tests/ingest/test_worker_attempt_receipts.py',
              'tests/ingest/test_competing_publication_receipts.py',
              'tests/operations/test_resources.py',
              'tests/operations/test_resource_backup.py',
              'tests/e2e/test_import_worker_publication.py',
              'tests/ingest/test_import_replay_identity.py',
              'tests/ingest/test_canonical_publication_binding.py',
              'tests/speech/test_reading.py',
              'tests/speech/test_source.py',
              'tests/speech/test_session.py',
              'tests/packaging/test_worker_bytecode.py',
              'tests/storage/test_state_json_reader.py',
              'tests/ui/test_save_actions.py',
              'tests/extract/test_ocr_inventory_boundary.py',
              'tests/assistant/test_translation.py',
              'tests/ui/test_translation_selection.py',
              'tests/assistant/test_providers.py',
              'tests/extract/test_document_formats_text.py',
              'tests/extract/test_document_formats_xml.py',
              'tests/e2e/test_extended_document_workflows.py',
              'tests/reader/test_live_reading.py',
              'tests/reader/test_live_player.py',
              'tests/ui/test_live_reading_controls.py',
              'tests/ui/test_reading_copy_save_guard.py',
              'tests/storage/test_backup_v5_extensions.py',
              'tests/storage/test_backup_legacy_compat.py',
              'tests/storage/test_backup_transcription.py',
              'tests/storage/test_backup_reporting.py',
              'tests/storage/test_backup_restore_cancellation.py',
              'tests/audio/test_owned_process_tree.py',
              'tests/audio/test_cleanup_ownership.py',
              'tests/audio/test_transcription_settings.py',
              'tests/search/test_advanced_search.py',
              'tests/search/test_federated_advanced.py',
              'tests/search/test_semantic_cache.py',
              'tests/search/test_semantic_cache_boundary.py',
              'tests/e2e/test_advanced_research_search.py',
              'tests/ui/probe_advanced_query_builder.py',
              'tests/ui/test_desktop_result_modes.py',
              'tests/academic_integration/test_regeneration.py',
              'tests/ui/test_acquisition_dialog.py',
              'tests/acquisition/test_acquisition_cli.py',
              'tests/acquisition/test_providers.py',
              'tests/acquisition/test_acquisition_workflow.py',
              'tests/acquisition/test_identifier_lookup_security.py',
              'tests/acquisition/test_acquisition_security.py',
              'tests/academic_integration/test_bibtex_workflow.py',
              'tests/assistant/test_local_planning.py',
              'tests/assistant/test_planning_handlers.py',
              'tests/assistant/test_translation_v3.py',
              'tests/studio/test_service_discovery.py',
              'tests/audio/test_hardened_transcription_protocol.py',
              'tests/audio/test_recording.py',
              'tests/ui/test_recording_dialog.py',
              'tests/studio/test_clip_editing.py',
              'tests/studio/test_clip_dialog.py',
              'tests/storage/test_studio_input_backup.py',
              'tests/storage/test_backup_studio_media.py',
              'tests/integrations/test_dordiai_voices.py',
              'tests/integrations/test_dordiai_registry.py',
              'tests/studio/test_runtime_identity.py',
              'tests/speech/test_discovery_boundaries.py',
              'tests/assistant/test_local_planning_loopback.py',
              'tests/extract/test_ocr_runtime.py::test_unreadable_directory_rejects_entire_inventory',
              'tests/extract/test_ocr_runtime.py::test_empty_directory_inventory_has_a_bound',
              'tests/extract/test_ocr_runtime.py::test_directory_inventory_checks_budget_between_entries',
              'tests/audio/test_audiobook.py',
              'tests/studio/test_audiobook_publication.py',
              'tests/audio/test_publication_fsync.py',
              'tests/storage/test_state_backup_portability.py::test_state_inventory_rejects_unreadable_subtree',
              'tests/storage/test_state_backup_portability.py::test_state_restore_rejects_unlisted_file_before_scanning_later_subtree',
              'tests/storage/test_state_backup_portability.py::test_state_root_lookup_error_is_not_absence',
              'tests/storage/test_state_backup_portability.py::test_state_root_missing_is_optional_only_when_requested',
              'tests/speech/test_python_helper.py',
          ]
          status = pytest.main(['-v', '-o', 'addopts=', '-o', 'pythonpath=',
                               '-o', 'xfail_strict=true', '--import-mode=importlib',
                               '--junitxml=' + str(report), *suites], plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          passed = len(cases) - failed - skipped
          required_ocr = {'test_unreadable_directory_rejects_entire_inventory', 'test_empty_directory_inventory_has_a_bound', 'test_directory_inventory_checks_budget_between_entries'}
          ocr_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_ocr_runtime']
          ocr_exact = len(ocr_cases) == len(required_ocr) and set(ocr_cases) == required_ocr
          ok = status == 0 and passed > 0 and failed == skipped == 0 and not policy.seen and ocr_exact
          result = dict(status='PASS' if ok else 'FAIL', passed=passed, failed=failed,
                        skipped=skipped, pytest_exit=int(status), expected_failures=policy.seen,
                        origins=installed_origins(), ocr_inventory_cases=sorted(ocr_cases),
                        ocr_inventory_exact=ocr_exact, manual_nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-recovery.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $installedRecovery | python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-recovery.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }
      - name: Exercise installed local proposal review with an explicit loopback fixture
        timeout-minutes: 5
        run: |
          # Real loopback HTTP is intentional and runs before outbound runtime blocking.
          python -I -B -X utf8 scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-local-planning.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Installed native local proposal review failed.' }
      - name: Prepare the pinned EPUB conformance validator outside the application
        id: epubcheck_runtime
        timeout-minutes: 5
        run: |
          $pin = Get-Content -LiteralPath 'packaging/epubcheck.json' -Raw | ConvertFrom-Json
          if ($pin.schema -ne 1 -or $pin.version -ne '5.3.0') { throw 'Unexpected reviewed EPUBCheck protocol or version.' }
          $archive = Join-Path $env:RUNNER_TEMP 'carr-epubcheck-5.3.0.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or $archiveHash -ne $pin.sha256) { throw 'EPUBCheck archive differs from the reviewed size or SHA256.' }
          $java = (Get-Command java.exe -ErrorAction Stop).Source
          & $java -version 2>&1 | Tee-Object 'ci-v3-results/epubcheck-java-version.txt'
          if ($LASTEXITCODE -ne 0) { throw 'The actual Java conformance runtime is unavailable.' }
          @{ schema=1; status='PASS'; bundled=$false; version=$pin.version; archive_sha256=$archiveHash;
             java=$java; java_sha256=(Get-FileHash -LiteralPath $java -Algorithm SHA256).Hash.ToLowerInvariant()
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-v3-results/epubcheck-tool-binding.json'
          "CARR_EPUBCHECK_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_EPUBCHECK_JAVA=$java" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $schemaPin = Get-Content -LiteralPath 'packaging/daisy-validation-schemas.json' -Raw | ConvertFrom-Json
          if ($schemaPin.schema -ne 1 -or @($schemaPin.files.PSObject.Properties).Count -ne 5) { throw 'Unexpected reviewed DAISY validation schema set.' }
          $schemas = Join-Path $env:RUNNER_TEMP 'carr-daisy-validation-schemas'
          New-Item -ItemType Directory -Force $schemas | Out-Null
          $schemaEvidence = @()
          foreach ($property in $schemaPin.files.PSObject.Properties) {
            if ($property.Name -notmatch '^[A-Za-z0-9._-]+$') { throw 'Invalid pinned schema basename.' }
            $schemaFile = Join-Path $schemas $property.Name
            Invoke-WebRequest -Uri $property.Value.url -OutFile $schemaFile
            $schemaHash = (Get-FileHash -LiteralPath $schemaFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Item -LiteralPath $schemaFile).Length -ne $property.Value.size -or $schemaHash -ne $property.Value.sha256) { throw ('DAISY validation schema differs from its size or hash pin: ' + $property.Name) }
            $schemaEvidence += @{ name=$property.Name; sha256=$schemaHash; size=$property.Value.size; source=$property.Value.url }
          }
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$schemas; files=$schemaEvidence
           } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-v3-results/daisy-schema-binding.json'
          "CARR_DAISY_SCHEMAS=$schemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real native SAPI, scene production, keyboard controls and restart
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_V3_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-v3-results/external-test-audio-binding.json'
          $programs = @($python, $basePython, (Get-Command node.exe).Source, $env:CARR_EPUBCHECK_JAVA,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/runtime-firewall.json'
            & $python -I -B scripts/windows_v3_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native speech and production acceptance failed.' }
            & $python -I -B scripts/windows_live_reading_smoke.py --output 'ci-v3-results/live-reading-native.json'
            if ($LASTEXITCODE -ne 0) { throw 'Native continuous source reading acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_save_timer_smoke.py --output 'ci-v3-results/native-save-timer.json' 2>&1 | Tee-Object 'ci-v3-results/native-save-timer.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native draft timer lifetime acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_publishing_smoke.py --audio-evidence 'ci-v3-results/external-test-audio-binding.json' --daisy-schemas $env:CARR_DAISY_SCHEMAS --require-sapi 2>&1 | Tee-Object 'ci-v3-results/native-publishing.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native synchronized publication acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_recording_smoke.py --audio-evidence 'ci-v3-results/external-test-audio-binding.json' 2>&1 | Tee-Object 'ci-v3-results/native-recording.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed recording acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_clip_editor_smoke.py --audio-evidence 'ci-v3-results/external-test-audio-binding.json' 2>&1 | Tee-Object 'ci-v3-results/native-clip-editor.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed clip-editor acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_epub_reading_smoke.py --audio-evidence 'ci-v3-results/external-test-audio-binding.json' 2>&1 | Tee-Object 'ci-v3-results/native-epub-reading.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed epub-reading acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_pronunciation_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-pronunciation.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed pronunciation acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_command_palette_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-command-palette.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed command-palette acceptance failed.' }
            & $python -I -B -X utf8 scripts/windows_reader_lifetime_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-reader-lifetime.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Required installed reader-lifetime acceptance failed.' }
            & $python -I -B -X utf8 scripts/epubcheck_acceptance.py --archive $env:CARR_EPUBCHECK_ARCHIVE --java $env:CARR_EPUBCHECK_JAVA --audio-evidence 'ci-v3-results/external-test-audio-binding.json' --require-installed --report 'ci-v3-results/epub-conformance.json' 2>&1 | Tee-Object 'ci-v3-results/epub-conformance.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual EPUBCheck conformance acceptance failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Require progress isolation and actual selected-voice rendering regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py --jobs 3 tests/speech/test_progress_speech.py tests/studio/test_production_cancellation_outcomes.py tests/ui/test_operation_progress.py tests/ui/test_progress_numeric_limits.py tests/ui/test_progress_job_review.py tests/ui/test_studio_progress_isolation.py tests/ui/test_progress_media_quiet.py tests/ui/test_progress_voice_actions.py tests/e2e/test_import_progress.py tests/storage/test_progress_preferences_backup.py 2>&1 | Tee-Object 'ci-v3-results/strict-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate local services, DSP, integrity and provider permission boundaries
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          node --version | Tee-Object 'ci-v3-results/citation-node-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --import-mode=importlib tests/audio tests/speech tests/assistant tests/studio tests/academic_integration tests/conversion tests/research/test_bibtex_import.py tests/language_qualification tests/ui/test_transcription_dialog.py tests/ui/test_operation_progress.py tests/ui/test_progress_job_review.py tests/ui/test_keyboard_settings.py tests/test_delivery_contract.py tests/storage/test_atomic_state_publication.py tests/storage/test_v3_state_backup.py tests/storage/test_pending_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_backup_v4_review.py tests/storage/test_state_backup_portability.py tests/e2e/test_import_worker_publication.py tests/ingest/test_import_replay_identity.py tests/packaging/test_worker_bytecode.py tests/extract/test_language_manager.py tests/packaging/test_prepare_windows_audio.py tests/packaging/test_refresh_private_bundle_review.py tests/ui/test_profile_project_exports.py tests/integrations/test_dordiai_convergence.py tests/ui/test_progress_voice_actions.py tests/integrations/test_dordiai_voices.py tests/integrations/test_dordiai_ownership.py tests/integrations/test_dordiai_probe_cancellation.py tests/ui/test_command_palette.py tests/reader/test_ebook_audio.py tests/ui/test_reader_dialog_lifetime.py tests/ui/test_recording_dialog.py tests/storage/test_studio_input_backup.py tests/ui/test_studio_progress_isolation.py --junitxml=ci-v3-results/v3-tests.xml 2>&1 | Tee-Object 'ci-v3-results/v3-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual import-attempt, migration and export integrity regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/ci_check.py --jobs 3 tests/ingest/test_import_publication_point.py tests/ingest/test_worker_publication_boundary.py tests/ingest/test_worker_attempt_receipts.py tests/ingest/test_competing_publication_receipts.py tests/ingest/test_canonical_publication_binding.py tests/storage/test_publication_migration.py tests/storage/test_canonical_v5_compatibility.py tests/e2e/test_import_worker_publication.py tests/ingest/test_import_replay_identity.py tests/storage/test_backup_schema_identity.py tests/reader/test_export_no_clobber.py tests/speech/test_source.py tests/packaging/test_worker_bytecode.py 2>&1 | Tee-Object 'ci-v3-results/strict-publication-integrity.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require shared resource admission and existing job recovery
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/ci_check.py --jobs 3 tests/operations/test_resources.py tests/operations/test_worker_start_cleanup.py tests/operations/test_facade.py tests/operations/test_canonical_asr_admission.py tests/operations/test_ocr_admission.py tests/ui/test_operations_policy.py tests/ui/test_operations_dialog.py tests/e2e/test_operations_cli.py tests/operations/test_production_admission.py tests/operations/test_resource_backup.py tests/audio/test_music.py tests/storage/test_state_json_reader.py tests/ui/test_save_actions.py tests/extract/test_ocr_inventory_boundary.py tests/assistant/test_translation.py tests/ui/test_translation_selection.py tests/studio/test_publishing.py tests/studio/test_publishing_cli.py tests/studio/test_publishing_handlers.py tests/integrations/test_dordiai_convergence.py tests/speech/test_progress_speech.py tests/ui/test_progress_voice_actions.py tests/integrations/test_dordiai_voices.py tests/integrations/test_dordiai_ownership.py tests/integrations/test_dordiai_probe_cancellation.py tests/ui/test_keyboard_settings.py tests/speech/test_pronunciation_review.py tests/speech/test_pronunciation_reader_hook.py tests/speech/test_pronunciation_handlers.py tests/speech/test_source.py tests/speech/test_reader_native_lifetime.py tests/ui/test_command_palette.py tests/reader/test_ebook_audio.py tests/ui/test_reader_dialog_lifetime.py tests/language_qualification/test_ui.py tests/audio/test_recording.py tests/audio/test_audio_process.py tests/audio/test_recording_process_windows.py tests/ui/test_recording_dialog.py tests/studio/test_clip_dialog.py tests/studio/test_clip_editing.py tests/storage/test_studio_input_backup.py tests/studio/test_project_v1_compatibility.py tests/ui/test_studio_progress_isolation.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py tests/studio/test_daisy_publishing.py tests/studio/test_studio_controller.py tests/audio/test_audiobook.py tests/studio/test_audiobook_publication.py tests/audio/test_publication_fsync.py tests/storage/test_state_backup_portability.py::test_state_inventory_rejects_unreadable_subtree tests/storage/test_state_backup_portability.py::test_state_restore_rejects_unlisted_file_before_scanning_later_subtree tests/storage/test_state_backup_portability.py::test_state_root_lookup_error_is_not_absence tests/storage/test_state_backup_portability.py::test_state_root_missing_is_optional_only_when_requested tests/storage/test_v3_state_backup.py::test_backup_state_lookup_failure_never_publishes tests/speech/test_python_helper.py 2>&1 | Tee-Object 'ci-v3-results/strict-shared-resources.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7
