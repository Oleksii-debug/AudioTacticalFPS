              Write-Host ('REQUIRED LOCAL BLOCK FAILED [translation-source-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
