            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address filter representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $requiredLocalFailures = [System.Collections.Generic.List[object]]::new()
          $rulePrefix = 'CARR-local-planning-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Local planning checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Local planning egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Local planning rules do not cover the intended runtime programs.' }
            foreach ($rule in $active) {
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              $actualRanges = @(Normalize-RemoteRanges $addresses)
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'Local planning rule has unexpected remote-address coverage.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected executables with external egress blocked; loopback synthetic peer allowed' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/local-planning-firewall.json'
            try {
            & $python -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-local-planning.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native local proposal review and execution acceptance failed.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='local-planning-native'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [local-planning-native]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            try {
            & $python -I -B -m pytest -q -o addopts= -o pythonpath= -o xfail_strict=true --import-mode=importlib tests/assistant/test_local_planning_loopback.py --junitxml=ci-v3-results/local-planning-loopback.xml 2>&1 | Tee-Object 'ci-v3-results/local-planning-loopback.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual local planning HTTP/CLI regressions failed.' }
            & $python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/local-planning-loopback.xml').iter('testcase')); assert len(cases)==25 and all(c.get('classname','').rsplit('.',1)[-1]=='test_local_planning_loopback' and not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases); print('PASS: actual loopback HTTP tests; no skipped or failed cases')"
            if ($LASTEXITCODE -ne 0) { throw 'Loopback test evidence is incomplete.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='local-planning-http'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [local-planning-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            try {
            $translationSource = Join-Path (Get-Location) 'src'
            & $python -I -B scripts/translation_loopback_check.py --mode source --source-root $translationSource --firewall-receipt 'ci-v3-results/local-planning-firewall.json' --output-dir 'ci-v3-results' 2>&1 | Tee-Object 'ci-v3-results/translation-loopback-source.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Strict source local translation HTTP/CLI acceptance failed.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='translation-source-http'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [translation-source-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            try {
            $translationSource = Join-Path (Get-Location) 'src'
            & $python -I -B scripts/translation_loopback_check.py --mode installed --source-root $translationSource --firewall-receipt 'ci-v3-results/local-planning-firewall.json' --output-dir 'ci-v3-results' 2>&1 | Tee-Object 'ci-v3-results/translation-loopback-installed.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Strict installed local translation HTTP/CLI acceptance failed.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='translation-installed-http'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [translation-installed-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            @{ status=$(if ($requiredLocalFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            try {
            $translationSource = Join-Path (Get-Location) 'src'
            & $python -I -B scripts/translation_loopback_check.py --suite providers --mode source --source-root $translationSource --firewall-receipt 'ci-v3-results/local-planning-firewall.json' --output-dir 'ci-v3-results' 2>&1 | Tee-Object 'ci-v3-results/provider-loopback-source.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Strict whole-provider28 source loopback acceptance failed.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='provider-source-http'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [provider-source-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            try {
            $translationSource = Join-Path (Get-Location) 'src'
            & $python -I -B scripts/translation_loopback_check.py --suite providers --mode installed --source-root $translationSource --firewall-receipt 'ci-v3-results/local-planning-firewall.json' --output-dir 'ci-v3-results' 2>&1 | Tee-Object 'ci-v3-results/provider-loopback-installed.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Strict whole-provider28 installed loopback acceptance failed.' }
            } catch {
              $requiredLocalFailures.Add([pscustomobject]@{ block='provider-installed-http'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED LOCAL BLOCK FAILED [provider-installed-http]: ' + $_.Exception.Message)
              @{ status='FAIL'; failures=$requiredLocalFailures.ToArray() } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-local-transport-failures.json'
            }
            if ($requiredLocalFailures.Count -ne 0) { throw ('Required local transport acceptance failed: ' + (($requiredLocalFailures.ToArray() | ForEach-Object { $_.block }) -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Validate local services, DSP, integrity and provider permission boundaries
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          # Flite executes in its mandatory Linux job. The new real-socket
          # translation suite executes in both explicit loopback firewall modes.
          python -m pytest -q --import-mode=importlib --ignore=tests/speech/test_flite_runtime.py --ignore=tests/assistant/test_translation_local_loopback.py tests/audio tests/speech tests/assistant tests/studio tests/storage/test_v3_state_backup.py tests/storage/test_state_snapshot_identity.py tests/language_qualification tests/conversion tests/extract/test_language_manager.py tests/packaging/test_prepare_windows_audio.py tests/academic_integration tests/ui/test_operation_progress.py tests/ui/test_progress_job_review.py tests/ui/test_command_registry.py tests/ui/test_keyboard_manager.py tests/storage/test_keyboard_preferences.py tests/ui/test_reader_keymap_context.py tests/test_delivery_contract.py tests/storage/test_pending_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_backup_v4_review.py tests/e2e/test_import_worker_publication.py tests/ingest/test_import_replay_identity.py tests/packaging/test_worker_bytecode.py tests/packaging/test_refresh_private_bundle_review.py tests/ui/test_profile_project_exports.py --junitxml=ci-v3-results/v3-tests.xml tests/ui/test_document_conversion.py tests/extract/test_document_formats_xml.py 2>&1 | Tee-Object 'ci-v3-results/v3-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only public Hunspell source notices and text evidence
        if: always()
        run: |
          if (Test-Path -LiteralPath 'ci-v3-results/hunspell' -PathType Container) {
            $ErrorActionPreference = 'Stop'
            if ($env:CARR_HUNSPELL_BUILD -and (Test-Path -LiteralPath (Join-Path $env:CARR_HUNSPELL_BUILD 'source') -PathType Container)) {
              $pin = Get-Content -LiteralPath 'scripts/hunspell-1.7.2-source.json' -Raw | ConvertFrom-Json
              foreach ($entry in $pin.files) {
                $source = Join-Path (Join-Path $env:CARR_HUNSPELL_BUILD 'source') $entry.path
                $target = Join-Path 'ci-v3-results/hunspell/upstream-source' $entry.path
                New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
                Copy-Item -LiteralPath $source -Destination $target
              }
            }
            $forbidden = @(Get-ChildItem -LiteralPath 'ci-v3-results/hunspell' -Recurse -File | Where-Object { $_.Extension -in @('.dll', '.exe', '.lib', '.pdb', '.whl', '.zip') })
            if ($forbidden.Count -ne 0) { throw 'The Hunspell evidence subdirectory may contain only public text and source notices.' }
          }

      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7
