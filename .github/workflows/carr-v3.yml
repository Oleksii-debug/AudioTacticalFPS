          $testTesseract = Join-Path $nativeOcrRoot 'tesseract.exe'
          if (!(Test-Path -LiteralPath $testTesseract -PathType Leaf)) { throw 'The exact prepared OCR executable is unavailable for native acceptance.' }
          $previousNativeOcr = $env:CARR_OCR_DIR
          @{ status='PASS'; runtime_root=$nativeOcrRoot; executable=$testTesseract; sha256=(Get-FileHash -LiteralPath $testTesseract -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content -Encoding utf8 'ci-v3-results/native-ocr-binding.json'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_V3_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
