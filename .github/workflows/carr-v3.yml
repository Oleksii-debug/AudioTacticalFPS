          if ($pin.upstream.runtime_asset.url -cne 'https://github.com/liblouis/liblouis/releases/download/v3.39.0/liblouis-3.39.0-win64.zip' -or $pin.upstream.runtime_asset.bytes -ne 5762099 -or $pin.upstream.runtime_asset.sha256 -cne '64d669ac30f1411e0023b1cecc81c7a7b5374678ee41302c95ac8c7c8fbc6591') { throw 'Unexpected official Liblouis qualification pin.' }
          $brailleInput = Join-Path $env:RUNNER_TEMP ('carr-braille-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $brailleInput -ErrorAction Stop | Out-Null
          $brailleArchive = Join-Path $brailleInput $pin.upstream.runtime_asset.name
          Invoke-WebRequest -Uri $pin.upstream.runtime_asset.url -OutFile $brailleArchive -ErrorAction Stop
          if ((Get-Item -LiteralPath $brailleArchive).Length -ne $pin.upstream.runtime_asset.bytes) { throw 'Wrong optional Liblouis archive size' }
          if ((Get-FileHash -LiteralPath $brailleArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.upstream.runtime_asset.sha256) { throw 'Wrong optional Liblouis archive SHA256' }
          'CARR_CI_BRAILLE_ARCHIVE=' + $brailleArchive | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the pinned EPUB3.3 conformance checker
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        id: epubcheck-runtime
        timeout-minutes: 10
        run: |
          $epubcheckWork = Join-Path $env:RUNNER_TEMP 'carr-epubcheck'
          New-Item -ItemType Directory -Force $epubcheckWork | Out-Null
          $pin = Get-Content -LiteralPath 'packaging/epubcheck.json' -Raw | ConvertFrom-Json
          if ($pin.version -ne '5.3.0' -or $pin.size -ne 33071108 -or $pin.sha256 -ne '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5' -or $pin.url -ne 'https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip') { throw 'Unexpected EPUBCheck3.3 acceptance pin.' }
          $epubcheckArchive = Join-Path $epubcheckWork 'epubcheck-5.3.0.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $epubcheckArchive
          if ((Get-Item -LiteralPath $epubcheckArchive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $epubcheckArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned EPUBCheck archive size/checksum mismatch.' }
          # Bind the actual Java runtime, rather than trusting a possible PATH launcher.
          $epubJavaCommand = (Get-Command java.exe -ErrorAction Stop).Source
          $epubJavaProperties = @(& $epubJavaCommand -XshowSettings:properties -version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'The selected Java launcher could not identify its runtime.' }
          $epubJavaHomes = @($epubJavaProperties | ForEach-Object { if ($_.ToString() -match '^\s*java\.home = (.+)$') { $Matches[1].Trim() } })
          if ($epubJavaHomes.Count -ne 1) { throw 'Java did not report exactly one runtime home.' }
          $epubJava = [System.IO.Path]::GetFullPath((Join-Path $epubJavaHomes[0] 'bin/java.exe'))
          if (!(Test-Path -LiteralPath $epubJava -PathType Leaf)) { throw 'The direct Java runtime executable is missing.' }
          $epubJavaVersion = @(& $epubJava -version 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0) { throw 'The direct Java runtime could not start.' }
          "CARR_EPUBCHECK_ARCHIVE=$epubcheckArchive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_EPUBCHECK_JAVA=$epubJava" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{ status='PASS'; validator='EPUBCheck5.3.0'; epub_specification='3.3'; archive_sha256=$pin.sha256; java=$epubJava; java_version=$epubJavaVersion; java_sha256=(Get-FileHash -LiteralPath $epubJava -Algorithm SHA256).Hash.ToLowerInvariant(); acquisition='explicit before offline firewall'; bundled=$false } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/epubcheck-test-runtime.json'
          # Explicit test-only DTD acquisition finishes before the existing egress firewall.
          # The validator uses the already hash-pinned lxml 6.1.3; no runtime downgrade or bundled schemas.
          $daisySchemas = Join-Path $env:RUNNER_TEMP 'carr-daisy-validation-schemas'
          New-Item -ItemType Directory -Force $daisySchemas | Out-Null
          $daisyPin = Get-Content -LiteralPath 'packaging/daisy-validation-schemas.json' -Raw | ConvertFrom-Json
          $daisyNames = @('SMIL10.dtd', 'xhtml-lat1.ent', 'xhtml-special.ent', 'xhtml-symbol.ent', 'xhtml1-transitional.dtd')
          $daisyProperties = @($daisyPin.files.PSObject.Properties)
          if ($daisyPin.schema -ne 1 -or $daisyProperties.Count -ne 5 -or @(Compare-Object ($daisyNames | Sort-Object) ($daisyProperties.Name | Sort-Object) -CaseSensitive).Count -ne 0) { throw 'Unexpected DAISY schema inventory.' }
          $daisyEvidence = @()
          foreach ($property in $daisyProperties) {
            $schemaPath = Join-Path $daisySchemas $property.Name
            Invoke-WebRequest -Uri $property.Value.url -OutFile $schemaPath -TimeoutSec 60
            $digest = (Get-FileHash -LiteralPath $schemaPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Item -LiteralPath $schemaPath).Length -ne $property.Value.size -or $digest -ne $property.Value.sha256) { throw ('DAISY validation schema differs from its pin: ' + $property.Name) }
            $daisyEvidence += @{ name=$property.Name; bytes=$property.Value.size; sha256=$digest; url=$property.Value.url }
          }
          "CARR_DAISY_SCHEMAS=$daisySchemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{ status='PASS'; schema_pin_sha256=(Get-FileHash -LiteralPath 'packaging/daisy-validation-schemas.json' -Algorithm SHA256).Hash.ToLowerInvariant(); schemas=$daisyEvidence; acquisition='explicit before offline firewall'; bundled=$false } | ConvertTo-Json -Depth 5 | Set-Content 'ci-v3-results/daisy-schema-acquisition.json'
      - name: Real native SAPI, scene production, keyboard controls and restart
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $requiredSpeechNativeFailures = [System.Collections.Generic.List[object]]::new()
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/runtime-firewall.json'
            try {
            & $python -I -B scripts/windows_v3_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native speech and production acceptance failed.' }
            } catch {
              $requiredSpeechNativeFailures.Add([pscustomobject]@{ block='speech-production'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED NATIVE BLOCK FAILED [speech-production]: ' + $_.Exception.Message)
              @{ status=$(if ($requiredSpeechNativeFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); failures=$requiredSpeechNativeFailures.ToArray(); qualification='Every native block remains required' } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-speech-native-failures.json'
            }
            try {
            & $python -I -B scripts/windows_translation_v3_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-translation-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native Advanced translation controls, vault and derivative workflow failed.' }
            } catch {
              $requiredSpeechNativeFailures.Add([pscustomobject]@{ block='advanced-translation'; error=$_.Exception.Message; error_type=$_.Exception.GetType().FullName })
              Write-Host ('REQUIRED NATIVE BLOCK FAILED [advanced-translation]: ' + $_.Exception.Message)
              @{ status=$(if ($requiredSpeechNativeFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); failures=$requiredSpeechNativeFailures.ToArray(); qualification='Every native block remains required' } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'ci-v3-results/required-speech-native-failures.json'
            }
          try {
          & $python -I -B scripts/windows_translation_documents_smoke.py --source-root (Resolve-Path 'src').Path 2>&1 | Tee-Object 'ci-v3-results/native-translation-documents.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed native document translation failed.' }
          $verifyDocumentTranslation = @'
          from hashlib import sha256
          import json, pathlib, re, sys
          raw = pathlib.Path("ci-v3-results/native-translation-documents.txt").read_text(encoding='utf-8-sig')
          reports = []
          for match in re.finditer(r'(?m)^\{', raw):
              try:
                  item, _ = json.JSONDecoder().raw_decode(raw[match.start():])
              except ValueError:
                  continue
              if isinstance(item, dict) and 'local_and_document_controls' in item:
                  reports.append(item)
          assert len(reports) == 1, 'Native document translation report is missing or ambiguous.'
          report = reports[0]
          assert report['status'] == report['native_keyboard'] == report['local_and_document_controls'] == 'PASS'
          assert report['check_count'] == len(report['checks']) == 58
          assert report['synthetic_protocol_calls'] == 6
          assert report['host_jobs'] == 'actual DesktopFrame.run_job / DesktopExecutor / ProgressHub'
          assert all(report[name] == 'NOT_RUN' for name in ('controlled_consent_and_pickers',
              'actual_local_model_inference', 'offline_server_egress', 'translation_quality', 'nvda'))
          required = set(["native Windows wx","local translation native modal","local external budget is zero and readonly","local preview includes unqualified runtime distinction","local completion retains native status focus","document workstation native modal","source capture makes no provider calls","batch preview has exact four paragraph requests","preparation has no provider calls","exact approved paragraph calls","batch completion retains native status focus","two actual published source derivatives","selected original bytes remain unchanged","batch export retains native status focus","actual shared desktop executor","actual unmodified host run_job","actual shared ProgressHub","actual retained catalog and workspace","document translation uses the shared keyboard registry","actual host worker and progress bind every protocol call","actual host shutdown has no retained cleanup failure","installed exact source: carr_library.assistant.profiles","installed exact source: carr_library.assistant.providers","installed exact source: carr_library.assistant.translation","installed exact source: carr_library.assistant.translation_local","installed exact source: carr_library.assistant.translation_documents","installed exact source: carr_library.ui.translation_dialog","installed exact source: carr_library.ui.translation_documents","installed exact source: carr_library.ui.desktop_app","installed exact source: carr_library.ui.worker_lifetime","installed exact source: carr_library.progress","installed exact source: carr_library.ui.progress_panel"])
          assert required <= set(report['checks']), sorted(required - set(report['checks']))
          names = set(["carr_library.assistant.profiles","carr_library.assistant.providers","carr_library.assistant.translation","carr_library.assistant.translation_local","carr_library.assistant.translation_documents","carr_library.ui.translation_dialog","carr_library.ui.translation_documents","carr_library.ui.desktop_app","carr_library.ui.worker_lifetime","carr_library.progress","carr_library.ui.progress_panel"])
          assert set(report['source_origins']) == names
          source_root = pathlib.Path('src').resolve(strict=True)
          for name in names:
              item = report['source_origins'][name]
              actual = pathlib.Path(item['path']).resolve(strict=True)
              selected = source_root / pathlib.Path(*name.split('.')).with_suffix('.py')
              assert actual.is_relative_to(pathlib.Path(sys.prefix).resolve())
              assert 'site-packages' in actual.parts and not actual.is_relative_to(source_root)
              assert item['sha256'] == sha256(actual.read_bytes()).hexdigest() == sha256(selected.read_bytes()).hexdigest()
          pathlib.Path("ci-v3-results/native-translation-documents.json").write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(dict(status='PASS', required_checks=sorted(required), actual_shared_host='PASS',
              synthetic_protocol_calls=6, actual_local_model_inference='NOT_RUN',
              translation_quality='NOT_RUN', offline_server_egress='NOT_RUN', manual_nvda='NOT_RUN')), flush=True)
          '@
