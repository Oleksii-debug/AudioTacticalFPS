            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe'), $testTesseract) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          # Save exact recovery inputs before changing this disposable runner.
          # A step timeout can terminate PowerShell without executing finally.
          $recoveryRules = @()
          for ($index = 0; $index -lt $programs.Count; $index++) { $recoveryRules += $rulePrefix + '-' + $index }
          @{
            schema = 'carr-ci-firewall-recovery/1'
            run_id = $env:GITHUB_RUN_ID
