name: CARR V3 local studio and assistant

on:
  pull_request:
    branches: [carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  push:
    branches: [carr/canonical-integrity-finish-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable-source:
    name: Portable source integrity (synthetic engines)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install and identify actual OCR required by source recovery tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core ffmpeg
          mkdir -p ci-source-results
          tesseract --version > ci-source-results/ocr-version.txt 2>&1
          tesseract --list-langs > ci-source-results/ocr-languages.txt 2>&1
          dpkg-query -W tesseract-ocr tesseract-ocr-eng fonts-dejavu-core ffmpeg > ci-source-results/native-test-packages.txt
          ffmpeg -version > ci-source-results/ffmpeg-version.txt 2>&1
          ffprobe -version > ci-source-results/ffprobe-version.txt 2>&1
      - name: Install declared source-test dependencies
        run: |
          mkdir -p ci-source-results
          git rev-parse HEAD > ci-source-results/tested-commit.txt
          python -m pip install '.[test]'
          python -m pip freeze > ci-source-results/installed-dependencies.txt
          python -m pip check
          python -c "from carr_library.extract.ocr_runtime import discover_ocr_runtime; assert discover_ocr_runtime() is not None, 'Required actual OCR runtime is unavailable'"
      - name: Verify reconstructed source and durable boundaries
        run: |
          python -B -m pytest -p no:cacheprovider -q --import-mode=importlib \
            tests/speech/test_source.py \
            tests/speech/test_session.py \
            tests/speech/test_reading.py \
            tests/audio/test_supplied_transcription.py \
            tests/audio/test_supplied_runtime_manifest.py \
            tests/audio/test_process_start_cleanup.py \
            tests/ingest/test_import_metadata_shape.py \
            tests/packaging/test_delivery_archive.py \
            tests/packaging/test_standard_installer.py \
            tests/operations \
            tests/ui/test_operations_policy.py \
            tests/ui/test_operations_dialog.py \
            tests/storage/test_state_json_reader.py \
            tests/ui/test_save_actions.py \
            tests/extract/test_ocr_inventory_boundary.py \
            tests/assistant/test_translation.py \
            tests/ui/test_translation_selection.py \
            tests/studio/test_publishing.py \
            tests/studio/test_publishing_cli.py \
            tests/studio/test_publishing_handlers.py \
            tests/assistant/test_providers.py \
            tests/packaging/test_ci_check.py \
            tests/e2e/test_operations_cli.py \
            tests/ui/test_transcription_dialog.py \
            tests/ui/test_progress_voice_actions.py \
            tests/ui/test_progress_media_quiet.py \
            tests/ingest/test_worker_publication_boundary.py \
            tests/ingest/test_worker_attempt_receipts.py \
            tests/ingest/test_competing_publication_receipts.py \
            tests/ingest/test_canonical_publication_binding.py \
            tests/audio/test_music.py \
            tests/ingest/test_import_publication_point.py \
            tests/storage/test_publication_migration.py \
            tests/storage/test_canonical_v5_compatibility.py \
            tests/e2e/test_import_worker_publication.py \
            tests/ingest/test_import_replay_identity.py \
            tests/packaging/test_native_launcher_acceptance.py \
            tests/storage/test_backup_schema_identity.py \
            tests/ingest/test_worker_isolated_launch.py \
            tests/e2e/test_import_worker.py \
            tests/storage/test_atomic_state_publication.py \
            tests/storage/test_v3_state_backup.py \
            tests/storage/test_pending_backup.py \
            tests/storage/test_complete_pending_backup.py \
            tests/storage/test_state_backup_portability.py \
            tests/storage/test_state_snapshot_portability.py \
            tests/ui/test_academic_export_handler.py \
            tests/ui/test_academic_library_dialog.py \
            tests/ui/test_academic_actions.py \
            tests/ui/test_catalog_tools_dialog.py \
            tests/ui/test_reading_desk_actions.py \
            tests/ui/test_import_center.py \
            tests/ui/probe_catalog_insights_actions.py \
            tests/reader/test_file_export.py \
