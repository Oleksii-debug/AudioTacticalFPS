            rule_names = $recoveryRules
            profiles = @($profilesBefore | ForEach-Object { @{ name = [string]$_.Name; enabled = [string]$_.Enabled } })
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'ci-v3-results/native-firewall-recovery.json' -Encoding utf8
          try {
            $env:CARR_OCR_DIR = $nativeOcrRoot
