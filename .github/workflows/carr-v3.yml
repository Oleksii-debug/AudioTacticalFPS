  native-studio:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spellInput = Join-Path $env:RUNNER_TEMP 'carr-spell-input'
          $spellDerived = Join-Path $env:RUNNER_TEMP 'carr-spell-derived'
          New-Item -ItemType Directory -Force $spellInput, $spellDerived | Out-Null
          python -m pip download --only-binary=:all: --no-deps spylls==0.1.7 --dest $spellInput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/repack_spellcheck.py (Join-Path $spellInput 'spylls-0.1.7-py2.py3-none-any.whl') (Join-Path $spellDerived 'spylls-0.1.7+carr.1-py2.py3-none-any.whl') | Tee-Object 'ci-v3-results/spellcheck-repack.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-index --no-deps --require-hashes --find-links $spellDerived -r packaging/spellcheck.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify canonical citation and DOCX regeneration boundaries
        timeout-minutes: 5
        run: |
          python -I -B -c "import importlib.metadata,json,pathlib,quickjs; version=importlib.metadata.version('quickjs-ng'); assert version=='0.18.0.2'; context=quickjs.Context(); context.set_memory_limit(8*1024*1024); context.set_time_limit(1.0); assert context.eval('6*7')==42; print(json.dumps(dict(runtime='quickjs-ng',version=version,module=str(pathlib.Path(quickjs.__file__).resolve()),evaluation='PASS')))" | Tee-Object 'ci-v3-results/citation-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_check.py --jobs 3 tests/academic_integration/test_runtime_adapter.py tests/academic_integration/test_formatting.py tests/academic_integration/test_documents.py tests/academic_integration/test_regeneration.py tests/academic_integration/test_end_to_end.py tests/academic_integration/test_citation_ui.py tests/storage/test_durable_state_publication.py tests/ui/test_profile_project_exports.py 2>&1 | Tee-Object 'ci-v3-results/citation-regeneration.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified OCR engine before installed recovery acceptance
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'ocr'
          $ocrSource = Join-Path $ocrWork 'ocr-corresponding-source.tar'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-v3-results/audio-runtime.json'
