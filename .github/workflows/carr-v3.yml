      - name: Retain complete source phase evidence before installed acceptance
        if: ${{ !cancelled() && steps.publication-source-contracts.outcome != 'skipped' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-phase-source-v3-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/strict-publication.txt
          if-no-files-found: error
          retention-days: 3

      - name: Verify installed publication, recording, clips and EPUB3.3 without egress
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' && steps.publication-audio-runtime.outcome == 'success' && steps.epubcheck-runtime.outcome == 'success' }}
        # The retained union contains 117 installed whole modules followed by 27
        # native/conformance commands. Give that aggregate a finite outer envelope;
        # each existing process/watchdog and every required failure still governs.
        timeout-minutes: 120
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publicationPrograms = @($python, $basePython, $env:CARR_EPUBCHECK_JAVA,
            (Join-Path $env:CARR_V3_PUBLICATION_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_PUBLICATION_AUDIO 'bin/ffprobe.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffplay.exe')) | ForEach-Object {
            if (!(Test-Path -LiteralPath $_ -PathType Leaf)) { throw 'A required publication runtime executable is missing.' }
            [System.IO.Path]::GetFullPath($_)
          } | Sort-Object -Unique
          $requiredPublicationNativeFailures = [System.Collections.Generic.List[object]]::new()
          $publicationRulePrefix = 'CARR-publication-offline-' + [guid]::NewGuid().ToString('N')
          $publicationRules = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $publicationPrograms) {
              $ruleName = $publicationRulePrefix + '-' + $publicationRules.Count
              $publicationRules += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline publication requires enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $publicationRules -ErrorAction Stop)
            if ($active.Count -ne $publicationPrograms.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline publication rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($publicationPrograms | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline publication rules do not cover the selected Python, audio and Java executables.' }
            @{ status='PASS'; blocked_programs=$filters; scope='selected Python, audio and Java executables; not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/publication-firewall.json'
            $installedPublication = @'
