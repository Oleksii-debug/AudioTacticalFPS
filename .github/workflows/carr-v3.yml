name: CARR V3 local studio and assistant

on:
  pull_request:
    branches: [carr-library, carr/v3-integrated-studio-20261126]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  push:
    branches: [carr/v3-dordiai-primary-411a-20261126, carr/canonical-completion-2aa-20261127, carr/v3-primary103-recovered-composition-20261126, carr/unified-publication-24-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-${{ github.head_ref || github.ref_name }}
  # Let an active integrated native run finish while the next exact tree queues.
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'carr/canonical-completion-2aa-20261127' }}

jobs:
  native-studio:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed client state and actual native review controls
        timeout-minutes: 5
        run: |
          python scripts/ci_check.py --jobs 2 tests/security/test_anchor_locking.py tests/security/test_canonical_boundary.py tests/security/test_controller.py tests/security/test_entitlements.py tests/security/test_idle_renewal.py tests/security/test_independent_review_boundaries.py tests/security/test_installation.py tests/security/test_publication_integrity.py tests/security/test_refresh.py tests/security/test_updates.py tests/security/test_update_polling.py 2>&1 | Tee-Object 'ci-v3-results/trusted-client-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B tests/ui/native_trust_status_smoke.py --native 2>&1 | Tee-Object 'ci-v3-results/trusted-client-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require reviewed local voice bridge and saved configuration checks
        run: |
          python scripts/ci_check.py tests/speech/test_python_helper.py tests/integrations/test_dordiai_voices.py tests/integrations/test_dordiai_speech.py tests/integrations/test_dordiai_settings.py tests/integrations/test_dordiai_probe_cancellation.py tests/integrations/test_dordiai_convergence.py tests/ui/test_studio_progress_results.py tests/ui/test_worker_cleanup.py tests/speech/test_discovery_cancellation.py tests/storage/test_state_snapshot_identity.py 2>&1 | Tee-Object 'ci-v3-results/dordiai-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare exact official Hunspell source and installed compiler
        timeout-minutes: 5
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'carr-hunspell-official-source'
          $build = Join-Path $env:RUNNER_TEMP 'carr-hunspell-native-build'
          if ((Test-Path -LiteralPath $source) -or (Test-Path -LiteralPath $build)) { throw 'Hunspell acceptance directories must be new.' }
          git init $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source fetch --depth 1 https://github.com/hunspell/hunspell.git 2969be996acad84b91ab3875b1816636fe61a40e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source -c advice.detachedHead=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commit = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne '2969be996acad84b91ab3875b1816636fe61a40e') { throw 'Hunspell source identity differs.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Installed x64 MSVC toolchain not found.' }
          "CARR_HUNSPELL_VSDEVCMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_HUNSPELL_SOURCE=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_HUNSPELL_BUILD=$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build pinned Hunspell as an ephemeral native acceptance input
        id: hunspell-build
        timeout-minutes: 7
        shell: cmd
        run: |
          call "%CARR_HUNSPELL_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          python -I -B -X utf8 scripts\build_hunspell_msvc.py --source "%CARR_HUNSPELL_SOURCE%" --output "%CARR_HUNSPELL_BUILD%" --msbuild "%VSINSTALLDIR%MSBuild\Current\Bin\MSBuild.exe" --vc-tools-dir "%VCToolsInstallDir%." --sdk-dir "%WindowsSdkDir%." --sdk-version "%WindowsSDKVersion:\=%"
          if errorlevel 1 exit /b %errorlevel%
      - name: Require actual installed Hunspell C API and owned child cleanup
        timeout-minutes: 3
        run: |
          $dll = Join-Path $env:CARR_HUNSPELL_BUILD 'bin/libhunspell.dll'
          python -I -B -X utf8 scripts/hunspell_acceptance.py --library $dll --output ci-v3-results/hunspell-native-acceptance.json 2>&1 | Tee-Object 'ci-v3-results/hunspell-native-acceptance.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verify = @'
          from hashlib import sha256
          import importlib, json, os
          from pathlib import Path
          root = Path.cwd().resolve()
          build = json.loads((Path(os.environ['CARR_HUNSPELL_BUILD']) / 'build-report.json').read_bytes())
          report = json.loads(Path('ci-v3-results/hunspell-native-acceptance.json').read_bytes())
          assert build['status'] == 'BUILT' and build['source_commit'] == '2969be996acad84b91ab3875b1816636fe61a40e'
          assert build['source_manifest_sha256'] == 'f5ea8a9afae905cd1d2dd56415b320fd0949d85e28151eb8ddb63d19d128aefc'
          assert report['status'] == 'PASS' and report['native_windows'] == 'EXECUTED'
          assert len(report['checks']) == len(set(report['checks'])) == 14
          assert report['native_library_sha256'] == build['dll']['sha256']
          assert report['native_library_bytes'] == build['dll']['bytes']
          for name, digest in report['application_modules'].items():
              module = importlib.import_module(name)
              loaded = Path(module.__file__).resolve()
              source = root / 'src' / Path(*name.split('.')).with_suffix('.py')
              assert not loaded.is_relative_to(root) and 'site-packages' in loaded.parts, name
              assert sha256(loaded.read_bytes()).hexdigest() == digest == sha256(source.read_bytes()).hexdigest(), name
          print(json.dumps({'status': 'PASS', 'checks': 14, 'installed_modules': report['application_modules'], 'dll_sha256': report['native_library_sha256']}))
          '@
          $verify | python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Hunspell build diagnostics without distributing native payloads
        if: ${{ always() && steps.hunspell-build.outcome != 'skipped' }}
        run: |
          foreach ($name in @('build-report.json', 'build.log')) {
            $candidate = Join-Path $env:RUNNER_TEMP ('carr-hunspell-native-build/' + $name)
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { Copy-Item -LiteralPath $candidate -Destination (Join-Path ci-v3-results ('hunspell-' + $name)) }
          }
      - name: Verify canonical citation and DOCX regeneration boundaries
        timeout-minutes: 12
        run: |
          python scripts/ci_check.py --jobs 2 tests/citations/test_csl.py tests/academic_integration/test_formatting.py tests/academic_integration/test_documents.py tests/academic_integration/test_regeneration.py tests/academic_integration/test_end_to_end.py tests/academic_integration/test_citation_ui.py tests/storage/test_durable_state_publication.py 2>&1 | Tee-Object 'ci-v3-results/citation-regeneration.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require bounded provider transport and durable translation boundaries
        timeout-minutes: 5
        run: |
          python -B -m pytest -q -o xfail_strict=true tests/assistant/test_providers.py tests/assistant/test_translation.py tests/assistant/test_provider_deadline.py tests/assistant/test_provider_resolution.py tests/assistant/test_translation_v3.py tests/assistant/test_local_planning_loopback.py --junitxml=ci-v3-results/provider-boundaries.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/provider-boundaries.xml').iter('testcase')); names={c.get('name','').split('[')[0] for c in cases}; required={'test_real_tls_drip_obeys_whole_call_deadline','test_late_end_of_body_never_returns_success','test_google_discovery_remains_get_with_verified_original_tls_authority','test_remote_charge_state_tracks_whether_http_transmission_began','test_interrupted_audio_discards_already_streamed_bytes_and_never_retries','test_remote_dns_rejects_every_disallowed_answer_before_connect','test_saved_translation_requires_its_original_authority_and_receipts','test_advanced_v3_keeps_verified_tls_authority_and_exact_plaintext','test_advanced_v3_late_body_cannot_publish_or_retry'}; assert cases and required<=names and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')); print(json.dumps(dict(status='PASS',passed=len(cases),network='synthetic loopback TLS only',actual_provider_calls='NOT_RUN')))" | Tee-Object 'ci-v3-results/provider-boundaries.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified OCR engine before installed recovery acceptance
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'ocr'
          $ocrSource = Join-Path $ocrWork 'ocr-corresponding-source.tar'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed backup and import publication integrity
        timeout-minutes: 10
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $installedRecovery = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          import carr_library, carr_library.state_backup, carr_library.ingest.worker
          import carr_library.application, carr_library.pending_backup, carr_library.library_backup
          import carr_library.speech.reading, carr_library.speech.source, carr_library.ui.speech_dialog
          import carr_library.speech.runtime, carr_library.acquisition.providers
          import carr_library.speech.session
          import carr_library.extract.ocr_runtime
          import carr_library.storage.revisions, carr_library.storage.schema_identity
          import pytest
          checkout = pathlib.Path.cwd().resolve()
          names = ('carr_library', 'carr_library.state_backup', 'carr_library.ingest.worker',
                   'carr_library.application', 'carr_library.pending_backup', 'carr_library.library_backup',
                   'carr_library.speech.reading', 'carr_library.speech.source', 'carr_library.ui.speech_dialog',
                   'carr_library.speech.runtime', 'carr_library.acquisition.providers',
                   'carr_library.speech.session',
                   'carr_library.extract.ocr_runtime',
                   'carr_library.storage.revisions', 'carr_library.storage.schema_identity')
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout) for path in origins.values()), origins
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logstart(self, nodeid, location):
                  print('RECOVERY START: ' + nodeid[:240], flush=True)
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
                  if report.when == 'call':
                      print(f'RECOVERY {report.outcome}: {report.duration:.3f}s ' + report.nodeid[:240], flush=True)
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-recovery.xml')
          suites = ['tests/storage/test_v3_state_backup.py',
                    'tests/storage/test_backup_schema_identity.py',
                    'tests/storage/test_backup_v4_sidecars.py',
                    'tests/storage/test_backup_primary_producers.py',
                    'tests/storage/test_backup_translation.py',
                    'tests/storage/test_backup_transcription.py',
                    'tests/storage/test_backup_book_plan_bindings.py',
                    'tests/storage/test_backup_generated_audio.py',
                    'tests/storage/test_backup_keyboard_drafts.py',
                    'tests/storage/test_backup_pending_common4.py',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_collisions',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_allows_distinct_siblings',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_non_windows_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_keeps_ordinary_unicode_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_snapshot_roundtrip_unicode',
                    'tests/extract/test_ocr_runtime.py::test_unreadable_directory_rejects_entire_inventory',
                    'tests/extract/test_ocr_runtime.py::test_empty_directory_inventory_has_a_bound',
                    'tests/extract/test_ocr_runtime.py::test_directory_inventory_checks_budget_between_entries',
                    'tests/storage/test_pending_backup.py',
                    'tests/storage/test_complete_pending_backup.py',
                    'tests/storage/test_academic_migration.py',
                    'tests/storage/test_backup_schema_identity.py',
                    'tests/e2e/test_import_worker_publication.py',
                    'tests/e2e/test_import_publication_receipt_integrity.py',
                    'tests/ingest/test_import_replay_identity.py',
                    'tests/storage/test_engine_settings_backup.py',
                    'tests/speech/test_python_helper.py',
                    'tests/speech/test_reading.py',
                    'tests/speech/test_source.py',
                    'tests/speech/test_session.py',
                    'tests/packaging/test_worker_bytecode.py']
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=',
                               '-o', 'xfail_strict=true', '-o', 'faulthandler_timeout=120', '--import-mode=importlib',
                               '--junitxml=' + str(report), *suites], plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          passed = len(cases) - failed - skipped
          portable = [case for case in cases if 'test_state_backup_portability' in case.get('classname', '').split('.')]
          portable_complete = len(portable) == 21 and len({case.get('name') for case in portable}) == 21
          required_ocr = {'test_unreadable_directory_rejects_entire_inventory', 'test_empty_directory_inventory_has_a_bound', 'test_directory_inventory_checks_budget_between_entries'}
          ocr_cases = [c.get('name') for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_ocr_runtime']
          ocr_exact = len(ocr_cases) == len(required_ocr) and set(ocr_cases) == required_ocr
          ok = status == 0 and passed > 0 and failed == skipped == 0 and not policy.seen and portable_complete and ocr_exact
          result = dict(status='PASS' if ok else 'FAIL', passed=passed, failed=failed,
                        skipped=skipped, pytest_exit=int(status), expected_failures=policy.seen,
                        origins=installed_origins(), ocr_inventory_cases=sorted(ocr_cases),
                        ocr_inventory_exact=ocr_exact, manual_nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-recovery.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          $previousTessdata = $env:TESSDATA_PREFIX
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
            $installedRecovery | python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-recovery.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
            $env:TESSDATA_PREFIX = $previousTessdata
          }
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          $audioInputs = Join-Path $env:RUNNER_TEMP 'carr-audio-inputs'
          python packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-v3-results/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          python packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audio | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require canonical capture, editing, publication and local planning
        timeout-minutes: 12
        run: |
          python scripts/ci_check.py --jobs 2 tests/extract/test_language_detection.py tests/extract/test_ocr_language_regions.py tests/storage/test_ocr_language_presets.py tests/ui/test_ocr_selection.py tests/audio/test_metadata.py tests/audio/test_metadata_cleanup_scope.py tests/audio/test_metadata_publication.py tests/audio/test_metadata_stream_hash.py tests/audio/test_metadata_review.py tests/ui/test_audio_metadata_dialog.py tests/ui/test_audio_metadata_lifetime.py tests/audio/test_audio_process.py tests/e2e/test_source_file.py tests/extract/test_raster_pages.py tests/e2e/test_raster_import.py tests/catalog/test_streaming_intake.py tests/ingest/test_large_source_intake.py tests/ingest/test_batch_continuation.py tests/ingest/test_batch_continuation_cli.py tests/e2e/test_import_legacy_config.py tests/e2e/test_import_commit_supervisor.py tests/ui/test_import_center.py tests/audio/test_recording.py tests/audio/test_conversion_batch.py tests/ui/test_audio_conversion_dialog.py tests/studio/test_audio_conversion_cli.py tests/audio/test_capture_admission.py tests/audio/test_capture_windows_lifetime.py tests/ui/test_recording_dialog.py tests/studio/test_clip_editing.py tests/studio/test_clip_dialog.py tests/studio/test_project_effects.py tests/studio/test_studio_controller.py tests/studio/test_book_audio.py tests/ui/test_book_audio_dialog.py tests/ui/test_worker_lifetime.py tests/ui/test_trust_lifetime.py tests/speech/test_player_controls.py tests/speech/test_wave_output.py tests/speech/test_playlist.py tests/speech/test_playlist_recovery.py tests/ui/test_audio_playback.py tests/ui/test_reader_playback.py tests/ui/test_reader_playback_actions.py tests/studio/test_publishing.py tests/studio/test_publishing_boundaries.py tests/studio/test_publishing_cli.py tests/studio/test_publishing_handlers.py tests/studio/test_daisy_publishing.py tests/studio/test_daisy_boundaries.py tests/assistant/test_translation_source.py tests/assistant/test_translation_batch.py tests/assistant/test_translation_batch_cli.py tests/assistant/test_translation_batch_ui.py tests/packaging/test_installer_process.py tests/packaging/test_standard_installer.py tests/assistant/test_local_tools.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_template_handlers.py tests/assistant/test_workflow_template_parameters.py tests/assistant/test_workflow_templates_cli.py tests/assistant/test_workflow_template_editor.py tests/assistant/test_player_tools.py tests/assistant/test_search_paging.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py tests/assistant/test_translation_v3.py tests/reader/test_ebook_audio.py tests/speech/test_pronunciation_review.py tests/speech/test_pronunciation_handlers.py tests/speech/test_pronunciation_reader_hook.py tests/speech/test_voice_preferences.py tests/storage/test_voice_preferences_backup.py tests/ui/test_voice_preferences_dialog.py tests/speech/test_reading_presentation.py tests/speech/test_reading_presentation_handlers.py tests/speech/test_reading_presentation_reader_hook.py tests/storage/test_reader_preferences_backup.py tests/speech/test_reading_tabs.py tests/speech/test_reading_marks.py tests/speech/test_reading_focus.py tests/ui/test_reading_focus.py tests/ui/test_reader_focus_hook.py tests/ui/test_reading_tools.py tests/speech/test_narration_policy.py tests/ui/test_reading_narration.py tests/ui/test_reader_listening_hook.py tests/operations/test_worker_start_cleanup.py tests/studio/test_measured_audio.py tests/ui/test_book_duration_dialog.py tests/speech/test_listening.py tests/ui/test_reader_tabs.py tests/ui/test_reader_voice_recovery.py tests/audio/test_recording_controls.py tests/audio/test_recording_monitor.py tests/studio/test_book_batch.py tests/studio/test_book_cli.py tests/studio/test_book_landmarks.py tests/ui/test_book_batch_dialog.py tests/storage/test_backup_publications.py tests/storage/test_backup_incremental.py tests/ui/test_backup_incremental_dialog.py tests/speec