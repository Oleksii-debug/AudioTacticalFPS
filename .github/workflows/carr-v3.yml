name: CARR V3 local studio and assistant

on:
  pull_request:
    branches: [carr-library, carr/v3-integrated-studio-20261126]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  push:
    branches: [carr/v3-dordiai-primary-411a-20261126, carr/canonical-completion-2aa-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-studio:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact application and native desktop dependencies
        id: install-runtime
        run: |
          New-Item -ItemType Directory -Force 'ci-v3-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-v3-results/tested-commit.txt'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed client state and actual native review controls
        timeout-minutes: 5
        run: |
          python scripts/ci_check.py --jobs 2 tests/security/test_anchor_locking.py tests/security/test_canonical_boundary.py tests/security/test_controller.py tests/security/test_entitlements.py tests/security/test_idle_renewal.py tests/security/test_independent_review_boundaries.py tests/security/test_installation.py tests/security/test_publication_integrity.py tests/security/test_refresh.py tests/security/test_updates.py tests/security/test_update_polling.py 2>&1 | Tee-Object 'ci-v3-results/trusted-client-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B tests/ui/native_trust_status_smoke.py --native 2>&1 | Tee-Object 'ci-v3-results/trusted-client-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require reviewed local voice bridge and saved configuration checks
        run: |
          python scripts/ci_check.py tests/integrations/test_dordiai_voices.py tests/integrations/test_dordiai_speech.py tests/integrations/test_dordiai_settings.py tests/integrations/test_dordiai_probe_cancellation.py tests/integrations/test_dordiai_convergence.py tests/speech/test_discovery_cancellation.py tests/storage/test_state_snapshot_identity.py 2>&1 | Tee-Object 'ci-v3-results/dordiai-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify canonical citation and DOCX regeneration boundaries
        timeout-minutes: 5
        run: |
          node --version | Tee-Object 'ci-v3-results/citation-node-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_check.py tests/academic_integration/test_formatting.py tests/academic_integration/test_documents.py tests/academic_integration/test_regeneration.py tests/academic_integration/test_end_to_end.py tests/academic_integration/test_citation_ui.py tests/storage/test_durable_state_publication.py 2>&1 | Tee-Object 'ci-v3-results/citation-regeneration.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require bounded provider transport and durable translation boundaries
        timeout-minutes: 5
        run: |
          python -B -m pytest -q -o xfail_strict=true tests/assistant/test_providers.py tests/assistant/test_translation.py tests/assistant/test_provider_deadline.py tests/assistant/test_provider_resolution.py tests/assistant/test_translation_v3.py tests/assistant/test_local_planning_loopback.py --junitxml=ci-v3-results/provider-boundaries.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/provider-boundaries.xml').iter('testcase')); names={c.get('name','').split('[')[0] for c in cases}; required={'test_real_tls_drip_obeys_whole_call_deadline','test_late_end_of_body_never_returns_success','test_google_discovery_remains_get_with_verified_original_tls_authority','test_remote_charge_state_tracks_whether_http_transmission_began','test_interrupted_audio_discards_already_streamed_bytes_and_never_retries','test_remote_dns_rejects_every_disallowed_answer_before_connect','test_saved_translation_requires_its_original_authority_and_receipts','test_advanced_v3_keeps_verified_tls_authority_and_exact_plaintext','test_advanced_v3_late_body_cannot_publish_or_retry'}; assert cases and required<=names and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')); print(json.dumps(dict(status='PASS',passed=len(cases),network='synthetic loopback TLS only',actual_provider_calls='NOT_RUN')))" | Tee-Object 'ci-v3-results/provider-boundaries.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified OCR engine before installed recovery acceptance
        timeout-minutes: 10
        run: |
          $ocrWork = Join-Path $env:RUNNER_TEMP 'carr-v3-ocr'
          New-Item -ItemType Directory -Force $ocrWork | Out-Null
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $ocrWork 'ocr'
          $ocrSource = Join-Path $ocrWork 'ocr-corresponding-source.tar'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $ocrWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-v3-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed backup and import publication integrity
        timeout-minutes: 10
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $installedRecovery = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          import carr_library, carr_library.state_backup, carr_library.ingest.worker
          import carr_library.application, carr_library.pending_backup, carr_library.library_backup
          import carr_library.speech.reading, carr_library.speech.source, carr_library.ui.speech_dialog
          import carr_library.speech.runtime, carr_library.academic_integration.doi
          import carr_library.speech.session
          import carr_library.storage.revisions, carr_library.storage.schema_identity
          import pytest
          checkout = pathlib.Path.cwd().resolve()
          names = ('carr_library', 'carr_library.state_backup', 'carr_library.ingest.worker',
                   'carr_library.application', 'carr_library.pending_backup', 'carr_library.library_backup',
                   'carr_library.speech.reading', 'carr_library.speech.source', 'carr_library.ui.speech_dialog',
                   'carr_library.speech.runtime', 'carr_library.academic_integration.doi',
                   'carr_library.speech.session',
                   'carr_library.storage.revisions', 'carr_library.storage.schema_identity')
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout) for path in origins.values()), origins
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-recovery.xml')
          suites = ['tests/storage/test_v3_state_backup.py',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_collisions',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_allows_distinct_siblings',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_rejects_non_windows_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_manifest_keeps_ordinary_unicode_names',
                    'tests/storage/test_state_backup_portability.py::test_portable_snapshot_roundtrip_unicode',
                    'tests/storage/test_pending_backup.py',
                    'tests/storage/test_complete_pending_backup.py',
                    'tests/storage/test_academic_migration.py',
                    'tests/storage/test_backup_schema_identity.py',
                    'tests/e2e/test_import_worker_publication.py',
                    'tests/e2e/test_import_publication_receipt_integrity.py',
                    'tests/ingest/test_import_replay_identity.py',
                    'tests/speech/test_reading.py',
                    'tests/speech/test_source.py',
                    'tests/speech/test_session.py',
                    'tests/packaging/test_worker_bytecode.py']
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=',
                               '-o', 'xfail_strict=true', '--import-mode=importlib',
                               '--junitxml=' + str(report), *suites], plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          passed = len(cases) - failed - skipped
          ok = status == 0 and passed > 0 and failed == skipped == 0 and not policy.seen
          result = dict(status='PASS' if ok else 'FAIL', passed=passed, failed=failed,
                        skipped=skipped, pytest_exit=int(status), expected_failures=policy.seen,
                        origins=installed_origins(), manual_nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-recovery.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $installedRecovery | python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-recovery.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }
      - name: Prepare explicitly pinned private test audio runtime
        id: audio-runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-v3-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-v3-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require canonical capture, editing, publication and local planning
        timeout-minutes: 8
        run: |
          python scripts/ci_check.py --jobs 2 tests/audio/test_recording.py tests/audio/test_capture_admission.py tests/audio/test_capture_windows_lifetime.py tests/ui/test_recording_dialog.py tests/studio/test_clip_editing.py tests/studio/test_clip_dialog.py tests/studio/test_project_effects.py tests/studio/test_studio_controller.py tests/studio/test_book_audio.py tests/ui/test_book_audio_dialog.py tests/ui/test_worker_lifetime.py tests/speech/test_player_controls.py tests/ui/test_reader_playback.py tests/ui/test_reader_playback_actions.py tests/studio/test_publishing.py tests/studio/test_publishing_boundaries.py tests/studio/test_publishing_cli.py tests/studio/test_publishing_handlers.py tests/studio/test_daisy_publishing.py tests/studio/test_daisy_boundaries.py tests/assistant/test_translation_source.py tests/packaging/test_installer_process.py tests/packaging/test_standard_installer.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py tests/assistant/test_translation_v3.py tests/reader/test_ebook_audio.py tests/speech/test_pronunciation_review.py tests/speech/test_pronunciation_handlers.py tests/speech/test_pronunciation_reader_hook.py tests/studio/test_pronunciation.py tests/studio/test_pronunciation_dialog.py tests/studio/test_pronunciation_render.py tests/audio/test_audiobook.py tests/audio/test_effect_presets.py tests/studio/test_audiobook_publication.py tests/speech/test_navigation.py tests/ui/test_reader_navigation.py tests/speech/test_find_replace.py tests/speech/test_find_replace_reader_hook.py tests/speech/test_player_transport.py tests/ui/test_find_replace_dialog.py tests/operations/test_facade.py tests/operations/test_import_admission.py tests/operations/test_production_admission.py tests/operations/test_resources.py tests/operations/test_transcription_admission.py tests/ui/test_operations_dialog.py tests/ui/test_operations_policy.py tests/e2e/test_operations_cli.py tests/storage/test_state_replacement.py 2>&1 | Tee-Object 'ci-v3-results/canonical-production-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($probe in @('windows_clip_editor_smoke.py', 'windows_recording_smoke.py', 'windows_publishing_smoke.py', 'windows_local_planning_smoke.py', 'windows_translation_v3_smoke.py', 'windows_epub_reading_smoke.py', 'windows_pronunciation_smoke.py', 'windows_studio_pronunciation_smoke.py', 'windows_operations_smoke.py', 'windows_reader_player_smoke.py', 'windows_effect_chain_smoke.py')) {
            python -I -B (Join-Path scripts $probe) 2>&1 | Tee-Object (Join-Path ci-v3-results ('native-' + $probe + '.txt'))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Real native SAPI, scene production, keyboard controls and restart
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython, (Get-Command node.exe).Source,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_V3_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-v3-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/runtime-firewall.json'
            & $python -I -B scripts/windows_v3_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-v3.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual native speech and production acceptance failed.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Require progress isolation and actual selected-voice rendering regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/speech/test_progress_speech.py tests/studio/test_production_cancellation_outcomes.py tests/ui/test_operation_progress.py tests/ui/test_progress_numeric_limits.py tests/ui/test_progress_job_review.py tests/ui/test_studio_progress_isolation.py tests/ui/test_progress_media_quiet.py tests/ui/test_progress_voice_actions.py tests/e2e/test_import_progress.py tests/storage/test_progress_preferences_backup.py 2>&1 | Tee-Object 'ci-v3-results/strict-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate local services, DSP, integrity and provider permission boundaries
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          node --version | Tee-Object 'ci-v3-results/citation-node-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --import-mode=importlib tests/audio tests/speech tests/assistant tests/studio tests/academic_integration tests/conversion tests/transcription tests/language_qualification tests/ui/test_operation_progress.py tests/ui/test_progress_job_review.py tests/ui/test_keyboard_settings.py tests/test_delivery_contract.py tests/storage/test_v3_state_backup.py tests/storage/test_pending_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_backup_v4_review.py tests/e2e/test_import_worker_publication.py tests/e2e/test_import_publication_receipt_integrity.py tests/ingest/test_import_replay_identity.py tests/packaging/test_worker_bytecode.py tests/extract/test_language_manager.py tests/packaging/test_prepare_windows_audio.py tests/packaging/test_refresh_private_bundle_review.py --junitxml=ci-v3-results/v3-tests.xml 2>&1 | Tee-Object 'ci-v3-results/v3-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7
