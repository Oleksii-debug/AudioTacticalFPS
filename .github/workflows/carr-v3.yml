            $digest = (Get-FileHash -LiteralPath $schemaPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Item -LiteralPath $schemaPath).Length -ne $property.Value.size -or $digest -ne $property.Value.sha256) { throw ('DAISY validation schema differs from its pin: ' + $property.Name) }
            $daisyEvidence += @{ name=$property.Name; bytes=$property.Value.size; sha256=$digest; url=$property.Value.url }
          }
          "CARR_DAISY_SCHEMAS=$daisySchemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{ status='PASS'; schema_pin_sha256=(Get-FileHash -LiteralPath 'packaging/daisy-validation-schemas.json' -Algorithm SHA256).Hash.ToLowerInvariant(); schemas=$daisyEvidence; acquisition='explicit before offline firewall'; bundled=$false } | ConvertTo-Json -Depth 5 | Set-Content 'ci-v3-results/daisy-schema-acquisition.json'
