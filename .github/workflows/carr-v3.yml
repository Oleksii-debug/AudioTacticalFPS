            '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          function Normalize-RemoteRanges($Ranges) {
            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address filter representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $rulePrefix = 'CARR-local-planning-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Local planning checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Local planning egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Local planning rules do not cover the intended runtime programs.' }
            foreach ($rule in $active) {
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              $actualRanges = @(Normalize-RemoteRanges $addresses)
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'Local planning rule has unexpected remote-address coverage.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected executables with external egress blocked; loopback synthetic peer allowed' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/local-planning-firewall.json'
            & $python -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-local-planning.txt'
