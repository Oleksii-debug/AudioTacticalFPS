                   'carr_library.audio.models', 'carr_library.audio.process', 'carr_library.audio.windows_job', 'carr_library.audio.cleanup', 'carr_library.audio.recording', 'carr_library.speech.runtime', 'carr_library.ui.recording_dialog', 'carr_library.ui.desktop_app',
                   'carr_library.studio.project', 'carr_library.studio.managed_inputs', 'carr_library.studio.clips', 'carr_library.studio.render', 'carr_library.ui.studio_clips', 'carr_library.state_backup')
          for name in names:
              importlib.import_module(name)
          def installed_origins():
              origins = {name: str(pathlib.Path(sys.modules[name].__file__).resolve()) for name in names}
              assert all(not pathlib.Path(path).is_relative_to(checkout)
                         and 'site-packages' in {part.casefold() for part in pathlib.Path(path).parts}
                         for path in origins.values()), origins
              return origins
          installed_origins()
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = pathlib.Path('ci-v3-results/installed-publication.xml')
          suites = ['tests/studio/test_publishing.py', 'tests/studio/test_publishing_cli.py',
                    'tests/studio/test_publishing_handlers.py',
                    'tests/audio/test_recording.py', 'tests/audio/test_recording_cleanup.py', 'tests/audio/test_recording_compatibility.py', 'tests/audio/test_recording_export.py', 'tests/ui/test_recording_dialog.py', 'tests/audio/test_audio_process.py', 'tests/audio/test_publication_fsync.py', 'tests/audio/test_dsp.py', 'tests/studio/test_production_cancellation_outcomes.py', 'tests/speech/test_runtime.py', 'tests/speech/test_python_helper.py', 'tests/audio/test_windows_audio_ownership.py',
                    'tests/studio/test_clip_editing.py', 'tests/studio/test_clip_restoration.py', 'tests/studio/test_clip_dialog.py', 'tests/studio/test_clip_cli.py', 'tests/storage/test_state_clip_inputs.py', 'tests/studio/test_studio_controller.py']
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=', '-o', 'xfail_strict=true',
                               '--import-mode=importlib', '--junitxml=' + str(report), *suites],
                              plugins=[policy])
          cases = list(ET.parse(report).iter('testcase')) if report.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          expected = {'test_publishing': 48, 'test_publishing_cli': 5, 'test_publishing_handlers': 7}
          counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in expected}
          required = {'test_actual_ffmpeg_completed_job_to_verified_epub',
                      'test_published_epub_import_and_read_keep_derivative_bytes_unverified',
                      'test_actual_library_backup_restores_receipt_without_external_epub_authority',
                      'test_selected_library_root_is_protected_before_audio_encoding',
                      'test_actual_cli_rejects_new_epub_inside_selected_library',
                      'test_native_handler_rejects_new_epub_inside_selected_library',
                      'test_queued_publication_cancelled_when_library_object_changes_at_same_path',
                      'test_prepared_receipt_recovers_completed_bytes_after_finalization_failure'}
          recording_modules = ["test_recording","test_recording_cleanup","test_recording_compatibility","test_recording_export","test_recording_dialog","test_audio_process","test_publication_fsync","test_dsp","test_production_cancellation_outcomes","test_runtime","test_python_helper","test_windows_audio_ownership"]
          recording_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in recording_modules}
          recording_required = {'test_actual_graceful_stop_finalizes_short_pcm', 'test_actual_cancel_discards_incomplete_capture', 'test_actual_capture_backup_delete_original_root_restore_and_verify', 'test_pending_cleanup_returns_worker_and_keeps_staging_and_both_admission_locks', 'test_streamed_export_verifies_original_and_needs_no_microphone_or_engine', 'test_competing_destination_create_at_publication_is_never_overwritten', 'test_queued_capture_loses_admission_when_its_exact_library_scope_changes[same-path-new-library]', 'test_queued_capture_loses_admission_when_its_exact_library_scope_changes[root-changed]', 'test_queued_capture_loses_admission_when_its_exact_library_scope_changes[frame-closing]', 'test_owned_descendant_cannot_outlive_parent_or_failure[cancel]', 'test_owned_descendant_cannot_outlive_parent_or_failure[timeout]', 'test_owned_descendant_cannot_outlive_parent_or_failure[overflow]', 'test_owned_descendant_cannot_outlive_parent_or_failure[orphan]', 'test_owned_process_preserves_exact_diagnostic_bytes_and_environment', 'test_late_scope_change_keeps_uncertain_native_cleanup_visible_and_owned', 'test_cancellation_during_flush_does_not_publish'}
          clip_expected = {"test_clip_editing":20,"test_clip_restoration":16,"test_clip_dialog":35,"test_clip_cli":8,"test_state_clip_inputs":17,"test_studio_controller":8}
          clip_counts = {name: sum(case.get('classname', '').rsplit('.', 1)[-1] == name for case in cases) for name in clip_expected}
          clip_required = {'test_actual_completed_clip_restore_requires_fresh_output_before_any_old_path_io[False]', 'test_actual_completed_clip_restore_requires_fresh_output_before_any_old_path_io[True]', 'test_pending_job_and_stale_service_recheck_live_origin_before_output_admission', 'test_actual_trim_position_pan_fades_and_complete_clip_stems', 'test_destroy_discards_preview_when_parent_never_delivers_completion', 'test_destroy_retains_uncertain_native_playback_owner_and_preview', 'test_deferred_clip_playback_rechecks_exact_library', 'test_studio_late_result_cannot_update_replacement_library', 'test_waiting_input_preview_never_constructs_or_stats_old_destination[True-complete]', 'test_waiting_input_preview_never_constructs_or_stats_old_destination[False-waiting-input]', 'test_studio_controller_cannot_replace_a_newer_clip_revision', 'test_render_saved_project_queues_exact_reviewed_revision_and_does_not_play', 'test_render_saved_project_rejects_stale_revision_before_job_creation', 'test_render_saved_project_cancelled_parent_picker_starts_no_work', 'test_owned_service_release_waits_for_its_future_without_stopping_host_executor[completed]', 'test_owned_service_release_waits_for_its_future_without_stopping_host_executor[cancelled-before-start]', 'test_borrowed_clip_editor_service_is_not_closed_by_dialog'}
          ok = (status == 0 and failed == skipped == 0 and not policy.seen
                and counts == expected and all(recording_counts.values())
                and recording_counts['test_windows_audio_ownership'] == 5
                and clip_counts == clip_expected
                and clip_required <= {case.get('name') for case in cases}
                and len(cases) == sum(expected.values()) + sum(recording_counts.values()) + sum(clip_expected.values())
                and recording_required <= {case.get('name') for case in cases}
                and required <= {case.get('name') for case in cases})
          result = dict(status='PASS' if ok else 'FAIL', passed=len(cases)-failed-skipped,
                        failed=failed, skipped=skipped, expected_failures=policy.seen,
                        suite_counts=counts, recording_suite_counts=recording_counts,
                        clip_suite_counts=clip_counts,
                        origins=installed_origins(), microphone='NOT_RUN', nvda='NOT_RUN')
          pathlib.Path('ci-v3-results/installed-publication.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
            $installedPublication | & $python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-v3-results/installed-publication.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Installed publication source, recovery or export guards failed.' }
            & $python -I -B scripts/windows_recording_smoke.py --audio-directory $env:CARR_V3_PUBLICATION_AUDIO --audio-lock packaging/windows-audio.lock.json 2>&1 | Tee-Object 'ci-v3-results/native-recording.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual installed native synthetic recording failed.' }
            & $python -I -B scripts/windows_clip_editor_smoke.py --audio-directory $env:CARR_V3_PUBLICATION_AUDIO --audio-lock packaging/windows-audio.lock.json 2>&1 | Tee-Object 'ci-v3-results/native-clips.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual installed native portable clip editing failed.' }
            & $python -I -B scripts/windows_publishing_smoke.py --audio-directory $env:CARR_V3_PUBLICATION_AUDIO --audio-lock packaging/windows-audio.lock.json 2>&1 | Tee-Object 'ci-v3-results/native-publishing.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual installed native EPUB publication failed.' }
            & $python -I -B scripts/epubcheck_acceptance.py --archive $env:CARR_EPUBCHECK_ARCHIVE --java $env:CARR_EPUBCHECK_JAVA --audio-directory $env:CARR_V3_PUBLICATION_AUDIO --audio-lock packaging/windows-audio.lock.json --report ci-v3-results/epubcheck-installed.json --require-installed 2>&1 | Tee-Object 'ci-v3-results/epubcheck-installed.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Installed EPUB3.3 conformance or invalid-mimetype control failed.' }
          } finally {
            foreach ($ruleName in $publicationRules) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Require progress isolation and actual selected-voice rendering regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/progress/test_progress_contract.py tests/progress/test_progress_feedback.py tests/progress/test_progress_preferences.py tests/ui/test_progress_job_results.py tests/ui/test_progress_panel_state.py tests/e2e/test_import_progress.py tests/speech/test_progress_speech.py tests/studio/test_production_cancellation_outcomes.py tests/ui/test_progress_numeric_limits.py tests/ui/test_studio_progress_isolation.py tests/ui/test_progress_media_quiet.py tests/ui/test_progress_voice_actions.py tests/storage/test_progress_preferences_backup.py tests/progress/test_progress_media_integration.py tests/ui/test_progress_job_review.py tests/ui/test_operation_progress.py 2>&1 | Tee-Object 'ci-v3-results/strict-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require Advanced translation permission and checkpoint regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/assistant/test_translation.py tests/assistant/test_translation_v3.py tests/assistant/test_translation_advanced_source.py tests/assistant/test_translation_advanced_union.py 2>&1 | Tee-Object 'ci-v3-results/strict-translation-v3.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require local proposal scope and review regressions
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        run: |
          python scripts/ci_check.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py 2>&1 | Tee-Object 'ci-v3-results/strict-local-planning.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native local proposal and actual loopback HTTP with external egress blocked
        if: ${{ !cancelled() && steps.install-runtime.outcome == 'success' }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: ''
        run: |
          $python = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $basePython = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $remoteRanges = @('0.0.0.1-126.255.255.255', '128.0.0.0-255.255.255.255',
            '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          function Normalize-RemoteRanges($Ranges) {
            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address filter representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $rulePrefix = 'CARR-local-planning-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Local planning checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Local planning egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Local planning rules do not cover the intended runtime programs.' }
            foreach ($rule in $active) {
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              $actualRanges = @(Normalize-RemoteRanges $addresses)
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'Local planning rule has unexpected remote-address coverage.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected executables with external egress blocked; loopback synthetic peer allowed' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-v3-results/local-planning-firewall.json'
            & $python -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-v3-results/native-local-planning.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native local proposal review and execution acceptance failed.' }
            & $python -I -B -m pytest -q -o addopts= -o pythonpath= -o xfail_strict=true --import-mode=importlib tests/assistant/test_local_planning_loopback.py --junitxml=ci-v3-results/local-planning-loopback.xml 2>&1 | Tee-Object 'ci-v3-results/local-planning-loopback.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual local planning HTTP/CLI regressions failed.' }
            & $python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-v3-results/local-planning-loopback.xml').iter('testcase')); assert len(cases)==25 and all(c.get('classname','').rsplit('.',1)[-1]=='test_local_planning_loopback' and not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases); print('PASS: actual loopback HTTP tests; no skipped or failed cases')"
            if ($LASTEXITCODE -ne 0) { throw 'Loopback test evidence is incomplete.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Validate local services, DSP, integrity and provider permission boundaries
        run: |
          python -m pytest -q --import-mode=importlib tests/audio tests/speech tests/assistant tests/studio tests/storage/test_v3_state_backup.py tests/storage/test_state_snapshot_identity.py tests/language_qualification tests/conversion tests/extract/test_language_manager.py tests/packaging/test_prepare_windows_audio.py tests/academic_integration tests/ui/test_operation_progress.py tests/ui/test_progress_job_review.py tests/ui/test_command_registry.py tests/ui/test_keyboard_manager.py tests/storage/test_keyboard_preferences.py tests/ui/test_reader_keymap_context.py tests/test_delivery_contract.py tests/storage/test_pending_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_backup_v4_review.py tests/e2e/test_import_worker_publication.py tests/ingest/test_import_replay_identity.py tests/packaging/test_worker_bytecode.py tests/packaging/test_refresh_private_bundle_review.py tests/ui/test_profile_project_exports.py --junitxml=ci-v3-results/v3-tests.xml 2>&1 | Tee-Object 'ci-v3-results/v3-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep source and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-v3-results/
          retention-days: 7
