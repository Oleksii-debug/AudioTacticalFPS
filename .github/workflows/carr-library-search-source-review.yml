name: Current original page proof and mixed Unicode mapping
on:
  push:
    branches: [carr/library-search-source-review-20261128]
    paths: ['carr-library/**', '.github/workflows/carr-library-search-source-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-source-proof-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Current originals, exact Unicode and cancellation / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        run: |
          python -m pip install ".[test]"
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-search-source
          cat > ci-search-source/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-search-source"
          suites = ["tests/search/test_advanced_search.py","tests/search/test_federated.py","tests/search/test_federated_advanced.py","tests/search/test_federated_epub.py","tests/search/test_federated_independent.py","tests/search/test_hybrid_clock_budget.py","tests/search/test_literal_catalog_api.py","tests/search/test_literal_filter.py","tests/search/test_literal_integrity.py","tests/search/test_literal_long_source.py","tests/search/test_literal_readonly.py","tests/search/test_literal_scoped.py","tests/search/test_literal_unicode_memory.py","tests/search/test_literal_v2_composition.py","tests/search/test_semantic_cache.py","tests/search/test_semantic_cache_boundary.py","tests/search/test_thematic_active_locator.py","tests/search/test_thematic_baseline.py","tests/search/test_thematic_budget.py","tests/search/test_thematic_catalog_handoff.py","tests/search/test_thematic_colon_queries.py","tests/search/test_thematic_hybrid_fusion.py","tests/search/test_thematic_hybrid_handoff.py","tests/search/test_thematic_semantic_windows.py","tests/search/test_thematic_unicode.py","tests/search/test_thematic_work_diversity.py","tests/search/test_search_paging.py","tests/search/test_full_scope_ranking.py","tests/e2e/test_advanced_research_search.py","tests/e2e/test_nested_search_clock_budget.py","tests/e2e/test_retained_source_search_integrity.py","tests/e2e/test_search_deadline.py","tests/e2e/test_search_operation_budget.py","tests/e2e/test_semantic_fallback_status.py","tests/ui/test_desktop_query_jobs.py","tests/ui/test_desktop_result_modes.py","tests/ui/test_federated_search.py","tests/ui/test_search_model.py","tests/ui/test_search_panel_accessibility.py","tests/ui/test_notebook_search_actions.py","tests/citations/test_streaming_text_attestation.py","tests/citations/test_text_attestation.py","tests/citations/test_pdf_review_attestation.py","tests/catalog/test_streaming_intake.py","tests/ingest/test_retained_assets.py","tests/e2e/test_streaming_import_pages.py","tests/search/test_page_originals.py","tests/search/test_page_originals_adversarial.py","tests/search/test_literal_ascii_runs.py"]

          names = ["carr_library.application","carr_library.search.paging","carr_library.search.ranked_scope","carr_library.search.literal","carr_library.search.thematic","carr_library.search.federated","carr_library.semantic","carr_library.search.semantic_windows","carr_library.semantic_cache","carr_library.ui.federated_search","carr_library.ui.desktop_app","carr_library.catalog.read_views","carr_library.storage.revisions","carr_library.durable_state","carr_library.audio.cleanup","carr_library.search.originals","carr_library.citations.text_attestation","carr_library.catalog.intake","carr_library.ingest.retained_assets","carr_library.ingest.resource_budget"]
          # Compile selected real source and test bytes without importing UI/native code.
          for name in names:
              path = source.joinpath(*name.split(".")[1:]).with_suffix(".py")
              compile(path.read_bytes(), str(path), "exec")
          for suite in suites:
              path = root / suite
              compile(path.read_bytes(), str(path), "exec")
          
          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (mode + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      # Preserve the original collection failure before the
                      # required nonempty-suite assertion can terminate pytest.
                      print("FAILED COLLECTION: " + report.nodeid, flush=True)
                      print(str(report.longrepr)[:16384], flush=True)
          
              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (mode + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-search-scale-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              result = {"status": "PASS", "mode": mode, "cases": len(cases),
                        "qualification": "CURRENT_ORIGINAL_AND_MIXED_UNICODE_CONTRACTS",
                        "large_corpus_benchmark": "NOT_RUN",
                        "actual_neural_model_quality": "NOT_RUN",
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "physical_microphone": "NOT_RUN", "physical_output": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (mode + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require actual source search, resource and lifetime contracts
        if: "!cancelled()"
        timeout-minutes: 20
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-search-source/check.py source 2>&1 | tee ci-search-source/source.txt
      - name: Require isolated installed origins and the same search contracts
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-search-source/check.py installed 2>&1 | tee ci-search-source/installed.txt
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-search-source
          git rev-parse HEAD > ci-search-source/commit.txt
          git rev-parse HEAD^{tree} > ci-search-source/tree.txt
          python -m pip freeze > ci-search-source/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: search-source-proof-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-search-source
          if-no-files-found: error
