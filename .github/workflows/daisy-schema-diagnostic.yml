name: CARR offline DAISY schema acceptance

on:
  push:
    branches: [carr/daisy-schema-diagnostic-20261128]

permissions:
  contents: read

jobs:
  daisy:
    name: DAISY pinned-schema acceptance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the exact desktop package in a fresh environment
        if: runner.os == 'Windows'
        id: install-runtime
        timeout-minutes: 5
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-native-audio-diagnostic-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-native-audio-diagnostic' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-native-audio-diagnostic/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-native-audio-diagnostic/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-native-audio-diagnostic/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the declared Linux source dependencies in a fresh environment
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-intake-allocation-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'bin/python'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-native-audio-diagnostic' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-native-audio-diagnostic/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-native-audio-diagnostic/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c "import json,platform,sqlite3,struct,sys; assert sys.platform=='linux' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,platform=platform.platform(),sqlite=sqlite3.sqlite_version)))" | Tee-Object 'ci-native-audio-diagnostic/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact installed Python source and checkout identity
        id: installed-origin
        timeout-minutes: 2
        run: |
          $proof = @'
          import hashlib, json, os, pathlib, subprocess, sys
          import carr_library
          checkout = pathlib.Path.cwd().parent.resolve()
          source = (checkout / 'carr-library/src/carr_library').resolve()
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert not installed.is_relative_to(checkout)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          paths = sorted(source.rglob('*.py'))
          assert 0 < len(paths) <= 1024
          hashes = {}
          for selected in paths:
              relative = selected.relative_to(source)
              expected = selected.read_bytes()
              assert (installed / relative).read_bytes() == expected, str(relative)
              hashes[relative.as_posix()] = hashlib.sha256(expected).hexdigest()
          report = dict(status='PASS', source_commit=commit, installed_root=str(installed),
                        installed_python_files=len(hashes), source_hashes=hashes,
                        scope='installed Python source equality; no model or sealed-bundle qualification')
          pathlib.Path('ci-native-audio-diagnostic/installed-source.json').write_text(
              json.dumps(report, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps(dict(status='PASS', source_commit=commit,
                                installed_python_files=len(hashes), installed_root=str(installed))))
          '@
          $proof | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/installed-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require exact publication-tool and real lxml resolver controls
        timeout-minutes: 12
        run: |
          $controls = @'
          import hashlib, importlib.util, json, os, pathlib, sys
          import xml.etree.ElementTree as ET
          from contextlib import contextmanager
          
          runner_path = pathlib.Path('scripts/ci_check.py').resolve()
          runner_sha = hashlib.sha256(runner_path.read_bytes()).hexdigest()
          assert runner_sha == '70281591d047dbe5f464db95457c35604b988b2aa0994e0706e4b317385a6ca6'
          suites = ['tests/packaging/test_prepare_publication_tools.py']
          expected_properties = {}
          spec = importlib.util.spec_from_file_location('_carr_daisy_schema_ci_check', runner_path)
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          original_reports = runner._report_directory
          output = pathlib.Path('ci-native-audio-diagnostic')
          captured, errors = {}, []
          
          @contextmanager
          def preserve_reports(suite):
              with original_reports(suite) as directory:
                  try:
                      yield directory
                  finally:
                      report = pathlib.Path(directory) / 'junit.xml'
                      if report.is_file():
                          try:
                              with report.open('rb') as stream:
                                  raw = stream.read(2 * 1024 * 1024 + 1)
                              assert len(raw) <= 2 * 1024 * 1024
                              destination = output / ('source-control-%02d.xml' % suites.index(suite))
                              with destination.open('xb') as stream:
                                  stream.write(raw)
                              captured[suite] = dict(path=destination.name, bytes=len(raw),
                                                     sha256=hashlib.sha256(raw).hexdigest())
                          except Exception as exc:
                              errors.append(dict(suite=suite, capture_error=type(exc).__name__))
                              print('FAIL: bounded control report capture: ' + type(exc).__name__, flush=True)
          
          runner._report_directory = preserve_reports
          sys.argv = [str(runner_path), '--jobs', '1', *suites]
          exit_code = 1
          try:
              exit_code = runner.main()
          finally:
              profiles = {}
              for suite, record in captured.items():
                  try:
                      raw = (output / record['path']).read_bytes()
                      assert hashlib.sha256(raw).hexdigest() == record['sha256']
                      assert b'<!DOCTYPE' not in raw and b'<!ENTITY' not in raw
                      root = ET.fromstring(raw)
                      selected = {}
                      for item in root.iter('property'):
                          name, value = item.get('name'), item.get('value')
                          if name in expected_properties.get(suite, set()):
                              assert name not in selected and isinstance(value, str) and len(value) <= 65536
                              selected[name] = value
                      profiles[suite] = selected
                      if exit_code == 0:
                          assert set(selected) == expected_properties.get(suite, set())
                  except Exception as exc:
                      errors.append(dict(suite=suite, receipt_error=type(exc).__name__))
              if exit_code == 0 and set(captured) != set(suites):
                  errors.append(dict(receipt_error='Missing required control report'))
              receipt = dict(schema='carr-daisy-schema-control-evidence/1', tested_commit=os.environ['GITHUB_SHA'],
                             application_source_commit='7b09ae3cb7e7984ee66ca003b399016921e5a26d',
                             ci_check_sha256=runner_sha, strict_runner_exit=exit_code,
                             suites=suites, junit_reports=captured, observed_properties=profiles, errors=errors,
                             scope='Actual strict source controls and real lxml resolver cases; separate from the actual generated-publication stage')
              with (output / 'daisy-control-evidence.json').open('x', encoding='utf-8') as stream:
                  json.dump(receipt, stream, ensure_ascii=True, sort_keys=True, allow_nan=False)
                  stream.write('\n')
          raise SystemExit(exit_code if exit_code else int(bool(errors)))
          '@
          $controls | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/daisy-controls.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the canonical pinned local audio runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          $audioWork = Join-Path $env:RUNNER_TEMP 'carr-canonical-audio'
          New-Item -ItemType Directory -Force $audioWork | Out-Null
          $audioInputs = Join-Path $audioWork 'inputs'
          $audioRuntime = Join-Path $audioWork 'runtime'
          & $env:CARR_PYTHON -I -B packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-native-audio-diagnostic/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON -I -B packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audioRuntime | Tee-Object 'ci-native-audio-diagnostic/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_V3_AUDIO=$audioRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audioRuntime 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the declared Ubuntu audio tools
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          dpkg-query -W ffmpeg | tee ci-native-audio-diagnostic/ubuntu-audio-package.txt

      - name: Prepare the unchanged pinned publication schemas and tool inputs
        timeout-minutes: 5
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'carr-publication-validation'
          & $env:CARR_PYTHON -I -B scripts/prepare_publication_tools.py --output $tools --download | Tee-Object 'ci-native-audio-diagnostic/publication-validation-inputs.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_PUBLICATION_TOOLS=$tools" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render and validate the three actual installed DAISY publications
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/daisy_schema_acceptance.py --schemas (Join-Path $env:CARR_PUBLICATION_TOOLS 'daisy-schemas') --report 'ci-native-audio-diagnostic/installed-daisy-schemas.json' --require-installed 2>&1 | Tee-Object 'ci-native-audio-diagnostic/installed-daisy-schemas.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind actual publication outcomes to schemas, installed source and audio
        timeout-minutes: 2
        run: |
          $receipt = @'
          import hashlib, json, os, pathlib, subprocess, sys
          import lxml.etree
          from carr_library.audio_runtime import verify_audio_runtime
          from carr_library.studio import daisy, publishing
          
          output = pathlib.Path('ci-native-audio-diagnostic')
          def read_json(path):
              with pathlib.Path(path).open('rb') as stream:
                  raw = stream.read(2 * 1024 * 1024 + 1)
              assert len(raw) <= 2 * 1024 * 1024
              return json.loads(raw), dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
          
          report, report_identity = read_json(output / 'installed-daisy-schemas.json')
          origins, origin_identity = read_json(output / 'installed-source.json')
          schemas, schema_identity = read_json('packaging/daisy-validation-schemas.json')
          preparation, preparation_identity = read_json(output / 'publication-validation-inputs.json')
          assert origins['status'] == 'PASS' and origins['source_commit'] == os.environ['GITHUB_SHA']
          assert origins['installed_python_files'] == 341
          assert report['status'] == 'PASS' and report['installed_required'] is True
          expected_cases = ['narrated-from-wav', 'reused-job-mp3', 'untranscribed-retained-clip']
          assert [item['case'] for item in report['publications']] == expected_cases
          expected_documents = ['ncc.html', 'content.html', 'source.html', 'book.smil']
          expected_schemas = {name: item['sha256'] for name, item in schemas['files'].items()}
          assert preparation['status'] == 'PASS'
          assert preparation['manifest_sha256']['daisy-validation-schemas.json'] == schema_identity['sha256']
          for item in report['publications']:
              assert [row['file'] for row in item['documents']] == expected_documents
              assert all(row['dtd_valid'] is True for row in item['documents'])
              assert item['invalid_xhtml_rejected'] is True
              assert item['schema_sha256'] == expected_schemas
              assert item['full_daisy_rule_conformance'] == 'NOT_RUN'
              assert item['reader_interoperability'] == 'NOT_RUN' and item['nvda'] == 'NOT_RUN'
          for name, module in [('publisher', publishing), ('daisy', daisy)]:
              path = pathlib.Path(module.__file__).resolve()
              assert path.is_relative_to(pathlib.Path(sys.prefix).resolve())
              assert report[name + '_module_sha256'] == hashlib.sha256(path.read_bytes()).hexdigest()
          
          def binary_hash(path):
              total, digest = 0, hashlib.sha256()
              with path.open('rb') as stream:
                  while block := stream.read(1024 * 1024):
                      total += len(block)
                      assert total <= 1024**3
                      digest.update(block)
              return digest.hexdigest()
          
          audio = report['audio_binaries']
          assert set(audio) == {'ffmpeg', 'ffprobe'}
          for item in audio.values():
              path = pathlib.Path(item['path']).resolve(strict=True)
              assert binary_hash(path) == item['sha256']
          if sys.platform == 'win32':
              verified_audio = verify_audio_runtime(os.environ['CARR_CI_AUDIO_DIR'])
              for name, item in audio.items():
                  assert pathlib.Path(item['path']).resolve() == pathlib.Path(verified_audio['tools'][name]).resolve()
              audio_origin = dict(kind='unchanged hash-pinned Windows audio runtime',
                                  verification=verified_audio)
          elif sys.platform == 'linux':
              import shutil
              for name, item in audio.items():
                  assert pathlib.Path(item['path']).resolve() == pathlib.Path(shutil.which(name)).resolve()
              package = subprocess.check_output(
                  ['dpkg-query', '-W', 'ffmpeg'], text=True, timeout=10).strip()
              assert len(package) <= 4096 and package.startswith('ffmpeg\t')
              audio_origin = dict(kind='declared Ubuntu apt package', package=package,
                                  windows_audio_pin_applies=False)
          else:
              raise AssertionError('Unexpected acceptance platform')
          
          source_paths = ['scripts/daisy_schema_acceptance.py', 'scripts/epubcheck_acceptance.py',
                          'scripts/prepare_publication_tools.py',
                          'packaging/daisy-validation-schemas.json', 'packaging/epubcheck.json',
                          'packaging/audio-runtime/source-lock.json']
          source_hashes = {}
          for name in source_paths:
              raw = pathlib.Path(name).read_bytes()
              assert len(raw) <= 2 * 1024 * 1024
              source_hashes[name] = hashlib.sha256(raw).hexdigest()
          proof = dict(schema='carr-daisy-installed-acceptance/1', status='PASS',
                       tested_commit=os.environ['GITHUB_SHA'],
                       application_source_commit='7b09ae3cb7e7984ee66ca003b399016921e5a26d',
                       platform=sys.platform, installed_source=origin_identity,
                       installed_python_files=origins['installed_python_files'],
                       publication_report=report_identity, preparation_report=preparation_identity,
                       source_sha256=source_hashes, schema_sha256=expected_schemas,
                       publication_cases=expected_cases, documents_per_case=expected_documents,
                       deliberately_invalid_xhtml_rejected=3,
                       lxml_version=list(lxml.etree.LXML_VERSION),
                       libxml_version=list(lxml.etree.LIBXML_VERSION),
                       audio_binaries=audio, audio_origin=audio_origin,
                       scope='Three actual installed-app synthetic DAISY renders and offline pinned-DTD checks',
                       not_qualified=['full DAISY rule conformance', 'reader interoperability',
                                      'speech quality', 'NVDA', 'EPUBCheck', 'sealed bundle', 'audio endpoint'])
          with (output / 'daisy-acceptance-evidence.json').open('x', encoding='utf-8') as stream:
              json.dump(proof, stream, ensure_ascii=True, sort_keys=True, allow_nan=False)
              stream.write('\n')
          print(json.dumps(proof, ensure_ascii=True, sort_keys=True, allow_nan=False))
          '@
          $receipt | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-native-audio-diagnostic/daisy-acceptance-evidence.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve actual DAISY source, schema, audio and publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-daisy-schema-${{ matrix.os }}-${{ github.sha }}
          path: |
            carr-library/ci-native-audio-diagnostic/*.txt
            carr-library/ci-native-audio-diagnostic/*.json
            carr-library/ci-native-audio-diagnostic/*.xml
          if-no-files-found: error
          retention-days: 3
