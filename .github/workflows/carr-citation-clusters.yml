name: Ordered citations in the existing academic workbench

on:
  push:
    branches: [carr/citation-cluster-ui-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-citation-clusters.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the exact source and test runtime
        run: |
          python -m pip install '.[test]'
          python -m pip check
      - name: Require actual scoped CSL and Word contracts without skips
        run: |
          python -m compileall -q src
          python scripts/ci_check.py tests/citations/test_cluster_workbench.py tests/citations/test_csl_contexts.py tests/citations/test_documents.py tests/citations/test_bibliography_workbench.py tests/ui/test_citation_styles_jobs.py

  installed-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carr-library
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install pinned dependencies and exact product in a fresh environment
        run: |
          $citationEnv = Join-Path $env:RUNNER_TEMP 'citation-order-venv'
          python -m venv $citationEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $citationPython = Join-Path $citationEnv 'Scripts/python.exe'
          & $citationPython -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $citationPython -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $citationPython -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $citationPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CITATION_PROOF_PYTHON=$citationPython" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force 'ci-citation-order' | Out-Null
      - name: Require scoped state and native parent handler contracts
        run: |
          & $env:CITATION_PROOF_PYTHON scripts/ci_check.py tests/citations/test_cluster_workbench.py tests/ui/test_citation_styles_jobs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute installed native controls, F6, real CSL and Word workflow
        run: |
          & $env:CITATION_PROOF_PYTHON -I tests/ui/native_citation_clusters_smoke.py --output 'ci-citation-order/native-citation-order.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve public synthetic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: citation-order-native-${{ github.sha }}
          path: carr-library/ci-citation-order/
          if-no-files-found: warn
          retention-days: 7
