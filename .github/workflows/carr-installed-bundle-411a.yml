                                  info = path.lstat()
                                  actual_sha = digest(path) if stat.S_ISREG(info.st_mode) and not path.is_symlink() else None
                                  report["differences"].append(dict(path=relative, expected_sha256=None, actual_sha256=actual_sha, size=info.st_size, reason="unsealed added file"))
                              except OSError as exc:
                                  report["errors"].append(dict(path=relative, error=type(exc).__name__))
              report["sealed_files_checked"] = len(expected)
              report["status"] = "DIFFERENCES" if report["differences"] or report["errors"] else "UNCHANGED"
              reports.append(report)
          result = dict(source_commit="a705a9c83e615aa77eb782182be638687384efbd", diagnostic_only=True, variants=reports)
          (output / "installed-bundle-inventory-differences.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          '@
          $inventory | & $python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Record the diagnostic verdict without replacing main acceptance
        if: always()
        env:
          INSTALLED_BUNDLE_OUTCOME: ${{ steps.installed_bundle.outcome }}
        run: |
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $status = 'FAIL'
          if ($env:INSTALLED_BUNDLE_OUTCOME -eq 'success') { $status = 'PASS' }
          @{ status=$status; source_commit='a705a9c83e615aa77eb782182be638687384efbd'; source_tree='787bc8be399d00d8190a9659081af7089c603c18'; diagnostic_only=$true; final_main_acceptance_required=$true; installed_bundle_outcome=$env:INSTALLED_BUNDLE_OUTCOME } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/installed-bundle-diagnostic-verdict.json'
          if ($status -ne 'PASS') { throw 'The original installed-bundle step did not complete successfully.' }

      - name: Preserve all installed-bundle diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-installed-bundle-a705-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7
