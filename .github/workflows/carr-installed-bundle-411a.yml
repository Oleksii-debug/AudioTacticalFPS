                  except OSError as exc:
                      report["differences"].append(dict(path=relative, expected_sha256=expected_sha, actual_sha256=None, reason=type(exc).__name__))
              for area in ("wheelhouse", "runtime", "ocr", "native-runtime", "audio-runtime", "models"):
                  directory = root / area
                  if not directory.is_dir():
                      continue
                  for parent, _dirs, files in os.walk(directory, followlinks=False):
