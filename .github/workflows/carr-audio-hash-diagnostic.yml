name: Pinned Windows audio hash diagnosis

on:
  push:
    branches: [carr/windows-audio-diagnostic-20261127]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carr-library
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source
        run: |
          python -m pip install ".[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned audio runtime
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-hash-diagnostic-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Observe actual isolated stream hash bytes
        run: |
          python -I -B -X utf8 scripts/diagnose_stream_hash.py
          exit $LASTEXITCODE

      - name: Require actual metadata publication regressions without skips
        if: "!cancelled()"
        shell: pwsh
        run: |
          python scripts/ci_check.py --diagnostics --jobs 3 tests/audio/test_metadata_stream_hash.py tests/audio/test_metadata.py tests/audio/test_metadata_publication.py tests/ui/test_audio_metadata_dialog.py tests/ui/test_audio_metadata_lifetime.py
          exit $LASTEXITCODE
