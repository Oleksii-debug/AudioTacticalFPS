name: CARR installed transcription diagnostic

on:
  push:
    branches: [carr/diagnose-installed-asr-20261127-db00]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-installed-asr-diagnostic-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  installed-transcription-diagnostic:
    name: Diagnostic only / sealed CPython 3.11.18 / supplied worker
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Preserve the exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Validate the diagnostic-only source boundary
        run: |
          $expected = @('.github/workflows/carr-installed-asr-diagnostic.yml')
          $changed = @(git diff --name-only 5e21ee42538f3a2179b8734326e47ecc85fa17b1 HEAD)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Compare-Object ($expected | Sort-Object) ($changed | Sort-Object)).Count -ne 0) {
            throw 'The focused diagnostic changed unexpected source files.'
          }
          $checkDiagnostic = @'
          import ast, json, pathlib
          paths = [pathlib.Path('scripts/windows_transcription_smoke.py'),
                   pathlib.Path('tests/transcription/test_supplied_worker_bridge.py'),
                   pathlib.Path('tests/transcription/test_pr99_host.py'),
                   pathlib.Path('tests/transcription/probe_windows_status_reader.py')]
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          tree = ast.parse(paths[1].read_text(encoding='utf-8'))
          assignment = next(node for node in tree.body if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == 'SYNTHETIC_WORKER' for target in node.targets))
          worker = ast.literal_eval(assignment.value).replace('__MODE__', repr('complete'))
          compile(worker, '<public synthetic protocol worker>', 'exec')
          print(json.dumps(dict(status='PASS', diagnostic_only=True, scripts=[str(path) for path in paths],
                                production_source='UNCHANGED', acoustic_inference='NOT_RUN')))
          '@
          $checkDiagnostic | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the actual desktop package in a fresh environment
        id: desktop_install
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        id: production_dependencies
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==50 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        id: ocr_runtime
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Prepare the pinned shared audio runtime before its source regressions
        id: audio_runtime
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $audioInputs = Join-Path $bundleWork 'audio-inputs'
          $audioRuntime = Join-Path $bundleWork 'audio-runtime'
          & $env:CARR_PYTHON packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-results/audio-runtime-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audioRuntime | Tee-Object 'ci-results/audio-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the pinned local model through the existing upstream verifier
        id: semantic_model
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'carr-model-ci/minilm'
          $modelManifest = Join-Path $env:RUNNER_TEMP 'carr-model-ci/model-manifest.json'
          $acquire = @'
          import importlib.util, json, pathlib, shutil, sys
          from huggingface_hub import hf_hub_download
          spec = importlib.util.spec_from_file_location('model_build', pathlib.Path('packaging/model_bundle.py').resolve())
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          target, manifest = map(pathlib.Path, sys.argv[1:])
          target.mkdir(parents=True, exist_ok=False)
          for name in sorted(helper.FILES):
              source = hf_hub_download(helper.REPO, name, revision=helper.REVISION, cache_dir=target.parent / 'cache', token=False)
              shutil.copyfile(source, target / name)
          proof = helper.seal(target)
          with manifest.open('x', encoding='utf-8') as stream:
              json.dump(proof, stream, sort_keys=True)
          print(json.dumps({'status': 'PASS', 'revision': helper.REVISION, 'files': len(proof['hashes'])}))
          '@
          # Only this explicit build-time child may fetch the pinned public model.
          # Importing the application before acquisition would enforce offline mode.
          $env:HF_HUB_OFFLINE = '0'
          try {
            $acquire | & $env:CARR_PYTHON -I -B - $model $modelManifest | Tee-Object 'ci-results/model-acquisition.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:HF_HUB_OFFLINE = '1'
          }
          & $env:CARR_PYTHON -I -B -c "import sys; from carr_library.semantic import verify_model_bundle; verify_model_bundle(sys.argv[1], sys.argv[2]); print('PASS: exact approved local model')" $model $modelManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_MODEL_DIR=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_MODEL_MANIFEST=$modelManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the complete bundle and diagnose installed ASR with egress blocked
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' && steps.ocr_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' && steps.semantic_model.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $baseBundle = Join-Path $bundleWork 'base bundle'
          $nativeBundle = Join-Path $bundleWork 'native bundle'
          $bundle = Join-Path $bundleWork 'complete bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes -r packaging/windows-semantic-cp311.lock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $applicationWheel = $wheels[0].FullName
          $runtime = Get-Content packaging/windows-python.json -Raw | ConvertFrom-Json
          $pythonArchive = Join-Path $bundleWork 'windows-python.tar.gz'
          Invoke-WebRequest -Uri $runtime.download.url -OutFile $pythonArchive
          $archiveHash = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.download.sha256) { throw 'Pinned Python archive checksum mismatch.' }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          if (!(Test-Path -LiteralPath $ocrSource -PathType Leaf) -or $ocr -ne $env:CARR_CI_OCR_DIR) { throw 'Verified source-test OCR runtime is missing.' }
          $nativeLock = Get-Content packaging/native-runtime/source-lock.json -Raw | ConvertFrom-Json
          $nativePackage = Join-Path $bundleWork 'native-runtime.conda'
          Invoke-WebRequest -Uri $nativeLock.package.url -OutFile $nativePackage
          if ((Get-Item -LiteralPath $nativePackage).Length -ne $nativeLock.package.size) { throw 'Pinned native package size mismatch.' }
          if ((Get-FileHash -LiteralPath $nativePackage -Algorithm SHA256).Hash.ToLowerInvariant() -ne $nativeLock.package.sha256) { throw 'Pinned native package checksum mismatch.' }
          $nativeRuntime = Join-Path $bundleWork 'native-runtime'
          & $env:CARR_PYTHON packaging/prepare_native_runtime.py --package $nativePackage --output $nativeRuntime | Tee-Object 'ci-results/native-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioRuntime = $env:CARR_CI_AUDIO_DIR
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/build_windows_bundle.py --wheel $applicationWheel --wheelhouse $wheelhouse --lock packaging/windows-semantic-cp311.lock --python-archive $pythonArchive --model-dir $env:CARR_CI_MODEL_DIR --model-manifest $env:CARR_CI_MODEL_MANIFEST --ocr-dir $ocr --ocr-source-archive $ocrSource --source-commit $sourceCommit --sbom packaging/windows-semantic-sbom.cdx.json --output $baseBundle | Tee-Object 'ci-results/full-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_native_runtime.py --bundle $baseBundle --native-runtime $nativeRuntime --output $nativeBundle | Tee-Object 'ci-results/full-bundle-native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_audio_runtime.py --bundle $nativeBundle --audio-runtime $audioRuntime --output $bundle | Tee-Object 'ci-results/full-bundle-audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import json,sys; from carr_library.audio_runtime import bundled_audio_tools; tools=bundled_audio_tools(sys.argv[1]); assert tools is not None; print(json.dumps(tools,sort_keys=True))" $bundle | Set-Content 'ci-results/sealed-audio-tools.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioTools = Get-Content -Raw -LiteralPath 'ci-results/sealed-audio-tools.json' | ConvertFrom-Json
          $manifest = Join-Path $bundle 'bundle-manifest.json'
          $expectedSbom = (Get-FileHash -Algorithm SHA256 -LiteralPath 'packaging/windows-semantic-sbom.cdx.json').Hash.ToLowerInvariant()
          $sealedSbom = Join-Path $bundle 'runtime-sbom.cdx.json'
          if (!(Test-Path -LiteralPath $sealedSbom -PathType Leaf)) { throw 'Missing sealed SBOM' }
          $actualSbom = (Get-FileHash -Algorithm SHA256 -LiteralPath $sealedSbom).Hash.ToLowerInvariant()
          $sbomManifest = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json
          if ($sbomManifest.source_commit -ne $sourceCommit -or $sbomManifest.source_tree -ne $sourceTree -or $sbomManifest.bundled_audio_runtime -ne $true) { throw 'Final audio bundle source identity or runtime flag mismatch.' }
          if ($actualSbom -ne $expectedSbom -or $sbomManifest.files.'runtime-sbom.cdx.json' -ne $expectedSbom) { throw 'SBOM seal mismatch' }
          @{ status='PASS'; sha256=$actualSbom } | ConvertTo-Json | Set-Content 'ci-results/sealed-sbom.json'
          $manifestBefore = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $installedPython = Join-Path $bundle '.venv/Scripts/python.exe'
          # Finish test-only acquisition before the offline execution boundary.
          $testWheels = Join-Path $env:RUNNER_TEMP 'carr-test-wheels'
          New-Item -ItemType Directory -Force $testWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --dest $testWheels pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sapiPowerShell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          if (!(Test-Path -LiteralPath $sapiPowerShell -PathType Leaf)) { throw 'The native SAPI PowerShell host is missing.' }
          $programs = @($bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $installedPython,
                        (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ocr/tesseract.exe'),
                        $audioTools.ffmpeg, $audioTools.ffprobe, $audioTools.ffplay, $sapiPowerShell)
          # Voice discovery may enumerate the installed 32-bit SAPI host too.
          $sapiPowerShell32 = Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          if (Test-Path -LiteralPath $sapiPowerShell32 -PathType Leaf) { $programs += $sapiPowerShell32 }
          $programs = @($programs | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique)
          $rulePrefix = 'CARR-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
          # Temporary rules on this disposable CI VM. Fail before execution if
          # Windows Firewall cannot enforce every runtime program's outbound block.
          Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
          foreach ($program in $programs) {
            $ruleName = $rulePrefix + '-' + $ruleNames.Count
            $ruleNames += $ruleName
            New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
          }
          $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
          if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline checks require enabled Windows Firewall profiles.' }
          $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
          if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline execution rules are not active.' }
          $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
          if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline execution rules do not cover the intended programs.' }
          @{ status='PASS'; profiles_enabled=@($profiles.Name); outbound_blocked_programs=$filters; phase='installation and installed supplied-worker transcription diagnostics' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/full-bundle-firewall.json'
          & $bundledPython -I -B (Join-Path $bundle 'install_windows.py') 2>&1 | Tee-Object 'ci-results/core-bundle-install.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B -m carr_library --self-test | Tee-Object 'ci-results/core-bundle-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash -ne $manifestBefore) { throw 'Bundle manifest changed during installation or startup.' }
          & $bundledPython -I -B -c "import importlib.util,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('bundle_verifier',root/'install_windows.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); module.verify(root); manifest=json.loads((root/'bundle-manifest.json').read_text()); assert manifest['bundled_model'] and manifest['bundled_ocr'] and manifest['bundled_native_runtime'] and manifest['bundled_audio_runtime']; assert manifest['source_commit']==sys.argv[2] and manifest['source_tree']==sys.argv[3]; assert 'runtime-sbom.cdx.json' in manifest['files']; assert (root/'runtime-sbom.cdx.json').read_bytes()==pathlib.Path('packaging/windows-semantic-sbom.cdx.json').read_bytes(); print(json.dumps(dict(status='PASS',runtime_sbom='VERIFIED',python=sys.version,manifest_unchanged=True,sealed_files_verified=True,model='INCLUDED',ocr='INCLUDED',private_native_runtime='INCLUDED',audio_runtime='INCLUDED',source_commit=manifest['source_commit'],source_tree=manifest['source_tree'],nvda='NOT_RUN')))" $bundle $sourceCommit $sourceTree | Tee-Object 'ci-results/full-bundle-verified.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          # Test dependencies are installed only after production installation passes.
          & $python -I -B -m pip install --no-index --find-links $testWheels pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARR_TEST_MODEL_DIR = Join-Path $bundle 'models/minilm'
          $env:CARR_OCR_DIR = Join-Path $bundle 'ocr'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          # The actual public native probe imports pytest through its synthetic
          # fixture, so run it only after the offline test-only install above.
          $nativeAsr = @'
          import importlib, json, pathlib, runpy, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          expected_commit, expected_tree, script = sys.argv[2:5]
          assert sys.version_info[:3] == (3, 11, 18), sys.version
          assert pathlib.Path(sys.executable).samefile(root / '.venv' / 'Scripts' / 'python.exe')
          import carr_library
          from carr_library.native_runtime import activate_bundled_runtime
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(root / '.venv')
          runtime_handle = activate_bundled_runtime(bundle_root=root)
          assert runtime_handle is not None
          manifest = json.loads((root / 'bundle-manifest.json').read_text())
          assert manifest['source_commit'] == expected_commit and manifest['source_tree'] == expected_tree
          assert all(manifest[key] for key in
              ('bundled_python', 'bundled_model', 'bundled_ocr', 'bundled_native_runtime', 'bundled_audio_runtime'))
          names = ('durable_state', 'transcription', 'transcription_backup',
                   'transcription_cli', 'transcription_host', 'ui.transcription_dialog')
          origins = {}
          for name in names:
              module = importlib.import_module('carr_library.' + name)
              location = pathlib.Path(module.__file__).resolve()
              assert location.is_relative_to(root / '.venv'), str(location)
              origins[name] = str(location)
          print(json.dumps(dict(diagnostic_only=True, python=sys.version, executable=sys.executable,
              base_prefix=sys.base_prefix, source_commit=expected_commit, source_tree=expected_tree,
              installed_origins=origins, acoustic_inference='NOT_RUN', nvda='NOT_RUN')), flush=True)
          sys.argv = [script]
          runpy.run_path(script, run_name='__main__')
          '@
          $nativeAsr | & $python -I -B -X utf8 - $bundle $sourceCommit $sourceTree (Resolve-Path scripts/windows_transcription_smoke.py).Path 2>&1 | Tee-Object 'ci-results/installed-transcription.txt'
          $nativeCode = $LASTEXITCODE
          # A failed native probe must not suppress the independent installed
          # suites. Every failure is retained and remains fatal at the end.
          $runAsrTests = @'
          import importlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          expected_commit, expected_tree = sys.argv[2:4]
          assert sys.version_info[:3] == (3, 11, 18), sys.version
          assert pathlib.Path(sys.executable).samefile(root / '.venv' / 'Scripts' / 'python.exe')
          import carr_library
          from carr_library.native_runtime import activate_bundled_runtime
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(root / '.venv')
          runtime_handle = activate_bundled_runtime(bundle_root=root)
          assert runtime_handle is not None
          manifest = json.loads((root / 'bundle-manifest.json').read_text())
          assert manifest['source_commit'] == expected_commit and manifest['source_tree'] == expected_tree
          names = ('durable_state', 'transcription', 'transcription_backup',
                   'transcription_cli', 'transcription_host', 'ui.transcription_dialog')
          origins = {}
          for name in names:
              module = importlib.import_module('carr_library.' + name)
              location = pathlib.Path(module.__file__).resolve()
              assert location.is_relative_to(root / '.venv'), str(location)
              origins[name] = str(location)
          print(json.dumps(dict(diagnostic_only=True, python=sys.version, executable=sys.executable,
              source_commit=expected_commit, installed_origins=origins)), flush=True)
          import pytest
          raise SystemExit(pytest.main(['-vv', '-ra', '--tb=long',
              '-o', 'addopts=', '-o', 'pythonpath=', '-o', 'xfail_strict=true',
              '--import-mode=importlib', '--junitxml=ci-results/installed-asr-tests.xml',
              'tests/transcription/test_supplied_worker_bridge.py',
              'tests/transcription/test_pr99_host.py',
              'tests/transcription/probe_windows_status_reader.py']))
          '@
          $runAsrTests | & $python -I -B -X utf8 - $bundle $sourceCommit $sourceTree 2>&1 | Tee-Object 'ci-results/installed-asr-tests.txt'
          $suiteCode = $LASTEXITCODE
          $summarizeAsr = @'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path('ci-results/installed-asr-tests.xml')
          cases = list(ET.parse(path).iter('testcase')) if path.exists() else []
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          required = {'test_real_subprocess_preserves_original_and_exports_separate_edits',
              'test_cli_and_application_share_one_durable_job_service',
              'test_stopped_progress_observer_failure_preserves_actual_child_resume_inputs',
              'test_ready_job_backup_restores_retained_media_without_engine_execution',
              'test_status_publication_exhaustion_preserves_failure_and_old_bytes',
              'test_status_publication_has_a_separate_attempt_cap',
              'test_brief_status_reader_does_not_abort_actual_worker_publication'}
          coverage = required <= {case.get('name') for case in cases}
          ok = len(cases) == 62 and coverage and failed == skipped == 0
          print(json.dumps(dict(status='PASS' if ok else 'FAIL', diagnostic_only=True,
              collected=len(cases), passed=len(cases)-failed-skipped, failed=failed, skipped=skipped,
              required_cases_present=coverage, expected_cases=62, python=sys.version,
              acoustic_inference='NOT_RUN', nvda='NOT_RUN')), flush=True)
          raise SystemExit(0 if ok else 1)
          '@
          $summarizeAsr | & $python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-results/installed-asr-tests.json'
          $summaryCode = $LASTEXITCODE
          if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash -ne $manifestBefore) { throw 'Bundle manifest changed during installed workflow acceptance.' }
          & (Join-Path $bundle 'runtime/python.exe') -I -B -c "import importlib.util,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('bundle_verifier',root/'install_windows.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); module.verify(root); print('PASS: sealed bundle unchanged after focused installed transcription diagnostics')" $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ diagnostic_only=$true; native_exit_code=$nativeCode; suite_exit_code=$suiteCode;
             summary_exit_code=$summaryCode; sealed_manifest_unchanged=$true;
             source_commit=$sourceCommit; source_tree=$sourceTree;
             expected_installed_python='3.11.18'; acoustic_inference='NOT_RUN'; nvda='NOT_RUN'
           } | ConvertTo-Json | Set-Content 'ci-results/installed-asr-diagnostic-status.json'
          if ($nativeCode -ne 0 -or $suiteCode -ne 0 -or $summaryCode -ne 0) {
            throw "Installed ASR diagnostic failed: native=$nativeCode suites=$suiteCode summary=$summaryCode"
          }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }


      - name: Preserve focused diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-installed-asr-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7
