name: Transcription authorization diagnostic

on:
  push:
    branches:
      - carr/transcription-authorization-fe7760
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: |
          mkdir -p ../transcription-authorization-evidence
          python -m pip install '.[test]'
      - name: Record the unchanged production source
        run: |
          git rev-parse HEAD > ../transcription-authorization-evidence/commit.txt
          git hash-object src/carr_library/transcription.py > ../transcription-authorization-evidence/transcription-blob.txt
          python -B - <<'PY'
          from pathlib import Path
          observed = Path('../transcription-authorization-evidence/transcription-blob.txt').read_text().strip()
          assert observed == '299241fef5e52481892f7db00f9ed3a9037d8b8b', observed
          print('Exact unchanged e8/de4 transcription source:', observed)
          PY
      - name: Run four actual authorization controls
        run: |
          python -B -m pytest -q -s -o addopts= -o xfail_strict=true -o junit_family=xunit1 \
            --junitxml=../transcription-authorization-evidence/junit.xml \
            'tests/transcription/test_supplied_worker_bridge.py::test_edit_and_export_reject_archived_workspace[save-edit-archived-at-entry]' \
            'tests/transcription/test_supplied_worker_bridge.py::test_edit_and_export_reject_archived_workspace[export-archived-at-entry]' \
            'tests/transcription/test_supplied_worker_bridge.py::test_edit_and_export_reject_archived_workspace[save-edit-archived-at-final-checkpoint]' \
            'tests/transcription/test_supplied_worker_bridge.py::test_edit_and_export_reject_archived_workspace[export-archived-at-final-checkpoint]' \
            2>&1 | tee ../transcription-authorization-evidence/pytest.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transcription-authorization-diagnostic
          path: transcription-authorization-evidence/
          if-no-files-found: error
          retention-days: 7
