name: Streaming assembler source review
on:
  push:
    branches: ['carr/stream-successor-source-b171-20261127']
    paths:
      - 'carr-library/packaging/build_v3_stream_successor.py'
      - 'carr-library/tests/packaging/test_stream_successor_source_review.py'
      - '.github/workflows/carr-stream-assembler-review.yml'
permissions:
  contents: read
jobs:
  synthetic-archive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Verify source syntax and synthetic strict ZIP boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B carr-library/tests/packaging/test_stream_successor_source_review.py
