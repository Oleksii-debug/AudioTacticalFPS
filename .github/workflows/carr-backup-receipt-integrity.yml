name: CARR backup receipt final inventory

on:
  push:
    branches: ['carr/final-receipt-integrity-af5-20261126']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-backup-receipt-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-receipts:
    name: Windows / whole-backup receipt mutation boundaries
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install actual application and strict test runner
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all receipt boundaries and actual library backup with no skips
        run: |
          python scripts/ci_check.py tests/assistant/test_backup_receipt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
