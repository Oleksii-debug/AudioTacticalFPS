name: ASR Windows status collision diagnosis
on:
  push:
    branches: ['carr/asr-status-diagnostic-af5-20261127']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
      - name: Install exact source and test runner
        run: python -m pip install . pytest==9.0.2
      - name: Reproduce actual Windows status sharing and preserve failing-case evidence
        run: python -B -X utf8 scripts/windows_transcription_status_probe.py
