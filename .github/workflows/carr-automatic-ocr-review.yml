name: Automatic OCR, exact streaming sources and native language selection
on:
  push:
    branches: [carr/automatic-ocr-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-automatic-ocr-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automatic-ocr-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Automatic OCR and exact source identity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        run: python -m pip install ".[test,sync]"
      - name: Prepare actual Linux Tesseract and reviewed reading models
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-ukr tesseract-ocr-slk tesseract-ocr-osd fonts-dejavu-core
          tesseract --version
          tesseract --list-langs
          python -m pip check
      - name: Prepare existing verified Windows OCR distribution and native controls
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'carr-automatic-ocr-review'
          New-Item -ItemType Directory -Force $work | Out-Null
          python -m pip install wxPython==4.2.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $work 'ocr'
          python packaging/prepare_windows_ocr.py --cache (Join-Path $work 'ocr-cache') --output $ocr --source-archive (Join-Path $work 'ocr-corresponding-source.tar') --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-automatic-ocr
          cat > ci-automatic-ocr/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          label = mode if len(sys.argv) == 2 else mode + "-" + sys.argv[2]
          assert label in ("source", "installed", "installed-numpy235"), label
          from importlib.metadata import version
          numpy_version = version("numpy")
          if label == "installed-numpy235":
              assert numpy_version == "2.3.5", numpy_version
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-automatic-ocr"
          suites = ["tests/extract/test_language_detection.py","tests/extract/test_ocr_language_regions.py","tests/extract/test_automatic_ocr_native.py","tests/extract/test_raster_pages.py","tests/extract/test_ocr_stream_identity.py","tests/extract/test_runtime_identity.py","tests/extract/test_ocr_languages.py","tests/extract/test_language_manager.py","tests/storage/test_ocr_language_presets.py","tests/ui/test_ocr_selection.py"]
          if os.name == "posix":
              suites += ["tests/extract/test_language_detection_posix.py", "tests/extract/test_page_ocr.py", "tests/extract/test_page_visibility.py", "tests/extract/test_ocr_evidence_fidelity.py"]

          names = ["carr_library.extract.page_ocr","carr_library.extract.language_detection","carr_library.extract.ocr_regions","carr_library.extract.raster_pages","carr_library.extract.runtime_identity","carr_library.extract.ocr_languages","carr_library.extract.language_manager","carr_library.extract.document_formats","carr_library.catalog.intake","carr_library.ui.ocr_selection","carr_library.pending_backup","carr_library.backup_sidecars"]
          
          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (label + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      print("FAILED COLLECTION", report.nodeid, str(report.longrepr), flush=True)

              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (label + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-automatic-ocr-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              result = {"status": "PASS", "mode": mode, "label": label, "numpy": numpy_version, "cases": len(cases),
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "actual_ocr": "English PDF/PNG and pinned text detector samples",
                        "real_corpus_quality": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (label + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require source detector, native OCR and source authority
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-automatic-ocr/check.py source 2>&1 | tee ci-automatic-ocr/source.txt
      - name: Require isolated installed origins and the same OCR controls
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-automatic-ocr/check.py installed 2>&1 | tee ci-automatic-ocr/installed.txt
      - name: Require actual Windows keyboard opt-in, manual override and Escape
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -B scripts/windows_automatic_ocr_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/windows_automatic_ocr_smoke.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual detector and OCR with the semantic bundle NumPy pin
        if: "!cancelled()"
        run: |
          python -m pip install numpy==2.3.5
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-automatic-ocr/check.py installed numpy235 2>&1 | tee ci-automatic-ocr/installed-numpy235.txt
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-automatic-ocr
          git rev-parse HEAD > ci-automatic-ocr/commit.txt
          git rev-parse HEAD^{tree} > ci-automatic-ocr/tree.txt
          python -m pip freeze > ci-automatic-ocr/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: automatic-ocr-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-automatic-ocr
          if-no-files-found: error
