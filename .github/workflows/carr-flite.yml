name: CARR required Linux Flite speech

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actual-flite:
    name: Ubuntu 24.04 / six actual Flite speech cases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PY_COLORS: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the explicit Ubuntu FFmpeg and Flite runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p ci-flite-results
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libflite1
          python -B -m pip install --only-binary=:all: pytest==9.0.2

      - name: Require the actual Flite filter and all four tested voices
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -I -B - <<'PY' 2>&1 | tee ci-flite-results/preflight.txt
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import subprocess
          import sys

          root = Path.cwd().resolve()
          evidence = root / 'ci-flite-results'

          def command(args):
              return subprocess.run(args, check=True, stdin=subprocess.DEVNULL,
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                    timeout=30, text=True, encoding='utf-8').stdout

          def digest(path):
              value = sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()

          commit = command(['git', 'rev-parse', 'HEAD']).strip()
          tree = command(['git', 'rev-parse', 'HEAD^{tree}']).strip()
          assert commit == os.environ['EXPECTED_SOURCE_SHA'], 'Checkout differs from the required event head.'
          (evidence / 'tested-commit.txt').write_text(commit + '\n', encoding='utf-8')
          executable_name = shutil.which('ffmpeg')
          assert executable_name, 'Required Flite acceptance: FFmpeg is missing.'
          executable = Path(executable_name).resolve(strict=True)
          assert executable == Path('/usr/bin/ffmpeg').resolve(strict=True), 'A non-Ubuntu FFmpeg shadows the selected runtime.'
          version = command([str(executable), '-version'])
          build = command([str(executable), '-buildconf'])
          filters = command([str(executable), '-hide_banner', '-filters'])
          (evidence / 'ffmpeg-version.txt').write_text(version, encoding='utf-8')
          (evidence / 'ffmpeg-buildconf.txt').write_text(build, encoding='utf-8')
          (evidence / 'ffmpeg-filters.txt').write_text(filters, encoding='utf-8')
          assert '--enable-libflite' in build, 'The required runtime was not built with libflite.'
          assert re.search(r'(?m)^\s*\S+\s+flite\s', filters), 'The required Flite filter is absent.'

          sys.path.insert(0, str(root / 'src'))
          import carr_library.speech.runtime as runtime
          assert Path(runtime.__file__).resolve() == root / 'src/carr_library/speech/runtime.py'
          registry = runtime.VoiceRegistry([runtime.FliteProvider(executable)])
          voices = sorted(voice.id for voice in registry.voices())
          required = {'flite:awb', 'flite:rms', 'flite:slt', 'flite:kal16'}
          assert required <= set(voices), 'Missing required Flite voices: ' + ', '.join(sorted(required - set(voices)))

          packages = command(['dpkg-query', '-W', '-f=${binary:Package}\t${Version}\n', 'ffmpeg', 'libavfilter9', 'libflite1'])
          (evidence / 'ubuntu-packages.txt').write_text(packages, encoding='utf-8')
          listed = command(['dpkg-query', '-L', 'libavfilter9', 'libflite1']).splitlines()
          libraries = sorted({Path(name).resolve(strict=True) for name in listed
                              if name.startswith('/usr/lib/') and '.so' in Path(name).name and Path(name).is_file()})
          assert any('libavfilter' in path.name for path in libraries)
          assert any('libflite' in path.name for path in libraries)
          binary_hashes = {str(path): digest(path) for path in [executable, *libraries]}
          source_paths = ('src/carr_library/speech/runtime.py', 'src/carr_library/speech/_io.py',
                          'tests/speech/test_flite_runtime.py', 'scripts/ci_check.py')
          result = dict(status='PASS', source_commit=commit, source_tree=tree,
                        python=sys.version, platform=platform.platform(),
                        runtime='Ubuntu 24.04 packages ffmpeg, libavfilter9 and libflite1',
                        executable=str(executable), binary_sha256=binary_hashes,
                        build_configuration_sha256=sha256(build.encode('utf-8')).hexdigest(),
                        source_sha256={name: digest(root / name) for name in source_paths},
                        required_voices=sorted(required), available_voices=voices,
                        qualification='Linux Flite only; Windows Flite, acoustic quality and NVDA are not qualified.')
          (evidence / 'capabilities.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result), flush=True)
          PY

      - name: Require all six real Flite cases with no skips
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python -B scripts/ci_check.py tests/speech/test_flite_runtime.py 2>&1 | tee ci-flite-results/required-suite.txt
          python -I -B - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import re

          evidence = Path('ci-flite-results')
          raw = (evidence / 'required-suite.txt').read_bytes()
          log = raw.decode('utf-8')
          expected = {
              'test_actual_local_pcm_speech_and_three_distinct_voices',
              'test_actual_volume_reduction_and_source_invariance',
              'test_no_overwrite_existing_audio',
              'test_cancel_synthesis_leaves_no_partial_audio',
              'test_actual_chunked_synthesis_and_budget',
              'test_unsupported_native_controls_do_not_silently_apply',
          }
          verdict = 'PASS: tests/speech/test_flite_runtime.py: junit_passed=6, failed=0, skipped=0, pytest_exit=0'
          assert log.splitlines().count(verdict) == 1, 'Exactly six genuine passes are required.'
          executed = re.findall(r'(?m)^.*test_flite_runtime\.py::(test_[A-Za-z0-9_]+)\s+PASSED\b', log)
          assert len(executed) == 6 and set(executed) == expected, executed
          preflight = json.loads((evidence / 'capabilities.json').read_text(encoding='utf-8'))
          result = dict(status='PASS', source_commit=preflight['source_commit'],
                        source_tree=preflight['source_tree'], passed=6, failed=0, skipped=0,
                        cases=sorted(executed), suite_log_sha256=sha256(raw).hexdigest(),
                        capability_report_sha256=sha256((evidence / 'capabilities.json').read_bytes()).hexdigest(),
                        runner='scripts/ci_check.py with its unchanged full offline socket policy')
          (evidence / 'six-cases.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result), flush=True)
          PY

      - name: Preserve source, runtime identity and test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-flite-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-flite-results/
          if-no-files-found: error
          retention-days: 7
