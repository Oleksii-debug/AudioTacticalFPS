name: CARR independent audiobook conformance
on:
  pull_request:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9]
    paths: ['carr-library/**', '.github/workflows/carr-publication.yml']
  push:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths: ['carr-library/**', '.github/workflows/carr-publication.yml']
  workflow_dispatch:

permissions:
  contents: read

# New development heads do not cancel a different exact-SHA acceptance run.
concurrency:
  group: carr-publication-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  installed-conformance:
    name: Windows / installed wheel / EPUBCheck 5.3 / offline DAISY DTD
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build the source-bound wheel and install the unchanged 53-pin runtime
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-publication-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $wheels = Join-Path $work 'application-wheels'
          $environment = Join-Path $work 'installed'
          New-Item -ItemType Directory -Force $wheels, 'publication-ci-results' | Out-Null
          python -m pip install --only-binary=:all: setuptools==84.2.1 wheel==0.48.0 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = @(Get-ChildItem -LiteralPath $wheels -Filter '*.whl')
          if ($built.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyWheel = @'
          import importlib.util, json, pathlib, sys
          spec = importlib.util.spec_from_file_location('source_wheel_verification', pathlib.Path('packaging/source_wheel.py').resolve())
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(json.dumps(module.verify_application_wheel(pathlib.Path(sys.argv[1]), pathlib.Path.cwd().parent, sys.argv[2]), sort_keys=True))
          '@
          python -I -B -c $verifyWheel $built[0].FullName $sourceCommit | Tee-Object 'publication-ci-results/source-wheel.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          & $python -I -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --no-deps --no-index $built[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = @'
          import importlib.metadata as metadata, json, pathlib, re
          pins = dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(), re.M))
          actual = {name: metadata.version(name) for name in pins}
          assert len(pins) == 53 and actual == pins
          print(json.dumps(actual, sort_keys=True))
          '@
          & $python -I -B -c $inventory | Tee-Object 'publication-ci-results/runtime-53-pins.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Test tooling follows the complete production-inventory check.
          & $python -I -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c $inventory | Tee-Object 'publication-ci-results/runtime-53-pins-after-test-tools.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_PUBLICATION_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_PUBLICATION_WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sourceCommit | Set-Content 'publication-ci-results/source-commit.txt'

      - name: Obtain only hash-pinned ephemeral validators and audio tools
        id: prepare-runtime
        timeout-minutes: 10
        run: |
          function Get-PinnedFile([string]$Url, [string]$Destination, [long]$Bytes, [string]$Sha256) {
            if (-not $Url.StartsWith('https://') -or $Bytes -le 0 -or $Sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid download pin.' }
            if (Test-Path -LiteralPath $Destination) { throw 'Pinned download destination already exists.' }
            $partial = $Destination + '.partial'
            Invoke-WebRequest -Uri $Url -OutFile $partial -TimeoutSec 180 -MaximumRedirection 5
            if ((Get-Item -LiteralPath $partial).Length -ne $Bytes -or (Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Sha256) { throw 'Pinned download byte identity mismatch.' }
            Move-Item -LiteralPath $partial -Destination $Destination
          }
          $python = $env:CARR_PUBLICATION_PYTHON
          $work = $env:CARR_PUBLICATION_WORK
          $pin = & $python -I -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioArchive = Join-Path $work 'ffmpeg-pinned.zip'
          Get-PinnedFile $pin.url $audioArchive $pin.size $pin.sha256
          $audio = Join-Path $work 'audio-runtime'
          & $python -I -B packaging/prepare_ffmpeg_runtime.py --archive $audioArchive --destination $audio --verify-native | Tee-Object 'publication-ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_FFMPEG=$(Join-Path $audio 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $epub = Get-Content 'packaging/epubcheck.json' -Raw | ConvertFrom-Json
          $epubArchive = Join-Path $work 'epubcheck-5.3.0.zip'
          Get-PinnedFile $epub.url $epubArchive $epub.size $epub.sha256
          "CARR_EPUBCHECK_ARCHIVE=$epubArchive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $schemas = Join-Path $work 'daisy-validation-schemas'
          New-Item -ItemType Directory $schemas | Out-Null
          $daisy = Get-Content 'packaging/daisy-validation-schemas.json' -Raw | ConvertFrom-Json
          if ($daisy.schema -ne 1 -or @($daisy.files.PSObject.Properties).Count -ne 5) { throw 'Unexpected DAISY schema inventory.' }
          foreach ($entry in $daisy.files.PSObject.Properties) {
            if ([System.IO.Path]::GetFileName($entry.Name) -ne $entry.Name -or $entry.Name.Contains('..')) { throw 'Invalid schema filename.' }
            Get-PinnedFile $entry.Value.url (Join-Path $schemas $entry.Name) $entry.Value.size $entry.Value.sha256
          }
          "CARR_DAISY_SCHEMAS=$schemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $env:JAVA_HOME_17_X64) { throw 'The runner must provide its Java 17 toolchain.' }
          $java = (Resolve-Path (Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe')).Path
          & $java -version 2>&1 | Tee-Object 'publication-ci-results/java-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $java -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'publication-ci-results/java-sha256.txt'
          "CARR_EPUBCHECK_JAVA=$java" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require source and installed validator boundary tests with zero skips
        timeout-minutes: 5
        run: |
          & $env:CARR_PUBLICATION_PYTHON scripts/ci_check.py tests/audio/test_publication_acceptance.py 2>&1 | Tee-Object 'publication-ci-results/strict-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = @'
          import os, pathlib, runpy, sys
          import carr_library, bootstrap
          prefix = pathlib.Path(sys.prefix).resolve()
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(prefix)
          assert pathlib.Path(bootstrap.__file__).resolve().is_relative_to(prefix)
          assert 'site-packages' in {part.casefold() for part in pathlib.Path(carr_library.__file__).parts}
          root = pathlib.Path.cwd().resolve()
          checked = runpy.run_path('scripts/ci_check.py')
          command = [sys.executable, '-I', '-B', '-c', checked['PYTEST_CHILD'],
                     'offline', 'installed', str(root),
                     '-o', 'addopts=', '-o', 'xfail_strict=true',
                     '-o', 'pythonpath=', '--import-mode=importlib',
                     '--junitxml', str(pathlib.Path(sys.argv[1]).resolve()),
                     '--', str(root / 'tests/audio/test_publication_acceptance.py')]
          environment = {key: value for key, value in os.environ.items()
                         if key.upper() not in ('PYTHONPATH', 'PYTEST_ADDOPTS', 'PYTEST_PLUGINS', 'CARR_CI_ALLOW_LOOPBACK')}
          environment['PYTEST_DISABLE_PLUGIN_AUTOLOAD'] = '1'
          raise SystemExit(checked['_run_test_process'](command, env=environment, cwd=root, timeout=240))
          '@
          & $env:CARR_PUBLICATION_PYTHON -I -B -c $installed 'publication-ci-results/strict-installed.xml' 2>&1 | Tee-Object 'publication-ci-results/strict-installed.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$report = Get-Content 'publication-ci-results/strict-installed.xml' -Raw
          $cases = @($report.SelectNodes('//testcase'))
          $bad = @($report.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error'))
          if ($cases.Count -eq 0 -or $bad.Count -ne 0) { throw 'The installed boundary gate needs actual cases and zero failures or skips.' }

      - name: Run actual installed EPUBCheck with an invalid-book control
        timeout-minutes: 15
        run: |
          & $env:CARR_PUBLICATION_PYTHON -I -B scripts/epubcheck_acceptance.py --archive $env:CARR_EPUBCHECK_ARCHIVE --java $env:CARR_EPUBCHECK_JAVA --require-installed --report publication-ci-results/epubcheck.json 2>&1 | Tee-Object 'publication-ci-results/epubcheck.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run actual installed offline DAISY DTD validation with invalid XHTML
        if: ${{ !cancelled() && steps.prepare-runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          & $env:CARR_PUBLICATION_PYTHON -I -B scripts/daisy_schema_acceptance.py --schemas $env:CARR_DAISY_SCHEMAS --require-installed --report publication-ci-results/daisy-dtd.json 2>&1 | Tee-Object 'publication-ci-results/daisy-dtd.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve only textual qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-publication-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/publication-ci-results/*.json
            carr-library/publication-ci-results/*.xml
            carr-library/publication-ci-results/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove this run's ephemeral validator and audio payloads
        if: always()
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-publication-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }

