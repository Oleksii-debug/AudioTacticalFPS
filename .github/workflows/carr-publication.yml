name: CARR independent audiobook conformance
on:
  push:
    branches: ['carr/v3-acceptance-*', 'carr/publication-*']
    paths: ['carr-library/**', '.github/workflows/carr-publication.yml']
  workflow_dispatch:

permissions:
  contents: read

# New development heads do not cancel a different exact-SHA acceptance run.
concurrency:
  group: carr-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  installed-conformance:
    name: Windows / installed wheel / EPUBCheck 5.3 / offline DAISY DTD
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact candidate and initial qualification status
        run: |
          New-Item -ItemType Directory -Path publication-ci-results -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source commit.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source tree.' }
          @{
            schema = 1; status = 'NOT_RUN'; source_commit = $head; source_tree = $tree
            github_sha = $env:GITHUB_SHA; workflow_ref = $env:GITHUB_WORKFLOW_REF
            workflow_sha = $env:GITHUB_WORKFLOW_SHA; run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content -Encoding utf8 publication-ci-results/source-provenance.json
          @{ schema = 1; status = 'NOT_RUN'; reason = 'Independent validators have not completed.' } |
            ConvertTo-Json | Set-Content -Encoding utf8 publication-ci-results/publication-gate.json
          if ($head -ne $env:GITHUB_SHA) { throw 'The checkout differs from the event source.' }
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the candidate.' }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build the source-bound wheel and install the unchanged 53-pin runtime
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-publication-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $wheels = Join-Path $work 'application-wheels'
          $environment = Join-Path $work 'installed'
          if (Test-Path -LiteralPath $work) { throw 'The qualification environment must be fresh.' }
          New-Item -ItemType Directory $wheels -ErrorAction Stop | Out-Null
          python -m pip install --only-binary=:all: setuptools==84.2.1 wheel==0.48.0 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = @(Get-ChildItem -LiteralPath $wheels -Filter '*.whl')
          if ($built.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyWheel = @'
          import importlib.util, json, pathlib, sys
          spec = importlib.util.spec_from_file_location('source_wheel_verification', pathlib.Path('packaging/source_wheel.py').resolve())
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(json.dumps(module.verify_application_wheel(pathlib.Path(sys.argv[1]), pathlib.Path.cwd().parent, sys.argv[2]), sort_keys=True))
          '@
          python -I -B -c $verifyWheel $built[0].FullName $sourceCommit | Tee-Object 'publication-ci-results/source-wheel.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          & $python -I -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --no-deps --no-index --no-compile $built[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedSources = @'
          import hashlib, importlib, json, pathlib, sys, zipfile
          wheel = pathlib.Path(sys.argv[1])
          prefix = pathlib.Path(sys.prefix).resolve(strict=True)
          origins, files = {}, {}
          for name in ("carr_library", "bootstrap"):
              package = importlib.import_module(name)
              origin = pathlib.Path(package.__file__).resolve(strict=True)
              if not origin.is_relative_to(prefix) or "site-packages" not in {part.casefold() for part in origin.parts}:
                  raise ValueError("Application package resolved outside the isolated installed environment.")
              origins[name] = str(origin)
              for path in origin.parent.rglob("*.py"):
                  actual = path.resolve(strict=True)
                  if not actual.is_relative_to(origin.parent):
                      raise ValueError("Installed source inventory escaped its package.")
                  files[name + "/" + path.relative_to(origin.parent).as_posix()] = hashlib.sha256(actual.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as archive:
              expected = {name: hashlib.sha256(archive.read(name)).hexdigest()
                          for name in archive.namelist()
                          if name.endswith(".py") and name.split("/")[0] in ("carr_library", "bootstrap")}
          if not files or files != expected or not sys.flags.isolated:
              raise ValueError("Installed source differs from the source-bound wheel.")
          print(json.dumps({"status": "PASS", "isolated": True, "module_origins": origins,
                            "installed_python": files, "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest()},
                           sort_keys=True))
          '@
          & $python -I -B -c $installedSources $built[0].FullName |
            Tee-Object 'publication-ci-results/installed-source.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel source binding failed.' }
          $inventory = @'
          import importlib.metadata as metadata, json, pathlib, re
          pins = dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(), re.M))
          actual = {name: metadata.version(name) for name in pins}
          assert len(pins) == 53 and actual == pins
          print(json.dumps(actual, sort_keys=True))
          '@
          & $python -I -B -c $inventory | Tee-Object 'publication-ci-results/runtime-53-pins.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Test tooling follows the complete production-inventory check.
          & $python -I -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c $inventory | Tee-Object 'publication-ci-results/runtime-53-pins-after-test-tools.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_PUBLICATION_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_PUBLICATION_WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sourceCommit | Set-Content 'publication-ci-results/source-commit.txt'

      - name: Obtain only hash-pinned ephemeral validators and audio tools
        id: prepare-runtime
        timeout-minutes: 10
        run: |
          function Get-PinnedFile([string]$Url, [string]$Destination, [long]$Bytes, [string]$Sha256) {
            if (-not $Url.StartsWith('https://') -or $Bytes -le 0 -or $Sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid download pin.' }
            if (Test-Path -LiteralPath $Destination) { throw 'Pinned download destination already exists.' }
            $partial = $Destination + '.partial'
            Invoke-WebRequest -Uri $Url -OutFile $partial -TimeoutSec 180 -MaximumRedirection 5
            if ((Get-Item -LiteralPath $partial).Length -ne $Bytes -or (Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Sha256) { throw 'Pinned download byte identity mismatch.' }
            Move-Item -LiteralPath $partial -Destination $Destination
          }
          $python = $env:CARR_PUBLICATION_PYTHON
          $work = $env:CARR_PUBLICATION_WORK
          $pin = & $python -I -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioArchive = Join-Path $work 'ffmpeg-pinned.zip'
          Get-PinnedFile $pin.url $audioArchive $pin.size $pin.sha256
          $audio = Join-Path $work 'audio-runtime'
          & $python -I -B packaging/prepare_ffmpeg_runtime.py --archive $audioArchive --destination $audio --verify-native | Tee-Object 'publication-ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_FFMPEG=$(Join-Path $audio 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $epub = Get-Content 'packaging/epubcheck.json' -Raw | ConvertFrom-Json
          $epubArchive = Join-Path $work 'epubcheck-5.3.0.zip'
          Get-PinnedFile $epub.url $epubArchive $epub.size $epub.sha256
          "CARR_EPUBCHECK_ARCHIVE=$epubArchive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $schemas = Join-Path $work 'daisy-validation-schemas'
          New-Item -ItemType Directory $schemas | Out-Null
          $daisy = Get-Content 'packaging/daisy-validation-schemas.json' -Raw | ConvertFrom-Json
          if ($daisy.schema -ne 1 -or @($daisy.files.PSObject.Properties).Count -ne 5) { throw 'Unexpected DAISY schema inventory.' }
          foreach ($entry in $daisy.files.PSObject.Properties) {
            if ([System.IO.Path]::GetFileName($entry.Name) -ne $entry.Name -or $entry.Name.Contains('..')) { throw 'Invalid schema filename.' }
            Get-PinnedFile $entry.Value.url (Join-Path $schemas $entry.Name) $entry.Value.size $entry.Value.sha256
          }
          "CARR_DAISY_SCHEMAS=$schemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $env:JAVA_HOME_17_X64) { throw 'The runner must provide its Java 17 toolchain.' }
          $java = (Resolve-Path (Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe')).Path
          & $java -version 2>&1 | Tee-Object 'publication-ci-results/java-version.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $java -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'publication-ci-results/java-sha256.txt'
          "CARR_EPUBCHECK_JAVA=$java" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require source and installed validator boundary tests with zero skips
        timeout-minutes: 5
        run: |
          & $env:CARR_PUBLICATION_PYTHON scripts/ci_check.py tests/audio/test_publication_acceptance.py tests/audio/test_cleanup_wait.py 2>&1 | Tee-Object 'publication-ci-results/strict-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceLog = Get-Content 'publication-ci-results/strict-source.txt' -Raw
          foreach ($gate in @(@('test_publication_acceptance.py', 13), @('test_cleanup_wait.py', 4))) {
            $pattern = 'PASS: tests/audio/' + [regex]::Escape($gate[0]) + ': junit_passed=' + $gate[1] + ', failed=0, skipped=0, pytest_exit=0'
            if ([regex]::Matches($sourceLog, $pattern).Count -ne 1) { throw 'Source boundary population differs from its declared oracle.' }
          }
          $installed = @'
          import pathlib, runpy, sys
          import carr_library, bootstrap
          prefix = pathlib.Path(sys.prefix).resolve()
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(prefix)
          assert pathlib.Path(bootstrap.__file__).resolve().is_relative_to(prefix)
          assert 'site-packages' in {part.casefold() for part in pathlib.Path(carr_library.__file__).parts}
          child = runpy.run_path('scripts/ci_check.py')['PYTEST_CHILD']
          sys.argv = ['installed-publication-gate', 'offline', '-o', 'addopts=', '-o', 'xfail_strict=true',
                      '-o', 'pythonpath=', '--import-mode=importlib', '--junitxml', sys.argv[1], 'tests/audio/test_publication_acceptance.py', 'tests/audio/test_cleanup_wait.py']
          exec(compile(child, 'installed-publication-offline-policy', 'exec'))
          '@
          & $env:CARR_PUBLICATION_PYTHON -I -B -c $installed 'publication-ci-results/strict-installed.xml' 2>&1 | Tee-Object 'publication-ci-results/strict-installed.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$report = Get-Content 'publication-ci-results/strict-installed.xml' -Raw
          $cases = @($report.SelectNodes('//testcase'))
          $bad = @($report.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error'))
          if ($cases.Count -ne 17 -or $bad.Count -ne 0) { throw 'The installed boundary gate requires exactly 17 cases and zero failures or skips.' }

      - name: Run actual installed EPUBCheck with an invalid-book control
        id: epub
        timeout-minutes: 15
        run: |
          & $env:CARR_PUBLICATION_PYTHON -I -B scripts/epubcheck_acceptance.py --archive $env:CARR_EPUBCHECK_ARCHIVE --java $env:CARR_EPUBCHECK_JAVA --require-installed --report publication-ci-results/epubcheck.json 2>&1 | Tee-Object 'publication-ci-results/epubcheck.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run actual installed offline DAISY DTD validation with invalid XHTML
        id: daisy
        if: ${{ !cancelled() && steps.prepare-runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          & $env:CARR_PUBLICATION_PYTHON -I -B scripts/daisy_schema_acceptance.py --schemas $env:CARR_DAISY_SCHEMAS --require-installed --report publication-ci-results/daisy-dtd.json 2>&1 | Tee-Object 'publication-ci-results/daisy-dtd.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require actual complete source-bound checker receipts
        if: always()
        timeout-minutes: 3
        env:
          EPUB_OUTCOME: ${{ steps.epub.outcome }}
          DAISY_OUTCOME: ${{ steps.daisy.outcome }}
        run: |
          @'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          directory = root / "publication-ci-results"
          directory.mkdir(parents=True, exist_ok=True)
          gate = {"schema": 1, "status": "FAIL", "epub_outcome": os.environ.get("EPUB_OUTCOME"),
                  "daisy_outcome": os.environ.get("DAISY_OUTCOME"), "source_cases": 17, "installed_cases": 17,
                  "full_daisy_rule_conformance": "NOT_RUN", "reader_interoperability": "NOT_RUN",
                  "nvda": "NOT_RUN", "speech_quality": "NOT_RUN"}
          def read(name):
              return json.loads((directory / name).read_text(encoding="utf-8-sig"))
          def require(condition, reason):
              if not condition:
                  raise ValueError(reason)
          try:
              source = read("source-provenance.json")
              gate.update(source_commit=source["source_commit"], source_tree=source["source_tree"])
              require(gate["epub_outcome"] == gate["daisy_outcome"] == "success",
                      "A required checker failed, timed out or did not run.")
              require(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
                      == source["source_commit"] == os.environ["GITHUB_SHA"], "Source commit changed.")
              require(subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
                      == source["source_tree"], "Source tree changed.")
              subprocess.run(["git", "diff", "--quiet", "HEAD", "--"], check=True)
              installed = read("installed-source.json")
              require(installed["status"] == "PASS" and installed["isolated"] is True, "Installed identity missing.")
              for name, expected in installed["installed_python"].items():
                  package, relative = name.split("/", 1)
                  path = pathlib.Path(installed["module_origins"][package]).parent / relative
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == expected, "Installed source changed.")
              epub, daisy = read("epubcheck.json"), read("daisy-dtd.json")
              require(epub["status"] == daisy["status"] == "PASS", "Complete checker receipts are missing.")
              wanted = ["narrated-from-wav", "narrated-from-mp3-render", "untranscribed-retained-clip"]
              runtime_sha = hashlib.sha256(pathlib.Path(os.environ["CARR_FFMPEG"]).read_bytes()).hexdigest()
              for report in (epub, daisy):
                  require([row["case"] for row in report["publications"]] == wanted, "A synthetic production case is missing.")
                  require(report["audio_runtime"]["sha256"] == runtime_sha, "Selected audio runtime changed.")
                  for name, expected in report["application_module_sha256"].items():
                      key = name.replace(".", "/") + ".py"
                      require(installed["installed_python"].get(key) == expected, "Checker imported different application source.")
              require(epub["validator_version"] == "5.3.0"
                      and epub["validator_archive_sha256"] == "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5",
                      "Independent validator differs from its reviewed pin.")
              for row in epub["publications"]:
                  require(row["checker_version"] == "5.3.0" and row["exit_code"] == 0
                          and row["expected_valid"] is True
                          and all(row["counts"][key] == 0 for key in ("nFatal", "nError", "nWarning")),
                          "A generated EPUB did not pass the actual checker cleanly.")
              invalid = epub["deliberately_invalid_rejected"]
              require(invalid["expected_valid"] is False and invalid["exit_code"] != 0
                      and invalid["counts"]["nFatal"] + invalid["counts"]["nError"] > 0,
                      "The independent EPUB checker did not reject its invalid-book control.")
              pins = json.loads((root / "packaging/daisy-validation-schemas.json").read_text())["files"]
              expected_schemas = {name: item["sha256"] for name, item in pins.items()}
              for row in daisy["publications"]:
                  require(row["status"] == "PASS" and row["schema_sha256"] == expected_schemas
                          and row["invalid_xhtml_rejected"] is True, "DAISY DTD or invalid-XHTML control failed.")
              gate.update(status="PASS", wheel_sha256=installed["wheel_sha256"],
                          epub_validator_version="5.3.0", synthetic_epub_cases=3, synthetic_daisy_cases=3)
          except Exception as exc:
              gate["reason"] = type(exc).__name__ + ": " + str(exc)
          (directory / "publication-gate.json").write_text(json.dumps(gate, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(gate))
          sys.exit(0 if gate["status"] == "PASS" else 1)
          '@ | python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Independent publication qualification FAIL; retain raw evidence.' }

      - name: Preserve only textual qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/publication-ci-results/*.json
            carr-library/publication-ci-results/*.xml
            carr-library/publication-ci-results/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove this run's ephemeral validator and audio payloads
        if: always()
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-publication-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }

