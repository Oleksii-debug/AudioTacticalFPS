name: Explicit output and integration correction review

on:
  push:
    branches: [carr/explicit-output-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-output-device-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: output-review-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    name: Output selection and corrections / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: source-runtime
        run: python -m pip install ".[test,sync]"
      - name: Install actual Windows desktop
        id: desktop-runtime
        if: runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Prepare actual Linux test audio runtime
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-output-review
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version > ci-output-review/ffmpeg-version.txt
          ffprobe -version > ci-output-review/ffprobe-version.txt
      - name: Prepare pinned Windows test audio runtime
        id: audio-runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'ci-output-review' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-output-review-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-output-review/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_OUTPUT_REVIEW_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require passing boundary tests without skips
        run: |
          mkdir -p ci-output-review
          python scripts/ci_check.py --jobs 3 \
            tests/audio/test_output_devices.py \
            tests/speech/test_output_device_playback.py \
            tests/reader/test_live_reading.py \
            tests/reader/test_live_player.py \
            tests/ui/test_output_devices.py \
            tests/ui/test_live_reading_controls.py \
            tests/ui/test_studio_playback_actions.py \
            tests/ui/test_native_menu_contract.py \
            tests/ui/test_academic_tools.py \
            tests/ui/test_save_actions.py \
            tests/assistant/test_local_assistant.py \
            tests/storage/test_trusted_client_backup.py \
            tests/storage/test_current_producer_backup.py \
            tests/extract/test_special_ocr_models.py \
            tests/ui/test_studio_progress_results.py \
            tests/ui/test_progress_job_review.py \
            tests/speech/test_voice_preferences.py \
            tests/speech/test_voice_preferences_handlers.py \
            tests/storage/test_state_json_budget.py \
            tests/storage/test_voice_preferences_backup.py \
            tests/audio/test_effect_presets.py \
            tests/ui/test_effects_dialog.py \
            tests/ui/test_audio_conversion_controls.py \
            tests/storage/test_effect_presets_backup.py \
            tests/ui/test_reader_background.py \
            tests/ui/test_reader_dialog_lifetime.py \
            tests/ui/test_keyboard_manager.py \
            tests/reader/test_export_no_clobber.py \
            tests/reader/test_export_reconciliation.py \
            tests/ui/test_studio_keyboard_registration.py \
            tests/operations/test_resources.py \
            tests/operations/test_production_admission.py \
            tests/storage/test_atomic_state_publication.py \
            tests/storage/test_backup_translation.py \
            tests/assistant/test_translation_v3.py \
            tests/assistant/test_planning_handlers.py \
            tests/academic_integration/test_runtime_adapter.py \
            tests/academic_integration/test_formatting.py \
            tests/academic_integration/test_regeneration.py \
            tests/ingest/test_worker_publication_boundary.py \
            tests/e2e/test_import_worker_publication.py \
            tests/conversion/test_conversion.py \
            tests/conversion/test_conversion_publication.py \
            tests/conversion/test_document_batches.py \
            tests/conversion/test_document_splitting.py \
            tests/conversion/test_document_batches_ownership.py \
            tests/conversion/test_document_cli.py \
            tests/ui/test_document_batch_handlers.py \
            tests/conversion/test_document_batch_native_probe.py \
            tests/packaging/test_ci_check.py 2>&1 | tee ci-output-review/boundaries.txt
      - name: Require Windows acquisition and actual native lookup
        if: "!cancelled() && runner.os == 'Windows' && steps.source-runtime.outcome == 'success' && steps.desktop-runtime.outcome == 'success'"
        run: python scripts/ci_check.py tests/ui/test_native_acquisition.py 2>&1 | tee ci-output-review/native-acquisition-boundaries.txt
      - name: Require real POSIX snapshot race refusal
        if: "!cancelled() && runner.os == 'Linux' && steps.source-runtime.outcome == 'success'"
        run: python scripts/ci_check.py --jobs 3 tests/storage/test_json_snapshot_posix.py tests/operations/test_resources_posix.py tests/conversion/test_document_batches_posix.py 2>&1 | tee ci-output-review/posix-snapshots.txt
      - name: Require installed native feature workflows with egress blocked
        if: "!cancelled() && runner.os == 'Windows' && steps.source-runtime.outcome == 'success' && steps.desktop-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success'"
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_OUTPUT_REVIEW_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_OUTPUT_REVIEW_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_OUTPUT_REVIEW_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-output-review/external-test-audio-binding.json'
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_OUTPUT_REVIEW_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_OUTPUT_REVIEW_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-output-review-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-output-review/runtime-firewall.json'
            $probes = @(
              @{ name='native-reader'; script='tests/ui/native_reading_desk_smoke.py'; arguments=@('--native') },
              @{ name='native-voice-preferences'; script='scripts/windows_voice_preferences_smoke.py'; arguments=@() },
              @{ name='native-output-devices'; script='scripts/windows_output_devices_smoke.py'; arguments=@() },
              @{ name='native-save-timer'; script='scripts/windows_save_timer_smoke.py'; arguments=@('--output', 'ci-output-review/native-save-timer.json') },
              @{ name='native-effect-chain'; script='scripts/windows_effect_chain_smoke.py'; arguments=@('--audio-evidence', 'ci-output-review/external-test-audio-binding.json') },
              @{ name='native-reader-session'; script='scripts/windows_reader_session_smoke.py'; arguments=@('--output', 'ci-output-review/native-reader-session.json') },
              @{ name='native-document-batch'; script='scripts/windows_document_batch_smoke.py'; arguments=@() }
            )
            $failures = @()
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 $scriptPath @probeArgs 2>&1 | Tee-Object ('ci-output-review/' + $probe.name + '.txt')
              if ($LASTEXITCODE -ne 0) { $failures += $probe.name }
            }
            if ($failures.Count -ne 0) { throw ('Required native workflows failed: ' + ($failures -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve source and dependency identity
        if: always()
        run: |
          mkdir -p ci-output-review
          git rev-parse HEAD > ci-output-review/commit.txt
          python -m pip freeze > ci-output-review/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: output-review-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-output-review
          if-no-files-found: error
