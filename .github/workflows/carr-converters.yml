name: CARR optional document converter qualification
on:
  push:
    branches: ['carr/v3-acceptance-*', 'carr/converters-*']
    paths: ['carr-library/**', '.github/workflows/carr-converters.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-converters-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-converters:
    name: Windows / installed and source / ${{ matrix.family }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(contains(github.ref_name, 'office-native-diagnostics') && '["office"]' || '["selected","office"]') }}
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      CARR_CONVERTER_FAMILY: ${{ matrix.family }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record candidate and initial unqualified state
        run: |
          New-Item -ItemType Directory converter-ci-results -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Candidate checkout differs from the event.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve candidate tree.' }
          @{
            schema = 1; status = 'NOT_RUN'; family = $env:CARR_CONVERTER_FAMILY
            source_commit = $head; source_tree = $tree
            workflow_sha = $env:GITHUB_WORKFLOW_SHA; workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content -Encoding utf8 converter-ci-results/source-provenance.json
          @{schema = 1; status = 'NOT_RUN'; reason = 'Required native qualification has not completed.'} |
            ConvertTo-Json | Set-Content -Encoding utf8 converter-ci-results/converter-gate.json
          "CARR_CONVERTER_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CONVERTER_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the exact candidate.' }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build and install an exact source-bound wheel
        timeout-minutes: 10
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("carr-converters-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + "-" + $env:CARR_CONVERTER_FAMILY)
          if (Test-Path -LiteralPath $work) { throw 'Qualification environment must be fresh.' }
          $wheels = Join-Path $work 'wheels'
          New-Item -ItemType Directory $wheels -ErrorAction Stop | Out-Null
          python -m pip install --only-binary=:all: setuptools==84.2.1 wheel==0.48.0 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = @(Get-ChildItem -LiteralPath $wheels -Filter '*.whl')
          if ($built.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $venv = Join-Path $work 'installed'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -I -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --no-deps --no-index --no-compile $built[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pip install --only-binary=:all: pytest==9.0.2 zstandard==0.25.0 packaging==26.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = @'
          import importlib.metadata as metadata, json, pathlib, re, struct, sys
          pins = dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)', pathlib.Path('packaging/windows-cp311.lock').read_text(), re.M))
          assert len(pins) == 17 and {name: metadata.version(name) for name in pins} == pins
          assert sys.platform == 'win32' and sys.flags.isolated and struct.calcsize('P') == 8
          print(json.dumps(pins, sort_keys=True))
          '@
          & $python -I -B -c $inventory | Tee-Object converter-ci-results/runtime-17-pins.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CONVERTER_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CONVERTER_WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CONVERTER_WHEEL=$($built[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify fixed publisher identities before preparing optional tools
        timeout-minutes: 15
        run: |
          $toolsRoot = Join-Path $env:CARR_CONVERTER_WORK 'optional'
          & $env:CARR_CONVERTER_PYTHON -I -B packaging/prepare_conversion_runtimes.py --family $env:CARR_CONVERTER_FAMILY --destination $toolsRoot --download 2>&1 |
            Tee-Object converter-ci-results/runtime-preparation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prepared = Get-Content (Join-Path $toolsRoot 'preparation.json') -Raw | ConvertFrom-Json
          if ($prepared.status -ne 'PASS') { throw 'Runtime preparation is incomplete.' }
          Copy-Item -LiteralPath (Join-Path $toolsRoot 'preparation.json') converter-ci-results/publisher-identities.json
          if ($env:CARR_CONVERTER_FAMILY -eq 'selected') {
            $ocr = Join-Path $env:CARR_CONVERTER_WORK 'ocr'
            & $env:CARR_CONVERTER_PYTHON -I -B packaging/prepare_windows_ocr.py --cache (Join-Path $env:CARR_CONVERTER_WORK 'ocr-cache') --output $ocr --source-archive (Join-Path $env:CARR_CONVERTER_WORK 'ocr-corresponding-source.tar') --download |
              Tee-Object converter-ci-results/ocr-preparation.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "CARR_PANDOC=$($prepared.pandoc)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CARR_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TESSDATA_PREFIX=$(Join-Path $ocr 'tessdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $office = Join-Path $env:CARR_CONVERTER_WORK 'libreoffice'
            New-Item -ItemType Directory $office -ErrorAction Stop | Out-Null
            $msiexec = Join-Path $env:SystemRoot 'System32/msiexec.exe'
            $msiLog = Join-Path (Get-Location) 'converter-ci-results/libreoffice-msi.log'
            $arguments = '/a "' + $prepared.libreoffice_msi + '" /qn /norestart TARGETDIR="' + $office + '" /l*v "' + $msiLog + '"'
            $process = Start-Process -FilePath $msiexec -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw ('Pinned LibreOffice extraction failed: ' + $process.ExitCode) }
            $matches = @(Get-ChildItem -LiteralPath $office -Recurse -File -Filter 'soffice.com' |
                         Where-Object { $_.Directory.Name -ceq 'program' })
            if ($matches.Count -ne 1) { throw 'Expected one actual extracted LibreOffice installation.' }
            "CARR_SOFFICE=$($matches[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CARR_OFFICE_ROOT=$($matches[0].Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Keep actual native conversion children offline
        timeout-minutes: 3
        run: |
          $programs = @($env:CARR_CONVERTER_PYTHON)
          if ($env:CARR_CONVERTER_FAMILY -eq 'selected') {
            $programs += $env:CARR_PANDOC
            $programs += Join-Path $env:CARR_OCR_DIR 'tesseract.exe'
          } else {
            $programs += @(Get-ChildItem -LiteralPath (Join-Path $env:CARR_OFFICE_ROOT 'program') -File |
                            Where-Object { $_.Extension -in @('.exe', '.bin', '.com') } |
                            ForEach-Object { $_.FullName })
          }
          $names = @()
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw 'A selected native child executable is missing.' }
            $name = 'CARR-converters-' + $env:GITHUB_RUN_ID + '-' + $env:CARR_CONVERTER_FAMILY + '-' + $names.Count
            New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Program $program -Action Block -Profile Any -Enabled True -ErrorAction Stop | Out-Null
            $rule = Get-NetFirewallRule -Name $name -ErrorAction Stop
            if ($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound') { throw 'Native offline rule is not active.' }
            $names += $name
          }
          $names | ConvertTo-Json -AsArray | Set-Content -Encoding utf8 converter-ci-results/firewall-rules.json
          $programs | ConvertTo-Json -AsArray | Set-Content -Encoding utf8 converter-ci-results/firewall-programs.json

      - name: Require every real synthetic converter case from source and installed wheel
        timeout-minutes: 32
        run: |
          $arguments = @('--family', $env:CARR_CONVERTER_FAMILY, '--checkout', (Get-Location).Path,
                         '--wheel', $env:CARR_CONVERTER_WHEEL, '--output', (Join-Path (Get-Location) 'converter-ci-results'),
                         '--source-commit', $env:CARR_CONVERTER_COMMIT, '--source-tree', $env:CARR_CONVERTER_TREE)
          if ($env:CARR_CONVERTER_FAMILY -eq 'selected') {
            $arguments += @('--pandoc-root', (Join-Path $env:CARR_CONVERTER_WORK 'optional/pandoc'), '--ocr-root', $env:CARR_OCR_DIR)
          } else {
            $arguments += @('--office-root', $env:CARR_OFFICE_ROOT)
          }
          & $env:CARR_CONVERTER_PYTHON -I -B -X utf8 scripts/conversion_acceptance.py @arguments 2>&1 |
            Tee-Object converter-ci-results/acceptance.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content converter-ci-results/converter-gate.json -Raw | ConvertFrom-Json
          $expected = if ($env:CARR_CONVERTER_FAMILY -eq 'selected') { 6 } else { 7 }
          if ($report.status -ne 'PASS' -or $report.source_cases -ne $expected -or $report.installed_cases -ne $expected -or
              $report.source_commit -ne $env:CARR_CONVERTER_COMMIT -or $report.source_tree -ne $env:CARR_CONVERTER_TREE -or
              -not $report.installed_identity.isolated) { throw 'Actual converter qualification is incomplete.' }
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during acceptance.' }

      - name: Preserve preparation diagnostics and remove only owned firewall rules
        if: always()
        run: |
          if ($env:CARR_CONVERTER_WORK) {
            $preparation = Join-Path $env:CARR_CONVERTER_WORK 'optional/preparation.json'
            if (Test-Path -LiteralPath $preparation -PathType Leaf) {
              Copy-Item -LiteralPath $preparation converter-ci-results/publisher-identities.json -Force
            }
          }
          Get-NetFirewallRule -Name ('CARR-converters-' + $env:GITHUB_RUN_ID + '-' + $env:CARR_CONVERTER_FAMILY + '-*') -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction Stop

      - name: Upload complete raw optional-tool evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-converters-${{ matrix.family }}-${{ github.sha }}
          path: |
            carr-library/converter-ci-results
          if-no-files-found: error
          retention-days: 14
