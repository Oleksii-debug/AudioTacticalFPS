name: CARR original and corrected JUnit diagnostic
on:
  push:
    branches:
      - carr/junit-original-diagnostics-af5-20261127
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the exact original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 33007dc83fa1ede699ee9a6ef8df494dace401b9
          persist-credentials: false
      - name: Set up the checker interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Diagnose the exact failed artifact without qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from hashlib import sha1, sha256
          import io
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          ARTIFACT_ID = 15175709033
          ARTIFACT_BYTES = 119302
          ARTIFACT_SHA256 = "341096d9e8708d5b54e4dfe961edf31cd681a32ed8cdc7c88da7c4f6108b6179"
          SOURCE_COMMIT = "33007dc83fa1ede699ee9a6ef8df494dace401b9"
          WORKFLOW_BLOB = "32889650ecd0e06bc5601c1b93aa728f3549dc67"
          MAX_XML_BYTES = 8 * 1024 * 1024
          workspace = Path.cwd().resolve()
          report_path = workspace / "junit-original-diagnostic.json"
          workflow_bytes = (workspace / ".github/workflows/carr-windows.yml").read_bytes()
          assert sha1(b"blob " + str(len(workflow_bytes)).encode("ascii") + b"\0" + workflow_bytes).hexdigest() == WORKFLOW_BLOB
          workflow = workflow_bytes.decode("utf-8")
          prefix = '& $python -I -B -c "'
          suffix = '" | Tee-Object \'ci-results/full-bundle-workflows.json\''
          matches = [line.strip() for line in workflow.splitlines()
                     if line.strip().startswith(prefix)
                     and "full-bundle-workflows.xml" in line and "required=" in line]
          assert len(matches) == 1 and matches[0].endswith(suffix)
          checker = matches[0][len(prefix):-len(suffix)]
          # The observed PowerShell double-quoted argument has no interpolation or escapes.
          assert "$" not in checker and chr(96) not in checker
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None
          
          api = "https://api.github.com/repos/Oleksii-debug/AudioTacticalFPS/actions/artifacts/" + str(ARTIFACT_ID) + "/zip"
          request = urllib.request.Request(api, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              response = urllib.request.build_opener(NoRedirect()).open(request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise RuntimeError("Artifact API returned HTTP " + str(error.code)) from None
              location = error.headers.get("Location", "")
          else:
              response.close()
              raise RuntimeError("Artifact API did not return its expected download redirect")
          parsed = urllib.parse.urlsplit(location)
          host = (parsed.hostname or "").lower()
          if (parsed.scheme != "https" or parsed.username or parsed.password
                  or parsed.port not in (None, 443)
                  or not (host.endswith(".blob.core.windows.net")
                          or host.endswith(".githubusercontent.com"))):
              raise RuntimeError("Artifact transport URL is outside the expected HTTPS storage hosts")
          # This distinct request carries no token. Never print the signed transport URL.
          try:
              transport = urllib.request.Request(location, headers={"Accept": "application/zip"})
              with urllib.request.build_opener(NoRedirect()).open(transport, timeout=60) as response:
                  artifact = response.read(ARTIFACT_BYTES + 1)
          except Exception:
              raise RuntimeError("Artifact storage download failed") from None
          assert len(artifact) == ARTIFACT_BYTES, "Original artifact size differs"
          assert sha256(artifact).hexdigest() == ARTIFACT_SHA256, "Original artifact digest differs"
          
          with zipfile.ZipFile(io.BytesIO(artifact)) as archive:
              members = archive.infolist()
              assert len(members) <= 1000
              assert len({item.filename for item in members}) == len(members), "Duplicate archive entries"
              accepted_names = {"full-bundle-workflows.xml", "ci-results/full-bundle-workflows.xml"}
              wanted = [item for item in members if item.filename in accepted_names]
              assert len(wanted) == 1, "Expected one original installed JUnit member"
              member = wanted[0]
              assert not member.is_dir() and not stat.S_ISLNK(member.external_attr >> 16)
              assert not (member.flag_bits & 1) and 0 < member.file_size <= MAX_XML_BYTES
              with archive.open(member) as stream:
                  junit = stream.read(MAX_XML_BYTES + 1)
              assert len(junit) == member.file_size <= MAX_XML_BYTES
          assert b"<!DOCTYPE" not in junit.upper() and b"<!ENTITY" not in junit.upper()
          project = workspace / "carr-library"
          destination = project / "ci-results/full-bundle-workflows.xml"
          destination.parent.mkdir(parents=True, exist_ok=True)
          # No archive path is extracted: only the checked XML enters this fixed path.
          destination.write_bytes(junit)
          os.chdir(project)
          
          records = []
          conditions = []
          
          def record_assertion(number, condition, value):
              record = {"number": number, "condition": condition, "ok": bool(value)}
              records.append(record)
              print(json.dumps({"kind": "original_assertion", **record}, ensure_ascii=True), flush=True)
          
          class DiagnosticAssertions(ast.NodeTransformer):
              def visit_Assert(self, node):
                  condition = ast.unparse(node.test)
                  conditions.append(condition)
                  replacement = ast.Expr(value=ast.Call(
                      func=ast.Name(id="_record_original_assertion", ctx=ast.Load()),
                      args=[ast.Constant(len(conditions)), ast.Constant(condition), node.test],
                      keywords=[]))
                  return ast.copy_location(replacement, node)
          
              def visit_Expr(self, node):
                  if (isinstance(node.value, ast.Call)
                          and isinstance(node.value.func, ast.Name)
                          and node.value.func.id == "print"):
                      # The original final PASS message must never qualify this diagnostic.
                      return ast.copy_location(ast.Pass(), node)
                  return self.generic_visit(node)
          
          tree = DiagnosticAssertions().visit(ast.parse(checker, mode="exec"))
          ast.fix_missing_locations(tree)
          namespace = {"_record_original_assertion": record_assertion}
          exception = None
          try:
              exec(compile(tree, "<exact-original-junit-checker>", "exec"), namespace)
          except Exception as error:
              exception = {"type": type(error).__name__, "message": str(error)[:500]}
          
          cases = namespace.get("cases", [])
          required = namespace.get("required", set())
          observed_names = {case.get("name") for case in cases}
          missing = sorted(required - observed_names)
          failed_assertions = [record for record in records if not record["ok"]]
          failed = bool(exception or failed_assertions or len(records) != len(conditions))
          interesting = ("test_prepared_extended_format_survives_relocation_and_resumes",
                         "test_final_callback_archive_blocks_transcription_publication")
          report = {
              "diagnostic_only": True,
              "status": "DIAGNOSTIC_FAILED" if failed else "DIAGNOSTIC_MATCHED",
              "original_checker_verdict": "failure" if failed else "success",
              "source_commit": SOURCE_COMMIT,
              "workflow_blob": WORKFLOW_BLOB,
              "original_artifact_id": ARTIFACT_ID,
              "original_artifact_bytes": len(artifact),
              "original_artifact_sha256": sha256(artifact).hexdigest(),
              "junit_member": member.filename,
              "junit_bytes": len(junit),
              "junit_sha256": sha256(junit).hexdigest(),
              "cases": len(cases),
              "passed": namespace.get("passed"),
              "failed": namespace.get("failed"),
              "skipped": namespace.get("skipped"),
              "assertion_count": len(conditions),
              "assertions_evaluated": len(records),
              "failed_assertions": failed_assertions,
              "exception": exception,
              "missing_required_names_repr": [repr(name) for name in missing],
              "parameter_examples": [
                  {"classname": case.get("classname"), "name_repr": repr(case.get("name"))}
                  for case in cases if (case.get("name") or "").startswith(interesting)],
              "module_totals": dict(sorted(Counter(case.get("classname") for case in cases).items())),
              "observed_asr": namespace.get("observed_asr"),
              "expected_asr": namespace.get("expected_asr"),
              "observed_export": namespace.get("observed_export"),
              "expected_export": namespace.get("expected_export"),
              "observed_ocr": namespace.get("observed_ocr"),
              "expected_ocr": namespace.get("expected_ocr"),
          }
          report_path.write_text(json.dumps(report, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"kind": "diagnostic_summary", **report}, ensure_ascii=True), flush=True)
          # Continue past failed assertions solely to collect diagnostics, then keep failure.
          # Preserve the recorded original failure before evaluating the corrected metadata.
          assert exception is None and len(records) == len(conditions) == 7
          assert [item["number"] for item in failed_assertions] == [4]
          assert report["passed"] == 2146 and report["failed"] == report["skipped"] == 0
          assert not report["missing_required_names_repr"]
          
          CORRECTED_COMMIT = "83f06358572153ce63e862192ea1a4905c3b4723"
          CORRECTED_WORKFLOW_BLOB = "9f35e5980a58d94ab55d57f78e7f28f47c1bf4ca"
          import base64
          import textwrap
          
          source_api = ("https://api.github.com/repos/Oleksii-debug/AudioTacticalFPS/contents/"
                        ".github/workflows/carr-windows.yml?ref=" + CORRECTED_COMMIT)
          source_request = urllib.request.Request(source_api, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.build_opener(NoRedirect()).open(source_request, timeout=30) as response:
                  source_json = response.read(512 * 1024 + 1)
          except Exception:
              raise RuntimeError("Pinned corrected workflow API read failed") from None
          assert len(source_json) <= 512 * 1024, "Corrected workflow response exceeds bound"
          source_document = json.loads(source_json)
          assert source_document["encoding"] == "base64"
          assert source_document["sha"] == CORRECTED_WORKFLOW_BLOB
          corrected_bytes = base64.b64decode(
              "".join(source_document["content"].splitlines()), validate=True)
          assert len(corrected_bytes) == source_document["size"] <= 256 * 1024
          assert sha1(b"blob " + str(len(corrected_bytes)).encode("ascii") + b"\0" +
                      corrected_bytes).hexdigest() == CORRECTED_WORKFLOW_BLOB
          corrected_workflow = corrected_bytes.decode("utf-8")
          corrected_lines = [line.strip() for line in corrected_workflow.splitlines()
                             if line.strip().startswith(prefix)
                             and "full-bundle-workflows.xml" in line and "required=" in line]
          assert len(corrected_lines) == 1 and corrected_lines[0].endswith(suffix)
          corrected_checker = corrected_lines[0][len(prefix):-len(suffix)]
          assert "$" not in corrected_checker and chr(96) not in corrected_checker
          
          old_audio = "audio_totals={'tests.audio.test_music':18,'tests.audio.test_production':18}"
          new_audio = ("audio_totals={'tests.audio.test_music':18,"
                       "'tests.audio.test_production.ProductionModelTests':6,"
                       "'tests.audio.test_production.ProductionRenderTests':12}")
          old_audio_assert = ("assert all(sum(c.get('classname')==module for c in cases)==count "
                              "for module,count in audio_totals.items())")
          new_audio_assert = (old_audio_assert +
                              ", ('audio_class_case_counts', audio_totals, "
                              "{module:sum(c.get('classname')==module for c in cases) "
                              "for module in audio_totals})")
          assert checker.count(old_audio) == checker.count(old_audio_assert) == 1
          assert corrected_checker == checker.replace(old_audio, new_audio, 1).replace(
              old_audio_assert, new_audio_assert, 1), "Unrelated original checker change"
          
          def ownership_source(text):
              start = "          $checkImportOwnership = @'\n"
              end = "\n          '@\n          $checkImportOwnership |"
              assert text.count(start) == 1
              tail = text.split(start, 1)[1]
              assert end in tail
              return textwrap.dedent(tail.split(end, 1)[0])
          
          original_ownership = ownership_source(workflow)
          corrected_ownership = ownership_source(corrected_workflow)
          assert original_ownership == corrected_ownership, "Ownership checker changed"
          
          def diagnose(code, label, expected_assertions):
              global conditions
              conditions = []
              local_records = []
              def record(number, condition, value):
                  item = {"number": number, "condition": condition, "ok": bool(value)}
                  local_records.append(item)
                  print(json.dumps({"kind": label + "_assertion", **item}), flush=True)
              parsed_tree = DiagnosticAssertions().visit(ast.parse(code, mode="exec"))
              ast.fix_missing_locations(parsed_tree)
              values = {"_record_original_assertion": record}
              problem = None
              try:
                  exec(compile(parsed_tree, "<exact-" + label + "-checker>", "exec"), values)
              except Exception as error:
                  problem = {"type": type(error).__name__, "message": str(error)[:500]}
              mismatches = [item for item in local_records if not item["ok"]]
              result = {
                  "assertion_count": len(conditions),
                  "assertions_evaluated": len(local_records),
                  "assertions": local_records,
                  "exception": problem,
                  "matched": (problem is None and not mismatches and
                              len(conditions) == len(local_records) == expected_assertions),
              }
              return result, values
          
          corrected_result, corrected_values = diagnose(corrected_checker, "corrected", 7)
          ownership_result, ownership_values = diagnose(corrected_ownership, "ownership", 4)
          corrected_report = {
              "diagnostic_only": True,
              "qualified_application": False,
              "status": ("DIAGNOSTIC_MATCHED" if corrected_result["matched"] and
                         ownership_result["matched"] else "DIAGNOSTIC_FAILED"),
              "original_source_commit": SOURCE_COMMIT,
              "original_workflow_blob": WORKFLOW_BLOB,
              "original_checker_verdict": report["original_checker_verdict"],
              "original_failed_assertions": report["failed_assertions"],
              "original_artifact_id": ARTIFACT_ID,
              "original_artifact_sha256": sha256(artifact).hexdigest(),
              "junit_sha256": sha256(junit).hexdigest(),
              "cases": len(cases),
              "passed": report["passed"],
              "failed": report["failed"],
              "skipped": report["skipped"],
              "corrected_source_commit": CORRECTED_COMMIT,
              "corrected_workflow_blob": CORRECTED_WORKFLOW_BLOB,
              "corrected": corrected_result,
              "ownership": ownership_result,
              "expected_audio": corrected_values.get("audio_totals"),
              "observed_audio": {
                  module: sum(case.get("classname") == module for case in cases)
                  for module in corrected_values.get("audio_totals", {})},
              "expected_ownership": ownership_values.get("expected"),
              "observed_ownership": ownership_values.get("observed"),
              "ownership_totals": ownership_values.get("totals"),
          }
          corrected_report_path = workspace / "junit-corrected-diagnostic.json"
          corrected_report_path.write_text(
              json.dumps(corrected_report, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8")
          print(json.dumps({"kind": "corrected_diagnostic_summary", **corrected_report},
                           ensure_ascii=True), flush=True)
          # These are metadata replays against original synthetic evidence, not new app tests.
          raise SystemExit(0 if corrected_result["matched"] and ownership_result["matched"] else 1)
          PY
      - name: Preserve the diagnostic only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-original-junit-diagnostic-${{ github.sha }}
          path: |
            junit-original-diagnostic.json
            junit-corrected-diagnostic.json
          if-no-files-found: error
          retention-days: 7
