name: Selected Calibre reading review

on:
  push:
    branches: [carr/calibre-reading-review-20261127, carr/canonical-complete-20261127, carr/canonical-integrity-finish-20261127, carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-calibre-reading-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibre-reading-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Selected Calibre / Windows / eight actual formats
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: carr-library
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: installed
        run: python -m pip install ".[test]"
      - name: Prepare pinned regression audio runtime
        id: audio
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'ci-calibre-reading' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-calibre-regression-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_CALIBRE_TEST_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require selected-tool and existing publication boundaries
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ci_check.py --diagnostics --jobs 3 tests/conversion/test_calibre_selection.py tests/conversion/test_calibre_process_ownership.py tests/conversion/test_calibre_acceptance.py tests/conversion/test_conversion.py tests/conversion/test_conversion_publication.py tests/conversion/test_office_selection.py tests/conversion/test_archive_reading.py tests/ui/test_audio_conversion_controls.py 2>&1 | Tee-Object 'ci-calibre-reading/boundaries.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and admin-extract the exact official Calibre MSI
        id: calibre
        if: "!cancelled() && steps.installed.outcome == 'success'"
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'ci-calibre-reading' | Out-Null
          $pin = Get-Content -Raw -LiteralPath 'packaging/calibre.json' | ConvertFrom-Json
          $expectedUrl = 'https://github.com/kovidgoyal/calibre/releases/download/v9.19.0/calibre-64bit-9.19.0.msi'
          $expectedHash = '241193d5045bdcbc3e7ec000c22ede0b5da1fd2e91e83fa0b17f0e1f67174480'
          $expectedBytes = 291713024L
          if ($pin.schema -ne 1 -or $pin.version -ne '9.19.0' -or $pin.platforms.windows.url -cne $expectedUrl -or $pin.platforms.windows.sha256 -cne $expectedHash -or $pin.platforms.windows.bytes -ne $expectedBytes) { throw 'The reviewed Windows Calibre source identity changed.' }
          $work = Join-Path $env:RUNNER_TEMP 'carr-calibre-selected-runtime'
          if (Test-Path -LiteralPath $work) { throw 'Use a fresh selected-runtime directory.' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $installer = Join-Path $work 'calibre-64bit-9.19.0.msi'
          Invoke-WebRequest -Uri $expectedUrl -OutFile $installer -TimeoutSec 180
          if ((Get-Item -LiteralPath $installer).Length -ne $expectedBytes -or (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) { throw 'The downloaded Calibre MSI does not match its reviewed bytes.' }
          $expanded = Join-Path $work 'expanded'
          $msiLog = Join-Path (Get-Location).Path 'ci-calibre-reading/msi-admin-extract.log'
          $msiexec = Join-Path $env:SystemRoot 'System32/msiexec.exe'
          $arguments = @('/a', ('"' + $installer + '"'), '/qn', '/norestart', ('TARGETDIR="' + $expanded + '"'), '/L*v', ('"' + $msiLog + '"'))
          $process = Start-Process -FilePath $msiexec -ArgumentList $arguments -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw ('Calibre administrative extraction failed: ' + $process.ExitCode) }
          $executables = @(Get-ChildItem -LiteralPath $expanded -Filter 'ebook-convert.exe' -Recurse -File -ErrorAction Stop)
          if ($executables.Count -ne 1) { throw 'Administrative extraction must expose exactly one explicit ebook-convert.exe.' }
          $selected = $executables[0].FullName
          $root = $executables[0].Directory.FullName
          "CARR_CALIBRE_EXE=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CALIBRE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{ schema=1; status='VERIFIED_EXTRACTION_ONLY'; version='9.19.0';
             url=$expectedUrl; bytes=$expectedBytes; sha256=$expectedHash;
             executable=$selected; root=$root; license='GPLv3';
             distributed_with_application=$false; native_conversion='NOT_RUN' } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-calibre-reading/selected-runtime.json'
      - name: Require all eight installed conversions with selected runtime egress blocked
        if: "!cancelled() && steps.installed.outcome == 'success' && steps.audio.outcome == 'success' && steps.calibre.outcome == 'success'"
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python.exe).Source
          $identity = & $python -I -B -c "import json,sys; print(json.dumps({'executable':sys.executable,'base':sys._base_executable,'prefix':sys.prefix,'base_prefix':sys.base_prefix}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = $identity | ConvertFrom-Json
          $calibrePrograms = @(Get-ChildItem -LiteralPath $env:CARR_CALIBRE_ROOT -Recurse -File -Filter '*.exe' -ErrorAction Stop)
          if ($calibrePrograms.Count -eq 0 -or $calibrePrograms.Count -gt 512) { throw 'The selected Calibre executable inventory is empty or exceeds its bound.' }
          $pythonPrograms = @($python, $identity.executable, $identity.base)
          foreach ($prefix in (@($identity.prefix, $identity.base_prefix) | Sort-Object -Unique)) {
            $pythonPrograms += Get-ChildItem -LiteralPath $prefix -Recurse -File -Filter 'python*.exe' -ErrorAction Stop | Select-Object -ExpandProperty FullName
          }
          $programs = @(
            $pythonPrograms
            $calibrePrograms | Select-Object -ExpandProperty FullName
            (Join-Path $env:CARR_CALIBRE_TEST_AUDIO 'bin/ffmpeg.exe')
            (Join-Path $env:CARR_CALIBRE_TEST_AUDIO 'bin/ffprobe.exe')
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe')
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')
            (Get-Process -Id $PID).Path
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          if ($programs -notcontains $env:CARR_CALIBRE_EXE -or $programs -notcontains $identity.executable -or $programs -notcontains $identity.base) { throw 'The selected converter and Python owners must all have native egress rules.' }
          $runtimeBefore = @($calibrePrograms | Sort-Object FullName | ForEach-Object {
            [ordered]@{ path=$_.FullName; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $rulePrefix = 'CARR-calibre-review-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'The native fixture checks require every firewall profile enabled.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'The selected executable firewall rules are incomplete.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Native firewall rules do not cover every selected runtime executable.' }
            @{ status='PASS'; blocked_programs=$filters; calibre_executables=$runtimeBefore;
               scope='selected Calibre family and test runtime executables; not a whole-machine network claim' } |
              ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-calibre-reading/runtime-firewall.json'
            $fixtures = Join-Path $env:RUNNER_TEMP 'carr-calibre-authored-fixtures'
            & $python -I -B -X utf8 scripts/create_calibre_fixtures.py --calibre $env:CARR_CALIBRE_EXE --output $fixtures 2>&1 | Tee-Object 'ci-calibre-reading/fixture-generation.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual generation of the eight public unprotected fixtures failed.' }
            & $python -I -B -X utf8 scripts/calibre_conversion_acceptance.py --calibre $env:CARR_CALIBRE_EXE --fixtures (Join-Path $fixtures 'fixtures.json') 2>&1 | Tee-Object 'ci-calibre-reading/installed-eight-formats.txt'
            if ($LASTEXITCODE -ne 0) { throw 'The actual installed Calibre conversion acceptance failed.' }
            $runtimeAfter = @(Get-ChildItem -LiteralPath $env:CARR_CALIBRE_ROOT -Recurse -File -Filter '*.exe' -ErrorAction Stop | Sort-Object FullName | ForEach-Object {
              [ordered]@{ path=$_.FullName; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
            if (($runtimeBefore | ConvertTo-Json -Depth 4 -Compress) -cne ($runtimeAfter | ConvertTo-Json -Depth 4 -Compress)) { throw 'The selected native executable family changed during acceptance.' }
            @{ status='PASS'; after=$runtimeAfter; signed_installer_claim=$false;
               arbitrary_document_fidelity='NOT_QUALIFIED'; runtime_distributed=$false } |
              ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-calibre-reading/native-runtime-after.json'
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve source and dependency identities
        if: always()
        run: |
          New-Item -ItemType Directory -Force 'ci-calibre-reading' | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 'ci-calibre-reading/commit.txt'
          python -m pip freeze | Out-File -Encoding utf8 'ci-calibre-reading/python-packages.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: calibre-reading-Windows-${{ github.sha }}
          path: carr-library/ci-calibre-reading
          if-no-files-found: error
