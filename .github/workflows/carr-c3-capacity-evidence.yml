name: Inspect exact retained capacity phase evidence

on:
  push:
    branches: ['carr/ci-c3-capacity-evidence-*']
    paths: ['.github/workflows/carr-c3-capacity-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-exact-completed-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify two exact completed 343 public synthetic reports and print measured fields
        env:
          CARR_EVIDENCE_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          import json
          import math
          import os
          from pathlib import PurePosixPath
          import stat
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPOSITORY = 'Oleksii-debug/AudioTacticalFPS'
          RUN = 46107711781
          HEAD = '343efc505230f969ec9519bd04e4340381f07909'
          TREE = '917d3d1d4b8f652f596b74b51a58d33f5f576bd9'
          SCHEMA = 'carr-library-corpus-benchmark/1'
          PHASES = ['build', 'measure', 'restart', 'operations', 'backup']
          CAPACITY = {'construction': 'retained-fixture', 'public_samples': 12,
                      'complete_backup': True, 'backup_capacity_profile': 'large-source-v1'}
          ARTIFACTS = json.loads(r'''[{"artifact":15249470189,"job":140866490969,"books":1000,"segments_per_book":20,"zip_bytes":27246,"zip_sha256":"56a6ed2da7276de3abb4566c8b6d4dd71b29d54bc6cc5cd704f837e0fccdb245","name":"retained-capacity-large-source-v1-1000x20-343efc505230f969ec9519bd04e4340381f07909-1","status":"PASS","phases":[{"phase":"build","reason":null,"status":"PASS"},{"phase":"measure","reason":null,"status":"PASS"},{"phase":"restart","reason":null,"status":"PASS"},{"phase":"operations","reason":null,"status":"PASS"},{"phase":"backup","reason":null,"status":"PASS"}],"retained":{"1000/backup.json":{"bytes":6936,"sha256":"ed046598f79b7f9ce58af348b5c8ecbb30e1730b65e5b17cd24987c53a622a0f"},"1000/backup.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/backup.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/build.json":{"bytes":5976,"sha256":"933d23e4320d699ca8dec3d558e7da42f121741822fc0ad0b9b12c0f28d5ec7b"},"1000/build.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/build.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/measure.json":{"bytes":6987,"sha256":"97302d26e94f8347bf2ec621a0a7cc9c1f0eae186c0211a9eedb4e3415dcc279"},"1000/measure.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/measure.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/operations.json":{"bytes":10140,"sha256":"ddc8961457e9a4be614ada0f34083e3476034e437037ed098f6ab313b8f76b2b"},"1000/operations.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/operations.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/restart.json":{"bytes":6728,"sha256":"f9f0cf9ee55a37271a5128393597a505c6c7d75890647d0a6b5aa5aebe276b0f"},"1000/restart.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"1000/restart.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"configuration.json":{"bytes":5460,"sha256":"34b38a1e4ca6746ef47962b050428f5cd6b054d8b74227d63ebeba59c83d970d"},"library-corpus-scale.json":{"bytes":44656,"sha256":"b1b7985225c1d7a0d5cea8861d535ab3e99e2b503ddbf81baec61bae3e3f1d57"}}},{"artifact":15249541093,"job":140866490979,"books":10000,"segments_per_book":20,"zip_bytes":27398,"zip_sha256":"bb9cf6c595b83a240f1408712d9150ce99907ec88e0604e5324eb1be8629201f","name":"retained-capacity-large-source-v1-10000x20-343efc505230f969ec9519bd04e4340381f07909-1","status":"PASS","phases":[{"phase":"build","reason":null,"status":"PASS"},{"phase":"measure","reason":null,"status":"PASS"},{"phase":"restart","reason":null,"status":"PASS"},{"phase":"operations","reason":null,"status":"PASS"},{"phase":"backup","reason":null,"status":"PASS"}],"retained":{"10000/backup.json":{"bytes":6958,"sha256":"e630f6b240fca5a8a3c62e241084418298abd3e267b47d6e826bbbd274cdb833"},"10000/backup.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/backup.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/build.json":{"bytes":5981,"sha256":"6e5c5080a1f3ec552bb3e1a3ab99a6c2f207523520c9a10c7d9cbd4da8500a8f"},"10000/build.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/build.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/measure.json":{"bytes":7013,"sha256":"f05401bceedc442aa3ddd84f54a83ec7b92dba35a9386794822e00d342b49351"},"10000/measure.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/measure.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/operations.json":{"bytes":10145,"sha256":"3356e69c3066890f581b01bdbdbe40081dd3bb410e6c51b9cf6376bb9e122334"},"10000/operations.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/operations.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/restart.json":{"bytes":6747,"sha256":"c511feff8ec8543273fff104cdf4005782175e3ec7d6d9377d945abf0eb689c7"},"10000/restart.stderr.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"10000/restart.stdout.txt":{"bytes":0,"sha256":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"configuration.json":{"bytes":5462,"sha256":"48dae34199bf1b7a7b5ba083c0c94d5fd400526144331f16723161066dc36a79"},"library-corpus-scale.json":{"bytes":44732,"sha256":"80e30a59595b72e47c9d6aa917083c68012500911d6e5fbb1dde64b331463324"}}}]''')
          printed_bytes = 0
          
          class InspectionFailure(ValueError):
              pass
          
          def require(value, message):
              if not value:
                  raise InspectionFailure(message)
          
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'Duplicate JSON key.')
                  result[key] = value
              return result
          
          def parsed(raw):
              require(len(raw) <= 256 * 1024, 'JSON member is oversized.')
              value = json.loads(raw.decode('utf-8'), object_pairs_hook=unique,
                  parse_constant=lambda _: (_ for _ in ()).throw(InspectionFailure('Non-finite JSON.')))
              pending, count = [(value, 0)], 0
              while pending:
                  item, depth = pending.pop()
                  count += 1
                  require(count <= 20000 and depth <= 32, 'JSON structure exceeds its bound.')
                  if isinstance(item, float):
                      require(math.isfinite(item), 'Non-finite JSON number.')
                  elif isinstance(item, dict):
                      pending.extend((v, depth + 1) for v in item.values())
                  elif isinstance(item, list):
                      pending.extend((v, depth + 1) for v in item)
              return value
          
          def emit(label, value):
              global printed_bytes
              raw = json.dumps(value, ensure_ascii=True, sort_keys=True, allow_nan=False)
              require(len(raw) <= 24000, 'Projected log section is oversized.')
              printed_bytes += len(label) + len(raw) + 2
              require(printed_bytes <= 256 * 1024, 'Aggregate log projection is oversized.')
              print(label + ' ' + raw, flush=True)
          
          def read_bounded(response, maximum):
              data = response.read(maximum + 1)
              require(len(data) <= maximum, 'HTTP or ZIP response exceeds its bound.')
              return data
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def download(item):
              endpoint = ('https://api.github.com/repos/' + REPOSITORY
                          + '/actions/artifacts/' + str(item['artifact']))
              headers = {'Authorization': 'Bearer ' + os.environ['CARR_EVIDENCE_TOKEN'],
                         'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2022-11-28'}
              opener = urllib.request.build_opener(NoRedirect)
              with opener.open(urllib.request.Request(endpoint, headers=headers), timeout=20) as response:
                  metadata = parsed(read_bounded(response, 64 * 1024))
              require(metadata['id'] == item['artifact'] and metadata['expired'] is False
                      and metadata['size_in_bytes'] == item['zip_bytes'], 'Artifact identity or size differs.')
              require(metadata['workflow_run']['id'] == RUN
                      and metadata['workflow_run']['head_sha'] == HEAD, 'Artifact source run differs.')
              require(metadata['digest'] == 'sha256:' + item['zip_sha256']
                      and metadata['name'] == item['name'], 'Artifact digest or matrix identity differs.')
              try:
                  with opener.open(urllib.request.Request(endpoint + '/zip', headers=headers), timeout=20):
                      raise InspectionFailure('Expected an authenticated storage redirect.')
              except urllib.error.HTTPError as response:
                  require(response.code == 302, 'Artifact endpoint refused its storage redirect.')
                  location = response.headers.get('Location', '')
                  response.close()
              target = urllib.parse.urlsplit(location)
              require(target.scheme == 'https' and bool(target.hostname)
                      and target.username is None and target.password is None
                      and not target.fragment, 'Unsafe artifact storage URL.')
              # The ephemeral GitHub credential is never forwarded to object storage.
              with opener.open(urllib.request.Request(location), timeout=30) as response:
                  archive = read_bounded(response, 64 * 1024)
              require(len(archive) == item['zip_bytes']
                      and sha256(archive).hexdigest() == item['zip_sha256'],
                      'Downloaded ZIP differs from the exact requested artifact.')
              return archive
          
          def inspect(item):
              archive = download(item)
              count, segments = item['books'], item['segments_per_book']
              expected = item['retained']
              required = set(expected) | {'declared-profile.json', 'retention.json',
                                          'tested-commit.txt', 'tested-tree.txt', 'benchmark.txt'}
              payloads = {}
              with zipfile.ZipFile(BytesIO(archive)) as bundle:
                  members = bundle.infolist()
                  require(len(members) <= 32 and sum(v.file_size for v in members) <= 2 * 1024 * 1024,
                          'ZIP inventory exceeds its bound.')
                  seen, folded = set(), set()
                  for member in members:
                      name = member.filename
                      path = PurePosixPath(name)
                      require(name not in seen and name.casefold() not in folded
                              and '\\' not in name and not path.is_absolute()
                              and all(v not in ('', '.', '..') for v in name.rstrip('/').split('/')),
                              'ZIP contains an unsafe or duplicate member.')
                      seen.add(name)
                      folded.add(name.casefold())
                      mode = stat.S_IFMT(member.external_attr >> 16)
                      require(not member.flag_bits & 1
                              and member.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                              'Encrypted or unsupported ZIP entry.')
                      if member.is_dir():
                          require(name == str(count) + '/' and mode in (0, stat.S_IFDIR),
                                  'Unknown ZIP directory.')
                          continue
                      require(name in required and mode in (0, stat.S_IFREG)
                              and member.file_size <= 256 * 1024, 'Unknown or unsafe ZIP file.')
                      with bundle.open(member) as stream:
                          raw = read_bounded(stream, 256 * 1024)
                      require(len(raw) == member.file_size, 'Truncated ZIP member.')
                      payloads[name] = raw
              require(set(payloads) == required, 'Closed retained file inventory differs.')
              require(payloads['tested-commit.txt'].decode('ascii').strip() == HEAD
                      and payloads['tested-tree.txt'].decode('ascii').strip() == TREE,
                      'Retained commit/tree proof differs.')
              for name, pin in expected.items():
                  require(len(payloads[name]) == pin['bytes']
                          and sha256(payloads[name]).hexdigest() == pin['sha256'],
                          'Retained payload differs from its actual job-log identity.')
              config = parsed(payloads['configuration.json'])
              report = parsed(payloads['library-corpus-scale.json'])
              declared = parsed(payloads['declared-profile.json'])
              retained = parsed(payloads['retention.json'])
              require(config['schema'] == report['schema'] == SCHEMA
                      and config['sizes'] == report['requested_sizes'] == [count]
                      and report['status'] == retained['status'] == item['status']
                      and report['mode'] == 'source', 'Corpus report identity or actual status differs.')
              require(config['capacity'] == report['capacity'] == CAPACITY, 'Selected capacity contract differs.')
              require(report['configuration_sha256'] == sha256(payloads['configuration.json']).hexdigest(),
                      'Report configuration hash differs.')
              require(declared['source_commit'] == retained['source_commit'] == HEAD
                      and declared['books'] == retained['books'] == count
                      and declared['segments_per_book'] == segments
                      and declared['source_segments'] == retained['segments'] == count * segments
                      and declared['required_origin_count'] == len(report['origins']) == 21,
                      'Declared/source corpus identity differs.')
              require(declared['complete_backup'] is True
                      and declared['backup_capacity_profile'] == 'large-source-v1'
                      and declared['construction'] == 'retained-fixture'
                      and declared['public_samples'] == 12, 'Declared selection differs.')
              for name, value in {'segments_per_book': segments, 'segment_bytes': 256,
                                  'phase_timeout': 3600, 'max_disk_bytes': 25769803776,
                                  'min_free_bytes': 1073741824}.items():
                  require(config['case'][name] == declared[name] == value, 'Declared finite case differs.')
              require(retained['retained'] == expected and retained['phases'] == item['phases'],
                      'Retention summary differs from the exact actual log.')
              require(config['origins'] == report['origins']
                      and config['harness_sha256'] == report['harness_sha256']
                      == declared['inputs']['scripts/benchmark_library_scale.py']['sha256'],
                      'Actual configuration/source identities differ.')
              require(len(report['cases']) == 1
                      and report['cases'][0]['requested_books'] == count
                      and report['cases'][0]['status'] == item['status'], 'Unexpected corpus case.')
              phases = report['cases'][0]['phases']
              require([p['phase'] for p in phases] == [p['phase'] for p in item['phases']]
                      == PHASES[:len(phases)], 'Actual ordered phase inventory differs.')
              require(len({p['pid'] for p in phases}) == len(phases), 'Phases reused an interpreter.')
              completed_corpus = set()
              for phase, expected_phase in zip(phases, item['phases']):
                  actual = parsed(payloads[str(count) + '/' + phase['phase'] + '.json'])
                  require(all(key in phase and phase[key] == value for key, value in actual.items()),
                          'Aggregate phase differs from its retained child report.')
                  require(phase['status'] == expected_phase['status']
                          and phase.get('reason') == expected_phase['reason']
                          and phase['process_reaped'] is True,
                          'Actual phase outcome or process cleanup differs.')
                  require(phase['origins'] == config['origins']
                          and phase['harness_sha256'] == config['harness_sha256'],
                          'Phase source identity differs.')
                  if phase['status'] == 'PASS':
                      require(phase['books'] == count and phase['segments'] == count * segments
                              and phase['exit_code'] == 0, 'Passing phase has incomplete corpus or failed exit.')
                      completed_corpus.add(phase['corpus_sha256'])
                  else:
                      require(phase['exit_code'] != 0, 'Partial phase did not retain its failed outcome.')
              require(len(completed_corpus) == 1, 'Completed phases disagree on retained corpus identity.')
              require(item['status'] != 'PASS' or len(phases) == len(PHASES), 'Passing corpus lacks a requested phase.')
              emit('EXACT_ARTIFACT', {'repository': REPOSITORY, 'run_id': RUN, 'job_id': item['job'],
                  'artifact_id': item['artifact'], 'head_sha': HEAD, 'tree_sha': TREE,
                  'books': count, 'segments_per_book': segments, 'zip_bytes': len(archive),
                  'zip_sha256': item['zip_sha256'], 'report_sha256': expected['library-corpus-scale.json']['sha256'],
                  'harness_sha256': report['harness_sha256'], 'members': sorted(payloads),
                  'source_sha256': {name: data['sha256'] for name, data in report['origins'].items()}})
              emit('MEASUREMENT_CONTEXT', {'books': count, 'segments_per_book': segments,
                  'environment': report['environment'], 'case': config['case'], 'capacity': CAPACITY,
                  'method': report['method'], 'claims': report['claims'], 'mode': report['mode']})
              for phase in phases:
                  # Emit every captured measurement or partial-progress field, excluding only
                  # repeated source/path provenance already printed above. Do not invent
                  # stage timings that the child did not retain before an interruption.
                  omitted = {'origins', 'memory_kernel', 'harness_sha256', 'python_executable', 'python_prefix'}
                  emit('MEASURED_PHASE', {'requested_books': count, 'segments_per_book': segments,
                                         **{key: value for key, value in phase.items() if key not in omitted}})
                  if phase['status'] != 'PASS':
                      for suffix in ('stdout', 'stderr'):
                          name = str(count) + '/' + phase['phase'] + '.' + suffix + '.txt'
                          raw = payloads[name]
                          emit('FAILED_PHASE_OUTPUT', {'books': count, 'segments_per_book': segments,
                              'name': name, 'bytes': len(raw), 'sha256': sha256(raw).hexdigest(),
                              'bounded_tail': raw[-8192:].decode('utf-8', errors='replace')})
              emit('MEASURED_TOTAL', {'requested_books': count, 'segments': count * segments,
                  'actual_status': report['status'],
                  'sum_phase_wall_seconds': math.fsum(p['process_wall_seconds'] for p in phases),
                  'phases_not_run': PHASES[len(phases):],
                  'qualification': 'Exact retained-fixture source measurement only; no sustained ordinary-import, unrelated platform, general capacity or release claim.'})
          
          try:
              for item in ARTIFACTS:
                  inspect(item)
              emit('INSPECTION', {'status': 'PASS', 'meaning': 'Exact artifacts verified and observed outcomes printed; this is not corpus qualification.',
                  'inspected_artifacts': [item['artifact'] for item in ARTIFACTS],
                  'profile_scope': 'Two exact completed 343 reports; remaining 50k jobs are outside this inspection'})
          except Exception as error:
              print('ARTIFACT_INSPECTION_FAILED ' + type(error).__name__
                    + (': ' + str(error) if isinstance(error, InspectionFailure) else ''), file=sys.stderr)
              raise SystemExit(1)
          PY
