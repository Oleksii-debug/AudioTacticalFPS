name: CARR academic reconciliation acceptance
on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-academic-reconciliation.yml
  push:
    branches: [carr/academic-search-20261126, carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-academic-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Test each exact source revision even while an older runner allocation waits.
  group: carr-academic-reconciliation-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  reconciled-source:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carr-library
    env:
      CARR_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the source package and required synthetic-test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARR_TEST_COMMIT"
          git rev-parse HEAD 'HEAD^{tree}'
          python -m pip install '.[test]'
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Verify every reconciled path with strict isolated suites
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -m compileall -q src bootstrap
          python scripts/ci_check.py --jobs 3 \
            tests/research/test_academic_library.py \
            tests/e2e/test_search_operation_budget.py \
            tests/e2e/test_catalog_insights_workflow.py \
            tests/storage/test_academic_migration.py \
            tests/e2e/test_search_deadline.py \
            tests/citations/test_pdf_mapping_contradiction.py \
            tests/extract/test_ocr_model_cli.py \
            tests/extract/test_ocr_model_store.py \
            tests/extract/test_managed_ocr.py \
            tests/extract/test_ocr_languages.py \
            tests/extract/test_special_ocr_models.py \
            tests/ui/test_ocr_selection.py \
            tests/citations/test_csl.py \
            tests/academic_integration/test_formatting.py \
            tests/academic_integration/test_documents.py \
            tests/academic_integration/test_regeneration.py \
            tests/academic_integration/test_citation_ui.py \
            tests/academic_integration/test_end_to_end.py \
            tests/e2e/test_managed_ocr_import.py \
            tests/search/test_advanced_search.py \
            tests/search/test_federated_advanced.py \
            tests/search/test_federated.py \
            tests/search/test_search_paging.py tests/search/test_semantic_cache.py tests/search/test_retrieval_evaluation.py \
            tests/search/test_federated_independent.py \
            tests/search/test_literal_long_source.py \
            tests/search/test_literal_unicode_memory.py \
            tests/ui/test_federated_search.py \
            tests/ui/test_federated_labels.py \
            tests/ui/test_desktop_handlers.py \
            tests/ui/test_desktop_query_jobs.py \
            tests/e2e/test_advanced_research_search.py \
            tests/e2e/test_research_search_cli.py \
            tests/extract/test_document_formats_text.py \
            tests/extract/test_document_formats_xml.py \
            tests/e2e/test_extended_document_workflows.py \
            tests/extract/test_language_detection.py tests/extract/test_ocr_language_regions.py tests/storage/test_ocr_language_presets.py tests/ui/test_ocr_selection.py tests/audio/test_metadata.py tests/audio/test_metadata_cleanup_scope.py tests/audio/test_metadata_publication.py tests/audio/test_metadata_stream_hash.py tests/audio/test_metadata_review.py tests/ui/test_audio_metadata_dialog.py tests/ui/test_audio_metadata_lifetime.py tests/audio/test_audio_process.py tests/e2e/test_source_file.py tests/extract/test_raster_pages.py tests/e2e/test_raster_import.py \
            tests/acquisition/test_acquisition_cli.py \
            tests/acquisition/test_acquisition_security.py \
            tests/acquisition/test_acquisition_workflow.py \
            tests/acquisition/test_identifier_lookup_security.py \
            tests/acquisition/test_providers.py \
            tests/storage/test_library_backup_reading_state.py \
            tests/storage/test_v3_state_backup.py \
            tests/storage/test_state_backup_portability.py \
            tests/storage/test_pending_backup.py \
            tests/catalog/test_streaming_intake.py tests/ingest/test_large_source_intake.py tests/ingest/test_batch_continuation.py tests/ingest/test_batch_continuation_cli.py tests/e2e/test_import_legacy_config.py tests/e2e/test_import_commit_supervisor.py tests/ui/test_import_center.py \
            tests/storage/test_complete_pending_backup.py \
            tests/storage/test_studio_input_authority.py \
            tests/storage/test_durable_state_read.py \
            tests/storage/test_backup_v4_review.py \
            tests/storage/test_backup_schema_identity.py \
            tests/storage/test_backup_v4_sidecars.py \
            tests/storage/test_backup_primary_producers.py \
            tests/storage/test_backup_translation.py \
            tests/storage/test_backup_transcription.py \
            tests/storage/test_backup_book_plan_bindings.py \
            tests/storage/test_backup_generated_audio.py \
            tests/storage/test_backup_keyboard_drafts.py \
            tests/storage/test_backup_pending_common4.py \
            tests/reader/test_export_no_clobber.py tests/reader/test_export_reconciliation.py \
            tests/ingest/test_worker_publication_boundary.py \
            tests/ingest/test_import_publication_point.py \
            tests/e2e/test_import_worker_publication.py \
            tests/ui/test_keyboard_manager.py \
            tests/ui/test_studio_keyboard_registration.py \
            tests/ui/test_studio_progress_results.py \
            tests/ui/test_worker_cleanup.py \
            tests/storage/test_keyboard_preferences.py \
            tests/packaging/test_ci_check.py
      # This source-only job supplements the complete native Windows/bundle gate.

  canonical-production:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and reviewed verification dependencies
        run: |
          set -euo pipefail
          mkdir -p ci-production-results
          git rev-parse HEAD 'HEAD^{tree}' > ci-production-results/source.txt
          python -m pip install '.[test]'
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg default-jre-headless
      - name: Verify offline capture, clips, publication and state
        run: |
          set -euo pipefail
          python scripts/ci_check.py --jobs 2 \
            tests/assistant/test_local_tools.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_template_handlers.py tests/assistant/test_workflow_template_parameters.py tests/assistant/test_workflow_templates_cli.py tests/assistant/test_workflow_template_editor.py tests/assistant/test_player_tools.py tests/assistant/test_search_paging.py tests/audio/test_capture_admission.py tests/audio/test_recording.py tests/audio/test_conversion_batch.py tests/ui/test_audio_conversion_dialog.py tests/studio/test_audio_conversion_cli.py \
            tests/ui/test_recording_dialog.py tests/studio/test_clip_editing.py \
            tests/studio/test_clip_dialog.py tests/studio/test_project_effects.py tests/studio/test_studio_controller.py tests/speech/test_source.py tests/studio/test_book_audio.py tests/ui/test_book_audio_dialog.py tests/ui/test_worker_lifetime.py tests/ui/test_trust_lifetime.py tests/speech/test_player_controls.py tests/speech/test_wave_output.py tests/speech/test_playlist.py tests/speech/test_playlist_recovery.py tests/ui/test_audio_playback.py tests/ui/test_reader_playback.py tests/ui/test_reader_playback_actions.py tests/studio/test_publishing.py \
            tests/studio/test_publishing_boundaries.py tests/studio/test_publishing_cli.py \
            tests/studio/test_publishing_handlers.py \
            tests/studio/test_daisy_publishing.py tests/studio/test_daisy_boundaries.py tests/packaging/test_installer_process.py tests/packaging/test_standard_installer.py \
            tests/reader/test_ebook_audio.py tests/speech/test_pronunciation_review.py \
            tests/speech/test_pronunciation_handlers.py tests/speech/test_pronunciation_reader_hook.py tests/speech/test_voice_preferences.py tests/storage/test_voice_preferences_backup.py tests/ui/test_voice_preferences_dialog.py tests/speech/test_reading_presentation.py tests/speech/test_reading_presentation_handlers.py tests/speech/test_reading_presentation_reader_hook.py tests/storage/test_reader_preferences_backup.py tests/speech/test_reading_tabs.py tests/speech/test_reading_marks.py tests/speech/test_reading_focus.py tests/ui/test_reading_focus.py tests/ui/test_reader_focus_hook.py tests/ui/test_reading_tools.py tests/speech/test_narration_policy.py tests/ui/test_reading_narration.py tests/speech/test_reading.py tests/speech/test_session.py tests/ui/test_reader_listening_hook.py tests/operations/test_worker_start_cleanup.py tests/studio/test_measured_audio.py tests/ui/test_book_duration_dialog.py tests/speech/test_listening.py tests/ui/test_reader_tabs.py tests/ui/test_reader_voice_recovery.py tests/audio/test_recording_controls.py tests/audio/test_recording_monitor.py tests/studio/test_book_batch.py tests/studio/test_book_cli.py tests/studio/test_book_landmarks.py tests/ui/test_book_batch_dialog.py tests/storage/test_backup_publications.py tests/storage/test_backup_incremental.py tests/ui/test_backup_incremental_dialog.py tests/speech/test_clipboard_reader.py tests/ui/test_desktop_integration.py tests/ui/test_desktop_settings.py tests/storage/test_desktop_preferences.py tests/speech/test_playback_devices.py tests/speech/test_spelling.py tests/speech/test_spelling_handlers.py tests/speech/test_spelling_reader_hook.py tests/packaging/test_hunspell_build.py tests/ui/test_native_reading_presentation_driver.py \
            tests/studio/test_pronunciation.py tests/studio/test_pronunciation_dialog.py tests/studio/test_pronunciation_render.py \
            tests/audio/test_audiobook.py tests/audio/test_effect_presets.py tests/studio/test_audiobook_publication.py \
            tests/speech/test_navigation.py tests/ui/test_reader_navigation.py \
            tests/speech/test_find_replace.py tests/speech/test_find_replace_reader_hook.py tests/speech/test_player_transport.py tests/ui/test_find_replace_dialog.py \
            tests/operations/test_facade.py tests/operations/test_import_admission.py \
            tests/operations/test_production_admission.py tests/operations/test_resources.py \
            tests/operations/test_transcription_admission.py tests/ui/test_operations_dialog.py \
            tests/ui/test_operations_policy.py tests/e2e/test_operations_cli.py \
            tests/operations/test_resources_posix.py \
            tests/storage/test_state_replacement.py \
            tests/packaging/test_windows_bundle.py tests/packaging/test_prepare_publication_tools.py 2>&1 | tee ci-production-results/offline.txt
      - name: Verify actual loopback transport, approved jobs and signed client boundaries
        run: |
          set -euo pipefail
          # Actual synthetic sockets run outside ci_check's global network denial.
          # The one Windows vault case is required separately by both native gates.
          python -B -m pytest -q -o addopts= -o xfail_strict=true \
            tests/assistant tests/security --ignore=tests/security/test_activation_lifetime_windows.py \
            -k 'not test_real_windows_vault_anchor_roundtrip' \
            --junitxml=ci-production-results/providers-trust.xml 2>&1 | tee ci-production-results/providers-trust.txt
          python -B - <<'PY'
          import json, xml.etree.ElementTree as ET
          cases = list(ET.parse('ci-production-results/providers-trust.xml').iter('testcase'))
          names = {case.get('name', '').split('[')[0] for case in cases}
          required = {'test_advanced_v3_keeps_verified_tls_authority_and_exact_plaintext',
                      'test_advanced_v3_late_body_cannot_publish_or_retry',
                      'test_saved_translation_requires_its_original_authority_and_receipts'}
          assert cases and required <= names
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          print(json.dumps(dict(status='PASS', passed=len(cases), actual_provider_calls='NOT_RUN', windows_nvda='NOT_RUN')))
          PY
      - name: Validate actual EPUB and DAISY render outputs with pinned standards tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/carr-publication-validation"
          python scripts/prepare_publication_tools.py --output "$validation_dir" --download > ci-production-results/validation-inputs.json
          python -I -B scripts/epubcheck_acceptance.py --archive "$validation_dir/epubcheck-5.3.0.zip" --java "$(command -v java)" --report ci-production-results/epubcheck.json --require-installed
          python -I -B scripts/daisy_schema_acceptance.py --schemas "$validation_dir/daisy-schemas" --report ci-production-results/daisy-schemas.json --require-installed
      - name: Keep exact source and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-canonical-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/ci-production-results/
          retention-days: 7
