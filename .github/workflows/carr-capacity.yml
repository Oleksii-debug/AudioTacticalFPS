name: CARR retained library capacity

on:
  push:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths:
      - carr-library/scripts/benchmark_library_corpus.py
      - carr-library/pyproject.toml
      - carr-library/src/carr_library/__init__.py
      - carr-library/docs/acceptance/canonical-e3cf-*.json
      - carr-library/docs/CANONICAL_CONVERGENCE_FINAL_20261127.md
      - carr-library/src/carr_library/storage/revisions.py
      - carr-library/src/carr_library/search/pagination.py
      - carr-library/src/carr_library/ingest/source_profiles.py
      - carr-library/src/carr_library/library_backup.py
      - carr-library/src/carr_library/pending_backup.py
      - carr-library/src/carr_library/backup_capacity.py
      - carr-library/tests/storage/test_scoped_locator_capacity.py
      - carr-library/tests/storage/test_pending_backup.py
      - carr-library/tests/packaging/test_library_corpus_benchmark.py
      - .github/workflows/carr-capacity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-capacity-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  probe-contracts:
    name: Actual corpus and scoped validation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install current portable package and compile
        run: |
          set -euo pipefail
          mkdir -p capacity-contract-results
          git rev-parse HEAD > capacity-contract-results/tested-commit.txt
          python -m pip install '.[test,sync]'
          python -m pip check
          python -m compileall -q src tests scripts
      - name: Execute actual small corpus and indexed integrity contracts
        run: |
          set -euo pipefail
          python scripts/ci_check.py --jobs 2 tests/storage/test_scoped_locator_capacity.py tests/packaging/test_library_corpus_benchmark.py 2>&1 | tee capacity-contract-results/contracts.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-capacity-contracts-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/capacity-contract-results/
          retention-days: 7

  retained-corpus:
    name: ${{ matrix.books }} retained books and ${{ matrix.segments }} actual source segments per book
    needs: probe-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        include:
          - books: 1000
            segments: 20
          - books: 10000
            segments: 20
          - books: 50000
            segments: 20
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the current package used by fresh isolated workers
        run: |
          set -euo pipefail
          mkdir -p capacity-results
          git rev-parse HEAD > capacity-results/tested-commit.txt
          python -m pip install '.[test,sync]'
          python -m pip check
          python -m pip list --format=json > capacity-results/installed-packages.json
      - name: Measure all retained source results and recovery
        run: |
          set -euo pipefail
          measured_root="$RUNNER_TEMP/carr-capacity-${{ matrix.books }}"
          python -I -B scripts/benchmark_library_corpus.py --installed --complete-backup --output-dir "$measured_root" --books ${{ matrix.books }} --segments-per-book ${{ matrix.segments }} --timeout 7200 --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" 2>&1 | tee capacity-results/corpus.txt
      - name: Preserve bounded measurement metadata
        if: always()
        run: |
          set -euo pipefail
          measured_report="$RUNNER_TEMP/carr-capacity-${{ matrix.books }}/library-corpus.json"
          if [ -f "$measured_report" ]; then
            cp -- "$measured_report" capacity-results/library-corpus.json
            cat -- "$measured_report"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-capacity-${{ matrix.books }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/capacity-results/
          retention-days: 7
