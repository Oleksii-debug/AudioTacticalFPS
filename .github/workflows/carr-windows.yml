          @{ status='PASS'; sha256=$launcherHash; authenticode_signed=$false } | ConvertTo-Json | Set-Content 'ci-results/sealed-native-launcher.json'
          $manifestBefore = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
