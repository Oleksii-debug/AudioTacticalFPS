          & $env:CARR_PYTHON -I -B tests/ui/native_document_formats_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-document-formats.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

