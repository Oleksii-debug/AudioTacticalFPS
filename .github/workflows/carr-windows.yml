name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run required integrated source workflows
        timeout-minutes: 12
        run: |
          $suites = @(
            'tests/packaging/test_offline_runtime_policy.py',
            'bootstrap/semantic_compat/test_probe.py',
            'tests/e2e/test_application.py',
            'tests/e2e/test_retained_source_search_integrity.py',
            'tests/e2e/test_research_workflows.py',
            'tests/e2e/test_current_topic_scope.py',
            'tests/e2e/test_search_operation_budget.py',
            'tests/e2e/test_nested_search_clock_budget.py',
            'tests/ingest/test_application_atomic_gate.py',
            'tests/ingest/test_application_atomic_docx_gate.py',
            'tests/e2e/test_semantic_fallback_status.py',
            'tests/e2e/test_source_file.py',
            'tests/e2e/test_export_destination.py',
            'tests/storage/test_library_backup.py',
            'tests/catalog/test_catalog_panel_acceptance.py',
            'tests/storage/test_v2_recovery.py',
            'tests/storage/test_catalog_composition.py',
            'tests/reader/test_saved_topic_query.py',
            'tests/reader/test_topic_search_runtime.py',
            'tests/search/test_literal_long_source.py',
            'tests/search/test_literal_v2_composition.py',
            'tests/ui/test_desktop_query_jobs.py',
            'tests/ui/test_source_open_handler.py'
          )
          & $env:CARR_PYTHON scripts/ci_check.py @suites 2>&1 | Tee-Object 'ci-results/integrated-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native wx startup and source-opening events
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/native-desktop.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native saved-evidence page selection and note recovery
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_evidence_pages_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install the core bundle with its pinned Python runtime
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $bundle = Join-Path $bundleWork 'core bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes -r packaging/windows-cp311.lock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $applicationWheel = $wheels[0].FullName
          $runtime = Get-Content packaging/windows-python.json -Raw | ConvertFrom-Json
          $pythonArchive = Join-Path $bundleWork 'windows-python.tar.gz'
          Invoke-WebRequest -Uri $runtime.download.url -OutFile $pythonArchive
          $archiveHash = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.download.sha256) { throw 'Pinned Python archive checksum mismatch.' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/build_windows_bundle.py --wheel $applicationWheel --wheelhouse $wheelhouse --lock packaging/windows-cp311.lock --python-archive $pythonArchive --source-commit $sourceCommit --output $bundle | Tee-Object 'ci-results/core-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Join-Path $bundle 'bundle-manifest.json'
          $manifestBefore = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          & $bundledPython -I -B (Join-Path $bundle 'install_windows.py') 2>&1 | Tee-Object 'ci-results/core-bundle-install.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedPython = Join-Path $bundle '.venv/Scripts/python.exe'
          & $installedPython -I -B -m carr_library --self-test | Tee-Object 'ci-results/core-bundle-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/core-bundle-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash -ne $manifestBefore) { throw 'Bundle manifest changed during installation or startup.' }
          & $bundledPython -I -B -c "import importlib.util,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('bundle_verifier',root/'install_windows.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); module.verify(root); print(json.dumps(dict(status='PASS',python=sys.version,manifest_unchanged=True,sealed_files_verified=True,model='NOT_INCLUDED',ocr='NOT_INCLUDED',nvda='NOT_RUN')))" $bundle | Tee-Object 'ci-results/core-bundle-verified.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # These are synthetic native Windows checks. NVDA, actual model inference,
      # OCR, and the final full distribution have separate acceptance evidence.
      - name: Preserve exact-commit runtime and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7
