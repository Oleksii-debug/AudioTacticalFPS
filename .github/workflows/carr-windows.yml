          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nativeInstalledPython -I -B packaging/native-launcher/probe_installed_windows.py --bundle-root $nativeBundle --report 'ci-results/library-bundle-native-launcher.json' 2>&1 | Tee-Object 'ci-results/library-bundle-native-launcher.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nativeInstalledPython -I -B -c "import runpy,sys; from carr_library.native_runtime import activate_bundled_runtime; handle=activate_bundled_runtime(); assert handle is not None; runpy.run_path(sys.argv[1],run_name='__main__')" (Resolve-Path tests/ui/probe_source_open_native.py).Path 2>&1 | Tee-Object 'ci-results/library-bundle-native.txt'
