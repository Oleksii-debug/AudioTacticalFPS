          & $env:CARR_PYTHON -I -B scripts/windows_v3_reading_smoke.py 2>&1 | Tee-Object 'keyboard-results/native-v3-reading.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

