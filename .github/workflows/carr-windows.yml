          source_commit = sys.argv[3]
          installed_root = bundle / '.venv'
          assert pathlib.Path(sys.executable).resolve().is_relative_to(installed_root)
          assert all(pathlib.Path(module.__file__).resolve().is_relative_to(installed_root) for module in (bootstrap, carr_library))
          manifest_raw = (bundle / 'bundle-manifest.json').read_bytes()
          manifest = json.loads(manifest_raw)
