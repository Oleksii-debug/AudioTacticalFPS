          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativePrograms = @($nativeBundledPython, (Join-Path $nativeBundle 'runtime/pythonw.exe'), $nativeInstalledPython,
            (Join-Path $nativeBundle '.venv/Scripts/pythonw.exe'), (Join-Path $nativeBundle 'ocr/tesseract.exe'),
            (Join-Path $nativeBundle 'ResearchLibrary.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          $fullPrograms = @($bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $installedPython, (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ocr/tesseract.exe'), (Join-Path $bundle 'ResearchLibrary.exe'),
            (Join-Path $bundle 'audio-runtime/bin/ffmpeg.exe'), (Join-Path $bundle 'audio-runtime/bin/ffprobe.exe'),
            (Join-Path $bundle 'audio-runtime/bin/ffplay.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          $programs = @($nativePrograms + $fullPrograms)
          $rulePrefix = 'CARR-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
          # Temporary rules on this disposable CI VM. Fail before execution if
          # Windows Firewall cannot enforce every runtime program's outbound block.
          Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
          foreach ($program in $programs) {
            $ruleName = $rulePrefix + '-' + $ruleNames.Count
            $ruleNames += $ruleName
            New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
          }
          $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
          if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline checks require enabled Windows Firewall profiles.' }
          $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
          if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline execution rules are not active.' }
          $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
          if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline execution rules do not cover the intended programs.' }
          @{ status='PASS'; profiles_enabled=@($profiles.Name); outbound_blocked_programs=$fullPrograms; phase='installation, native desktop, multilingual inference and scanned-source research' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/full-bundle-firewall.json'
          # The complete enforced set above covers both variants. Keep each
          # evidence receipt bound to the corresponding six or nine executables.
          @{ status='PASS'; profiles_enabled=@($profiles.Name); outbound_blocked_programs=$nativePrograms; phase='native library installation, SAPI, semantic inference and reviewed OCR' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/library-bundle-firewall.json'
          & $nativeBundledPython -I -B (Join-Path $nativeBundle 'install_windows.py') 2>&1 | Tee-Object 'ci-results/library-bundle-install.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
