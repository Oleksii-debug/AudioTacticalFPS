              assert 0 < length < len(actual)
              assert pathlib.Path(actual.value).samefile(root / 'native-runtime' / 'bin' / name)
          print(json.dumps(dict(status='PASS', installed_origins=origins, private_native_dll_paths='PASS', ffmpeg='UNAVAILABLE_EXPECTED', nvda='NOT_RUN')), flush=True)
