              assert 0 < length < len(actual)
              assert pathlib.Path(actual.value).samefile(root / 'native-runtime' / 'bin' / name)
          print(json.dumps(dict(status='PASS', installed_package=True,
              source_commit=manifest['source_commit'], source_tree=manifest['source_tree'],
