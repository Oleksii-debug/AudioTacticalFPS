          $verifyHunspell = @'
          from hashlib import sha256
          import importlib, json, os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          mode, report_name = sys.argv[1:3]
          assert mode in ('source', 'installed', 'native-source', 'native-installed')
          reports = Path(os.environ['CARR_HUNSPELL_REPORTS']).resolve(strict=True)
          source_root = Path('src').resolve(strict=True)
          build_root = Path(os.environ['CARR_HUNSPELL_BUILD']).resolve(strict=True)
          dll = Path(os.environ['CARR_HUNSPELL_DLL']).resolve(strict=True)
          assert dll.samefile(build_root / 'bin' / 'libhunspell.dll')
          pin_raw = Path('scripts/hunspell-1.7.2-source.json').read_bytes()
          assert sha256(pin_raw).hexdigest() == 'f5ea8a9afae905cd1d2dd56415b320fd0949d85e28151eb8ddb63d19d128aefc'
          pin = json.loads(pin_raw)
          build = json.loads((build_root / 'build-report.json').read_text(encoding='utf-8'))
          assert build['schema'] == 'resonance-hunspell-msvc-build/1' and build['status'] == 'BUILT'
          assert build['source_commit'] == pin['commit'] == '2969be996acad84b91ab3875b1816636fe61a40e'
          assert build['source_manifest_sha256'] == sha256(pin_raw).hexdigest()
          assert build['source_bytes_modified'] is False and build['bundled'] is False
          assert build['native_api'] == 'NOT_RUN' and build['distribution_clearance'] == 'NOT_GRANTED'
          assert build['build']['exit_code'] == 0 and build['dll']['machine'] == 'AMD64'
          assert build['dll']['c_api'] == 'NOT_RUN'
          dll_raw = dll.read_bytes()
          assert len(dll_raw) == build['dll']['bytes'] and sha256(dll_raw).hexdigest() == build['dll']['sha256']
          assert Path(build['dll']['path']).resolve(strict=True).samefile(dll)
          source_files = build['source_files']
          assert len(source_files) == len(pin['files']) == 38
          assert build['license_files'] == pin['license_files']
          for actual, expected in zip(source_files, pin['files'], strict=True):
              assert all(actual[key] == expected[key] for key in ('path', 'bytes', 'git_blob'))
              raw = (build_root / 'source' / actual['path']).read_bytes()
              assert len(raw) == actual['bytes'] and sha256(raw).hexdigest() == actual['sha256']
          build_log = (build_root / 'build.log').read_bytes()
          assert len(build_log) == build['build']['log_bytes'] and sha256(build_log).hexdigest() == build['build']['log_sha256']
          report = json.loads((reports / report_name).read_text(encoding='utf-8'))
          native = mode.startswith('native-')
