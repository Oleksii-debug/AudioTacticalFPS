          verifier = importlib.util.module_from_spec(verifier_spec)
          verifier_spec.loader.exec_module(verifier)
          verifier.verify(bundle)
          proof = dict(status='PASS', source_commit=source_commit, installed_package=True,
                       required_cases=14, failed=0, skipped=0, exact_selector='tests/loopback/test_local_planning.py',
                       policy='numeric loopback TCP only; no DNS or external access',
