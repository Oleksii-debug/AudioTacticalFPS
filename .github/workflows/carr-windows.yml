name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/notebook-release-ascii-e021-20261126, carr/v3-integrated-private-ce034-20261126, carr/v3-final-delivery-gates-af5-20261126, carr/v3-final-delivery-gates-af5-20261127, carr/v3-final-delivery-gates-af5-20261127-final]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Validate embedded Python and explicit acceptance paths
        timeout-minutes: 2
        run: |
          $syntax = @'
          import ast, json, pathlib, re, textwrap
          project = pathlib.Path.cwd()
          source = (project.parent / '.github/workflows/carr-windows.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"^          \$\w+ = @'\n(.*?)^          '@$", source, re.M | re.S)
          assert blocks
          for number, block in enumerate(blocks, 1):
              ast.parse(textwrap.dedent(block), filename=f'workflow-python-{number}')
          inline = re.findall(r'^          &[^\r\n]*? -c "([^"\r\n]+)"', source, re.M)
          for number, expression in enumerate(inline, 1):
              ast.parse(expression, filename=f'workflow-inline-{number}')
          matches = re.findall(r'\$suites = @\(\n(.*?)\n          \)', source, re.S)
          assert len(matches) == 1
          suites = re.findall(r"'([^']+)'", matches[0])
          assert suites and len(suites) == len(set(suites))
          assert 'tests/audio/test_engines.py' not in suites
          assert all('probe_backup_v4_producer_models.py' not in name for name in suites)
          assert all((project / name).is_file() for name in suites)
          installed_matches = re.findall(r'installed_suites = \[\n(.*?)\n          \]', source, re.S)
          assert len(installed_matches) == 1
          installed_suites = re.findall(r"'([^']+)'", installed_matches[0])
          assert installed_suites and len(installed_suites) == len(set(installed_suites))
          assert all((project / name).is_file() for name in installed_suites)
          native_scripts = re.findall(r"^            @\{ Script='([^']+)'", source, re.M)
          assert native_scripts and len(native_scripts) == len(set(native_scripts))
          assert all((project / name).is_file() for name in native_scripts)
          print(json.dumps({'status': 'PASS', 'python_blocks': len(blocks), 'python_inline': len(inline),
                            'required_source_suites': len(suites), 'required_installed_suites': len(installed_suites), 'installed_native_gates': len(native_scripts)}))
          '@
          $syntax | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the actual desktop package in a fresh environment
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checkout does not match the exact event head.' }
          $sourceCommit | Set-Content 'ci-results/tested-commit.txt'
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,runpy; read_lock=runpy.run_path('packaging/build_windows_bundle.py')['read_lock']; locked=read_lock(pathlib.Path('packaging/windows-semantic-cp311.lock')); pins={name:value[0] for name,value in locked.items()}; actual={name:m.version(name) for name in pins}; assert pins and actual==pins; print(json.dumps(dict(status='PASS',count=len(pins),versions=actual),sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native citation dispatch before long source suites
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_citation_styles_smoke.py 2>&1 | Tee-Object 'ci-results/native-citation-styles-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native keyboard settings before long source suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_keyboard_settings_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-keyboard-settings-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native reader keymap before long source suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_reader_keymap_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-reader-keymap-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native evidence drafts before long source suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_evidence_drafts_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-drafts-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native transcription Export before long source suites
        timeout-minutes: 3
        run: |
          $checkTranscriptionOrigins = @'
          import hashlib, importlib, json, pathlib, sys
          project = pathlib.Path.cwd()
          prefix = pathlib.Path(sys.prefix).resolve()
          names = ('carr_library.application', 'carr_library.ui.transcription_dialog',
                   'carr_library.transcription', 'carr_library.transcription_host')
          origins = {}
          for name in names:
              module = importlib.import_module(name)
              origin = pathlib.Path(module.__file__).resolve()
              source = (project / 'src' / pathlib.Path(*name.split('.'))).with_suffix('.py')
              assert origin.is_relative_to(prefix), (name, origin, prefix)
              assert origin.read_bytes() == source.read_bytes(), name
              origins[name] = {'origin': str(origin),
                               'sha256': hashlib.sha256(origin.read_bytes()).hexdigest()}
          print(json.dumps({'status': 'PASS',
                            'execution_context': 'initial-installed-environment',
                            'module_origins': origins}, sort_keys=True))
          '@
          $checkTranscriptionOrigins | & $env:CARR_PYTHON -I -B -X utf8 - | Tee-Object 'ci-results/native-transcription-early-origins.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -X utf8 scripts/windows_transcription_smoke.py 2>&1 | Tee-Object 'ci-results/native-transcription-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkEarlyTranscription = @'
          import json, pathlib
          records = [json.loads(line) for line in
                     pathlib.Path('ci-results/native-transcription-early.txt').read_text(encoding='utf-8-sig').splitlines()
                     if line.startswith('{')]
          report = records[-1]
          expected = ['actual named wx controls', 'shared background operation',
                      'actual isolated child protocol', 'six verified formats',
                      'separate edit revision', 'original unchanged',
                      'actual export dispatch preserves verified bytes']
          assert report['status'] == 'PASS' and report['checks'] == expected
          assert report['whisper_acoustic_inference'] == 'NOT_RUN'
          assert report['manual_NVDA'] == 'NOT_RUN'
          report['execution_context'] = 'initial-installed-environment'
          print(json.dumps(report, sort_keys=True))
          '@
          $checkEarlyTranscription | & $env:CARR_PYTHON -I -B -X utf8 - | Tee-Object 'ci-results/native-transcription-early.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "TESSDATA_PREFIX=$(Join-Path $ocr 'tessdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the pinned audio tools before required audio regressions
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $audioCache = Join-Path $bundleWork 'audio-cache'
          $audioRuntime = Join-Path $bundleWork 'audio-runtime'
          & $env:CARR_PYTHON packaging/acquire_audio_runtime.py --output $audioCache --download | Tee-Object 'ci-results/audio-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON packaging/prepare_audio_runtime.py --archive (Join-Path $audioCache $audioLock.archive.name) --sources-dir $audioCache --output $audioRuntime | Tee-Object 'ci-results/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioBin = Join-Path $audioRuntime 'bin'
          "CARR_CI_AUDIO_RUNTIME=$audioRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_FFMPEG=$(Join-Path $audioBin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check bounded discovery fixtures before long source suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/audio/test_dordiai_discovery.py 2>&1 | Tee-Object 'ci-results/discovery-regression-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check observed export audio desktop and transcription regressions before long source suites
        timeout-minutes: 10
        run: |
          $closureSuites = @(
            'tests/audio/test_music.py',
            'tests/audio/test_production.py',
            'tests/reader/test_export_content_identity.py',
            'tests/reader/test_export_no_clobber.py',
            'tests/ui/test_export_destination.py',
            'tests/ui/test_academic_actions.py',
            'tests/ui/test_academic_export_handler.py',
            'tests/ui/test_audio_studio.py',
            'tests/ui/test_desktop_handlers.py',
            'tests/transcription/test_supplied_worker_bridge.py',
            'tests/transcription/test_pr99_host.py'
          )
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 3 @closureSuites 2>&1 | Tee-Object 'ci-results/export-transcription-closure-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkClosureCounts = @'
          import json, pathlib, re
          text = pathlib.Path('ci-results/export-transcription-closure-early.txt').read_text(encoding='utf-8-sig')
          observed = {name: int(count) for name, count in re.findall(r'^PASS: ([^\r\n]+): junit_passed=(\d+), failed=0, skipped=0, pytest_exit=0$', text, re.M)}
          expected = {'tests/audio/test_music.py': 18, 'tests/audio/test_production.py': 18, 'tests/reader/test_export_content_identity.py': 21, 'tests/reader/test_export_no_clobber.py': 33, 'tests/ui/test_export_destination.py': 5, 'tests/ui/test_audio_studio.py': 28, 'tests/transcription/test_supplied_worker_bridge.py': 38, 'tests/transcription/test_pr99_host.py': 18}
          assert all(observed.get(name) == count for name, count in expected.items()), (expected, observed)
          assert len(observed) == 11
          print(json.dumps({'status': 'PASS', 'required_suites': len(observed), 'case_counts': observed}, sort_keys=True))
          '@
          $checkClosureCounts | & $env:CARR_PYTHON -I -B - | Tee-Object 'ci-results/export-transcription-closure-early.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the exact test font for real OCR fixtures
        timeout-minutes: 2
        run: |
          # A test fixture only. It is outside src and never joins the product wheel.
          $font = @'
          import hashlib, json, pathlib, urllib.request
          target = pathlib.Path('DejaVuSans.ttf')
          url = 'https://raw.githubusercontent.com/matplotlib/matplotlib/4aeb773422464799998d900198b35cb80e94b3e1/lib/matplotlib/mpl-data/fonts/ttf/DejaVuSans.ttf'
          with urllib.request.urlopen(url, timeout=45) as response:
              raw = response.read(756073)
          assert len(raw) == 756072
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()
          assert blob == '5267218852f631928716a8005d7bf4b492aaf83d'
          with target.open('xb') as stream:
              stream.write(raw)
          from PIL import ImageFont
          ImageFont.truetype(str(target), 72)
          print(json.dumps({'status': 'PASS', 'git_blob': blob, 'sha256': hashlib.sha256(raw).hexdigest(), 'test_fixture_only': True}))
          '@
          $font | & $env:CARR_PYTHON -I -B - | Tee-Object 'ci-results/ocr-test-font.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR model manager before long suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/installed-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check observed Windows format and OCR regressions before long suites
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_document_formats_text.py tests/extract/test_ocr_runtime.py tests/extract/test_ocr_languages.py 2>&1 | Tee-Object 'ci-results/platform-regressions.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require transactional import ownership and migration before long suites
        timeout-minutes: 10
        run: |
          $receiptSuites = @(
            'tests/e2e/test_import_worker_publication.py',
            'tests/ingest/test_import_replay_identity.py',
            'tests/ingest/test_worker_publication_boundary.py',
            'tests/storage/test_academic_migration.py',
            'tests/storage/test_pending_backup.py',
            'tests/storage/test_complete_pending_backup.py',
            'tests/storage/test_backup_schema_identity.py',
            'tests/packaging/test_delivery_archive.py'
          )
          & $env:CARR_PYTHON -B scripts/ci_check.py --jobs 3 @receiptSuites 2>&1 | Tee-Object 'ci-results/import-ownership-early.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkReceiptCounts = @'
          import json, pathlib, re
          text = pathlib.Path('ci-results/import-ownership-early.txt').read_text(encoding='utf-8-sig')
          observed = {name: int(count) for name, count in re.findall(r'^PASS: ([^\r\n]+): junit_passed=(\d+), failed=0, skipped=0, pytest_exit=0$', text, re.M)}
          expected = {'tests/e2e/test_import_worker_publication.py': 34, 'tests/ingest/test_import_replay_identity.py': 22, 'tests/ingest/test_worker_publication_boundary.py': 29, 'tests/packaging/test_delivery_archive.py': 69}
          assert all(observed.get(name) == count for name, count in expected.items()), (expected, observed)
          assert set(observed) == set(['tests/e2e/test_import_worker_publication.py','tests/ingest/test_import_replay_identity.py','tests/ingest/test_worker_publication_boundary.py','tests/storage/test_academic_migration.py','tests/storage/test_pending_backup.py','tests/storage/test_complete_pending_backup.py','tests/storage/test_backup_schema_identity.py','tests/packaging/test_delivery_archive.py'])
          print(json.dumps({'status': 'PASS', 'required_suites': len(observed), 'case_counts': observed}, sort_keys=True))
          '@
          $checkReceiptCounts | & $env:CARR_PYTHON -I -B - | Tee-Object 'ci-results/import-ownership-early.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run required integrated source workflows
        timeout-minutes: 35
        run: |
          $suites = @(
            'tests/packaging/test_offline_runtime_policy.py',
            'tests/packaging/test_install_bytecode.py',
            'tests/e2e/test_offline_startup.py',
            'bootstrap/semantic_compat/test_probe.py',
            'tests/e2e/test_application.py',
            'tests/e2e/test_result_presentation.py',
            'tests/e2e/test_import_batches.py',
            'tests/ingest/test_batch_scan.py',
            'tests/ui/test_import_center.py',
            'tests/e2e/test_epub_import.py',
            'tests/extract/test_document_formats_text.py',
            'tests/extract/test_document_formats_xml.py',
            'tests/e2e/test_extended_document_workflows.py',
            'tests/extract/test_epub_ordered.py',
            'tests/reader/test_ebook_reader.py',
            'tests/ui/test_ebook_reader.py',
            'tests/extract/test_epub_navigation.py',
            'tests/reader/test_ebook_contents.py',
            'tests/e2e/test_epub_library.py',
            'tests/e2e/test_epub_reading_desk.py',
            'tests/ui/test_ebook_dialog.py',
            'tests/e2e/test_retained_source_search_integrity.py',
            'tests/e2e/test_research_workflows.py',
            'tests/e2e/test_catalog_insights_workflow.py',
            'tests/e2e/test_notebook_research_workflow.py',
            'tests/e2e/test_current_topic_scope.py',
            'tests/e2e/test_search_operation_budget.py',
            'tests/e2e/test_nested_search_clock_budget.py',
            'tests/ingest/test_application_atomic_gate.py',
            'tests/ingest/test_worker_isolated_launch.py',
            'tests/ingest/test_application_atomic_docx_gate.py',
            'tests/e2e/test_semantic_fallback_status.py',
            'tests/e2e/test_source_file.py',
            'tests/e2e/test_export_destination.py',
            'tests/e2e/test_academic_document_export.py',
            'tests/e2e/test_data_directory_containment.py',
            'tests/extract/test_clipping_visibility.py',
            'tests/extract/test_ocr_model_catalog.py',
            'tests/storage/test_library_backup.py',
            'tests/storage/test_backup_schema_identity.py',
            'tests/storage/test_academic_migration.py',
