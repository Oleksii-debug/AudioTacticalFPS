          $expectedSbom = (Get-FileHash -LiteralPath 'packaging/windows-semantic-sbom.cdx.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $installedPython = Join-Path $bundle '.venv/Scripts/python.exe'
          if (Test-Path -LiteralPath (Join-Path $bundle '.venv')) { throw 'Transfer profile requires a fresh offline installation.' }
          $testWheels = Join-Path $env:RUNNER_TEMP 'carr-test-wheels'
          if (!(Test-Path -LiteralPath $testWheels -PathType Container)) { throw 'Accepted offline test wheels are missing.' }
          $verifyTransferBundle = @'
          import hashlib, importlib.util, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          raw = (root / 'bundle-manifest.json').read_bytes()
          manifest = json.loads(raw)
          spec = importlib.util.spec_from_file_location('transfer_bundle_verifier', root / 'install_windows.py')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          verifier.verify(root)
          assert manifest['source_commit'] == sys.argv[2]
          assert manifest['parent_manifest_sha256'] == sys.argv[3]
          assert hashlib.sha256(raw).hexdigest() == sys.argv[4]
          assert hashlib.sha256((root / 'runtime-sbom.cdx.json').read_bytes()).hexdigest() == sys.argv[5]
          assert manifest['files']['runtime-sbom.cdx.json'] == sys.argv[5]
          assert all(manifest.get('bundled_' + name) is True for name in ('model', 'ocr', 'native_runtime', 'native_launcher', 'citation_runtime'))
          assert manifest.get('bundled_audio') is False
          assert not any(p.name.casefold() in ('audio', 'audio-runtime') for p in root.iterdir())
          assert not any(pathlib.PurePosixPath(name).parts[0].casefold() in ('audio', 'audio-runtime') or pathlib.PurePosixPath(name).name.casefold() in ('ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe') for name in manifest['files'])
          print(json.dumps(dict(status='PASS', profile='library-reader-sapi', source_commit=manifest['source_commit'], bundle_manifest_sha256=sys.argv[4], parent_manifest_sha256=sys.argv[3], bundled_audio=False, audio_runtime_inventory='ABSENT', sealed_files_verified=True, nvda='NOT_RUN')))
          '@
          $programs = @($bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $installedPython, (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ocr/tesseract.exe'), (Join-Path $bundle 'ResearchLibrary.exe'), (Join-Path $bundle 'citation-runtime/node.exe'), (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'), (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-transfer-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          $environmentBefore = @{}
          foreach ($name in @('PATH', 'CARR_TEST_MODEL_DIR', 'CARR_OCR_DIR', 'TESSDATA_PREFIX', 'PYTEST_DISABLE_PLUGIN_AUTOLOAD')) { $environmentBefore[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Transfer checks require enabled Windows Firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Transfer runtime outbound rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Transfer firewall rules do not cover all intended programs.' }
            @{ status='PASS'; profiles_enabled=@($profiles.Name); outbound_blocked_programs=$filters; profile='library-reader-sapi'; phase='fresh installation, native launcher, reading, bibliography, semantic inference, OCR and native SAPI' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/transfer-bundle-firewall.json'
