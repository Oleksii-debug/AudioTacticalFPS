      - name: Require the actual source-bound Hunspell C API under owned offline rules
        if: ${{ !cancelled() && steps.hunspell-runtime.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
