            'tests/catalog/test_ris_apply_v4.py',
            'tests/search/test_federated_advanced.py',
            'tests/storage/test_studio_input_backup.py',
            'tests/storage/test_studio_input_authority.py',
            'tests/storage/test_composed_recovery.py',
            'tests/storage/test_backup_v4_review.py',
            'tests/speech/test_discovery_cancellation.py',
            'tests/e2e/test_import_commit_supervisor.py',
            'tests/e2e/test_import_legacy_config.py',
            'tests/e2e/test_import_publication_receipt_integrity.py',
            'tests/ingest/test_initial_publication_completion.py',
            'tests/ui/test_export_destination.py',
            'tests/storage/test_durable_state_publication.py',
            'tests/storage/test_durable_state_read.py',
            'tests/storage/test_durable_state_windows_read.py',
            'tests/audio/test_music.py',
