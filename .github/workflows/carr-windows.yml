          destination.write_text(json.dumps(bom, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(dict(status='PASS', components=len(components),
              vendored_components=len(bom['components']) - len(components), added=sorted(new_names),
              sbom_sha256=sha256(destination.read_bytes()).hexdigest(), lock_sha256=sha256(lock.read_bytes()).hexdigest())))
          '@
          $composeFullSbom | & $env:CARR_PYTHON -I -B - $fullLock $wheelhouse $fullSbom | Tee-Object 'ci-results/full-client-sbom.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
