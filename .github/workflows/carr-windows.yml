          assert set(report['module_origins'])==set(oracle['module_origins'])
          for name,record in report['module_origins'].items():
              path=pathlib.Path(record['path']).resolve()
              assert path.is_relative_to(pathlib.Path(sys.prefix).resolve()), str(path)
              source=pathlib.Path('src')/pathlib.Path(*name.split('.')).with_suffix('.py')
              assert record['sha256']==sha256(path.read_bytes()).hexdigest()==sha256(source.read_bytes()).hexdigest(), name
          report['source_commit']=pathlib.Path('ci-results/tested-commit.txt').read_text(encoding='utf-8-sig').strip()
