          import ctypes, importlib, json, os, pathlib, shutil, sys
          from ctypes import wintypes
          from tempfile import TemporaryDirectory
          import carr_library
          from carr_library.native_runtime import activate_bundled_runtime
          root = pathlib.Path(sys.argv[1]).resolve()
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(root / '.venv')
          os.environ['PATH'] = str(root / 'ocr') + os.pathsep + os.environ['PATH']
          assert pathlib.Path(shutil.which('node')).samefile(root / 'citation-runtime' / 'node.exe')
          assert pathlib.Path(shutil.which('tesseract')).samefile(root / 'ocr' / 'tesseract.exe')
          assert all(shutil.which(tool) is None for tool in ('ffmpeg', 'ffprobe', 'ffplay'))
          runtime_handle = activate_bundled_runtime(bundle_root=root)
          assert runtime_handle is not None
          from carr_library.audio import AudioRuntime, AudioUnavailable
          with TemporaryDirectory(prefix='carr-transfer-no-audio-') as temporary:
              try:
                  AudioRuntime(pathlib.Path(temporary))
              except AudioUnavailable as exc:
                  assert 'ffmpeg' in str(exc).lower()
                  unavailable = str(exc)
              else:
                  raise AssertionError('An external audio runtime masked the transfer profile.')
          print(json.dumps(dict(profile='library-reader-sapi', ffmpeg='UNAVAILABLE_EXPECTED', reason=unavailable)), flush=True)
          import pytest
          status = pytest.main(sys.argv[2:])
          if status:
              raise SystemExit(status)
          origins = {}
          for name, module in tuple(sys.modules.items()):
              if name == 'carr_library' or name.startswith('carr_library.'):
                  filename = getattr(module, '__file__', None)
                  if filename is not None:
                      path = pathlib.Path(filename).resolve()
                      assert path.is_relative_to(root / '.venv'), name + ' loaded outside the installed transfer profile'
                      origins[name] = path.relative_to(root).as_posix()
          assert {'carr_library.application', 'carr_library.semantic', 'carr_library.reader.ebook', 'carr_library.research.academic_library', 'carr_library.academic_integration.formatting', 'carr_library.speech.runtime'} <= origins.keys()
          assert all(shutil.which(tool) is None for tool in ('ffmpeg', 'ffprobe', 'ffplay'))
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel.GetModuleHandleW.argtypes = [wintypes.LPCWSTR]
          kernel.GetModuleHandleW.restype = wintypes.HMODULE
          kernel.GetModuleFileNameW.argtypes = [wintypes.HMODULE, wintypes.LPWSTR, wintypes.DWORD]
