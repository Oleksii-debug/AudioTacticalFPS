          $candidateRetainerPath = Join-Path (Get-Location) 'scripts/retain_owner_candidate_inputs.py'
          $candidateRetainerInfo = Get-Item -LiteralPath $candidateRetainerPath -ErrorAction Stop
          if (-not ($candidateRetainerInfo -is [System.IO.FileInfo]) -or ($candidateRetainerInfo.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) { throw 'The committed retain_owner_candidate_inputs.py helper must be a regular file.' }
          $candidateRetainerBlob = (git rev-parse 'HEAD:carr-library/scripts/retain_owner_candidate_inputs.py').Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateRetainerBlob -cnotmatch '^[a-f0-9]{40}$') { throw 'The committed retain_owner_candidate_inputs.py identity is unavailable.' }
          $candidateRetainerActual = (git hash-object --no-filters -- $candidateRetainerPath).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateRetainerActual -cne $candidateRetainerBlob) { throw 'The retain_owner_candidate_inputs.py helper differs from the exact checked-out source.' }
          $candidateRetainerHash = (Get-FileHash -LiteralPath $candidateRetainerPath -Algorithm SHA256).Hash
          $compiledLauncher = Join-Path $env:RUNNER_TEMP 'carr-launcher-private'
          & $python -I -B -X utf8 $candidateRetainerPath $bundle $compiledLauncher $candidateOutput $candidateEvidence $sourceCommit $sourceTree $candidateManifestHash $env:CARR_COMPLETE_BUNDLE_OUTCOME
          $candidateRetainerExit = $LASTEXITCODE
          if ((Get-FileHash -LiteralPath $candidateRetainerPath -Algorithm SHA256).Hash -cne $candidateRetainerHash) { throw 'The committed retain_owner_candidate_inputs.py helper changed during execution.' }
          if ($candidateRetainerExit -ne 0) { throw 'Owner-candidate inputs lack exact source, no-audio acceptance or closed payload evidence.' }
          Write-Host ('Verified committed helper retain_owner_candidate_inputs.py: git=' + $candidateRetainerBlob + ', sha256=' + $candidateRetainerHash)
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Retain only separately qualified owner-candidate public inputs
        if: ${{ !cancelled() && steps.owner_candidate_inputs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-candidate-inputs-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/carr-owner-candidate-inputs/
          if-no-files-found: error
          retention-days: 7

      - name: Assemble unqualified owner archives and retain only public receipts
        id: owner_candidate_archives
        if: ${{ !cancelled() && steps.owner_candidate_inputs.outcome == 'success' && steps.complete_bundle.outcome == 'failure' }}
        timeout-minutes: 20
        env:
          CARR_CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CARR_COMPLETE_BUNDLE_OUTCOME: ${{ steps.complete_bundle.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sourceCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cne $env:CARR_CANDIDATE_SOURCE_SHA) { throw 'Owner archive assembly source differs from the event head.' }
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Owner archive assembly source tree is unavailable.' }
          $bundle = $env:CARR_CI_TRANSFER_BUNDLE
          $inputs = Join-Path $env:RUNNER_TEMP 'carr-owner-candidate-inputs'
          $archives = Join-Path $env:RUNNER_TEMP 'carr-owner-candidate-archives'
          $evidence = Join-Path (Get-Location) 'ci-results/owner-candidate-assembly'
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          $helper = Join-Path (Get-Location) 'scripts/assemble_owner_candidate_archives.py'
          $helperHashes = @{}
          foreach ($relative in @('scripts/assemble_owner_candidate_archives.py', 'scripts/retain_owner_candidate_inputs.py', 'packaging/create_delivery.py', 'packaging/install_windows.py')) {
            $path = Join-Path (Get-Location) $relative
            $info = Get-Item -LiteralPath $path -ErrorAction Stop
            if (-not ($info -is [System.IO.FileInfo]) -or ($info.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) { throw 'Owner archive helpers must be ordinary committed files.' }
            $expected = (& git rev-parse ('HEAD:carr-library/' + $relative)).Trim()
            if ($LASTEXITCODE -ne 0 -or $expected -cnotmatch '^[a-f0-9]{40}$') { throw 'Owner archive helper identity is unavailable.' }
            $actual = (& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw 'An owner archive helper differs from its exact committed source.' }
            $helperHashes[$relative] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          $programs = @($python, (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'runtime/python.exe'), (Join-Path $bundle 'runtime/pythonw.exe')) | ForEach-Object { [IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          foreach ($program in $programs) {
            $info = Get-Item -LiteralPath $program -ErrorAction Stop
            if (-not ($info -is [System.IO.FileInfo]) -or ($info.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) { throw 'Owner archive interpreter is not an ordinary installed file.' }
          }
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          if ($profilesBefore.Count -ne 3) { throw 'All firewall profile states must be captured before archive assembly.' }
          $ruleNames = [System.Collections.Generic.List[string]]::new()
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
            if ($profiles.Count -ne 3 -or @($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Owner archive assembly requires active firewall profiles.' }
            foreach ($program in $programs) {
              $name = 'CARR-owner-archive-' + [guid]::NewGuid().ToString('N')
              $ruleNames.Add($name)
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
              $rule = Get-NetFirewallRule -PolicyStore ActiveStore -Name $name -ErrorAction Stop
              $filter = @($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop)
              if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or $filter.Count -ne 1 -or [IO.Path]::GetFullPath($filter[0].Program) -ne [IO.Path]::GetFullPath($program)) { throw 'Owner archive outbound rule is inactive or bound to another program.' }
            }
            @{ status='ACTIVE'; programs=$programs; profiles=$profiles; archive_upload=$false; scope='Existing no-audio owner archive assembly only' } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-results/owner-candidate-assembly-firewall.json'
            & $python -I -B -X utf8 $helper --bundle $bundle --inputs $inputs --output $archives --evidence $evidence --source-commit $sourceCommit --source-tree $sourceTree --full-outcome $env:CARR_COMPLETE_BUNDLE_OUTCOME 2>&1 | Tee-Object 'ci-results/owner-candidate-assembly.txt'
            $assemblyExit = $LASTEXITCODE
            foreach ($relative in $helperHashes.Keys) {
              if ((Get-FileHash -LiteralPath (Join-Path (Get-Location) $relative) -Algorithm SHA256).Hash -cne $helperHashes[$relative]) { throw 'An owner archive helper changed during assembly.' }
            }
            if ($assemblyExit -ne 0) { throw 'Owner archive assembly or independent source/seal verification failed.' }
            $reports = @(Get-ChildItem -LiteralPath $evidence -File -Force -ErrorAction Stop)
            if ($reports.Count -ne 2 -or @($reports | Where-Object { $_.Name -notin @('delivery-verification.json','owner-candidate-assembly.json') -or $_.Length -gt 1MB -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }).Count -ne 0) { throw 'Only two bounded public JSON receipts may be retained.' }
            if (@(Get-ChildItem -LiteralPath $evidence -Directory -Force -ErrorAction Stop).Count -ne 0) { throw 'Owner archive evidence may not include a binary payload directory.' }
            Write-Host 'OWNER_CANDIDATE_UNQUALIFIED: both archives verified in ephemeral runner temp; complete binary archives are not uploaded.'
          } finally {
            $cleanupFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $ruleNames) {
              try { Remove-NetFirewallRule -Name $name -ErrorAction Stop } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            foreach ($profile in $profilesBefore) {
              try {
                Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop
                $restored = Get-NetFirewallProfile -Name $profile.Name -ErrorAction Stop
                if ($restored.Enabled -ne $profile.Enabled) { throw 'Owner archive firewall profile restoration differs.' }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            @{ status=$(if ($cleanupFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); original_profiles=$profilesBefore; removed_rules=$ruleNames.ToArray(); errors=$cleanupFailures.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-results/owner-candidate-assembly-cleanup.json'
            if ($cleanupFailures.Count -ne 0) { throw ('Owner archive firewall cleanup failed: ' + ($cleanupFailures -join '; ')) }
          }

      - name: Build pinned standard setup and execute actual install, repair and uninstall
        if: ${{ !cancelled() && steps.complete_bundle.conclusion == 'success' }}
        timeout-minutes: 20
        shell: pwsh
        working-directory: carr-library
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = $env:CARR_CI_BUNDLE
          if (-not $bundle -or -not (Test-Path (Join-Path $bundle 'bundle-manifest.json') -PathType Leaf)) { throw 'The previously verified full bundle is required.' }
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          if (-not (Test-Path $python -PathType Leaf)) { throw 'The verified bundle must already be installed.' }
          $identity = [Guid]::NewGuid().ToString('N')
          $compilerRoot = $env:CARR_CI_INNO_ROOT
          if (-not $compilerRoot -or -not (Test-Path (Join-Path $compilerRoot 'toolchain-receipt.json') -PathType Leaf)) { throw 'The previously verified pinned Inno toolchain is required.' }
          $buildRoot = Join-Path $env:RUNNER_TEMP ('carr-standard-setup-' + $identity)
          $workRoot = Join-Path $env:RUNNER_TEMP ('carr-standard-lifecycle-' + $identity)
          $report = Join-Path (Resolve-Path 'ci-results').Path 'standard-installer'
          $manifest = (Get-FileHash -LiteralPath (Join-Path $bundle 'bundle-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          & $python -I -B -X utf8 packaging/windows_installer/build_setup.py --bundle $bundle --bundle-manifest-sha256 $manifest --installed-bundle --output $buildRoot --iscc (Join-Path $compilerRoot 'tools/ISCC.exe') --toolchain-receipt (Join-Path $compilerRoot 'toolchain-receipt.json') 2>&1 | Tee-Object 'ci-results/standard-installer-build.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Dependency and compiler acquisition is complete; block the selected
          # fixture's real setup, installed runtime and maintenance programs.
          # This does not claim a whole-machine native network trace.
          $installedRoot = Join-Path $workRoot 'Resonance installed Ω'
          $programs = @($python, (Join-Path $bundle 'runtime/python.exe'),
            (Join-Path $buildRoot 'compiled/ResonanceSetup.exe'),
            (Join-Path $installedRoot 'app/runtime/python.exe'),
            (Join-Path $installedRoot 'app/runtime/pythonw.exe'),
            (Join-Path $installedRoot 'app/.venv/Scripts/python.exe'),
            (Join-Path $installedRoot 'app/.venv/Scripts/pythonw.exe'),
            (Join-Path $installedRoot 'app/ResearchLibrary.exe'),
            (Join-Path $installedRoot 'unins000.exe'),
            (Join-Path $installedRoot 'maintenance/ResonanceSetup.exe'),
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $rulePrefix = 'CARR-standard-native-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Standard native acceptance requires active firewall profiles.' }
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Standard native outbound rules are incomplete.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Standard native rules do not cover every selected runtime.' }
            @{ status='PASS'; blocked_programs=$filters; scope='selected setup/runtime/maintenance paths; no whole-machine trace claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/standard-installer-firewall.json'
          & $python -I -B -X utf8 scripts/windows_standard_installer_smoke.py --setup (Join-Path $buildRoot 'compiled/ResonanceSetup.exe') --build-evidence (Join-Path $buildRoot 'setup-build.json') --work $workRoot --report $report 2>&1 | Tee-Object 'ci-results/standard-installer-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content (Join-Path $report 'result.json') -Raw | ConvertFrom-Json
          $build = Get-Content (Join-Path $buildRoot 'setup-build.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or -not $result.actual_inno_install -or -not $result.actual_repair -or -not $result.actual_uninstall -or -not $result.live_job_preserved -or -not $result.populated_library_bytes_preserved -or -not $result.fresh_shortcut_collision_refused -or -not $result.uninstaller_wrapper_removed) { throw 'The complete native standard installation lifecycle did not pass.' }
          if ($result.bundle_manifest_sha256 -ne $manifest -or $result.setup_sha256 -ne $build.setup_sha256 -or $result.source_commit -ne $build.source_commit) { throw 'Native lifecycle evidence is not bound to this exact setup and source.' }
          if ($result.authenticode_verified -or $result.nvda_verified -or $result.native_network_trace -ne 'NOT_RUN' -or $result.unprivileged_account_qualification -ne 'NOT_RUN') { throw 'This gate cannot claim unrelated release qualifications.' }
          Copy-Item (Join-Path $buildRoot 'setup-build.json') (Join-Path $report 'setup-build.json')
          Copy-Item (Join-Path $compilerRoot 'toolchain-receipt.json') (Join-Path $report 'toolchain-receipt.json')
      
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Publish public phase diagnostics before extended source acceptance
