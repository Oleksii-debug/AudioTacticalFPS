name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library, carr/v3-integrated-studio-20261126]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
      - .github/workflows/carr-flite.yml
      - .github/workflows/carr-sync.yml
      - .github/workflows/carr-trusted-client.yml
      - .github/workflows/carr-managed-update.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/academic-research-workbench, carr/academic-search-20261126, carr/notebook-release-ascii-e021-20261126, carr/v3-primary103-recovered-composition-20261126, carr/unified-publication-24-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
      - .github/workflows/carr-flite.yml
      - .github/workflows/carr-sync.yml
      - .github/workflows/carr-trusted-client.yml
      - .github/workflows/carr-managed-update.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-syntax:
    name: Exact source / Python 3.11 syntax and package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Compile exact source without importing modules or writing bytecode
        working-directory: carr-library
        shell: bash
        run: |
          python -I -B - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import subprocess
          import tomllib
          roots = ('src', 'scripts', 'packaging', 'bootstrap')
          paths = {path for root in roots for path in Path(root).rglob('*.py')}
          paths.update(Path('tests').rglob('test_*.py'))
          assert paths
          inventory = []
          for path in sorted(paths):
              raw = path.read_bytes()
              compile(raw, str(path), 'exec', dont_inherit=True)
              inventory.append((path.as_posix(), sha256(raw).hexdigest()))
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          packages = project['tool']['setuptools']['packages']
          assert len(packages) == len(set(packages)), 'Duplicate explicit package'
          package_dirs = project['tool']['setuptools']['package-dir']
          for name in packages:
              prefixes = [key for key in package_dirs if not key or name == key or name.startswith(key + '.')]
              assert prefixes, name
              prefix = max(prefixes, key=len)
              suffix = name[len(prefix):].lstrip('.')
              location = Path(package_dirs[prefix]).joinpath(*suffix.split('.')) if suffix else Path(package_dirs[prefix])
              assert location.is_dir(), name
          print(json.dumps(dict(status='PASS', source_commit=subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip(), python_files=len(paths),
              inventory_sha256=sha256(json.dumps(inventory, separators=(',', ':')).encode()).hexdigest(),
              explicit_packages=len(packages), scope='Compilation and TOML only; no runtime qualification'),
              sort_keys=True))
          PY

  # Mandatory Linux capability coverage complements the selected Windows build.
  flite-runtime:
    name: Required Linux Flite speech
    uses: ./.github/workflows/carr-flite.yml

  # The same-head Windows and Linux transfer gates are required for this workflow.
  portable-sync:
    name: Required portable encrypted backup
    uses: ./.github/workflows/carr-sync.yml

  # Both platforms must qualify the signed client and actual installed origins.
  trusted-client:
    name: Required signed client and maintenance boundaries
    uses: ./.github/workflows/carr-trusted-client.yml

  # Immutable A to exact-event B: real install, lease refusal, rollback and repair.
  managed-update:
    name: Required native managed update
    uses: ./.github/workflows/carr-managed-update.yml

  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    # Run 45971365426 needed about55 minutes before the new transfer/standard
    # lifecycle and additional strict suites. Only orchestration headroom changes.
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: desktop_runtime
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/trusted-client.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bibliography import and publication boundaries
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/research/test_bibtex_import.py tests/catalog/test_ris_apply.py tests/reader/test_export_no_clobber.py tests/storage/test_durable_state_publication.py tests/ui/test_export_destination.py tests/ingest/test_initial_publication_completion.py tests/ui/test_profile_project_exports.py tests/ui/test_academic_actions.py tests/packaging/test_ci_check.py tests/speech/test_python_helper.py 2>&1 | Tee-Object 'ci-results/bibliography-publication.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed BibTeX import and real overwrite confirmation
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_bibliography_interchange_smoke.py 2>&1 | Tee-Object 'ci-results/native-bibliography-interchange.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR catalogue and model manager
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed citation styles and measured progress keyboard controls
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_citation_styles_smoke.py 2>&1 | Tee-Object 'ci-results/native-citation-styles.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B tests/ui/native_progress_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed measured progress and real busy-time keys
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_progress_smoke.py 2>&1 | Tee-Object 'ci-results/native-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed assistant controls before complete bundle assembly
        timeout-minutes: 4
        run: |
          $nativeAssistant = @'
          import hashlib, importlib.util, json, pathlib, subprocess, sys, tempfile
          import carr_library, wx
          assert sys.platform == 'win32'
          installed = pathlib.Path(carr_library.__file__).resolve().parent
          assert installed.is_relative_to(pathlib.Path(sys.prefix).resolve())
          spec = importlib.util.spec_from_file_location('native_assistant_probe', 'scripts/windows_assistant_smoke.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          source = pathlib.Path('src/carr_library').resolve()
          hashes = {}
          for name in probe.SOURCE_FILES:
              raw = (source / name).read_bytes()
              assert (installed / name).read_bytes() == raw, name
              hashes[name] = hashlib.sha256(raw).hexdigest()
          application = wx.App(False)
          with tempfile.TemporaryDirectory(prefix='carr-assistant-early-') as temporary:
              result = probe.exercise_controls(pathlib.Path(temporary), wx)
          result.update(status='PASS', source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        source_hashes=hashes, installed_modules='PASS', manual_nvda='NOT_RUN', paid_api='NOT_RUN')
          pathlib.Path('ci-results/native-assistant-early.json').write_text(
              json.dumps(result, ensure_ascii=False, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, allow_nan=False), flush=True)
          '@
          $nativeAssistant | & $env:CARR_PYTHON -I -B - 2>&1 | Tee-Object 'ci-results/native-assistant-early.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        id: desktop_dependencies
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==51 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        id: ocr_runtime
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise actual managed OCR with Unicode Windows paths
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_managed_ocr.py tests/e2e/test_managed_ocr_import.py tests/ui/test_ocr_selection.py 2>&1 | Tee-Object 'ci-results/managed-ocr-unicode.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }

      - name: Exercise trusted local provider transport fixtures
        timeout-minutes: 5
        run: |
          # These synthetic suites use real loopback HTTP servers. The generic
          # offline suite runner denies all sockets, including loopback.
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          & $env:CARR_PYTHON -m pytest -o addopts= -o xfail_strict=true --junitxml=ci-results/local-transport.xml tests/assistant/test_providers.py 2>&1 | Tee-Object 'ci-results/local-transport.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-results/local-transport.xml').iter('testcase')); assert cases and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped')); print(json.dumps(dict(status='PASS',passed=len(cases),failed=0,skipped=0,transport='synthetic local loopback fixtures')))" | Tee-Object 'ci-results/local-transport.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native Import Center and durable batch workflow
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_import_center_smoke.py 2>&1 | Tee-Object 'ci-results/native-import-center.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed document formats and native accessible reading
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_document_formats_smoke.py 2>&1 | Tee-Object 'ci-results/native-document-formats.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native wx startup and source-opening events
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/native-desktop.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native saved-evidence page selection and note recovery
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_evidence_pages_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reference metadata review and historical outline export
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-workflows.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic comparison, bibliography and catalog review
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_academic_comparison_smoke.py --require-windows 2>&1 | Tee-Object 'ci-results/native-academic.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reviewed library workflows and checkpoint recovery
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B -X utf8 tests/ui/native_library_workflow_smoke.py 2>&1 | Tee-Object 'ci-results/native-library-workflow.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-notebook search and keyboard actions
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_notebook_search_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-notebook-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB section navigation and image descriptions
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_ebook_reader_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-ebook-reader.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native library reports and academic exports
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_catalog_tools_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-catalog-tools.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB contents and exact chapter search
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_ebook_native.py 2>&1 | Tee-Object 'ci-results/native-ebook-contents.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native full-source reader and page bookmarks
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_reading_desk_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-reading-desk.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkReader = @'
          import json, pathlib
          text = pathlib.Path('ci-results/native-reading-desk.txt').read_text(encoding='utf-8-sig')
          reports = []
          for line in text.splitlines():
              try:
                  value = json.loads(line)
              except (ValueError, TypeError):
                  continue
              if isinstance(value, dict) and 'voice_reader' in value:
                  reports.append(value)
          assert len(reports) == 1, 'The actual native reader report is missing or ambiguous.'
          report = reports[0]
          assert report['status'] == 'PASS' and report['platform'] == 'Windows'
          assert report['source_override'] is None and report['nvda'] == 'NOT_RUN'
          expected = {"controls":"native wx","keyboard":"native UIActionSimulator F6/F8/Ctrl+F","navigation":"native word and sentence selections without automatic speech","find_replace":"native preview, selected replacement, durable recovery and one Undo","clipboard":"one explicit native read","voice_provider":"synthetic PCM fixture","playback":"synthetic sink; no device opened","file_pickers":"controlled answers; NOT_RUN","unsaved_close_confirmation":"controlled answer; NOT_RUN","sapi":"NOT_RUN in this synthetic control probe","acoustics":"NOT_RUN","nvda":"NOT_RUN"}
          assert report['voice_reader'] == expected, report['voice_reader']
          phases = ["logical-line action uses exact native caret text","paragraph action uses the blank-line boundary","explicit clipboard speech does not replace or bind the reading copy","native dictionary export uses the existing validated format","dictionary completion has a readable focused native status","dictionary application is one undoable source-bound edit","native Stop cancels the actual worker without starting late playback","all native reader usability phases completed","closing the native reader releases its owned synthetic voice","all voice-reader actions preserve the retained source bytes"]
          phases += ["word and sentence navigation select text without starting speech","native Find modifier is delivered","native Find modifier is released","native Find preview leaves the source and reading copy unchanged","reviewed Find result selects the exact native word after Unicode text","native Find replacement persists one source-preserving recovery revision","one native Find replacement is undoable in the actual recovered copy","native Find Undo retains immutable original bytes","shared keyboard command renders the current reading copy"]
          assert all('PASS: ' + phase in text.splitlines() for phase in phases), phases
          origins = report['origins']
          required = {'carr_library.speech.reading', 'carr_library.speech.navigation', 'carr_library.ui.speech_dialog', 'carr_library.ui.pronunciation_dialog', 'carr_library.ui.reading_shortcuts', 'carr_library.ui.find_replace_dialog'}
          assert required <= origins.keys() and all(not pathlib.Path(origins[name]).is_relative_to(pathlib.Path.cwd().resolve()) for name in required), origins
          evidence = dict(status='PASS', voice_reader=report['voice_reader'], required_phases=phases, origins=origins, nvda='NOT_RUN')
          pathlib.Path('ci-results/native-reader-usability.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print(json.dumps(evidence), flush=True)
          '@
          $checkReader | & $env:CARR_PYTHON -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual installed Tasks and resources controls
