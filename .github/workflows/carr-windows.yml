      - name: Build, install and exercise the complete bundle with runtime egress blocked
        if: ${{ !cancelled() && steps.local_model.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' && steps.epubcheck_runtime.conclusion == 'success' }}
        # Head96 installed recovery alone completed8416 cases in70m09s. The complete
        # bundle also owns real setup/repair, native controls and the expanded capacity
        # selection. Retain every existing process/suite deadline inside this aggregate.
        timeout-minutes: 160
        run: |
          & $env:CARR_PYTHON -I -B -c "from pathlib import Path; p=Path('packaging/probe_standard_update_windows.py'); compile(p.read_bytes(), str(p), 'exec')"
          if ($LASTEXITCODE -ne 0) { throw 'The exact standard-update probe must compile before bundle assembly.' }
          if (-not $env:CARR_NATIVE_LAUNCHER -or -not $env:CARR_NATIVE_LAUNCHER_SHA256) { throw 'The native launcher must pass its exact process acceptance before bundle assembly.' }
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $baseBundle = Join-Path $bundleWork 'base bundle'
          $bundle = Join-Path $bundleWork 'complete bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          # Compose the reviewed optional-client closure before the existing builder seals the bundle.
          $fullLock = Join-Path $bundleWork 'windows-full-ci.lock'
          $fullSbom = Join-Path $bundleWork 'windows-full-ci-sbom.cdx.json'
          $composeFullLock = @'
          import importlib.util, json, pathlib, sys
          from hashlib import sha256
          spec = importlib.util.spec_from_file_location('ci_full_bundle', pathlib.Path('packaging/build_windows_bundle.py'))
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          base_path = pathlib.Path('packaging/windows-semantic-cp311.lock')
          client_path = pathlib.Path('packaging/trusted-client.lock')
          review_path = pathlib.Path('packaging/trusted-client-dependencies.json')
          pins = builder.read_lock(base_path)
          client = builder.read_lock(client_path)
          review = json.loads(review_path.read_text(encoding='utf-8'))
          assert review['target'] == 'Windows x86-64 CPython 3.11'
          items = review['dependencies']
          assert len(items) == len(client) and {row['name'] for row in items} == set(client)
          for row in items:
              name, version, digest = row['name'], row['version'], row['sha256']
              assert client[name][0] == version and digest in client[name][1], name
              if name in pins:
                  assert pins[name][0] == version and digest in pins[name][1], name
              else:
                  pins[name] = (version, {digest})
          spell_path = pathlib.Path('packaging/spellcheck.lock')
          spell = builder.read_lock(spell_path)
          assert set(spell) == {'spylls'}
          assert 'spylls' not in pins
          pins.update(spell)
          assert pins['quickjs-ng'][0] == '0.18.0.2'
          assert len(pins) == 57, 'The complete pinned runtime must include QuickJS, trusted clients and code-only spelling.'
          out = pathlib.Path(sys.argv[1])
          out.write_text(''.join(name + '==' + version + ' ' + ' '.join('--hash=sha256:' + h for h in sorted(hashes)) + '\n'
                                 for name, (version, hashes) in sorted(pins.items())), encoding='utf-8')
          assert builder.read_lock(out) == pins
          print(json.dumps(dict(status='PASS', components=len(pins), lock_sha256=sha256(out.read_bytes()).hexdigest(),
