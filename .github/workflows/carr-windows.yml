          & $nativeInstalledPython -I -B -m pip install --no-index --find-links $testWheels pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runNativeLibraryTests = @'
          import ctypes, importlib, json, os, pathlib, sys
          from ctypes import wintypes
