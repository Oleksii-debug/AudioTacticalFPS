name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/academic-research-workbench, carr/academic-search-20261126, carr/notebook-release-ascii-e021-20261126, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

# Keep distinct source acceptance runs alive while development continues.
# Duplicate push/PR runs of the same source still coalesce.
concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    # Preserve all source, optional-component and installed/native acceptance gates.
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Compile the exact source and regression entrypoints
        run: |
          python -m compileall -q src tests scripts packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the actual desktop package in a fresh environment
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 setuptools==84.2.1 wheel==0.48.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the separate exact code-only spelling component
        timeout-minutes: 3
        run: |
          $spellingRoot = Join-Path $env:RUNNER_TEMP 'carr-reviewed-spelling'
          $spellingInputs = Join-Path $spellingRoot 'upstream'
          $spellingOptional = Join-Path $spellingRoot 'optional'
          New-Item -ItemType Directory -Force $spellingInputs, $spellingOptional | Out-Null
          $spellingUpstream = Join-Path $spellingInputs 'spylls-0.1.7-py2.py3-none-any.whl'
          & $env:CARR_PYTHON -I -B -c "import hashlib,pathlib,sys,urllib.request; r=urllib.request.urlopen('https://files.pythonhosted.org/packages/cd/19/ce6fcb4b86e188983bcfc1f84e4ac6f3038ca8d68b6d70a678cdc566f66c/spylls-0.1.7-py2.py3-none-any.whl',timeout=60); data=r.read(1509483); r.close(); assert len(data)==1509482 and hashlib.sha256(data).hexdigest()=='0c7fa4b66615f390bd12fd37939b85934c012309fd3cce8584844c54270b7776'; pathlib.Path(sys.argv[1]).write_bytes(data)" $spellingUpstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spellingWheel = Join-Path $spellingOptional 'spylls-0.1.7+carr.1-py2.py3-none-any.whl'
          & $env:CARR_PYTHON scripts/repack_spellcheck.py $spellingUpstream $spellingWheel 2>&1 | Tee-Object 'ci-results/spelling-component-repack.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip install --no-index --no-deps --require-hashes --find-links $spellingOptional -r packaging/spellcheck.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_SPELLCHECK_WHEEL=$spellingWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:CARR_PYTHON -I -B -c "import json; from carr_library.reader.spellcheck import _backend; b=_backend(lambda:False); print(json.dumps(dict(component=b['version'],verified_source_files=len(b['files']))))" | Tee-Object 'ci-results/installed-spelling-component.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require supplied-worker supervision, receipt, recovery and UI contracts
        timeout-minutes: 6
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 3 tests/test_transcription_receipt.py tests/test_transcription_service.py tests/storage/test_transcription_backup.py tests/storage/test_legacy_transcription_recovery.py tests/ui/test_transcription_dialog.py tests/ui/test_legacy_transcription_recovery.py tests/test_transcription_cli.py tests/test_transcription_exports.py 2>&1 | Tee-Object 'ci-results/transcription-contracts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require shared tasks, V5 publication, local profiles and scoped reading contracts
        timeout-minutes: 12
        run: |
          $suites = @(
            'tests/operations/test_resources.py',
            'tests/operations/test_portable_policy_location.py',
            'tests/packaging/test_native_launcher_bundle.py',
            'tests/packaging/test_standard_installer.py',
            'tests/audio/test_capture_ownership.py',
            'tests/audio/test_owned_audio_processes.py',
            'tests/ingest/test_worker_process_ownership.py',
            'tests/ui/test_recording_dialog.py',
            'tests/ui/test_operation_progress.py',
            'tests/ui/test_audio_publication.py',
            'tests/audio/test_clips.py',
            'tests/audio/test_effect_editing.py',
            'tests/ui/test_audio_effect_editing.py',
            'tests/ui/test_audio_clips.py',
            'tests/reader/test_live_speech.py',
            'tests/ui/test_live_reading.py',
            'tests/ui/test_media_overlay.py',
            'tests/reader/test_publication_state.py',
            'tests/reader/test_appearance.py',
            'tests/ui/test_reader_appearance.py',
            'tests/reader/test_pacing.py',
            'tests/reader/test_book_source.py',
            'tests/reader/test_speech_normalization.py',
            'tests/ui/test_speech_preparation.py',
            'tests/ui/test_speech_preparation_hooks.py',
            'tests/ui/test_paced_reading.py',
            'tests/ui/test_paced_reader_hooks.py',
            'tests/storage/test_incremental_backup.py',
            'tests/storage/test_incremental_backup_cli.py',
            'tests/ui/test_incremental_backup_dialog.py',
            'tests/sync/test_vault.py',
            'tests/sync/test_service_commit_boundaries.py',
            'tests/spelling/test_component.py',
            'tests/spelling/test_spellcheck.py',
            'tests/spelling/test_session.py',
            'tests/spelling/test_handlers.py',
            'tests/spelling/test_reader_hook.py',
            'tests/storage/test_live_reading_backup.py',
            'tests/storage/test_optional_backup_roots.py',
            'tests/ui/test_audio_native_probe_policy.py',
            'tests/audio/test_publication_fsync.py',
            'tests/audio/test_canonical_project_import.py',
            'tests/ui/test_legacy_studio_import.py',
            'tests/conversion/test_selected_adapters.py',
            'tests/conversion/test_office_selection.py',
            'tests/storage/test_legacy_ui_preferences.py',
            'tests/audio/test_model_inventory.py',
            'tests/audio/test_model_snapshot.py',
            'tests/storage/test_legacy_state_portability.py',
            'tests/storage/test_canonical_common_backup.py',
            'tests/operations/test_state.py',
            'tests/operations/test_transcription_admission.py',
            'tests/operations/test_heavy_admission.py',
            'tests/operations/test_facade.py',
            'tests/operations/test_policy.py',
            'tests/ui/test_operations_dialog.py',
            'tests/e2e/test_operations_cli.py',
            'tests/storage/test_publication_migration.py',
            'tests/ingest/test_canonical_publication_binding.py',
            'tests/ingest/test_publication_config_compatibility.py',
            'tests/e2e/test_import_worker_publication.py',
            'tests/ingest/test_worker_publication_boundary.py',
            'tests/audio/test_engine_profiles.py',
            'tests/audio/test_job_integrity.py',
            'tests/storage/test_state_json_reader.py',
            'tests/ui/test_engine_settings.py',
            'tests/reader/test_scoped_pronunciation.py',
            'tests/ui/test_pronunciation_preview.py',
            'tests/reader/test_legacy_reading_import.py',
            'tests/storage/test_legacy_reading_backup.py',
            'tests/ui/test_reading_import.py',
            'tests/e2e/test_google_translation_v3.py',
            'tests/assistant/test_translation_advanced.py',
            'tests/assistant/test_translation_structure.py',
            'tests/ui/test_translation_structure.py',
            'tests/test_translation_cli.py',
            'tests/storage/test_translation_structure_backup.py',
            'tests/test_open_existing_library.py',
            'tests/assistant/test_workflow_templates.py',
            'tests/assistant/test_workflow_template_handlers.py',
            'tests/assistant/test_transcription_tool.py',
            'tests/audio/test_book_cli.py',
            'tests/audio/test_managed_playback_queue.py',
            'tests/storage/test_legacy_playlist_backup.py',
            'tests/audio/test_legacy_playlist.py',
            'tests/ui/test_legacy_playlist_controls.py',
            'tests/storage/test_legacy_playlist_acceptance.py',
            'tests/ui/test_managed_playback_queue.py',
            'tests/ui/test_measured_book_dialog.py',
            'tests/ingest/test_large_source_profiles.py',
            'tests/storage/test_large_source_backup.py',
            'tests/e2e/test_large_import_cli.py',
            'tests/e2e/test_large_source_fixture.py',
            'tests/ui/test_large_source_import.py',
            'tests/ui/test_backup_capacity.py',
            'tests/audio/test_book_plans.py',
            'tests/storage/test_book_audio_backup.py',
            'tests/ui/test_book_batch_dialog.py',
            'tests/conversion/test_calibre_selection.py',
            'tests/conversion/test_calibre_process_ownership.py',
            'tests/assistant/test_typed_local_tools.py',
            'tests/assistant/test_scheduling.py',
            'tests/assistant/test_scheduling_cli.py',
            'tests/assistant/test_scheduling_handlers.py',
            'tests/storage/test_scoped_locator_capacity.py',
            'tests/packaging/test_library_corpus_benchmark.py',
            'tests/ui/test_translation_advanced.py',
            'tests/assistant/test_local_llm.py',
            'tests/assistant/test_execution_deadline.py',
            'tests/assistant/test_planning_handlers.py',
            'tests/assistant/test_planning_runtime.py',
            'tests/assistant/test_canonical_backup.py',
            'tests/ui/test_desktop_handlers.py'
          )
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 3 @suites 2>&1 | Tee-Object 'ci-results/v3-shared-contracts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require the actual local HTTP planning fixture within numeric loopback
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py --allow-loopback tests/loopback/test_local_planning.py tests/loopback/test_translation_local_adapter.py 2>&1 | Tee-Object 'ci-results/local-planning-loopback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native spelling review and reversible narration edits
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_spellcheck_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-spelling-review.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native reader appearance, paced reading and incremental backup
        timeout-minutes: 6
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_reader_appearance_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-reader-appearance.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_speech_preparation_smoke.py --native --output ci-results/native-speech-preparation.json 2>&1 | Tee-Object 'ci-results/native-speech-preparation.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_incremental_backup_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-incremental-backup.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native bounded search continuation over actual retained sources
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_search_pages_native.py 2>&1 | Tee-Object 'ci-results/native-search-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native streamed-text profile, real worker and original-bound completion
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_streamed_import_native.py 2>&1 | Tee-Object 'ci-results/native-streamed-import.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain explicit core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==53 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require Windows OCR script models and reviewed publication boundaries early
        timeout-minutes: 4
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          $previousTessdata = $env:TESSDATA_PREFIX
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_ocr_languages.py tests/extract/test_ocr_runtime.py tests/e2e/test_pdf_review_cancellation.py tests/packaging/test_delivery_archive.py 2>&1 | Tee-Object 'ci-results/windows-regression-boundaries.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
            $env:TESSDATA_PREFIX = $previousTessdata
          }

      - name: Prepare the sealed local FFmpeg runtime before audio regressions
        timeout-minutes: 8
        run: |
          $audioRoot = Join-Path $env:RUNNER_TEMP 'carr-pinned-audio'
          New-Item -ItemType Directory -Force $audioRoot | Out-Null
          $pin = & $env:CARR_PYTHON -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $audioRoot 'ffmpeg-pinned.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned FFmpeg archive mismatch.' }
          $audioBin = Join-Path $audioRoot 'audio-runtime'
          & $env:CARR_PYTHON packaging/prepare_ffmpeg_runtime.py --archive $archive --destination $audioBin --verify-native | Tee-Object 'ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_FFMPEG=$(Join-Path $audioBin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require actual capture, clip rendering and synchronized publication recovery
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 3 tests/audio/test_recording.py tests/storage/test_recording_backup.py tests/audio/test_publication.py tests/audio/test_clip_render.py tests/audio/test_master_effects.py tests/reader/test_media_overlay.py tests/audio/test_media_conversion.py tests/storage/test_media_conversion_backup.py tests/ui/test_media_conversion.py tests/audio/test_clip_input_ownership.py tests/audio/test_clip_consolidation.py tests/audio/test_playback_processing.py tests/audio/test_playback_configuration.py tests/ui/test_playback_controls.py tests/reader/test_live_playback_controls.py tests/reader/test_recorded_playback_controls.py tests/ui/test_reader_playback_controls.py tests/audio/test_recording_controls.py tests/audio/test_recording_monitor.py tests/audio/test_playback_devices.py tests/audio/test_book_batch.py tests/audio/test_measured_book_audio.py tests/audio/test_publication_cleanup.py tests/audio/test_book_duration_cli.py 2>&1 | Tee-Object 'ci-results/actual-capture-publication.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native capture, clip and audiobook controls
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_recording_smoke.py --ffmpeg $env:CARR_FFMPEG 2>&1 | Tee-Object 'ci-results/native-recording.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_book_batch_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-book-batch.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_clip_editor_smoke.py 2>&1 | Tee-Object 'ci-results/native-clip-editor.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_live_reading_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-live-reading.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_media_overlay_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-recorded-reading.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
