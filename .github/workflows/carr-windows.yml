).rsplit('.',1)[-1]=='test_ocr_runtime']; assert len(ocr_cases)==len(ocr_required) and set(ocr_cases)==ocr_required; state_inventory_required={'test_state_inventory_rejects_unreadable_subtree[snapshot]', 'test_state_inventory_rejects_unreadable_subtree[restore]', 'test_state_restore_rejects_unlisted_file_before_scanning_later_subtree', 'test_state_root_lookup_error_is_not_absence[PermissionError]', 'test_state_root_lookup_error_is_not_absence[NotADirectoryError]', 'test_state_root_missing_is_optional_only_when_requested'}; state_inventory_cases=[c.get('name') for c in cases if c.get('classname','').rsplit('.',1)[-1]=='test_state_backup_portability']; assert len(state_inventory_cases)==len(state_inventory_required) and set(state_inventory_cases)==state_inventory_required; assert required<={c.get('name') for c in cases} and failed==skipped==0; print(json.dumps(dict(status='PASS',passed=passed,failed=failed,skipped=skipped,semantic_inference='PASS',scanned_source_workflow='PASS',import_batch_review='PASS',academic_workflow='PASS',notebook_research='PASS',large_source_presentation='PASS',academic_documents='PASS',ocr_inventory_exact='PASS',ocr_inventory_cases=sorted(ocr_cases),state_inventory_exact='PASS',state_inventory_cases=sorted(state_inventory_cases),nvda='NOT_RUN')))" | Tee-Object 'ci-results/full-bundle-workflows.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bundle 'runtime/python.exe') -I -B -c "import importlib.util,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('bundle_verifier',root/'install_windows.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); module.verify(root); print('PASS: sealed bundle unchanged after native inference and OCR workflows')" $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Retain only the public application source wheel that was actually
          # installed and verified. Private runtimes/models are never uploaded.
          $wheelKey = 'wheelhouse/' + $wheels[0].Name
          $sealedWheel = Join-Path $bundle $wheelKey
          $verifyWheel = @'
          import importlib.util, json, pathlib, subprocess, sys
          project = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('source_wheel', project / 'packaging/source_wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          proof = module.verify_application_wheel(sys.argv[1], project.parent, sys.argv[2])
          tree = subprocess.run(['git', 'rev-parse', sys.argv[2] + '^{tree}'], cwd=project.parent,
                                check=True, capture_output=True, text=True).stdout.strip()
          assert proof['source_tree'] == tree, 'Wheel proof tree differs from the checkout commit.'
          print(json.dumps(dict(status='PASS', **proof)))
          '@
          $verifyWheel | & $env:CARR_PYTHON -I -B - $sealedWheel $sourceCommit | Tee-Object 'ci-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelProof = Get-Content -LiteralPath 'ci-results/source-wheel-proof.json' -Raw | ConvertFrom-Json
          $bundleSeal = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $sealedWheelHash = $bundleSeal.files.PSObject.Properties[$wheelKey].Value
          if (!$sealedWheelHash -or $wheelProof.wheel_sha256 -ne $sealedWheelHash) { throw 'Verified source wheel differs from the installed bundle seal.' }
          $testedWheelDirectory = Join-Path 'ci-results' 'tested-application-wheel'
          New-Item -ItemType Directory -Force $testedWheelDirectory | Out-Null
          $testedWheel = Join-Path $testedWheelDirectory $wheels[0].Name
          Copy-Item -LiteralPath $sealedWheel -Destination $testedWheel
          if ((Get-FileHash -LiteralPath $testedWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $wheelProof.wheel_sha256) {
            Remove-Item -LiteralPath $testedWheel -Force
            throw 'Tested application wheel copy differs.'
          }
          @{ status='PASS'; source_commit=$sourceCommit; source_tree=$wheelProof.source_tree; wheel=$wheels[0].Name; sha256=$wheelProof.wheel_sha256; installed_bundle='PASS' } | ConvertTo-Json | Set-Content 'ci-results/tested-application-wheel.json'
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Require the retained bundle local proposal through actual loopback HTTP
        if: ${{ !cancelled() && steps.complete_bundle.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $bundle = $env:CARR_CI_BUNDLE
          if (!$bundle -or !(Test-Path -LiteralPath $bundle -PathType Container)) { throw 'The qualified installed bundle is unavailable.' }
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          & $python -I -B -c "import pathlib,sys,carr_library; assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(pathlib.Path(sys.argv[1]).resolve()/'.venv')" $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basePython = (& $python -I -B -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Select-Object -Unique
          $remoteRanges = @('0.0.0.1-126.255.255.255', '128.0.0.0-255.255.255.255',
            '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          function Normalize-RemoteRanges($Ranges) {
            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address filter representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $rulePrefix = 'CARR-local-planning-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Local planning checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Local planning egress rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Local planning rules do not cover the intended runtime programs.' }
            foreach ($rule in $active) {
              $addresses = @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress)
              $actualRanges = @(Normalize-RemoteRanges $addresses)
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'Local planning rule has unexpected remote-address coverage.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected executables with external egress blocked; loopback synthetic peer allowed' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/bundle-local-planning-firewall.json'
            & $python -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-results/bundle-native-local-planning.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Native local proposal review and execution acceptance failed.' }
            & $python -I -B -m pytest -q -o addopts= -o pythonpath= --import-mode=importlib tests/assistant/test_local_planning_loopback.py --junitxml=ci-results/bundle-local-planning-loopback.xml 2>&1 | Tee-Object 'ci-results/bundle-local-planning-loopback.txt'
            if ($LASTEXITCODE -ne 0) { throw 'Actual local planning HTTP/CLI regressions failed.' }
            & $python -I -B -c "import xml.etree.ElementTree as E; cases=list(E.parse('ci-results/bundle-local-planning-loopback.xml').iter('testcase')); assert cases and all(not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases); print('PASS: actual loopback HTTP tests; no skipped or failed cases')"
            if ($LASTEXITCODE -ne 0) { throw 'Loopback test evidence is incomplete.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve completed native and bundle diagnostics before source inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-pre-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-results/*.txt
            carr-library/ci-results/*.json
            carr-library/ci-results/*.xml
          if-no-files-found: warn
          retention-days: 7

      # Evidence and public source wheel only: no model, native DLLs, audio executables, OCR source payload, or user documents
      # are uploaded. NVDA and final-download identity remain separate acceptance.
      - name: Run required workflows against the complete pinned runtime
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' && steps.ocr_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          $suites = @(Get-Content -Raw 'ci-results/required-source-suites.json' | ConvertFrom-Json)
          if ($suites.Count -eq 0) { throw 'Required source-suite inventory is missing.' }
          & $env:CARR_PYTHON -m pip list --format=json | Set-Content 'ci-results/full-runtime-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:CARR_CI_OCR_DIR;$env:PATH"
          $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
          $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
          $env:CARR_TEST_MODEL_DIR = $env:CARR_CI_MODEL_DIR
          $env:CARR_TEST_MODEL_MANIFEST = $env:CARR_CI_MODEL_MANIFEST
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 2 @suites 2>&1 | Tee-Object 'ci-results/full-runtime-source-tests.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Retain the exact wheel only after the full Windows aggregate succeeds
        if: ${{ success() && steps.complete_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-tested-application-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-results/tested-application-wheel/
            carr-library/ci-results/tested-application-wheel.json
            carr-library/ci-results/source-wheel-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve exact-commit runtime and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-${{ github.sha }}-${{ github.run_attempt }}
          # A failed aggregate retains diagnostic evidence, never its staged wheel.
          # Only the success-gated application-wheel artifact may retain that file.
          path: |
            carr-library/ci-results/
            !carr-library/ci-results/tested-application-wheel/**
          if-no-files-found: warn
          retention-days: 7
