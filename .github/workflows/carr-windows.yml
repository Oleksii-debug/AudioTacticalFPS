          expected_fields = {"status":"PASS","actual_hunspell_c_api":"PASS","actual_reader_worker":"PASS","native_review_apply_undo":"PASS","native_cancel_and_close":"PASS","owned_child_invocations":4,"speech_audio":"NOT_RUN","manual_nvda":"NOT_RUN","dictionary_quality":"NOT_RUN","distribution_clearance":"NOT_GRANTED"} if native else {"status":"PASS","actual_c_api":"PASS","child_and_resource_cleanup":"PASS","native_windows":"EXECUTED","manual_nvda":"NOT_RUN","distribution_clearance":"NOT_GRANTED"}
          for key, value in expected_fields.items():
