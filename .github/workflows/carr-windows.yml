name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library, carr/v3-integrated-studio-20261126]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
      - .github/workflows/carr-flite.yml
      - .github/workflows/carr-sync.yml
      - .github/workflows/carr-trusted-client.yml
      - .github/workflows/carr-managed-update.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/academic-research-workbench, carr/academic-search-20261126, carr/notebook-release-ascii-e021-20261126, carr/v3-primary103-recovered-composition-20261126, carr/unified-publication-24-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
      - .github/workflows/carr-flite.yml
      - .github/workflows/carr-sync.yml
      - .github/workflows/carr-trusted-client.yml
      - .github/workflows/carr-managed-update.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-syntax:
    name: Exact source / Python 3.11 syntax and package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Compile exact source without importing modules or writing bytecode
        working-directory: carr-library
        shell: bash
        run: |
          python -I -B - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import subprocess
          import tomllib
          roots = ('src', 'scripts', 'packaging', 'bootstrap')
          paths = {path for root in roots for path in Path(root).rglob('*.py')}
          paths.update(Path('tests').rglob('test_*.py'))
          assert paths
          inventory = []
          for path in sorted(paths):
              raw = path.read_bytes()
              compile(raw, str(path), 'exec', dont_inherit=True)
              inventory.append((path.as_posix(), sha256(raw).hexdigest()))
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          packages = project['tool']['setuptools']['packages']
          assert len(packages) == len(set(packages)), 'Duplicate explicit package'
          package_dirs = project['tool']['setuptools']['package-dir']
          for name in packages:
              prefixes = [key for key in package_dirs if not key or name == key or name.startswith(key + '.')]
              assert prefixes, name
              prefix = max(prefixes, key=len)
              suffix = name[len(prefix):].lstrip('.')
              location = Path(package_dirs[prefix]).joinpath(*suffix.split('.')) if suffix else Path(package_dirs[prefix])
              assert location.is_dir(), name
          print(json.dumps(dict(status='PASS', source_commit=subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip(), python_files=len(paths),
              inventory_sha256=sha256(json.dumps(inventory, separators=(',', ':')).encode()).hexdigest(),
              explicit_packages=len(packages), scope='Compilation and TOML only; no runtime qualification'),
              sort_keys=True))
          PY

      - name: Parse workflow PowerShell bodies with the actual YAML and native parsers
        working-directory: .
        shell: pwsh
        timeout-minutes: 2
        run: |
          & ./carr-library/scripts/check_workflow_powershell.ps1 -RepositoryRoot . -Output 'carr-library/ci-syntax-results/workflow-powershell.json'

      - name: Preserve exact workflow syntax evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-workflow-syntax-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-syntax-results/
          if-no-files-found: warn
          retention-days: 7

  completion-regressions:
    needs: source-syntax
    name: Required current composition / Windows source regressions
    runs-on: windows-2022
    # The measured 98-suite diagnostic took about 22 minutes before this 119-suite union.
    # Keep every 600-second suite limit; allow bounded setup and verdict headroom.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare locked dependencies and the existing pinned codec
        run: |
          New-Item -ItemType Directory -Force 'ci-completion-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-completion-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv (Join-Path $env:RUNNER_TEMP 'carr-completion-python')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $env:RUNNER_TEMP 'carr-completion-python/Scripts/python.exe'
          "CARR_COMPLETION_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/trusted-client.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audio = Join-Path $env:RUNNER_TEMP 'carr-completion-audio'
          & $python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-completion-audio-cache') --output $audio --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
