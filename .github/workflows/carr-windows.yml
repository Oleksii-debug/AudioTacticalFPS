          # Initial A, accepted B, rejected next candidate and repaired B all
          # execute at fresh generation paths. Preinstall rules bind each path.
          foreach ($generation in 1..4) {
            $payload = Join-Path $standardUpdateRoot ('versions/' + $sourceCommit.Substring(0,12) + '-' + $generation)
            foreach ($relative in @('runtime/python.exe', 'runtime/pythonw.exe', '.venv/Scripts/python.exe', '.venv/Scripts/pythonw.exe', 'ResearchLibrary.exe', 'ocr/tesseract.exe', 'maintenance-setup.exe')) {
