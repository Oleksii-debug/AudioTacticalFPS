      - name: Require exact protected source regression inventory
        run: |
          @'
          import json,pathlib,re
          oracle=json.loads(pathlib.Path('scripts/v3_acceptance_oracles.json').read_text(encoding='utf-8'))
          text=pathlib.Path('ci-results/integrated-tests.txt').read_text(encoding='utf-8-sig')
          observed={}
          for module,functions in oracle['source'].items():
              selector=module.replace('.','/')+'.py'
              expected=sum(functions.values())
              matches=re.findall(r'PASS: '+re.escape(selector)+r': junit_passed=(\d+), failed=0, skipped=0, pytest_exit=0$',text,re.M)
              assert matches==[str(expected)], (selector,expected,matches)
              observed[selector]=expected
          report={'status':'PASS','source_commit':pathlib.Path('ci-results/tested-commit.txt').read_text(encoding='utf-8-sig').strip(),'required_modules':len(observed),'required_cases':sum(observed.values()),'cases':observed,'actual_word':'NOT_RUN','nvda':'NOT_RUN'}
          pathlib.Path('ci-results/v3-additive-source-proof.json').write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          '@ | & $env:CARR_PYTHON -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

