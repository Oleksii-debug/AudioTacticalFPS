          $acquireHunspell = @'
          from hashlib import sha1, sha256
          import json, os
          from pathlib import Path, PurePosixPath
          import urllib.request
          pin_path = Path('scripts/hunspell-1.7.2-source.json')
          raw = pin_path.read_bytes()
          assert sha256(raw).hexdigest() == 'f5ea8a9afae905cd1d2dd56415b320fd0949d85e28151eb8ddb63d19d128aefc'
          pin = json.loads(raw)
          assert pin['repository'] == 'https://github.com/hunspell/hunspell'
          assert pin['commit'] == '2969be996acad84b91ab3875b1816636fe61a40e'
          assert len(pin['files']) == 38 and sum(e['bytes'] for e in pin['files']) == 3332658
          root = Path(os.environ['CARR_HUNSPELL_SOURCE'])
          root.mkdir(parents=False, exist_ok=False)
          observed = []
          for entry in pin['files']:
              relative = PurePosixPath(entry['path'])
              assert relative.as_posix() == entry['path'] and not relative.is_absolute()
              assert '..' not in relative.parts and '\\' not in entry['path'] and ':' not in entry['path']
              assert type(entry['bytes']) is int and 0 <= entry['bytes'] <= 4 * 1024 * 1024
              url = 'https://raw.githubusercontent.com/hunspell/hunspell/' + pin['commit'] + '/' + relative.as_posix()
              request = urllib.request.Request(url, headers={'User-Agent': 'Resonance-pinned-Hunspell-CI'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200 and response.geturl() == url
                  payload = response.read(entry['bytes'] + 1)
              assert len(payload) == entry['bytes'], relative.as_posix()
              actual = sha1(('blob ' + str(len(payload)) + '\0').encode('ascii') + payload).hexdigest()
              assert actual == entry['git_blob'], relative.as_posix()
              target = root.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open('xb') as stream:
                  stream.write(payload)
