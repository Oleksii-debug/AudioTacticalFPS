name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/notebook-release-ascii-e021-20261126, carr/academic-research-workbench, carr/academic-search-20261126]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: desktop_runtime
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate the installed native Windows compiler
        timeout-minutes: 2
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Installed x64 MSVC toolchain not found.' }
          "CARR_VSDEVCMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the private native launch entry from this exact source
        timeout-minutes: 5
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "packaging\native-launcher\build_msvc.ps1" -OutputDirectory "%RUNNER_TEMP%\carr-integrated-native-launcher"
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify native process behavior before sealing the launch entry
        timeout-minutes: 3
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'carr-integrated-native-launcher'
          & $env:CARR_PYTHON -I -B packaging/native-launcher/probe_windows.py --launcher "$private/ResearchLibrary.exe" --child "$private/windows_child_probe.exe" --report "$private/windows-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$private/build-evidence.json" 'ci-results/native-launcher-build.json'
          Copy-Item "$private/windows-probe.json" 'ci-results/native-launcher-process.json'
          "CARR_NATIVE_LAUNCHER=$private" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare pinned local audio and citation runtimes
        timeout-minutes: 10
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-canonical-audio'
          & $env:CARR_PYTHON -I -B packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-canonical-audio-cache') --output $audio --download | Tee-Object 'ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO=$audio" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audio 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $node = Get-Content packaging/windows-citations.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'carr-citation-runtime.zip'
          Invoke-WebRequest -Uri $node.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $node.archive_size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $node.archive_sha256) { throw 'Pinned citation runtime archive mismatch.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'carr-citation-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $citations = Join-Path $unpacked "node-v$($node.version)-win-x64"
          foreach ($entry in $node.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $citations $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Pinned citation runtime file mismatch.' }
          }
          "CARR_CI_CITATIONS=$citations" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $citations | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bibliography import and publication boundaries
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/research/test_bibtex_import.py tests/catalog/test_ris_apply.py tests/reader/test_export_no_clobber.py tests/storage/test_durable_state_publication.py tests/ui/test_export_destination.py tests/ingest/test_initial_publication_completion.py 2>&1 | Tee-Object 'ci-results/bibliography-publication.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed BibTeX import and real overwrite confirmation
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_bibliography_interchange_smoke.py 2>&1 | Tee-Object 'ci-results/native-bibliography-interchange.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR catalogue and model manager
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic comparison, reviewed RIS and catalog quality
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_academic_tools_smoke.py --require-windows 2>&1 | Tee-Object 'ci-results/native-academic-tools.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        id: desktop_dependencies
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pairs=re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M); pins=dict(pairs); assert pins and len(pairs)==len({re.sub(r'[-_.]+','-',n).lower() for n,_ in pairs}), 'Empty or duplicate normalized dependency pins'; actual={n:m.version(n) for n in pins}; bom=json.loads(pathlib.Path('packaging/windows-semantic-sbom.cdx.json').read_text()); expected={c['name']:c['version'] for c in bom['components']}; assert pins and len(pins)==len(bom['components']) and actual==pins==expected; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={name:m.version(name) for name in pins}; assert actual==pins; bom=json.loads(pathlib.Path('packaging/windows-semantic-sbom.cdx.json').read_text()); normalize=lambda name:re.sub(r'[-_.]+','-',name).lower(); assert {(normalize(c['name']),c['version']) for c in bom['components']}=={(normalize(n),v) for n,v in pins.items()}; assert bom['metadata']['component']['version']==m.version('universal-research-library'); print(json.dumps(dict(status='PASS',runtime_dependencies=actual,sbom='MATCHES_FULL_LOCK')))" | Tee-Object 'ci-results/source-runtime-parity.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        id: ocr_runtime
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise actual managed OCR with Unicode Windows paths
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_managed_ocr.py tests/e2e/test_managed_ocr_import.py tests/ui/test_ocr_selection.py 2>&1 | Tee-Object 'ci-results/managed-ocr-unicode.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }

      - name: Exercise native Import Center and durable batch workflow
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_import_center_smoke.py 2>&1 | Tee-Object 'ci-results/native-import-center.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed measured progress and real busy-time keys
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_progress_smoke.py 2>&1 | Tee-Object 'ci-results/native-operation-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed supplied-worker transcription controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_transcription_smoke.py 2>&1 | Tee-Object 'ci-results/native-transcription.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native wx startup and source-opening events
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/native-desktop.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native saved-evidence page selection and note recovery
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_evidence_pages_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reference metadata review and historical outline export
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-workflows.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-notebook search and keyboard actions
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_notebook_search_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-notebook-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB section navigation and image descriptions
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_ebook_reader_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-ebook-reader.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native library reports and academic exports
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_catalog_tools_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-catalog-tools.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB contents and exact chapter search
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_ebook_native.py 2>&1 | Tee-Object 'ci-results/native-ebook-contents.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native full-source reader and page bookmarks
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_reading_desk_smoke.py 2>&1 | Tee-Object 'ci-results/native-reading-desk.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native catalog reports and source comparison export
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_catalog_insights_native.py 2>&1 | Tee-Object 'ci-results/native-catalog-insights.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the pinned local model through the existing upstream verifier
        id: local_model
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'carr-model-ci/minilm'
          $modelManifest = Join-Path $env:RUNNER_TEMP 'carr-model-ci/model-manifest.json'
          $acquire = @'
          import importlib.util, json, pathlib, shutil, sys
          from huggingface_hub import hf_hub_download
          spec = importlib.util.spec_from_file_location('model_build', pathlib.Path('packaging/model_bundle.py').resolve())
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          target, manifest = map(pathlib.Path, sys.argv[1:])
          target.mkdir(parents=True, exist_ok=False)
          for name in sorted(helper.FILES):
              source = hf_hub_download(helper.REPO, name, revision=helper.REVISION, cache_dir=target.parent / 'cache', token=False)
              shutil.copyfile(source, target / name)
          proof = helper.seal(target)
          with manifest.open('x', encoding='utf-8') as stream:
              json.dump(proof, stream, sort_keys=True)
          print(json.dumps({'status': 'PASS', 'revision': helper.REVISION, 'files': len(proof['hashes'])}))
          '@
          # Only this explicit build-time child may fetch the pinned public model.
          # Importing the application before acquisition would enforce offline mode.
          $env:HF_HUB_OFFLINE = '0'
          try {
            $acquire | & $env:CARR_PYTHON -I -B - $model $modelManifest | Tee-Object 'ci-results/model-acquisition.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:HF_HUB_OFFLINE = '1'
          }
          & $env:CARR_PYTHON -I -B -c "import sys; from carr_library.semantic import verify_model_bundle; verify_model_bundle(sys.argv[1], sys.argv[2]); print('PASS: exact approved local model')" $model $modelManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_MODEL_DIR=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_MODEL_MANIFEST=$modelManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install and exercise the complete bundle with runtime egress blocked
        if: ${{ !cancelled() && steps.local_model.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 20
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $baseBundle = Join-Path $bundleWork 'base bundle'
          $nativeBundle = Join-Path $bundleWork 'native bundle'
          $bundle = Join-Path $bundleWork 'complete bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes -r packaging/windows-semantic-cp311.lock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $applicationWheel = $wheels[0].FullName
          $runtime = Get-Content packaging/windows-python.json -Raw | ConvertFrom-Json
          $pythonArchive = Join-Path $bundleWork 'windows-python.tar.gz'
          Invoke-WebRequest -Uri $runtime.download.url -OutFile $pythonArchive
          $archiveHash = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.download.sha256) { throw 'Pinned Python archive checksum mismatch.' }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          if (!(Test-Path -LiteralPath $ocrSource -PathType Leaf) -or $ocr -ne $env:CARR_CI_OCR_DIR) { throw 'Verified source-test OCR runtime is missing.' }
          $nativeLock = Get-Content packaging/native-runtime/source-lock.json -Raw | ConvertFrom-Json
          $nativePackage = Join-Path $bundleWork 'native-runtime.conda'
          Invoke-WebRequest -Uri $nativeLock.package.url -OutFile $nativePackage
          if ((Get-Item -LiteralPath $nativePackage).Length -ne $nativeLock.package.size) { throw 'Pinned native package size mismatch.' }
          if ((Get-FileHash -LiteralPath $nativePackage -Algorithm SHA256).Hash.ToLowerInvariant() -ne $nativeLock.package.sha256) { throw 'Pinned native package checksum mismatch.' }
          $nativeRuntime = Join-Path $bundleWork 'native-runtime'
          & $env:CARR_PYTHON packaging/prepare_native_runtime.py --package $nativePackage --output $nativeRuntime | Tee-Object 'ci-results/native-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
