      - name: Require actual local HTTP and separate reviewed CLI execution
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python scripts/ci_check.py --allow-loopback tests/loopback/test_local_planning.py tests/loopback/test_translation_local_adapter.py 2>&1 | tee portable-shared-results/local-planning-loopback.txt
      - name: Preserve portable source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portable-shared-${{ github.event.pull_request.head.sha || github.sha }}
          path: carr-library/portable-shared-results/
          if-no-files-found: error
          retention-days: 7
