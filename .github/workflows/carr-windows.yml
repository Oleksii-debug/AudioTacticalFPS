          New-Item -ItemType Directory -Force $testedWheelDirectory | Out-Null
          $testedWheel = Join-Path $testedWheelDirectory $wheels[0].Name
          Copy-Item -LiteralPath $testedSealedWheel -Destination $testedWheel
          if ((Get-FileHash -LiteralPath $testedWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $testedWheelHash) { throw 'Tested application wheel copy differs.' }
          @{ status='PASS'; source_commit=$sourceCommit; source_tree=$testedSourceTree; wheel=$wheels[0].Name; sha256=$testedWheelHash; bundle_manifest_sha256=(Get-FileHash -LiteralPath $testedManifestPath -Algorithm SHA256).Hash.ToLowerInvariant(); installed_bundle='PASS' } | ConvertTo-Json | Set-Content 'ci-results/tested-application-wheel.json'
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Qualify the transferable library bundle without an audio payload
        if: ${{ !cancelled() && steps.complete_bundle.conclusion == 'success' }}
        timeout-minutes: 15
        run: |
          $bundle = $env:CARR_CI_TRANSFER_BUNDLE
          if (-not $bundle -or -not (Test-Path -LiteralPath (Join-Path $bundle 'bundle-manifest.json') -PathType Leaf)) { throw 'The verified transferable bundle is missing.' }
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          $programs = @($bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $python,
            (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ocr/tesseract.exe'),
            (Join-Path $bundle 'ResearchLibrary.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          $rulePrefix = 'CARR-transfer-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Transferable offline checks require active firewall profiles.' }
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Transferable bundle outbound rules are inactive.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Transferable bundle runtime coverage is incomplete.' }
            @{ status='PASS'; outbound_blocked_programs=$filters; scope='transferable bundle installation and native library workflows' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/transferable-firewall.json'
            & $bundledPython -I -B -X utf8 (Join-Path $bundle 'install_windows.py') 2>&1 | Tee-Object 'ci-results/transferable-install.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 -m carr_library --self-test 2>&1 | Tee-Object 'ci-results/transferable-self-test.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 packaging/native-launcher/probe_installed_windows.py --bundle-root $bundle --report 'ci-results/transferable-native-launcher.json' 2>&1 | Tee-Object 'ci-results/transferable-native-launcher.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 -c "import runpy,sys; from carr_library.native_runtime import activate_bundled_runtime; handle=activate_bundled_runtime(); assert handle is not None; runpy.run_path(sys.argv[1],run_name='__main__')" (Resolve-Path tests/ui/probe_source_open_native.py).Path 2>&1 | Tee-Object 'ci-results/transferable-native.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 -c "import runpy,sys; from carr_library.native_runtime import activate_bundled_runtime; handle=activate_bundled_runtime(); assert handle is not None; runpy.run_path(sys.argv[1],run_name='__main__')" (Resolve-Path scripts/windows_academic_smoke.py).Path 2>&1 | Tee-Object 'ci-results/transferable-academic-native.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/transferable-advanced-search.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -B -X utf8 (Join-Path $bundle 'tools/audio-setup/setup_local_audio.py') 2>&1 | Tee-Object 'ci-results/transferable-audio-setup-plan.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $testWheels = Join-Path $env:RUNNER_TEMP 'carr-test-wheels'
            & $python -I -B -m pip install --no-index --find-links $testWheels pytest==9.0.2 reportlab==4.4.9
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
            & $python -I -B -X utf8 scripts/windows_transferable_bundle_smoke.py --bundle $bundle --evidence ci-results 2>&1 | Tee-Object 'ci-results/transferable-bundle.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      - name: Publish public phase diagnostics before extended source acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-phase-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
