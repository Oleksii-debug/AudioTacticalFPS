          with tempfile.TemporaryDirectory(prefix='carr-bundle-update-tls-') as temporary:
              report = root / 'ci-results/update-resume-tls/installed.xml'
              options = ['-q', '--import-mode=importlib', '-o', 'addopts=', '-o', 'xfail_strict=true',
                         '--junitxml', str(report), '--basetemp', str(Path(temporary) / 'pytest')]
              if mode == 'installed':
                  options.extend(['-o', 'pythonpath='])
              status = pytest.main([*options, *suites], plugins=[proof])
              cases = list(ET.parse(report).iter('testcase'))
              assert status == 0 and cases, status
              assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))
                         for case in cases), 'Every selected case must pass without a skip.'
              assert inventory() == proof.before
              selected_modules = {Path(path).stem for path in suites}
              observed_modules = {case.get('classname', '').rsplit('.', 1)[-1] for case in cases}
              assert selected_modules <= observed_modules, 'A required actual-loopback suite was not collected.'
              result = {'status': 'PASS', 'mode': mode, 'cases': len(cases), 'origins': proof.before, 'suites': suites}
              (root / ('ci-results/update-resume-tls/' + mode + '-identity.json')).write_text(
                  json.dumps(result, indent=2, sort_keys=True), encoding='utf-8')
              print(json.dumps(result, sort_keys=True))
          '@
          $installedUpdateTls | & $python -I -B -X utf8 - 2>&1 | Tee-Object 'ci-results/installed-update-resume-tls.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Sealed installed updater failed actual TLS continuation acceptance.' }
      - name: Restore this run's runtime egress test policy after every bundle outcome
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $statePath = 'ci-results/full-bundle-firewall-recovery.json'
          $statusPath = 'ci-results/full-bundle-firewall-restored.json'
          if (!(Test-Path -LiteralPath $statePath)) {
            @{ status = 'NOT_STARTED'; reason = 'No runtime egress policy was changed by this bundle step.' } | ConvertTo-Json | Set-Content -LiteralPath $statusPath -Encoding utf8
            exit 0
          }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ($state.schema -ne 'carr-ci-firewall-recovery/1' -or [string]$state.run_id -ne [string]$env:GITHUB_RUN_ID -or $state.prefix -notmatch '^CARR-offline-[0-9a-f]{32}$') { throw 'Runtime firewall recovery identity changed.' }
          $names = @($state.rule_names)
          if ($names.Count -eq 0 -or $names.Count -gt 512 -or @($names | Sort-Object -Unique).Count -ne $names.Count) { throw 'Invalid exact runtime firewall rule inventory.' }
          foreach ($name in $names) {
            if ($name -notmatch ('^' + [regex]::Escape($state.prefix) + '-[0-9]+$')) { throw 'Recovery must address only this run''s exact rules.' }
            Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction Stop
          }
          $profiles = @($state.profiles)
          if ($profiles.Count -ne 3 -or @($profiles.name | Sort-Object -Unique).Count -ne 3) { throw 'Invalid original firewall profile inventory.' }
          foreach ($profile in $profiles) {
            if ($profile.name -notin @('Domain','Private','Public') -or $profile.enabled -notin @('True','False','NotConfigured')) { throw 'Invalid original firewall profile.' }
            Set-NetFirewallProfile -Profile $profile.name -Enabled $profile.enabled -ErrorAction Stop
          }
          $remaining = @(Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction Stop | Where-Object { $_.Name -in $names })
          if ($remaining.Count -ne 0) { throw 'Runtime egress rules remain active after cleanup.' }
          $observed = @(Get-NetFirewallProfile -ErrorAction Stop)
          foreach ($profile in $profiles) {
            $actual = @($observed | Where-Object { $_.Name -eq $profile.name })
            if ($actual.Count -ne 1 -or [string]$actual[0].Enabled -ne [string]$profile.enabled) { throw 'Original firewall profile state was not restored.' }
          }
          @{ status = 'PASS'; run_id = $env:GITHUB_RUN_ID; removed_rule_names = $names; restored_profiles = $profiles } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $statusPath -Encoding utf8
