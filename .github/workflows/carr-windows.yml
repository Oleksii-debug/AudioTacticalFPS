name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/notebook-release-ascii-e021-20261126, carr/v3-release-integration-dbbb-20261126]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      CARR_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARR_EVENT_SHA: ${{ github.sha }}
      CARR_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: desktop_runtime
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testedSource = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testedTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testedSource -ne $env:CARR_EXPECTED_SOURCE_SHA) { throw 'Checked-out source differs from the required event head.' }
          @{ source_commit=$testedSource; source_tree=$testedTree; event_commit=$env:CARR_EVENT_SHA; workflow_commit=$env:CARR_WORKFLOW_SHA } | ConvertTo-Json | Set-Content 'ci-results/source-identity.json'
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate the installed native Windows compiler
        id: native_toolchain
        timeout-minutes: 2
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Installed x64 MSVC toolchain not found.' }
          "CARR_VSDEVCMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the private native launch entry from this exact source
        timeout-minutes: 5
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "packaging\native-launcher\build_msvc.ps1" -OutputDirectory "%RUNNER_TEMP%\carr-integrated-native-launcher"
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify native process behavior before sealing the launch entry
        timeout-minutes: 3
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'carr-integrated-native-launcher'
          & $env:CARR_PYTHON -I -B packaging/native-launcher/probe_windows.py --launcher "$private/ResearchLibrary.exe" --child "$private/windows_child_probe.exe" --report "$private/windows-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$private/build-evidence.json" 'ci-results/native-launcher-build.json'
          Copy-Item "$private/windows-probe.json" 'ci-results/native-launcher-process.json'
          "CARR_NATIVE_LAUNCHER=$private" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the exact official Hunspell source for ephemeral qualification
        id: hunspell_source
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.native_toolchain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $hunspellSource = Join-Path $env:RUNNER_TEMP 'hunspell-official-source'
          if (Test-Path -LiteralPath $hunspellSource) { throw 'Choose a fresh Hunspell source directory.' }
          git -c core.autocrlf=false init $hunspellSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $hunspellSource -c core.autocrlf=false fetch --no-tags --depth 1 https://github.com/hunspell/hunspell.git 2969be996acad84b91ab3875b1816636fe61a40e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $hunspellSource -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hunspellCommit = (git -C $hunspellSource rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $hunspellCommit -ne '2969be996acad84b91ab3875b1816636fe61a40e') { throw 'Hunspell checkout differs from the reviewed official source.' }

      - name: Build only the pinned Hunspell source with the selected native toolchain
        id: hunspell_build
        if: ${{ !cancelled() && steps.hunspell_source.outcome == 'success' }}
        timeout-minutes: 7
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          "%CARR_PYTHON%" -I -B -X utf8 scripts\build_hunspell_msvc.py --source "%RUNNER_TEMP%\hunspell-official-source" --output "%RUNNER_TEMP%\hunspell-native-build" --msbuild "%VSINSTALLDIR%MSBuild\Current\Bin\MSBuild.exe" --vc-tools-dir "%VCToolsInstallDir%." --sdk-dir "%WindowsSdkDir%." --sdk-version "%WindowsSDKVersion:\=%" --timeout 300
          set "CARR_HUNSPELL_BUILD_EXIT=%errorlevel%"
          if exist "%RUNNER_TEMP%\hunspell-native-build\build.log" copy /Y "%RUNNER_TEMP%\hunspell-native-build\build.log" "ci-results\hunspell-build.log" >nul
          if exist "%RUNNER_TEMP%\hunspell-native-build\build-report.json" copy /Y "%RUNNER_TEMP%\hunspell-native-build\build-report.json" "ci-results\hunspell-build.json" >nul
          exit /b %CARR_HUNSPELL_BUILD_EXIT%

      - name: Require the actual Windows Hunspell C API through the installed application
        if: ${{ !cancelled() && steps.hunspell_build.outcome == 'success' && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $hunspellBuild = Join-Path $env:RUNNER_TEMP 'hunspell-native-build'
          $hunspellDll = Join-Path $hunspellBuild 'bin/libhunspell.dll'
          $buildProof = Get-Content -LiteralPath (Join-Path $hunspellBuild 'build-report.json') -Raw | ConvertFrom-Json
          if ($buildProof.status -ne 'BUILT' -or $buildProof.source_commit -ne '2969be996acad84b91ab3875b1816636fe61a40e' -or $buildProof.source_manifest_sha256 -ne 'f5ea8a9afae905cd1d2dd56415b320fd0949d85e28151eb8ddb63d19d128aefc' -or @($buildProof.source_files).Count -ne 38 -or $buildProof.source_bytes_modified -isnot [bool] -or $buildProof.source_bytes_modified -ne $false -or $buildProof.bundled -isnot [bool] -or $buildProof.bundled -ne $false -or $buildProof.build.platform -ne 'x64' -or $buildProof.build.platform_toolset -ne 'v143' -or $buildProof.build.exit_code -ne 0 -or $buildProof.native_api -ne 'NOT_RUN' -or $buildProof.dll.machine -ne 'AMD64') { throw 'The pinned native Hunspell build proof is incomplete or changed.' }
          if ((Get-FileHash -LiteralPath $hunspellDll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $buildProof.dll.sha256) { throw 'The compiled Hunspell DLL changed before its actual C API qualification.' }
          & $env:CARR_PYTHON -I -B -X utf8 scripts/hunspell_acceptance.py --library $hunspellDll --output 'ci-results/hunspell-native-acceptance.json' 2>&1 | Tee-Object 'ci-results/hunspell-native-acceptance.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyHunspell = @'
          from hashlib import sha256
          import importlib, json, pathlib, sys, sysconfig
          checkout = pathlib.Path.cwd().resolve()
          installed = pathlib.Path(sysconfig.get_path('purelib')).resolve()
          build = json.loads((pathlib.Path(sys.argv[1]) / 'build-report.json').read_text(encoding='utf-8'))
          report = json.loads(pathlib.Path('ci-results/hunspell-native-acceptance.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS' and len(report['checks']) == 14 and len(set(report['checks'])) == 14
          assert report['native_windows'] == 'EXECUTED' and report['manual_nvda'] == 'NOT_RUN'
          assert report['native_library_sha256'] == build['dll']['sha256']
          assert report['native_library_bytes'] == build['dll']['bytes']
          assert sha256(pathlib.Path(build['dll']['path']).read_bytes()).hexdigest() == build['dll']['sha256']
          origins, identities = {}, {}
          for name in ('carr_library.speech.spelling', 'carr_library.speech.spelling_worker', 'carr_library.ui.spelling_dialog'):
              module = importlib.import_module(name)
              actual = pathlib.Path(module.__file__).resolve()
              expected = checkout / 'src' / pathlib.Path(*name.split('.')).with_suffix('.py')
              assert actual.is_relative_to(installed) and not actual.is_relative_to(checkout), name
              identities[name] = sha256(actual.read_bytes()).hexdigest()
              assert identities[name] == sha256(expected.read_bytes()).hexdigest(), name
              origins[name] = str(actual)
          assert report['application_modules'] == identities
          proof = dict(status='PASS', actual_windows_c_api_checks=14, native_windows='EXECUTED',
                       source_commit=build['source_commit'], native_library_sha256=build['dll']['sha256'],
                       origins=origins, application_modules=identities, bundled=False,
                       dictionary_quality='NOT_RUN', distribution_clearance='NOT_GRANTED', manual_nvda='NOT_RUN')
          pathlib.Path('ci-results/hunspell-installed-proof.json').write_text(json.dumps(proof, indent=2), encoding='utf-8')
          print(json.dumps(proof), flush=True)
          '@
          $verifyHunspell | & $env:CARR_PYTHON -I -B -X utf8 - $hunspellBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only JSON/log evidence is retained. The ephemeral upstream checkout,
          # DLL, import libraries and generated dictionaries never enter a bundle.

      - name: Prepare pinned local audio and citation runtimes
        timeout-minutes: 10
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-canonical-audio'
          & $env:CARR_PYTHON -I -B packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-canonical-audio-cache') --output $audio --download | Tee-Object 'ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO=$audio" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audio 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $node = Get-Content packaging/windows-citations.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'carr-citation-runtime.zip'
          Invoke-WebRequest -Uri $node.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $node.archive_size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $node.archive_sha256) { throw 'Pinned citation runtime archive mismatch.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'carr-citation-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $citations = Join-Path $unpacked "node-v$($node.version)-win-x64"
          foreach ($entry in $node.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $citations $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Pinned citation runtime file mismatch.' }
          }
          "CARR_CI_CITATIONS=$citations" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $citations | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR catalogue and model manager
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed document formats and native accessible reading
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_document_formats_smoke.py 2>&1 | Tee-Object 'ci-results/native-document-formats.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native transcription controls and durable jobs
        timeout-minutes: 3
        run: |
          # The UI probe uses an explicitly synthetic worker. Real private
          # Whisper inference and acoustic qualification are separate evidence.
          & $env:CARR_PYTHON -I -B scripts/windows_transcription_smoke.py 2>&1 | Tee-Object 'ci-results/native-transcription.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native progress speech, cancellation and playback quiet mode
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_progress_smoke.py 2>&1 | Tee-Object 'ci-results/native-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - actual JSON reader and replacement matrix
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_json_replace_diagnostic.py 2>&1 | Tee-Object 'ci-results/windows_json_replace_diagnostic.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jsonMatrix = Get-Content 'ci-results/windows_json_replace_diagnostic.txt' | Select-Object -Last 1 | ConvertFrom-Json
          if ($jsonMatrix.status -ne 'PASS' -or $jsonMatrix.cases -ne 25 -or @($jsonMatrix.failures).Count -ne 0) { throw 'The actual Windows JSON replacement matrix is incomplete or failed.' }

      - name: Native acceptance - draft timer Close and Destroy lifecycle
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_save_timer_smoke.py --output 'ci-results/windows_save_timer_smoke.json' 2>&1 | Tee-Object 'ci-results/windows_save_timer_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saveTimer = Get-Content 'ci-results/windows_save_timer_smoke.json' -Raw | ConvertFrom-Json
          if ($saveTimer.status -ne 'PASS' -or @($saveTimer.checks).Count -ne 3 -or $saveTimer.actual_timer_events.Close -le 0 -or $saveTimer.actual_timer_events.Destroy -le 0) { throw 'The actual installed draft timer lifecycle is incomplete or failed.' }

      - name: Native acceptance - bibliography interchange
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_bibliography_interchange_smoke.py 2>&1 | Tee-Object 'ci-results/windows_bibliography_interchange_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - citation regeneration
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_citation_regeneration_smoke.py 2>&1 | Tee-Object 'ci-results/windows_citation_regeneration_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - local planning
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_local_planning_smoke.py 2>&1 | Tee-Object 'ci-results/windows_local_planning_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - clip editor
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_clip_editor_smoke.py 2>&1 | Tee-Object 'ci-results/windows_clip_editor_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - measured audio conversion controls
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_audio_conversion_smoke.py 2>&1 | Tee-Object 'ci-results/windows_audio_conversion_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - reviewed audio metadata and original covers
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_audio_metadata_smoke.py 2>&1 | Tee-Object 'ci-results/windows_audio_metadata_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioMetadata = Get-Content 'ci-results/windows_audio_metadata_smoke.txt' | Select-Object -Last 1 | ConvertFrom-Json
          if ($audioMetadata.result -ne 'PASS' -or $audioMetadata.native_keyboard -ne 'PASS' -or $audioMetadata.actual_ffmpeg_metadata -ne 'PASS' -or $audioMetadata.actual_ffprobe -ne 'PASS' -or $audioMetadata.output.chapters -ne 2 -or $audioMetadata.output.title -ne '2027' -or @($audioMetadata.source_identity.PSObject.Properties).Count -ne 5) { throw 'The actual installed audio metadata workflow is incomplete or failed.' }

      - name: Native acceptance - recording
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_recording_smoke.py 2>&1 | Tee-Object 'ci-results/windows_recording_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - EPUB and DAISY publishing
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_publishing_smoke.py 2>&1 | Tee-Object 'ci-results/windows_publishing_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - EPUB synchronized recorded reading
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_epub_reading_smoke.py 2>&1 | Tee-Object 'ci-results/windows_epub_reading_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - playback controls with explicit synthetic transport
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_playback_navigation_smoke.py 2>&1 | Tee-Object 'ci-results/windows_playback_navigation_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - pronunciation and spelling controls with unavailable engine
        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 5
        run: |
          # Actual native controls and unavailable-runtime handling; no Windows Hunspell DLL qualification.
          & $env:CARR_PYTHON -I -B scripts/windows_pronunciation_smoke.py 2>&1 | Tee-Object 'ci-results/windows_pronunciation_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - Studio pronunciation
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_studio_pronunciation_smoke.py 2>&1 | Tee-Object 'ci-results/windows_studio_pronunciation_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native acceptance - durable voice preferences with explicit fixture voices
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_voice_preferences_smoke.py 2>&1 | Tee-Object 'ci-results/windows_voice_preferences_smoke.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $voicePreferences = Get-Content 'ci-results/windows_voice_preferences_smoke.txt' | Select-Object -Last 1 | ConvertFrom-Json
