name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/academic-research-workbench, carr/academic-search-20261126, carr/notebook-release-ascii-e021-20261126, carr/complete-v3-foundation-20261126-3954, carr/3954-release-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Preserve the exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: desktop_install
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checkout does not match the exact event head.' }
          $sourceCommit | Set-Content 'ci-results/tested-commit.txt'
          git rev-parse 'HEAD^{tree}' | Set-Content 'ci-results/tested-tree.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR catalogue and model manager
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Exercise native academic references and reading controls
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native BibTeX and citation controls
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_citation_styles_smoke.py 2>&1 | Tee-Object 'ci-results/native-citation-styles.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        id: production_dependencies
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==50 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        id: ocr_runtime
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the pinned shared audio runtime before its source regressions
        id: audio_runtime
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $audioInputs = Join-Path $bundleWork 'audio-inputs'
          $audioRuntime = Join-Path $bundleWork 'audio-runtime'
          & $env:CARR_PYTHON packaging/acquire_audio_runtime.py --output $audioInputs --download | Tee-Object 'ci-results/audio-runtime-acquisition.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audioLock = Get-Content packaging/audio-runtime/source-lock.json -Raw | ConvertFrom-Json
          & $env:CARR_PYTHON packaging/prepare_audio_runtime.py --archive (Join-Path $audioInputs $audioLock.archive.name) --sources-dir $audioInputs --output $audioRuntime | Tee-Object 'ci-results/audio-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise native Import Center and durable batch workflow
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_import_center_smoke.py 2>&1 | Tee-Object 'ci-results/native-import-center.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed document formats and native accessible reading
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_document_formats_smoke.py 2>&1 | Tee-Object 'ci-results/native-document-formats.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native wx startup and source-opening events
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_source_open_native.py 2>&1 | Tee-Object 'ci-results/native-desktop.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native saved-evidence page selection and note recovery
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_evidence_pages_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-pages.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reference metadata review and historical outline export
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-workflows.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic comparison, bibliography and catalog review
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_academic_comparison_smoke.py --require-windows 2>&1 | Tee-Object 'ci-results/native-academic.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native reviewed library workflows and checkpoint recovery
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B -X utf8 tests/ui/native_library_workflow_smoke.py 2>&1 | Tee-Object 'ci-results/native-library-workflow.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-notebook search and keyboard actions
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_notebook_search_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-notebook-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB section navigation and image descriptions
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_ebook_reader_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-ebook-reader.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native library reports and academic exports
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_catalog_tools_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-catalog-tools.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native EPUB contents and exact chapter search
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_ebook_native.py 2>&1 | Tee-Object 'ci-results/native-ebook-contents.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native full-source reader and page bookmarks
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_reading_desk_smoke.py 2>&1 | Tee-Object 'ci-results/native-reading-desk.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native catalog reports and source comparison export
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/probe_catalog_insights_native.py 2>&1 | Tee-Object 'ci-results/native-catalog-insights.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual native Main keyboard settings and command dispatch
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_keyboard_settings_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-keyboard-settings.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual contextual Reader key remapping
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_reader_keymap_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-reader-keymap.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-note draft recovery and explicit save
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_evidence_drafts_smoke.py --native 2>&1 | Tee-Object 'ci-results/native-evidence-drafts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native Save All after durable note and studio commits
        if: ${{ !cancelled() && steps.desktop_install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B -X utf8 tests/ui/native_save_all_smoke.py 2>&1 | Tee-Object 'ci-results/native-save-all.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run required integrated source workflows
        if: ${{ !cancelled() && steps.production_dependencies.outcome == 'success' && steps.ocr_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          # Use the verified real OCR engine, shared audio runtime and pinned
          # model bytes for source fixtures. Keep explicit runtime selection unset
          # so discovery tests can still exercise their failure paths.
          $audioBin = Join-Path $env:CARR_CI_AUDIO_DIR 'bin'
          $env:PATH = "$audioBin;$env:CARR_CI_OCR_DIR;$env:PATH"
          $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
          $suites = @(
            'tests/packaging/test_offline_runtime_policy.py',
            'tests/packaging/test_install_bytecode.py',
            'tests/e2e/test_offline_startup.py',
            'bootstrap/semantic_compat/test_probe.py',
            'tests/e2e/test_application.py',
            'tests/e2e/test_result_presentation.py',
            'tests/e2e/test_import_batches.py',
            'tests/ingest/test_batch_scan.py',
            'tests/ui/test_import_center.py',
            'tests/ui/test_ocr_model_manager.py',
            'tests/ui/test_ocr_selection.py',
            'tests/ui/test_ocr_options.py',
            'tests/e2e/test_epub_import.py',
            'tests/extract/test_document_formats_text.py',
            'tests/extract/test_document_formats_xml.py',
            'tests/e2e/test_extended_document_workflows.py',
            'tests/extract/test_epub_ordered.py',
            'tests/reader/test_ebook_reader.py',
            'tests/ui/test_ebook_reader.py',
            'tests/extract/test_epub_navigation.py',
            'tests/reader/test_ebook_contents.py',
            'tests/e2e/test_epub_library.py',
            'tests/e2e/test_epub_reading_desk.py',
            'tests/ui/test_ebook_dialog.py',
            'tests/e2e/test_retained_source_search_integrity.py',
            'tests/e2e/test_research_workflows.py',
            'tests/e2e/test_catalog_insights_workflow.py',
            'tests/e2e/test_notebook_research_workflow.py',
            'tests/e2e/test_advanced_research_search.py',
            'tests/e2e/test_current_topic_scope.py',
            'tests/e2e/test_search_operation_budget.py',
            'tests/e2e/test_nested_search_clock_budget.py',
            'tests/ingest/test_application_atomic_gate.py',
            'tests/ingest/test_worker_isolated_launch.py',
            'tests/ingest/test_application_atomic_docx_gate.py',
            'tests/e2e/test_semantic_fallback_status.py',
            'tests/search/test_semantic_cache.py',
            'tests/search/test_semantic_cache_boundary.py',
            'tests/e2e/test_source_file.py',
            'tests/e2e/test_export_destination.py',
            'tests/e2e/test_academic_document_export.py',
            'tests/e2e/test_data_directory_containment.py',
            'tests/extract/test_clipping_visibility.py',
            'tests/extract/test_ocr_model_catalog.py',
            'tests/extract/test_ocr_model_cli.py',
            'tests/extract/test_ocr_model_store.py',
            'tests/extract/test_managed_ocr.py',
            'tests/extract/test_ocr_languages.py',
            'tests/extract/test_ocr_runtime.py',
            'tests/extract/test_runtime_identity.py',
            'tests/e2e/test_managed_ocr_import.py',
            'tests/storage/test_library_backup.py',
            'tests/storage/test_library_backup_reading_state.py',
            'tests/storage/test_backup_v4_sidecars.py',
            'tests/storage/test_backup_publication_recovery.py',
            'tests/storage/test_backup_keyboard_drafts.py',
            'tests/storage/test_backup_voice_reader.py',
            'tests/storage/test_pending_backup.py',
            'tests/storage/test_complete_pending_backup.py',
            'tests/storage/test_backup_v5_pending.py',
            'tests/catalog/test_metadata_backup_roundtrip.py',
            'tests/reader/test_context.py',
            'tests/reader/test_topic_tree.py',
            'tests/storage/test_backup_schema_identity.py',
            'tests/storage/test_academic_migration.py',
            'tests/research/test_academic_library.py',
            'tests/research/test_bibtex_import.py',
            'tests/research/test_csl_author_boundaries.py',
            'tests/citations/test_csl.py',
            'tests/citations/test_custom_csl.py',
            'tests/citations/test_bibliography_workbench.py',
            'tests/citations/test_custom_workbench.py',
            'tests/ui/test_citation_styles_jobs.py',
            'tests/reader/test_export_no_clobber.py',
            'tests/reader/test_export_publication_boundary.py',
            'tests/ingest/test_import_replay_identity.py',
            'tests/e2e/test_academic_workflow.py',
            'tests/citations/test_finish_label_integrity.py',
            'tests/storage/test_printed_label_integrity.py',
            'tests/catalog/test_catalog_panel_acceptance.py',
            'tests/catalog/test_bibliography.py',
            'tests/catalog/test_catalog_reports.py',
            'tests/e2e/test_catalog_tools.py',
            'tests/acquisition/test_providers.py',
            'tests/acquisition/test_acquisition_security.py',
            'tests/acquisition/test_acquisition_workflow.py',
            'tests/acquisition/test_acquisition_cli.py',
            'tests/ui/test_native_acquisition.py',
            'tests/research/test_review_matrix.py',
            'tests/ui/test_catalog_tools_dialog.py',
            'tests/catalog/test_insights_budget.py',
            'tests/storage/test_v2_recovery.py',
            'tests/storage/test_catalog_composition.py',
            'tests/reader/test_saved_topic_query.py',
            'tests/reader/test_evidence_export.py',
            'tests/reader/test_file_export.py',
            'tests/reader/test_academic_documents.py',
            'tests/reader/test_bibliographic_locators.py',
            'tests/reader/test_binary_file_export.py',
            'tests/reader/test_literature_matrix.py',
            'tests/reader/test_topic_search_runtime.py',
            'tests/research/test_notebook_search.py',
            'tests/reader/test_topic_literature_matrix.py',
            'tests/reader/test_outline_export.py',
            'tests/catalog/test_ris_apply.py',
            'tests/catalog/test_quality.py',
            'tests/ui/test_academic_tools.py',
            'tests/ui/test_literature_matrix.py',
            'tests/ui/test_bibliography_import.py',
            'tests/ui/test_catalog_quality.py',
            'tests/reader/test_reading_desk.py',
            'tests/reader/test_reading_state.py',
            'tests/search/test_literal_long_source.py',
            'tests/search/test_thematic_work_diversity.py',
            'tests/search/test_literal_v2_composition.py',
            'tests/search/test_advanced_search.py',
            'tests/search/test_federated_advanced.py',
            'tests/ui/test_desktop_query_jobs.py',
            'tests/ui/test_scope_labels.py',
            'tests/ui/test_desktop_handlers.py',
