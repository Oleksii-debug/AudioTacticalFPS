          source, target = map(pathlib.Path, sys.argv[2:4])
          assert set(lock['files']) == {'node.exe', 'LICENSE', 'README.md'}
          assert source.stat().st_size == lock['archive_size'], 'Pinned Node archive size mismatch.'
          prefix = 'node-v' + lock['version'] + '-win-x64/'
          records = {}
          with source.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == lock['archive_sha256'], 'Pinned Node archive checksum mismatch.'
              stream.seek(0)
              with zipfile.ZipFile(stream) as archive:
                  entries = archive.infolist()
                  selected = {}
                  for name in lock['files']:
                      matches = [info for info in entries if info.filename == prefix + name]
                      assert len(matches) == 1, 'Missing or duplicate approved Node member: ' + name
