          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bundle 'runtime/python.exe') -I -B -c "import importlib.util,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('bundle_verifier',root/'install_windows.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); module.verify(root); print('PASS: sealed bundle unchanged after native inference and OCR workflows')" $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Retain the exact public source wheel used by the verified installed
          # bundle. Private delivery must reuse these tested bytes, not rebuild.
          $wheelKey = 'wheelhouse/' + $wheels[0].Name
          $sealedWheel = Join-Path $bundle $wheelKey
          $verifyWheel = @'
          import importlib.util, json, pathlib, subprocess, sys
          project = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('source_wheel', project / 'packaging/source_wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          proof = module.verify_application_wheel(sys.argv[1], project.parent, sys.argv[2])
          tree = subprocess.run(['git', 'rev-parse', sys.argv[2] + '^{tree}'], cwd=project.parent,
                                check=True, capture_output=True, text=True).stdout.strip()
          assert proof['source_tree'] == tree
          print(json.dumps(dict(status='PASS', **proof)))
          '@
          $verifyWheel | & $env:CARR_PYTHON -I -B - $sealedWheel $sourceCommit | Tee-Object 'ci-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelProof = Get-Content -LiteralPath 'ci-results/source-wheel-proof.json' -Raw | ConvertFrom-Json
          $sealedWheelHash = $sbomManifest.files.PSObject.Properties[$wheelKey].Value
          if (!$sealedWheelHash -or $wheelProof.wheel_sha256 -ne $sealedWheelHash) { throw 'Verified source wheel differs from the installed bundle seal.' }
          $testedWheelDirectory = Join-Path 'ci-results' 'tested-application-wheel'
          New-Item -ItemType Directory -Force $testedWheelDirectory | Out-Null
          $testedWheel = Join-Path $testedWheelDirectory $wheels[0].Name
          Copy-Item -LiteralPath $sealedWheel -Destination $testedWheel
          if ((Get-FileHash -LiteralPath $testedWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $wheelProof.wheel_sha256) {
            Remove-Item -LiteralPath $testedWheel -Force
            throw 'Tested application wheel copy differs.'
          }
          @{ status='PASS'; source_commit=$sourceCommit; source_tree=$wheelProof.source_tree; wheel=$wheels[0].Name; sha256=$wheelProof.wheel_sha256; installed_bundle='PASS' } | ConvertTo-Json | Set-Content 'ci-results/tested-application-wheel.json'
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }

      # Evidence and public source wheel: no model, native DLLs, OCR source payload, or user documents
      # are uploaded. NVDA and final-download identity remain separate acceptance.
      - name: Build pinned standard setup and execute actual install, repair and uninstall
        timeout-minutes: 20
        shell: pwsh
        working-directory: carr-library
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = $env:CARR_CI_BUNDLE
          if (-not $bundle -or -not (Test-Path (Join-Path $bundle 'bundle-manifest.json') -PathType Leaf)) { throw 'The previously verified full bundle is required.' }
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          if (-not (Test-Path $python -PathType Leaf)) { throw 'The verified bundle must already be installed.' }
          $identity = [Guid]::NewGuid().ToString('N')
          $compilerRoot = Join-Path $env:RUNNER_TEMP ('carr-inno-' + $identity)
          $buildRoot = Join-Path $env:RUNNER_TEMP ('carr-standard-setup-' + $identity)
          $workRoot = Join-Path $env:RUNNER_TEMP ('carr-standard-lifecycle-' + $identity)
          $report = Join-Path (Resolve-Path 'ci-results').Path 'standard-installer'
          $manifest = (Get-FileHash -LiteralPath (Join-Path $bundle 'bundle-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          & ./packaging/windows_installer/prepare_inno.ps1 -OutputDirectory $compilerRoot
          & $python -I -B -X utf8 packaging/windows_installer/build_setup.py --bundle $bundle --bundle-manifest-sha256 $manifest --installed-bundle --output $buildRoot --iscc (Join-Path $compilerRoot 'tools/ISCC.exe') --toolchain-receipt (Join-Path $compilerRoot 'toolchain-receipt.json') 2>&1 | Tee-Object 'ci-results/standard-installer-build.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -X utf8 scripts/windows_standard_installer_smoke.py --setup (Join-Path $buildRoot 'compiled/ResonanceSetup.exe') --build-evidence (Join-Path $buildRoot 'setup-build.json') --work $workRoot --report $report 2>&1 | Tee-Object 'ci-results/standard-installer-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content (Join-Path $report 'result.json') -Raw | ConvertFrom-Json
          $build = Get-Content (Join-Path $buildRoot 'setup-build.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or -not $result.actual_inno_install -or -not $result.actual_repair -or -not $result.actual_uninstall -or -not $result.live_job_preserved -or -not $result.populated_library_bytes_preserved -or -not $result.fresh_shortcut_collision_refused -or -not $result.uninstaller_wrapper_removed) { throw 'The complete native standard installation lifecycle did not pass.' }
          if ($result.bundle_manifest_sha256 -ne $manifest -or $result.setup_sha256 -ne $build.setup_sha256 -or $result.source_commit -ne $build.source_commit) { throw 'Native lifecycle evidence is not bound to this exact setup and source.' }
          if ($result.authenticode_verified -or $result.nvda_verified -or $result.native_network_trace -ne 'NOT_RUN' -or $result.unprivileged_account_qualification -ne 'NOT_RUN') { throw 'This gate cannot claim unrelated release qualifications.' }
          Copy-Item (Join-Path $buildRoot 'setup-build.json') (Join-Path $report 'setup-build.json')
          Copy-Item (Join-Path $compilerRoot 'toolchain-receipt.json') (Join-Path $report 'toolchain-receipt.json')

      - name: Preserve exact-commit runtime and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7

  keyboard-native:
    name: Windows x64 / native commands and draft recovery
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the pinned desktop and record the tested source
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-keyboard-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'keyboard-results' | Out-Null
          git rev-parse HEAD | Set-Content 'keyboard-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise source native Import Center and durable batch workflow
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I tests/ui/native_import_center_smoke.py 2>&1 | Tee-Object 'keyboard-results/native-import-center.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise source native reading copies, save commands and keyboard preferences
