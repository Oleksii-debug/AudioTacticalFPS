name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/notebook-release-ascii-e021-20261126, carr/ci-endpoint-evaluation-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    # Preserve every installed/source case and the additive native reader/platform gates.
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the actual desktop package in a fresh environment
        id: desktop_runtime
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start existing Windows audio services and record actual endpoint capability
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: audio_endpoint
        timeout-minutes: 5
        run: |
          # This prepares the disposable runner only. Existing service startup,
          # certificate trust, signing policy and user machines are unchanged.
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Audio service preparation requires the hosted Windows runner.' }
          $serviceEvidence = @()
          $serviceErrors = @()
          foreach ($serviceName in @('AudioEndpointBuilder', 'Audiosrv')) {
            $service = $null
            $before = $null
            $after = $null
            $startMode = $null
            try {
              $service = Get-Service -Name $serviceName -ErrorAction Stop
              $before = $service.Status.ToString()
              $startMode = $service.StartType.ToString()
              if ($service.Status -eq 'Stopped') {
                $service.Start()
                $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(20))
              } elseif ($service.Status -eq 'StartPending') {
                $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(20))
              } elseif ($service.Status -ne 'Running') {
                throw "The $serviceName service is in unsupported state $before."
              }
              $service.Refresh()
              $after = $service.Status.ToString()
              if ($after -ne 'Running') { throw "The $serviceName service did not reach Running." }
            } catch {
              $serviceErrors += $_.Exception.Message
            } finally {
              if ($null -ne $service) {
                try { $service.Refresh(); $after = $service.Status.ToString() }
                catch { $serviceErrors += $_.Exception.Message }
                $service.Dispose()
              }
            }
            $serviceEvidence += @{ name=$serviceName; before=$before; after=$after; start_type=$startMode }
          }
          @{ services=$serviceEvidence; errors=$serviceErrors; startup_policy_changed=$false; driver_installed=$false } | ConvertTo-Json -Depth 5 | Set-Content 'ci-results/audio-services.json'
          if ($serviceErrors.Count) { throw ($serviceErrors -join '; ') }
          # The signed endpoint evaluation is confined to this one dated test
          # branch and a push event. It is not recurring application setup or a
          # redistributed runtime. The helper independently enforces the same
          # repository/ref/host guard, exact signatures/bytes and no-reboot rule.
          if ($env:GITHUB_EVENT_NAME -ceq 'push' -and $env:GITHUB_REPOSITORY -ceq 'Oleksii-debug/AudioTacticalFPS' -and $env:GITHUB_REF -ceq 'refs/heads/carr/ci-endpoint-evaluation-20261127') {
            $legacy = Join-Path ([Environment]::GetFolderPath('System')) 'WindowsPowerShell/v1.0/powershell.exe'
            $modern = Join-Path $env:ProgramFiles 'PowerShell/7/pwsh.exe'
            & $legacy -NoLogo -NoProfile -NonInteractive -File tests/ci_endpoint/verify_authenticode_serialization.ps1 -Report ci-results/signature-json-ps51.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $modern -NoLogo -NoProfile -NonInteractive -File tests/ci_endpoint/verify_authenticode_serialization.ps1 -Report ci-results/signature-json-ps7.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:CARR_PYTHON -I -B scripts/ci_audio_endpoint.py --receipt ci-results/endpoint-evaluation.json 2>&1 | Tee-Object 'ci-results/endpoint-evaluation.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $queryEndpoint = @'
          import importlib.util, json, pathlib
          spec = importlib.util.spec_from_file_location('reader_capability', 'scripts/windows_reader_controls_smoke.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module._wave_output_diagnostics()
          ready = result['device_count'] > 0 and result['format_query_result'] == 0
          result.update(status='READY' if ready else 'UNAVAILABLE', actual_playback='NOT_RUN')
          pathlib.Path('ci-results/audio-endpoint.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result), flush=True)
          raise SystemExit(0 if ready else 1)
          '@
          $queryEndpoint | & $env:CARR_PYTHON -I -B -
          if ($LASTEXITCODE -ne 0) { throw 'The runner has no WinMM endpoint accepting the unchanged reader fixture. Actual playback remains required.' }
          if ($serviceErrors.Count) { throw ($serviceErrors -join '; ') }

      - name: Preserve early audio endpoint diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-audio-endpoint-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-results/audio-services.json
            carr-library/ci-results/audio-endpoint.json
            carr-library/ci-results/endpoint-evaluation.json
            carr-library/ci-results/endpoint-evaluation.txt
            carr-library/ci-results/signature-json-ps51.json
            carr-library/ci-results/signature-json-ps7.json
            carr-library/ci-results/tested-commit.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Locate installed Microsoft x64 launcher tools
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: launcher_tools
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Installed x64 MSVC toolchain not found.' }
          "CARR_VSDEVCMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_LAUNCHER_DIR=$env:RUNNER_TEMP\carr-integrated-launcher" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile the private native launch entry from this source
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.launcher_tools.outcome == 'success' }}
        id: launcher_build
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "packaging\native-launcher\build_msvc.ps1" -OutputDirectory "%CARR_LAUNCHER_DIR%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Execute the actual native launcher process contract
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.launcher_build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B packaging/native-launcher/probe_windows.py --launcher "$env:CARR_LAUNCHER_DIR/ResearchLibrary.exe" --child "$env:CARR_LAUNCHER_DIR/windows_child_probe.exe" --report 'ci-results/native-launcher-process.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$env:CARR_LAUNCHER_DIR/build-evidence.json" -Destination 'ci-results/native-launcher-build.json'

      - name: Prepare the exact reviewed private Windows audio runtime
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: audio_runtime
        timeout-minutes: 10
        run: |
          $audioRuntime = Join-Path $env:RUNNER_TEMP 'carr-audio-runtime'
          & $env:CARR_PYTHON -I -B packaging/prepare_windows_audio.py --download --output $audioRuntime | Tee-Object 'ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_AUDIO_RUNTIME=$audioRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $audioRuntime 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check the installed application through its self-test entrypoint
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require locale-independent backup and real process cancellation regressions
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/packaging/test_ci_check.py 2>&1 | Tee-Object 'ci-results/runner-regressions.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousUtf8 = $env:PYTHONUTF8
          try {
            $env:PYTHONUTF8 = '0'
            & $env:CARR_PYTHON scripts/ci_check.py --jobs 2 tests/storage/test_v3_state_backup.py tests/e2e/test_pdf_review_cancellation.py 2>&1 | Tee-Object 'ci-results/windows-locale-cancellation-regressions.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PYTHONUTF8 = $previousUtf8
          }

      - name: Check the installed offline OCR catalogue and console entrypoint
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native OCR catalogue and model manager
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_models_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-models.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Exercise native academic references and reading controls
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native keyboard preferences and installed OCR selection
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_keyboard_smoke.py 2>&1 | Tee-Object 'ci-results/native-keyboard-preferences.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_ocr_languages_smoke.py 2>&1 | Tee-Object 'ci-results/native-ocr-languages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed native command palette
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_command_palette_smoke.py 2>&1 | Tee-Object 'ci-results/native-command-palette.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/windows_workflow_productivity_smoke.py 2>&1 | Tee-Object 'ci-results/native-workflow-productivity.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the pinned EPUB conformance checker
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: epubcheck_runtime
        timeout-minutes: 5
        run: |
          $pin = Get-Content -Raw 'packaging/epubcheck.json' | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'carr-epubcheck-5.3.0.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'The EPUBCheck archive does not match its reviewed size and SHA256.' }
          $java = Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe'
          if (-not (Test-Path -LiteralPath $java -PathType Leaf)) { throw 'The required installed Java 17 runtime is unavailable.' }
          "CARR_EPUBCHECK_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_EPUBCHECK_JAVA=$java" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the exact official offline DAISY validation schemas
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: daisy_schemas
        timeout-minutes: 3
        run: |
          $schemas = Join-Path $env:RUNNER_TEMP 'carr-daisy-validation-schemas'
          & $env:CARR_PYTHON -I -B scripts/prepare_daisy_schemas.py --destination $schemas --report ci-results/daisy-schema-preparation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_DAISY_SCHEMAS=$schemas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require source and installed actual DAISY publication structure
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' && steps.daisy_schemas.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $failures = @()
          $previousPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = (Resolve-Path 'src').Path
            & $env:CARR_PYTHON -B scripts/daisy_schema_acceptance.py --schemas $env:CARR_DAISY_SCHEMAS --report ci-results/source-daisy-schema.json 2>&1 | Tee-Object 'ci-results/source-daisy-schema.txt'
            if ($LASTEXITCODE -ne 0) { $failures += 'source-daisy-schema' }
          } finally { $env:PYTHONPATH = $previousPythonPath }
          & $env:CARR_PYTHON -I -B scripts/daisy_schema_acceptance.py --require-installed --schemas $env:CARR_DAISY_SCHEMAS --report ci-results/installed-daisy-schema.json 2>&1 | Tee-Object 'ci-results/installed-daisy-schema.txt'
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-daisy-schema' }
          if ($failures.Count) { throw ('DAISY structural validation failed: ' + ($failures -join ', ')) }
      - name: Verify actual native publication controls and EPUB conformance
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' && steps.epubcheck_runtime.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_publishing_smoke.py --require-installed 2>&1 | Tee-Object 'ci-results/native-epub-publication.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B scripts/epubcheck_acceptance.py --archive $env:CARR_EPUBCHECK_ARCHIVE --java $env:CARR_EPUBCHECK_JAVA --lock packaging/epubcheck.json --report ci-results/installed-epubcheck.json --require-installed 2>&1 | Tee-Object 'ci-results/installed-epubcheck.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile actual Windows SDK WinMM layout evidence
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.launcher_tools.outcome == 'success' }}
        id: winmm_sdk_layout
        shell: cmd
        run: |
          call "%CARR_VSDEVCMD%" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /W4 /WX /TC tests\audio\native_winmm_layout.c /Fo"%RUNNER_TEMP%\carr-winmm-layout.obj" /Fe"%RUNNER_TEMP%\carr-winmm-layout.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\carr-winmm-layout.exe" > "ci-results\native-winmm-sdk-layout.json"
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify actual installed Windows SAPI speech and native preview
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/audio/native_sapi_smoke.py 2>&1 | Tee-Object 'ci-results/native-sapi-speech.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B tests/audio/native_playback_probe.py --sdk-layout 'ci-results/native-winmm-sdk-layout.json' 2>&1 | Tee-Object 'ci-results/native-audio-preview.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Require actual Windows capture process ownership
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/audio/native_recording_process_probe.py --report 'ci-results/native-recording-process.json' 2>&1 | Tee-Object 'ci-results/native-recording-process.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require source and installed native recording controls
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $ffmpeg = Join-Path $env:CARR_AUDIO_RUNTIME 'bin/ffmpeg.exe'
          $previousSourcePath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = Join-Path (Get-Location).Path 'src'
            & $env:CARR_PYTHON -B scripts/windows_recording_smoke.py --ffmpeg $ffmpeg --report 'ci-results/source-recording-controls.json' 2>&1 | Tee-Object 'ci-results/source-recording-controls.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PYTHONPATH = $previousSourcePath
          }
          & $env:CARR_PYTHON -I -B scripts/windows_recording_smoke.py --ffmpeg $ffmpeg --report 'ci-results/installed-recording-controls.json' --expect-installed 2>&1 | Tee-Object 'ci-results/installed-recording-controls.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require measured capture from the explicitly reviewed virtual input
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' && github.event_name == 'push' && github.repository == 'Oleksii-debug/AudioTacticalFPS' && github.ref == 'refs/heads/carr/ci-endpoint-evaluation-20261127' }}
        timeout-minutes: 3
        run: |
          $ffmpeg = Join-Path $env:CARR_AUDIO_RUNTIME 'bin/ffmpeg.exe'
          & $env:CARR_PYTHON -I -B scripts/windows_recording_device_probe.py --ffmpeg $ffmpeg --report 'ci-results/recording-device-inventory.json' --inventory-only 2>&1 | Tee-Object 'ci-results/recording-device-inventory.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = Get-Content -Raw 'ci-results/recording-device-inventory.json' | ConvertFrom-Json
          # Exact expected capture label from pinned Pack46 INF:
          # VBCABLE.INPUTNAME1="CABLE Output", DeviceName="VB-Audio Virtual Cable".
          # An absent, renamed or ambiguous endpoint must fail, never select a microphone.
          $selected = @($inventory.devices | Where-Object { $_.name -ceq 'CABLE Output (VB-Audio Virtual Cable)' })
          if ($inventory.status -cne 'PASS' -or $selected.Count -ne 1) { throw 'The exact reviewed virtual capture input is unavailable or ambiguous; inspect the retained inventory.' }
          & $env:CARR_PYTHON -I -B scripts/windows_recording_device_probe.py --ffmpeg $ffmpeg --report 'ci-results/native-recording-device.json' --device-id $selected[0].id 2>&1 | Tee-Object 'ci-results/native-recording-device.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve initial native playback and recording diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-windows-recording-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-results/*recording*.json
            carr-library/ci-results/*recording*.txt
            carr-library/ci-results/native-winmm-sdk-layout.json
            carr-library/ci-results/native-audio-preview.json
          if-no-files-found: warn
          retention-days: 7

      - name: Exercise native audio studio and provider settings
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && steps.audio_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_audio_studio_smoke.py 2>&1 | Tee-Object 'ci-results/native-audio-studio.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B tests/ui/native_audio_effects_smoke.py 2>&1 | Tee-Object 'ci-results/native-audio-effects.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B tests/assistant/native_credentials_probe.py 2>&1 | Tee-Object 'ci-results/native-provider-credentials.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B tests/ui/native_provider_settings_smoke.py 2>&1 | Tee-Object 'ci-results/native-provider-settings.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -X utf8 tests/ui/native_voice_settings_smoke.py 2>&1 | Tee-Object 'ci-results/native-voice-settings.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify explicit provider policy and local planner using local HTTP fixtures
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -m pytest -o addopts= -o xfail_strict=true --junitxml=ci-results/provider-policy.xml tests/assistant/test_provider_policy.py tests/assistant/test_local_planner.py tests/assistant/test_providers.py tests/assistant/test_translation.py tests/academic_integration/test_doi.py 2>&1 | Tee-Object 'ci-results/provider-policy.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import json,xml.etree.ElementTree as E; cases=list(E.parse('ci-results/provider-policy.xml').iter('testcase')); failed=sum(any(c.find(t) is not None for t in ('failure','error')) for c in cases); skipped=sum(c.find('skipped') is not None for c in cases); assert len(cases)>0 and failed==skipped==0; print(json.dumps(dict(status='PASS',passed=len(cases),failed=failed,skipped=skipped,transport='local HTTP fixture')))" | Tee-Object 'ci-results/provider-policy.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain core-only fallback and offline startup coverage
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        id: desktop_dependencies
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pairs=re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M); pins=dict(pairs); assert pins and len(pairs)==len({re.sub(r'[-_.]+','-',n).lower() for n,_ in pairs}), 'Empty or duplicate normalized dependency pins'; actual={n:m.version(n) for n in pins}; bom=json.loads(pathlib.Path('packaging/windows-semantic-sbom.cdx.json').read_text()); expected={c['name']:c['version'] for c in bom['components']}; assert len(pins)==51 and len(pins)==len(bom['components']) and actual==pins==expected; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' }}
        id: ocr_runtime
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise actual managed OCR and ordered choices with Unicode Windows paths
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' && steps.ocr_runtime.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_managed_ocr.py tests/e2e/test_managed_ocr_import.py tests/extract/test_ocr_languages.py tests/ui/test_ocr_selection.py 2>&1 | Tee-Object 'ci-results/managed-ocr-unicode.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }


      - name: Require exact source and installed OCR and result-page controls
        if: ${{ !cancelled() && steps.desktop_dependencies.outcome == 'success' && steps.ocr_runtime.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $failures = @()
          & $env:CARR_PYTHON -I -B -X utf8 scripts/windows_automatic_ocr_smoke.py --source src --report ci-results/source-automatic-ocr.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-automatic-ocr' }
          & $env:CARR_PYTHON -I -B -X utf8 scripts/windows_automatic_ocr_smoke.py --expect-installed --report ci-results/installed-automatic-ocr.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-automatic-ocr' }
          & $env:CARR_PYTHON -I -B -X utf8 scripts/windows_search_pagination_smoke.py --source . --report ci-results/source-search-pagination.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-search-pagination' }
          & $env:CARR_PYTHON -I -B -X utf8 scripts/windows_search_pagination_smoke.py --expect-installed --report ci-results/installed-search-pagination.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-search-pagination' }
          if ($failures.Count) { throw ('Required native OCR/search failures: ' + ($failures -join ', ')) }

