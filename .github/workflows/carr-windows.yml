      - name: Prepare the pinned local model through the existing upstream verifier
        id: local_model
        if: ${{ !cancelled() && steps.desktop_dependencies.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'carr-model-ci/minilm'
          $modelManifest = Join-Path $env:RUNNER_TEMP 'carr-model-ci/model-manifest.json'
          $acquire = @'
          import importlib.util, json, pathlib, shutil, sys
          from huggingface_hub import hf_hub_download
          spec = importlib.util.spec_from_file_location('model_build', pathlib.Path('packaging/model_bundle.py').resolve())
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          target, manifest = map(pathlib.Path, sys.argv[1:])
          target.mkdir(parents=True, exist_ok=False)
          for name in sorted(helper.FILES):
              source = hf_hub_download(helper.REPO, name, revision=helper.REVISION, cache_dir=target.parent / 'cache', token=False)
              shutil.copyfile(source, target / name)
          proof = helper.seal(target)
          with manifest.open('x', encoding='utf-8') as stream:
              json.dump(proof, stream, sort_keys=True)
          print(json.dumps({'status': 'PASS', 'revision': helper.REVISION, 'files': len(proof['hashes'])}))
          '@
          # Only this explicit build-time child may fetch the pinned public model.
          # Importing the application before acquisition would enforce offline mode.
          $env:HF_HUB_OFFLINE = '0'
          try {
            $acquire | & $env:CARR_PYTHON -I -B - $model $modelManifest | Tee-Object 'ci-results/model-acquisition.json'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:HF_HUB_OFFLINE = '1'
          }
          & $env:CARR_PYTHON -I -B -c "import sys; from carr_library.semantic import verify_model_bundle; verify_model_bundle(sys.argv[1], sys.argv[2]); print('PASS: exact approved local model')" $model $modelManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_MODEL_DIR=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_CI_MODEL_MANIFEST=$modelManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install and exercise the complete bundle with runtime egress blocked
        id: complete_bundle
        if: ${{ !cancelled() && steps.local_model.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' }}
        # Preserve both required acceptance inventories and their exact source/installed proofs.
        timeout-minutes: 35
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $wheelhouse = Join-Path $bundleWork 'wheelhouse'
          $applicationWheels = Join-Path $bundleWork 'application'
          $baseBundle = Join-Path $bundleWork 'base bundle'
          $nativeBundle = Join-Path $bundleWork 'native bundle'
          $bundle = Join-Path $bundleWork 'complete bundle'
          New-Item -ItemType Directory -Force $wheelhouse, $applicationWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes -r packaging/windows-semantic-cp311.lock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip wheel --no-deps --wheel-dir $applicationWheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $applicationWheels -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel.' }
          $applicationWheel = $wheels[0].FullName
          New-Item -ItemType Directory -Force 'ci-results/application-wheel' | Out-Null
          Copy-Item -LiteralPath $applicationWheel -Destination 'ci-results/application-wheel/'
          $sourceCommit = (git rev-parse HEAD).Trim()
          & $env:CARR_PYTHON -I -B -c "import sys,json,pathlib; sys.path.insert(0,str(pathlib.Path('packaging').resolve())); from source_wheel import verify_application_wheel; report=verify_application_wheel(pathlib.Path(sys.argv[1]),pathlib.Path.cwd().parent,sys.argv[2]); print(json.dumps(dict(report,status='PASS'),sort_keys=True))" $applicationWheel $sourceCommit | Tee-Object 'ci-results/source-wheel-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:CARR_NATIVE_LAUNCHER -or -not $env:CARR_CI_AUDIO_DIR) { throw 'Exact native launcher and canonical audio runtime prerequisites are missing.' }
          $audioRuntime = $env:CARR_CI_AUDIO_DIR
          $runtime = Get-Content packaging/windows-python.json -Raw | ConvertFrom-Json
          $pythonArchive = Join-Path $bundleWork 'windows-python.tar.gz'
          Invoke-WebRequest -Uri $runtime.download.url -OutFile $pythonArchive
          $archiveHash = (Get-FileHash -LiteralPath $pythonArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $runtime.download.sha256) { throw 'Pinned Python archive checksum mismatch.' }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          if (!(Test-Path -LiteralPath $ocrSource -PathType Leaf) -or $ocr -ne $env:CARR_CI_OCR_DIR) { throw 'Verified source-test OCR runtime is missing.' }
          $nativeLock = Get-Content packaging/native-runtime/source-lock.json -Raw | ConvertFrom-Json
          $nativePackage = Join-Path $bundleWork 'native-runtime.conda'
          Invoke-WebRequest -Uri $nativeLock.package.url -OutFile $nativePackage
          if ((Get-Item -LiteralPath $nativePackage).Length -ne $nativeLock.package.size) { throw 'Pinned native package size mismatch.' }
          if ((Get-FileHash -LiteralPath $nativePackage -Algorithm SHA256).Hash.ToLowerInvariant() -ne $nativeLock.package.sha256) { throw 'Pinned native package checksum mismatch.' }
          $nativeRuntime = Join-Path $bundleWork 'native-runtime'
          & $env:CARR_PYTHON packaging/prepare_native_runtime.py --package $nativePackage --output $nativeRuntime | Tee-Object 'ci-results/native-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/build_windows_bundle.py --wheel $applicationWheel --wheelhouse $wheelhouse --lock packaging/windows-semantic-cp311.lock --python-archive $pythonArchive --model-dir $env:CARR_CI_MODEL_DIR --model-manifest $env:CARR_CI_MODEL_MANIFEST --ocr-dir $ocr --ocr-source-archive $ocrSource --source-commit $sourceCommit --sbom packaging/windows-semantic-sbom.cdx.json --launcher-dir $env:CARR_NATIVE_LAUNCHER --output $baseBundle | Tee-Object 'ci-results/full-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_native_runtime.py --bundle $baseBundle --native-runtime $nativeRuntime --output $nativeBundle | Tee-Object 'ci-results/full-bundle-native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_TRANSFER_BUNDLE=$nativeBundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:CARR_PYTHON packaging/add_audio_runtime.py --bundle $nativeBundle --audio-runtime $audioRuntime --output $bundle | Tee-Object 'ci-results/full-bundle-audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Join-Path $bundle 'bundle-manifest.json'
          $manifestEvidence = 'ci-results/bundle-manifests'
          New-Item -ItemType Directory -Force $manifestEvidence | Out-Null
          foreach ($relative in @('bundle-manifest.json', 'models/minilm-manifest.json', 'ocr/ocr-manifest.json', 'native-runtime/native-manifest.json', 'audio-runtime/audio-manifest.json')) {
            $metadata = Join-Path $bundle $relative
            if (!(Test-Path -LiteralPath $metadata -PathType Leaf)) { throw "Missing sealed metadata: $relative" }
            Copy-Item -LiteralPath $metadata -Destination (Join-Path $manifestEvidence (Split-Path $relative -Leaf))
          }
          $expectedSbom = (Get-FileHash -Algorithm SHA256 -LiteralPath 'packaging/windows-semantic-sbom.cdx.json').Hash.ToLowerInvariant()
          $sealedSbom = Join-Path $bundle 'runtime-sbom.cdx.json'
          if (!(Test-Path -LiteralPath $sealedSbom -PathType Leaf)) { throw 'Missing sealed SBOM' }
          $actualSbom = (Get-FileHash -Algorithm SHA256 -LiteralPath $sealedSbom).Hash.ToLowerInvariant()
          $sbomManifest = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json
          if ($actualSbom -ne $expectedSbom -or $sbomManifest.files.'runtime-sbom.cdx.json' -ne $expectedSbom) { throw 'SBOM seal mismatch' }
          @{ status='PASS'; sha256=$actualSbom } | ConvertTo-Json | Set-Content 'ci-results/sealed-sbom.json'
          $manifestBefore = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $installedPython = Join-Path $bundle '.venv/Scripts/python.exe'
          & $env:CARR_PYTHON -I -B -c "import hashlib,json,pathlib,sys; root=pathlib.Path(sys.argv[1]); expected=pathlib.Path('packaging/windows-semantic-sbom.cdx.json').read_bytes(); actual=(root/'runtime-sbom.cdx.json').read_bytes(); manifest=json.loads((root/'bundle-manifest.json').read_text()); assert actual==expected; assert manifest['files']['runtime-sbom.cdx.json']==hashlib.sha256(actual).hexdigest(); print(json.dumps(dict(status='PASS',runtime_sbom='EXACT_SOURCE_BYTES',sealed_sha256=hashlib.sha256(actual).hexdigest())))" $bundle | Tee-Object 'ci-results/full-bundle-sbom.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Finish test-only acquisition before the offline execution boundary.
          $testWheels = Join-Path $env:RUNNER_TEMP 'carr-test-wheels'
          New-Item -ItemType Directory -Force $testWheels | Out-Null
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --dest $testWheels pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($env:CARR_PUBLICATION_JAVA, $bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $installedPython, (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ResearchLibrary.exe'), (Join-Path $bundle 'ocr/tesseract.exe'), (Join-Path $bundle 'audio-runtime/bin/ffmpeg.exe'), (Join-Path $bundle 'audio-runtime/bin/ffprobe.exe'), (Join-Path $bundle 'audio-runtime/bin/ffplay.exe'), (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'), (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          $rulePrefix = 'CARR-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          $previousBundlePath = $env:PATH
          $previousBundleProgram = $env:CARR_PROGRAM_DIR
          $previousBundleCiAudio = $env:CARR_CI_AUDIO
          $previousBundleAudioDir = $env:CARR_CI_AUDIO_DIR
          $previousBundleV3Audio = $env:CARR_V3_AUDIO
          try {
          # Temporary rules on this disposable CI VM. Fail before execution if
          # Windows Firewall cannot enforce every runtime program's outbound block.
          Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
          foreach ($program in $programs) {
            $ruleName = $rulePrefix + '-' + $ruleNames.Count
            $ruleNames += $ruleName
            New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
          }
          $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
          if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline checks require enabled Windows Firewall profiles.' }
          $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
          if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline execution rules are not active.' }
          $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
          if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline execution rules do not cover the intended programs.' }
          @{ status='PASS'; profiles_enabled=@($profiles.Name); outbound_blocked_programs=$filters; phase='installation, native desktop, multilingual inference and scanned-source research' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-results/full-bundle-firewall.json'
          & $bundledPython -I -B (Join-Path $bundle 'install_windows.py') 2>&1 | Tee-Object 'ci-results/core-bundle-install.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B -m carr_library --self-test | Tee-Object 'ci-results/core-bundle-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Use the existing verified, firewall-blocked installed Python and model.
          # Synthetic relevance smoke evidence is not a held-out quality verdict.
          & $installedPython -I -B -X utf8 scripts/evaluate_retrieval.py --fixture tests/search/fixtures/retrieval_smoke_uk_en_sk.json --model-dir (Join-Path $bundle 'models/minilm') --k 5 | Tee-Object 'ci-results/full-bundle-retrieval-smoke.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $retrieval = Get-Content -Raw -LiteralPath 'ci-results/full-bundle-retrieval-smoke.json' | ConvertFrom-Json
          if ($retrieval.schema -ne 'carr-retrieval-evaluation/1' -or $retrieval.source_checks -ne 'PASS' -or $retrieval.documents -ne 12 -or $retrieval.fixture_sha256 -ne 'fba3139eaf29a3cb70fa300f392ab8441579878eecd6399ec4bad9e6cae7ed71' -or $retrieval.qualification -ne 'NOT_DECIDED') { throw 'Retrieval smoke evidence identity mismatch.' }
          foreach ($mode in @('thematic', 'semantic')) {
            if (@($retrieval.modes.$mode.cases).Count -ne 18) { throw 'Incomplete retrieval smoke evidence.' }
          }
          # The temporary evaluation library is cold; count actual native embedding work.
          if ($retrieval.modes.semantic.cases[0].cache.embedded_texts -le 0) { throw 'No actual cold semantic embeddings recorded.' }
          & $installedPython -I -B scripts/windows_audio_runtime_smoke.py --bundle $bundle 2>&1 | Tee-Object 'ci-results/full-bundle-audio-native.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B packaging/native-launcher/probe_installed_windows.py --bundle-root $bundle --report 'ci-results/installed-native-launcher.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARR_PROGRAM_DIR = $bundle
          $sealedAudio = Join-Path $bundle 'audio-runtime'
          # The already verified sealed tools must also serve direct AudioRuntime
          # constructors in native probes, without inheriting the source runtime.
          $env:CARR_CI_AUDIO = $sealedAudio
          $env:CARR_CI_AUDIO_DIR = $sealedAudio
          $env:CARR_V3_AUDIO = $sealedAudio
          $env:PATH = (Join-Path $sealedAudio 'bin') + ';' + $previousBundlePath
          & $installedPython -I -B -c "import os,runpy,sys; from carr_library.native_runtime import activate_bundled_runtime; handle=activate_bundled_runtime(); assert handle is not None; os.environ['PATH']=os.path.join(os.environ['CARR_PROGRAM_DIR'],'audio-runtime','bin')+os.pathsep+os.environ.get('PATH',''); runpy.run_path(sys.argv[1],run_name='__main__')" (Resolve-Path scripts/windows_v3_smoke.py).Path 2>&1 | Tee-Object 'ci-results/installed-native-v3.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B scripts/windows_assistant_smoke.py --bundle $bundle --result 'ci-results/full-bundle-assistant.json' 2>&1 | Tee-Object 'ci-results/full-bundle-assistant.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B -c "import os,runpy,sys; os.environ['CARR_OCR_DIR']=os.path.join(os.environ['CARR_PROGRAM_DIR'],'ocr'); sys.argv=[sys.argv[1],'--installed']; runpy.run_path(sys.argv[0],run_name='__main__')" (Resolve-Path scripts/windows_automatic_ocr_smoke.py).Path 2>&1 | Tee-Object 'ci-results/full-bundle-automatic-ocr.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B scripts/windows_audio_metadata_smoke.py 2>&1 | Tee-Object 'ci-results/full-bundle-audio-metadata.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B scripts/windows_workflow_templates_smoke.py --installed 2>&1 | Tee-Object 'ci-results/full-bundle-workflow-templates.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B scripts/ocr_catalog_smoke.py --model-directory (Join-Path $bundle 'ocr/tessdata') | Tee-Object 'ci-results/offline-bundle-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedPython -I -B scripts/windows_installer_launchers_smoke.py --bundle $bundle 2>&1 | Tee-Object 'ci-results/installed-launchers.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # This probe imports wx first: hold the application's verified DLL
          # directory handle before loading that native extension.
          & $installedPython -I -B -c "import runpy,sys; from carr_library.native_runtime import activate_bundled_runtime; handle=activate_bundled_runtime(); assert handle is not None; runpy.run_path(sys.argv[1],run_name='__main__')" (Resolve-Path tests/ui/probe_source_open_native.py).Path 2>&1 | Tee-Object 'ci-results/core-bundle-native.txt'
