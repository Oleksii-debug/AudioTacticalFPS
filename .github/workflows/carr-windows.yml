name: CARR Windows integrated desktop

on:
  pull_request:
    branches: [carr-library, carr/v3-local-studio-20261126-a4f9]
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  push:
    branches: [carr/finish-desktop-20261126, carr/academic-research-e021-20261126, carr/academic-workbench-20261126, carr-library, carr/academic-research-workbench, carr/academic-search-20261126, carr/notebook-release-ascii-e021-20261126, carr/v3-local-studio-20261126-a4f9, 'carr/v3-acceptance-*']
    paths:
      - carr-library/**
      - .github/workflows/carr-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    name: Windows x64 / CPython 3.11 / integrated desktop
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Compile the exact source and regression entrypoints
        run: |
          python -m compileall -q src tests scripts packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the actual desktop package in a fresh environment
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-windows-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-results' | Out-Null
          git rev-parse HEAD | Set-Content 'ci-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 setuptools==84.2.1 wheel==0.48.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed application through its self-test entrypoint
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -m carr_library --self-test | Tee-Object 'ci-results/installed-self-test.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installed offline OCR catalogue and console entrypoint
        timeout-minutes: 2
        run: |
          & $env:CARR_PYTHON -I -B scripts/ocr_catalog_smoke.py | Tee-Object 'ci-results/installed-ocr-catalogue.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrModels = Join-Path (Split-Path $env:CARR_PYTHON) 'research-library-ocr-models.exe'
          & $ocrModels list --profile best --query ukr | Tee-Object 'ci-results/installed-ocr-catalogue-console.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native academic references and reading controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_academic_smoke.py 2>&1 | Tee-Object 'ci-results/native-academic-library.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native advanced query builder and source search
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/probe_advanced_search_native.py 2>&1 | Tee-Object 'ci-results/native-advanced-search.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain explicit core-only fallback and offline startup coverage
        timeout-minutes: 5
        run: |
          & $env:CARR_PYTHON -I -B -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('onnxruntime') is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON scripts/ci_check.py tests/e2e/test_semantic_fallback_status.py tests/e2e/test_offline_startup.py 2>&1 | Tee-Object 'ci-results/core-fallback.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Match production dependencies before required source suites
        timeout-minutes: 10
        run: |
          & $env:CARR_PYTHON -m pip install --only-binary=:all: --require-hashes -r packaging/windows-semantic-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-semantic-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==53 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'ci-results/full-lock-source-inventory.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the verified OCR engine before its required source regression
        timeout-minutes: 10
        run: |
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          New-Item -ItemType Directory -Force $bundleWork | Out-Null
          & $env:CARR_PYTHON -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = Join-Path $bundleWork 'ocr'
          $ocrSource = Join-Path $bundleWork 'ocr-corresponding-source.tar'
          & $env:CARR_PYTHON packaging/prepare_windows_ocr.py --cache (Join-Path $bundleWork 'ocr-cache') --output $ocr --source-archive $ocrSource --download | Tee-Object 'ci-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise actual managed OCR with Unicode Windows paths
        timeout-minutes: 5
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_managed_ocr.py tests/e2e/test_managed_ocr_import.py tests/ui/test_ocr_selection.py 2>&1 | Tee-Object 'ci-results/managed-ocr-unicode.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
          }

      - name: Require Windows OCR script models and reviewed publication boundaries early
        timeout-minutes: 4
        run: |
          $previousPath = $env:PATH
          $previousOcr = $env:CARR_OCR_DIR
          $previousTessdata = $env:TESSDATA_PREFIX
          try {
            $env:PATH = "$env:CARR_CI_OCR_DIR;$previousPath"
            $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
            $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
            & $env:CARR_PYTHON scripts/ci_check.py tests/extract/test_ocr_languages.py tests/extract/test_ocr_runtime.py tests/e2e/test_pdf_review_cancellation.py tests/packaging/test_delivery_archive.py 2>&1 | Tee-Object 'ci-results/windows-regression-boundaries.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $previousPath
            $env:CARR_OCR_DIR = $previousOcr
            $env:TESSDATA_PREFIX = $previousTessdata
          }

      - name: Prepare the sealed local FFmpeg runtime before audio regressions
        timeout-minutes: 8
        run: |
          $audioRoot = Join-Path $env:RUNNER_TEMP 'carr-pinned-audio'
          New-Item -ItemType Directory -Force $audioRoot | Out-Null
          $pin = & $env:CARR_PYTHON -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $audioRoot 'ffmpeg-pinned.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned FFmpeg archive mismatch.' }
          $audioBin = Join-Path $audioRoot 'audio-runtime'
          & $env:CARR_PYTHON packaging/prepare_ffmpeg_runtime.py --archive $archive --destination $audioBin --verify-native | Tee-Object 'ci-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_AUDIO_DIR=$audioBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_FFMPEG=$(Join-Path $audioBin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $audioBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run required integrated source workflows
        timeout-minutes: 30
        run: |
          # These real-engine source tests must discover the exact prepared
          # runtime. Restrict the override to this source-test process.
          $env:PATH = $env:CARR_CI_OCR_DIR + [IO.Path]::PathSeparator + $env:PATH
          $env:CARR_OCR_DIR = $env:CARR_CI_OCR_DIR
          $env:TESSDATA_PREFIX = Join-Path $env:CARR_CI_OCR_DIR 'tessdata'
          & $env:CARR_PYTHON -I -B -c "import os,pathlib; from carr_library.extract.ocr_runtime import verify_ocr_bundle; runtime=verify_ocr_bundle(pathlib.Path(os.environ['CARR_CI_OCR_DIR'])); runtime.require_languages('eng+ukr+slk',orientation=True); print('Verified prepared OCR runtime admitted for strict native source cases.')"
