        if: ${{ !cancelled() && steps.desktop_runtime.conclusion == 'success' }}
        timeout-minutes: 3
        run: |
          $pin = Get-Content packaging/epubcheck.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'carr-epubcheck-5.3.0.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'EPUBCheck archive differs from the reviewed pin.' }
