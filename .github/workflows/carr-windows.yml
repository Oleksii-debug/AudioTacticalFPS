          '@
          $composeFullLock | & $env:CARR_PYTHON -I -B - $fullLock | Tee-Object 'ci-results/full-client-lock.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON -m pip download --only-binary=:all: --no-deps --require-hashes --find-links $env:CARR_SPELL_WHEELHOUSE -r $fullLock --dest $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $composeFullSbom = @'
          import importlib.util, json, pathlib, sys
          from hashlib import sha256
          from packaging.markers import default_environment
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          spec = importlib.util.spec_from_file_location('ci_full_bundle', pathlib.Path('packaging/build_windows_bundle.py'))
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          lock, wheelhouse, destination = map(pathlib.Path, sys.argv[1:4])
          pins = builder.read_lock(lock)
          base_path = pathlib.Path('packaging/windows-semantic-sbom.cdx.json')
          review_path = pathlib.Path('packaging/trusted-client-dependencies.json')
          bom = json.loads(base_path.read_text(encoding='utf-8'))
          items = json.loads(review_path.read_text(encoding='utf-8'))['dependencies']
          import carr_library
          vendor_files = builder.vendored_sources_from_package(pathlib.Path(carr_library.__file__).parent)
          components = builder.runtime_sbom_components(bom, vendor_files=vendor_files)
          selected = {}
          for path in wheelhouse.iterdir():
              builder.regular(path)
              assert path.suffix == '.whl', path.name
              name, version, metadata = builder.wheel_metadata(path)
              assert name not in selected and name in pins and str(version) == pins[name][0]
              assert builder.sha256(path) in pins[name][1], path.name
              selected[name] = (path, version, metadata)
          assert set(selected) == set(pins)
          builder.verify_dependency_closure(selected)
          new_names = set()
          for row in items:
              name = row['name']
              wheel = selected[name][0]
              assert wheel.name == row['filename'] and builder.sha256(wheel) == row['sha256'], name
              if name in components:
                  assert components[name]['version'] == row['version'], name
                  continue
              component = dict(type='library', name=name, version=row['version'],
                  purl='pkg:pypi/' + name + '@' + row['version'],
                  **{'bom-ref': 'trusted-client:' + name + '@' + row['version']},
                  hashes=[dict(alg='SHA-256', content=row['sha256'])],
                  licenses=[dict(expression=row['license_expression'])],
                  externalReferences=[dict(type='distribution', url=row['source'])])
              if row.get('vendored_license_expression'):
                  component['properties'] = [dict(name='carr:vendored-license-expression', value=row['vendored_license_expression'])]
              components[name] = component
              bom['components'].append(component)
              new_names.add(name)
          spell_sbom = pathlib.Path('packaging/spellcheck-sbom.json')
          spell_bom = json.loads(spell_sbom.read_text(encoding='utf-8'))
          assert len(spell_bom['components']) == 1
          spell_component = spell_bom['components'][0]
          assert spell_component['name'] == 'spylls' and 'spylls' not in components
          assert spell_component['version'] == pins['spylls'][0]
          assert spell_component['hashes'] == [dict(alg='SHA-256', content=builder.sha256(selected['spylls'][0]))]
          assert spell_component['licenses'] == [dict(license=dict(id='MPL-2.0'))]
          assert not selected['spylls'][2].get_all('Requires-Dist', [])
          assert spell_bom['dependencies'] == [dict(ref=spell_component['bom-ref'], dependsOn=[])]
          components['spylls'] = spell_component
          bom['components'].append(spell_component)
          new_names.add('spylls')
          assert {(n, c['version']) for n, c in components.items()} == {(n, v) for n, (v, _) in pins.items()}
          assert len(components) == 57 and components['quickjs-ng']['version'] == '0.18.0.2'
          environment = default_environment()
          environment.update(os_name='nt', sys_platform='win32', platform_system='Windows', platform_machine='AMD64',
              python_version='3.11', python_full_version='3.11.0', implementation_name='cpython',
              platform_python_implementation='CPython', extra='')
          for name in sorted(new_names):
              dependencies = set()
              for raw in selected[name][2].get_all('Requires-Dist', []):
                  requirement = Requirement(raw)
                  if requirement.marker and not requirement.marker.evaluate(environment):
                      continue
                  dependencies.add(components[canonicalize_name(requirement.name)]['bom-ref'])
              bom['dependencies'].append({'ref': components[name]['bom-ref'], 'dependsOn': sorted(dependencies)})
          root_ref = bom['metadata']['component']['bom-ref']
          root_dependencies = next(item for item in bom['dependencies'] if item['ref'] == root_ref)
          root_dependencies['dependsOn'] = sorted(set(root_dependencies.get('dependsOn', ())) |
              {components[row['name']]['bom-ref'] for row in items} | {spell_component['bom-ref']})
          bom['metadata'].setdefault('tools', []).append(dict(vendor='Resonance', name='checked CI runtime union', version='1'))
          bom['metadata'].setdefault('properties', []).extend([
              dict(name='carr:base-sbom-sha256', value=sha256(base_path.read_bytes()).hexdigest()),
              dict(name='carr:trusted-client-review-sha256', value=sha256(review_path.read_bytes()).hexdigest()),
              dict(name='carr:combined-lock-sha256', value=sha256(lock.read_bytes()).hexdigest()),
              dict(name='carr:spellcheck-sbom-sha256', value=sha256(spell_sbom.read_bytes()).hexdigest())])
