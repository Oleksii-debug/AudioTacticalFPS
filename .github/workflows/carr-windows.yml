          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $testedWheel -Algorithm SHA256).Hash.ToLowerInvariant() -cne $wheelProof.wheel_sha256) { throw 'Retained application wheel changed during acceptance.' }
          $nativeProof = Get-Content -Raw -LiteralPath 'ci-results/installed-native-launcher.json' | ConvertFrom-Json
          if ($nativeProof.status -cne 'passed' -or $nativeProof.launcher_sha256 -cne $expectedLauncher -or $nativeProof.actual_installed_app_self_test_verified -ne $true -or ($nativeProof.checks -join ',') -cne '--check-installation,--self-test') { throw 'The exact installed native launch entry did not pass both real application checks.' }
          if ($env:CARR_PRIOR_GATES_PASSED -cne 'true') { throw 'Earlier required gates failed; no release handoff may be published.' }
          $handoff = @{
            schema=1; status='PASS'; repository=$env:GITHUB_REPOSITORY
