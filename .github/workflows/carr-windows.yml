          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $localAudioManifest = Join-Path $localAudioBundle 'bundle-manifest.json'
          $localAudioManifestBefore = (Get-FileHash -LiteralPath $localAudioManifest -Algorithm SHA256).Hash
