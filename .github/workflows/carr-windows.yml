          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the tested source tree.' }
          $output = Join-Path (Get-Location) 'ci-results/full-bundle-local-translation'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $ruleName = 'CARR-final-local-translation-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
          $profiles = @(Get-NetFirewallProfile -ErrorAction Stop | ForEach-Object {
            @{ name = $_.Name; enabled = [string]$_.Enabled }
          })
          $firewall = @{ schema = 1; status = 'RUNNING'; source_commit = $sourceCommit
            source_tree = $sourceTree; profiles_before = $profiles; cleanup_status = 'NOT_RUN'
            policy = 'Block installed Python external egress; only explicit numeric-loopback test policy permits local TCP.'
          }
          try {
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop
            New-NetFirewallRule -Name $ruleName -DisplayName 'CARR final local translation fixture' -Direction Outbound -Program $python -Action Block -Profile Any -ErrorAction Stop | Out-Null
            $rule = Get-NetFirewallRule -Name $ruleName -ErrorAction Stop
            $program = Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop
            $active = @(Get-NetFirewallProfile -ErrorAction Stop)
            if ($rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or
                $rule.Enabled -ne 'True' -or $program.Program -ne $python -or
                $active.Count -ne 3 -or @($active | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) {
              throw 'The actual installed-Python egress block is incomplete.'
            }
            $firewall.actual_rule = @{ name = $ruleName; program = $program.Program
              direction = [string]$rule.Direction; action = [string]$rule.Action
              enabled = [string]$rule.Enabled }
            $firewall.profiles_enabled = @($active | ForEach-Object { @{ name = $_.Name; enabled = [string]$_.Enabled } })
            $arguments = @('--checkout', (Get-Location).Path, '--wheel', $wheels[0].FullName,
              '--output', $output, '--source-commit', $sourceCommit, '--source-tree', $sourceTree)
            & $python -I -B -X utf8 scripts/local_translation_acceptance.py @arguments 2>&1 |
              Tee-Object (Join-Path $output 'acceptance.txt')
            if ($LASTEXITCODE -ne 0) { throw 'The exact sealed local/Google translation population failed.' }
            $report = Get-Content (Join-Path $output 'local-translation-gate.json') -Raw | ConvertFrom-Json
            if ($report.status -ne 'PASS' -or $report.source_cases -ne 306 -or
                $report.installed_cases -ne 306 -or $report.native_flows -ne 8 -or
                $report.local_loopback_cases_per_population -ne 38 -or
                $report.existing_cases_per_population -ne 268 -or
                $report.source_commit -ne $sourceCommit -or $report.source_tree -ne $sourceTree) {
              throw 'The sealed translation receipt is incomplete or belongs to another candidate.'
            }
            $firewall.status = 'PASS'
          } finally {
            Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule -ErrorAction Stop
            foreach ($profile in $profiles) {
              Set-NetFirewallProfile -Profile $profile.name -Enabled $profile.enabled -ErrorAction Stop
            }
            $restored = @(Get-NetFirewallProfile -ErrorAction Stop | ForEach-Object {
              @{ name = $_.Name; enabled = [string]$_.Enabled }
            })
            if (Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue) {
              throw 'The owned translation firewall rule was not removed.'
            }
            foreach ($profile in $profiles) {
              $actual = @($restored | Where-Object { $_.name -eq $profile.name })
              if ($actual.Count -ne 1 -or $actual[0].enabled -ne $profile.enabled) {
                throw 'A saved firewall profile was not restored.'
              }
            }
            $firewall.profiles_restored = $restored
            $firewall.owned_rule_absent = $true
            $firewall.cleanup_status = 'PASS'
            if ($firewall.status -ne 'PASS') { $firewall.status = 'FAIL' }
            $firewall | ConvertTo-Json -Depth 8 |
              Set-Content -Encoding utf8 (Join-Path $output 'firewall.json')
          }

      - name: Verify actual standard installation repair and uninstall with retained user work
        timeout-minutes: 60
        run: |
          & ./scripts/ci_standard_installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify two distinct signed standard generations and native rollback
        timeout-minutes: 120
        run: |
          & ./scripts/ci_standard_update.ps1 -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'carr-standard-source-a') -PreviousSource '91332206578b4d8dc779fec08c8d51a67962b0ff'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Evidence and public source wheel: no model, native DLLs, OCR source payload, or user documents
      # are uploaded. NVDA and final-download identity remain separate acceptance.
      - name: Preserve exact-commit runtime and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-results/
          if-no-files-found: warn
          retention-days: 7

  keyboard-native:
    name: Windows x64 / native commands and draft recovery
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install the pinned desktop and record the tested source
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-keyboard-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'keyboard-results' | Out-Null
          git rev-parse HEAD | Set-Content 'keyboard-results/tested-commit.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require contextual commands and recovery regressions
        id: keyboard-regressions
        run: |
          & $env:CARR_PYTHON scripts/ci_check.py tests/ui/test_command_registry.py tests/storage/test_keyboard_preferences.py tests/ui/test_keyboard_manager.py tests/ui/test_save_all.py tests/ui/test_save_all_current_drafts.py tests/ui/test_desktop_evidence_jobs.py tests/ui/test_reader_command_dispatch.py tests/ui/test_reader_keymap_context.py tests/storage/test_evidence_drafts.py tests/ui/test_evidence_draft_recovery.py 2>&1 | Tee-Object 'keyboard-results/source-regressions.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual native Main keyboard settings and command dispatch
        if: ${{ !cancelled() && steps.keyboard-regressions.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_keyboard_settings_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-keyboard-settings.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise actual contextual Reader key remapping
        if: ${{ !cancelled() && steps.keyboard-regressions.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_reader_keymap_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-reader-keymap.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native research-note draft recovery and explicit save
        if: ${{ !cancelled() && steps.keyboard-regressions.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_evidence_drafts_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-evidence-drafts.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise native Save All and completion-aware close
        if: ${{ !cancelled() && steps.keyboard-regressions.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B tests/ui/native_save_all_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-save-all.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise measured native progress and accessible status queries
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_progress_smoke.py --native 2>&1 | Tee-Object 'keyboard-results/native-progress.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve actual keyboard and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carr-keyboard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: carr-library/keyboard-results/
          if-no-files-found: warn
          retention-days: 7
