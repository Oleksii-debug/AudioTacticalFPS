          from carr_library.native_runtime import activate_bundled_runtime
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(root / '.venv')
          manifest = json.loads((root / 'bundle-manifest.json').read_text())
          assert manifest['bundled_model'] and manifest['bundled_ocr'] and manifest['bundled_native_runtime']
          assert not manifest.get('bundled_audio_runtime', False) and not (root / 'audio-runtime').exists()
          forbidden = {'ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe'}
          assert all(not path.casefold().startswith('audio-runtime/')
                     and pathlib.PurePosixPath(path).name.casefold() not in forbidden for path in manifest['files'])
          os.environ['CARR_TEST_MODEL_DIR'] = str(root / 'models' / 'minilm')
          os.environ['CARR_OCR_DIR'] = str(root / 'ocr')
          os.environ['TESSDATA_PREFIX'] = str(root / 'ocr' / 'tessdata')
          os.environ['PATH'] = os.pathsep.join((str(root / 'ocr'), os.environ.get('PATH', '')))
          os.environ['PYTEST_DISABLE_PLUGIN_AUTOLOAD'] = '1'
          runtime_handle = activate_bundled_runtime(bundle_root=root)
          assert runtime_handle is not None
          for name in ('carr_library.application', 'carr_library.ingest.worker', 'carr_library.storage.revisions',
                       'carr_library.pending_backup', 'carr_library.library_backup'):
              component = importlib.import_module(name)
              assert pathlib.Path(component.__file__).resolve().is_relative_to(root / '.venv')
          import pytest
          status = pytest.main(sys.argv[2:])
          if status:
              raise SystemExit(status)
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel.GetModuleHandleW.argtypes = [wintypes.LPCWSTR]
          kernel.GetModuleHandleW.restype = wintypes.HMODULE
          kernel.GetModuleFileNameW.argtypes = [wintypes.HMODULE, wintypes.LPWSTR, wintypes.DWORD]
