          $nativeRuntime = Join-Path $bundleWork 'native-runtime'
          & $env:CARR_PYTHON packaging/prepare_native_runtime.py --package $nativePackage --output $nativeRuntime | Tee-Object 'ci-results/native-runtime-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceProofScript = @'
          import importlib.util, json, pathlib, sys
          project = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('native_source_wheel', project / 'packaging/source_wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          proof = module.verify_application_wheel(pathlib.Path(sys.argv[1]), project.parent, sys.argv[2])
          print(json.dumps(dict(status='PASS', **proof)))
          '@
          $sourceProofScript | & $env:CARR_PYTHON -I -B - $applicationWheel $sourceCommit | Tee-Object 'ci-results/source-wheel-before-native.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/build_windows_bundle.py --wheel $applicationWheel --wheelhouse $wheelhouse --lock $fullLock --sbom $fullSbom --python-archive $pythonArchive --model-dir $env:CARR_CI_MODEL_DIR --model-manifest $env:CARR_CI_MODEL_MANIFEST --ocr-dir $ocr --ocr-source-archive $ocrSource --source-commit $sourceCommit --native-launcher $env:CARR_NATIVE_LAUNCHER --native-launcher-sha256 $env:CARR_NATIVE_LAUNCHER_SHA256 --output $baseBundle | Tee-Object 'ci-results/full-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CARR_PYTHON packaging/add_native_runtime.py --bundle $baseBundle --native-runtime $nativeRuntime --output $bundle | Tee-Object 'ci-results/full-bundle-native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
