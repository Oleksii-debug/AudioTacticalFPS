          manifest = json.loads((root / 'bundle-manifest.json').read_text())
          assert not manifest.get('bundled_audio_runtime', False)
          assert not (root / 'audio-runtime').exists()
          # This child proves SAPI synthesis with no discoverable FFmpeg.
          os.environ['PATH'] = os.pathsep.join((str(root / 'runtime'), str(root / 'native-runtime' / 'bin'),
                                              str(pathlib.Path(os.environ['SystemRoot']) / 'System32')))
          assert shutil.which('ffmpeg') is None and shutil.which('ffprobe') is None
          import carr_library
          from carr_library.native_runtime import activate_bundled_runtime
          from carr_library.speech import VoiceRegistry, SpeechSettings
          assert pathlib.Path(carr_library.__file__).resolve().is_relative_to(root / '.venv')
          runtime_handle = activate_bundled_runtime(bundle_root=root)
          assert runtime_handle is not None
          deadline = time.monotonic() + 30
          expired = lambda: time.monotonic() >= deadline
          registry = VoiceRegistry.discover(include_flite=False, cancelled=expired)
          try:
              voices = tuple(voice for voice in registry.voices() if voice.engine.startswith('SAPI 5'))
              assert voices, registry.notices
              with TemporaryDirectory(prefix='carr-library-sapi-') as temporary:
                  spoken = registry.synthesize('This is an actual offline native library voice check.',
                      voices[0].id, pathlib.Path(temporary) / 'spoken.wav',
                      settings=SpeechSettings(volume=65), cancelled=expired)
                  assert .2 < spoken.duration_seconds < 30 and spoken.frames > 0
                  peak = 0
                  with wave.open(str(spoken.path), 'rb') as speech:
                      assert speech.getsampwidth() == 2
                      while raw := speech.readframes(65536):
                          peak = max(peak, max(abs(value[0]) for value in struct.iter_unpack('<h', raw)))
                  assert peak > 100, 'The installed native SAPI engine emitted silent PCM.'
                  print(json.dumps(dict(status='PASS', source_commit=manifest['source_commit'],
                      source_tree=manifest['source_tree'], sapi_voice=voices[0].id,
                      speech_peak_pcm16=peak, frames=spoken.frames, ffmpeg_discoverable=False,
                      bundled_audio_runtime=False, manual_nvda='NOT_RUN')), flush=True)
          finally:
              registry.close()
          '@
          $nativeSapi | & $nativeInstalledPython -I -B - $nativeBundle 2>&1 | Tee-Object 'ci-results/library-bundle-sapi.json'
