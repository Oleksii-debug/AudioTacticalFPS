          $parentManifestHash = (Get-FileHash -LiteralPath (Join-Path $nativeBundle 'bundle-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          & $env:CARR_PYTHON packaging/refresh_private_bundle.py --source $nativeBundle --wheel $applicationWheel --output $bundle --source-commit $sourceCommit --parent-manifest-sha256 $parentManifestHash --audio $env:CARR_CI_AUDIO_DIR --citations $env:CARR_CI_CITATIONS_DIR | Tee-Object 'ci-results/full-bundle-canonical-runtimes.json'
