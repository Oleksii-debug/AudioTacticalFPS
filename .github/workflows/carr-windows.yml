      - name: Qualify the transferable library bundle without an audio payload
        if: ${{ !cancelled() && steps.complete_bundle.conclusion == 'success' }}
        timeout-minutes: 15
        run: |
          $bundle = $env:CARR_CI_TRANSFER_BUNDLE
          if (-not $bundle -or -not (Test-Path -LiteralPath (Join-Path $bundle 'bundle-manifest.json') -PathType Leaf)) { throw 'The verified transferable bundle is missing.' }
          $bundledPython = Join-Path $bundle 'runtime/python.exe'
          $python = Join-Path $bundle '.venv/Scripts/python.exe'
          $programs = @($bundledPython, (Join-Path $bundle 'runtime/pythonw.exe'), $python,
            (Join-Path $bundle '.venv/Scripts/pythonw.exe'), (Join-Path $bundle 'ocr/tesseract.exe'),
            (Join-Path $bundle 'ResearchLibrary.exe')) | ForEach-Object { [System.IO.Path]::GetFullPath($_) }
          $rulePrefix = 'CARR-transfer-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Transferable offline checks require active firewall profiles.' }
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Transferable bundle outbound rules are inactive.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
