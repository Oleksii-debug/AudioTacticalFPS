          "CARR_CI_EPUBCHECK_JAVA=$java" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, install and exercise the complete bundle with runtime egress blocked
        if: ${{ !cancelled() && steps.local_model.conclusion == 'success' && steps.ocr_runtime.conclusion == 'success' && steps.native_launcher.conclusion == 'success' && steps.media_runtimes.conclusion == 'success' && steps.epubcheck_runtime.conclusion == 'success' }}
