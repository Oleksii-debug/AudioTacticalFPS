          project = pathlib.Path.cwd()
          closure = ('scripts/ci_check.py', 'scripts/ci_watchdog.py', 'tests/loopback/test_local_planning.py')
          closure_hashes = {}
          for name in closure:
              source, target = project / name, stage / name
              target.parent.mkdir(parents=True, exist_ok=True)
              expected = hashlib.sha256(source.read_bytes()).hexdigest()
              shutil.copyfile(source, target)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
              assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
              closure_hashes[name] = expected
          assert not (stage / 'src').exists() and not (stage / 'carr_library').exists()
