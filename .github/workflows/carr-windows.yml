      - name: Accept a separate library transfer bundle without an audio runtime
        if: ${{ !cancelled() && steps.accepted_bundle.conclusion == 'success' }}
        id: accepted_transfer_bundle
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleWork = Join-Path $env:RUNNER_TEMP 'carr-bundle-ci'
          $nativeBundle = Join-Path $bundleWork 'native bundle'
          $bundle = Join-Path $bundleWork 'library transfer bundle'
          $wheels = @(Get-ChildItem -LiteralPath (Join-Path $bundleWork 'application') -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected the one already accepted application wheel.' }
          $applicationWheel = $wheels[0].FullName
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fullCapture = Get-Content -Raw 'ci-results/accepted-bundle/accepted-bundle.json' | ConvertFrom-Json
          $fullManifest = Get-Content -Raw 'ci-results/accepted-bundle/sealed-bundle/bundle-manifest.json' | ConvertFrom-Json
          $parentManifestHash = (Get-FileHash -LiteralPath (Join-Path $nativeBundle 'bundle-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          $wheelHash = (Get-FileHash -LiteralPath $applicationWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fullCapture.status -ne 'PASS' -or $fullCapture.source_commit -ne $sourceCommit -or $fullCapture.wheel_sha256 -ne $wheelHash -or $fullManifest.parent_manifest_sha256 -ne $parentManifestHash) { throw 'Transfer acceptance must reuse the exact accepted wheel, source and native parent.' }
          # Reuse the canonical assembler and the original native parent. Omitting
          # --audio produces a separate profile without transferring that runtime.
          & $env:CARR_PYTHON packaging/refresh_private_bundle.py --source $nativeBundle --wheel $applicationWheel --output $bundle --source-commit $sourceCommit --parent-manifest-sha256 $parentManifestHash --citations $env:CARR_CI_CITATIONS_DIR | Tee-Object 'ci-results/transfer-bundle-build.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Join-Path $bundle 'bundle-manifest.json'
