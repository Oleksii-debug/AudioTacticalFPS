name: Official tiny acoustic qualification

on:
  push:
    branches: [carr/asr-acoustic-proof-20261127]
    paths:
      - carr-library/scripts/qualify_official_tiny.py
      - carr-library/scripts/windows_official_tiny_smoke.ps1
      - carr-library/tests/qualification/test_official_tiny_contract.py
      - .github/workflows/carr-official-tiny-acoustic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acoustic:
    name: Actual official tiny / CPU int8 / synthetic SAPI English
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TINY_ROOT: ${{ runner.temp }}/official-tiny-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Require qualification boundary tests
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed.' }
          python -m pytest -q carr-library/tests/qualification/test_official_tiny_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Qualification boundary contracts failed.' }
      - name: Acquire and verify only the pinned public pack and closed runtime
        shell: pwsh
        run: |
          python -I -B carr-library/scripts/qualify_official_tiny.py prepare --root $env:TINY_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Pinned input acquisition or closure validation failed.' }
      - name: Actual SAPI speech and tiny inference behind native network denial
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./carr-library/scripts/windows_official_tiny_smoke.ps1 -Root $env:TINY_ROOT -HostPython $python -Source (Join-Path $env:GITHUB_WORKSPACE 'carr-library/src')
      - name: Collect bounded JSON evidence
        if: always()
        shell: pwsh
        run: |
          python -I -B carr-library/scripts/qualify_official_tiny.py evidence --root $env:TINY_ROOT --output (Join-Path $env:RUNNER_TEMP 'tiny-proof/qualification.json')
          if ($LASTEXITCODE -ne 0) { throw 'Actual acoustic qualification is not complete.' }
      - name: Retain JSON evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: official-tiny-acoustic-evidence
          path: ${{ runner.temp }}/tiny-proof/qualification.json
          if-no-files-found: error
          retention-days: 7
