name: CARR required runner ownership regressions
on:
  push:
    branches: ['carr/ci-runner-*']
    paths: ['carr-library/**', '.github/workflows/carr-ci-runner.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-ci-runner-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: Exact source runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install only the existing pinned test and lock dependencies
        run: python -I -B -m pip install pytest==9.0.2 packaging==26.4 filelock==3.29.0 platformdirs==4.10.0
      - name: Execute all 48 actual runner cases and the Linux-only fork contract
        timeout-minutes: 17
        run: python -I -B -X utf8 scripts/ci_runner_acceptance.py --source-commit "$GITHUB_SHA" --output ci-runner-results
      - name: Preserve exact source and raw failing or passing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-ci-runner-${{ matrix.os }}-${{ github.sha }}
          path: |
            carr-library/ci-runner-results/*.json
            carr-library/ci-runner-results/*.xml
            carr-library/ci-runner-results/*.txt
          if-no-files-found: error
          retention-days: 30
