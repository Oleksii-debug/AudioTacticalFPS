name: Isolated Windows status replacement diagnosis

on:
  push:
    branches:
      - carr/windows-status-diagnostic-8fa
    paths:
      - carr-library/scripts/windows_status_replace_diagnostic.py
      - .github/workflows/carr-windows-status-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: windows-status-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Run four interleaved controls with unchanged one-shot writes
        run: |
          python -I -B carr-library/scripts/windows_status_replace_diagnostic.py --trials 12 --generations 50 --output windows-status-diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'At least one diagnostic trial failed; all completed trial reports are retained.' }
      - name: Keep exact diagnostic evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-status-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-status-diagnostic/
          if-no-files-found: error
          retention-days: 7
