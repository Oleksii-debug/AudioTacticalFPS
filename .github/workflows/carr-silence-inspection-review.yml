name: Read-only completed audio silence inspection
on:
  push:
    branches: [carr/silence-inspection-review-20261128]
    paths: ['carr-library/**', '.github/workflows/carr-silence-inspection-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: silence-inspection-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Actual completed PCM, Studio ownership and backup contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      CARR_SILENCE_HEAD: ${{ github.sha }}
      CARR_CUE_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        run: python -m pip install ".[test,sync]"
      - name: Prepare actual Linux audio and the independent CUE reader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg flex bison cmake build-essential
      - name: Prepare the already pinned Windows test audio runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'ci-silence-inspection' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-cue-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-cue-audio-cache') --output $audio --download | Tee-Object 'ci-silence-inspection/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-silence-inspection
          cat > ci-silence-inspection/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import subprocess
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-silence-inspection"
          suites = ["tests/studio/test_interchange.py","tests/studio/test_production.py","tests/studio/test_production_cancellation_outcomes.py","tests/studio/test_production_hardening.py","tests/studio/test_production_total_budget_ownership.py","tests/studio/test_publishing.py","tests/studio/test_publishing_cli.py","tests/studio/test_audiobook_publication.py","tests/studio/test_clip_timeline.py","tests/studio/test_runtime_identity.py","tests/storage/test_cue_interchange_backup.py","tests/studio/test_silence.py","tests/ui/test_studio_silence_actions.py","tests/storage/test_backup_generated_audio.py","tests/storage/test_backup_studio_media.py","tests/storage/test_backup_v4_sidecars.py","tests/ui/test_progress_voice_actions.py"]

          names = ["carr_library.studio.interchange","carr_library.studio.render","carr_library.studio.publishing","carr_library.studio.project","carr_library.audio.dsp","carr_library.audio.audiobook","carr_library.audio.process","carr_library.audio.models","carr_library.durable_state","carr_library.backup_producers","carr_library.backup_sidecars","carr_library.backup_current","carr_library.studio.silence","carr_library.backup_compat.pcm","carr_library.ui.studio_dialog"]
          
          def checkout_head():
              value = subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=10).stdout.strip()
              assert value == os.environ["CARR_SILENCE_HEAD"], (value, os.environ["CARR_SILENCE_HEAD"])
              return value

          commit_before = checkout_head()
          helper_before = sha256(Path(__file__).read_bytes()).hexdigest()
          tests_before = {suite: sha256((root / suite).read_bytes()).hexdigest() for suite in suites}

          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (mode + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      print("CARR_CUE_COLLECTION_FAILURE " + str(report.longrepr)[:12000], flush=True)

              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "-s", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (mode + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-silence-inspection-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              assert checkout_head() == commit_before, "The checked-out commit changed."
              assert sha256(Path(__file__).read_bytes()).hexdigest() == helper_before, "The executed proof helper changed."
              assert {suite: sha256((root / suite).read_bytes()).hexdigest() for suite in suites} == tests_before, "Executed test bytes changed."
              result = {"status": "PASS", "mode": mode, "cases": len(cases),
                        "qualification": "MEASURED_CUE_ARTIFACT_PUBLICATION",
                        "external_editor_gui_import": "NOT_RUN",
                        "libcue_reader": "SEPARATE_LINUX_STEP",
                        "commit": commit_before, "proof_helper_sha256": helper_before,
                        "test_files": tests_before,
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "physical_microphone": "NOT_RUN", "physical_output": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (mode + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require actual source silence and retained production cases
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-silence-inspection/check.py source 2>&1 | tee ci-silence-inspection/source.txt
      - name: Require isolated installed silence and retained production cases
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-silence-inspection/check.py installed 2>&1 | tee ci-silence-inspection/installed.txt
      - name: Read the exact independent upstream CUE parser source
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lipnitsk/libcue
          ref: cfb98a060fd79dbc3463d85f0f29c3c335dfa0ea
          path: .ci-libcue
          persist-credentials: false
      - name: Build and require the actual upstream reader
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          test "$(git -C ../.ci-libcue rev-parse HEAD)" = cfb98a060fd79dbc3463d85f0f29c3c335dfa0ea
          cmake -S ../.ci-libcue -B ../.ci-libcue/build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build ../.ci-libcue/build --parallel 2
          ctest --test-dir ../.ci-libcue/build --output-on-failure
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 scripts/probe_cue_interchange.py --libcue ../.ci-libcue/build/libcue.so.2.3.0 --report ci-silence-inspection/libcue-reader.json 2>&1 | tee ci-silence-inspection/libcue-reader.txt
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-silence-inspection
          git rev-parse HEAD > ci-silence-inspection/commit.txt
          git rev-parse HEAD^{tree} > ci-silence-inspection/tree.txt
          python -m pip freeze > ci-silence-inspection/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: silence-inspection-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-silence-inspection
          if-no-files-found: error
