name: CARR public canonical merge preflight

on:
  push:
    branches: [carr/public-composition-preflight-20261127]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect exact public merge without application publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source checkpoint and public ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Inspect detached canonical composition and preserve every conflict
        run: python -B recovery/public_composition_preflight.py --root . --evidence ci-public-merge
      - name: Preserve exact public merge inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-public-merge-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-public-merge/
          if-no-files-found: error
          retention-days: 7
