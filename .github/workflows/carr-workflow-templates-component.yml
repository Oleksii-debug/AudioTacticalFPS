name: CARR typed workflow template component

on:
  pull_request:
    branches: [carr-library]
    paths: ['carr-library/**', '.github/workflows/carr-workflow-templates-component.yml']
  push:
    branches: [carr/typed-workflow-templates-2aa-20261127, carr/typed-workflow-templates-2aa-20261127-*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-workflow-templates-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  typed-template-acceptance:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the current product and test dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          python -m pip install '.[test]'
          python -m pip check
      - name: Require new typed recipes and existing authority/handler preservation
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          python scripts/ci_check.py --jobs 2 \
            tests/assistant/test_workflow_templates.py \
            tests/assistant/test_workflow_template_handlers.py \
            tests/assistant/test_workflow_template_parameters.py \
            tests/assistant/test_workflow_templates_cli.py \
            tests/assistant/test_workflow_template_editor.py \
            tests/assistant/test_planning_handlers.py \
            tests/ui/test_studio_keyboard_registration.py \
            tests/ui/test_academic_library_dialog.py \
            tests/reader/test_binary_file_export.py
      - name: Require portable source identity without replacing native OCR gates
        run: |
          set -euo pipefail
          python -m pytest -q -o xfail_strict=true \
            tests/extract/test_runtime_identity.py::test_missing_engine_and_source_change \
            tests/extract/test_runtime_identity.py::test_resource_limit \
            tests/extract/test_runtime_identity.py::test_model_identifier_rules_are_bound_to_resume_identity \
            tests/extract/test_runtime_identity.py::test_unsafe_model_identifiers_fail_before_engine_discovery \
            tests/extract/test_runtime_identity.py::test_engine_version_change_detected

  native-template-controls:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      CARR_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the exact pinned native desktop package
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-template-python'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'template-native-results' | Out-Null
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -ne $env:CARR_TEST_COMMIT) { throw 'Native template checkout differs from requested source.' }
          $source | Set-Content 'template-native-results/tested-commit.txt'
          git rev-parse 'HEAD^{tree}' | Set-Content 'template-native-results/tested-tree.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual template keyboard, values and project review
        timeout-minutes: 4
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_workflow_templates_smoke.py --installed 2>&1 | Tee-Object 'template-native-results/native-workflow-templates.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require actual bibliography overwrite and competing-save review
        timeout-minutes: 4
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_bibliography_interchange_smoke.py 2>&1 | Tee-Object 'template-native-results/native-bibliography-interchange.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact native template evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-template-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: carr-library/template-native-results/
          retention-days: 7
