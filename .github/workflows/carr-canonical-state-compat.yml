name: CARR canonical backup compatibility proof
on:
  push:
    branches: [work/canonical-state-compat-63cdd-a49c]
    paths:
      - carr-library/**
      - .github/workflows/carr-canonical-state-compat.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-canonical-state-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install source and public synthetic-test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          python -m pip install '.[test]'
          python -m pip check
      - name: Install real OCR prerequisite for pending-review roundtrip
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
          tesseract --version
      - name: Compile and run isolated backup compatibility contracts
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m compileall -q src tests/storage/fixtures
          python scripts/ci_check.py --jobs 2 \
            tests/storage/test_canonical_state_compatibility.py \
            tests/storage/test_library_backup.py \
            tests/storage/test_backup_boundary.py \
            tests/storage/test_backup_schema_identity.py \
            tests/storage/test_backup_operation_budget.py \
            tests/storage/test_backup_provider_state.py \
            tests/storage/test_backup_translation.py \
            tests/storage/test_assistant_restored_history.py \
            tests/storage/test_library_backup_reading_state.py \
            tests/storage/test_pending_backup.py \
            tests/storage/test_complete_pending_backup.py \
            tests/transcription/test_typed_backup.py \
            tests/assistant/test_backup_late_recovery.py

  windows-path-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install source and public synthetic-test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source identity.' }
          git rev-parse HEAD 'HEAD^{tree}'
          $proofEnvironment = Join-Path $env:RUNNER_TEMP 'carr-canonical-compat-environment'
          python -m venv $proofEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $proofPython = Join-Path $proofEnvironment 'Scripts/python.exe'
          & $proofPython -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $proofPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows file identity and canonical restore contracts
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proofPython = Join-Path $env:RUNNER_TEMP 'carr-canonical-compat-environment/Scripts/python.exe'
          & $proofPython -m compileall -q src tests/storage/fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $proofPython scripts/ci_check.py --jobs 2 tests/storage/test_canonical_state_compatibility.py tests/storage/test_library_backup.py tests/storage/test_backup_schema_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
