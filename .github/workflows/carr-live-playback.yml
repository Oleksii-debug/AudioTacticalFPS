name: CARR independent live playback qualification

on:
  push:
    branches: ['carr/v3-playback-r8-*', 'carr/v3-acceptance-*']
    paths:
      - carr-library/**
      - .github/workflows/carr-live-playback.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-live-playback-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  live-playback:
    name: Windows / SAPI FFmpeg independent tempo and pitch
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install exact pinned profile and candidate package
        run: |
          New-Item -ItemType Directory -Force playback-results | Out-Null
          python -m compileall -q src tests scripts packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-integrated-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content playback-results/tested-commit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse 'HEAD^{tree}' | Set-Content playback-results/tested-tree.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare only the existing hash-pinned FFmpeg runtime
        timeout-minutes: 10
        run: |
          $audioRoot = Join-Path $env:RUNNER_TEMP ('carr-live-playback-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory $audioRoot -ErrorAction Stop | Out-Null
          $pin = python -I -c "import json; from carr_library.audio.runtime import FFMPEG_ARCHIVE_URL,FFMPEG_ARCHIVE_SHA256,FFMPEG_ARCHIVE_BYTES; print(json.dumps(dict(url=FFMPEG_ARCHIVE_URL,sha256=FFMPEG_ARCHIVE_SHA256,size=FFMPEG_ARCHIVE_BYTES)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $audioRoot 'ffmpeg-pinned.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned FFmpeg archive mismatch.' }
          $audioBin = Join-Path $audioRoot 'audio-runtime'
          python packaging/prepare_ffmpeg_runtime.py --archive $archive --destination $audioBin --verify-native 2>&1 | Tee-Object playback-results/ffmpeg-runtime.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $audioBin 'ffmpeg.exe'
          "CARR_FFMPEG=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require exact source cases without skips
        timeout-minutes: 15
        run: |
          $oracle = Get-Content -LiteralPath scripts/live_playback_gate_oracle.json -Raw | ConvertFrom-Json
          [string[]]$suites = @($oracle.suites)
          python scripts/ci_check.py --jobs 2 @suites 2>&1 | Tee-Object playback-results/source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json,pathlib,re
          oracle=json.loads(pathlib.Path('scripts/live_playback_gate_oracle.json').read_text(encoding='utf-8'))
          raw=pathlib.Path('playback-results/source.txt').read_text(encoding='utf-8-sig')
          expected={name.replace('.','/')+'.py':sum(functions.values()) for name,functions in oracle['functions'].items()}
          observed={}
          for verdict,path,count,failed,skipped,code in re.findall(r'(PASS|FAIL): (\S+): junit_passed=(\d+), failed=(\d+), skipped=(\d+), pytest_exit=(\d+)',raw):
              assert path not in observed, path
              assert verdict=='PASS' and failed==skipped==code=='0',(path,verdict,failed,skipped,code)
              observed[path]=int(count)
          assert observed==expected,(observed,expected)
          report=dict(status='PASS',cases=observed,passed=sum(observed.values()),failed=0,skipped=0)
          pathlib.Path('playback-results/source-proof.json').write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact isolated installed source and every regression case
        timeout-minutes: 15
        run: |
          @'
          from collections import Counter
          from hashlib import sha256
          import importlib,json,pathlib,sys,xml.etree.ElementTree as E
          import pytest
          assert sys.platform=='win32' and sys.flags.isolated
          root=pathlib.Path.cwd().resolve()
          oracle=json.loads((root/'scripts/live_playback_gate_oracle.json').read_text(encoding='utf-8'))
          origins={}
          for name in oracle['origins']:
              path=pathlib.Path(importlib.import_module(name).__file__).resolve()
              expected=root/'src'/pathlib.Path(*name.split('.')).with_suffix('.py')
              assert path.is_relative_to(pathlib.Path(sys.prefix).resolve()),name
              digest=sha256(path.read_bytes()).hexdigest()
              assert digest==sha256(expected.read_bytes()).hexdigest(),name
              origins[name]=dict(path=str(path),sha256=digest)
          code=pytest.main(['-q','-o','addopts=','-o','pythonpath=','-o','xfail_strict=true','--import-mode=importlib','--junitxml=playback-results/installed.xml',*oracle['suites']])
          if code: raise SystemExit(code)
          cases=list(E.parse('playback-results/installed.xml').iter('testcase'))
          observed={}
          for name,functions in oracle['functions'].items():
              selected=[c for c in cases if c.get('classname')==name]
              assert all(not any(c.find(t) is not None for t in ('failure','error','skipped')) for c in selected),name
              counts=Counter(c.get('name','').split('[',1)[0] for c in selected)
              assert counts==Counter(functions),(name,counts,functions)
              observed[name]=len(selected)
          assert len(cases)==sum(observed.values()),'unaccounted cases'
          for record in origins.values():
              assert sha256(pathlib.Path(record['path']).read_bytes()).hexdigest()==record['sha256']
          report=dict(status='PASS',source_commit=(root/'playback-results/tested-commit.txt').read_text(encoding='utf-8-sig').strip(),source_tree=(root/'playback-results/tested-tree.txt').read_text(encoding='utf-8-sig').strip(),actual_windows=True,installed_package=True,isolated=True,module_origins=origins,cases=observed,passed=len(cases),failed=0,skipped=0,nvda='NOT_RUN',sealed_installer='NOT_RUN',full_platform='NOT_CLAIMED')
          (root/'playback-results/installed-proof.json').write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          '@ | python -I -B - 2>&1 | Tee-Object playback-results/installed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact actual installed native playback controls and PCM
        timeout-minutes: 5
        run: |
          python -I -B scripts/r7_native_gate.py live-playback --report playback-results/native-proof.json 2>&1 | Tee-Object playback-results/native.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked playback candidate changed during qualification.' }
      - name: Retain exact source logs and installed receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-live-playback-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/playback-results/
          if-no-files-found: warn
          retention-days: 7
