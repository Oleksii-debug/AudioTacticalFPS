name: CARR one-off platform reconciliation preflight
on:
  push:
    branches: [carr/platform-reconcile-dbbb-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-platform-reconcile-dbbb.yml']
permissions:
  contents: read
concurrency:
  group: carr-platform-reconcile-dbbb-${{ github.sha }}
  cancel-in-progress: false
jobs:
  portable-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Require actual portable media commands
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install this exact source and compile every application module
        id: install
        run: |
          git rev-parse HEAD
          New-Item -ItemType Directory -Force ci-platform-results | Out-Null
          python -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m compileall -q src scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require new contracts and affected existing boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $suites = @(
            'tests/speech/test_reading_tools.py',
            'tests/ui/test_reading_tools.py',
            'tests/speech/test_output_devices.py',
            'tests/ui/test_reader_output.py',
            'tests/speech/test_spelling.py',
            'tests/speech/test_spelling_worker.py',
            'tests/ui/test_reader_spelling.py',
            'tests/speech/test_presentation.py',
            'tests/ui/test_reader_presentation.py',
            'tests/storage/test_reader_presentation_backup.py',
            'tests/storage/test_reading_tabs_backup.py',
            'tests/operations/test_resources.py',
            'tests/operations/test_facade.py',
            'tests/operations/test_production_admission.py',
            'tests/operations/test_worker_start_cleanup.py',
            'tests/e2e/test_operations_cli.py',
            'tests/e2e/test_transcription_cli.py',
            'tests/ui/test_operations_policy.py',
            'tests/ui/test_platform_modal_lifecycle.py',
            'tests/ui/test_transcription_dialog.py',
            'tests/transcription/test_admission_boundaries.py',
            'tests/transcription/test_protocol_fixture.py',
            'tests/transcription/test_restore.py',
            'tests/transcription/test_runtime_admission.py',
            'tests/transcription/test_service.py',
            'tests/assistant/test_local_planning.py',
            'tests/assistant/test_planning_handlers.py',
            'tests/assistant/test_translation_v3.py',
            'tests/storage/test_atomic_state_publication.py',
            'tests/storage/test_transcription_backup.py',
            'tests/reader/test_export_reconciliation.py',
            'tests/operations/test_transcription_views.py',
            'tests/storage/test_transcription_composite_backup.py',
            'tests/transcription/test_owned_admission.py',
            'tests/transcription/test_protocol_routing.py',
            'tests/reader/test_export_change_time.py',
            'tests/speech/test_player_controls.py',
            'tests/speech/test_session.py',
            'tests/speech/test_reading.py',
            'tests/ui/test_reader_keymap_context.py',
            'tests/ui/test_keyboard_settings.py',
            'tests/ui/test_keyboard_export.py',
            'tests/ui/test_keyboard_rename.py',
            'tests/assistant/test_transcription_workflow.py',
            'tests/transcription/test_supplied_worker_bridge.py',
            'tests/storage/test_transcription_recovery.py',
            'tests/storage/test_import_publication_backup.py',
            'tests/assistant/test_translation.py',
            'tests/assistant/test_library_translation.py',
            'tests/ui/test_translation_selection.py',
            'tests/ui/test_library_translation_dialog.py',
            'tests/storage/test_translation_runtime_recovery.py',
            'tests/storage/test_canonical_backup_compat.py',
            'tests/assistant/test_local_assistant.py',
            'tests/ui/test_assistant_voice_preview.py',
            'tests/ui/test_academic_library_dialog.py',
            'tests/ui/test_import_center.py',
            'tests/ui/test_reading_desk_actions.py',
            'tests/audio/test_local_runtime_setup.py',
            'tests/reader/test_export_approval_budget.py',
            'tests/reader/test_export_publication_boundary.py',
            'tests/reader/test_export_no_clobber.py',
            'tests/ui/test_export_confirmation.py',
            'tests/operations_posix/test_fork_ownership.py',
            'tests/ui/test_progress_job_review.py',
            'tests/ui/test_save_all_access.py',
            'tests/storage/test_recording_backup.py',
            'tests/speech/test_source.py',
            'tests/audio/test_recording_windows_process.py',
            'tests/audio/test_recording_process.py',
            'tests/audio/test_audio_process.py',
            'tests/audio/test_local_runtime_cli.py',
            'tests/audio_acceptance/test_primary_publication_budget.py'
          )
          python scripts/ci_check.py --jobs 2 @suites 2>&1 | Tee-Object ci-platform-results/strict-source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the complete provider policy against synthetic loopback HTTP and TLS
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # These tests own literal-loopback synthetic peers and test credentials.
          # Retain actual HTTP/TLS deadlines; they cannot run under ci_check's
          # unconditional offline socket guard. No live provider is contacted.
          $providerPolicy = @'
          import json, pathlib, sys, sysconfig, xml.etree.ElementTree as ET
          import carr_library
          import pytest
          origin = pathlib.Path(carr_library.__file__).resolve()
          assert origin.is_relative_to(pathlib.Path(sysconfig.get_path('purelib')).resolve())
          assert not origin.is_relative_to(pathlib.Path.cwd() / 'src')
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = 'ci-platform-results/provider-policy-loopback.xml'
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=',
              '-o', 'xfail_strict=true', '--import-mode=importlib',
              'tests/assistant/test_provider_policy.py', '--junitxml=' + report],
              plugins=[policy])
          cases = list(ET.parse(report).iter('testcase'))
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          accepted = status == 0 and bool(cases) and failed == skipped == 0 and not policy.seen
          print(json.dumps(dict(status='PASS' if accepted else 'FAIL',
              scope='synthetic literal-loopback HTTP/TLS fixtures; no live provider',
              passed=len(cases)-failed-skipped, failed=failed, skipped=skipped,
              expected_failure_observed=policy.seen, module_origin=str(origin))))
          raise SystemExit(0 if accepted else 1)
          '@
          $providerPolicy | python -I -B -X utf8 - 2>&1 | Tee-Object ci-platform-results/provider-policy-loopback.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact-source preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-platform-preflight-${{ github.sha }}
          path: |
            carr-library/ci-platform-results/
            carr-library/ci-results/
          if-no-files-found: error
          retention-days: 7

  windows-reading-appearance:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned desktop dependencies and this exact application wheel
        id: install
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory -Force 'ci-appearance-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne $env:GITHUB_SHA) { throw 'Checkout does not match the immutable candidate.' }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelRoot = Join-Path $env:RUNNER_TEMP 'carr-appearance-application-wheel'
          New-Item -ItemType Directory -Path $wheelRoot | Out-Null
          python -m pip wheel --no-deps --wheel-dir $wheelRoot .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $wheelRoot -File -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel from this checkout.' }
          python -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            source_commit = $sourceCommit
            wheel_name = $wheels[0].Name
            wheel_sha256 = (Get-FileHash -LiteralPath $wheels[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            package_origin = 'built from the exact checked-out public source; native probes verify loaded module hashes'
          } | ConvertTo-Json | Set-Content -LiteralPath 'ci-appearance-results/application-source.json' -Encoding utf8
      - name: Require regressions and actual Windows status handles with no skips
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          python -B scripts/ci_check.py --jobs 2 tests/speech/test_output_devices.py tests/storage/test_reader_presentation_backup.py tests/storage/test_reading_tabs_backup.py tests/transcription_windows/test_protocol_fixture_handles.py tests/operations_windows/test_native_lock_release.py tests/audio/test_recording_windows_process.py tests/audio/test_recording_process.py tests/audio/test_audio_process.py 2>&1 | Tee-Object 'ci-appearance-results/strict-source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require native owned descendants and fresh venv redirectors
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python -I -B tests/audio/native_recording_process_probe.py --report ci-appearance-results/native-owned-process.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require exact source native reading appearance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $previousPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = (Resolve-Path 'src').Path
            python -B scripts/windows_reader_presentation_smoke.py --report 'ci-appearance-results/source-reading-appearance.json' 2>&1 | Tee-Object 'ci-appearance-results/source-reading-appearance.txt'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { $env:PYTHONPATH = $previousPythonPath }
      - name: Require exact installed native reading appearance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python -I -B scripts/windows_reader_presentation_smoke.py --expect-installed --report 'ci-appearance-results/installed-reading-appearance.json' 2>&1 | Tee-Object 'ci-appearance-results/installed-reading-appearance.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only diagnostic logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-reading-appearance-diagnostic-${{ github.sha }}
          path: |
            carr-library/ci-appearance-results/
            carr-library/ci-results/
          if-no-files-found: error
          retention-days: 7
