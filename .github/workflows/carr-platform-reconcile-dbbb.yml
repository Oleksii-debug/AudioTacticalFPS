name: CARR one-off platform reconciliation preflight
on:
  push:
    branches: [carr/platform-reconcile-dbbb-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-platform-reconcile-dbbb.yml']
permissions:
  contents: read
concurrency:
  group: carr-platform-reconcile-dbbb-${{ github.sha }}
  cancel-in-progress: false
jobs:
  portable-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Require actual portable media commands
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg tesseract-ocr tesseract-ocr-eng
          ffmpeg -version
          ffprobe -version
      - name: Install this exact source and compile every application module
        id: install
        run: |
          git rev-parse HEAD
          New-Item -ItemType Directory -Force ci-platform-results | Out-Null
          python -m pip install --only-binary=cryptography,cffi '.[test,sync]' 'lxml==6.1.3' 'cffi==2.1.1' 'pycparser==3.12'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m compileall -q src scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare exact DAISY schemas and validate actual publications
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $schemas = Join-Path $env:RUNNER_TEMP 'carr-daisy-preflight-schemas'
          python -I -B scripts/prepare_daisy_schemas.py --destination $schemas --report ci-platform-results/daisy-schema-preparation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failures = @()
          $previousPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = (Resolve-Path 'src').Path
            python -B scripts/daisy_schema_acceptance.py --schemas $schemas --report ci-platform-results/source-daisy-schema.json 2>&1 | Tee-Object 'ci-platform-results/source-daisy-schema.txt'
            if ($LASTEXITCODE -ne 0) { $failures += 'source-daisy-schema' }
          } finally { $env:PYTHONPATH = $previousPythonPath }
          python -I -B scripts/daisy_schema_acceptance.py --require-installed --schemas $schemas --report ci-platform-results/installed-daisy-schema.json 2>&1 | Tee-Object 'ci-platform-results/installed-daisy-schema.txt'
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-daisy-schema' }
          if ($failures.Count) { throw ('DAISY structural validation failed: ' + ($failures -join ', ')) }
      - name: Require new contracts and affected existing boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
