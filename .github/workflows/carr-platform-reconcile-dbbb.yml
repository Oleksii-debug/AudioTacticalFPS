          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic log summary failed; full output remains retained.' }
          if ($suiteExit -ne 0) { exit $suiteExit }
      - name: Require the complete provider policy against synthetic loopback HTTP and TLS
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # These tests own literal-loopback synthetic peers and test credentials.
          # Retain actual HTTP/TLS deadlines; they cannot run under ci_check's
          # unconditional offline socket guard. No live provider is contacted.
          $providerPolicy = @'
          import json, pathlib, sys, sysconfig, xml.etree.ElementTree as ET
          import carr_library
          import pytest
          origin = pathlib.Path(carr_library.__file__).resolve()
          assert origin.is_relative_to(pathlib.Path(sysconfig.get_path('purelib')).resolve())
          assert not origin.is_relative_to(pathlib.Path.cwd() / 'src')
          class RejectExpectedFailures:
              seen = False
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, 'wasxfail'):
                      self.seen = True
          policy = RejectExpectedFailures()
          report = 'ci-platform-results/provider-policy-loopback.xml'
          status = pytest.main(['-q', '-o', 'addopts=', '-o', 'pythonpath=',
              '-o', 'xfail_strict=true', '--import-mode=importlib',
              'tests/assistant/test_provider_policy.py', '--junitxml=' + report],
              plugins=[policy])
          cases = list(ET.parse(report).iter('testcase'))
          failed = sum(any(case.find(tag) is not None for tag in ('failure', 'error')) for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          accepted = status == 0 and bool(cases) and failed == skipped == 0 and not policy.seen
          print(json.dumps(dict(status='PASS' if accepted else 'FAIL',
              scope='synthetic literal-loopback HTTP/TLS fixtures; no live provider',
              passed=len(cases)-failed-skipped, failed=failed, skipped=skipped,
              expected_failure_observed=policy.seen, module_origin=str(origin))))
          raise SystemExit(0 if accepted else 1)
          '@
          $providerPolicy | python -I -B -X utf8 - 2>&1 | Tee-Object ci-platform-results/provider-policy-loopback.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact-source preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-platform-preflight-${{ github.sha }}
          path: |
            carr-library/ci-platform-results/
            carr-library/ci-results/
          if-no-files-found: error
          retention-days: 7

  windows-reading-appearance:
    runs-on: windows-2022
    timeout-minutes: 138
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned desktop dependencies and this exact application wheel
        id: install
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory -Force 'ci-appearance-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne $env:GITHUB_SHA) { throw 'Checkout does not match the immutable candidate.' }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9 openpyxl==3.1.5 et-xmlfile==2.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelRoot = Join-Path $env:RUNNER_TEMP 'carr-appearance-application-wheel'
          New-Item -ItemType Directory -Path $wheelRoot | Out-Null
          python -m pip wheel --no-deps --wheel-dir $wheelRoot .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $wheelRoot -File -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one application wheel from this checkout.' }
          python -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            source_commit = $sourceCommit
            wheel_name = $wheels[0].Name
            wheel_sha256 = (Get-FileHash -LiteralPath $wheels[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            package_origin = 'built from the exact checked-out public source; native probes verify loaded module hashes'
          } | ConvertTo-Json | Set-Content -LiteralPath 'ci-appearance-results/application-source.json' -Encoding utf8
      - name: Prepare pinned audio for actual clip processing and native controls
        id: audio
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-clip-preflight-audio'
          python -I -B packaging/prepare_windows_audio.py --output $audio --download | Tee-Object 'ci-appearance-results/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_AUDIO_RUNTIME=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the existing verified OCR engine for automatic-language controls
        id: ocr
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python -m pip install --only-binary=:all: zstandard==0.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $work = Join-Path $env:RUNNER_TEMP 'carr-automatic-ocr-preflight'
          New-Item -ItemType Directory -Path $work | Out-Null
          $ocr = Join-Path $work 'ocr'
          python -I -B packaging/prepare_windows_ocr.py --cache (Join-Path $work 'cache') --output $ocr --source-archive (Join-Path $work 'ocr-source.tar') --download | Tee-Object 'ci-appearance-results/ocr-preparation.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_CI_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARR_OCR_DIR=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require real automatic-language OCR and native source and installed choices
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.ocr.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $failures = @()
          python -B scripts/ci_check.py tests/extract/test_automatic_ocr_native.py 2>&1 | Tee-Object 'ci-appearance-results/automatic-ocr-source.txt' | Out-Null
          $suiteExit = $LASTEXITCODE
          python -I -B scripts/ci_summarize_log.py 'ci-appearance-results/automatic-ocr-source.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Automatic OCR diagnostic summary failed; full output remains retained.' }
          if ($suiteExit -ne 0) { $failures += 'actual-automatic-ocr' }
          python -I -B -X utf8 scripts/windows_automatic_ocr_smoke.py --source src --report ci-appearance-results/source-automatic-ocr.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-automatic-ocr-controls' }
          python -I -B -X utf8 scripts/windows_automatic_ocr_smoke.py --expect-installed --report ci-appearance-results/installed-automatic-ocr.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-automatic-ocr-controls' }
          if ($failures.Count) { throw ('Required automatic OCR failures: ' + ($failures -join ', ')) }

      - name: Require actual source and installed result-page controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          $failures = @()
          python -I -B -X utf8 scripts/windows_search_pagination_smoke.py --source . --report ci-appearance-results/source-search-pagination.json
          if ($LASTEXITCODE -ne 0) { $failures += 'source-search-pagination' }
          python -I -B -X utf8 scripts/windows_search_pagination_smoke.py --expect-installed --report ci-appearance-results/installed-search-pagination.json
          if ($LASTEXITCODE -ne 0) { $failures += 'installed-search-pagination' }
          if ($failures.Count) { throw ('Required native search pagination failures: ' + ($failures -join ', ')) }

      - name: Prepare exact DAISY schemas and validate actual publications
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.audio.outcome == 'success' }}
        timeout-minutes: 12
