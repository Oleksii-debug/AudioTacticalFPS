name: Independent playback controls review

on:
  push:
    branches: [carr/playback-controls-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-playback-controls-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-controls-review-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    name: Playback controls / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: install
        run: |
          python -m pip install ".[test,sync]"
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
      - name: Install actual Windows desktop
        id: desktop
        if: runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Prepare actual Linux audio tools
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-playback-controls
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version > ci-playback-controls/ffmpeg-version.txt
          ffprobe -version > ci-playback-controls/ffprobe-version.txt
      - name: Prepare pinned Windows audio tools
        id: audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'ci-playback-controls' | Out-Null
          $audio = Join-Path $env:RUNNER_TEMP 'carr-playback-controls-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download | Tee-Object 'ci-playback-controls/audio-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_PLAYBACK_CONTROLS_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile the exact selected source and tests
        run: |
          mkdir -p ci-playback-controls
          python -B - <<'PY'
          from pathlib import Path
          paths = ["src/carr_library/speech/player.py","src/carr_library/speech/listening.py","src/carr_library/speech/_wave_output.py","src/carr_library/reader/live_player.py","src/carr_library/reader/live_reading.py","src/carr_library/ui/playback_settings.py","src/carr_library/ui/playback_navigation.py","src/carr_library/ui/studio_dialog.py","src/carr_library/ui/studio_clips.py","src/carr_library/ui/live_reading.py","src/carr_library/ui/builtin_keyboard_commands.py","src/carr_library/assistant/player_tools.py","src/carr_library/audio/dsp.py","src/carr_library/audio/process.py","src/carr_library/audio/windows_job.py","tests/speech/test_listening.py","tests/speech/test_wave_output.py","tests/reader/test_live_listening.py","tests/ui/test_playback_settings.py","tests/reader/test_live_player.py","tests/reader/test_live_reading.py","tests/ui/test_live_reading_controls.py","tests/ui/test_playback_navigation.py","tests/ui/test_studio_playback_actions.py","tests/speech/test_output_device_playback.py","tests/studio/test_clip_dialog.py","tests/studio/test_clip_timeline_dialog.py","tests/ui/test_studio_progress_isolation.py","tests/audio/test_output_devices.py","tests/audio/test_dsp.py","tests/audio/test_process_deadline.py","tests/audio/test_process_scratch.py","tests/assistant/test_player_tools.py"]
          paths.extend(["scripts/windows_playback_settings_smoke.py",
              "scripts/windows_clip_editor_smoke.py", "scripts/windows_publishing_smoke.py",
              "tests/speech/test_listening_posix.py"])
          for name in paths:
              compile(Path(name).read_bytes(), name, "exec")
          print("Compiled exact selected files:", len(paths))
          PY
      - name: Require current source controls and owner boundaries without skips
        run: |
          python scripts/ci_check.py --diagnostics --jobs 2 \
            tests/speech/test_listening.py \
            tests/speech/test_wave_output.py \
            tests/reader/test_live_listening.py \
            tests/ui/test_playback_settings.py \
            tests/reader/test_live_player.py \
            tests/reader/test_live_reading.py \
            tests/ui/test_live_reading_controls.py \
            tests/ui/test_playback_navigation.py \
            tests/ui/test_studio_playback_actions.py \
            tests/speech/test_output_device_playback.py \
            tests/studio/test_clip_dialog.py \
            tests/studio/test_clip_timeline_dialog.py \
            tests/ui/test_studio_progress_isolation.py \
            tests/audio/test_output_devices.py \
            tests/audio/test_dsp.py \
            tests/audio/test_process_deadline.py \
            tests/audio/test_process_scratch.py \
            tests/assistant/test_player_tools.py 2>&1 | tee ci-playback-controls/source.txt
      - name: Require POSIX listening descriptor boundaries without skips
        if: "!cancelled() && runner.os == 'Linux' && steps.install.outcome == 'success'"
        run: |
          python scripts/ci_check.py --diagnostics --jobs 1 \
            tests/speech/test_listening_posix.py 2>&1 | tee ci-playback-controls/source-posix.txt
      - name: Require identical installed controls and owner boundaries without skips
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: |
          python -I -B -X utf8 - <<'PY' 2>&1 | tee ci-playback-controls/installed.txt
          from hashlib import sha256
          import importlib
          import json
          from pathlib import Path
          import sys
          import sysconfig
          import xml.etree.ElementTree as ET
          import pytest
          import carr_library
          import bootstrap
          from carr_library.native_runtime import activate_bundled_runtime

          checkout = Path.cwd().resolve()
          purelib = Path(sysconfig.get_path("purelib")).resolve()
          package = Path(carr_library.__file__).resolve().parent
          assert package == purelib / "carr_library", (package, purelib)
          assert Path(bootstrap.__file__).resolve().is_relative_to(purelib)
          selected = ["src/carr_library/speech/player.py","src/carr_library/speech/listening.py","src/carr_library/speech/_wave_output.py","src/carr_library/reader/live_player.py","src/carr_library/reader/live_reading.py","src/carr_library/ui/playback_settings.py","src/carr_library/ui/playback_navigation.py","src/carr_library/ui/studio_dialog.py","src/carr_library/ui/studio_clips.py","src/carr_library/ui/live_reading.py","src/carr_library/ui/builtin_keyboard_commands.py","src/carr_library/assistant/player_tools.py","src/carr_library/audio/dsp.py","src/carr_library/audio/process.py","src/carr_library/audio/windows_job.py"]
          def identities():
              result = {}
              for source in selected:
                  relative = Path(source).relative_to("src")
                  path = purelib / relative
                  assert path.resolve().is_relative_to(purelib)
                  assert path.read_bytes() == (checkout / source).read_bytes(), source
                  result[str(relative)] = {"path": str(path.resolve()), "sha256": sha256(path.read_bytes()).hexdigest()}
                  name = ".".join(relative.with_suffix("").parts)
                  if not name.startswith("carr_library.ui.") or sys.platform == "win32":
                      module = importlib.import_module(name)
                      assert Path(module.__file__).resolve() == path.resolve(), name
              return result
          native = activate_bundled_runtime()
          try:
              before = identities()
              suites = ["tests/speech/test_listening.py","tests/speech/test_wave_output.py","tests/reader/test_live_listening.py","tests/ui/test_playback_settings.py","tests/reader/test_live_player.py","tests/reader/test_live_reading.py","tests/ui/test_live_reading_controls.py","tests/ui/test_playback_navigation.py","tests/ui/test_studio_playback_actions.py","tests/speech/test_output_device_playback.py","tests/studio/test_clip_dialog.py","tests/studio/test_clip_timeline_dialog.py","tests/ui/test_studio_progress_isolation.py","tests/audio/test_output_devices.py","tests/audio/test_dsp.py","tests/audio/test_process_deadline.py","tests/audio/test_process_scratch.py","tests/assistant/test_player_tools.py"]
              if sys.platform != "win32":
                  suites.append("tests/speech/test_listening_posix.py")
              output = checkout / "ci-playback-controls" / "installed.xml"
              code = pytest.main(["-q", "-o", "pythonpath=", "--junitxml=" + str(output), *suites])
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in ET.parse(output).getroot().iter("testsuite"):
                  for name in totals:
                      totals[name] += int(suite.attrib.get(name, 0))
              assert code == 0, (code, totals)
              assert totals["tests"] > 0 and not any(totals[name] for name in ("failures", "errors", "skipped")), totals
              assert identities() == before
              print(json.dumps({"installed": totals, "source_identity": before,
                  "actual_ffmpeg_listening": "PASS", "native_window": "NOT_RUN",
                  "physical_output": "NOT_RUN", "nvda": "NOT_RUN"}, ensure_ascii=False))
          finally:
              if native is not None:
                  native.close()
          PY
      - name: Require installed native feature workflows with egress blocked
        if: "!cancelled() && runner.os == 'Windows' && steps.install.outcome == 'success' && steps.desktop.outcome == 'success' && steps.audio.outcome == 'success'"
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_PLAYBACK_CONTROLS_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_PLAYBACK_CONTROLS_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_PLAYBACK_CONTROLS_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-playback-controls/external-test-audio-binding.json'
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Get-Process -Id $PID).Path,
            (Join-Path $env:CARR_PLAYBACK_CONTROLS_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_PLAYBACK_CONTROLS_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-playback-controls-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-playback-controls/runtime-firewall.json'
            $probes = @(
              @{ name='native-playback-settings'; script='scripts/windows_playback_settings_smoke.py'; arguments=@('--audio-evidence', 'ci-playback-controls/external-test-audio-binding.json') }
            )
            $failures = @()
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 -X faulthandler $scriptPath @probeArgs 2>&1 | Tee-Object ('ci-playback-controls/' + $probe.name + '.txt')
              if ($LASTEXITCODE -ne 0) { $failures += $probe.name }
            }
            if ($failures.Count -ne 0) { throw ('Required native workflows failed: ' + ($failures -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve exact review source and dependency identity
        if: always()
        run: |
          mkdir -p ci-playback-controls
          git rev-parse HEAD > ci-playback-controls/review-head.txt
          git status --short > ci-playback-controls/worktree.txt
          python -m pip freeze > ci-playback-controls/dependencies.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: playback-controls-${{ matrix.os }}-${{ github.sha }}
          path: |
            carr-library/ci-playback-controls/
            carr-library/.pytest-diagnostics/
          if-no-files-found: error
