name: Actual Word controls and optional Office qualification
on:
  push:
    branches: [carr/word-native-review-20261128]
    paths: ['carr-library/**', '.github/workflows/carr-word-native-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: word-native-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Installed Word controls and separate Office status / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      CARR_WORD_NATIVE_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        id: word_install
        run: |
          python -m pip install ".[test,sync]"
          python -m pip install --only-binary=:all: --require-hashes -r packaging/trusted-client.lock
      - name: Install actual Windows desktop
        id: word_desktop
        if: runner.os == 'Windows'
        run: |
          python -m pip install ".[desktop]"
          python -m pip install wxPython==4.2.4
          python -m pip check
      - name: Prepare complete installed and pinned-license bindings
        run: |
          mkdir -p ci-word-native
          cat > ci-word-native/native-bindings.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import subprocess
          
          assert sys.flags.isolated and not os.environ.get('PYTHONPATH')
          assert len(sys.argv) == 3
          phase, label = sys.argv[1:]
          assert phase in ('before', 'after') and label in ('word-controls', 'word-office')
          root = Path.cwd().resolve()
          source = (root / 'src' / 'carr_library').resolve()
          installed = (Path(sysconfig.get_path('purelib')) / 'carr_library').resolve()
          assert source != installed and not installed.is_relative_to(root / 'src')
          expected_head = os.environ['CARR_WORD_NATIVE_HEAD']
          assert len(expected_head) == 40 and all(c in '0123456789abcdef' for c in expected_head)
          observed_head = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True,
              text=True, timeout=10).stdout.strip()
          assert observed_head == expected_head, (observed_head, expected_head)
          selected = installed
          mode = 'installed'
          artifacts = root / 'ci-word-native'
          names = ["carr_library.application","carr_library.durable_state","carr_library.academic_integration.documents","carr_library.academic_integration.formatting","carr_library.academic_integration.regeneration","carr_library.academic_integration.runtime_adapter","carr_library.academic_integration.doi","carr_library.academic_integration.word_com","carr_library.ui.citation_formatting","carr_library.ui.word_citations_dialog","carr_library.ui.academic_library_dialog","carr_library.citations.bibliography_workbench","carr_library.citations.csl","carr_library.research.export_file","carr_library.ui.desktop_app","carr_library.audio.process","carr_library.audio.models","carr_library.audio.cleanup","carr_library.native_runtime"]
          
          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              for relative in ["academic_integration/UPSTREAM.json","academic_integration/csl_worker.cjs","academic_integration/locales/locales-en-US.xml","academic_integration/locales/locales-sk-SK.xml","academic_integration/locales/locales-uk-UA.xml","academic_integration/styles/apa.csl","academic_integration/styles/chicago-author-date.csl","academic_integration/styles/chicago-fullnote-bibliography.csl","academic_integration/styles/harvard-cite-them-right.csl","academic_integration/styles/ieee.csl","academic_integration/styles/modern-language-association.csl","academic_integration/styles/nlm-citation-sequence.csl","academic_integration/vendor/LICENSE","academic_integration/vendor/LICENSE-AGPL-3.0.txt","academic_integration/vendor/LICENSE-CC-BY-SA-3.0.txt","academic_integration/vendor/LICENSE-CPAL-1.0.txt","academic_integration/vendor/NOTICE.txt","academic_integration/vendor/SORT-MACRO-CACHE-NOTICE.txt","academic_integration/vendor/citeproc-sort-macro-cache.json","academic_integration/vendor/citeproc.js"]:
                  path = directory / relative
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              return result
          
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, 'Installed Python file set/content differs from checkout.'
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          
          scripts = [root / 'scripts' / name for name in (
              'windows_word_controls_smoke.py', 'windows_word_citations_smoke.py',
              'windows_speech_preparation_smoke.py', 'windows_publishing_smoke.py')]
          scripts.append(Path(__file__).resolve())
          for name in names:
              path = source.joinpath(*name.split('.')[1:]).with_suffix('.py')
              compile(path.read_bytes(), str(path), 'exec')
          for path in scripts:
              compile(path.read_bytes(), str(path), 'exec')
          proof = dict(schema='carr.native-installed-bindings/1', commit=observed_head,
              source=str(source), installed=str(installed), package_files=expected,
              package_inventory_sha256=inventory_digest, origins=origins(),
              scripts={str(path): sha256(path.read_bytes()).hexdigest() for path in scripts})
          before = artifacts / (label + '-bindings-before.json')
          if phase == 'after':
              assert before.is_file() and not before.is_symlink() and before.stat().st_size <= 8 * 1024**2
              assert json.loads(before.read_bytes()) == proof, 'Installed/source/native binding changed during the actual probe.'
          target = artifacts / (label + '-bindings-' + phase + '.json')
          raw = (json.dumps(proof, ensure_ascii=False, sort_keys=True, allow_nan=False) + '\n').encode('utf-8')
          assert len(raw) <= 8 * 1024**2
          with target.open('xb') as stream:
              stream.write(raw)
              stream.flush()
              os.fsync(stream.fileno())
          print(json.dumps(dict(status='IDENTITY_VERIFIED', phase=phase, probe=label,
              package_python_files=sum(name.endswith('.py') for name in expected),
              package_inventory_files=len(expected), origins=len(proof['origins']),
              package_inventory_sha256=inventory_digest, script_count=len(scripts),
              qualification='INSTALLED_BINDINGS_ONLY; actual native outcome is separate'), sort_keys=True), flush=True)
          
          PY
      - name: Require actual native Word controls and current Desktop worker
        if: "!cancelled() && runner.os == 'Windows' && steps.word_install.outcome == 'success' && steps.word_desktop.outcome == 'success'"
        timeout-minutes: 8
        shell: pwsh
        run: |
          $scriptPath = 'scripts/windows_word_controls_smoke.py'
          python -I -B -c "from pathlib import Path; p=Path('scripts/windows_word_controls_smoke.py'); compile(p.read_bytes(), str(p), 'exec')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scriptBefore = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $python = (Get-Command python.exe).Source
          Remove-Item Env:PYTHONPATH, Env:PYTEST_ADDOPTS, Env:PYTEST_PLUGINS -ErrorAction SilentlyContinue
          $bindingHelper = 'ci-word-native/native-bindings.py'
          $bindingReceipt = 'ci-word-native/word-controls-bindings-before.json'
          $bindingHelperHash = (Get-FileHash -LiteralPath $bindingHelper -Algorithm SHA256).Hash
          & $python -I -B -X utf8 $bindingHelper before word-controls
          if ($LASTEXITCODE -ne 0) { throw 'Required installed native bindings failed before execution.' }
          $bindingReceiptHash = (Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Get-Process -Id $PID).Path) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $runtimeBefore = @{}
          foreach ($program in $programs) { $runtimeBefore[$program] = (Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() }
          $rulePrefix = 'CARR-word-controls-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; runtime_before=$runtimeBefore; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 5 | Set-Content 'ci-word-native/word-controls-runtime-firewall.json'
            & $python -I -B -X utf8 -X faulthandler $scriptPath 2>&1 | Tee-Object 'ci-word-native/native-word-controls.txt'
            $probeExit = $LASTEXITCODE
            if ((Get-FileHash -LiteralPath $bindingHelper -Algorithm SHA256).Hash -ne $bindingHelperHash) { throw 'Native binding helper bytes changed.' }
            if ((Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash -ne $bindingReceiptHash) { throw 'Native pre-execution binding receipt changed.' }
            & $python -I -B -X utf8 $bindingHelper after word-controls
            if ($LASTEXITCODE -ne 0) { throw 'Required installed native bindings changed during execution.' }
            if ((Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash -ne $bindingReceiptHash) { throw 'Native binding receipt changed during final verification.' }
            $scriptAfter = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($scriptAfter -ne $scriptBefore) { throw 'Native word-controls probe bytes changed during execution.' }
            foreach ($program in $programs) {
              if ((Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeBefore[$program]) { throw 'A selected native executable changed during execution.' }
            }
            @{ script_sha256=$scriptAfter; selected_runtime_bytes_unchanged=$true; exit_code=$probeExit } | ConvertTo-Json | Set-Content 'ci-word-native/word-controls-runtime-final.json'
            if ($probeExit -ne 0) { throw ('Required native Word controls failed with exit ' + $probeExit) }
            $outcome = (Get-Content 'ci-word-native/native-word-controls.txt' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 1) | ConvertFrom-Json
            if ($outcome.schema -ne 'carr-native-word-controls/1' -or $outcome.status -ne 'PASS' -or $outcome.actual_native_word_controls -ne 'PASS' -or $outcome.actual_office -ne 'NOT_RUN' -or $outcome.checks -le 0) { throw 'Actual native Word controls did not provide their complete scoped result.' }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Observe optional actual Office without transferring native UI qualification
        if: "!cancelled() && runner.os == 'Windows' && steps.word_install.outcome == 'success' && steps.word_desktop.outcome == 'success'"
        timeout-minutes: 8
        shell: pwsh
        run: |
          $scriptPath = 'scripts/windows_word_citations_smoke.py'
          python -I -B -c "from pathlib import Path; p=Path('scripts/windows_word_citations_smoke.py'); compile(p.read_bytes(), str(p), 'exec')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scriptBefore = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $python = (Get-Command python.exe).Source
          Remove-Item Env:PYTHONPATH, Env:PYTEST_ADDOPTS, Env:PYTEST_PLUGINS -ErrorAction SilentlyContinue
          $bindingHelper = 'ci-word-native/native-bindings.py'
          $bindingReceipt = 'ci-word-native/word-office-bindings-before.json'
          $bindingHelperHash = (Get-FileHash -LiteralPath $bindingHelper -Algorithm SHA256).Hash
          & $python -I -B -X utf8 $bindingHelper before word-office
          if ($LASTEXITCODE -ne 0) { throw 'Required installed native bindings failed before execution.' }
          $bindingReceiptHash = (Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Get-Process -Id $PID).Path) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $runtimeBefore = @{}
          foreach ($program in $programs) { $runtimeBefore[$program] = (Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() }
          $rulePrefix = 'CARR-word-office-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; runtime_before=$runtimeBefore; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 5 | Set-Content 'ci-word-native/word-office-runtime-firewall.json'
            & $python -I -B -X utf8 -X faulthandler $scriptPath 2>&1 | Tee-Object 'ci-word-native/native-word-office.txt'
            $probeExit = $LASTEXITCODE
            if ((Get-FileHash -LiteralPath $bindingHelper -Algorithm SHA256).Hash -ne $bindingHelperHash) { throw 'Native binding helper bytes changed.' }
            if ((Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash -ne $bindingReceiptHash) { throw 'Native pre-execution binding receipt changed.' }
            & $python -I -B -X utf8 $bindingHelper after word-office
            if ($LASTEXITCODE -ne 0) { throw 'Required installed native bindings changed during execution.' }
            if ((Get-FileHash -LiteralPath $bindingReceipt -Algorithm SHA256).Hash -ne $bindingReceiptHash) { throw 'Native binding receipt changed during final verification.' }
            $scriptAfter = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($scriptAfter -ne $scriptBefore) { throw 'Native word-office probe bytes changed during execution.' }
            foreach ($program in $programs) {
              if ((Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeBefore[$program]) { throw 'A selected native executable changed during execution.' }
            }
            @{ script_sha256=$scriptAfter; selected_runtime_bytes_unchanged=$true; exit_code=$probeExit } | ConvertTo-Json | Set-Content 'ci-word-native/word-office-runtime-final.json'
            if ($probeExit -ne 0) { throw ('Actual Office probe failed with exit ' + $probeExit) }
            $outcome = (Get-Content 'ci-word-native/native-word-office.txt' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 1) | ConvertFrom-Json
            if ($outcome.schema -ne 'carr-native-word-citations/2' -or $outcome.status -notin @('PASS','NOT_RUN')) { throw 'Optional Word qualification returned an invalid status.' }
            if ($outcome.status -eq 'PASS' -and ($outcome.actual_office -ne 'PASS' -or $outcome.checks -ne 20 -or $outcome.check_names.Count -ne 20)) { throw 'Actual Office result lacks its twenty required oracles.' }
            if ($outcome.status -eq 'NOT_RUN' -and ($outcome.actual_office -ne 'NOT_RUN' -or $outcome.checks -ne 0)) { throw 'Unavailable Office was misreported as executed.' }
            $outcome | ConvertTo-Json -Depth 8 | Set-Content 'ci-word-native/actual-office-status.json'

          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-word-native
          git rev-parse HEAD > ci-word-native/commit.txt
          git rev-parse HEAD^{tree} > ci-word-native/tree.txt
          python -m pip freeze > ci-word-native/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: word-native-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-word-native
          if-no-files-found: error
