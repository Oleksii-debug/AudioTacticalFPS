  focused-windows:
    name: Windows focused checked publication, indexed search and owned resource contracts
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: carr-next9-final-source-focused-windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare existing pinned Windows source dependencies
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path ci-next9-focused-windows | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'The requested source commit changed.' }
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed.' }
          # Reuse the integrated main workflow's exact test-only PDF fixture pin.
          & python -B -m pip install --only-binary=:all: reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { throw 'The PDF fixture dependency installation failed.' }
          & python -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependencies are inconsistent.' }
          & python -I -B -c "import json; from importlib.metadata import version; from reportlab.pdfgen.canvas import Canvas; assert version('reportlab') == '4.4.9'; print(json.dumps({'status':'PASS','reportlab_version':version('reportlab'),'canvas_import':Canvas.__module__+'.'+Canvas.__name__}))" | Tee-Object 'ci-next9-focused-windows/pdf-fixture-runtime.json'
          if ($LASTEXITCODE -ne 0) { throw 'The PDF fixture import or exact version probe failed.' }
      - name: Prepare existing pinned external codec for actual resource admission cases
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $audio = Join-Path $env:RUNNER_TEMP 'carr-focused-source-audio'
          & python -B packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-focused-source-audio-cache') --output $audio --download | Tee-Object 'ci-next9-focused-windows/audio-preparation.json'
          if ($LASTEXITCODE -ne 0) { throw 'The existing pinned source-test codec could not be prepared.' }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_DIAG_AUDIO_DIR=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bind exact source suites, immutable companions and actual codec
        id: source_identity
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from hashlib import sha1, sha256
          import importlib.util
          import json, os, platform, shutil, subprocess, sys
