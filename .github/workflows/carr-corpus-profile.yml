name: Diagnostic profile of the retained corpus traversal

on:
  push:
    branches: ['carr/ci-corpus-profile-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Source 176 cases and instrumented 1000 books by 40 segments
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    concurrency:
      group: carr-corpus-profile-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        timeout-minutes: 5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Bind exact source and acquire the existing hashed test dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          from hashlib import sha1, sha256
          import json, os, pathlib, stat, subprocess, uuid
          root = pathlib.Path.cwd()
          pins = {"bootstrap/__init__.py":"6981b7faa1cca8d29f37fe85751c110c693dae55","src/carr_library/application.py":"82af31743ca5cc6557477f6492c08b912751f4a4","src/carr_library/search/paging.py":"1c8dd8d0cc764737d6169f74b98d6a575f6c3615","src/carr_library/search/literal.py":"ebc80347d09b35fc8f9d11858e38b2b424920ad8","src/carr_library/reader/reading_desk.py":"0acd7f25fb17de24b434741ff3b7cf2c634a4c8a","src/carr_library/catalog/read_views.py":"53bdbf577bd7da349347d8a58cb7f0f5792db138","src/carr_library/storage/revisions.py":"417a9920d4c25eacd36cc81f7441ea321c18d632","src/carr_library/durable_state.py":"d2b95bde04aa72cdd21ee6b4f0092d3350f84fcb","src/carr_library/catalog/registration.py":"337a2573b1483aeef87a1e3fc1fcd1b6f52fb0a9","src/carr_library/catalog/membership.py":"ddffa3b2bcd23fc23dbca5c8f1104031a4887908","src/carr_library/citations/text_attestation.py":"81f85562d1c12517567e9adc6bcd0b2580f6cac6","src/carr_library/ingest/retained_assets.py":"acbaabd4b5661daadc83dfec6cda9394deb35ce3","src/carr_library/ingest/pipeline.py":"656ac8f3943aa4bb59b7756f7982d7985179e3b2","src/carr_library/ingest/worker.py":"8ab4334be7f7728de84839a6a35cfae5a1347830","src/carr_library/ingest/publication.py":"a2b8c3a1f4ce5be17567b8bcd8cda743d73e7fb5","src/carr_library/ingest/batches.py":"07cec2575e5e72e4b252afcd787a3e7ce7c4aa66","src/carr_library/ingest/writer_guard.py":"2445a40f97cdb45bd590e64da415a18fae31ce54","src/carr_library/operations/broker.py":"f09561333d33ae68480260668ec05b617cd72213","src/carr_library/library_backup.py":"0ccbba5db4c41e78143f0ef11aef51bd3df55339","src/carr_library/pending_backup.py":"b2c3fc3a52e9d2fef5c019196ef239381c519fc7","src/carr_library/backup_capacity.py":"1fd11ab8d3a2be5434e32bdcba65447c55730ad7","src/carr_library/citations/printed_label_attestation.py":"4c9a65a79a27ad068452e2eb9cb50df4998a51c9","src/carr_library/citations/pdf_review_attestation.py":"f0fceb11ca212c02101277f4d67f7ac9c2ee15ad","src/carr_library/citations/historical.py":"4438576d15534f2f72a361e1ff3ef5d84b49f528","src/carr_library/catalog/intake.py":"8518f012491b542a57593af75993907983ddda0d","scripts/benchmark_semantic_cache.py":"898b05e37b5a50c018567e35c44ef71f1393535d","scripts/ci_check.py":"6ad3055cfcd7c6a1b1af8544ae462c5d51adb473","tests/packaging/test_library_scale_benchmark.py":"906487bd1970ad69b466945461da73bd50cfa941","tests/packaging/test_library_capacity_measurement.py":"a4677e149a71c76832896902db936b232f0f246e","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","tests/citations/test_attestation_cancellation.py":"8e1fe70637ed839a6120c2414e2933bfe16e2858","scripts/benchmark_library_scale.py":"7b6afc1463cb078e6aa47c37b9feeee356796844","tests/packaging/test_library_scale_profile.py":"4e79f8e4299f7adc414e575a0c59ba509984ead4","tests/catalog/test_text_screen_work.py":"3e14e33e4fadc3a53db39b54abd0027bcfb4cc9f","tests/search/test_ascii_mapping_work.py":"e65d39a85c08b831ddf4f4b1f58ecd5359b7cb5d","src/carr_library/search/presentation.py":"8ba46fa6ba4d7bafae451fab06d84ab4046bf64a"}
          suites = {"tests/packaging/test_library_scale_benchmark.py":30,"tests/packaging/test_library_capacity_measurement.py":25,"tests/citations/test_attestation_cancellation.py":15,"tests/packaging/test_library_scale_profile.py":7,"tests/catalog/test_text_screen_work.py":26,"tests/search/test_ascii_mapping_work.py":73}
          def git(*args):
              return subprocess.check_output(['git','--no-replace-objects',*args], text=True, timeout=30).strip()
          assert git('rev-parse','HEAD') == os.environ['EXPECTED_SOURCE_SHA']
          observed = {}
          for relative, expected in pins.items():
              path = root / relative
              before = path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and not getattr(before,'st_file_attributes',0) & 0x400
              raw = path.read_bytes()
              after = path.lstat()
              identity = lambda value: (value.st_dev,value.st_ino,value.st_size,value.st_mtime_ns,value.st_nlink)
              assert identity(after) == identity(before)
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, relative
              if relative.endswith('.py'):
                  compile(raw, relative, 'exec')
              observed[relative] = {'git_blob':expected,'sha256':sha256(raw).hexdigest(),'bytes':len(raw),'identity':identity(after)}
          assert len(pins) == 38 and len(suites) == 6 and sum(suites.values()) == 176
          evidence = root / 'ci-corpus-profile-diagnostic'
          evidence.mkdir(mode=0o700, exist_ok=False)
          document = {'schema':'carr-corpus-profile-inputs/1','qualification':'DIAGNOSTIC_ONLY',
              'source_commit':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),
              'inputs':observed,'suites':suites,'mode':'source',
              'declared_case':{'books':1000,'segments_per_book':40,'segment_bytes':256,
                  'result_page_size':37,'source_window_pages':100,'repeats':9,'phase_timeout':3600,
                  'construction':'retained-fixture','public_samples':0,'complete_backup':False}}
          (evidence/'identity-before.json').write_text(json.dumps(document,sort_keys=True,indent=2)+'\n', encoding='utf-8')
          output = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / ('carr-corpus-profile-'+uuid.uuid4().hex)
          assert not output.exists()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write('CARR_CORPUS_PROFILE_OUTPUT='+str(output)+'\n')
          print('Exact 38 pinned inputs and six whole source-suite contracts are admitted.')
          PY
          python -B -m pip install --only-binary=:all: --require-hashes \
            -r packaging/linux-sync-core-cp311.lock -r packaging/trusted-client.lock \
            -r packaging/windows-sync-test-cp311.lock
          python -I -B -m pip check
      - name: Require all old benchmark and new stop and diagnostic cases
        timeout-minutes: 30
        run: |
          set -euo pipefail
          status=0
          python -B scripts/ci_check.py --jobs 3 \
            tests/packaging/test_library_scale_benchmark.py \
            tests/packaging/test_library_capacity_measurement.py \
            tests/citations/test_attestation_cancellation.py \
            tests/packaging/test_library_scale_profile.py \
            tests/catalog/test_text_screen_work.py \
            tests/search/test_ascii_mapping_work.py \
            >ci-corpus-profile-diagnostic/source-checks.txt 2>&1 || status=$?
          python -I -B - "$status" <<'PY'
          from hashlib import sha256
          import json, pathlib, sys
          root = pathlib.Path('ci-corpus-profile-diagnostic')
          selected = json.loads((root/'identity-before.json').read_text(encoding='utf-8'))['suites']
          path = root/'source-checks.txt'
          assert path.stat().st_size <= 8*1024**2
          raw = path.read_bytes()
          lines = raw.decode('utf-8',errors='replace').splitlines()
          expected = [f'PASS: {suite}: junit_passed={count}, failed=0, skipped=0, pytest_exit=0'
                      for suite,count in selected.items()]
          valid = (int(sys.argv[1]) == 0 and all(lines.count(row) == 1 for row in expected)
                   and lines[-1:] == ['Required suites complete: 6; passed=6; failed=0'])
          report = {'status':'PASS' if valid else 'FAIL','suites':selected,
              'required_cases':176,'exit_code':int(sys.argv[1]),'log_sha256':sha256(raw).hexdigest(),
              'strict_zero_skip_xfail':True,'qualification':'Exact source regressions only'}
          (root/'source-summary.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n', encoding='utf-8')
          print(raw.decode('utf-8',errors='replace'), flush=True)
          assert valid, 'Every required whole suite must pass all exact cases.'
          PY
      - name: Profile the same complete source traversal
        # Three phases keep 3600 seconds each and the existing 30-second
        # direct-child allowance. Instrumentation stays inside actual work.
        timeout-minutes: 200
        run: |
          set -euo pipefail
          status=0
          python -I -B scripts/benchmark_library_scale.py \
            --output-dir "$CARR_CORPUS_PROFILE_OUTPUT" --source-root "$PWD/src" \
            --expected-application-origin "$PWD/src/carr_library/application.py" \
            --sizes 1000 --construction retained-fixture --public-samples 0 \
            --segments-per-book 40 --segment-bytes 256 --result-page-size 37 \
            --repeats 9 --phase-timeout 3600 --max-disk-bytes 8589934592 \
            --min-free-bytes 1073741824 --diagnostic-profile \
            >ci-corpus-profile-diagnostic/measurements.stdout.txt \
            2>ci-corpus-profile-diagnostic/measurements.stderr.txt || status=$?
          python -I -B - "$status" <<'PY'
          import json,pathlib,sys
          path=pathlib.Path('ci-corpus-profile-diagnostic/measurements-exit.json')
          path.write_text(json.dumps({'exit_code':int(sys.argv[1])})+'\n',encoding='utf-8')
          PY
          exit "$status"
      - name: Verify exact sources and retain only bounded reports
        id: evidence
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          from hashlib import sha1,sha256
          import json,math,os,pathlib,stat,subprocess
          root=pathlib.Path.cwd()
          evidence=root/'ci-corpus-profile-diagnostic'
          assert evidence.is_dir() and not evidence.is_symlink()
          identity=json.loads((evidence/'identity-before.json').read_text(encoding='utf-8'))
          def git(*args):
              return subprocess.check_output(['git','--no-replace-objects',*args],text=True,timeout=30).strip()
          assert git('rev-parse','HEAD') == identity['source_commit'] == os.environ['EXPECTED_SOURCE_SHA']
          assert git('rev-parse','HEAD^{tree}') == identity['source_tree']
          for relative,row in identity['inputs'].items():
              path=root/relative
              before=path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and not getattr(before,'st_file_attributes',0)&0x400
              raw=path.read_bytes()
              after=path.lstat()
              stamp=lambda v:[v.st_dev,v.st_ino,v.st_size,v.st_mtime_ns,v.st_nlink]
              assert stamp(before) == stamp(after) == row['identity']
              assert len(raw)==row['bytes'] and sha256(raw).hexdigest()==row['sha256']
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()==row['git_blob']
          (evidence/'identity-after.json').write_text(json.dumps(identity,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          reports=('configuration.json','library-corpus-scale.json','1000/corpus.json',
              '1000/build.json','1000/measure.json','1000/restart.json',
              '1000/build.stdout.txt','1000/build.stderr.txt',
              '1000/measure.stdout.txt','1000/measure.stderr.txt',
              '1000/restart.stdout.txt','1000/restart.stderr.txt')
          output=pathlib.Path(os.environ['CARR_CORPUS_PROFILE_OUTPUT'])
          copied=[]
          if output.exists():
              for parent in (*reversed(output.parents),output):
                  info=parent.lstat()
                  assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode) and not getattr(info,'st_file_attributes',0)&0x400
              for relative in reports:
                  path=output/relative
                  if not os.path.lexists(path):
                      continue
                  for parent in path.parents:
                      if parent==output:
                          break
                      info=parent.lstat()
                      assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode) and not getattr(info,'st_file_attributes',0)&0x400
                  before=path.lstat()
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size<=8*1024**2
                  assert not getattr(before,'st_file_attributes',0)&0x400
                  raw=path.read_bytes()
                  after=path.lstat()
                  stamp=lambda v:(v.st_dev,v.st_ino,v.st_size,v.st_mtime_ns,v.st_nlink)
                  assert stamp(before)==stamp(after) and len(raw)==before.st_size and b'\0' not in raw
                  if relative.endswith('.json'):
                      json.loads(raw.decode('utf-8'))
                  else:
                      raw.decode('utf-8')
                  destination=evidence/'reports'/relative
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  with destination.open('xb') as stream:
                      stream.write(raw)
                  copied.append({'path':'reports/'+relative,'bytes':len(raw),'sha256':sha256(raw).hexdigest()})
          success=False
          report_path=evidence/'reports/library-corpus-scale.json'
          if report_path.exists():
              report=json.loads(report_path.read_text(encoding='utf-8'))
              assert report['mode']=='source' and report['diagnostic_profile'] is True
              assert report['requested_sizes']==[1000]
              assert report['capacity']=={'construction':'retained-fixture','public_samples':0,'complete_backup':False}
              assert report['harness_sha256']==identity['inputs']['scripts/benchmark_library_scale.py']['sha256']
              config_raw=(evidence/'reports/configuration.json').read_bytes()
              configuration=json.loads(config_raw)
              assert sha256(config_raw).hexdigest()==report['configuration_sha256']
              assert configuration['sizes']==[1000] and configuration['diagnostic_profile'] is True
              assert configuration['capacity']==report['capacity']
              assert configuration['source_root']==str((root/'src').resolve(strict=True))
              assert configuration['case']=={'segments_per_book':40,'segment_bytes':256,'result_page_size':37,
                  'repeats':9,'phase_timeout':3600.0,'max_disk_bytes':8589934592,'min_free_bytes':1073741824}
              assert configuration['origins']==report['origins']
              assert len(report['origins'])==21
              for name,origin in report['origins'].items():
                  selected=('bootstrap/__init__.py' if name=='bootstrap' else 'src/'+name.replace('.','/')+'.py')
                  assert pathlib.Path(origin['path'])==(root/selected).resolve(strict=True)
                  assert origin['sha256']==identity['inputs'][selected]['sha256']
              profile_phases=[phase for phase in report['cases'][0]['phases']
                              if phase.get('phase')=='measure' and 'diagnostic_profile' in phase]
              assert len(profile_phases)<=1
              record=profile_phases[0]['diagnostic_profile'] if profile_phases else None
              if record is not None:
                  assert record['schema']=='carr-corpus-cprofile/1' and record['qualification']=='DIAGNOSTIC_ONLY'
                  assert record['maximum_functions']==80 and record['maximum_callers']==6
                  assert 0<len(record['functions'])<=80
                  assert len(json.dumps(record,ensure_ascii=True,allow_nan=False).encode('ascii'))<=512*1024
                  for row in record['functions']:
                      assert len(row['callers'])<=6 and type(row['omitted_callers']) is int and row['omitted_callers']>=0
                      for counts in (row,*row['callers']):
                          assert type(counts['primitive_calls']) is type(counts['total_calls']) is int
                          assert 0<=counts['primitive_calls']<=counts['total_calls']
                          assert all(type(counts[key]) in (int,float) and math.isfinite(counts[key]) and counts[key]>=0
                                     for key in ('self_seconds','cumulative_seconds'))
                  print('ACTUAL_CORPUS_PROFILE '+json.dumps(record,sort_keys=True,ensure_ascii=True),flush=True)
              if report['status']=='PASS':
                  phases=report['cases'][0]['phases']
                  assert len(report['cases'])==1 and [phase['phase'] for phase in phases]==['build','measure','restart']
                  assert len({phase['pid'] for phase in phases})==3
                  assert len({phase['corpus_sha256'] for phase in phases})==1
                  assert all(phase['status']=='PASS' and phase['exit_code']==0 and phase['process_reaped'] is True
                             and phase['books']==1000 and phase['segments']==40000 for phase in phases)
                  assert 'diagnostic_profile' in phases[1]
                  full=phases[1]['full_traversal']
                  assert full['results']==40000 and full['requests']==1200 and full['source_windows']==400
                  assert full['copied_result_samples']==1200 and full['exact_no_loss_no_duplicates'] is True
                  assert phases[1]['database_unchanged'] is phases[2]['database_unchanged'] is True
                  assert phases[2]['full_traversal']['status']=='NOT_REPEATED'
                  source=json.loads((evidence/'source-summary.json').read_text(encoding='utf-8'))
                  exit_value=json.loads((evidence/'measurements-exit.json').read_text(encoding='utf-8'))
                  success=source['status']=='PASS' and source['required_cases']==176 and exit_value['exit_code']==0
          summary={'schema':'carr-corpus-profile-diagnostic/1','status':'PASS' if success else 'NOT_PASS',
              'qualification':'DIAGNOSTIC_ONLY','source_commit':identity['source_commit'],
              'source_tree':identity['source_tree'],'inputs_unchanged':True,'source_cases_required':176,
              'retained_reports':copied,'full_2m_capacity':'NOT_RUN_BY_THIS_DIAGNOSTIC',
              'unprofiled_latency_or_speedup':'NOT_MEASURED','raw_binary_profile_retained':False}
          (evidence/'diagnostic-summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          allowed={'identity-before.json','identity-after.json','source-checks.txt','source-summary.json',
                   'measurements.stdout.txt','measurements.stderr.txt','measurements-exit.json','diagnostic-summary.json'}
          allowed.update('reports/'+name for name in reports)
          total=0
          files=list(evidence.rglob('*'))
          assert files and len(files)<=len(allowed)+2
          for path in files:
              info=path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0)&0x400
              relative=path.relative_to(evidence).as_posix()
              if stat.S_ISDIR(info.st_mode):
                  assert relative in ('reports','reports/1000')
                  continue
              assert relative in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink==1
              assert info.st_size<=8*1024**2
              total+=info.st_size
              assert total<=64*1024**2
              raw=path.read_bytes()
              assert b'\0' not in raw
              if path.suffix=='.json':
                  json.loads(raw.decode('utf-8'))
              else:
                  raw.decode('utf-8')
          print(json.dumps(summary,sort_keys=True),flush=True)
          PY
      - name: Require a complete diagnostic receipt
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          python -I -B -c "import json,pathlib; value=json.loads(pathlib.Path('ci-corpus-profile-diagnostic/diagnostic-summary.json').read_text(encoding='utf-8')); assert value['status']=='PASS' and value['qualification']=='DIAGNOSTIC_ONLY'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        with:
          name: corpus-profile-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-corpus-profile-diagnostic/
          if-no-files-found: error
