name: ASR completion boundary diagnosis

on:
  push:
    branches: [carr/asr-acoustic-proof-20261127]
    paths:
      - carr-library/tests/transcription/test_completion_boundary.py
      - carr-library/tests/transcription/test_typed_backup.py
      - carr-library/src/carr_library/transcription/**
      - carr-library/src/carr_library/operations/process.py
      - .github/workflows/carr-asr-completion-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install bounded test dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.4 pypdf==7.1.1 python-docx==1.2.0 defusedxml==0.7.1 Pillow==13.0.0
      - name: Require complete actual producer outcomes and backup admission
        run: python scripts/ci_check.py tests/transcription/test_completion_boundary.py tests/transcription/test_service.py tests/transcription/test_typed_backup.py
