name: CARR exact translation partition source regression

on:
  push:
    branches: ['carr/ci-next13-partition-*']
    paths: ['carr-library/**', '.github/workflows/carr-next13-partition.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partition-source:
    name: Whole partition 26 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    concurrency:
      group: carr-partition-${{ github.sha }}-${{ matrix.os }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify exact fixture, companions, policy and existing dependency locks
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact partition source head differs.' }
          $pins = @'
          from hashlib import sha1
          from pathlib import Path
          pins = {"scripts/ci_check.py":"6ad3055cfcd7c6a1b1af8544ae462c5d51adb473","tests/assistant/test_translation_layout.py":"4098d53def8821247f3fce2756c7f0da1443d2d3","tests/assistant/test_translation_local.py":"3db04918a25fa59567e5325be789ee7039b84d59","src/carr_library/assistant/translation.py":"29324c1891c4e1fc278f410af6221e50ae3f9b04","src/carr_library/assistant/translation_documents.py":"c4b72384ddede9f7e9f20c1e175bc8c97b602b78","src/carr_library/assistant/translation_partition.py":"db1fc8bc4c01149059cd8af346f23778fdc18855","src/carr_library/assistant/translation_layout.py":"f91173da3d90bb6b17be4d184799993ddfa91def","src/carr_library/assistant/translation_layout_worker.py":"ed5d9734edd89ac3c40ce19ccd6fc866f8c31d0f","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-sync-cp311.lock":"cd9c18a24d7a7ac203d81cf6a8d82d8bcb8f8ab3","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","tests/assistant/test_translation_partition.py":"d9204f853fd7fbdab8afbac7e9f148ced9f2264f"}
          for name, expected in pins.items():
              path = Path(name)
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, name
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          print('Exact partition fixture, real companions and unchanged source runner are bound.')
          '@
          $pins | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Partition source/policy pins differ.' }
          if ($env:RUNNER_OS -eq 'Windows') {
            & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          } else {
            & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/linux-sync-core-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          }
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned partition dependency closure failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Partition dependency closure is inconsistent.' }
      - name: Require the complete 26-case module under the existing strict source runner
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $proof = @'
          from hashlib import sha1, sha256
          import json, os, pathlib, stat, subprocess, sys
          mode, expected_before, exit_code = sys.argv[1:]
          assert mode in ('before','after') and __debug__
          root = pathlib.Path.cwd().resolve()
          repo = root.parent
          evidence = root/'ci-partition-source'
          pins = {"scripts/ci_check.py":"6ad3055cfcd7c6a1b1af8544ae462c5d51adb473","tests/assistant/test_translation_layout.py":"4098d53def8821247f3fce2756c7f0da1443d2d3","tests/assistant/test_translation_local.py":"3db04918a25fa59567e5325be789ee7039b84d59","src/carr_library/assistant/translation.py":"29324c1891c4e1fc278f410af6221e50ae3f9b04","src/carr_library/assistant/translation_documents.py":"c4b72384ddede9f7e9f20c1e175bc8c97b602b78","src/carr_library/assistant/translation_partition.py":"db1fc8bc4c01149059cd8af346f23778fdc18855","src/carr_library/assistant/translation_layout.py":"f91173da3d90bb6b17be4d184799993ddfa91def","src/carr_library/assistant/translation_layout_worker.py":"ed5d9734edd89ac3c40ce19ccd6fc866f8c31d0f","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-sync-cp311.lock":"cd9c18a24d7a7ac203d81cf6a8d82d8bcb8f8ab3","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","tests/assistant/test_translation_partition.py":"d9204f853fd7fbdab8afbac7e9f148ced9f2264f"}
          def git(*args):
              return subprocess.run(['git','--no-replace-objects','-C',str(repo),*args],
                  check=True, capture_output=True, timeout=30).stdout
          def blob(raw):
              return sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest()
          def row(path):
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and not path.is_symlink()
              assert not getattr(info,'st_file_attributes',0) & 1024
              raw = path.read_bytes()
              assert len(raw) == info.st_size
              return dict(git_blob=blob(raw), sha256=sha256(raw).hexdigest(), bytes=len(raw))
          head = git('rev-parse','HEAD').decode().strip()
          assert head == os.environ['EXPECTED_SOURCE_SHA']
          inputs = {}
          for name, expected in pins.items():
              actual = row(root/name)
              assert actual['git_blob'] == expected == git('rev-parse',head+':carr-library/'+name).decode().strip(), name
              inputs[name] = actual
          package = {}
          entries = git('ls-tree','-rz','--full-tree',head,'carr-library/src','carr-library/bootstrap')
          for record in entries.decode('utf-8').split('\0'):
              if not record:
                  continue
              header, path = record.split('\t',1)
              mode_bits, kind, expected = header.split()
              if not path.endswith('.py'):
                  continue
              assert kind == 'blob' and mode_bits in ('100644','100755')
              actual = row(repo/path)
              assert actual['git_blob'] == expected, path
              package[path] = actual
          assert package
          current = dict(source_commit=head, source_tree=git('rev-parse','HEAD^{tree}').decode().strip(),
              pins=inputs, package=package, python=sys.version, platform=sys.platform,
              qualification='Exact source only; no installed/native or provider-model qualification')
          before = evidence/'source-before.json'
          if mode == 'before':
              evidence.mkdir(exist_ok=False)
              with before.open('x', encoding='utf-8') as stream:
                  json.dump(current, stream, ensure_ascii=True, indent=2)
          else:
              raw = before.read_bytes()
              assert len(raw) <= 8*1024*1024 and sha256(raw).hexdigest() == expected_before
              previous = json.loads(raw.decode('utf-8'))
              with (evidence/'source-after.json').open('x', encoding='utf-8') as stream:
                  json.dump(current, stream, ensure_ascii=True, indent=2)
              assert current == previous, 'Exact source or pinned companions changed during the actual run.'
              log = evidence/'contracts.txt'
              assert log.is_file() and not log.is_symlink() and log.stat().st_size <= 8*1024*1024
              raw = log.read_bytes()
              lines = raw.decode('utf-8-sig').splitlines()
              verdict = 'PASS: tests/assistant/test_translation_partition.py: junit_passed=26, failed=0, skipped=0, pytest_exit=0'
              assert int(exit_code) == 0 and lines.count(verdict) == 1
              assert lines[-1] == 'Required suites complete: 1; passed=1; failed=0'
              with (evidence/'summary.json').open('x', encoding='utf-8') as stream:
                  json.dump(dict(status='PASS', source_commit=head, source_tree=current['source_tree'],
                      whole_suites=1, passed=26, failed=0, skipped=0, expected_failures=False,
                      suite='tests/assistant/test_translation_partition.py',
                      source_before_after='PASS', source_files=len(package), platform=sys.platform,
                      log_sha256=sha256(raw).hexdigest(), installed='NOT_RUN', native='NOT_RUN',
                      qualification='Source-only fixture regression; full installed26 remains separately required'),
                      stream, ensure_ascii=True, indent=2)
              print('PASS: exact whole partition26, zero failure/skip/expected-failure, source unchanged.')
          '@
          $proof | & python -I -B -X utf8 - before '-' 0
          if ($LASTEXITCODE -ne 0) { throw 'Partition source-before proof failed.' }
          $before = (Get-FileHash -LiteralPath 'ci-partition-source/source-before.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          & python -B scripts/ci_check.py --jobs 1 tests/assistant/test_translation_partition.py 2>&1 | Tee-Object 'ci-partition-source/contracts.txt'
          $testExit = $LASTEXITCODE
          $proof | & python -I -B -X utf8 - after $before $testExit
          if ($LASTEXITCODE -ne 0) { throw 'Actual whole partition26 or source-after proof failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: translation-partition-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/ci-partition-source/source-before.json
            carr-library/ci-partition-source/source-after.json
            carr-library/ci-partition-source/contracts.txt
            carr-library/ci-partition-source/summary.json
          if-no-files-found: error
