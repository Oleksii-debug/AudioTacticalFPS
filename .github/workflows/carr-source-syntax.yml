name: CARR exact source syntax preflight
on:
  push:
    branches: ['carr/source-compile-*']
    paths: ['carr-library/**', '.github/workflows/carr-source-syntax.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-source-syntax-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: Exact Python syntax and declared entrypoints only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Parse all exact tracked Python and current standard harness bodies
        run: python -I -B carr-library/scripts/source_syntax_acceptance.py --source-commit "$GITHUB_SHA" --output syntax-results/source.json
      - name: Retain the bounded syntax-only receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-source-syntax-${{ github.sha }}
          path: syntax-results
          if-no-files-found: error
          retention-days: 14
