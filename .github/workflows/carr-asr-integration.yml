name: Root ASR integration contracts

on:
  push:
    branches: [carr/root-asr-integration-20261127]
    paths:
      - carr-library/**
      - carr-library/tests/transcription/**
      - carr-library/src/carr_library/operations/**
      - carr-library/tests/operations/**
      - .github/workflows/carr-asr-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Synthetic protocol / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install only protocol test dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.0 pypdf==7.1.1 python-docx==1.2.0 defusedxml==0.7.1 Pillow==13.0.0
      - name: Require actual subprocess and strict file-contract tests
        run: python scripts/ci_check.py tests/transcription/test_verified_protocol.py tests/transcription/test_verified_runtime.py tests/transcription/test_verified_runtime_dependencies.py tests/transcription/test_verified_runtime_launch.py tests/transcription/test_verified_runtime_recovery.py tests/transcription/test_verified_runtime_stdlib.py tests/transcription/test_verified_runtime_handoff_1.py tests/transcription/test_verified_runtime_handoff_2.py tests/transcription/test_verified_runtime_handoff_3.py tests/transcription/test_service.py tests/transcription/test_runtime_admission.py tests/operations/test_resources.py tests/operations/test_worker_start_cleanup.py tests/ui/test_transcription_dialog.py tests/ui/test_operations_policy.py tests/e2e/test_transcription_cli.py tests/ui/test_audio_studio.py tests/e2e/test_audio_cli.py tests/operations/test_root_production_admission.py tests/operations/test_root_facade.py tests/transcription/test_typed_backup.py tests/storage/test_complete_pending_backup.py tests/storage/test_library_backup.py tests/assistant/test_complete_recovery.py
      - name: Require POSIX fork inheritance protection
        if: runner.os == 'Linux'
        run: python scripts/ci_check.py tests/operations/posix_fork_case.py
