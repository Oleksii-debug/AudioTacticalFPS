name: CARR observed Windows concurrency regressions
on:
  push:
    branches: ['carr/regression-preflight-*']
    paths: ['carr-library/**', '.github/workflows/carr-regression-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-regression-preflight-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: Windows / native resource ownership and idle renewal
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Record source identity and prepare the unchanged pinned runtime
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory 'regression-preflight-results' -ErrorAction Stop | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Unexpected source commit.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source tree.' }
          $paths = @('scripts/ci_check.py', 'src/carr_library/operations/_locks.py', 'src/carr_library/audio/model_manifest.py', 'tests/operations/test_resources.py', 'tests/security/test_idle_renewal.py', 'tests/audio/test_model_manifest.py')
          $files = @{}
          foreach ($path in $paths) {
            $files[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{
            schema = 1; source_commit = $head; source_tree = $tree
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            source_sha256 = $files
            qualification = 'Targeted Windows source regressions only; full integrated and installed gates remain separate.'
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'regression-preflight-results/source.json'
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the candidate.' }
          $environment = Join-Path $env:RUNNER_TEMP ("carr-regression-preflight-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $environment) { throw 'A fresh environment is required.' }
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          & $python -I -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-integrated-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip install --only-binary=:all: pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B -c "import importlib.metadata as m,json,pathlib,re; pins=dict(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s]+)',pathlib.Path('packaging/windows-integrated-cp311.lock').read_text(),re.M)); actual={n:m.version(n) for n in pins}; assert len(pins)==56 and actual==pins; print(json.dumps(actual,sort_keys=True))" | Tee-Object 'regression-preflight-results/runtime-pins.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARR_PREFLIGHT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute native ownership, trust renewal and strict local-path regressions
        timeout-minutes: 12
        run: |
          & $env:CARR_PREFLIGHT_PYTHON -I -B -X utf8 scripts/ci_check.py --jobs 1 tests/operations/test_resources.py tests/security/test_idle_renewal.py tests/audio/test_model_manifest.py 2>&1 | Tee-Object 'regression-preflight-results/source.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact source and failing or passing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carr-regression-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            carr-library/regression-preflight-results/*.json
            carr-library/regression-preflight-results/*.txt
          if-no-files-found: error
          retention-days: 30
