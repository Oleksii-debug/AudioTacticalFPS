name: CARR bibliography and import acceptance

on:
  pull_request:
    branches: [carr-library]
    paths:
      - carr-library/**
      - .github/workflows/carr-bibliography.yml
  push:
    branches: [carr-library, 'carr/v3-academic-interchange-*', carr/unified-publication-24-20261127]
    paths:
      - carr-library/**
      - .github/workflows/carr-bibliography.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carr-bibliography-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-bibliography:
    name: Windows x64 / CPython 3.11 / installed bibliography
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve the exact committed source bytes
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up native x64 CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build, verify and install the actual application wheel
        run: |
          $environment = Join-Path $env:RUNNER_TEMP 'carr-bibliography-python'
          $wheelDirectory = Join-Path $env:RUNNER_TEMP 'carr-bibliography-wheel'
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $environment 'Scripts/python.exe'
          "CARR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force 'ci-bibliography-results' | Out-Null
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceCommit -cne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checkout does not match the exact event head.' }
          $sourceCommit | Set-Content 'ci-bibliography-results/tested-commit.txt'
          & $python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --only-binary=:all: pytest==9.0.2 reportlab==4.4.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip wheel --no-deps --wheel-dir $wheelDirectory .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $wheelDirectory -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Exactly one application wheel is required.' }
          $verify = @'
          import json, runpy, sys
          from pathlib import Path
          verify = runpy.run_path('packaging/source_wheel.py')['verify_application_wheel']
          evidence = verify(Path(sys.argv[1]), Path.cwd().parent, sys.argv[2])
          print(json.dumps(evidence, sort_keys=True))
          '@
          & $python -I -c $verify $wheels[0].FullName $sourceCommit | Tee-Object 'ci-bibliography-results/wheel-source-proof.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip list --format=json | Set-Content 'ci-bibliography-results/installed-packages.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -c "import json,platform,sqlite3,struct,sys,wx; assert sys.platform=='win32' and struct.calcsize('P')==8 and sys.version_info[:2]==(3,11); print(json.dumps(dict(python=sys.version,windows=platform.platform(),sqlite=sqlite3.sqlite_version,wx=wx.version())))" | Tee-Object 'ci-bibliography-results/native-runtime.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installed native BibTeX and citation controls
        timeout-minutes: 3
        run: |
          & $env:CARR_PYTHON -I -B scripts/windows_citation_styles_smoke.py 2>&1 | Tee-Object 'ci-bibliography-results/native-citation-styles.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run strict bibliography, replay and export acceptance
        timeout-minutes: 18
        run: |
          $suites = @(
            'tests/research/test_bibtex_import.py',
            'tests/research/test_academic_library.py',
            'tests/research/test_csl_author_boundaries.py',
            'tests/citations/test_csl.py',
            'tests/citations/test_custom_csl.py',
            'tests/citations/test_bibliography_workbench.py',
            'tests/citations/test_custom_workbench.py',
            'tests/ui/test_citation_styles_jobs.py',
            'tests/ui/test_academic_library_dialog.py',
            'tests/ui/test_academic_actions.py',
            'tests/ui/test_academic_export_handler.py',
            'tests/catalog/test_bibliography.py',
            'tests/catalog/test_reference_exchange.py',
            'tests/ingest/test_import_replay_identity.py',
            'tests/ingest/test_txt_replay_registration.py',
            'tests/reader/test_export_no_clobber.py',
            'tests/reader/test_file_export.py',
            'tests/reader/test_binary_file_export.py',
            'tests/reader/test_academic_documents.py',
            'tests/reader/test_bibliographic_locators.py',
            'tests/reader/test_evidence_export.py',
            'tests/storage/test_academic_migration.py',
            'tests/e2e/test_academic_workflow.py',
            'tests/e2e/test_academic_workflows.py',
            'tests/e2e/test_academic_document_export.py',
            'tests/e2e/test_export_destination.py'
          )
          & $env:CARR_PYTHON scripts/ci_check.py --jobs 3 @suites 2>&1 | Tee-Object 'ci-bibliography-results/strict-acceptance.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain text acceptance evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bibliography-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: carr-library/ci-bibliography-results/
          if-no-files-found: error
          retention-days: 7
