name: CARR ASR native close diagnostic

on:
  push:
    branches:
      - carr/asr-native-diagnostic-20261127

permissions:
  contents: read

jobs:
  exact-native-component:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      CARR_TEST_COMMIT: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install the same source package and pinned native desktop prerequisites
        run: |
          if ((git rev-parse HEAD) -ne $env:CARR_TEST_COMMIT) { throw 'Unexpected source commit.' }
          python -m pip install '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require fresh-profile and exact mixed-source label regressions
        run: |
          python scripts/ci_check.py --jobs 1 tests/transcription/test_profile_controls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the unchanged native workflow and observe the actual close outcome
        run: |
          python -I -B -X utf8 scripts/windows_transcription_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -X utf8 scripts/windows_incremental_backup_smoke.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
