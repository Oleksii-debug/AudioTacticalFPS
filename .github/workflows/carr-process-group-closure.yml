name: Owned process-group closure

on:
  push:
    branches: [carr/process-group-closure-20261127]
    paths:
      - carr-library/src/carr_library/operations/process.py
      - carr-library/tests/operations/test_linux_process_group.py
      - .github/workflows/carr-process-group-closure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install required fixture dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.4 pypdf==7.1.1 python-docx==1.2.0 defusedxml==0.7.1 Pillow==13.0.0
      - name: Require real descendant shutdown and existing cancellation/startup contracts
        run: |
          python scripts/ci_check.py tests/operations/test_linux_process_group.py tests/operations/test_worker_start_cleanup.py tests/operations/test_resources.py tests/transcription/test_service.py tests/transcription/test_verified_runtime_recovery.py

  windows-existing-boundary:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install required fixture dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.4
      - name: Require existing direct-process startup and resource contracts
        run: |
          python scripts/ci_check.py tests/operations/test_worker_start_cleanup.py tests/operations/test_resources.py
