name: Local translation approval, receipts, loopback and native controls
on:
  push:
    branches: [carr/local-translation-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-local-translation-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-translation-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    name: Local translation and current remote/source compatibility / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact source and declared tests
        run: python -m pip install ".[test,sync]"
      - name: Install native Windows controls
        if: runner.os == 'Windows'
        run: python -m pip install wxPython==4.2.4
      - name: Compile package and shipped scripts without writing cache files
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [p for directory in ("src", "scripts", "packaging") for p in Path(directory).rglob("*.py")]
          for path in files:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Compiled", len(files), "package and shipped script files.")
          PY
      - name: Prepare exact source and installed acceptance harness
        run: |
          mkdir -p ci-local-translation
          cat > ci-local-translation/check.py <<'PY'
          from hashlib import sha256
          import importlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          
          mode = sys.argv[1]
          assert mode in ("source", "installed"), mode
          assert bool(sys.flags.isolated) == (mode == "installed"), mode
          assert not os.environ.get("PYTHONPATH"), "Do not repair ordinary child imports with PYTHONPATH."
          root = Path.cwd().resolve()
          source = (root / "src" / "carr_library").resolve()
          installed = (Path(sysconfig.get_path("purelib")) / "carr_library").resolve()
          assert source != installed and not installed.is_relative_to(root / "src")
          selected = source if mode == "source" else installed
          artifacts = root / "ci-local-translation"
          part = sys.argv[2]
          assert part in ("common", "loopback"), part
          suites = ["tests/assistant/test_providers.py","tests/assistant/test_translation.py","tests/assistant/test_translation_v3.py","tests/assistant/test_translation_batch.py","tests/assistant/test_translation_batch_cli.py","tests/assistant/test_translation_batch_sources.py","tests/assistant/test_translation_batch_ui.py","tests/storage/test_backup_translation.py","tests/storage/test_translation_batches_backup.py","tests/ui/test_translation_lifetime.py","tests/ui/test_translation_selection.py","tests/assistant/test_translation_local.py","tests/assistant/test_translation_local_ui.py"] if part == "common" else ["tests/assistant/test_translation_local_loopback.py"]
          identity = mode + "-" + part

          names = ["carr_library.assistant.providers","carr_library.assistant.profiles","carr_library.assistant.translation_local","carr_library.assistant.translation","carr_library.assistant.translation_source","carr_library.assistant.translation_batch","carr_library.assistant.translation_cli","carr_library.assistant.translation_batch_cli","carr_library.ui.translation_dialog","carr_library.ui.translation_batch_dialog","carr_library.ui.assistant_dialog","carr_library.backup_producers"]
          
          def package_inventory(directory):
              assert directory.is_dir() and not directory.is_symlink(), str(directory)
              result = {}
              for path in sorted(directory.rglob("*.py")):
                  assert path.is_file() and not path.is_symlink(), str(path)
                  result[path.relative_to(directory).as_posix()] = sha256(path.read_bytes()).hexdigest()
              assert result and "__init__.py" in result, str(directory)
              return result
          
          expected = package_inventory(source)
          assert package_inventory(installed) == expected, "Installed Python file set/content differs from checkout."
          inventory_digest = sha256(json.dumps(expected, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (artifacts / (identity + "-package-inventory.json")).write_text(
              json.dumps({"source": str(source), "installed": str(installed), "sha256": inventory_digest,
                          "files": expected}, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          def origins():
              package = importlib.import_module("carr_library")
              actual_package = Path(package.__file__).resolve()
              assert actual_package == selected / "__init__.py", (mode, str(actual_package), str(selected))
              result = {}
              for name in names:
                  spec = importlib.util.find_spec(name)
                  assert spec is not None and spec.origin, name
                  actual = Path(spec.origin).resolve()
                  relative = Path(*name.split(".")[1:]).with_suffix(".py")
                  assert actual == selected / relative, (name, str(actual), str(selected / relative))
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == expected[relative.as_posix()], name
                  result[name] = {"path": str(actual), "sha256": digest}
              return result
          
          class Proof:
              before = None
              collected = None
              expected_failure_reports = None
          
              def pytest_sessionstart(self, session):
                  self.before = origins()
                  self.expected_failure_reports = []
          
              def pytest_collectreport(self, report):
                  if report.failed:
                      print(report.longrepr, flush=True)

              def pytest_collection_finish(self, session):
                  self.collected = {suite: 0 for suite in suites}
                  for item in session.items:
                      selector = item.nodeid.split("::", 1)[0].replace("\\", "/")
                      assert selector in self.collected, selector
                      self.collected[selector] += 1
                  assert all(self.collected.values()), self.collected
          
              def pytest_runtest_logreport(self, report):
                  if hasattr(report, "wasxfail"):
                      self.expected_failure_reports.append(report.nodeid)
          
          proof = Proof()
          # Source deliberately keeps pyproject's normal parent selection. Ordinary
          # child imports must choose their own installed/source origin without repair.
          options = ["-vv", "--durations=20", "-o", "addopts=", "-o", "xfail_strict=true",
                     "-o", "faulthandler_timeout=60"]
          if mode == "installed":
              options += ["-o", "pythonpath="]
          report = artifacts / (identity + ".xml")
          with tempfile.TemporaryDirectory(prefix="carr-local-translation-") as temporary:
              status = pytest.main([*options, "--junitxml", str(report), "--basetemp",
                                    str(Path(temporary) / "pytest"), *suites], plugins=[proof])
              cases = list(ET.parse(report).iter("testcase"))
              assert status == 0 and cases and proof.before is not None, (status, len(cases))
              assert proof.collected and all(proof.collected.values()), proof.collected
              assert not proof.expected_failure_reports, proof.expected_failure_reports
              assert all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                         for case in cases), "Every selected case must pass without a skip or expected failure."
              assert origins() == proof.before, "Selected module origin/content changed during acceptance."
              assert package_inventory(source) == expected, "Checkout Python inventory changed."
              assert package_inventory(installed) == expected, "Installed Python inventory changed."
              result = {"status": "PASS", "mode": mode, "part": part, "cases": len(cases),
                        "selected_suites": proof.collected, "package_python_files": len(expected),
                        "package_inventory_sha256": inventory_digest, "origins": proof.before,
                        "physical_microphone": "NOT_RUN", "physical_output": "NOT_RUN", "NVDA": "NOT_RUN"}
              (artifacts / (identity + "-identity.json")).write_text(
                  json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(result, sort_keys=True))
          PY
      - name: Require source local and current translation contracts
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-local-translation/check.py source common 2>&1 | tee ci-local-translation/source.txt
      - name: Require isolated installed local and current translation contracts
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-local-translation/check.py installed common 2>&1 | tee ci-local-translation/installed.txt
      - name: Require actual source loopback, CLI and cancellation
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 ci-local-translation/check.py source loopback 2>&1 | tee ci-local-translation/source-loopback.txt
      - name: Require actual isolated installed loopback, CLI and cancellation
        if: "!cancelled()"
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -I -B -X utf8 ci-local-translation/check.py installed loopback 2>&1 | tee ci-local-translation/installed-loopback.txt
      - name: Require native Windows local translation and document batch controls
        if: "runner.os == 'Windows' && !cancelled()"
        timeout-minutes: 8
        run: |
          unset PYTHONPATH PYTEST_ADDOPTS PYTEST_PLUGINS
          python -B -X utf8 scripts/windows_translation_local_smoke.py 2>&1 | tee ci-local-translation/native-source.txt
          python -I -B -X utf8 scripts/windows_translation_local_smoke.py --installed 2>&1 | tee ci-local-translation/native-installed.txt
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-local-translation
          git rev-parse HEAD > ci-local-translation/commit.txt
          git rev-parse HEAD^{tree} > ci-local-translation/tree.txt
          python -m pip freeze > ci-local-translation/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: local-translation-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-local-translation
          if-no-files-found: error
