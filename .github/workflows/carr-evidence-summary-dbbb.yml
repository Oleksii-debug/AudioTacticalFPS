name: CARR bounded prior failure evidence
on:
  push:
    branches: [carr/evidence-summary-dbbb-20261127]
    paths: ['.github/workflows/carr-evidence-summary-dbbb.yml', '.github/scripts/carr_evidence_summary_dbbb.py']
permissions:
  contents: read
  actions: read
jobs:
  summarize-existing-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and summarize immutable prior failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/carr_evidence_summary_dbbb.py
