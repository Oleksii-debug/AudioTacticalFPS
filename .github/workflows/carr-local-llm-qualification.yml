name: CARR actual local LLM CPU qualification
on:
  push:
    branches: [work/local-llm-cpu-proof-20261127-a49c]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carr-local-llm-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-local-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the existing source-test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.4 pypdf==7.1.1 python-docx==1.2.0 defusedxml==0.7.1 Pillow==13.0.0
          python -m pip check
      - name: Preserve the current gateway and permission controls
        run: |
          set -euo pipefail
          python -m py_compile scripts/local_llm_qualification.py
          python scripts/ci_check.py tests/assistant/test_local_llm.py
      - name: Run actual pinned local inference and validate proposals
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python scripts/local_llm_qualification.py --root "$RUNNER_TEMP/carr-llm-proof"
      - name: Retain only synthetic evidence and byte identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-llm-synthetic-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/carr-llm-proof/qualification-report.json
            ${{ runner.temp }}/carr-llm-proof/asset-identities.json
          if-no-files-found: warn
          retention-days: 7
