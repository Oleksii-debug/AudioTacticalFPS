name: Configured signed updater source and installed contracts

on:
  push:
    branches: ['carr/ci-configured-updater-*']
    paths: ['carr-library/**', '.github/workflows/carr-configured-update.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-update-linux:
    name: Configured updater77 source and77 installed on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: carr-configured-update-linux-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        timeout-minutes: 5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify exact updater source and acquire existing hashed test inputs
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact configured updater source head differs.' }
          $verify = @'
          from hashlib import sha1
          import importlib.util, pathlib, sys, os
          pins = {"scripts/ci_configured_update_contracts.py":"24d4bdb71b25597faffed9e5979c58ef7cc263ff","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-sync-cp311.lock":"cd9c18a24d7a7ac203d81cf6a8d82d8bcb8f8ab3","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959"}
          for name, expected in pins.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, name
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          path = pathlib.Path('scripts/ci_configured_update_contracts.py').resolve()
          spec = importlib.util.spec_from_file_location('configured_update_ci_preflight', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.sources()
          for name in ('INSTALLED_CHILD',):
              compile(getattr(module, name), '<configured-update-'+name+'>', 'exec')
          assert len(module.SUITES) == 4 and sum(module.SUITES.values()) == 77
          assert len(module.PINS) == 53
          assert len(module.MODULES) == len(set(module.MODULES)) == (32 if os.name == 'nt' else 31)
          print('Exact configured updater source and embedded Python compile checks passed.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'configured updater source/policy preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-configured-update' -ErrorAction Stop | Out-Null
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/linux-sync-core-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned configured updater dependencies failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'configured updater dependency closure is inconsistent.' }

      - name: Require77 source and77 isolated installed whole cases
        # Reserve 40 minutes for acquisition, setup and retained cleanup evidence.
        # Individual whole-suite deadlines remain unchanged.
        timeout-minutes: 80
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & python -I -B -X utf8 scripts/ci_configured_update_contracts.py --evidence ci-configured-update/contracts --expected-head $env:EXPECTED_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'All77 source and77 isolated installed whole cases are required.' }
      - name: Admit only bounded diagnostic text and JSON evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat, xml.etree.ElementTree as ET
          root = pathlib.Path('ci-configured-update')
          assert root.is_dir() and not root.is_symlink(), 'No actual configured updater evidence exists.'
          allowed = {'firewall.json','firewall-cleanup.json'}
          contract = set(["identity-before.json","source-contracts.txt","source-summary.json","wheel-build.txt","source-wheel-proof.json","wheel-install.txt","installed-pip-check.txt","contracts-summary.json"])
          contract.update(f'installed-{number}{suffix}' for number in range(1,5)
                          for suffix in ('.xml','-origins.json','.txt'))
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 64*1024*1024, 'Evidence exceeds the finite total bound.'
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
              elif path.suffix == '.xml':
                  ET.fromstring(raw)
          print('Closed, bounded text/JSON/XML configured updater evidence only; binaries, corpora and runtimes excluded.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'configured updater evidence inventory is invalid.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: configured-update-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-configured-update/
          if-no-files-found: error

  configured-update-windows:
    name: Configured updater77 source and77 installed on Windows
    runs-on: windows-2022
    timeout-minutes: 120
    concurrency:
      group: carr-configured-update-contracts-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        timeout-minutes: 5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify source and acquire the existing hashed test inputs
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact configured updater source head differs.' }
          $verify = @'
          from hashlib import sha1
          import importlib.util, pathlib, sys, os
          pins = {"scripts/ci_configured_update_contracts.py":"24d4bdb71b25597faffed9e5979c58ef7cc263ff","packaging/windows-cp311.lock":"8dad99c0ea80470b7253873aee78e08857affec6","packaging/windows-sync-cp311.lock":"cd9c18a24d7a7ac203d81cf6a8d82d8bcb8f8ab3","packaging/trusted-client.lock":"6c4b48ac09572dc259d62d0d801057ab47c04583","packaging/windows-sync-test-cp311.lock":"e3f6eda5976e867abe7267c04e0b867b1fd16f7a","packaging/linux-sync-core-cp311.lock":"08f945066be748972a10d5b0ce46480fff722959"}
          for name, expected in pins.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == expected, name
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          path = pathlib.Path('scripts/ci_configured_update_contracts.py').resolve()
          spec = importlib.util.spec_from_file_location('configured_update_ci_preflight', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.sources()
          for name in ('INSTALLED_CHILD',):
              compile(getattr(module, name), '<configured-update-'+name+'>', 'exec')
          assert len(module.SUITES) == 4 and sum(module.SUITES.values()) == 77
          assert len(module.PINS) == 53
          assert len(module.MODULES) == len(set(module.MODULES)) == (32 if os.name == 'nt' else 31)
          print('Exact configured updater source and embedded Python compile checks passed.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'configured updater source/policy preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-configured-update' -ErrorAction Stop | Out-Null
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned configured updater dependencies failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'configured updater dependency closure is inconsistent.' }

      - name: Require77 source and77 isolated installed whole cases
        # Reserve 40 minutes for acquisition, setup and retained cleanup evidence.
        # Individual whole-suite deadlines remain unchanged.
        timeout-minutes: 80
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = (Get-Command python -ErrorAction Stop).Source
          $pythonPrograms = @(& $python -I -B -c "import pathlib,sys; p=pathlib.Path(sys.executable).resolve(); b=pathlib.Path(getattr(sys,'_base_executable',sys.executable)).resolve(); print(p); print(b); print(p.with_name('pythonw.exe')); print(b.with_name('pythonw.exe'))")
          if ($LASTEXITCODE -ne 0) { throw 'Exact interpreter inventory failed.' }
          $programs = @($pythonPrograms | ForEach-Object { [IO.Path]::GetFullPath($_) } | Sort-Object -Unique)
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw ('Required offline executable is missing: ' + $program) }
            if (((Get-Item -LiteralPath $program -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw ('Offline executable is a reparse point: ' + $program) }
          }
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          if ($profilesBefore.Count -ne 3) { throw 'All three firewall profile states must be captured.' }
          $rules = [System.Collections.Generic.List[string]]::new()
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            $active = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
            if ($active.Count -ne 3 -or @($active | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Every firewall profile must be active before actual configured updater work.' }
            foreach ($program in $programs) {
              $name = 'CARR-configured-update-' + [guid]::NewGuid().ToString('N')
              $rules.Add($name)
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
              $rule = Get-NetFirewallRule -Name $name -ErrorAction Stop
              $filter = @($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop)
              if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or $filter.Count -ne 1 -or [IO.Path]::GetFullPath($filter[0].Program) -ne [IO.Path]::GetFullPath($program)) { throw 'Exact-program outbound rule was not admitted.' }
            }
            @{ status='ACTIVE'; programs=$programs; rules=$rules.ToArray(); profiles=$active; direction='Outbound'; action='Block'; qualification='All acquisition finished before these rules' } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-configured-update/firewall.json'
            & $python -I -B scripts/ci_configured_update_contracts.py --evidence ci-configured-update/contracts --expected-head $env:EXPECTED_SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Required configured updater source or installed acceptance failed.' }
          } finally {
            $cleanupFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $rules) {
              try { Remove-NetFirewallRule -Name $name -ErrorAction Stop } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            foreach ($profile in $profilesBefore) {
              try {
                Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop
                $restored = Get-NetFirewallProfile -Name $profile.Name -ErrorAction Stop
                if ($restored.Enabled -ne $profile.Enabled) { throw ('Profile state was not restored: ' + $profile.Name) }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            @{ status=$(if ($cleanupFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); original_profiles=$profilesBefore; removed_rules=$rules.ToArray(); errors=$cleanupFailures.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-configured-update/firewall-cleanup.json'
            if ($cleanupFailures.Count -ne 0) { throw ('Owned configured updater firewall cleanup failed: ' + ($cleanupFailures -join '; ')) }
          }
      - name: Admit only bounded diagnostic text and JSON evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat, xml.etree.ElementTree as ET
          root = pathlib.Path('ci-configured-update')
          assert root.is_dir() and not root.is_symlink(), 'No actual configured updater evidence exists.'
          allowed = {'firewall.json','firewall-cleanup.json'}
          contract = set(["identity-before.json","source-contracts.txt","source-summary.json","wheel-build.txt","source-wheel-proof.json","wheel-install.txt","installed-pip-check.txt","contracts-summary.json"])
          contract.update(f'installed-{number}{suffix}' for number in range(1,5)
                          for suffix in ('.xml','-origins.json','.txt'))
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 64*1024*1024, 'Evidence exceeds the finite total bound.'
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
              elif path.suffix == '.xml':
                  ET.fromstring(raw)
          print('Closed, bounded text/JSON/XML configured updater evidence only; binaries, corpora and runtimes excluded.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'configured updater evidence inventory is invalid.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 3
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: configured-update-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-configured-update/
          if-no-files-found: error


  update-https-windows:
    name: Updater HTTPS15 source and15 installed on Windows
    runs-on: windows-2022
    timeout-minutes: 75
    concurrency:
      group: carr-update-https-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: carr-library
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify exact sources before acquiring the existing hashed closure
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE_SHA) { throw 'Exact updater TLS source differs.' }
          $verify = @'
          from hashlib import sha1
          import importlib.util, pathlib, sys
          path = pathlib.Path('scripts/ci_update_https_contracts.py').resolve()
          assert path.is_file() and not path.is_symlink()
          raw = path.read_bytes()
          assert sha1(b'blob '+str(len(raw)).encode('ascii')+b'\0'+raw).hexdigest() == '8e7c117ae4c8a2fabba46ef8c99eae09f25f40de'
          compile(raw, str(path), 'exec')
          spec = importlib.util.spec_from_file_location('updater_https_preflight', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert len(module.sources()) == 29
          for name in ('INSTALLED_CHILD', 'SOURCE_CHILD'):
              compile(getattr(module, name), '<updater-tls-'+name+'>', 'exec')
          assert len(module.SUITES) == 1 and sum(module.SUITES.values()) == 15
          assert len(module.MODULES) == len(set(module.MODULES)) == 20
          print('Exact selected updater source and existing installed-child policies verified.')
          '@
          $verify | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Updater TLS source or policy preflight failed.' }
          New-Item -ItemType Directory -Path 'ci-update-https' -ErrorAction Stop | Out-Null
          & python -B -m pip install --only-binary=:all: --require-hashes -r packaging/windows-cp311.lock -r packaging/windows-sync-cp311.lock -r packaging/trusted-client.lock -r packaging/windows-sync-test-cp311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Existing pinned updater TLS dependencies failed.' }
          & python -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'The installed dependency closure is inconsistent.' }
      - name: Require15 real TLS source and15 installed cases inside verified loopback firewall
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $inventory = @(& $python -I -B -c "import pathlib,sys; p=pathlib.Path(sys.executable).resolve(); b=pathlib.Path(getattr(sys,'_base_executable',sys.executable)).resolve(); print(p); print(b); print(p.with_name('pythonw.exe')); print(b.with_name('pythonw.exe'))")
          if ($LASTEXITCODE -ne 0) { throw 'Exact interpreter inventory failed.' }
          $programs = @($inventory | ForEach-Object { [IO.Path]::GetFullPath($_) } | Sort-Object -Unique)
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw ('Required interpreter is missing: ' + $program) }
            if (((Get-Item -LiteralPath $program -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw ('Interpreter is a reparse point: ' + $program) }
          }
          $remoteRanges = @('0.0.0.1-126.255.255.255', '128.0.0.0-255.255.255.255',
            '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          function Normalize-RemoteRanges($Ranges) {
            @($Ranges | ForEach-Object {
              $ends = $_ -split '-', 2
              if ($ends.Count -ne 2) { throw 'Unexpected firewall remote-address representation.' }
              ([System.Net.IPAddress]::Parse($ends[0])).ToString() + '-' + ([System.Net.IPAddress]::Parse($ends[1])).ToString()
            } | Sort-Object)
          }
          $expectedRanges = @(Normalize-RemoteRanges $remoteRanges)
          $rules = [System.Collections.Generic.List[string]]::new()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          if ($profilesBefore.Count -ne 3) { throw 'All three original firewall states are required.' }
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $name = 'CARR-remote-stt-' + [guid]::NewGuid().ToString('N')
              $rules.Add($name)
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress $remoteRanges -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if ($profiles.Count -ne 3 -or @($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'All actual firewall profiles must be active.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $rules.ToArray() -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Updater TLS external-address rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Rules do not cover both selected/base Python and pythonw.' }
            foreach ($rule in $active) {
              $actualRanges = @(Normalize-RemoteRanges @(($rule | Get-NetFirewallAddressFilter -ErrorAction Stop).RemoteAddress))
              if (@(Compare-Object $expectedRanges $actualRanges).Count -ne 0) { throw 'The loopback boundary differs from the reviewed external-address ranges.' }
            }
            @{ status='PASS'; blocked_programs=$filters; blocked_remote_ranges=$expectedRanges; allowed_test_peer='127.0.0.1'; scope='selected and base interpreters; external egress blocked; only synthetic local TLS is used'; profiles=$profilesBefore } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-update-https/firewall.json'
            & $python -I -B -X utf8 scripts/ci_update_https_contracts.py --evidence ci-update-https/contracts --expected-head $env:EXPECTED_SOURCE_SHA --firewall-receipt ci-update-https/firewall.json
            if ($LASTEXITCODE -ne 0) { throw 'Required15 source and15 installed actual TLS acceptance failed.' }
          } finally {
            $cleanupFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $rules) {
              try {
                Remove-NetFirewallRule -Name $name -ErrorAction Stop
                if (@(Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue).Count -ne 0) { throw ('Owned rule survived removal: ' + $name) }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            foreach ($profile in $profilesBefore) {
              try {
                Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop
                $restored = Get-NetFirewallProfile -Name $profile.Name -ErrorAction Stop
                if ($restored.Enabled -ne $profile.Enabled) { throw ('Profile state was not restored: ' + $profile.Name) }
              } catch { $cleanupFailures.Add($_.Exception.Message) }
            }
            @{ status=$(if ($cleanupFailures.Count -eq 0) { 'PASS' } else { 'FAIL' }); original_profiles=$profilesBefore; removed_rules=$rules.ToArray(); errors=$cleanupFailures.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'ci-update-https/firewall-cleanup.json'
            if ($cleanupFailures.Count -ne 0) { throw ('Owned updater TLS firewall cleanup failed: ' + ($cleanupFailures -join '; ')) }
          }
      - name: Admit only bounded updater TLS diagnostic evidence
        id: evidence_contract
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $validate = @'
          import json, pathlib, stat, xml.etree.ElementTree as ET
          root = pathlib.Path('ci-update-https')
          assert root.is_dir() and not root.is_symlink(), 'No actual updater TLS evidence exists.'
          allowed = {'firewall.json', 'firewall-cleanup.json'}
          contract = {
              'identity-before.json','source-contracts.txt','source-summary.json',
              'source.xml','source-origins.json','wheel-build.txt','source-wheel-proof.json',
              'wheel-install.txt','installed-pip-check.txt','contracts-summary.json',
              'installed-1.xml','installed-1-origins.json','installed-1.txt'}
          allowed.update('contracts/'+name for name in contract)
          files = list(root.rglob('*'))
          assert files and len(files) <= len(allowed)+1
          total = 0
          for path in files:
              info = path.lstat()
              assert not path.is_symlink() and not getattr(info,'st_file_attributes',0) & 1024
              if stat.S_ISDIR(info.st_mode):
                  assert path.relative_to(root).as_posix() == 'contracts'
                  continue
              name = path.relative_to(root).as_posix()
              assert name in allowed and stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              assert info.st_size <= 8*1024*1024, name
              total += info.st_size
              assert total <= 64*1024*1024, 'Evidence exceeds its aggregate bound.'
              raw = path.read_bytes()
              assert b'\0' not in raw, name
              if path.suffix == '.json':
                  json.loads(raw.decode('utf-8-sig'))
              elif path.suffix == '.xml':
                  ET.fromstring(raw)
          print('Closed bounded text/JSON/XML evidence; no originals, credentials, model or application/runtime archives.')
          '@
          $validate | & python -I -B -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Updater TLS evidence inventory is invalid.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.evidence_contract.outcome == 'success' }}
        with:
          name: update-https-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: carr-library/ci-update-https/
          if-no-files-found: error
