name: Verified ASR protocol contracts

on:
  push:
    branches: [carr/verified-asr-protocol-20261127]
    paths:
      - carr-library/src/carr_library/transcription/**
      - carr-library/tests/transcription/**
      - .github/workflows/carr-verified-asr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Synthetic protocol / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: carr-library
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install only protocol test dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==9.0.2 filelock==3.29.0 platformdirs==4.10.0 packaging==26.0
      - name: Require actual subprocess and strict file-contract tests
        run: python scripts/ci_check.py tests/transcription/test_verified_protocol.py tests/transcription/test_verified_runtime.py tests/transcription/test_service.py tests/transcription/test_runtime_admission.py tests/operations/test_resources.py
