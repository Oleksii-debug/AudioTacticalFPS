name: Current-source assistant and owned audio conversion review
on:
  push:
    branches: [carr/assistant-tools-review-20261127]
    paths: ['carr-library/**', '.github/workflows/carr-assistant-tools-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assistant-tools-review-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: carr-library
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the exact selected source
        id: source-runtime
        run: python -m pip install ".[test]"
      - name: Install actual Windows desktop
        id: desktop-runtime
        if: runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Prepare actual Linux test audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Prepare pinned Windows test audio
        id: audio-runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'carr-assistant-review-audio'
          python packaging/prepare_windows_audio.py --cache (Join-Path $env:RUNNER_TEMP 'carr-audio-cache') --output $audio --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $audio 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARR_ASSISTANT_REVIEW_AUDIO=$audio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require every source assistant and conversion boundary
        run: |
          mkdir -p ci-assistant-tools
          python scripts/ci_check.py --jobs 3 --diagnostics tests/assistant/test_local_tools.py tests/assistant/test_player_tools.py tests/audio/test_conversion_batch.py tests/assistant/test_local_assistant.py tests/assistant/test_local_planning.py tests/assistant/test_planning_handlers.py tests/assistant/test_supplied_transcription.py tests/assistant/test_backup_receipt.py tests/assistant/test_workflow_templates.py tests/assistant/test_workflow_templates_cli.py tests/audio/test_dsp.py tests/reader/test_live_reading.py tests/reader/test_live_player.py tests/ui/test_live_reading_controls.py tests/ui/test_keyboard_convergence.py tests/audio/test_process_scratch.py 2>&1 | tee ci-assistant-tools/source.txt
      - name: Require the same installed modules and actual subprocess cases
        if: "!cancelled()"
        run: |
          mkdir -p ci-assistant-tools
          python -I -B -X utf8 - <<'PY' 2>&1 | tee ci-assistant-tools/installed.txt
          from hashlib import sha256
          import importlib
          import json
          from pathlib import Path
          import socket
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import pytest
          root = Path.cwd()
          installed = Path(sysconfig.get_path('purelib')).resolve()
          names = ["carr_library.assistant.models","carr_library.assistant.service","carr_library.assistant.planner","carr_library.assistant.llm","carr_library.assistant.local_tools","carr_library.assistant.player_tools","carr_library.audio.conversion_batch","carr_library.audio.dsp","carr_library.audio.process","carr_library.audio.cleanup","carr_library.durable_state","carr_library.ui.assistant_dialog","carr_library.ui.live_reading","carr_library.ui.builtin_keyboard_commands","carr_library.transcription.service","carr_library.research.export_file","carr_library.reader.live_reading","carr_library.reader.live_player","carr_library.speech.runtime"]
          def inventory():
              result = {}
              for name in names:
                  module = importlib.import_module(name)
                  actual = Path(module.__file__).resolve()
                  expected = root / 'src' / Path(*name.split('.')).with_suffix('.py')
                  assert actual.is_relative_to(installed) and not actual.is_relative_to(root / 'src'), name
                  digest = sha256(actual.read_bytes()).hexdigest()
                  assert digest == sha256(expected.read_bytes()).hexdigest(), name
                  result[name] = {'path': str(actual), 'sha256': digest}
              return result
          before = inventory()
          def offline(*args, **kwargs):
              raise OSError('Network access is disabled in these synthetic assistant and conversion tests.')
          socket.socket.connect = socket.socket.connect_ex = socket.create_connection = offline
          suites = ["tests/assistant/test_local_tools.py","tests/assistant/test_player_tools.py","tests/audio/test_conversion_batch.py","tests/assistant/test_local_assistant.py","tests/assistant/test_local_planning.py","tests/assistant/test_planning_handlers.py","tests/assistant/test_supplied_transcription.py","tests/assistant/test_backup_receipt.py","tests/assistant/test_workflow_templates.py","tests/assistant/test_workflow_templates_cli.py","tests/audio/test_dsp.py","tests/reader/test_live_reading.py","tests/reader/test_live_player.py","tests/ui/test_live_reading_controls.py","tests/ui/test_keyboard_convergence.py","tests/audio/test_process_scratch.py"]
          with tempfile.TemporaryDirectory(prefix='carr-assistant-tools-') as temporary:
              report = Path(temporary) / 'junit.xml'
              status = pytest.main(['-q', '-o', 'pythonpath=', '-o', 'addopts=',
                  '-o', 'xfail_strict=true', '--junitxml', str(report),
                  '--basetemp', str(Path(temporary) / 'pytest'), *suites])
              cases = list(ET.parse(report).iter('testcase'))
              assert status == 0 and cases, status
              assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))
                         for case in cases), 'Every selected installed case must pass without a skip.'
              assert inventory() == before
              print(json.dumps({'status': 'PASS', 'installed_cases': len(cases), 'origins': before}))
          PY
      - name: Require actual current-reader Assistant handoff with egress blocked
        if: "!cancelled() && runner.os == 'Windows' && steps.source-runtime.outcome == 'success' && steps.desktop-runtime.outcome == 'success' && steps.audio-runtime.outcome == 'success'"
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          $basePython = (& $python -I -c "import sys; print(sys._base_executable)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFfmpeg = Join-Path $env:CARR_ASSISTANT_REVIEW_AUDIO 'bin/ffmpeg.exe'
          $testFfprobe = Join-Path $env:CARR_ASSISTANT_REVIEW_AUDIO 'bin/ffprobe.exe'
          @{ schema=1; status='PASS'; bundled=$false; runtime_root=$env:CARR_ASSISTANT_REVIEW_AUDIO;
             ffmpeg=@{ path=$testFfmpeg; sha256=(Get-FileHash -LiteralPath $testFfmpeg -Algorithm SHA256).Hash.ToLowerInvariant() };
             ffprobe=@{ path=$testFfprobe; sha256=(Get-FileHash -LiteralPath $testFfprobe -Algorithm SHA256).Hash.ToLowerInvariant() }
           } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'ci-assistant-tools/external-test-audio-binding.json'
          $programs = @($python, $basePython,
            (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'),
            (Join-Path $env:CARR_ASSISTANT_REVIEW_AUDIO 'bin/ffmpeg.exe'),
            (Join-Path $env:CARR_ASSISTANT_REVIEW_AUDIO 'bin/ffprobe.exe')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | ForEach-Object { [System.IO.Path]::GetFullPath($_) } | Sort-Object -Unique
          $rulePrefix = 'CARR-assistant-tools-offline-' + [guid]::NewGuid().ToString('N')
          $ruleNames = @()
          $profilesBefore = @(Get-NetFirewallProfile -ErrorAction Stop | Select-Object Name, Enabled)
          try {
            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -ErrorAction Stop
            foreach ($program in $programs) {
              $ruleName = $rulePrefix + '-' + $ruleNames.Count
              $ruleNames += $ruleName
              New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -Enabled True -ErrorAction Stop | Out-Null
            }
            $profiles = @(Get-NetFirewallProfile -ErrorAction Stop)
            if (@($profiles | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Offline native checks require enabled firewall profiles.' }
            $active = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleNames -ErrorAction Stop)
            if ($active.Count -ne $programs.Count -or @($active | Where-Object { $_.Enabled -ne 'True' -or $_.Direction -ne 'Outbound' -or $_.Action -ne 'Block' }).Count -ne 0) { throw 'Offline runtime rules are not active.' }
            $filters = @($active | Get-NetFirewallApplicationFilter -ErrorAction Stop | Select-Object -ExpandProperty Program | ForEach-Object { [System.IO.Path]::GetFullPath($_) })
            if (@(Compare-Object ($programs | Sort-Object) ($filters | Sort-Object)).Count -ne 0) { throw 'Offline rules do not cover the selected runtime programs.' }
            @{ status='PASS'; blocked_programs=$filters; scope='tested runtime executables, not a whole-machine network claim' } | ConvertTo-Json -Depth 4 | Set-Content 'ci-assistant-tools/runtime-firewall.json'
            $probes = @(
              @{ name='native-assistant-player'; script='scripts/windows_assistant_player_smoke.py'; arguments=@() }
            )
            $failures = @()
            foreach ($probe in $probes) {
              $scriptPath = $probe.script
              $probeArgs = @($probe.arguments)
              & $python -I -B -X utf8 -X faulthandler $scriptPath @probeArgs 2>&1 | Tee-Object ('ci-assistant-tools/' + $probe.name + '.txt')
              $probeExit = $LASTEXITCODE
              Write-Output ('Native probe exit: ' + $probe.name + ' = ' + $probeExit)
              if ($probeExit -ne 0) { $failures += $probe.name }
            }
            if ($failures.Count -ne 0) { throw ('Required native workflows failed: ' + ($failures -join ', ')) }
          } finally {
            foreach ($ruleName in $ruleNames) { Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue }
            foreach ($profile in $profilesBefore) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled -ErrorAction Stop }
          }
      - name: Preserve exact identity
        if: always()
        run: |
          mkdir -p ci-assistant-tools
          git rev-parse HEAD > ci-assistant-tools/commit.txt
          python -m pip freeze > ci-assistant-tools/packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: assistant-tools-${{ matrix.os }}-${{ github.sha }}
          path: carr-library/ci-assistant-tools
          if-no-files-found: error
